v>\n<h4>P11 马尼拉大帆船与白银太平洋（S3｜1565–1640s）<\/h4>\n<div class='tbl'><table><thead><tr><th>字段<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>地理焦点<\/td><td>太平洋回程航线（阿卡普尔科／马尼拉／月港／长崎）<\/td><\/tr><tr><td>经济冲击<\/td><td>美洲白银经马尼拉换明丝明瓷，单向洪流持续近两百年；明廷海禁与月港开关拉锯；大帆船单船载值可达百万银级，保险与私掠同时疯长<\/td><\/tr><tr><td>势力剧本<\/td><td>西班牙殖民官与教会争税；明商垄断丝货源头；日本朱印船与英荷后进者抢残羹<\/td><\/tr><tr><td>PL 侧写<\/td><td>回程线水手／私掠执照持有人／涧内双面商<\/td><\/tr><tr><td>人事尺度<\/td><td>大势：白银会一直流，直到美洲矿脉与明廷的钱袋一起出事。人事：一船丝绸是真沉了还是假沉了，赔的是几百家保单持有人。<\/td><\/tr><tr><td>纪推进钩子<\/td><td>全球第一条'跨太平洋班轮线'成型——固定航线意味着固定伏击点<\/td><\/tr><tr><td>深层锚（洋葱战役）<\/td><td>12.7 秘密④沉没舰队（没上账的白银总有一笔在浅滩）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>固定任务：<\/p>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>体量<\/th><th>报酬<\/th><th>标签<\/th><\/tr><\/thead><tbody><tr><td>Q11-01<\/td><td>回程线的敢死水手<\/td><td>短链<\/td><td>110 银<\/td><td>冒险·史诗<\/td><\/tr><tr><td>Q11-02<\/td><td>对大帆船的私掠诱惑<\/td><td>短链<\/td><td>590 银<\/td><td>战争·史诗<\/td><\/tr><tr><td>Q11-03<\/td><td>涧内的双面商<\/td><td>短链<\/td><td>53 银<\/td><td>商战·阴谋<\/td><\/tr><tr><td>Q11-04<\/td><td>'沉没'的丝绸<\/td><td>短链<\/td><td>98 银<\/td><td>阴谋·商战<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>P12 特许公司时代（S4｜1600–1623（EIC/VOC 立 charter 至安汶））<\/h4>\n<div class='tbl'><table><thead><tr><th>字段<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>地理焦点<\/td><td>香料群岛与印度海岸（安汶／万丹／班达／苏拉特）<\/td><\/tr><tr><td>经济冲击<\/td><td>股份制把战争开支摊进股本；公司自铸币自养军队自签条约；香料'销毁过剩库存'第一次成为商业策略<\/td><\/tr><tr><td>势力剧本<\/td><td>VOC 与 EIC 从合伙走向火并；本地苏丹在两司之间维持砝码；母国议会开始审查公司执照<\/td><\/tr><tr><td>PL 侧写<\/td><td>股东招募掮客／公司船押运／垄断暴行的证人<\/td><\/tr><tr><td>人事尺度<\/td><td>大势：公司会赢——它们比国家更能熬。人事：安汶刑房里那十个幸存证人的名字，是永远沉默还是见到法官，就在你们这条船上。<\/td><\/tr><tr><td>纪推进钩子<\/td><td>公司间的'法律外暴力'将成为 S5 各国立法管制特许权的引信<\/td><\/tr><tr><td>深层锚（洋葱战役）<\/td><td>12.7 秘密⑤第五势力（一张比 charter 更早的授权文书）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>固定任务：<\/p>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>体量<\/th><th>报酬<\/th><th>标签<\/th><\/tr><\/thead><tbody><tr><td>Q12-01<\/td><td>首航募股的'印度专家'<\/td><td>短链<\/td><td>45 银<\/td><td>商战·市井<\/td><\/tr><tr><td>Q12-02<\/td><td>安汶的证人<\/td><td>短链<\/td><td>580 银<\/td><td>阴谋·战争<\/td><\/tr><tr><td>Q12-03<\/td><td>布雷达的三张保单<\/td><td>单场<\/td><td>42 银<\/td><td>商战·阴谋<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>P13 三十年战争与波罗的海（S4｜1618–1648）<\/h4>\n<div class='tbl'><table><thead><tr><th>字段<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>地理焦点<\/td><td>波罗的海与北海（但泽／吕贝克／松德海峡／明斯特）<\/td><\/tr><tr><td>经济冲击<\/td><td>军粮与军需采购扭曲整个粮价带；松德税收入成为丹麦王室命脉；战争保险费按'交战区档'浮动（对接 09 分册城市事件字段）<\/td><\/tr><tr><td>势力剧本<\/td><td>瑞、丹、神圣罗马与汉萨在'关税与粮船'上开战；雇佣兵队长自建物流网络；和谈使节用商船递密件<\/td><\/tr><tr><td>PL 侧写<\/td><td>粮船投机商／海峡走私队／急件船<\/td><\/tr><tr><td>人事尺度<\/td><td>大势：1648 年威斯特伐利亚的墨水总会干。人事：那袋被战兵抢走又卖回市场的黑麦，养活的是哪一城的哪条街。<\/td><\/tr><tr><td>纪推进钩子<\/td><td>和约确立'主权国家'记账法——私掠执照从此需要更精细的文书（为 S5 私掠全盛埋种子）<\/td><\/tr><tr><td>深层锚（洋葱战役）<\/td><td>12.7 秘密④沉没舰队（战争账目里的那笔差额）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>固定任务：<\/p>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>体量<\/th><th>报酬<\/th><th>标签<\/th><\/tr><\/thead><tbody><tr><td>Q13-01<\/td><td>但泽的黑麦价<\/td><td>短链<\/td><td>53 银<\/td><td>商战·市井<\/td><\/tr><tr><td>Q13-02<\/td><td>松德海峡的绕税线<\/td><td>短链<\/td><td>128 银<\/td><td>商战·冒险<\/td><\/tr><tr><td>Q13-03<\/td><td>明斯特的急件<\/td><td>单场<\/td><td>42 银<\/td><td>阴谋·史诗<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>P14 海盗黄金时代（S5｜1690–1726）<\/h4>\n<div class='tbl'><table><thead><tr><th>字段<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>地理焦点<\/td><td>加勒比与北美海岸（拿骚／查尔斯顿／奥克拉科克／皇家港）<\/td><\/tr><tr><td>经济冲击<\/td><td>战时私掠体系解散后暴力供给过剩；海盗'黑市股份制'（分赃章程）与正规航运保险对着干；种植园糖与奴隶航运成为头号猎物（红线：制度呈现）<\/td><\/tr><tr><td>势力剧本<\/td><td>拿骚' Flying Gang '自成秩序；皇家海军清剿舰队南下；殖民地总督一手发赦免证一手发私掠证<\/td><\/tr><tr><td>PL 侧写<\/td><td>海盗账房／赦免船票的运送者／清剿线线人<\/td><\/tr><tr><td>人事尺度<\/td><td>大势：1726 前后绞架会清空甲板。人事：黑胡子最后一炮打响那晚，泊地里有几条船决定不参与，就有几船人活着回家。<\/td><\/tr><tr><td>纪推进钩子<\/td><td>海盗被剿灭的过程恰恰是帝国海关与常备舰队长成的过程——'秩序'是清剿的副产品<\/td><\/tr><tr><td>深层锚（洋葱战役）<\/td><td>12.7 秘密④沉没舰队（1715 年在浅滩上等人的珍宝船队）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>固定任务：<\/p>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>体量<\/th><th>报酬<\/th><th>标签<\/th><\/tr><\/thead><tbody><tr><td>Q14-01<\/td><td>拿骚的账房<\/td><td>短链<\/td><td>88 银<\/td><td>阴谋·市井<\/td><\/tr><tr><td>Q14-02<\/td><td>奥克拉科克的炮声<\/td><td>单场<\/td><td>95 银<\/td><td>战争·史诗<\/td><\/tr><tr><td>Q14-03<\/td><td>赦免船票<\/td><td>短链<\/td><td>53 银<\/td><td>人情·史诗<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>P15 王位继承战争与私掠全盛（S5｜1689–1714（奥格斯堡同盟至乌得勒支））<\/h4>\n<div class='tbl'><table><thead><tr><th>字段<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>地理焦点<\/td><td>海峡与北美殖民地海岸（敦刻尔克／布里斯托尔／波士顿／圣马洛）<\/td><\/tr><tr><td>经济冲击<\/td><td>私掠执照与股份单在交易所流通，'劫掠'第一次证券化；和约一签，几千职业私掠者瞬间失业——黄金时代海盗的供给侧由此而来<\/td><\/tr><tr><td>势力剧本<\/td><td>英法互相给对方海岸线'点名'；殖民地商人两头投资；保险公司拒绝承保无护航船<\/td><\/tr><tr><td>PL 侧写<\/td><td>私掠股单持有人／猎杀合同执行者／战后转业中介<\/td><\/tr><tr><td>人事尺度<\/td><td>大势：1713 和约签了，执照作废，谁也留不住。人事：一群只会海上讨生活的老私掠者，是转成领港员还是转成海盗，中间只差你们一句话。<\/td><\/tr><tr><td>纪推进钩子<\/td><td>纪末收束——私掠者失业潮直接把剧情摆渡进 P14 海盗黄金时代<\/td><\/tr><tr><td>深层锚（洋葱战役）<\/td><td>12.7 秘密⑤第五势力（'未被许可的战争'文书的终极舞台）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>固定任务：<\/p>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>体量<\/th><th>报酬<\/th><th>标签<\/th><\/tr><\/thead><tbody><tr><td>Q15-01<\/td><td>私掠股单的假票<\/td><td>短链<\/td><td>50 银<\/td><td>市井·商战<\/td><\/tr><tr><td>Q15-02<\/td><td>敦刻尔克的猎杀合同<\/td><td>短链<\/td><td>420 银<\/td><td>战争·商战<\/td><\/tr><tr><td>Q15-03<\/td><td>和约之后的失业潮<\/td><td>长线<\/td><td>240 银<\/td><td>人情·史诗<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>经济冲击按季末第⑦步改 prices 档；势力剧本与存留 NPC 入'世界一瞥'（10 分册 §10.5 存留池）；人事尺度=总则：PL 改变不了大历史，但能决定身边人死活。<\/blockquote>\n<h2>11.4 固定任务卡（六十张全量）<\/h2>\n<p>用法：每卡是一张可以直接撕给 GM 的规格单——六要素齐全，报酬已按 10 分册公式回代；三线索第一条<strong>不掷骰可得<\/strong>；短链以上自带节点图。GM 保留对卡面数值做 ±25% 交涉浮动的权力（10 分册 §10.4）。<\/p>\n<h3>11.5 固定任务卡 60 张（六要素＋三线索；首条线索不掷骰可得）<\/h3>\n<h4>Q01-01 疫城送信（短链｜危险｜82 银（公式 75））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：传闻表：码头都说威尼斯的检疫线又烧了一条船，有个文书肯出大价钱送'家书'进城<\/li><li><strong>委托人<\/strong>：检疫官署文书贝内代托（误差：他说只是普通家书——实际是疫账抄本，泄露城内真实死亡数，官方怕它动摇粮价）<\/li><li><strong>目标<\/strong>：三十日锁城期内，把信送到旧城区 receiver 手中，送信人本人不被扣检<\/li><li><strong>障碍<\/strong>：主要——检疫线封陆路水路，每条浮桥有善会执灯人查夜；船靠舷墙要过'熏烟礼'；隐藏——收信人已被隔离在疫岛，须找到他的书记学徒转交，而学徒正在躲债主<\/li><li><strong>代价<\/strong>：时间（绕线多耗一旬）＋钱财（打点灯费）＋声望（善会处记一笔'可疑'）<\/li><li><strong>回报<\/strong>：银＋声望（善会'守规矩'）＋关系（书记学徒）＋信息：城内疫账全文<\/li><li><strong>三线索<\/strong>：1 城南鱼市的灯费牌子上，三日内的灯费有人已替你们付清——付钱的就是接应人（场景：城南鱼市灯费牌；被毁后备用：向善会捐一笔香油钱换执灯人名单）〔不掷骰可得〕；2 receiver 的书记学徒每周三去犹太街当铺赎一件东西，雷打不动（场景：犹太街当铺；被毁后备用：贿赂疫岛渡船夫带口信）；3 贝内代托的疫账抄本缺了最后一页——缺页上有 receiver 的名字（场景：委托人书房；被毁后备用：比对检疫官署的公示档）<\/li><li><strong>节点图<\/strong>：双入口：接文书的钱、或替善会'顺路查一个可疑送信人'；环路：被扣检后可用善会关系保出来再走第二条线；双通路：智取（灯费牌）／交涉（说服学徒）<\/li><li><strong>标签<\/strong>：阴谋·市井·恐怖｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：书记学徒｜亏欠｜下季当转信人与疫账线人<\/li><li><strong>史实<\/strong>：1377 拉古萨首设三十日隔离（trentino），quarantena 制度之源<\/li><\/ul>\n<h4>Q01-02 逃匠护航（短链｜常规｜35 银（公式 25））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：委托板：一张压在酒杯下的字条——'染坊的，带家眷，给钱，急'<\/li><li><strong>委托人<\/strong>：染坊大师傅洛伦佐本人（误差：他说行会只要人回去，行会真正要的是他带走的茜草染色配方账本）<\/li><li><strong>目标<\/strong>：把一家四口连同两只木箱送出城，十日内交到佛罗伦萨对头工坊门房<\/li><li><strong>障碍<\/strong>：主要——城门缉拿告示与行会雇的四个打手；水路闸口查'出城货物'；隐藏——他妻子根本不想走——她娘家全在城里，闹起来全家都拦不住<\/li><li><strong>代价<\/strong>：关系（与染匠行会结仇，本城染价永不给好脸）＋钱财（路耗）<\/li><li><strong>回报<\/strong>：银＋关系（佛罗伦萨新工坊）＋信息：茜草配方（若你们看懂了账本）＋恶名风险（行会记仇）<\/li><li><strong>三线索<\/strong>：1 木箱底是账本不是衣裳——抬箱时压手，两箱重量差着一倍（场景：上船时的码头；被毁后备用：雇的挑夫随口抱怨箱子'装了石头'）〔不掷骰可得〕；2 行会打手头目腰牌上刻的不是行会徽记，是城防军序列（场景：城门缉拿时；被毁后备用：打手喝醉时自己炫耀）；3 妻子的嫁妆箱上贴着娘家船行的火漆——她哥哥就是闸口税吏（场景：船舱内；被毁后备用：税吏查验时反复摸那只箱子的锁）<\/li><li><strong>节点图<\/strong>：双入口：接私单、或被行会反雇'去把人追回来'；环路：被行会盯上后可改走妻子娘家的税吏线；双通路：交涉（说服妻子）／智取（调包箱子）<\/li><li><strong>标签<\/strong>：人情·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：洛伦佐夫妇｜亏欠｜佛罗伦萨工坊落脚点与染料折扣<\/li><li><strong>史实<\/strong>：1351 英格兰《劳工法令》锁工籍；意大利行会籍册与逃匠同构<\/li><\/ul>\n<h4>Q01-03 趁疫抄底的三方竞价（长线｜危险｜205 银（公式 240））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：旧识来信：临水仓房的绝户拍卖下月开槌，'你若肯来，我们分账'<\/li><li><strong>委托人<\/strong>：落魄公证人之子皮耶罗（他有文件，没现金）（误差：他说只有两个竞价者——市政拍卖官的小舅子其实是第三方安排的托）<\/li><li><strong>目标<\/strong>：帮委托人在槌价内压垮对手成交，并办完产权过户（12.1 登记口径）<\/li><li><strong>障碍<\/strong>：主要——小舅子背后是总领事，能调档案房卡你们的过户；竞价当天的'价牌'规矩不明；隐藏——仓房地契还有一个共有人没死——在修道院里做杂役，他签不签字才作数<\/li><li><strong>代价<\/strong>：钱财（保证金与抬价本钱）＋声望（站队总领事对立面）<\/li><li><strong>回报<\/strong>：银＋产权期权（总包，另议作价）＋信息：绝户档案全套＋关系（公证行）<\/li><li><strong>三线索<\/strong>：1 修道院杂役每月初一替'亡妻'点两支蜡烛——点两支的人不知道自己被登成死了（场景：修道院小堂；被毁后备用：查公证行的原始死亡登记）〔不掷骰可得〕；2 小舅子的价牌从来不出整数——他是按市政内部底价加两成抬（场景：拍卖场；被毁后备用：买通价牌记录员）；3 地契骑缝章缺半枚——另一半在共有人随身的圣牌背面（场景：档案房；被毁后备用：皮耶罗父亲留下的公证底档）<\/li><li><strong>节点图<\/strong>：双入口：皮耶罗的合伙邀请、或小舅子反向出价收买你们；环路：修道院共有人线失败后转攻档案房底档；双通路：商战（抬价打托）／律法（共有人主张）<\/li><li><strong>溢价/总包<\/strong>：总包含仓房产权期权——按 07 分册建筑'陋'档作价另付，现金部分仍在公式带内（公式基准 240 银）<\/li><li><strong>标签<\/strong>：阴谋·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：皮耶罗｜合伙｜仓房租金分红与公证行人脉<\/li><li><strong>史实<\/strong>：1348 后佛罗伦萨、威尼斯设绝户财产归档（accatti／procuratoria），抄底成风<\/li><\/ul>\n<h4>Q01-04 疫葬驳船的三倍工钱（单场｜危险｜40 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：港头布告：疫岛驳船夜工，一夜三倍，生死自认<\/li><li><strong>委托人<\/strong>：疫岛（Lazzaretto）管事修士（误差：他说'只是运货'——同船驳运的有活人（未确诊的疑似者），你们要知道了多半不肯）<\/li><li><strong>目标<\/strong>：一晚跑满三趟驳运，天亮前把船还回西码头<\/li><li><strong>障碍<\/strong>：主要——夜航无灯、潮口转向、疑似者随时在船上发作；隐藏——第二趟'货'里有个装死躲债的富商，他认得你们，半路要挟搭船逃走<\/li><li><strong>代价<\/strong>：接触风险（每次靠疫岛泊位掷疫检定）＋恶名（'疫船帮'名声黏上就甩不掉）<\/li><li><strong>回报<\/strong>：银（三倍工钱）＋恶名＋关系（修士——善会渠道自此对你们开门）<\/li><li><strong>三线索<\/strong>：1 富商的手上没有劳茧，靴子是绸面的——'货'里混着活人（场景：第二趟装载时；被毁后备用：修士的名册上'疑似者'一栏被涂改）〔不掷骰可得〕；2 驳船舱底新钉的木板下有空响——夹层是上一夜逃跑者留下的（场景：开航前查船；被毁后备用：船匠验船时皱眉）；3 西码头更夫第三趟不再查你们——他收了管事的钱，钱来自富商家（场景：第三趟回程；被毁后备用：更夫换班时交接的一句话）<\/li><li><strong>标签<\/strong>：恐怖·人情｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：装死的富商｜他知道你们见过他｜勒索或盟约的双刃<\/li><li><strong>史实<\/strong>：1423 威尼斯建 Lazzaretto Vecchio 疫岛（S1 内为[评·前溯]锚）<\/li><\/ul>\n<h4>Q01-05 工资法令的执法者（短链｜常规｜25 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：镇公所文告：缉拿违约逃工一队六人，押回者赏——本镇唯一'遍地'的好活<\/li><li><strong>委托人<\/strong>：镇法官朱斯蒂尼亚尼（误差：他说逃工偷了雇主工具——工具根本没丢，他要的是抓一队人杀鸡儆猴压工价）<\/li><li><strong>目标<\/strong>：把六名逃工押回镇公所受审（或让他们从此不被抓到——看你们接哪半边）<\/li><li><strong>障碍<\/strong>：主要——逃工有老有小走不快，而镇上年轻人都同情他们；隐藏——工头早就知道法官压工价的算盘，他出双倍求你们'押错人'——押那六人里的两个带头者回去顶罪<\/li><li><strong>代价<\/strong>：声望（镇民处二选一记档）＋关系（法官或工头）<\/li><li><strong>回报<\/strong>：银＋关系＋信息：工价法令的执行内幕＋恶名（若押带头者顶罪）<\/li><li><strong>三线索<\/strong>：1 六人里有两个手上是织机的茧——他们根本不是工地逃工（场景：押送路上点名；被毁后备用：工头的工册对不上人数）〔不掷骰可得〕；2 法官的判词底稿早就写好了，日期是你们出发前一天（场景：镇公所档房；被毁后备用：誊抄文书的学徒嘴快）；3 逃工领队鞋底钉着马蹄铁——他们是夜里骑马逃的，有马帮接应（场景：路上脚印；被毁后备用：沿途马厩的喂料账）<\/li><li><strong>节点图<\/strong>：双入口：接赏格、或接工头的'反委托'；环路：中途放走两人后可用马帮线补投名状；双通路：交涉（说服法官改抓带头者）／智取（制造'意外'脱籍）<\/li><li><strong>标签<\/strong>：人情·市井｜强度 轻｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：逃工领队｜亏欠（若放过）｜马帮走私线的引路人<\/li><li><strong>史实<\/strong>：1349–51 英格兰连颁《劳工法令》，违约者枷号——S1 各邦同构立法<\/li><\/ul>\n<h4>Q02-01 加来走私航线（短链｜危险｜75 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：传闻表：加来驻军'内部人'收帆布，走北海口，避缴械税<\/li><li><strong>委托人<\/strong>：驻军军需副官（私人捞钱）（误差：他说'通行证在手'——那张证在三个月前换防时就作废了，他自己也心虚）<\/li><li><strong>目标<\/strong>：两舱弗里斯兰帆布送进加来军仓，未被巡海艇截停<\/li><li><strong>障碍<\/strong>：主要——海峡两侧巡海艇按班次绞网，北口浅滩吃水险；隐藏——副官的副手想借这单黑吃黑——他已给巡海队递了'有船'的暗号<\/li><li><strong>代价<\/strong>：钱财（若被截，货与船具连坐没收）＋声望（汉萨处的'守信'记录）<\/li><li><strong>回报<\/strong>：银＋信息：军仓库存与换防时刻表＋关系（副官——但要防他再次失手）<\/li><li><strong>三线索<\/strong>：1 换防名单的骑缝日期比通行证早一个月——证是旧的（场景：上船验证时；被毁后备用：军需署公示的换防布告）〔不掷骰可得〕；2 副手递暗号用的是钟楼报时改一响——北口人夜里都听得懂（场景：加来钟楼下；被毁后备用：巡海队俘虏的口供）；3 浅滩浮标的数量比海图多一个——多的是副手新系的'报信标'（场景：夜过北口；被毁后备用：雇的老引水员一眼看穿）<\/li><li><strong>节点图<\/strong>：双入口：接副官的货、或接汉萨'验一验军需署的账'；环路：被截后改走浅滩老引水线；双通路：智取（拆报信标）／武力（护航对射）<\/li><li><strong>标签<\/strong>：冒险·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：军需副官｜结仇或亏欠｜军仓库存与换防情报源<\/li><li><strong>史实<\/strong>：加来为英据大陆桥头堡（1347–1558），驻军走私与海峡私掠常态化<\/li><\/ul>\n<h4>Q02-02 波尔多酒队护航（短链｜常规｜18 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：行会告示：秋航酒船队征护航船，工钱现结——满港都是应征的<\/li><li><strong>委托人<\/strong>：波尔多酒商行会司库（误差：他说'有皇家护航压阵'——护航舰被临时抽去布列塔尼，司库自己也才刚知道）<\/li><li><strong>目标<\/strong>：十二艘酒船安全抵港，沉没不超过两艘<\/li><li><strong>障碍<\/strong>：主要——海峡私掠艇专挑队尾下手；逆风时船队拉长三海里；隐藏——队里第六艘是'搭队'的私货船，它超载、慢、还挂着他家旗——私掠艇要的就是它<\/li><li><strong>代价<\/strong>：声望（行会记档）＋钱财（沉船连带的赔付分摊）<\/li><li><strong>回报<\/strong>：银（遍地带价低）＋声望＋信息：酒队年度账期＋关系（司库——若你们保住第六艘）<\/li><li><strong>三线索<\/strong>：1 第六艘的吃水比同型深两掌——装的不只是酒（场景：出港点名；被毁后备用：船坞装载单）〔不掷骰可得〕；2 私掠艇两次都只咬队尾第六艘位置——它们有队形表（场景：三次交火记录；被毁后备用：俘虏艇长的航海日志）；3 司库的抽调令上盖的是行会章不是王室章——护航承诺是他自担的（场景：行会档房；被毁后备用：王室海军港务的出航簿）<\/li><li><strong>节点图<\/strong>：双入口：接行会、或私下接第六艘船主的'特别费'；环路：放弃第六艘后行会信誉受损，须走司库线补救；双通路：海战（护航）／商战（贿私掠带话买路）<\/li><li><strong>标签<\/strong>：商战·战争｜强度 中｜遍地<\/li><li><strong>存留钩<\/strong>（季末入存留池）：行会司库｜声望记档｜下季酒船队优先席位<\/li><li><strong>史实<\/strong>：波尔多酒船队（fall fleet）为百年战争经济命脉，私掠专劫队尾<\/li><\/ul>\n<h4>Q02-03 两顶帽子的私掠证（长线｜危险｜560 银（公式 480））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：酒馆里那位掮客又来了：'英法两边的许可我都有路子——就看你这条船想活成什么样'<\/li><li><strong>委托人<\/strong>：私掠掮客'两顶帽子'雅各布（误差：他说两张证'效力相同'——法国那张是副本，被吊销后原件还在他手里流通）<\/li><li><strong>目标<\/strong>：持证劫掠三艘指定目标，全程不被另一国法庭定罪<\/li><li><strong>障碍<\/strong>：主要——两国的战利品法庭审的是'文书链'——证、旗、航迹要互相咬合；隐藏——掮客靠'卖证—举报—分赃'一条龙吃饭，你们是他的第三茬韭菜：劫完就会被两国同时通缉<\/li><li><strong>代价<\/strong>：声望／恶名双轨（一国记功另一国记恶）＋钱财（全部押在文书上）<\/li><li><strong>回报<\/strong>：银＋文书（一张真证）＋信息：两国法庭的文书链漏洞＋恶名<\/li><li><strong>三线索<\/strong>：1 掮客书房里挂着七幅船的画像——每一条都'恰好'被举报过（场景：掮客的岸上据点；被毁后备用：战利品法庭的旧案卷）〔不掷骰可得〕；2 法国那张证背面有注销批文的残痕——他自己裁过边（场景：验证时对光；被毁后备用：波尔多公证人处的注册副本）；3 举报信的火漆印总在劫案后三天内出现在港务官桌上——港务官是他姐夫（场景：港务官署外；被毁后备用：跟踪送信的跑腿）<\/li><li><strong>节点图<\/strong>：双入口：接掮客、或接两国法庭任一方的'钓饵'任务反钓他；环路：被通缉后走第三国（卡斯蒂利亚）销赃线续命；双通路：律法（当庭揭穿假证）／武力（连人带证劫了掮客）<\/li><li><strong>溢价/总包<\/strong>：生死长线顶格：含一张可流通的真许可证作价——总包口径（公式基准 480 银）<\/li><li><strong>标签<\/strong>：阴谋·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：掮客雅各布｜结仇｜他的举报网记下了你们<\/li><li><strong>史实<\/strong>：百年战争私掠许可证（lettre de marque）惯例成型期<\/li><\/ul>\n<h4>Q02-04 雇兵队长的欠饷（单场｜危险｜42 银（公式 30））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：委托板（红字）：军械商行悬赏'账目追讨'——对象是布列塔尼一位雇佣兵队长<\/li><li><strong>委托人<\/strong>：热那亚军械商行掌柜（误差：他说队长'只是手头紧'——队长根本不打算还，还把抵押的弩机又卖了一遍）<\/li><li><strong>目标<\/strong>：把欠条变成现银、船货或等值抵押物带回来<\/li><li><strong>障碍<\/strong>：主要——队长营地在河口营地，五十张弩对着水道；隐藏——队里的司务长欠了赌债，正愁没机会卷账跑路——你们是她的'外部理由'（红线：不开酷刑与私刑描写）<\/li><li><strong>代价<\/strong>：声望（军械行记档）＋风险（河口营地是私刑场）<\/li><li><strong>回报<\/strong>：银＋实物（弩机若干）＋关系（军械行）＋信息：雇佣兵营地的补给线<\/li><li><strong>三线索<\/strong>：1 司务长的赌债条子到期日就在三天后——她比你们更急（场景：营地下锚处；被毁后备用：营地赌桌上的闲话）〔不掷骰可得〕；2 抵押弩机的记号被锉过——同一批弩在下游黑市出现过两次（场景：验抵押物时；被毁后备用：下游销赃点的收货册）；3 队长的'还款承诺'写在他自己名下的纸上——没有商行火漆（场景：谈判桌上；被毁后备用：掌柜处的借据正本）<\/li><li><strong>标签<\/strong>：商战·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：司务长｜亏欠｜营地内线与军械黑价<\/li><li><strong>史实<\/strong>：百年战争雇佣兵团（routiers）欠饷与抵债是常态<\/li><\/ul>\n<h4>Q02-05 赎金信使（短链｜常规｜25 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：旧识来信：普瓦捷被俘的骑士家要送赎金谈判信过海峡，'信比人贵'<\/li><li><strong>委托人<\/strong>：骑士之妻阿涅丝（误差：她不知道丈夫已打算改换旗号——信第二页就是效忠书，读了它的人都会被卷进两国间的官司）<\/li><li><strong>目标<\/strong>：把密封信件送到俘虏营并带回回执，不拆、不丢、不被告发夹带<\/li><li><strong>障碍<\/strong>：主要——两国巡检都拦'带文书的人'，搜检例行公事却越查越细；隐藏——押解骑士的卫队长想截第二页——效忠书在他手里能换自己晋升<\/li><li><strong>代价<\/strong>：钱财（若信被截，赎金谈判崩盘，违约金从你们佣金里扣）<\/li><li><strong>回报<\/strong>：银＋声望（信使守则两行好评）＋关系（骑士家）<\/li><li><strong>三线索<\/strong>：1 卫队长最近频繁调阅骑士的案卷——比赎金谈判该有的节奏快得多（场景：俘虏营文书房；被毁后备用：营中书记的借阅簿）〔不掷骰可得〕；2 阿涅丝给信封口用的是双线十字——她丈夫只认单线（场景：接信时；被毁后备用：骑士本人回执上的封漆比对）；3 巡检名册上'文书线'一栏三天前刚加了卫队长侄子的名字（场景：过检时；被毁后备用：港务巡检的排班牌）<\/li><li><strong>节点图<\/strong>：双入口：阿涅丝的正差、或卫队长许诺的'只送信不问内容'；环路：第一页被扣后借营中书记之手补送抄件；双通路：智取（拆分两页分送）／交涉（说服卫队长）<\/li><li><strong>标签<\/strong>：阴谋·人情｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：被俘骑士｜亏欠｜获释后的旗号与战利品法庭关系<\/li><li><strong>史实<\/strong>：1356 普瓦捷会战后贵族赎金经济（约翰二世赎金=全国岁入两倍）<\/li><\/ul>\n<h4>Q03-01 大加利商队护卫（短链｜危险｜70 银（公式 50））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：港务征募：黎凡特回程商队缺护航船两条，队期不等人<\/li><li><strong>委托人<\/strong>：威尼斯海军部征募官（误差：他说'热那亚主力在爱琴海'——分舰队刚调回来，征募官还压着调令没公示）<\/li><li><strong>目标<\/strong>：商队五船抵威尼斯，货物损失不超过一成<\/li><li><strong>障碍<\/strong>：主要——热那亚桨帆分队在外海择机突袭，桨帆船无风也快；隐藏——商队大掌柜自己把两条'顺路船'的位置卖给了对方换自家安全<\/li><li><strong>代价<\/strong>：声望（海军部记档）＋钱财（战损连带责任）<\/li><li><strong>回报<\/strong>：银＋声望＋信息：热那亚分舰队动向＋恶名（若查出掌柜卖队而你替他瞒下）<\/li><li><strong>三线索<\/strong>：1 大掌柜的私人信鸽笼搬上了他的船——商船带鸽笼只有一种用途（场景：出港前；被毁后备用：鸽哨传书被截的抄件）〔不掷骰可得〕；2 热那亚分舰队的加莱副手到港加淡水——时间对得上商队的队期（场景：中途补给港；被毁后备用：港务出入登记）；3 征募官书房抽屉里那张调令的蜡还软着（场景：征募署；被毁后备用：海军部公示栏的旧档）<\/li><li><strong>节点图<\/strong>：双入口：接征募、或被大掌柜私下'买安全'；环路：队形被卖后改走夜间轮桨接力线；双通路：海战（护航接舷）／商战（策反对方引水员）<\/li><li><strong>标签<\/strong>：战争·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：大掌柜｜结仇（他卖过队）｜黎凡特船期的暗账<\/li><li><strong>史实<\/strong>：基奥贾战争（1378–81）商路护航为两城命脉<\/li><\/ul>\n<h4>Q03-02 封锁线破围（短链｜危险｜210 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：城里的火漆信从潟湖缝里递出来：桅料、腌肉师傅、还有半城人的指望——'谁能进来，谁开价'<\/li><li><strong>委托人<\/strong>：威尼斯元老院城防委员（化名'盐商'）（误差：他说'只有热那亚封锁外海'——潟湖口内还有帕多瓦的陆哨，他只字未提）<\/li><li><strong>目标<\/strong>：一批桅料与一名腌肉师傅送进城，船不沉<\/li><li><strong>障碍<\/strong>：主要——外海封锁舰八条，潟湖浅水只能吃水浅的船走'沙脊线'夜航；隐藏——沙脊线近期的浮标被热那亚买通的渔家改过位——旧海图会送你们上滩<\/li><li><strong>代价<\/strong>：钱财（船沉则本钱全灭）＋声望（'破围者'称号与敌国名单）<\/li><li><strong>回报<\/strong>：银＋声望（城防委员处记功）＋信息：沙脊线新图＋关系（腌肉师傅行会）<\/li><li><strong>三线索<\/strong>：1 浮标结扣的方向跟老图相反——新结扣是渔家的'平结'，官家用的是'十字结'（场景：夜航验标；被毁后备用：抓一个改标的渔家问话）〔不掷骰可得〕；2 腌肉师傅的行李里有一封没封口的信——收信人是热那亚舰队的司务长（场景：装货时；被毁后备用：信纸边缘的舰船名缩写）；3 城防委员的'盐商'名号在盐业公所查无此人——他用的白手套是圣马可金库的（场景：接洽时；被毁后备用：金库出纳的私人账）<\/li><li><strong>节点图<\/strong>：双入口：接城防委员、或被热那亚反向收买'带假情报进城'；环路：沙脊线上滩后弃船走渔村沼泽线；双通路：智取（重测浮标）／武力（夜袭哨艇开缺口）<\/li><li><strong>溢价/总包<\/strong>：含'破围者'称号的声望作价（对接 10.8 声望表）（公式基准 150 银）<\/li><li><strong>标签<\/strong>：战争·冒险｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：城防委员｜记功｜破围者称号与沙脊新图<\/li><li><strong>史实<\/strong>：1379–80 热那亚封潟湖口，威尼斯以浅水舰队反封锁取胜<\/li><\/ul>\n<h4>Q03-03 基奥贾沼泽的火船夜袭（单场｜危险｜84 银（公式 60））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：军港布告：征'自愿焚船队'——自愿的意思是，活下来才有赏格<\/li><li><strong>委托人<\/strong>：城防水师都尉（误差：他说'渔向导只是带路'——向导是基奥贾本地人，全家还在封锁区里，这一点布告上没有）<\/li><li><strong>目标<\/strong>：两条改装火船趁低潮烧到热那亚泊地并返航<\/li><li><strong>障碍<\/strong>：主要——低潮窗口只有两个时辰，泊地桩阵与哨艇在退潮线上补位；隐藏——渔向导会在半路把火船引偏——除非你们先把他家人的下落给他<\/li><li><strong>代价<\/strong>：生死（火船队传统生还率）＋恶名／声望双轨（烧民船与烧军舰一线之隔）<\/li><li><strong>回报<\/strong>：银（生还赏格）＋声望（水师记功）＋恶名（泊地民船若有损失）<\/li><li><strong>三线索<\/strong>：1 向导腰上挂着两家的网标——基奥贾渔家一次只挂自家网标（场景：上船点名；被毁后备用：向导妹妹在威尼斯当厨娘）〔不掷骰可得〕；2 泊地桩阵的间距按大船设计——留的那条宽缝正对小渔村的出海口（场景：夜袭侦察；被毁后备用：俘虏的桩阵图）；3 都尉的赏格册上'生还'栏三页空白——他调过的队从没人回来领（场景：领赏格时；被毁后备用：水师军械房的老兵认得都尉的笔迹）<\/li><li><strong>标签<\/strong>：战争·恐怖｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：渔向导｜复杂亏欠｜基奥贾本地水道人情<\/li><li><strong>史实<\/strong>：1379–80 基奥贾沼泽攻防以火船与浅水桨帆互袭见载<\/li><\/ul>\n<h4>Q03-04 两国海军部的双面账房（长线｜常规｜280 银（公式 200））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：十人委员会的密使深夜到访：'有个账房，两家的军账都在他手里过——我们要知道他的真账'<\/li><li><strong>委托人<\/strong>：威尼斯十人委员会密使（误差：他说账房'叛国在即'——账房实际在两头压价，用差价私下买和谈筹码，逼两国早点收手）<\/li><li><strong>目标<\/strong>：拿到账房两本军账的对照证据，完整呈交委员会<\/li><li><strong>障碍<\/strong>：主要——账房行踪不定且身边有两国眼线互相盯梢；隐藏——密使的真实任务不是取证——委员会里有人想借账房案清洗政敌，证据的'剪辑权'在你们手里<\/li><li><strong>代价<\/strong>：声望（十人委员会处记密功）＋关系（若账房事后被清算，他的门生会记恨）<\/li><li><strong>回报<\/strong>：银＋信息：两城军账与和谈底牌＋关系（密使——以及可能的清算株连）<\/li><li><strong>三线索<\/strong>：1 账房两本账用的墨不同——威尼斯账用铁胆墨，热那亚账掺了炭（场景：账房书桌；被毁后备用：向墨匠订货的底单）〔不掷骰可得〕；2 账房每月十五去圣拉撒路岛'施舍'——亚美尼亚修士的账本上有他的真名（场景：圣拉撒路岛；被毁后备用：修士认得他的落难旧仆）；3 密使呈上去的前两份'密报'都被委员们轻轻放下——他在等一份够杀人的（场景：密使的接头点；被毁后备用：委员会议事录的摘要）<\/li><li><strong>节点图<\/strong>：双入口：接密使、或账房主动找你们'买一条退路'；环路：取证失败后借修士线送人出海换证词；双通路：智取（墨迹与真名）／交涉（说服账房交出和谈筹码）<\/li><li><strong>标签<\/strong>：阴谋·史诗｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：双面账房｜亏欠（若放走）｜两城军账的后门<\/li><li><strong>史实<\/strong>：1381 都灵和约前两城均有中间渠道试探——账房角色为史实同构<\/li><\/ul>\n<h4>Q04-01 先导勘察的单（短链｜常规｜45 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：南京龙江关的火贴：宝船队下西洋先导缺船两条——'核价目，验淡水，画泊位'<\/li><li><strong>委托人<\/strong>：市舶司书办王主事（误差：他说'勘验不过官样文章'——满剌加的新港主换了人，旧价目表全数作废，此事他压着不报）<\/li><li><strong>目标<\/strong>：按司里的单子核完满剌加、古里两港的价目与淡水账，画回泊位图<\/li><li><strong>障碍<\/strong>：主要——两港牙行都想把'官方价'报高，且互相拆台；隐藏——王主事把旧价目折价卖给了私舶商——你们核出的真价会砸他的私账<\/li><li><strong>代价<\/strong>：时间（两港候风共一旬）＋声望（司里考功）<\/li><li><strong>回报<\/strong>：银＋信息：两港真实价目与泊位＋关系（市舶司）＋恶名（若捅破王主事私账则得罪其靠山）<\/li><li><strong>三线索<\/strong>：1 新港主的告示用的是旧年号——满剌加的船契早换过一套格式（场景：满剌加港署；被毁后备用：琉球那霸中介手里的新船契）〔不掷骰可得〕；2 王主事的私账夹在'损坏册'里——报损的瓷器数目对不上出库单（场景：龙江关档房；被毁后备用：库吏的照单副本）；3 古里牙行的秤砣底部凿了小孔——灌铅可调三成（场景：验秤时；被毁后备用：上一批先导船留下的验秤蜡记）<\/li><li><strong>节点图<\/strong>：双入口：接司里正差、或被私舶商买通'报旧价'；环路：满剌加被刁难后走那霸中介的中转凭信；双通路：商战（比价压牙行）／律法（以官契压港署）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：王主事｜结仇（若捅破）｜市舶司考功档案把柄<\/li><li><strong>史实<\/strong>：郑和船队每次出航前有先遣核价与淡水勘验（史载职司同构）<\/li><\/ul>\n<h4>Q04-02 麒麟贡的押运风波（短链｜危险｜120 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：榜葛剌来的火贴：'麒麟'北上的伴航船缺人——一头活的，金贵，怕晃<\/li><li><strong>委托人<\/strong>：随队通事（译员）郭礼（误差：他说'兽医自有专人'——根本没有兽医，长颈鹿的草料配比只有榜葛剌驯兽师知道，而他在刘家港就逃船了）<\/li><li><strong>目标<\/strong>：把'麒麟'活体押运到北京交割，途中不病不死<\/li><li><strong>障碍<\/strong>：主要——活体怕风浪怕换食，每月草料要从南方口岸补特供豆料；隐藏——礼部仪制司的郎中想让它'死在路上'——活麒麟上京，他那一套祥瑞仪注就得全改<\/li><li><strong>代价<\/strong>：钱财（若兽死，全队连坐赔贡）＋声望（献瑞首功）<\/li><li><strong>回报<\/strong>：银＋声望＋关系（礼部与市舶司两道）＋信息：北方口岸的特供豆料行情<\/li><li><strong>三线索<\/strong>：1 豆料的采买单子写的是'马料'——马不吃苏木豆（场景：刘家港采买处；被毁后备用：榜葛剌驯兽师留下的配方残页）〔不掷骰可得〕；2 郎中的奏本草稿里'宜从权处置'四字涂了又写（场景：礼部档房；被毁后备用：郎中幕僚的闲谈）；3 笼舍的篷布新换过——旧篷布内侧有一圈被啃的齿痕，配得上豆料不是草料（场景：登船验笼；被毁后备用：随船木匠的工单）<\/li><li><strong>节点图<\/strong>：双入口：接通事、或接郎中一系的'密令'（拆台任务变体）；环路：驯兽师逃船后沿运河口岸找会配豆料的老马医；双通路：交涉（说动口岸官仓特批）／智取（伪充马料过关卡）<\/li><li><strong>标签<\/strong>：市井·史诗｜强度 中｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：通事郭礼｜亏欠｜礼部路线与口岸特供渠道<\/li><li><strong>史实<\/strong>：1414 榜葛剌贡麒麟（长颈鹿），举朝称瑞<\/li><\/ul>\n<h4>Q04-03 停航令前的最后一航（长线｜生死｜595 银（公式 600））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：宝船厂老匠的徒弟深夜敲门：'停航的邸报快下了。师父一生的心血——四百页针路、罗盘刻度、风信簿——他想让它们出海，而不是入库烂掉'<\/li><li><strong>委托人<\/strong>：宝船厂老匠之徒陈小乙（误差：他说'只是抄本，官府不会为难'——其中三页是禁书《自宝船厂开船从龙江关出水直抵外国诸番图》的抄节，查出即大罪）<\/li><li><strong>目标<\/strong>：把图纸与风信簿抄本安然送出江防，交到愿意保存它的人手里（你们选：佛寺藏经／琉球唐荣／或自己留着）<\/li><li><strong>障碍<\/strong>：主要——江防同知盯宝船厂出身的人；水陆关卡抄检'图籍'；隐藏——兵部车驾司有人也在找这套抄本——不为禁毁，为卖给即将接手南洋贸易的私舶大族<\/li><li><strong>代价<\/strong>：生死（藏匿禁图是灭门罪）＋钱财（买家出的价会很诱人）<\/li><li><strong>回报<\/strong>：银＋文书（针路抄本一份——它本身就是顶级航海资产）＋关系（陈氏师徒／或私舶大族）<\/li><li><strong>三线索<\/strong>：1 抄本的第三册衬页抄着针路——衬页比正文旧（场景：翻检抄本时；被毁后备用：老匠的针路口语诀（口述可补））〔不掷骰可得〕；2 车驾司的密探只查'官方书目'缺页——他知道要找什么（场景：南京书坊；被毁后备用：兵部旧档的借阅名单）；3 佛寺藏经阁的经函尺寸恰好放得下船图——不是巧合，是有先例（场景：藏经阁；被毁后备用：寺里还俗的老船僧）<\/li><li><strong>节点图<\/strong>：双入口：接徒弟、或接车驾司买家的'收购'；环路：江防被卡后走漕河夜航过闸线；双通路：藏（佛寺／琉球）／留（自留但从此背一条纪级暗线）<\/li><li><strong>溢价/总包<\/strong>：生死长线顶格：另含针路抄本的'航海资产'作价（对接 08 分册航道知识）（公式基准 600 银）<\/li><li><strong>标签<\/strong>：史诗·人情｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：陈小乙师徒｜亏欠｜针路抄本另一半与老匠人脉<\/li><li><strong>史实<\/strong>：1433 后停航令与宝船档案散佚（'刘大夏焚图'传说母题）<\/li><\/ul>\n<h4>Q04-04 琉球中介的单（短链｜常规｜35 银（公式 25））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：那霸港的熟客递来折扇：'天朝的回赐丝绸，转手九州，三成的利——肯做吗'<\/li><li><strong>委托人<\/strong>：那霸唐荣船主麻衡（误差：他说'九州那边只是转卖'——实际买家是倭寇头目的白手套，货一到手链条就洗白了）<\/li><li><strong>目标<\/strong>：把回赐丝绸经那霸转口出手，货款全数收回<\/li><li><strong>障碍<\/strong>：主要——市舶司严查'回赐转卖'，出港验舱看的是丝绸夹层；隐藏——麻衡自己欠着萨摩藩的债——这单成了他赎身，砸了你们就是他弃的卒<\/li><li><strong>代价<\/strong>：声望（市舶司处若查获则记恶）＋钱财（货款与押金）<\/li><li><strong>回报<\/strong>：银＋关系（唐荣／九州通路）＋信息：回赐—转口的真实价差带<\/li><li><strong>三线索<\/strong>：1 麻衡的折扇骨上刻着萨摩岛津家的桐纹——受恩者才刻（场景：那霸酒席上；被毁后备用：唐荣老账房的暗账）〔不掷骰可得〕；2 九州买家的定金是条银不是碎银——条银来自对马，倭寇的洗货惯例（场景：收定金时；被毁后备用：泉州银匠的熔纹鉴定）；3 市舶司验舱吏的靴子是新换的——皮料产地是萨摩（场景：出港验舱；被毁后备用：验舱吏的调任文书）<\/li><li><strong>节点图<\/strong>：双入口：接麻衡、或接市舶司'查转卖'的暗访；环路：货被九州扣后走对马老关系另开议价桌；双通路：商战（拆穿白手套）／交涉（萨摩债台做筹码）<\/li><li><strong>标签<\/strong>：市井·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：麻衡｜复杂｜萨摩债台与九州通路<\/li><li><strong>史实<\/strong>：琉球'大交易时代'以中介转口立国（14–16 世纪）<\/li><\/ul>\n<h4>Q04-05 旧港的头目之争（短链｜危险｜50 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：旧港码头上两面帖子同时递到：两头目都要'借天朝船的名头'撑场子——先到者为客<\/li><li><strong>委托人<\/strong>：旧港华人头目施家二爷（先递帖的一方）（误差：他说陈家'私通海盗'——陈家告的恰恰是施二爷自己勾着三佛齐旧王族在攒私兵）<\/li><li><strong>目标<\/strong>：在旧港头目之争里把'天朝名头'用到哪一边、怎么用——并让你们的船完整离港<\/li><li><strong>障碍<\/strong>：主要——两家的码头打手加起来三百人，港内水道被沉船锁了两条；隐藏——港主（当地王族）两边都不信，等你们先动手——港主的巡船会'恰好'在场<\/li><li><strong>代价<\/strong>：恶名／声望双轨（侨社两族各记一本账）＋钱财（码头保护费）<\/li><li><strong>回报<\/strong>：银＋关系（选边的一方）＋信息：旧港水道沉船图＋恶名<\/li><li><strong>三线索<\/strong>：1 施家船坞夜里在改炮位——商船不需要'对岸'的炮座（场景：旧港船坞；被毁后备用：港主巡船夜巡的记录）〔不掷骰可得〕；2 陈家的'海盗证'是三佛齐旧王族的火漆——旧王族三年前就被港主赶下海了（场景：验文书时；被毁后备用：港主府上的旧朝名册）；3 港主的巡船每次都在两家冲突前一刻到——他的瞭望塔比码头的钟快（场景：两次冲突现场；被毁后备用：瞭望塔哨官的轮值表）<\/li><li><strong>节点图<\/strong>：双入口：施家的帖、或陈家的反帖；环路：两边都翻脸后借港主巡船'执法'脱身；双通路：武力（夜开水道沉船）／交涉（把港主拉上桌）<\/li><li><strong>标签<\/strong>：人情·战争｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：施家或陈家｜记档｜旧港码头的水道人情<\/li><li><strong>史实<\/strong>：1407 郑和擒旧港头目陈祖义，设旧港宣慰司<\/li><\/ul>\n<h4>Q05-01 抄本船（长线｜危险｜255 银（公式 240））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：威尼斯旧识来信：'贝萨里翁大人的代理人在加拉克坡收书。城破前还有三个月——你的船吃水浅，能进金角湾'<\/li><li><strong>委托人<\/strong>：红衣主教贝萨里翁的购书代理人（误差：他说'家眷是顺路'——其中'一家'是宫廷史官遗孀，奥斯曼城内缉拿名单上有她）<\/li><li><strong>目标<\/strong>：陷城前把一批古典抄本与两户学者家眷运出金角湾，送抵威尼斯<\/li><li><strong>障碍<\/strong>：主要——奥斯曼军对金角湾的封锁链与陆墙炮火；抄本怕水怕火，船舱要改；隐藏——抄本箱里夹着一份未发表的'帝国与威尼斯密约'抄件——它若落在主战派手里，威尼斯侨民区会被清算<\/li><li><strong>代价<\/strong>：时间（三道封锁线）＋钱财（改舱与买路钱）＋声望（学界记恩）<\/li><li><strong>回报<\/strong>：银＋总包：威尼斯学院终身阅览权＋声望＋信息：密约抄件（烫手）<\/li><li><strong>三线索<\/strong>：1 史官遗孀的行李里没有家当，只有一口空棺——'运书'的船装棺材不是丧事，是藏人（场景：装船夜；被毁后备用：侨民区神父的施洗登记）〔不掷骰可得〕；2 密约抄件的纸是新纸，墨是旧墨——有人临摹后调包了原件（场景：翻检抄本时；被毁后备用：圣索菲亚藏书房的借阅簿）；3 封锁链每旬换锚位——希腊渔家的孩子数链环当游戏，数得比水师准（场景：封锁线外海；被毁后备用：买通奥斯曼锚地的小吏）<\/li><li><strong>节点图<\/strong>：双入口：接代理人、或接城内主战派'烧书'的暗令（道德变体）；环路：封锁链收紧后改走马尔马拉夜渡接应线；双通路：航海（渔家链环线）／交涉（以侨民区通商作保）<\/li><li><strong>溢价/总包<\/strong>：总包含学院阅览权与'护书人'声望作价（公式基准 240 银）<\/li><li><strong>标签<\/strong>：史诗·人情｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：史官遗孀｜亏欠｜学院人脉与希腊语译员<\/li><li><strong>史实<\/strong>：1453 前后拜占庭学者携抄本西迁（贝萨里翁藏书后成圣马可文库基础）<\/li><\/ul>\n<h4>Q05-02 黑海份额的外交跑腿（短链｜常规｜52 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：卡法领事馆文书的私信：'陷落之后黑海的账要重分。我们和威尼斯要互递条件——信使的人头值三百银'<\/li><li><strong>委托人<\/strong>：热那亚卡法领事馆文书奥班诺（误差：他说'条件只是贸易份额'——威尼斯附有一条秘密条款：战后共管加拉塔，此事热那亚本土尚不知情）<\/li><li><strong>目标<\/strong>：把条款文本在两城领事馆间递满三个来回，带回答复<\/li><li><strong>障碍<\/strong>：主要——奥斯曼加盖的'通行文书'只认船不认人，且三日一验；隐藏——热那亚本土的使馆参赞想要密约曝光——他在第三个来回安排了'检查'<\/li><li><strong>代价<\/strong>：声望（两领事馆记档）＋钱财（若文本泄露，两方连坐罚金）<\/li><li><strong>回报<\/strong>：银＋信息：黑海份额划分的底价＋关系（两馆文书）<\/li><li><strong>三线索<\/strong>：1 参赞的'检查'名目用的是本土格式——卡法惯用的批文他一处都没用（场景：第三个回程；被毁后备用：两馆文书格式对照）〔不掷骰可得〕；2 威尼斯附款用的火漆是'狮衔书'——那枚印半年前就报失了（场景：验火漆时；被毁后备用：威尼斯铸印匠的订单簿）；3 奥斯曼通行文书的骑缝暗记三日一换——能验出旧文书的人只有签发的小吏（场景：过奥斯曼关卡；被毁后备用：小吏在加拉塔酒馆的赌债）<\/li><li><strong>节点图<\/strong>：双入口：接奥班诺、或接参赞'曝光密约'的反委托；环路：文书被扣后借加拉塔小吏补签通行；双通路：交涉（两馆之间挑价）／智取（格式比对避检）<\/li><li><strong>标签<\/strong>：阴谋·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：奥班诺｜亏欠｜卡法领事馆文书渠道<\/li><li><strong>史实<\/strong>：1453 后黑海热那亚殖民地（卡法 1475 陷落前）贸易份额被迫重谈<\/li><\/ul>\n<h4>Q05-03 难民船的分配（单场｜危险｜60 银（公式 20））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：不是委托——港头堵着一条超载难民船，水手们都看着你们这条船的淡水桶<\/li><li><strong>委托人<\/strong>：（无委托人：六要素的'委托人'槽由'船上的难民代表'顶——老祭司安德罗尼柯）（误差：老祭司说'大家都在挨饿'——他自己藏着圣器匣，里面是够半船人赎命的银器，还没亮出来）<\/li><li><strong>目标<\/strong>：做出并执行一套淡水与舱位的分配方案，天黑前让船重新出海（无论谁上谁下）<\/li><li><strong>障碍<\/strong>：主要——超载三成的船出海必翻；每一条'下船'的理由都会引发骚动；隐藏——圣器匣若亮出来，分配就不是配给而是拍卖——祭司在赌你们的脸色<\/li><li><strong>代价<\/strong>：声望／恶名双轨（岛上人与海上同行各记一账）＋钱财（圣器若归你们，价值不菲）<\/li><li><strong>回报<\/strong>：声望＋关系（难民社群）＋信息：爱琴海各岛的接收门路＋恶名（若强令下船）<\/li><li><strong>三线索<\/strong>：1 圣器匣的锁是新的，铜绿却在提手处磨光了——常有人提（场景：老祭司的行囊；被毁后备用：随船孩童'数过祭司的东西'）〔不掷骰可得〕；2 船底压舱石的数目比吃水浅——有人半夜往海里扔过私货（场景：验船时；被毁后备用：夜班水手的目击）；3 下一站希俄斯岛的检疫官只认'整船点名'——少一人整船扣留（场景：航线商议时；被毁后备用：希俄斯旧航海日志的防疫条）<\/li><li><strong>溢价/总包<\/strong>：本卡报酬以声望与关系为主——银只作均衡校验（公式基准 20 银）<\/li><li><strong>标签<\/strong>：人情·恐怖｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：老祭司｜亏欠或结仇｜爱琴海难民社群的门路<\/li><li><strong>史实<\/strong>：1453 城破难民潮经爱琴海各岛扩散<\/li><\/ul>\n<h4>Q05-04 金角湾的那一夜（短链｜危险｜210 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：城破前七日，加拉塔的热那亚补给官拦住你们：'陆地上在拖船。你可以替守军偷火药，也可以替攻方带路——价钱我都带来了'<\/li><li><strong>委托人<\/strong>：朱斯蒂尼亚尼部下的补给官巴尔巴里戈（误差：他说'只是钱的问题'——两边的'委托'其实都出自奥斯曼军中一名热那亚炮匠的双面安排，他在赌城防的时间表）<\/li><li><strong>目标<\/strong>：你们选一边并完成：偷出守军殉爆点的火药储备，或把翻山船队的泊位图交给攻方<\/li><li><strong>障碍<\/strong>：主要——金角湾两岸的双重哨线与'角对面就是对头'的地理；隐藏——炮匠的真实目的不是钱——他在给自己留'两边都收过钱'的活路，你们是他的证人或替罪者<\/li><li><strong>代价<\/strong>：声望／恶名双轨（两阵营各记一账，史书级）＋生死<\/li><li><strong>回报<\/strong>：银（任一边顶格）＋信息：翻山船队工程细节＋恶名或声望<\/li><li><strong>三线索<\/strong>：1 炮匠两边的订单用同一种油布包——他只用一个供货商（场景：加拉塔货栈；被毁后备用：供货商的出货簿）〔不掷骰可得〕；2 守军殉爆点的位置图是威尼斯工程师的笔迹——图不该在攻方补给官手里（场景：接泊位图时；被毁后备用：工程师本人可以认笔迹）；3 补给官的侄子在守军里当差——他递的每条情报都先过侄子的岗（场景：接头点；被毁后备用：侄子的换岗时间表）<\/li><li><strong>节点图<\/strong>：双入口：守军线／攻方线（互斥）；环路：一边被识破后立刻可以'反正'接另一边（代价是两边的名单都记你们一笔）；双通路：潜入（火药库）／测绘（泊位图）<\/li><li><strong>标签<\/strong>：战争·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：双面炮匠｜两边名单都有你们｜下季活口或证人<\/li><li><strong>史实<\/strong>：1453.4.22 奥斯曼舰船翻越加拉塔陆岬入金角湾<\/li><\/ul>\n<h4>Q05-05 死人的承诺（单场｜危险｜48 银（公式 40））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：城破当天早上，委托人还站在城墙上；下午你们收到他的仆人捧来的匣子——'老爷说，今天之内，送到加拉塔的当铺'<\/li><li><strong>委托人<\/strong>：（委托人已死：威尼斯珠宝商马可·莱达尼——匣中遗书为凭）（误差：死人自己隐瞒了：匣中首饰一半是当来的圣器，当铺老板见过原件清单——送还等于自证销赃）<\/li><li><strong>目标<\/strong>：天黑前把匣子送抵加拉塔指定当铺，并带回收条<\/li><li><strong>障碍<\/strong>：主要——城破后的'三天黑市'——劫掠队、逃兵与买路钱横行，各城门只出不进；隐藏——当铺老板要的不是首饰，是遗书——莱达尼生前用遗书押了三百金的债，销掉遗书他才能收净圣器<\/li><li><strong>代价<\/strong>：生死（黑市三天的街头风险）＋恶名（销赃链若曝光）<\/li><li><strong>回报<\/strong>：银（遗书指定酬金）＋圣器处置权（道德选项）＋恶名<\/li><li><strong>三线索<\/strong>：1 匣底衬布下面压着当铺的旧票根——当来的日子比'购买'早半年（场景：验匣时；被毁后备用：圣器室的出入登记）〔不掷骰可得〕；2 遗书的落款日期是'城破前一日'——笔迹却写在一张城破当天才流通的告示背面（场景：读遗书时；被毁后备用：告示的印刷批次）；3 老板的债主比老板还急——三百金的债主是奥斯曼军需官（场景：加拉塔当铺；被毁后备用：军需官的放贷账）<\/li><li><strong>标签<\/strong>：人情·恐怖｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：当铺老板｜结仇｜三百金债务链的凭证<\/li><li><strong>史实<\/strong>：1453.5.29 城破劫掠三日（史称'三天黑市'为剧情同构）<\/li><\/ul>\n<h4>Q06-01 休达城下的补给私商（短链｜常规｜32 银（公式 25））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：休达刚破城（1415），港头告示：驻军现收粮、酒、干草——'价格好商量'<\/li><li><strong>委托人<\/strong>：休达驻军军需官（以私人名义）（误差：他说'城里稳得很'——城外摩尔商营正联合抬价，军需官想用你们压他自己的官家补给线）<\/li><li><strong>目标<\/strong>：一批粮酒草料进城，价格不高于官家补给线<\/li><li><strong>障碍<\/strong>：主要——摩尔商营封锁了陆路水源，水井在他们的射程里；隐藏——军需官的官家补给线其实是他自己小舅子承包的——你们压价就是砸他家的饭碗<\/li><li><strong>代价<\/strong>：钱财（价格条款）＋声望（驻军记档）<\/li><li><strong>回报<\/strong>：银＋关系（军需官／摩尔商营二选一）＋信息：北非水源与商营价目<\/li><li><strong>三线索<\/strong>：1 摩尔商营的水价三天没变——变的是'护送费'，这才是真价（场景：城外商营；被毁后备用：商营账房的草单）〔不掷骰可得〕；2 军需官的验收印有两枚——一枚公用一枚私用，粮单盖的是私印（场景：交割时；被毁后备用：驻军军需署的印章名录）；3 小舅子的运粮队每旬准点到——风调雨顺得不像隔着封锁线（场景：城墙上看；被毁后备用：小舅子的护队名册）<\/li><li><strong>节点图<\/strong>：双入口：接军需官、或接摩尔商营'独家水源'的合同；环路：水源被断后走修会善会的'圣水船'名义线；双通路：商战（两头比价）／交涉（撮合停火买水）<\/li><li><strong>标签<\/strong>：商战·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：军需官或商营｜记档｜北非水源合同<\/li><li><strong>史实<\/strong>：1415 葡取休达后驻军补给长期困难（若昂之子的回忆录主题）<\/li><\/ul>\n<h4>Q06-02 埃尔米纳的黄金押运（短链｜危险｜105 银（公式 75））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：里斯本王室的私函：'金堡（圣乔治·埃尔米纳）的一季产出，走你的船回里斯本——你将不知道里面有多少，这正是好处'<\/li><li><strong>委托人<\/strong>：王室西非事务官费尔南·戈梅斯商号的押运监理（误差：他说'箱数即账目'——有两箱封条下的铅块是监理自己换的，他要借你们的'完好交付'平他上一季的亏空）<\/li><li><strong>目标<\/strong>：把金箱从埃尔米纳押回里斯本入王室金库，全程封条无异议<\/li><li><strong>障碍<\/strong>：主要——几内亚湾的热病与逆风返航带；回程要在佛得角补水；隐藏——换铅的那两箱会在入库复核时开箱——你们是'完好'的签字人<\/li><li><strong>代价<\/strong>：钱财（亏空连坐）＋声望（王室记档）<\/li><li><strong>回报<\/strong>：银＋声望＋信息：金堡产出与非洲内地金价带＋关系（商号）<\/li><li><strong>三线索<\/strong>：1 两箱封蜡的纹路对得上但压痕深浅不一——新蜡是软蜡压的（场景：装船验封时；被毁后备用：堡里炼金房领蜡的底账）〔不掷骰可得〕；2 监理上一季的亏空在他自己商号的分红册里看得见（场景：里斯本商号；被毁后备用：商号合伙人的对账信）；3 佛得角补水时监理坚持'不卸箱'——卸箱重验他就不敢赌（场景：中途补水；被毁后备用：船员中懂蜡封的老水手）<\/li><li><strong>节点图<\/strong>：双入口：接监理、或接商号合伙人'盯紧封条'的暗托；环路：发现换铅后可在佛得角当场开箱取证；双通路：律法（封蜡鉴定）／商战（拿住把柄换分红）<\/li><li><strong>标签<\/strong>：商战·阴谋｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：商号合伙人｜亏欠｜商号分红与王室记档<\/li><li><strong>史实<\/strong>：1482 埃尔米纳堡建成，几内亚金经王室商号专营<\/li><\/ul>\n<h4>Q06-03 航路保密局的救人线（短链｜危险｜92 银（公式 75））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：拉各斯的旧识口信：'制图师若昂被'请'去萨克姆灯塔'修图'，三个月没回家。他家里人想买一条能靠上灯塔的船'<\/li><li><strong>委托人<\/strong>：制图师之兄（鱼贩，攒不出船钱）（误差：他说弟弟只是'被扣着画图'——若昂已被要求把新航线的假水深画进正式海图，他不肯，所以回不了家）<\/li><li><strong>目标<\/strong>：把若昂从萨克姆灯塔接出海并送到拉各斯<\/li><li><strong>障碍<\/strong>：主要——灯塔是王室档案点的分所，守卫是'文职'却配着弩；隐藏——若昂不肯走——他手里那版'真图'没送出去前，他走了全家都要顶罪<\/li><li><strong>代价<\/strong>：声望（王室记'走私图纸'恶档的风险）＋钱财（雇船与打点）<\/li><li><strong>回报<\/strong>：银＋文书（真水深图一份）＋关系（制图师行会）＋恶名（王室档案系统记档）<\/li><li><strong>三线索<\/strong>：1 灯塔送菜船每旬一靠——菜单里有若昂爱吃的腌橄榄，人是活的（场景：拉各斯鱼市；被毁后备用：送菜船夫的闲话）〔不掷骰可得〕；2 若昂藏在图筒夹层的真图只有半幅——另半幅他拆成了信寄给他妹妹（场景：灯塔书房；被毁后备用：他妹妹的嫁妆箱衬里）；3 灯塔守卫的饷是档案署发的——军务出了事他们没有免责（场景：踩点时；被毁后备用：档案署的饷银发放簿）<\/li><li><strong>节点图<\/strong>：双入口：接兄长、或接档案署'监守自盗'式的默许（有人想借你们清掉真图）；环路：若昂拒走后先送半幅真图作投名状；双通路：潜入（送菜船）／律法（以'密档未编目'制造管辖纠纷）<\/li><li><strong>标签<\/strong>：阴谋·冒险｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：制图师若昂｜亏欠｜真水深图与行会人情<\/li><li><strong>史实<\/strong>：葡王室对西非航路档案严格保密（皮莱资《东方志》等被列为密档）<\/li><\/ul>\n<h4>Q06-04 拉各斯市场的证人（单场｜危险｜55 银（公式 20））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：随船神父的忏悔室：'今天市场上的第十七个人会讲葡语。他不是货物——至少他这么对我说的。我去不了，你替我去'（红线：制度阴影场景，不描写侮辱与暴力细节，焦点在人的选择）<\/li><li><strong>委托人<\/strong>：随船神父（安东尼奥修士）（误差：他说'只是问几句话'——修士想替那人赎身，但他没钱，他真正要的是让那人'开口作证'给教会写报告——证词会连累船上所有经手人）<\/li><li><strong>目标<\/strong>：见到那个人，弄清他的身份与意愿，并在日落前做出：赎、报官、或不作为——承担后果<\/li><li><strong>障碍<\/strong>：主要——市场执法队与船主的'货物完好'权；他主人的账本上他是死过一次的人；隐藏——他确实是酋长之子——但他要的不是赎身，是借船回海岸组织换回被掳的族人，'证人'身份是他自导的第一步<\/li><li><strong>代价<\/strong>：恶名／声望双轨（教会与商界各记一账）＋钱财（赎金与船期）<\/li><li><strong>回报<\/strong>：声望／恶名＋关系（修士／船主／其人三选）＋信息：西非内陆的掳掠链条<\/li><li><strong>三线索<\/strong>：1 他袖口内侧有一道仪式疤——不是奴隶营的手艺（场景：市场上；被毁后备用：通事认出族群的纹样）〔不掷骰可得〕；2 船主的货单上'第十七人'的来源栏是空的——黑账（场景：货单核对；被毁后备用：上一港的离港记录）；3 修士的报告底稿早写好了——日期是三天后，措辞已定（场景：修士的经桌；被毁后备用：教会档案房的文稿筐）<\/li><li><strong>溢价/总包<\/strong>：本卡以声望/恶名与关系结算为主——银只作均衡锚（公式基准 20 银）<\/li><li><strong>标签<\/strong>：人情·史诗｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：酋长之子｜亏欠或血债｜西非内陆掳掠链情报<\/li><li><strong>史实<\/strong>：1444 拉各斯奴隶拍卖（祖拉拉《发现与征服几内亚编年史》记载）<\/li><\/ul>\n<h4>Q07-01 首航的招募骗局（单场｜常规｜7 银（公式基准））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：帕洛斯港满街告示：西航招募水手，安家费预付——满港都是领了钱就没影的人<\/li><li><strong>委托人<\/strong>：船主平松家的招募管事（误差：他说'跑一个掮客'——掮客背后是本地的'挽留会'：渔家不想被西航抽走壮劳力，安家费骗局是集体行为）<\/li><li><strong>目标<\/strong>：追回已付的三十七份安家费，并让船三天内凑齐满员水手<\/li><li><strong>障碍<\/strong>：主要——全村口径一致，官府也不愿得罪渔村；隐藏——管事自己弟弟就是'挽留会'的——他不肯捅破，只想'追回点钱交差'<\/li><li><strong>代价<\/strong>：声望（港埠记档）＋钱财（安家费本金）<\/li><li><strong>回报<\/strong>：银＋关系（平松家）＋信息：港口劳力市场的真实价<\/li><li><strong>三线索<\/strong>：1 领钱人的签押是同一只手的三种写法——教书写字的人不多（场景：签押册；被毁后备用：村里唯一的代书先生）〔不掷骰可得〕；2 '挽留会'的集会日子就是教堂修缮日——人人有份（场景：教堂后院；被毁后备用：堂区的修缮账）；3 管事弟弟的渔船这三天'恰好'都泊在避风港——他在望风（场景：港内泊位；被毁后备用：渔行的泊位账）<\/li><li><strong>标签<\/strong>：市井·商战｜强度 轻｜遍地<\/li><li><strong>存留钩<\/strong>（季末入存留池）：挽留会｜结仇｜帕洛斯渔村的人力渠道<\/li><li><strong>史实<\/strong>：1492 帕洛斯—拉比达征募困难，平松家自筹补员<\/li><\/ul>\n<h4>Q07-02 叛逃证词的押送（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：圣多明各总督府的信使价目：'一份证词，八个人签的名，送回西班牙——路上不许它被'纠正''<\/li><li><strong>委托人<\/strong>：皇家访察官（judge de investigación）的文书（误差：他说'证词自愿'——八名'签名人'是叛逃水手，证词是在刑房门口签的，其中三人已翻供）<\/li><li><strong>目标<\/strong>：把证词文本（或三名翻供水手本人）完好送达塞维利亚港务法庭<\/li><li><strong>障碍<\/strong>：主要——哥伦布兄弟在殖民地的眼线比总督府的正规信使跑得快；隐藏——翻供的三人想上你们的船'亲自翻供'——带上他们，你们的船就成了'劫走王室证人'的船<\/li><li><strong>代价<\/strong>：声望（王室法庭记档）＋钱财（证词失效的连带）<\/li><li><strong>回报<\/strong>：银＋关系（访察官一系）＋信息：殖民地证词流水线内幕<\/li><li><strong>三线索<\/strong>：1 三名翻供者都申请了'随船作证'——法律上他们有权，政治上这是圈套（场景：港口文书房；被毁后备用：访察官的法律随员）〔不掷骰可得〕；2 哥伦布兄弟的眼线用'补船料'的名义天天在码头点船——点的是人（场景：圣多明各码头；被毁后备用：船料行的出货单）；3 证词正本用的火漆是访察官私印——按规程该用法院公印（场景：验封时；被毁后备用：殖民法院的用印台账）<\/li><li><strong>节点图<\/strong>：双入口：接访察官、或接哥伦布系'截下证词'的变体任务；环路：三人上船后改走'公开证人船'路线借舆论护身；双通路：律法（程序瑕疵）／航海（改航直回）<\/li><li><strong>标签<\/strong>：阴谋·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：三名翻供水手｜亏欠｜殖民地证词流水线内幕<\/li><li><strong>史实<\/strong>：1500 博巴迪利亚逮捕哥伦布兄弟回西班牙受审<\/li><\/ul>\n<h4>Q07-03 搁浅一年的对峙（短链｜危险｜105 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：不是委托——你们自己的船搁在牙买加北岸，救兵的独木舟队开出了价：'粮食、工具、还有那面会响的鼓'<\/li><li><strong>委托人<\/strong>：（无外部委托人：对岸酋长代表顶'委托人'槽）（误差：酋长代表说'粮食换工具，公道'——真正的价是船上那门炮：部落战争一触即发，谁有炮谁赢）<\/li><li><strong>目标<\/strong>：在船修好（或被放弃）前维持换粮供给线，不让 crew 内讧，不给也不抢那门炮<\/li><li><strong>障碍<\/strong>：主要——双方语言不通全靠手势与两个半吊子通事；坏血病开始点名；隐藏——船上有两人已私下答应'租炮'换提前回家的路——内讧的引线在你们自己甲板上<\/li><li><strong>代价<\/strong>：生死（给养断档即哗变）＋声望（与岛上人的长期关系）<\/li><li><strong>回报<\/strong>：声望＋船（修好即报酬）＋关系（部落）＋恶名（若炮外流）<\/li><li><strong>三线索<\/strong>：1 两个'志愿者'夜里在划独木舟量吃水——他们在画炮能架的滩位（场景：夜间甲板；被毁后备用：独木舟上的斧凿痕）〔不掷骰可得〕；2 酋长代表的'公道价'每旬涨一次——涨的是他对你们内部裂痕的判断（场景：换粮谈判；被毁后备用：通事的悄悄话）；3 船底破口的木板被海水泡开的程度——修好要两个月不是六周（场景：验船；被毁后备用：船匠的工料单）<\/li><li><strong>节点图<\/strong>：双入口：换粮线／'租炮'私线（叛徒视角）；环路：供给断档后以'月食之夜'或部落调解术重立权威；双通路：交涉（部落调解）／工程（提前修船离场）<\/li><li><strong>标签<\/strong>：冒险·人情｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：酋长代表｜盟约｜岛上换粮与向导网<\/li><li><strong>史实<\/strong>：1503–04 哥伦布第四次航行搁浅牙买加一年（'月食预言'母题留白给玩家）<\/li><\/ul>\n<h4>Q07-04 回程船的五分之一（单场｜危险｜42 银（公式 30））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：回程船靠港前夜，船上的王室核算官找你们：'船舱里的黄金账，差了两成。天亮前帮我对上——或告发我'<\/li><li><strong>委托人<\/strong>：王室驻船核算官（quinto 抽成官）（误差：他说'水手私藏'——实际是他自己批准了船长'多报损耗'，换了一笔在塞维利亚的置地钱）<\/li><li><strong>目标<\/strong>：天亮入港前，把两成的缺口做成'账面对得上'（或把证据送进港务法庭）<\/li><li><strong>障碍<\/strong>：主要——入港验舱按舱单顺序开箱，改舱只有半夜到天亮的时间；隐藏——船长的'损耗'里真有两箱是真的丢了——被大副倒给了岛上人换向导，链条上不知情的人比知情的多<\/li><li><strong>代价<\/strong>：声望／恶名双轨（王室法庭或船长帮会）＋钱财（封口与改账的行情）<\/li><li><strong>回报<\/strong>：银＋关系（核算官／船长二选一）＋信息：回程船的验舱流程<\/li><li><strong>三线索<\/strong>：1 大副的岛上'损耗'换回的是一袋没入账的鹦鹉螺——他舍不得扔（场景：大副的私舱；被毁后备用：船上少年看见过交易）〔不掷骰可得〕；2 核算官的置地契副本夹在他的《圣经》里——抄经纸背面是地契抄本（场景：核算官的书桌；被毁后备用：塞维利亚公证人处的登记）；3 验舱官的火把习惯从左舷开始——右舷的最后三箱总是'没时间细验'（场景：入港验舱；被毁后备用：验舱吏的徒弟知道习惯）<\/li><li><strong>节点图<\/strong>：双入口：帮着平账／替法庭收证；环路：半夜改舱被打断后借大副的鹦鹉螺补上'实物抵数'；双通路：商战（账目腾挪）／律法（证据链）<\/li><li><strong>标签<\/strong>：商战·阴谋｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：大副｜亏欠或结仇｜验舱流程的后门<\/li><li><strong>史实<\/strong>：王室 quinto（五分之一）抽成制与回程船账目舞弊并存<\/li><\/ul>\n<h4>Q08-01 子午线上的测绘队（短链｜常规｜50 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：佛得角港的征募牌：西葡联合核测队征护卫船——'两国官船互相不放心，雇中立的'<\/li><li><strong>委托人<\/strong>：联合核测队的双重监理（西一人葡一人）（误差：两位监理都说'只护星盘不问经度'——葡方监理的箱子里有一台没登记的改良象限仪，才是这趟真正的秘密）<\/li><li><strong>目标<\/strong>：护送测绘队完成佛得角群岛的纬度复核，双方对结果无异议<\/li><li><strong>障碍<\/strong>：主要——两国船员互相找茬，仪器淋一场雨就能吵一旬；隐藏——改良象限仪的读数会把'群岛归属'的参照点挪出去——葡方要的就是这个读数先归档<\/li><li><strong>代价<\/strong>：声望（两 crown 记档）＋钱财（护卫佣金）<\/li><li><strong>回报<\/strong>：银＋信息：子午线核测的第一手数据＋关系（两监理）<\/li><li><strong>三线索<\/strong>：1 象限仪的箱底垫着群岛的新海图——图上参照点画的圈比旧图偏了半分（场景：装船验箱；被毁后备用：仪器匠认得出自家的改良件）〔不掷骰可得〕；2 西监理的日志每晚锁进箱子——但他抄写过一份放船上娼寮当押金（场景：佛得角泊地；被毁后备用：娼寮妈妈的当票）；3 两监理的伙食各开各的——盐罐上的国徽磨损程度暴露谁先到任（场景：膳房；被毁后备用：军需采购的旧单）<\/li><li><strong>节点图<\/strong>：双入口：接西监理／接葡监理（各自的'额外任务'互斥）；环路：读数之争后借娼寮当票对冲日志；双通路：交涉（撮合联合署名）／商战（读数归档顺序）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：仪器匠｜亏欠｜改良读数与档案房关系<\/li><li><strong>史实<\/strong>：1494 托尔德西里亚斯条约以教皇子午线分海；1524 巴达霍斯会议双方各携制图师<\/li><\/ul>\n<h4>Q08-02 伪旗密使（短链｜危险｜125 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：亚丁的中间人递来两头信：'西边的船想挂着葡旗过曼德海峡，葡边的船想挂西旗——你挂哪面，另一面就是你的麻烦'<\/li><li><strong>委托人<\/strong>：卡斯蒂利亚王室密使（化名丝绸商）（误差：他说'只是旗号'——船上还有给摩鹿加叛逃葡商的特许状副本，那是谈判桌上不能见光的东西）<\/li><li><strong>目标<\/strong>：把密使与文本送抵摩鹿加外围的接头岛，全程未被葡方巡逻拿住把柄<\/li><li><strong>障碍<\/strong>：主要——葡巡逻艇认旗更认人——旗可以换，船员的口音换不了；隐藏——接头岛上的'叛逃葡商'其实是葡方反间谍放的饵——特许状到了岛上就到了里斯本<\/li><li><strong>代价<\/strong>：声望／恶名双轨（两 crown 各记一账）＋钱财（伪旗险）<\/li><li><strong>回报<\/strong>：银＋信息：摩鹿加谈判的密件内容＋关系（密使）<\/li><li><strong>三线索<\/strong>：1 '叛逃商'的仆人用葡语报菜名——流亡七年的人不该这么流利（场景：接头岛；被毁后备用：岛上商站的旧客名单）〔不掷骰可得〕；2 特许状副本的纸边有裁切痕——原件在某人手里被对折过（场景：验文本；被毁后备用：塞维利亚印度事务院的发文簿）；3 葡巡逻艇最近的查检总在'中立的船'身上花双倍时间——有人给了他们一张船型单（场景：过海峡时；被毁后备用：巡逻队口粮的采购账）<\/li><li><strong>节点图<\/strong>：双入口：接密使／接葡方反间谍'送饵上门'（明知故送的反向玩法）；环路：接头岛是饵后改走苏禄海侧岛链换人；双通路：智取（口音与纸边）／武力（抢先烧特许状脱责）<\/li><li><strong>标签<\/strong>：阴谋·商战｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：密使｜亏欠｜摩鹿加密件网<\/li><li><strong>史实<\/strong>：摩鹿加归属谈判（1524–29）期间双方间谍与伪旗活动频繁<\/li><\/ul>\n<h4>Q08-03 谈判桌上的地图战（单场｜常规｜35 银（公式 25））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：巴达霍斯会议的外围雇船牌：'护送制图师代表团。不限国。先到先得'（两国各出一张牌，你们任选）<\/li><li><strong>委托人<\/strong>：西（或葡）方代表团书记官（误差：书记官说'图只是图'——他行囊里那张'修改稿'的改动不是划界，是把一艘沉船的位置挪进了对方水域——沉船里有一船未登记的珍珠）<\/li><li><strong>目标<\/strong>：护送本方制图师与'图纸'安全入场，谈判桌上不落下风<\/li><li><strong>障碍<\/strong>：主要——对方也雇了船也在改图——你们在桌面外先打一场'图对图'；隐藏——珍珠沉船的位置真正的知情人是本地引水员世家——两家都在抢他们家的人<\/li><li><strong>代价<\/strong>：声望（crown 记档）＋钱财（代表团佣金）<\/li><li><strong>回报<\/strong>：银＋信息：谈判桌攻防全记录＋关系（制图师世家）<\/li><li><strong>三线索<\/strong>：1 '修改稿'的墨色比别的线条新——沉船标记是最后描上去的（场景：验图；被毁后备用：制图师行会的存底图）〔不掷骰可得〕；2 引水员世家的老人近来被两家各请了一回酒——他谁也没答应，他在等谁先出'船'作聘礼（场景：巴达霍斯酒馆；被毁后备用：他孙子的学徒文书）；3 书记官的行囊夹层衬着圣徒像——像框背面是划界用的对照表（场景：行囊检查；被毁后备用：会议秘书处的物品清单）<\/li><li><strong>节点图<\/strong>：双入口：西／葡任一方（互斥）；环路：图被对方识破后抢先把引水员世家'聘'上船；双通路：商战（图与存底对拍）／交涉（聘礼船）<\/li><li><strong>标签<\/strong>：商战·阴谋｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：引水员世家｜聘礼未清｜群岛水路口述海图<\/li><li><strong>史实<\/strong>：1524 巴达霍斯—埃尔瓦斯会议'地图战'（双方当场出示与质疑海图）<\/li><\/ul>\n<h4>Q08-04 一船丁香两纸契（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：塞维利亚商会与里斯本商行的代理在码头扭作一团：同一船丁香，两家各持一份'独家收购契'<\/li><li><strong>委托人<\/strong>：（双委托人：两代理先后递契——接谁哪份都收，内容自辨）（误差：两纸契都是真的——真问题在船东：他把船'抵押'给了第三方，谁先在法庭登记扣船，契就是废纸）<\/li><li><strong>目标<\/strong>：让你们护送的那份契先落地：货按契交割，另一家的索赔不落在你们头上<\/li><li><strong>障碍<\/strong>：主要——两港法庭的'登记时限'只差一天，航速与文书同赛；隐藏——船东自己正等着两家中的一方扣船——扣船即触发保险，他就能从抵押里赎回船<\/li><li><strong>代价<\/strong>：钱财（押金与延误罚金）＋声望（商会记档）<\/li><li><strong>回报<\/strong>：银＋关系（落地的一方）＋信息：跨 crown 契约的登记漏洞<\/li><li><strong>三线索<\/strong>：1 船东的抵押契登记日就是'扣船窗口'的最后一天——他比谁都懂法庭日历（场景：验船契；被毁后备用：两港法庭的登记簿）〔不掷骰可得〕；2 丁香舱的测温签三天没换——船东不在乎货，货只是由头（场景：货舱；被毁后备用：船医的温湿记录）；3 两代理的授权书用的都是母公司旧章——新章都在路上，'时效'是空窗（场景：验授权书；被毁后备用：母公司的用印通知）<\/li><li><strong>节点图<\/strong>：双入口：塞维利亚契／里斯本契（互斥）；环路：法庭日历追不上后走仲裁人私下调停；双通路：律法（登记竞速）／商战（戳穿船东的保险局）<\/li><li><strong>标签<\/strong>：市井·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：船东｜结仇（坏了他的局）｜保险与抵押的门路<\/li><li><strong>史实<\/strong>：香料专营契约的跨 crown 纠纷与仲裁（S3 常态）<\/li><\/ul>\n<h4>Q09-01 两头悬赏的海面（短链｜危险｜135 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：卡利卡特港两头都在发赏格：扎莫林悬赏'红袍船'的航路情报，葡舰队悬赏'勾结回教商人的港绅'名单——有人想请你们'两边都看看'<\/li><li><strong>委托人<\/strong>：当地殷实行商（葡语称'中间人'的谢蒂）（误差：他说'只是看看'——他真正要的是借你们的报告把私仇对象塞进两边名单，借刀杀人）<\/li><li><strong>目标<\/strong>：交出一份'两边都收货'的情报报告，且报告里的名字不被你们良心或法庭推翻<\/li><li><strong>障碍<\/strong>：主要——海面上米里号事件的余波未平，任何单船都可能被两边同时视为敌船；隐藏——谢塞（谢蒂）名单上的第一个名字是他自己的债主——债主手里有他私通葡方的信<\/li><li><strong>代价<\/strong>：恶名／声望双轨（马拉巴尔两岸各记一账）＋钱财（双份赏格）<\/li><li><strong>回报<\/strong>：银＋信息：两岸的赏格网络＋恶名<\/li><li><strong>三线索<\/strong>：1 债主手里的信用的还是谢蒂的私章——章尖磕了一个角（场景：谢蒂书房；被毁后备用：港务公证处的用章底样）〔不掷骰可得〕；2 葡巡逻艇近月只拦'单桅帆'——他们收到的'敌情'全指向小型船（场景：海面；被毁后备用：被拦船主的口供）；3 扎莫林宫的赏格文书用的墨掺了金粉——只有'国书级'才用（场景：验赏格；被毁后备用：宫廷文书房的墨料账）<\/li><li><strong>节点图<\/strong>：双入口：接谢蒂／直接向葡舰队兜售情报（互斥）；环路：名单酿祸后以债主的信反将谢蒂一军赎声望；双通路：商战（情报定价）／律法（私章鉴定）<\/li><li><strong>标签<\/strong>：战争·阴谋｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：谢蒂｜结仇（债主信在你们手里）｜马拉巴尔情报网<\/li><li><strong>史实<\/strong>：1502 卡利卡特近海米里号（朝圣船）被葡舰焚毁，两岸仇杀升级<\/li><\/ul>\n<h4>Q09-02 果阿的头一个月（短链｜常规｜35 银（公式 25））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：果阿新总督府的告示贴在曼德维码头：'一切物资现银收购，价格从优'——'从优'的意思是，谁运到谁定价<\/li><li><strong>委托人<\/strong>：葡萄牙驻果阿要塞军需（名义上是'总司令私人代表'）（误差：他说'城稳粮足'——刚打下的城还在流行病与断粮的双重边缘，官方粮仓空得能跑马）<\/li><li><strong>目标<\/strong>：把一船给养（粮、酒、建材）运进果阿并以现银结清<\/li><li><strong>障碍<\/strong>：主要——旧城水道沉船未清，入港要趁大潮；城里'征用令'随时可能让你们的货变成'捐输'；隐藏——军需的现银是打给意大利银行家的远期票——兑现要等下一班回程船，中间若出事，银票作废<\/li><li><strong>代价<\/strong>：钱财（银票风险）＋声望（新殖民当局记档）<\/li><li><strong>回报<\/strong>：银＋关系（总督府）＋信息：果阿重建的采购清单（后续生意的单子）<\/li><li><strong>三线索<\/strong>：1 银票的背书行是热那亚商号——热那亚人从不为'新辟地'做无抵押背书（场景：验银票；被毁后备用：银行家驻果阿的代办）〔不掷骰可得〕；2 沉船碍航的位置每旬被浮标重标——标的人按大船吃水标，小船反而吃亏（场景：入港水道；被毁后备用：港务浮标登记）；3 '征用令'的空白色号与总督府公文纸一致——印好待填（场景：城内文房；被毁后备用：印坊的订单）<\/li><li><strong>节点图<\/strong>：双入口：接军需／替本地商人行会'抢在征用前'卸货；环路：银票兑现难时以货易地契（殖民地 early-bird 特权）；双通路：商战（抢潮入港）／交涉（免征用）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：军需代办｜记档｜重建采购清单的后续单<\/li><li><strong>史实<\/strong>：1510 阿尔布克尔克两取果阿，初据期补给极度困难<\/li><\/ul>\n<h4>Q09-03 绕开垄断的威尼斯线（长线｜危险｜520 银（公式 600））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：威尼斯的旧关系辗转递话：'共和国想知道红海—阿拉伯那条旧线还能不能走通。要一双干净的脚，从果阿走回亚丁'<\/li><li><strong>委托人<\/strong>：威尼斯驻果阿密探（身份是首饰商）（误差：他说'只为通商'——共和国真正想要的是苏丹联合舰队的船厂坐标，通商是幌子）<\/li><li><strong>目标<\/strong>：以商人身份完成果阿—亚丁线的往返，带回'此路是否还活着'的完整证据（税、护航、库存、人心）<\/li><li><strong>障碍<\/strong>：主要——葡方反间谍在果阿到霍尔木兹一线布了'信任网'——他们会慢慢包围可信的新面孔；隐藏——亚丁的对接人已被人收买——'证据'会是真的，结论会被剪辑成苏丹想要的版本<\/li><li><strong>代价<\/strong>：生死（两边的间谍下场都是海）＋声望（共和国记密档）<\/li><li><strong>回报<\/strong>：银＋信息：红海线的全部一手数据＋关系（威尼斯）<\/li><li><strong>三线索<\/strong>：1 对接人给的'税单'数字分毫不差——真的税单永远有涂改（场景：亚丁税关；被毁后备用：税关书吏的誊抄习惯）〔不掷骰可得〕；2 果阿'信任网'的每一步邀请都先于你们的行程半日——有人能读到你们的船期（场景：沿途各港；被毁后备用：港务公示的到港牌）；3 苏丹舰队的'新船坞'在老船坞的下游——下游排的木屑是新松木，老港只进硬木（场景：红海沿岸；被毁后备用：木材商的采购路线）<\/li><li><strong>节点图<\/strong>：双入口：接威尼斯／被葡方反间谍'反向招募'（变体任务：钓威尼斯线）；环路：对接人被收买后以'誊抄习惯'取证并另走苏伊士旧渠水道；双通路：间谍（取证）／商战（以真实通商数据自证）<\/li><li><strong>溢价/总包<\/strong>：生死长线顶格：另含共和国'红印'密档身份作价（对接 10.8 声望表上层）（公式基准 600 银）<\/li><li><strong>标签<\/strong>：阴谋·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：亚丁对接人｜双料｜红海线的真数据<\/li><li><strong>史实<\/strong>：威尼斯—马穆鲁克屡谋夺回印度洋航线情报（1500s）<\/li><\/ul>\n<h4>Q09-04 马纳尔的采买季（短链｜常规｜48 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：采买季的公告牌：'珠场开放。潜水人、船位、官秤、庙钱——价随行就市，账当场清'<\/li><li><strong>委托人<\/strong>：果阿珠商行会的采买执事（误差：他说'潜水人自愿下水'——采买季的潜水人一半是抵债的，'自愿'由债主定义，本季已有三名没上来）<\/li><li><strong>目标<\/strong>：完成本季三舱珍珠的采买配额并离场，账面不亏<\/li><li><strong>障碍<\/strong>：主要——官秤、庙钱、船位费三重抽成； rival 珠商抬价抢货；隐藏——执事配额里藏着一批'死珠'（过捕捞期的陈货）充新珠——验货人下一季才到，他要在验货前脱手<\/li><li><strong>代价<\/strong>：钱财（配额与死珠连坐）＋声望（行会记档）<\/li><li><strong>回报<\/strong>：银＋关系（潜水人社群——若你们善待他们）＋信息：珠场债务链<\/li><li><strong>三线索<\/strong>：1 陈珠的虹光发闷——对光转半圈，新珠活陈珠死（场景：验珠台；被毁后备用：行会老验珠师的口诀）〔不掷骰可得〕；2 潜水人的'自愿'契按了红印——印泥是债主家供给的（场景：抵债契；被毁后备用：村庙的施舍簿（反向名单））；3 执事的货箱里垫着上季的价签——本季的'行情'是他背的旧账（场景：货箱；被毁后备用：上季行会公示价）<\/li><li><strong>节点图<\/strong>：双入口：接执事／接潜水人社群的'换债主'请求；环路：死珠被识破后以'替行会自己补配额'化解；双通路：商战（验珠压价）／人情（替潜水人赎契换好货）<\/li><li><strong>标签<\/strong>：人情·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：潜水人社群｜亏欠（若赎契）｜死珠与新珠渠道<\/li><li><strong>史实<\/strong>：马纳尔湾珍珠渔业采买季制度（葡据期由王室与教会分肥）<\/li><\/ul>\n<h4>Q10-01 圣胡利安的夜（单场｜危险｜85 银（公式 40））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：没有委托——旗舰在圣胡利安港过冬，叛乱船在子夜举事，三名船长把两条路摆在你们面前：'站过来'或'被捆起来'<\/li><li><strong>委托人<\/strong>：（委托人槽由变节船长缅诺萨顶——或拒绝他后由皇家司库顶）（误差：船长说'舰队欠饷，我们只是讨账'——圣胡利安港的过冬淡水配给早已被他的人控制，'讨账'背后是断水逼反）<\/li><li><strong>目标<\/strong>：天亮前站定一边，让舰队还有'舰队'的样子<\/li><li><strong>障碍<\/strong>：主要——夜战、结冰的缆绳、以及'谁控制淡水驳船谁控制谈判'；隐藏——司库早已把国帑沉进了他的私舱——'欠饷'是真的，但钱不是没了，是换了个地方<\/li><li><strong>代价<\/strong>：生死＋恶名／声望双轨（王室史书或叛乱者传说）<\/li><li><strong>回报<\/strong>：声望／恶名＋信息：舰队账目真相＋关系（司库或船长团）<\/li><li><strong>三线索<\/strong>：1 淡水驳船的缆绳被换成了细一半的——随时能割（场景：泊地；被毁后备用：驳船夫的换绳工单）〔不掷骰可得〕；2 司库私舱的锁是新换的——船上的木匠没接过这单活（场景：旗舰货舱；被毁后备用：木匠的工单簿）；3 变节船长团的'欠饷账'用旗舰格式誊写——叛乱者不该有官方纸（场景：叛船；被毁后备用：旗舰文书房的纸张库存）<\/li><li><strong>节点图<\/strong>：双入口：船长团／皇家司库（互斥）；环路：站错边后连夜'反正'献淡水驳船为投名状；双通路：武力（夺驳船）／智取（揭私舱）<\/li><li><strong>溢价/总包<\/strong>：含'王室史书或叛乱者传说'的名声作价（公式基准 40 银）<\/li><li><strong>标签<\/strong>：战争·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：司库或船长团｜名单上的一笔｜舰队账目真相<\/li><li><strong>史实<\/strong>：1520.4 圣胡利安港复活节叛乱（被镇压，两船长处刑）<\/li><\/ul>\n<h4>Q10-02 十八个人的证词（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：塞维利亚码头的隐性行情：'维多利亚'号回来的十八个人，一句话值十银——问题是每个人身后站着不同的买家<\/li><li><strong>委托人<\/strong>：王室印度事务院的史官（要官方版本）（误差：史官说'只是录口供'——他要的不是口供是'修订'：麦哲伦的死要写成'与土人冲突'而非'介入部落战争'，否则王室的抚恤逻辑崩盘）<\/li><li><strong>目标<\/strong>：替一位幸存者（你们选：舵手／书记／叛逃归来的水手）完成一份'能见人'的证词并交付买家<\/li><li><strong>障碍<\/strong>：主要——三位买家（王室史官／意大利资助人代理人／麦哲伦遗孀）对'真相'的定义互斥；隐藏——那位'叛逃归来'的水手身上有麦哲伦最后航海日志的抄件——三家人要的其实都是它<\/li><li><strong>代价<\/strong>：声望（史学界记档）＋钱财（证词行情）<\/li><li><strong>回报<\/strong>：银＋文书（日志抄件？）＋关系（三选一）＋信息：环球航行的财务真相<\/li><li><strong>三线索<\/strong>：1 日志抄件的纸色比幸存者的行囊新——它是回来后誊的，原件另有下落（场景：幸存者住处；被毁后备用：托莱多旧书商的收货簿）〔不掷骰可得〕；2 史官的'修订'批注集中在麦哲伦死因的三段——别处一字未动（场景：口供草稿；被毁后备用：印度事务院的审读规程）；3 遗孀付定金用的不是银是珍珠——麦哲伦航行带的'样品货'（场景：遗孀宅；被毁后备用：宫廷珠宝商的鉴定条）<\/li><li><strong>节点图<\/strong>：双入口：替史官／替遗孀（互斥）；环路：三方拉扯后以'三方共用抄本'做局中局；双通路：律法（口供程序）／商战（抄本定价）<\/li><li><strong>标签<\/strong>：阴谋·史诗｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：幸存者｜亏欠｜日志抄件的下落<\/li><li><strong>史实<\/strong>：1522 维多利亚号归航，18 幸存者（另有 12 名被葡方扣押后归还）<\/li><\/ul>\n<h4>Q10-03 划界前夜的最后一船丁香（短链｜危险｜145 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：蒂多蕊岛的熔金炉边有人递话：'条约一生效，这里的丁香就是'另一家'的。35 万金达克特买断生效前——有一船的空位'<\/li><li><strong>委托人<\/strong>：葡方香料承包商的驻岛管事（误差：他说'最后一船，合法抢运'——抢运的真正买主是西班牙人的代理人：条约签了，买走的这船会让条约'香料折价'的估值虚高，西岸好抬价）<\/li><li><strong>目标<\/strong>：赶在条约生效日前满船丁香离岛，并在生效日后完税——'合法'与'占便宜'的边界由你们踩<\/li><li><strong>障碍<\/strong>：主要——群岛封锁巡查在生效日零点换班——窗口只有一段潮；隐藏——岛上的丁香是两户苏丹家族的——你们装船的那一半属于没同意的那户，出了岛才是'无主抢运'<\/li><li><strong>代价<\/strong>：钱财（满船丁香本钱）＋恶名（岛上一户记仇）<\/li><li><strong>回报<\/strong>：银＋信息：丁香采买与划界条款的互动＋恶名<\/li><li><strong>三线索<\/strong>：1 同意装船的户主按的是蓝印——岛上通用红印，蓝印是'借据'不是'授权'（场景：装船文书；被毁后备用：苏丹府的印色规矩）〔不掷骰可得〕；2 换班的巡查艇比旧班多一条——多的是'税艇'，生效日前它不拦船（场景：过封锁线；被毁后备用：税艇水手的闲谈）；3 管事的'买主'信函落款是西式双横线——葡式信函不用双横线（场景：验信；被毁后备用：接头岛的文书先生）<\/li><li><strong>节点图<\/strong>：双入口：葡管事／岛上被'借据'的一户（反向：护住丁香别上船）；环路：被一户阻拦后以税艇换班线绕开岛内纠纷；双通路：商战（抢潮）／交涉（补签蓝印为契）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：蓝印户主｜结仇或契约｜群岛丁香产量底数<\/li><li><strong>史实<\/strong>：1529 萨拉戈萨条约：葡以 35 万金达克特取得摩鹿加<\/li><\/ul>\n<h4>Q10-04 驻点在两苏丹之间（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：特尔纳特港的华商牙人递单：'有位葡商要在岛上设采买驻点，缺一条懂规矩的船——'规矩'就是别站错苏丹'<\/li><li><strong>委托人<\/strong>：特尔纳特的华商牙人（受葡商所托）（误差：牙人说'两位苏丹一视同仁'——特尔纳特苏丹刚在蒂多蕊的堡垒里做客，'做客'的意思是没跑出来，此岛当前只有一位苏丹说了算）<\/li><li><strong>目标<\/strong>：替采买驻点完成首批丁香收购，并在岛上的权力真空中把'驻点'合法化<\/li><li><strong>障碍<\/strong>：主要——单边授权随时可能因'苏丹回来'而作废；另一苏丹的海上力量在岛外围猎；隐藏——牙人自己囤着一批'战前价'丁香——驻点一开，他的囤货就不值钱了，他需要你们'失败'<\/li><li><strong>代价<\/strong>：钱财（驻点开办费）＋声望（群岛商圈记档）<\/li><li><strong>回报<\/strong>：银＋关系（特尔纳特苏丹府／牙人二选一）＋信息：群岛丁香产量的真实底数<\/li><li><strong>三线索<\/strong>：1 牙人的囤货藏在产丁香的丁香的'丁'字货栈——他自己就是最大产户（场景：货栈；被毁后备用：牙人的双本账）〔不掷骰可得〕；2 苏丹府的授印文书用的火漆掺了丁香粉——防伪也宣示'主权'（场景：验文书；被毁后备用：岛上香料官的配方）；3 蒂多蕊苏丹的信使每旬到外海浮标换信——他没有断联，只是换了个'收信人'（场景：外海浮标；被毁后备用：信使的独木舟租赁账）<\/li><li><strong>节点图<\/strong>：双入口：接牙人／直接向苏丹府自荐；环路：牙人使绊后以其囤货为质反推驻点开工；双通路：商战（戳穿囤货局）／交涉（苏丹府直采）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：牙人｜结仇（囤货被戳）｜特尔纳特府上门路<\/li><li><strong>史实<\/strong>：特尔纳特—蒂多蕊两苏丹借葡西势力互斗（16 世纪常态）<\/li><\/ul>\n<h4>Q11-01 回程线的敢死水手（短链｜危险｜110 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：阿卡普尔科码头的告示：'东行船已满员。回程（西行）线招敢死水手——先例：上一班回来了'<\/li><li><strong>委托人<\/strong>：大帆船船务长（乌达内卡的旧部）（误差：他说'先例回来了'——先例'回来'是靠把一半水手的水配给减半，此事记在航海日志他不给看的后半本）<\/li><li><strong>目标<\/strong>：完成回程线的首段（阿卡普尔科—关岛）：全员存活率不低于八成<\/li><li><strong>障碍<\/strong>：主要——五个月不见陆地的水配给与坏血病点名；隐藏——船务长的'后半本日志'其实是他的私人保险——他打算在关岛'病退'下船，把烂摊子留给大副<\/li><li><strong>代价<\/strong>：生死＋声望（跨太平洋线的水手身价）<\/li><li><strong>回报<\/strong>：银＋声望＋信息：回程线的风带与补给实测＋关系（大副）<\/li><li><strong>三线索<\/strong>：1 后半本日志的纸边有指痕——常翻的几页都在水配给段（场景：船务长舱；被毁后备用：前半本日志的抄写员）〔不掷骰可得〕；2 大副的水桶刻度比别人的深——他也在偷偷记自己的账（场景：淡水舱；被毁后备用：桶匠的刻度单）；3 '病退'的医疗文书用的是岸上格式——船上的病册没有这一栏（场景：医疗箱；被毁后备用：船医的用药记录）<\/li><li><strong>节点图<\/strong>：双入口：应征水手／应征大副副手（位置互斥）；环路：配给危机后借'日志后半本'发动船员合议；双通路：航海（风带与配给管理）／交涉（船员合议逼宫）<\/li><li><strong>标签<\/strong>：冒险·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：大副｜亏欠｜后半本日志与船员合议<\/li><li><strong>史实<\/strong>：1565 乌达内卡发现太平洋回流（kuroshio 回程带），开启回程航线<\/li><\/ul>\n<h4>Q11-02 对大帆船的私掠诱惑（短链｜生死｜590 银（公式 500））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：普利茅斯的私酒馆里，一张手写的委托：'年贡白银的船，单船，无护航，走北纬三十度。执照我有，船你有吗'<\/li><li><strong>委托人<\/strong>：持王室私掠执照的乡绅船长（误差：他说'单船无护航'——大帆船已改挂武装商船籍，炮位翻倍，情报是两年前的；他要么不知道，要么在拿你们的船当试探）<\/li><li><strong>目标<\/strong>：完成一次对大帆船的拦截评估（接敌—确认—脱离），或完成整次劫掠（由你们掂量）<\/li><li><strong>障碍<\/strong>：主要——大帆船的武装与太平洋试航线的不可预测性；隐藏——执照的真实签发日期早于宣战日——这场'私掠'在文书上是海盗，他需要你们先开第一炮，制造'既成事实'<\/li><li><strong>代价<\/strong>：生死＋恶名／声望双轨（两国名单与史书）<\/li><li><strong>回报<\/strong>：银（战利品分成）＋信息：大帆船武装升级的情报＋恶名风险<\/li><li><strong>三线索<\/strong>：1 执照火漆的年份戳是旧铸模——新模去年就换了（场景：验执照；被毁后备用：铸印局的模具登记）〔不掷骰可得〕；2 '无护航情报'的纸色发黄——两年前的港务抄件（场景：情报来源；被毁后备用：港务抄件的编号）；3 乡绅船长的炮弹采购单比口径少一号——他在等你们的船先'借'他炮（场景：军械舱；被毁后备用：军械商的出货单）<\/li><li><strong>节点图<\/strong>：双入口：接乡绅／向马尼拉当局'卖掉这次拦截计划'（反向）；环路：确认武装升级后以'评估报告'全身而退；双通路：航海（拦截—脱离）／律法（执照日期）<\/li><li><strong>溢价/总包<\/strong>：生死长线顶格：战利品分成另计（总包口径，对接 10.5 战利品生成器）（公式基准 500 银）<\/li><li><strong>标签<\/strong>：战争·史诗｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：乡绅船长｜结仇或同谋｜执照日期把柄<\/li><li><strong>史实<\/strong>：1579 德雷克劫'卡卡弗戈'号（年贡船），劫获白银约 26 吨<\/li><\/ul>\n<h4>Q11-03 涧内的双面商（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：马尼拉涧内（Parián）的帖子：'明商林家缺一条'不显眼'的船——丝货出海，白银回笼，两头都要稳'<\/li><li><strong>委托人<\/strong>：涧内明商林家的账房先生（误差：他说'货是自己的'——一半丝货是替月港官眷代持的'寄名货'，官面上这些货'不存在'）<\/li><li><strong>目标<\/strong>：完成一季'丝出银回'的跑单，两头账目都不见光<\/li><li><strong>障碍<\/strong>：主要——西/明两边的查缉节奏错位——同一批货要在两个'不可能'的窗口里各过一道关；隐藏——代持的官眷用这批货洗的是'赈灾银'——银子上若有记号，两头都是死罪<\/li><li><strong>代价<\/strong>：钱财（两头押金）＋恶名（任一头查获）<\/li><li><strong>回报<\/strong>：银＋关系（林家）＋信息：涧内的代持与洗银手法<\/li><li><strong>三线索<\/strong>：1 银锭的铭文被锉过——锉痕下还有一层旧铭（场景：收银时；被毁后备用：马尼拉银匠的锉工账）〔不掷骰可得〕；2 '寄名货'的箱单写的是' sample only '——样品不该有 300 箱（场景：装货时；被毁后备用：涧内商会的箱单存根）；3 查缉官的巡视每月两次，总在市况条更新后一天——他也在看行情（场景：涧内；被毁后备用：市况条誊抄员的兼职）<\/li><li><strong>节点图<\/strong>：双入口：接林家／接查缉官的'钓鱼'变体；环路：记号银暴露后走银匠重熔线补链；双通路：商战（窗口错位）／交涉（官眷直接开口）<\/li><li><strong>标签<\/strong>：商战·阴谋｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：林家账房｜亏欠｜官眷代持的门路<\/li><li><strong>史实<\/strong>：马尼拉涧内（Parián）华商区与大帆船贸易的白银—丝绸交换<\/li><\/ul>\n<h4>Q11-04 '沉没'的丝绸（短链｜危险｜98 银（公式 75））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：保险行的红字公告：'圣伊尔德丰索号，月外失联， presumed lost '——但澳门黑市上周就出现了它的丝<\/li><li><strong>委托人<\/strong>：马尼拉承保保单的保险行查勘员（误差：他说'找证据'——查勘员自己签过这条船的'超载放行'，他要的是把证据指向'海盗'而不是'超载'，保单赔付条款才用得上）<\/li><li><strong>目标<\/strong>：查清丝绸是从哪条'沉船'里上岸的，并把证据交到出价人手里（保司、船长、或海关——任选）<\/li><li><strong>障碍<\/strong>：主要——黑市的链条：渔船接货—小岛转手—澳门销赃，每一段都换船；隐藏——船是真'沉'过一次——在转手小岛的背风处被故意压舱坐沉，打捞后'再沉一次'给保司看<\/li><li><strong>代价<\/strong>：钱财（证据行情）＋恶名（黑市记仇）<\/li><li><strong>回报<\/strong>：银＋信息：诈保—销赃全链＋关系（保司／海关）<\/li><li><strong>三线索<\/strong>：1 黑市丝的捆绳是船上的旧缆改制——缆绳的'船名结'还在（场景：澳门黑市；被毁后备用：缆绳匠认得自家打结手法）〔不掷骰可得〕；2 '沉没点'的测深数据与海图对不上——浅了六寻，是坐沉不是沉没（场景：出事海域；被毁后备用：当地渔家的暗礁名册）；3 查勘员的'超载放行'签单日期比公告失联日早四个月——保单生效前他已知道超载（场景：保司档房；被毁后备用：港务吨位丈量单）<\/li><li><strong>节点图<\/strong>：双入口：保司委托／船长方的'平事'委托（互斥）；环路：缆绳结线索断后以测深数据反推坐沉点；双通路：侦探（物证链）／商战（证据定价）<\/li><li><strong>标签<\/strong>：阴谋·商战｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：查勘员｜复杂｜坐沉点测深数据<\/li><li><strong>史实<\/strong>：大帆船贸易中的沉没保险与欺诈（保单与查勘制度并存）<\/li><\/ul>\n<h4>Q12-01 首航募股的'印度专家'（短链｜常规｜45 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：伦敦 Founder's Hall 外的告示：'冒险家对东印度贸易公司募股'——人群里那位自称'在果阿住过十年'的先生正在收'咨询费'<\/li><li><strong>委托人<\/strong>：公司发起董事会的临时书记（受雇核实'专家'背景）（误差：书记说'只是核实'——他自己的入职担保人是那位'专家'的小舅子，核实出问题他先丢差事）<\/li><li><strong>目标<\/strong>：核实'专家'的果阿履历真伪，并在募股结束前公示（或不公示）结论<\/li><li><strong>障碍<\/strong>：主要——'专家'的履历滴水不漏——每一处都有'旁证'；隐藏——所有旁证出自同一个笔迹：'专家'自己——他给二十年前果阿的旧相识都'代笔'过回信<\/li><li><strong>代价<\/strong>：钱财（股金损失风险）＋声望（公司圈记档）<\/li><li><strong>回报<\/strong>：银＋关系（发起董事会）＋信息：募股文书的核验手法<\/li><li><strong>三线索<\/strong>：1 '旁证'信的火漆都是同一家文具行买的——果阿买不到伦敦的蜡（场景：验信；被毁后备用：文具行的采购簿）〔不掷骰可得〕；2 '专家'的果阿'旧照会'没有一份盖过葡式行政印——全是商号私章（场景：照会；被毁后备用：果阿公证人处的备案）；3 书记的担保信夹在他母亲的《圣经》里——小舅子的笔迹认得出来（场景：书记家；被毁后备用：小舅子的旧账本）<\/li><li><strong>节点图<\/strong>：双入口：接书记／接'专家'的'封口'出价（互斥）；环路：笔迹线断裂后借公司老船员的口述对照履历；双通路：侦探（笔迹与蜡）／商战（募股现场对质）<\/li><li><strong>标签<\/strong>：商战·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：临时书记｜亏欠｜募股核验手法<\/li><li><strong>史实<\/strong>：1599 年伦敦对东印度贸易募股，1600 年获 charter<\/li><\/ul>\n<h4>Q12-02 安汶的证人（短链｜生死｜580 银（公式 300））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：万丹的英国商站后门，一个浑身缠布条的人递出半页名单：'安汶来的。名单上还活着的，还剩我一个没被审过。VOC 的船在找这页纸'（红线：刑求不描写，只呈现后果与文书）<\/li><li><strong>委托人<\/strong>：东印度公司（EIC）万丹商站长（误差：他说'送他去巴达维亚作证'——站长真正要的是证人'在路上自然死亡'：这份证词一旦成文，公司和王室都得跟 VOC 摊牌，商站承受不起）<\/li><li><strong>目标<\/strong>：把证人（或他的证词）送到巴达维亚／伦敦任一法庭，全程他活着、文书完整<\/li><li><strong>障碍<\/strong>：主要——VOC 的巡逻艇与'友好商船'布网；证人随时可能死于伤势；隐藏——名单上'活着'的其实还有一人——在 VOC 旗舰上当文书，他若作证，证词才完整；营救他是唯一能'完整'的路径<\/li><li><strong>代价<\/strong>：生死＋声望（两国法庭记档）＋恶名（VOC 记仇）<\/li><li><strong>回报<\/strong>：银＋信息：安汶事件完整名单＋关系（EIC 一系）<\/li><li><strong>三线索<\/strong>：1 商站长的'护送方案'绕开了所有有英国船的港口——绕开的就是能保命的（场景：商站计划图；被毁后备用：万丹港的泊位簿）〔不掷骰可得〕；2 VOC 旗舰文书的家信每月经巴达维亚转——信里从无家事，全是药品请求（场景：巴达维亚邮房；被毁后备用：邮房的转运登记）；3 证人伤口的敷料是药用水平——他沿途一直有人照应，直到商站（场景：证人伤处；被毁后备用：随船药房的领用单）<\/li><li><strong>节点图<\/strong>：双入口：送证人／截证词（VOC 视角变体）；环路：商站长使绊后改走'民间病船'路线；双通路：潜行（船期躲网）／律法（在第三国法庭立案）<\/li><li><strong>溢价/总包<\/strong>：生死长线顶格：含两国法庭'出庭作证'的声望与保障作价（总包口径）（公式基准 300 银）<\/li><li><strong>标签<\/strong>：阴谋·战争｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：VOC 旗舰文书｜亏欠｜完整名单的关键一环<\/li><li><strong>史实<\/strong>：1623 安汶屠杀（Amboyna massacre），英荷关系的历史节点<\/li><\/ul>\n<h4>Q12-03 布雷达的三张保单（单场｜危险｜42 银（公式 30））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：阿姆斯特丹交易所的廊柱下，三位持单人在吵：同一船布被布雷达围城的军需'征用'了，三张保单都说自己承保了这船布<\/li><li><strong>委托人<\/strong>：阿姆斯特丹保险行公会仲裁处（三张单都要'有个说法'）（误差：仲裁处说'按单办事'——其中一张单的承保人是公会的副主席，他要用这单的赔付掩盖公会偿付金的挪用）<\/li><li><strong>目标<\/strong>：三张保单的承保顺序与货物归属当庭厘清，公会不出丑闻<\/li><li><strong>障碍<\/strong>：主要——三张单的起保日只差六天，而'征用'那天的货物位置有三份矛盾的报关；隐藏——被'征用'的布根本没进布雷达——军需官收了钱签了收据，布在鹿特丹的仓库里，等赔付落定再出手<\/li><li><strong>代价<\/strong>：钱财（赔付连带）＋声望（保险圈记档）<\/li><li><strong>回报<\/strong>：银＋关系（公会／船东）＋信息：战时征用与保险的互动漏洞<\/li><li><strong>三线索<\/strong>：1 鹿特丹仓库的租金按季付——付到'赔付落定'那个季度（场景：仓库行；被毁后备用：租金的银行转账水单）〔不掷骰可得〕；2 三份报关里唯一没盖'布雷达关卡'印的那份反而有内河通行费单——布没进城（场景：报关对照；被毁后备用：内河税卡的流水）；3 副主席挪用的偿付金在他小舅子的'航运学校'账上——学校没有船（场景：公会账房；被毁后备用：学校的注册文书）<\/li><li><strong>节点图<\/strong>：双入口：接仲裁处／接船东的'快刀'委托（互斥）；环路：报关矛盾后以鹿特丹租金链拿实证；双通路：律法（当庭厘单）／商战（拿住副主席的账）<\/li><li><strong>标签<\/strong>：商战·阴谋｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：仓库主｜亏欠｜战时征用与保险后门<\/li><li><strong>史实<\/strong>：1624–25 布雷达围城与战时征用（1628–37 保单纠纷高发期为同构锚）<\/li><\/ul>\n<h4>Q13-01 但泽的黑麦价（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：但泽粮市的行情板上黑麦价翻了一倍半，三条线三种价：军粮采购、城济贫仓、波罗的海转口——你们只有一条船的舱位<\/li><li><strong>委托人<\/strong>：但泽粮商行会的中间商（误差：中间商说'卖给谁都是卖'——行会已与瑞军军需有'优先权'密约，济贫仓的高价出价会触发行会的'制裁'）<\/li><li><strong>目标<\/strong>：一船黑麦卖出三档报价中的最高净价，且交割完成<\/li><li><strong>障碍<\/strong>：主要——三档买家各有'截货'手段——军需能'征购'，济贫仓有'民心'，转口商有'合同陷阱'；隐藏——中间商真正想要的是你们把船'借'给行会运军粮——事后汉萨的账上你们就是'军运船'，会被对方私掠点名<\/li><li><strong>代价<\/strong>：钱财（三档价差与违约金）＋声望（行会或济贫仓记档）<\/li><li><strong>回报<\/strong>：银＋关系（三选一）＋信息：战争粮价的形成机制<\/li><li><strong>三线索<\/strong>：1 军需官的'征购令'用的纸是行会专用格式的信笺——他们是一家人（场景：征购令；被毁后备用：印坊的格式订单）〔不掷骰可得〕；2 济贫仓的'高价'背后是市议会的特别拨款——拨得出现银，不是画饼（场景：济贫仓账房；被毁后备用：市议会的拨款记录）；3 转口商的合同里'波罗的海交货'四个字没写港口——但泽湾内任何锚地都算（场景：合同细读；被毁后备用：上一份同类合同的仲裁案卷）<\/li><li><strong>节点图<\/strong>：双入口：行会／济贫仓（互斥）；环路：被'征购'后以济贫仓的拨款记录打'民生豁免'；双通路：商战（合同漏洞反制）／交涉（三方斡旋）<\/li><li><strong>标签<\/strong>：商战·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：济贫仓账房或行会｜记档｜军粮密约的缺口<\/li><li><strong>史实<\/strong>：三十年战争波罗的海粮贸军需采购扭曲市价（但泽为枢纽）<\/li><\/ul>\n<h4>Q13-02 松德海峡的绕税线（短链｜危险｜128 银（公式 150））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：哥本哈根的酒馆里压低的声音：'税官的快艇换班表我这里有。你的船吃水浅？那贝里霍尔姆水道见'<\/li><li><strong>委托人<\/strong>：走私掮客'浅水汉斯'（误差：他说'只绕税不避检'——绕税线上有瑞典私掠艇的新锚地，汉斯的换班表是三个月前的，私掠艇是上个月来的）<\/li><li><strong>目标<\/strong>：一船盐走松德海峡免税通过（或补税通过但省下'附加费'）<\/li><li><strong>障碍<\/strong>：主要——丹方快艇与浅水道的礁区；通行税单与船籍文件的核对；隐藏——汉斯靠'报信'吃饭——他把每条走私船的位置卖给私掠艇换赏金，'换班表'就是他的鱼饵<\/li><li><strong>代价<\/strong>：钱财（税与船货）＋恶名（丹麦税册记档）<\/li><li><strong>回报<\/strong>：银＋信息：海峡税与私掠的勾稽＋恶名<\/li><li><strong>三线索<\/strong>：1 私掠艇锚地的系缆桩是新钉的——桩木还渗着树脂（场景：过水道前；被毁后备用：岸上樵夫的目击）〔不掷骰可得〕；2 汉斯的换班表上'快艇名'有一艘已除籍——表是旧的（场景：验表；被毁后备用：丹麦海军的除籍公告）；3 盐舱的舱盖内侧刻着前一条'走线'船的名号——汉斯的'成功案例'都沉了（场景：验舱；被毁后备用：港务打捞记录）<\/li><li><strong>节点图<\/strong>：双入口：汉斯的线／丹麦税官的'内部补办'变体；环路：私掠艇现身后反用换班表的旧错报钓汉斯；双通路：航海（浅水礁区）／律法（补税换清净）<\/li><li><strong>标签<\/strong>：商战·冒险｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：浅水汉斯｜结仇（被钓过）｜海峡换班表更新源<\/li><li><strong>史实<\/strong>：松德海峡通行税（Sound Dues，1429–1857）为丹麦王室命脉<\/li><\/ul>\n<h4>Q13-03 明斯特的急件（单场｜危险｜42 银（公式 30））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：战报与和讯齐飞的北海：'明斯特的急件要'比兵快'——各国使节都在租快船，你们是排队第三的'<\/li><li><strong>委托人<\/strong>：法方谈判使团的秘书官（受命送件）（误差：他说'只是和约附件'——附件里有一份'私掠执照延续条款'的草稿，谁先把它送到本国，谁的私掠船队就能在和约生效前多抢三个月）<\/li><li><strong>目标<\/strong>：在风浪与各国'同行'的干扰下把急件送达指定港<\/li><li><strong>障碍<\/strong>：主要——北海冬航、多国快船的'邮路竞争'——互相报告对方是'私掠'借刀；隐藏——秘书官的副手已被西班牙方收买——他不在海上动手，他改急件的封蜡编号，让件在目的地'变成废纸'<\/li><li><strong>代价<\/strong>：声望（使团记档）＋钱财（急件酬金）<\/li><li><strong>回报<\/strong>：银＋声望＋信息：和约谈判的私掠条款＋关系（使团）<\/li><li><strong>三线索<\/strong>：1 封蜡编号的压痕深浅与编号顺序对不上——重封过（场景：起航验封；被毁后备用：使团文书房的领用簿）〔不掷骰可得〕；2 副手的私账里有一笔'鹿特丹—布雷达'的固定汇款——那不是邮资（场景：副手舱；被毁后备用：钱庄的水单）；3 各国'同行'快船的出港时间总比你们早半天——他们有人读过港务公示的船期（场景：北海；被毁后备用：港务公示的誊抄员）<\/li><li><strong>节点图<\/strong>：双入口：法使团／（反向）西使团的截件变体；环路：封蜡被改后借文书房领用簿自证并当众重封；双通路：航海（冬航抢时）／侦探（封蜡编号）<\/li><li><strong>标签<\/strong>：阴谋·史诗｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：副手｜把柄留在你们手里｜封蜡编号鉴伪术<\/li><li><strong>史实<\/strong>：1648 威斯特伐利亚和约谈判期间急件船与邮政竞争（明斯特—奥斯纳布吕克双城谈判）<\/li><\/ul>\n<h4>Q14-01 拿骚的账房（短链｜危险｜88 银（公式 75））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：拿骚'账房'的条子（销赃与分账的中间人）：'两条路子都想借你们的船。选一条，或者——把另一条卖给我'<\/li><li><strong>委托人<\/strong>：拿骚账房'公正的埃德'（海盗圈的分账人）（误差：他说'两条路子都干净'——一条是皇家港种植园主的'糖蜜'（真私货），另一条是他自己设的'钓鱼'：货里有总督安插的眼线）<\/li><li><strong>目标<\/strong>：跑完你们选的那条'路子'，货款结清，人不进绞架的名单<\/li><li><strong>障碍<\/strong>：主要——拿骚与皇家港之间的巡逻真空带每周只有三天；隐藏——'眼线'上船后第一件事是给'账房'的对手记船名——他也是双面活，看你们给谁递话<\/li><li><strong>代价<\/strong>：恶名（拿骚记档）＋钱财（路子抽成）<\/li><li><strong>回报<\/strong>：银＋关系（账房或其对手）＋信息：拿骚分账网络的缺口<\/li><li><strong>三线索<\/strong>：1 '眼线'的烟斗丝是总督府特供的深色板烟——拿骚买不到（场景：船上闲聊；被毁后备用：烟草商的供货册）〔不掷骰可得〕；2 '钓鱼'那批货的木箱钉是皇家港的制式——拿骚用绳结不用钉（场景：验货；被毁后备用：木匠认钉子的产地）；3 账房的对手给的两张条子笔迹一致——'对手'其实也是他自己（场景：条子；被毁后备用：拿骚酒馆的代书先生）<\/li><li><strong>节点图<\/strong>：双入口：两条'路子'（互斥）；环路：识破'钓鱼'后反把眼线变成向总督卖情报的双面线；双通路：商战（分账网络）／交涉（招安线）<\/li><li><strong>标签<\/strong>：阴谋·市井｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：账房埃德｜复杂｜分账网络缺口与'对手'真相<\/li><li><strong>史实<\/strong>：1713–18 拿骚' Flying Gang '海盗共和国的销赃与分账网络<\/li><\/ul>\n<h4>Q14-02 奥克拉科克的炮声（单场｜危险｜95 银（公式 20））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：1718 年 11 月的北卡罗来纳外海：黑胡子在沙洲后泊着两条船。 '参战''旁观''打扫战场'——三条路，一夜之间<\/li><li><strong>委托人<\/strong>：（委托人槽由弗吉尼亚总督的两名海军中尉顶——梅纳德分队的'外围征募'）（误差：中尉说'打扫战场合法'——战利品的'合法'取决于黑胡子死没死，而'死没死'在炮停之前没人说得准）<\/li><li><strong>目标<\/strong>：在奥克拉科克一役中完成你们选的角色并活着离开，弄清'战利品归属'的文书口径<\/li><li><strong>障碍<\/strong>：主要——沙洲浅水的炮位死角与'打扫'时的老兵油子们；隐藏——黑胡子的'账本'（分赃名册）上有几位殖民地官老爷的名字——打扫战场的人捡到它，捡到的是把刀<\/li><li><strong>代价<\/strong>：恶名／声望双轨＋生死<\/li><li><strong>回报<\/strong>：银（战利品／赏金）＋文书（名册？）＋信息：私掠—海盗—官府的三角账<\/li><li><strong>三线索<\/strong>：1 '名册'的纸是殖民地的公函用纸——海盗不该有这种纸（场景：战场；被毁后备用：公函纸的水印）〔不掷骰可得〕；2 沙洲的炮位死角每天两个时辰——中尉的'外围征募'专挑死角时辰派活（场景：沙洲；被毁后备用：潮汐表与炮位图对照）；3 黑胡子的药箱里有梅纳德的药方——两边船医是同门，战前通过信（场景：战后；被毁后备用：药箱里的药方笺）<\/li><li><strong>节点图<\/strong>：双入口：参战／旁观（互斥）；环路：战后名册在手可走'官府勒索'或'烧掉它'两条道德线；双通路：武力（外围炮战）／侦探（文书口径）<\/li><li><strong>溢价/总包<\/strong>：战利品与赏格另计（总包口径，对接 10.5 战利品生成器）（公式基准 20 银）<\/li><li><strong>标签<\/strong>：战争·史诗｜强度 重｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：黑胡子名册（物）｜在你们手里｜殖民官老爷们的把柄<\/li><li><strong>史实<\/strong>：1718.11.22 奥克拉科克之战，黑胡子身亡<\/li><\/ul>\n<h4>Q14-03 赦免船票（短链｜常规｜53 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：查尔斯顿港务的公告与拿骚酒馆的传单内容相反：'1718 大赦，国王的赦免证在此领取'——有人要一条船把'想领证的人'从拿骚运过来<\/li><li><strong>委托人<\/strong>：皇家总督的特使（罗杰斯到任前的先遣）（误差：特使说'赦免无条件'——附则里有一条'既往恶名超过 40 者除外'，而这批'乘客'里至少四人的恶名就是拿骚的分账名册定的，谁也说不清）<\/li><li><strong>目标<\/strong>：把一批'领证者'从拿骚安全运抵查尔斯顿，人数不折损，'恶名'口径不打架<\/li><li><strong>障碍<\/strong>：主要——海上还有不领证的'同行'——对'叛徒'的名声处置比巡逻更麻烦；隐藏——特使带的空白赦免证比公告数多一叠——多出的那叠是给'愿意改名换姓当线人'的人的，他在拿你们筛人<\/li><li><strong>代价<\/strong>：声望（官方记档）＋恶名（拿骚记档）<\/li><li><strong>回报<\/strong>：银＋关系（特使／领证者社群）＋信息：赦免—线人体系的运作<\/li><li><strong>三线索<\/strong>：1 空白赦免证的编号段比公告多出'X'打头——正式编号从不带 X（场景：验证；被毁后备用：殖民部的编号规程）〔不掷骰可得〕；2 '乘客'里有一人总在夜航时记账——记的是船的航线，不是私账（场景：夜航；被毁后备用：他藏账本的靴底夹层）；3 拿骚'同行'的警告信贴在酒馆门上——警告的人名来自特使的乘客名单（场景：拿骚酒馆；被毁后备用：传单的印刷铺）<\/li><li><strong>节点图<\/strong>：双入口：特使／领证者社群的'自查恶名'反向委托；环路：'同行'拦截后以警告信的印刷铺反查内线；双通路：交涉（恶名口径谈判）／航海（避拦线）<\/li><li><strong>标签<\/strong>：人情·史诗｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：记账的'乘客'｜双面｜特使的 X 编号空白证<\/li><li><strong>史实<\/strong>：1718 拿骚大赦（伍兹·罗杰斯到任）与赦免—清剿并行<\/li><\/ul>\n<h4>Q15-01 私掠股单的假票（短链｜常规｜50 银（公式 38））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：布里斯托尔交易所的角落数额惊人的行情：私掠巡航的'股单'在倒卖——有人捏着一张'确定回航'的巡航股单四处吃现银<\/li><li><strong>委托人<\/strong>：私掠船东联合会的经纪人（误差：经纪人说'票是真的'——票是真的，但那趟巡航的'执照'已在上周被海军部悄悄撤销，船东联合会在拖时间换执照）<\/li><li><strong>目标<\/strong>：在股单击鼓传花砸到散户手里之前查清'回航'的真实性，并决定：接盘、戳穿、或搭船<\/li><li><strong>障碍<\/strong>：主要——交易所的'消息市'——谁先拿到海军部的撤销文书谁赢；隐藏——经纪人自己吃进了三成——他需要三个'接盘的外地人'才能全身而退，你们是他眼里的外地人<\/li><li><strong>代价<\/strong>：钱财（股金）＋声望（交易所记档）<\/li><li><strong>回报<\/strong>：银＋信息：私掠证券化的全部手法＋关系（联合会或海军部）<\/li><li><strong>三线索<\/strong>：1 海军部文书的'撤销令'登记号是连号空档——批了又被撤回过一次（场景：海军部档房；被毁后备用：登记簿的墨色）〔不掷骰可得〕；2 经纪人的'回航保证'引用的保险单号承保方已停业——他赌没人查（场景：保单；被毁后备用：停业保险行的清算公告）；3 '确定回航'的巡航船三个月没在任何一个补给港挂靠——回航是纸面的（场景：港口查询；被毁后备用：各港挂靠簿）<\/li><li><strong>节点图<\/strong>：双入口：接盘变体／戳穿变体（互斥立场）；环路：消息战胶着后以补给港挂靠簿一锤定音；双通路：商战（消息市）／律法（撤销令）<\/li><li><strong>标签<\/strong>：市井·商战｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：经纪人｜结仇（被戳穿）｜交易所消息市人脉<\/li><li><strong>史实<\/strong>：1690s 私掠巡航股份单的交易所流通（伦敦/布里斯托尔）<\/li><\/ul>\n<h4>Q15-02 敦刻尔克的猎杀合同（短链｜生死｜420 银（公式 500））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：敦刻尔克私掠港的合约桌：法王私掠船队缺一条'不怕冷的船'——合同上写'猎杀'，附则里写'若有战损，抚恤按股'<\/li><li><strong>委托人<\/strong>：敦刻尔克私掠船队的合同经纪人（让·巴尔传统的后继者们）（误差：经纪人说'目标是军需船'——真正的猎物是同盟方的'运银船'，军需船只是它名义上的护卫，合同把它写在前排就是为了'出事有说法'）<\/li><li><strong>目标<\/strong>：按合同完成一次'猎杀'（或评估后拒绝并带着合同内幕离开敦刻尔克）<\/li><li><strong>障碍<\/strong>：主要——北海冬航与同盟国海军的巡逻线；隐藏——'运银船'上押运的银有四成是西班牙王室'借道'的——打它等于替法王的海关平一笔烂账，真正的受益人不是舰队<\/li><li><strong>代价<\/strong>：生死＋恶名／声望双轨<\/li><li><strong>回报<\/strong>：银（合同赏金／分成）＋信息：敦刻尔克猎杀体系的账目＋恶名<\/li><li><strong>三线索<\/strong>：1 合同'目标排位'与海军部的巡逻公示矛盾——真正目标排在'护卫'栏（场景：合同文本；被毁后备用：同盟国海军的公示抄本）〔不掷骰可得〕；2 '运银船'的保单由法方银行承保——猎杀的'风险'有人已经对冲（场景：保单；被毁后备用：银行的对冲分录）；3 经纪人的抚恤按股条款从未兑现过——三份旧合同的'战损'都判了'不可抗力'（场景：旧合同；被毁后备用：敦刻尔克海事法庭的判例集）<\/li><li><strong>节点图<\/strong>：双入口：接合同／评估后拒绝（拿内幕走人）；环路：冬航受阻后以'对冲保单'发现真正受益人并议价；双通路：海战（猎杀执行）／商战（内幕议价）<\/li><li><strong>溢价/总包<\/strong>：生死短链大师级：含'猎杀分成'总包口径（公式基准 500 银）<\/li><li><strong>标签<\/strong>：战争·商战｜强度 重｜无人敢接<\/li><li><strong>存留钩<\/strong>（季末入存留池）：合同经纪｜记档｜敦刻尔克的合同渠道<\/li><li><strong>史实<\/strong>：敦刻尔克私掠船队（让·巴尔传统）在九年战争与西王继承战争中全盛<\/li><\/ul>\n<h4>Q15-03 和约之后的失业潮（长线｜常规｜240 银（公式 120））<\/h4>\n<ul class='mdlist'><li><strong>钩子<\/strong>：1713 年的墨水干了：私掠执照作废，敦刻尔克与圣马洛的码头上站满了只会一门手艺的人。有人替他们凑钱请你们：'带他们转业——或者带他们出海'<\/li><li><strong>委托人<\/strong>：圣马洛船东联合会（与一批前私掠船长合股）（误差：船东们说'转型领港与远洋商船'——联合会真正缺的是'压舱的威慑'：转型船队要在私掠盛行的航线上活下来，'前私掠船长'的凶名就是保险）<\/li><li><strong>目标<\/strong>：把一批前私掠者转型成合法船队的中坚（领港员／船教练／护航长），并在一季内让转型船队跑出正现金流<\/li><li><strong>障碍<\/strong>：主要——转型人员的'习性'与商船纪律冲突；航线上前同行们的'劝降'与挖角；隐藏——联合会里有一位股东是旧私掠金融家——他要在船队跑正后把它整体卖给一家公司，'转业者'是他包装资产的耗材<\/li><li><strong>代价<\/strong>：声望（转型船队的航运记档）＋钱财（分红）<\/li><li><strong>回报<\/strong>：银＋声望＋关系（转型者社群）＋信息：私掠转业的三条实路<\/li><li><strong>三线索<\/strong>：1 联合会与新公司的'意向书'用的股东代号 F.——账上只有他有 F 开头的股（场景：意向书；被毁后备用：联合会的股东名册）〔不掷骰可得〕；2 转型教练的'纪律手册'是私掠船的分赃章程改的——第一章就露馅（场景：手册；被毁后备用：老船员一眼认出来源）；3 '劝降'信里开出的薪酬精确到周——挖角方拿着转型船队的工资表（场景：劝降信；被毁后备用：工资表只有联合会账房有）<\/li><li><strong>节点图<\/strong>：双入口：转型正路／'最后一次出海'的邪路（互斥）；环路：挖角危机后以工资表泄密案反证 F 股东的局；双通路：经营（正现金流）／阴谋（揭卖局）<\/li><li><strong>溢价/总包<\/strong>：长线收官任务：含船队分红期权（总包口径）（公式基准 120 银）<\/li><li><strong>标签<\/strong>：人情·史诗｜强度 中｜常态<\/li><li><strong>存留钩<\/strong>（季末入存留池）：F 股东｜他知道你们看过账｜船队分红与卖局<\/li><li><strong>史实<\/strong>：1713 乌得勒支和约后私掠退役潮被视为海盗黄金时代的供给侧推手<\/li><\/ul>\n<blockquote class='quote'>接单即立六要素卡（10 分册 §10.1）；GM 可按泛型链（12 分册）在卡面数值上做行情浮动（±25% 交涉带）。<\/blockquote>\n<h2>11.5 对接条<\/h2>\n<ul class='mdlist'><li><strong>试航包<\/strong>：S1 战役从 P01/P02/P03 三卡激活开局（1375），五日试炼（8.4.1）第③团调用 P03 基奥贾进程卡——已写入试航包任务速查块。<\/li><li><strong>跑商引擎<\/strong>：P05\"经济冲击\"（黑海份额崩塌）在 S1 末把卡法档价上浮，与 09 分册城市事件字段同源。<\/li><li><strong>人物与 AI（P6 预留）<\/strong>：存留池 NPC 的\"亏欠/结仇\"即 05 部好感双轨的初始值；委托人误差在三层 AI 中表现为\"目标函数带噪\"。<\/li><li><strong>文本渲染（P7 预留）<\/strong>：任务卡的\"钩子\"字段即 06 部帷幕卡的入场朗读文本；标签=帷幕配平键。<\/li><\/ul>","text":"计划 04 部 T4.2 的数据页。十五进程是活世界的时间轴（谁在那几年想干什么），六十张固定任务是轴上结的果子。规则层（原子/公式/网状/标签）在 10 分册；本页全部表体由 build_quests_data.py → build_engine.py 渲染。 11.1 总则 三选激活（剧本卡 15 选 3） ：每季 GM 掷或选 3 张进程卡激活——开局抽 3 强制激活，治开放世界失焦。未激活的进程以背景噪声存在：市况条的价签微动、酒馆新闻里的一句闲话。 大势不变，人事可变 ：每张进程卡\"人事尺度\"字段是戏剧定位总则—— PL 改变不了大历史（1453 城一定会破、停航令一定会下），但能决定身边人死活（一箱抄本、一船难民、一个死人的承诺） 。这是历史进程类任务与\"架空自由扮演\"的分界线。 季末第⑦步调用 ：任务收盘时读激活卡——\"经济冲击\"改 prices 档、\"势力剧本\"入存留池（10 分册 §10.5.1）、\"纪推进钩子\"交 GM 兑现。 洋葱挂接 ：每张进程卡指定 1 个深层锚（12.7 七秘密），长线任务剥到第三层时接上（10 分册 §10.6）。 11.2 十五进程速查 进程 纪 年窗 一句话 P01 黑死病余波与劳工荒 S1 1350–1380 工资翻倍、人手永远缺；谁控制检疫线谁控制船期 P02 百年战争海峡绞杀 S1 1337–1453 两顶帽子的私掠证；许可证的文书链决定绞架 P03 威尼斯—热那亚终局战 S1 1372–1381 封潟湖与破围；一船桅料就是一城人的口粮 P04 郑和宝船舰队 S1 1405–1433 朝贡体系的顶点与停航令的挽歌；宝船图纸出海 P05 君士坦丁堡陷落 S1 1452–1453 纪末事件：抄本、难民、死人的承诺 P06 收复失地终局与西非航路 S2 1415–1492 金堡、石柱与航路保密局；地图成为可以暗杀的文件 P07 哥伦布与新旧大陆接触 S2 1492–1504 特许权是最贵的商品；一次换粮谈判是一座村子的存亡 P08 教皇子午线与香料瓜分 S2 1493–1529 纸上经线预登记全球定价权；谈判桌上的地图战 P09 达伽马—卡布拉尔与里斯本垄断 S3 1498–1520s 炮舰垄断立起来，也被人一年年凿漏 P10 麦哲伦环球与香料群岛 S3 1519–1529 265 人出发 18 人回；证词的一句真话是开战借口 P11 马尼拉大帆船与白银太平洋 S3 1565–1640s 白银单向洪流；固定航线意味着固定伏击点 P12 特许公司时代 S4 1600–1623 股份制把战争开支摊进股本；安汶的证人船 P13 三十年战争与波罗的海 S4 1618–1648 军粮扭曲粮价带；急件比兵快 P14 海盗黄金时代 S5 1690–1726 私掠解散后的暴力过剩；绞架清空甲板 P15 王位继承战争与私掠全盛 S5 1689–1714 劫掠证券化；和约一签，几千人一夜失业 批次（路线图 8.3.6） ：S1 五进程 24 卡 + S2 三进程 12 卡 = 首批 36 卡（过 DoD 即可开跑 S1 战役）；S3 十二卡次批；S4/S5 十二卡末批——本版 60 卡一次全量交付，三批记号仅存档。 11.3 进程卡（十五张全量） 11.4 十五进程卡（战役级'剧本卡 15 选 3'，季末激活 3 张） P01 黑死病余波与劳工荒（S1｜1350–1380） 字段 内容 地理焦点 西欧—地中海疫城带（威尼斯／热那亚／马赛／
