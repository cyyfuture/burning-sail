不是经验包，他们是有主体性的势力——能结盟，能反噬。 ⑨ 东岛幕府 野心 ： 只开一扇窗，并且决定谁从窗里递东西进来。 ↳ 改什么 ： 10.1 瓷器与漆的产地价 ； 12.5 最东海域的准入 （无许可即敌对，10.4 敌对档后果）。 PC 能做什么 ：拿到那扇窗的 一次 机会。 （双帝国计为一卡，故本章为\"八大势力、九张卡\"。GM 若只需要八个，把⑨并入⑥作为\"东向窗口\"。） 12.4 十大港口 每港六行 ：类型／性格／ ↳ 行情骰倾向 ／ ↳ 传闻种子 ／港务 NPC（12.6 有全名）／ 准入条件 。 母港型 # 港 性格与条款 1 塔古斯 （南方王冠之都） 全大陆最大的报关楼与最大的假货市场。 行情 ×1.0 但税 25% ；传闻种子： \"有一批货的舱单上有两个名字\" 。NPC： 港务大臣阿兰达 。准入：正常报关；恶名 40+ 直接扣押 2 阿姆斯特丹港／新峡 （联合省） 保险、绘图、和一份 所有人都遵守的底价表 。 报关 5% ； 行情骰 −1 档滞销概率 （因为什么都能卖掉）。NPC： 承保人霍恩 。准入： 你必须投保 （不投保的船在港外等） 3 德文港 （海岛王国） 护卫舰母港、私掠者的交易所。 赏格板永远有新价 （10.9 赏格合约）。NPC： 海军部文书长佩恩 。准入：声望 40+，或一张有效许可证 殖民地型 # 港 性格与条款 4 圣克鲁斯 （航线跳板；2.4 海燕号的出发港） 咸鱼、淡水、和所有船的最后一站。 补给 ×0.8 ， 消息 ×旧 （三个月前）。NPC： 船长之家酒馆老板娘多洛雷斯 。准入：无 5 港十字 （白银港，内陆银路的出口） 全窗口物价最高 （对应波托西：25–35 银币/人/月）。 火药与铁 ×2 。NPC： 银库主事 。准入： 必须卸枪 6 港樱树 （新拓殖民地，1607 后） 什么都有、什么都缺； 盟约窗口正开着 （8.5 +1 可达）。NPC： 殖民地秘书 ＋ 一位不肯署名的翻译 。准入：联合省或海岛王国的担保 走私港 # 港 性格与条款 7 盐叉湾 （血鸦海岸正门） 销赃实现率 1/2 ； 恶名 60+ 唯一肯开门的地方 ； 行情骰 +1 档 ，但 只有现金 。 没有法庭 （10.6 捕获主张在此无处申报）。NPC： 军需官\"账房\" 8 低语栈桥 （雾海口，见 12.4b） 一处 退潮才出现 的栈桥，图上标不出来。 暗舱建造DV −2 ； 海关检定 +3 难 （因为没有海关，只有邻居）。NPC： 灯塔公会的守灯人 军港与禁港 # 港 性格与条款 9 锚链堡 （帝国要塞港） 锁住一条航线的唯一深水泊位。 补给无限但只卖给军舰 ； 修理 −25% （10.8 声望 60+）。NPC： 舰队司令的副官 。准入：声望 70+，或一份护航合约 10 末灯 （最东的窗） 东岛幕府唯一开放的泊位 。 瓷器与漆的产地价 ； 违禁品＝即刻敌对 。NPC： 通事（翻译，无薪，靠你给他面子生活） 。准入： 一张由寺社与奉行署会签的状 （律法 DV18） 12.4b 雾海接口（可选替换包） 本项目另一套已建成数据的设定（十港六势力、含派系敌对与日程）可以整体替换 12.4/12.3 的殖民地与走私段 ，无需改动任何骰子。 直接可用的 十港名 ：阑珊／鸦尾／锚链堡／白潮／低语栈桥／鱼叉栅／潮母襤褸湾／末灯／皓腕／酣城（其中 锚链堡、低语栈桥、末灯 已并入上表）。 直接可用的 六势力名 （含敌对与日程结构）： 灯塔公会／盐约正教／自船商会／海军执政团／私枭圆桌／猎人公会 。 ↳ 建议映射 ：灯塔公会→⑥行会（并接管灯塔专利）；盐约正教→⑤审判庭；自船商会→③联合省；海军执政团→④海岛王国；私枭圆桌→⑦海盗共和国；猎人公会→⑧内陆王朝的 边境侧 （不是它本身）。 ⚠️ 该包的人物属性尺度（六属性 1–100）与本作（五属性 1–5）数学不兼容 。 只取它的地名、派系结构与日程逻辑，不要取它的数值。 12.5 六大海域 每域四行 ：风与浪／危险／主导／ 标志性遭遇 。 空白海图见附录 G。 域 风与浪 危险 主导 标志遭遇 Ⅰ 内海（故土圈） 侧风为主，海况 3–14，四季可航 礁、雾、以及 报关楼 联合省／海岛王国／南方王冠 一次护航突袭（9.8 群战的第一课） Ⅱ 信风海（南下航线） 顺风 ×1.25 ，7.4 的最佳档 飓风季（ 热带海域掷骰后调档 ，7.5） 南方王冠专利航线 一条被凿开的桶（7.8 痢疾）、一支返航舰队 Ⅲ 冷水海（西北与浮冰带） 劲风—大风常见，15–19 冰山与浮冰 （瞭望 DV+3，7.10） 联合省／北方帝国 一座不亮的灯塔；一条被冻住的船 Ⅳ 西部浅海（殖民地与新拓） 侧风与逆风交替； 吃水检定多 礁区、河口、退潮（ 8.2 硬时限 ） 混合； 内陆王朝在岸上 一座有主体的岛（ 8.5 主战场 ） Ⅴ 恶魔纬度（7.5 已点名） 不该有风的地方有风 ；海况表在此域掷骰后 GM 可整体调档 无风带＋ \"不该存在的雾\" （11.1） 没人 （这是它的定义） 一艘幽灵船（11.6）；一处被抹掉的坐标 Ⅵ 东向海（那扇窗） 反向航线专利； 季风可被预测 （气象 5.2） 距离、拒保（VOC 回程 30–40%＝ 没人保 ） 东岛幕府／联合省 一次准入检定（末灯，12.4）；一船没人敢验的货 危险等级速查 （GM 定遭遇频率用）：Ⅰ 低／Ⅱ 中／Ⅲ 高／Ⅳ 高／Ⅴ 极／Ⅵ 中。 航段距离 ：Ⅰ→Ⅱ 五段；Ⅱ→Ⅳ 三段；Ⅲ→Ⅴ 七段；Ⅳ→Ⅵ 十一段。 这些数就是战役的时间尺度。 12.6 十二位著名 NPC（每人：一段＋一个秘密＋↳ 他能改什么） \"血鸦\"英格丽德·萨尔摩 — 海盗共和国唯一的\"账房出身的女王\"。她不劫渔船，因为她自己渔村出身。 秘密 ：她的分账表比任何皇家海军都精确，因为 她记下每一个欠饷的人的名字 。 ↳ 改 ：10.7 团队账本；10.8 恶名的上限。 塔古斯港务大臣 阿兰达伯爵 — 他收的税养活了半支舰队，而他本人并不富裕。 秘密 ：他的账本有两套， 两套都是真的 。 ↳ 改 ：10.3 报关 DV；10.4 查获判定。 制图师行会会长 老范·德·米尔 — 他记得每一张他买断的图。 秘密 ： 他自己从不航海 ，所以他买图是为了知道他自己没能看见的东西。 ↳ 改 ：8.7、5.2 海图价；12.7 秘密⑥的保管人。 审判官宣审判事 迭戈·德·科瓦 — 他烧过三本书，其中两本他读过并且同意。 秘密 ： 他知道 12.7 秘密⑤ ，而他不认为那是异端。 ↳ 改 ：5.5 律法；11 章档位（他是唯一会让【显性】变成政治问题的人）。 女船东 玛丽亚·克鲁兹 — 1572 屠城夜的难民女儿，如今持有十一条船的十七份股份。 秘密 ： 她雇过 12.6 的第 1 位 去杀一个人，并且付了钱。 ↳ 改 ：10.6 股份；PC 的第一条\"能凑出船\"的路。 叛舰长 康拉德·\"旗\"·杜尔 — 他在一次会战中调转旗号，从此没有人知道他现在为谁干。 秘密 ： 那次会战里他救下的那条船上，有他兄弟。 ↳ 改**：10.5 恶名的不对称；10.6 敌国清单的可变性。 联合省承保人 霍恩 — 他报出的数字从来不错。 秘密 ： 他拒保的那些船里，有一半是他自己派出去的。 ↳ 改**：10.3 保险；10.4 谁在举报走私。 银库主事（港十字） — 全大陆最干净的手，最脏的工作。 秘密 ： 每年有一船白银从记录上消失，而他知道它去了哪片海 （→ 秘密④）。 ↳ 改 ：10.5 贵金属；12.7 线索链的枢纽。 \"账房\"（盐叉湾军需官） — 他不指挥，他分东西。 秘密 ： 他的分账表是血鸦海岸唯一比帝国更被遵守的法律。 ↳ 改**：10.7 罗伯茨条款；9.9 俘虏赎金。 通事（末灯） — 无薪，靠体面生活。 秘密 ： 他能读四种语言，但只能写一种 ——那一种是他不许自己写的。 ↳ 改 ：12.4 末灯准入；5.5 语言学。 老舵手帕尔米贾诺 — 他跑过恶魔纬度并且回来了，回来以后只在酒馆讲，而且 每次讲得不一样 。 秘密 ： 第一次讲的那个版本是真的 。 ↳ 改 ：12.7 秘密③；10.8 传闻档的教科书案例。 殖民地秘书（港樱树） — 他签每一份地契，包括不该签的。 秘密 ： 他在替 12.3 第八势力保存一份完整的、被否认的土地记录。 ↳ 改 ：8.5 盟约；10.6 产权诉讼； 这是唯一一个能让第八幕合法成立的人**。 12.7 七个秘密（GM 之眼） 每个秘密四行 ：真相／ 三层线索链 ／它兑现什么／它改变哪张表。 七者互不冲突、可平行埋设 ——这是战役骨架的标准件，不是备选。 埋两个就够一整幕。 ① 黄金城 真相 ： 有一座城，但它不是金子做的——它是被留下来的。 1533 年那支 168 人的队伍拿下的不是宝库，是一座 故意空的都城的档案 ，而档案证明了一件让两个帝国都不能公开的事。 三层线索 ：① 一本 1533 年的士兵家书（史学 DV14，塔古斯的旧货摊）｜② 内陆王朝侧一份被否认的土地记录（12.6 第 12 位）｜③ 一座山口的石阶宽到能走炮（8.3 D·17）。 兑现 ：不是黄金，是 产权文书 ——它能让一整个殖民地的合法性作废（律法 DV18）。 ↳ 改 ： 10.6 许可证的效力 ； 8.5 盟约的可达性 ； 12.3 第八势力的入场 。 ② 不老泉 真相 ： 有一处水，能治一种病，且那种病正是长期航海得的。 坏血、热病、痢疾——它治得好，而它在一个不该被找到的人手里。 三层线索 ：① 一名船医的草药箱里有一片不该存在于本地的叶（博物学 DV15）｜② 7.8 坏血病条的\"即愈\"传闻，出现在三座港、版本各不相同｜③ 一处海岸的本地人不生病（生存 DV13 会先发现这个，而不是那个泉）。 兑现 ：一条 永久移除坏血病 的航线知识——以及谁控制它，谁就控制这条海的所有船员。 ↳ 改 ： 7.8 疾病整节 ； 7.7 士气的下限 ； 6.6 薪饷的谈判筹码 。 ③ 幽灵纬度 真相 ： 恶魔纬度以南有一片海，风从错误的方向来。 不是魔法，是 一处被系统性隐瞒的洋流异常 ——而隐瞒它的人正是靠这条异常活着回来的。 三层线索 ：① 老舵手帕尔米贾诺的第一版讲述（12.6 第 11 位）｜② 一本被禁的 1506 航海手册里那一处错的坐标（ 它错得刚好能让人死 ）｜③ 7.5 海况表在Ⅴ域的\"整体调档\"条款本身就是线索。 兑现 ：一条 没人能从后面追上来 的航线。 ↳ 改 ： 7.4／7.5 全部风浪表 ； 9.7 追击钟 （在这片海上，【拉开】只需 4 格）。 ④ 沉没舰队 真相 ：1587 年那场风暴之后，一支舰队的 白银没有全在记录上消失——有一部分被拖进了一处浅滩，并且被当地人看着 。 三层线索 ：① 银库主事的年度缺口（12.6 第 8 位）｜② 一处海岸的贝冢异常巨大且年代刚好（8.3 C·6）｜③ St Philip 案账目里\"上将只得 3.8%\"这笔差额（10.7 实档）。 兑现 ：一笔钱。以及 一个必须选择跟谁分享它的沿岸族群 。 ↳ 改 ： 10.5 战利品生成器 ； 8.5 关系刻度的起点 （他们先到了那里）。 ⑤ 第五势力 真相 ： 在四个签发许可证的权力之外，有一张更早的、被所有人遗忘的授权。 它不签发许可证，它 签发合法性 ——持有它可以宣布任何一次劫掠是\"未被许可的战争\"。 三层线索 ：① 审判事知道却不烧的那两本书（12.6 第 4 位）｜② 1496 分海诏书的 原件缺了一页 （律法 DV16）｜③ 一枚不属于任何已知铸造厂的火漆印（11.4 遗物模板的现成答案）。 兑现 ： 一条敌国清单可以被改写 ——一夜之间，你们的旧盟友成为合法目标，而你们的旧敌人不能被打。 ↳ 改 ： 10.6 全流程 ； 10.5 恶名表的第一行 ； 12.3 全部声望解锁 。 ⑥ 海图上的墨渍 真相 ： 行会买断的图里，有一张被故意涂掉了一角。 涂掉的不是坐标，是 一处水深 ——而那个位置在 150 年后正是唯一能让大船通过的航道。 三层线索 ：① 会长本人不肯说的那句话（人望 DV17）｜② 你们手里那张残图的缺口（2.4 尾声钩子②的兑现口）｜③ 8.3 A·19 那片\"没被画进任何海图的潟湖\"。 兑现 ： 一处只有你们能进的锚地 ——战略意义上的\"只有你们\"。 ↳ 改 ： 8.1 锚点揭示 ； 7.10 吃水检定 ； 9.7 地形类抢优势动作 。 ⑦ 红隼号的真主人 真相 ：那封被水渍洇掉的信 不是写给\"银鸥号\"代理人的 ——它是 写给某位你们已经见过的人 （2.4 尾声钩子①：船长认得那个火漆印）。红隼号不是海盗船， 它是一条被人花钱租来取回一件东西的船，而那件东西在你们手上 。 三层线索 ：① 木筒与火漆印（史学／纹章分支 DV14）｜② 帕科醒来后的第一句话（2.4）｜③ 罗伦佐床板下那半张海图的缺口。 兑现 ：一个 贯穿三幕的敌人 ，且这个敌人一开始是在 试图做一件正当的事 。 ↳ 改 ： 10.8 血债档与传闻档 ； 14.3 三幕结构的主线 。 【设计注·为什么七个秘密里有五个是\"文书\"而不是\"地方\"】 因为这个世界的权力不是靠 到达 运作的，是靠 登记 运作的（12.1）。 把秘密做成文件，玩家就必须用律法、史学、语言学、和一次社交——而不是只用一次掌舵检定。 这也正好兑现了问卷里那句\"阳谋与经营、说服和话术\"。 12.8 三十秒速查 年代 1490–1620 ； 开局年份写进战役记录第一页 （它决定分账、许可证、保费、和谁在打谁） 三底色 ：海比法律快／黄金让所有人变穷／地图上的空白是 公开的 八势力九卡 ； 只有内陆王朝从不在海上出现 ，它是唯一能让船变成次要角色的势力 十港四型 ：母港（税低到 5%、高到 25%）／殖民地（贵且缺）／走私（现结、无法庭）／军港与禁港（要声望） 六海域 ：Ⅰ低Ⅱ中Ⅲ高Ⅳ高Ⅴ极Ⅵ中； Ⅴ恶魔纬度允许 GM 整体调海况档 12 NPC 各有秘密，且各自改一张表 七秘密全部互不冲突，埋两个够一幕 ； 其中五个是文书不是地方 雾海替换包 ：取地名、派系、日程， 不取数值 世界有了。下一章是给主持的：怎么把它跑起来，而不在第三场就烧光。"},{"num":"13","title":"游戏主持指南","vol":"卷三 · 世界与主持区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>GM 不写故事。GM 建一台会自己讲故事的机器，然后站在旁边，被它吓到。<\/em><\/blockquote>\n<p>本章是主持的唯一入口章。<strong>如果你只有二十分钟，读 13.1、13.3、13.5、13.12。<\/strong><\/p>\n<hr>\n<h2>13.1 主持原则<\/h2>\n<h3>五条 P0 原则（这五条不落实，后面全部白搭）<\/h3>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>原则<\/th><th>一句话操作<\/th><\/tr><\/thead><tbody><tr><td><strong>①<\/strong><\/td><td><strong>关键线索永不投骰<\/strong><\/td><td>剧情的唯一通路不需要检定。玩家做对了动作，就给答案（5.0①）<\/td><\/tr><tr><td><strong>②<\/strong><\/td><td><strong>失败三选一<\/strong><\/td><td>代价／复杂化／信息。<strong>不允许\"什么都没发生\"<\/strong>（3.2）<\/td><\/tr><tr><td><strong>③<\/strong><\/td><td><strong>Let it Ride<\/strong><\/td><td>同一件事、同一段航程，只掷一次（5.0②）<\/td><\/tr><tr><td><strong>④<\/strong><\/td><td><strong>GM 议程五条<\/strong><\/td><td>见下<\/td><\/tr><tr><td><strong>⑤<\/strong><\/td><td><strong>天赋不许废支柱<\/strong><\/td><td>任何一个天赋、专长、变体，都不得让本书五条风味支柱之一变成默认无趣（见下）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>GM 议程（五条，冲突时按顺序优先）<\/h3>\n<ol class='mdlist'><li><strong>让这个世界跑得起来、危险、并且迷人。<\/strong> 三个词都要——只\"危险\"是恐怖团，只\"迷人\"是观光团。<\/li><li><strong>让玩家做船员。<\/strong> 不替他们决定、不预先原谅、不救场。<strong>船会沉，人也会。<\/strong><\/li><li><strong>从局面里得到奖励，不从规则里。<\/strong> 玩家说了一句聪明话，比掷出 20 更值得奖励。<\/li><li><strong>失败推进故事。<\/strong> 一次失败之后，桌面上的局面必须<strong>更有趣<\/strong>，不是更糟。<\/li><li><strong>别抹平尖锐的东西。<\/strong> 道德困境、船上的权力、一个玩家把另一个玩家推进坑里（11.2 羁绊投射）——<strong>这些不是要处理的问题，这是本作的内容<\/strong>。<\/li><\/ol>\n<h3>五条风味支柱（⑤的判据）<\/h3>\n<p>任何新规则在进入你的桌前，先问它有没有让下面五条之一变成<strong>默认无趣<\/strong>：<\/p>\n<blockquote class='quote aside-voice'><strong>P1 船是角色<\/strong> ｜ <strong>P2 海是对手<\/strong> ｜ <strong>P3 血很贵<\/strong> ｜ <strong>P4 名声有账本<\/strong> ｜ <strong>P5 合法性是一种资产<\/strong><\/blockquote>\n<h3>十条铁律（本作的世界观操作系统）<\/h3>\n<p>来自两部被反复研究的作品，逐条可执行：<\/p>\n<ol class='mdlist'><li><strong>选择必有代价<\/strong>；2. <strong>后果要延迟爆发<\/strong>；3. <strong>知识就是力量<\/strong>（字面意义，见 5.5、8.7）；<\/li><li><strong>风味文本是世界观的最小单位<\/strong>（一件物品上一句话，比一页设定有用）；5. <strong>Less is more<\/strong>；<\/li><li><strong>NPC 有自己的日程<\/strong>（13.6）；7. <strong>失败是内容，不是惩罚<\/strong>；8. <strong>环境先于说明<\/strong>（先让他们看见，再告诉他们）；<\/li><li><strong>音乐与地域绑定<\/strong>（同一首歌只在同一座港放，玩家会开始保护那座城市）；<\/li><li><strong>尊重来源，敢续自己的魂<\/strong>。<\/li><\/ol>\n<h3>桌上预算律（最强的一条过滤器）<\/h3>\n<blockquote class='quote aside-voice'><strong>凡不能压到一张卡或一句话的资产，不上桌。<\/strong><\/blockquote>\n<p>备课时如果一段设定需要超过 30 秒念完，<strong>它今天不是内容，是负担<\/strong>。写进船志，下次再说。<\/p>\n<hr>\n<h2>13.2 第一团怎么开（30 分钟备课）<\/h2>\n<p><strong>用第 2 章《暴风中的信号》改。<\/strong> 五个替换，一个都不许多做：<\/p>\n<div class='tbl'><table><thead><tr><th>换什么<\/th><th>怎么换<\/th><th>用时<\/th><\/tr><\/thead><tbody><tr><td><strong>船名<\/strong><\/td><td>让玩家投票取一个。<strong>这一步不可跳过<\/strong>——他们给的名字，他们就会救<\/td><td>3 min<\/td><\/tr><tr><td><strong>出发港<\/strong><\/td><td>从 12.4 挑一个母港型（新手推荐圣克鲁斯）<\/td><td>2 min<\/td><\/tr><tr><td><strong>货<\/strong><\/td><td>换成不值钱但<strong>有主<\/strong>的东西（咸鱼、酒、检疫物资）<\/td><td>2 min<\/td><\/tr><tr><td><strong>敌方船名<\/strong><\/td><td>从 12.6 挑一个势力，取它的旗号<\/td><td>3 min<\/td><\/tr><tr><td><strong>一个钩子<\/strong><\/td><td>12.7 七个秘密里挑<strong>一个<\/strong>，只想清楚它的<strong>第一层线索<\/strong><\/td><td>10 min<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>剩下 10 分钟<\/strong>：读一遍 9.10 与 13.12。就这些。<strong>不要准备第六条船、不要准备地图、不要准备怪物数据。<\/strong><\/p>\n<blockquote class='quote aside-voice'><strong>【设计注】<\/strong> 30 分钟不是偷懒，是设计目标。<strong>备课超过 30 分钟的团，GM 会在第二个月开始疲于奔命，而长团死于 GM 疲劳的比率远高于死于玩家流失。<\/strong><\/blockquote>\n<h3>备课五问（跑任何冒险前）<\/h3>\n<ol class='mdlist'><li>这一段<strong>谁想要什么<\/strong>？（答不出＝这个 NPC 不该出场）<\/li><li>玩家<strong>不看任何骰子<\/strong>能推进吗？（不能＝你卡住了，回到 P0①）<\/li><li><strong>失败之后会发生什么？<\/strong>（答不出＝这个检定不该掷）<\/li><li>这一团结束时，桌上会留下<strong>哪一句话<\/strong>？（答不出＝没有高潮）<\/li><li><strong>反拉动线<\/strong>：如果最后是那一幕，开场该是什么？（13.3 的用法）<\/li><\/ol>\n<hr>\n<h2>13.3 冒险结构：航段脚本<\/h2>\n<h3>万能壳（任何冒险都能填进去）<\/h3>\n<blockquote class='quote aside-voice'><strong>起航 → 航程① → 航程② → 航程③ → 遭遇高潮 → 回港结算<\/strong><\/blockquote>\n<div class='tbl'><table><thead><tr><th>段<\/th><th>功能<\/th><th>时长<\/th><th>必须有的东西<\/th><\/tr><\/thead><tbody><tr><td><strong>起航<\/strong><\/td><td>立目标、给时限、露代价<\/td><td>10 min<\/td><td><strong>一条会过期的信息<\/strong><\/td><\/tr><tr><td><strong>航程①<\/strong><\/td><td>教规则（小事件）<\/td><td>15 min<\/td><td>让玩家用一次他们不会的战位<\/td><\/tr><tr><td><strong>航程②<\/strong><\/td><td>加压（中事件）<\/td><td>20 min<\/td><td><strong>一个错误的选择机会<\/strong><\/td><\/tr><tr><td><strong>航程③<\/strong><\/td><td>收拢（线索会合）<\/td><td>15 min<\/td><td><strong>三条独立通路里的第二条<\/strong><\/td><\/tr><tr><td><strong>高潮<\/strong><\/td><td>一次决定，不是一场战斗<\/td><td>30 min<\/td><td><strong>两种都能赢、都不能全赢的解法<\/strong><\/td><\/tr><tr><td><strong>回港<\/strong><\/td><td>账本、声望、传闻走形<\/td><td>15 min<\/td><td><strong>10.8 五档账本读三条<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>六段式委托（任务骨架，接委托侧）<\/h3>\n<blockquote class='quote aside-voice'><strong>接委托 → 备航 → 航行 → 遭遇 → 探险 → 结算<\/strong><\/blockquote>\n<p><strong>三条设计红线<\/strong>（10.9 的叙事版）：<\/p>\n<ol class='mdlist'><li><strong>受雇即动机<\/strong>——他们不需要理由才上船，他们已经在船上了。<\/li><li><strong>委托人必有误差<\/strong>——至少一处情报是错的，且<strong>错在委托人自己也不知道的地方<\/strong>。<\/li><li><strong>反转指向委托人一侧<\/strong>——不是路上冒出来的敌人。<\/li><\/ol>\n<p><strong>每个节点的四种问法<\/strong>（写委托时逐项过一遍）：<strong>这段的功能是什么／设计变量在哪／常见变体是什么／它的反模式是什么。<\/strong><br>反模式栏最有评审价值。举例：<\/p>\n<ul class='mdlist'><li>接委托：<strong>\"委托人全知全说\"→ 反转无藏身处<\/strong><\/li><li>备航：<strong>\"中空委托：世界里只有玩家与委托人两个人\"<\/strong><\/li><li>结算：<strong>\"无回收通道的延迟＝未发生\"<\/strong><\/li><\/ul>\n<h3>画线的时刻（本作最好的一次 GM 动作）<\/h3>\n<p>当玩家要在海图上选一条航线时（8.1）：<\/p>\n<blockquote class='quote'><strong>1. GM 递笔。<\/strong> 让他们自己画那条线，并在旁边写上代价公式（几段、什么风、几班）。<br><strong>2. GM 问一句：\"如果这条线没了，你还剩多少？\"<\/strong><br><strong>3. 让他们回答。<\/strong> 回答本身就是这一桌的战略图。<\/blockquote>\n<p><strong>为什么这一句值得单独成节<\/strong>：因为<strong>核心概念必须有物理动作承载<\/strong>。\"航线\"如果不被玩家亲手画出来，它就只是一个数。<\/p>\n<h3>反拉动线<\/h3>\n<p><strong>先想高潮，再排开场。<\/strong> 写完任何一幕，检查：从终局倒推，开场是不是<strong>唯一合理的起点<\/strong>。不是，就删开场。<\/p>\n<hr>\n<h2>13.4 节奏配比<\/h2>\n<h3>3 : 2 : 1（硬建议）<\/h3>\n<p>一次冒险内：<strong>三次小事件 : 两次中事件 : 一次大事件<\/strong>。<\/p>\n<div class='tbl'><table><thead><tr><th>级<\/th><th>定义<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td>小<\/td><td>一个检定，一个后果，5 分钟<\/td><td>一阵急风、一处浅滩、一次口角<\/td><\/tr><tr><td>中<\/td><td>三到五个检定，改变局面，20 分钟<\/td><td>一场追击、一次走私查获、一场热病<\/td><\/tr><tr><td>大<\/td><td>改变战役走向，30–60 分钟<\/td><td>一次海战、一次哗变、一个秘密的第一层被证实<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>一场团通常只放一场海战<\/strong>——它的准备与时长成本最高（9 章）。<\/p>\n<h3>四类内容轮换<\/h3>\n<blockquote class='quote'><strong>海战 / 探索 / 贸易 / 社交<\/strong> —— 连续两团不要重类。<\/blockquote>\n<p><strong>判据（跑完一次问自己）<\/strong>：这一团玩家做决定的方式，和上一团一样吗？一样＝该换了。<\/p>\n<h3>散场三问（每次团末，两分钟，各给 1 XP）<\/h3>\n<ol class='mdlist'><li><strong>我们改变了什么？<\/strong><\/li><li><strong>我们付出了什么？<\/strong><\/li><li><strong>谁因此会来找我们？<\/strong><\/li><\/ol>\n<blockquote class='quote'>这三问是 3.9 里程碑 XP 的落地机制——<strong>它同时是奖励、复盘、和下一团的备课材料<\/strong>。玩家会开始为第二问紧张。<strong>很好。<\/strong><\/blockquote>\n<hr>\n<h2>13.5 海上遭遇表（d20 主表）<\/h2>\n<p><strong>每条给一句可直接念的开场。<\/strong> 念完就即兴——<strong>深度交给桌上，不要交给纸面<\/strong>。<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>一句话开场<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>\"海面平得像一块没写完的板。已经第四个班次了。\"（<strong>无风带，7.10<\/strong>）<\/td><\/tr><tr><td>2<\/td><td>\"右舷有一块木头漂过来。上面有铁钉，而且是新钉子。\"<\/td><\/tr><tr><td>3<\/td><td>\"有人在海上。他抓着一条小艇的底。小艇是好的。\"（<strong>9.9；谁的小艇？<\/strong>）<\/td><\/tr><tr><td>4<\/td><td>\"一只鸟落在主桅上，它不飞走，也不看你。\"<\/td><\/tr><tr><td>5<\/td><td>\"前方有一片不该在这里的雾——它有一条直边。\"<\/td><\/tr><tr><td>6<\/td><td>\"风突然换了方向，而且是朝着陆地吹。\"<\/td><\/tr><tr><td>7<\/td><td>\"有条船在追另一条船。两条都比你们快。\"<\/td><\/tr><tr><td>8<\/td><td>\"海面上有油污。很多。\"（→ 12.7 秘密④，或一次事故）<\/td><\/tr><tr><td>9<\/td><td>\"一个小瓶在浪里漂。瓶子里有纸，纸是干的。\"<\/td><\/tr><tr><td>10<\/td><td>\"有人在唱歌，方向在下风。这里没人该在。\"<\/td><\/tr><tr><td>11<\/td><td>\"你们的淡水桶少了一个。没人承认。\"（<strong>内务剧，7.8<\/strong>）<\/td><\/tr><tr><td>12<\/td><td>\"一艘空船，帆还张着，舵还绑着。\"（→ <strong>11.6<\/strong>，或一个非常聪明的人）<\/td><\/tr><tr><td>13<\/td><td>\"远处有烟，三次一停。那是信号，而且不是求救。\"<\/td><\/tr><tr><td>14<\/td><td>\"水的颜色变了。有人测深（测深锤，6.5）。\"（浅滩、河口、或沉船滩）<\/td><\/tr><tr><td>15<\/td><td>\"有一群小艇绕着你们转。他们不要货，他们在等你们犯一次错。\"<\/td><\/tr><tr><td>16<\/td><td>\"海上漂着一个棺材，或者像棺材的东西。\"（<strong>别急着给答案<\/strong>）<\/td><\/tr><tr><td>17<\/td><td>\"有人喊你们的名字。距离三百米，风下。\"<\/td><\/tr><tr><td>18<\/td><td>\"起火了。在别的船上。它在顺风往你们这来。\"<\/td><\/tr><tr><td>19<\/td><td>\"一艘军舰，旗号是<strong>你们合法的<\/strong>那一个。它想借你们的船一用。\"（10.6 征用）<\/td><\/tr><tr><td>20<\/td><td>\"海图上是空的。而你们现在看见了岸。\"（<strong>+1 XP，+1 锚点，8.1<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>按海况增补（在 7.5 掷出后追加一次 d6）<\/h3>\n<div class='tbl'><table><thead><tr><th>海况<\/th><th>增补条目<\/th><\/tr><\/thead><tbody><tr><td><strong>无风（1–2）<\/strong><\/td><td>①有人提议赌牌 ②有人提议唱歌（表演，士气+1） ③底舱有异响 ④一条船在<strong>逆风移动<\/strong> ⑤漂过一片树叶，是活的 ⑥有人在哭，没人承认<\/td><\/tr><tr><td><strong>劲风—大风（15–19）<\/strong><\/td><td>①帆桁断了半根 ②货滚舱、砸伤一人 ③有条船比你们敢跑 ④海上漂着一个桅段（可捞，备料+2） ⑤舵链磨损（铁匠！） ⑥有人落水<\/td><\/tr><tr><td><strong>风暴（20）<\/strong><\/td><td>【模糊】档追加：\"风暴眼里有光，不是闪电的频率。\"（<strong>2.4 的原型<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>按海域增补<\/h3>\n<div class='tbl'><table><thead><tr><th>域（12.5）<\/th><th>追加<\/th><\/tr><\/thead><tbody><tr><td>Ⅲ 冷水海<\/td><td>冰山（瞭望 DV+3）；冻住的船；被丢弃的捕鲸小艇<\/td><\/tr><tr><td>Ⅳ 西部浅海<\/td><td>独木舟队；岸上的烟；<strong>一条你们没画进图的航道<\/strong><\/td><\/tr><tr><td>Ⅴ 恶魔纬度<\/td><td><strong>不解释的雾<\/strong>；无风的方形海域；<strong>同一艘船第二次出现<\/strong>（11.6）<\/td><\/tr><tr><td>Ⅵ 东向海<\/td><td>季风转换窗口；一艘不回应旗语的船；<strong>专利巡艇<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>13.6 NPC 即时生成器<\/h2>\n<h3>第一行：七字段速查（不许写成段落）<\/h3>\n<pre class='codeblock'><code>名字：____ 势力：____ 位置：____\n一句话性格：____\n他能给你什么：____\n他的秘密（仅 GM 可见）：____\n他的门槛（要什么才肯动）：____<\/code><\/pre>\n<p><strong>这七行是 NPC 的合法存在形式。<\/strong> 任何写成三段散文的 NPC 上桌即失效（13.1 桌上预算律）。<\/p>\n<h3>四掷骰（现场造一个）<\/h3>\n<div class='tbl'><table><thead><tr><th>掷<\/th><th>d20 项<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td><strong>名字<\/strong>（按出身地）<\/td><td>d20 表，12.4 各港有自己的名册<\/td><td>多洛雷斯／霍恩／帕尔米贾诺<\/td><\/tr><tr><td><strong>性格<\/strong>（一句话）<\/td><td>d20<\/td><td>\"只说别人已经知道的话\"／\"记得每一个欠他钱的人\"／\"<strong>从不当面拒绝<\/strong>\"<\/td><\/tr><tr><td><strong>他想要的<\/strong><\/td><td>d20<\/td><td>一次体面的死亡／一个名字被写进日志／钱，但<strong>为了一个他不肯说的理由<\/strong>／让某个人后悔<\/td><\/tr><tr><td><strong>他怕的<\/strong><\/td><td>d20<\/td><td>深水／被认错／<strong>他做过的那件事被说成好事<\/strong>／一座他回不去的城<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>第三掷与第四掷必须不成比例。<\/strong>（\"他想要钱，他怕穷\"是废卡。<strong>\"他想要钱，他怕被认出来\"是好卡。<\/strong>）<\/blockquote>\n<h3>「在意」栏（任何一次社交检定前必须能回答）<\/h3>\n<blockquote class='quote'><strong>他在意什么？<\/strong> 答不出＝这个 NPC 还没到出场的时候（5.4）。<br>一个 NPC 的「在意」栏写 <strong>2–3 条<\/strong>，够一场戏用一辈子。<\/blockquote>\n<h3>排班（让世界自己走）<\/h3>\n<p><strong>每个重要 NPC 一天有三个班次在做别的事。<\/strong> 玩家找不到他，通常是<strong>时辰不对<\/strong>——这是最好用的、也最便宜的真实感发生器。<\/p>\n<hr>\n<h2>13.7 奖励经济：四货币，互不兑换<\/h2>\n<div class='tbl'><table><thead><tr><th>货币<\/th><th>买到什么<\/th><th>买不到什么<\/th><\/tr><\/thead><tbody><tr><td><strong>XP<\/strong><\/td><td>等级与能力（3.9）<\/td><td>声望、船、钱<\/td><\/tr><tr><td><strong>银币<\/strong><\/td><td>装备、补给、修理、许可证押金<\/td><td>等级、声望（<strong>只能间接买到传闻<\/strong>）<\/td><\/tr><tr><td><strong>声望<\/strong><\/td><td><strong>准入<\/strong>（10.8 八档）<\/td><td>钱、等级<\/td><\/tr><tr><td><strong>船<\/strong><\/td><td>航线、吨位、股份（10.6）<\/td><td>角色的个人成长<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>不可兑换是本作的反垄断设计<\/strong>：任何一条玩法路径都不该能自动产出另外三条。<strong>如果一桌玩家找到了能换的路，那不是漏洞，那是他们该被奖励的一次发明——但请把它记进船志并观察它是否会吞掉别的玩法。<\/strong><\/p>\n<h3>银币购买力表（GM 报价用，全部有实档）<\/h3>\n<div class='tbl'><table><thead><tr><th>银币<\/th><th>能买到<\/th><\/tr><\/thead><tbody><tr><td><strong>1<\/strong><\/td><td>一人在港一日口粮；一次渡河；一磅火绳<\/td><\/tr><tr><td><strong>3<\/strong><\/td><td>一副药；一夜带床的客栈；一条消息的<strong>入门价<\/strong><\/td><\/tr><tr><td><strong>10<\/strong><\/td><td>一柄好猎刀；一名水手的首月预付；一次报关的小额通融<\/td><\/tr><tr><td><strong>20<\/strong><\/td><td>一人的全部起始身家；一件软甲；一次小修理<\/td><\/tr><tr><td><strong>60<\/strong><\/td><td>一箱靛蓝；一套全帆料的零头；一次失败的赎金谈判<\/td><\/tr><tr><td><strong>200<\/strong><\/td><td>一舱位高档货的产地价；一张被买断的海图<\/td><\/tr><tr><td><strong>600<\/strong><\/td><td>一人的赎金（英批量实档 608）<\/td><\/tr><tr><td><strong>3,000 银币＝300 金币<\/strong><\/td><td>一张船票的一半？不——<strong>是一根大桅<\/strong>（6.9）<\/td><\/tr><tr><td><strong>30,000 银币＝3,000 金币<\/strong><\/td><td>私掠许可证的保证金（10.6）＝<strong>水手 104 年年薪<\/strong><\/td><\/tr><tr><td><strong>10,000 金币<\/strong><\/td><td>一艘盖伦（6.9）<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>13.8 玩家死亡与新角色<\/h2>\n<p><strong>死亡是船上的常态。<\/strong> 一船人跑二十团不死一个，说明 GM 在撒谎（P3 支柱失效）。<\/p>\n<h3>三条准备<\/h3>\n<ol class='mdlist'><li><strong>接班船员模板<\/strong>：一个半空的角色卡，属性已定（3/3/3/2/2），只等名字。<strong>死亡那一刻，玩家应该 3 分钟内坐下继续。<\/strong><\/li><li><strong>遗嘱与遗产<\/strong>（4.8）：角色有一件可以留给别人的东西。GM 每五团问一次\"你的遗嘱改不改\"。<\/li><li><strong>葬礼场景<\/strong>：海葬需要 <strong>1 班次 + 一段帆布或一具木箱<\/strong>。船员士气 −1/段，<strong>两段后恢复<\/strong>。有人主持（领导或表演 DV13）则不扣。<\/li><\/ol>\n<blockquote class='quote'><strong>不要跳过葬礼。<\/strong> 它是本作唯一一处\"数值归零、意义归一\"的时刻。<\/blockquote>\n<h3>死亡的正确使用<\/h3>\n<ul class='mdlist'><li><strong>让死亡是后果，不是惩罚。<\/strong> 一次鲁莽的选择换来一次死亡，玩家会记住那个<strong>选择<\/strong>；一次随机骰子换来一次死亡，玩家会记住<strong>恨你<\/strong>。<\/li><li><strong>濒死比死亡好用<\/strong>（3.7）：伤疤是故事资产，死亡是故事的结束。<\/li><li><strong>允许玩家救回一次。<\/strong> 一生一次，GM 不说，玩家自己会知道。<\/li><\/ul>\n<hr>\n<h2>13.9 四类难题（各一条处理路径）<\/h2>\n<div class='tbl'><table><thead><tr><th>难题<\/th><th>一条路<\/th><\/tr><\/thead><tbody><tr><td><strong>玩家抢船 / 分裂<\/strong><\/td><td><strong>把账本摊开。<\/strong> 10.7 团队账本 + 10.6 股份表，公开宣读。<strong>份额纠纷用钱和规则解决，不要用外交辞令解决<\/strong>——一旦有规则，戏就出来了<\/td><\/tr><tr><td><strong>桌内不和 / 有人沉默<\/strong><\/td><td><strong>点名给他一个只有他能做的动作<\/strong>（不是\"你怎么看\"，是\"你的火枪在那边，你打不打\"）。<strong>战位制（9.4）天生是解药<\/strong><\/td><\/tr><tr><td><strong>超模构筑<\/strong><\/td><td><strong>先查支柱⑤<\/strong>（13.1）：他是不是让某条支柱变成默认无趣？是→改那一条规则，不是削那个角色。<strong>否→恭喜他，那是问卷里说的\"通过自己的研究给团队带来提升\"<\/strong><\/td><\/tr><tr><td><strong>超自然档位分歧<\/strong><\/td><td><strong>回到 11 章第一页的三选一<\/strong>，并且<strong>当场重选一次<\/strong>：本桌默认 B（模糊）。<strong>任何一次\"那到底是不是真的\"的争论，都是 GM 该闭嘴的时刻<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>负面清单（六条，出现即修）<\/h3>\n<ol class='mdlist'><li><strong>假选择<\/strong>（选 A 选 B 结果一样）<\/li><li><strong>单通路卡死<\/strong>（违反 P0①）<\/li><li><strong>密度过载、不可跑<\/strong>（违反桌上预算律）<\/li><li><strong>长线数值膨胀<\/strong>（10 级封顶是设计，不是遗漏）<\/li><li><strong>靠剧透控制的剧本<\/strong>（一次性剧本的病）<\/li><li><strong>GM 觉得记录比带团累<\/strong>——<strong>这条出现时，砍规则。先砍追踪表，再砍子系统的开关。<\/strong><\/li><\/ol>\n<hr>\n<h2>13.10 变体规则<\/h2>\n<div class='tbl'><table><thead><tr><th>变体<\/th><th>改什么<\/th><th>适合<\/th><\/tr><\/thead><tbody><tr><td><strong>更写实<\/strong><\/td><td>潮汐点上限 2；给养与弹药消耗加倍；启用 9.1 部位与致残；未受训一律劣势（3.2）<\/td><td>历史考据桌（问卷 4 级）<\/td><\/tr><tr><td><strong>更残酷<\/strong><\/td><td>上面全部 ＋ 镇定不可自然恢复 ＋ 具名船员会死且<strong>不补位<\/strong><\/td><td>一次性恐怖团<\/td><\/tr><tr><td><strong>更电影化<\/strong><\/td><td>潮汐点 +2（上限 5）；启用 <strong>13.11 特写展开<\/strong><\/td><td>长团的情绪调剂<\/td><\/tr><tr><td><strong>更恐怖<\/strong><\/td><td>第 11 章【模糊】或【显性】＋ 海况表 20 格改为\"它\"＋ 无风带士气不可恢复<\/td><td>航海恐怖战役<\/td><\/tr><tr><td><strong>更经营<\/strong><\/td><td>启用四轨船团线（14.4 变体包 D 位）＋ 委托卡每战役抽 3 张整场有效<\/td><td>阳谋与经营桌<\/td><\/tr><tr><td><strong>更快<\/strong><\/td><td>用 9.8 群战处理所有非关键海战；旅程打包（7.3）默认开<\/td><td>时间少的固定桌<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>13.11 【变体】特写展开（电影化机制，<strong>非主线<\/strong>）<\/h2>\n<blockquote class='quote'><strong>定位（建团问卷已锁）<\/strong>：本作主线是<strong>数值化＋博弈化战斗<\/strong>。本机制是<strong>外加的一层<\/strong>，取代\"激励/灵感点\"那一类系统，<strong>不作为主线<\/strong>。开团前全桌决定是否启用；建议只在<strong>一幕里最多两次<\/strong>使用它。<\/blockquote>\n<h3>它解决什么问题<\/h3>\n<p>纯数值战斗跑久了会滑向两件事：<strong>流程化<\/strong>（每轮一样）和<strong>可预期<\/strong>（大家都知道接下来会发生什么）。本机制用<strong>极少的规则预算<\/strong>打断这两件事——它不替代判定，它<strong>改变谁有话语权<\/strong>。<\/p>\n<h3>结构：镜头 × 揭示<\/h3>\n<p><strong>启用后，每名角色额外持有两栏<\/strong>（写在角色卡背面）：<\/p>\n<pre class='codeblock'><code>我的问题：____（一句关于这个角色的、连他自己都不确定答案的问题）\n我的揭示：□ □ □（三格，逐步打开）<\/code><\/pre>\n<p><strong>「我的问题」必须在建卡时写，且必须是角色自己不知道的<\/strong>（例：\"我到底会不会为了活着而扔下人？\"）。<\/p>\n<h3>使用规则（只有三条）<\/h3>\n<div class='tbl'><table><thead><tr><th>规则<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><strong>① 开一格<\/strong><\/td><td>当一次场景的<strong>结果<\/strong>直接触及「我的问题」时，玩家可以说\"我要一个特写\"，GM 给他 <strong>30 秒独白或一个不受判定约束的小动作<\/strong>（不能造成伤害、不能取得关键信息、不能改变战局结果）。然后 GM 打开一格揭示。<\/td><\/tr><tr><td><strong>② 三格满<\/strong><\/td><td>「我的问题」<strong>必须被回答<\/strong>——由玩家回答，GM 不许代答。回答之后：本角色获得一次<strong>改写目标或秘密<\/strong>的权利（4.8），<strong>以及一次 +1 XP（卓越扮演）<\/strong>。<\/td><\/tr><tr><td><strong>③ 每幕最多两次<\/strong><\/td><td>一整段冒险（13.3 的六段）内，全桌合计最多两次。<strong>第三次说\"我要特写\"的人，被拒绝，且理由由 GM 当场念本条。<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三条硬边界（防止它吃掉主线）<\/h3>\n<ol class='mdlist'><li><strong>特写内不掷骰、不结算伤害、不推进任何时钟（9.7）。<\/strong> 它是<strong>镜头<\/strong>，不是<strong>动作<\/strong>。<\/li><li><strong>特写不能改变已经结算的事实。<\/strong> 人已经死了，特写只能改变<strong>这件事意味着什么<\/strong>。<\/li><li><strong>GM 有权说\"现在不是你的镜头\"<\/strong>——但必须<strong>当场指定下一个轮到谁<\/strong>。被打断的人不该被忘掉。<\/li><\/ol>\n<blockquote class='quote'><strong>【设计注】<\/strong> 本机制与潮汐点的分工是刻意的：<strong>潮汐点买运气，特写买意义。<\/strong> 前者是玩家对骰子的权力，后者是玩家对叙事的权力——<strong>两条通路互不兑换，所以谁也不会垄断桌面的话语权。<\/strong><br>而它每幕限两次、且不能改变任何结算，是因为问卷里那句话：<strong>\"自由度相对低一点，能基本以严谨的判定规范故事而减少口胡。\"<\/strong> 本机制的全部设计空间，就是在这句话和\"角色要立体\"之间的那条窄缝。<\/blockquote>\n<hr>\n<h2>13.12 三十秒速查<\/h2>\n<p><strong>开工前<\/strong>：P0 五原则 → GM 议程五条 → 五支柱 → 桌上预算律（一句话或一张卡）<br><strong>备课<\/strong>：30 分钟，五个替换（船名／出发港／货／敌船／<strong>一个秘密的线索①<\/strong>）<br><strong>备课五问<\/strong>：谁想要什么／玩家不掷骰能推进吗／失败会怎样／留下哪句话／反拉动线<br><strong>结构<\/strong>：起航—航程×3—高潮—回港；六段式委托；<strong>红线三条<\/strong>；<strong>画线的时刻<\/strong>要递笔<br><strong>节奏<\/strong>：3:2:1；四类轮换；散场三问（各 1 XP）<br><strong>遭遇表 d20<\/strong>：每条一句开场，念完就即兴<br><strong>NPC<\/strong>：七字段速查行 ＋ 四掷骰 ＋「在意」2–3 条 ＋ 排班（一天三个班次不在）<br><strong>四货币<\/strong>：XP／银／声望／船，<strong>互不兑换<\/strong><br><strong>死亡<\/strong>：接班模板 3 分钟上桌；葬礼 1 班次；<strong>濒死比死亡好用<\/strong><br><strong>难题<\/strong>：摊账本／给独占动作／查支柱⑤／回 11 章第一页<br><strong>负面清单六条<\/strong>；<strong>\"GM 觉得记录比带团累\"＝砍规则<\/strong><\/p>\n<hr>\n<p><em>到这里，工具都齐了。下一章是三件已经做好的东西：一场入门冒险的完整版、一场中级的、以及一整场战役的骨架。<\/em><\/p>","text":"GM 不写故事。GM 建一台会自己讲故事的机器，然后站在旁边，被它吓到。 本章是主持的唯一入口章。 如果你只有二十分钟，读 13.1、13.3、13.5、13.12。 13.1 主持原则 五条 P0 原则（这五条不落实，后面全部白搭） # 原则 一句话操作 ① 关键线索永不投骰 剧情的唯一通路不需要检定。玩家做对了动作，就给答案（5.0①） ② 失败三选一 代价／复杂化／信息。 不允许\"什么都没发生\" （3.2） ③ Let it Ride 同一件事、同一段航程，只掷一次（5.0②） ④ GM 议程五条 见下 ⑤ 天赋不许废支柱 任何一个天赋、专长、变体，都不得让本书五条风味支柱之一变成默认无趣（见下） GM 议程（五条，冲突时按顺序优先） 让这个世界跑得起来、危险、并且迷人。 三个词都要——只\"危险\"是恐怖团，只\"迷人\"是观光团。 让玩家做船员。 不替他们决定、不预先原谅、不救场。 船会沉，人也会。 从局面里得到奖励，不从规则里。 玩家说了一句聪明话，比掷出 20 更值得奖励。 失败推进故事。 一次失败之后，桌面上的局面必须 更有趣 ，不是更糟。 别抹平尖锐的东西。 道德困境、船上的权力、一个玩家把另一个玩家推进坑里（11.2 羁绊投射）—— 这些不是要处理的问题，这是本作的内容 。 五条风味支柱（⑤的判据） 任何新规则在进入你的桌前，先问它有没有让下面五条之一变成 默认无趣 ： P1 船是角色 ｜ P2 海是对手 ｜ P3 血很贵 ｜ P4 名声有账本 ｜ P5 合法性是一种资产 十条铁律（本作的世界观操作系统） 来自两部被反复研究的作品，逐条可执行： 选择必有代价 ；2. 后果要延迟爆发 ；3. 知识就是力量 （字面意义，见 5.5、8.7）； 风味文本是世界观的最小单位 （一件物品上一句话，比一页设定有用）；5. Less is more ； NPC 有自己的日程 （13.6）；7. 失败是内容，不是惩罚 ；8. 环境先于说明 （先让他们看见，再告诉他们）； 音乐与地域绑定 （同一首歌只在同一座港放，玩家会开始保护那座城市）； 尊重来源，敢续自己的魂 。 桌上预算律（最强的一条过滤器） 凡不能压到一张卡或一句话的资产，不上桌。 备课时如果一段设定需要超过 30 秒念完， 它今天不是内容，是负担 。写进船志，下次再说。 13.2 第一团怎么开（30 分钟备课） 用第 2 章《暴风中的信号》改。 五个替换，一个都不许多做： 换什么 怎么换 用时 船名 让玩家投票取一个。 这一步不可跳过 ——他们给的名字，他们就会救 3 min 出发港 从 12.4 挑一个母港型（新手推荐圣克鲁斯） 2 min 货 换成不值钱但 有主 的东西（咸鱼、酒、检疫物资） 2 min 敌方船名 从 12.6 挑一个势力，取它的旗号 3 min 一个钩子 12.7 七个秘密里挑 一个 ，只想清楚它的 第一层线索 10 min 剩下 10 分钟 ：读一遍 9.10 与 13.12。就这些。 不要准备第六条船、不要准备地图、不要准备怪物数据。 【设计注】 30 分钟不是偷懒，是设计目标。 备课超过 30 分钟的团，GM 会在第二个月开始疲于奔命，而长团死于 GM 疲劳的比率远高于死于玩家流失。 备课五问（跑任何冒险前） 这一段 谁想要什么 ？（答不出＝这个 NPC 不该出场） 玩家 不看任何骰子 能推进吗？（不能＝你卡住了，回到 P0①） 失败之后会发生什么？ （答不出＝这个检定不该掷） 这一团结束时，桌上会留下 哪一句话 ？（答不出＝没有高潮） 反拉动线 ：如果最后是那一幕，开场该是什么？（13.3 的用法） 13.3 冒险结构：航段脚本 万能壳（任何冒险都能填进去） 起航 → 航程① → 航程② → 航程③ → 遭遇高潮 → 回港结算 段 功能 时长 必须有的东西 起航 立目标、给时限、露代价 10 min 一条会过期的信息 航程① 教规则（小事件） 15 min 让玩家用一次他们不会的战位 航程② 加压（中事件） 20 min 一个错误的选择机会 航程③ 收拢（线索会合） 15 min 三条独立通路里的第二条 高潮 一次决定，不是一场战斗 30 min 两种都能赢、都不能全赢的解法 回港 账本、声望、传闻走形 15 min 10.8 五档账本读三条 六段式委托（任务骨架，接委托侧） 接委托 → 备航 → 航行 → 遭遇 → 探险 → 结算 三条设计红线 （10.9 的叙事版）： 受雇即动机 ——他们不需要理由才上船，他们已经在船上了。 委托人必有误差 ——至少一处情报是错的，且 错在委托人自己也不知道的地方 。 反转指向委托人一侧 ——不是路上冒出来的敌人。 每个节点的四种问法 （写委托时逐项过一遍）： 这段的功能是什么／设计变量在哪／常见变体是什么／它的反模式是什么。 反模式栏最有评审价值。举例： 接委托： \"委托人全知全说\"→ 反转无藏身处 备航： \"中空委托：世界里只有玩家与委托人两个人\" 结算： \"无回收通道的延迟＝未发生\" 画线的时刻（本作最好的一次 GM 动作） 当玩家要在海图上选一条航线时（8.1）： 1. GM 递笔。 让他们自己画那条线，并在旁边写上代价公式（几段、什么风、几班）。 2. GM 问一句：\"如果这条线没了，你还剩多少？\" 3. 让他们回答。 回答本身就是这一桌的战略图。 为什么这一句值得单独成节 ：因为 核心概念必须有物理动作承载 。\"航线\"如果不被玩家亲手画出来，它就只是一个数。 反拉动线 先想高潮，再排开场。 写完任何一幕，检查：从终局倒推，开场是不是 唯一合理的起点 。不是，就删开场。 13.4 节奏配比 3 : 2 : 1（硬建议） 一次冒险内： 三次小事件 : 两次中事件 : 一次大事件 。 级 定义 例 小 一个检定，一个后果，5 分钟 一阵急风、一处浅滩、一次口角 中 三到五个检定，改变局面，20 分钟 一场追击、一次走私查获、一场热病 大 改变战役走向，30–60 分钟 一次海战、一次哗变、一个秘密的第一层被证实 一场团通常只放一场海战 ——它的准备与时长成本最高（9 章）。 四类内容轮换 海战 / 探索 / 贸易 / 社交 —— 连续两团不要重类。 判据（跑完一次问自己） ：这一团玩家做决定的方式，和上一团一样吗？一样＝该换了。 散场三问（每次团末，两分钟，各给 1 XP） 我们改变了什么？ 我们付出了什么？ 谁因此会来找我们？ 这三问是 3.9 里程碑 XP 的落地机制—— 它同时是奖励、复盘、和下一团的备课材料 。玩家会开始为第二问紧张。 很好。 13.5 海上遭遇表（d20 主表） 每条给一句可直接念的开场。 念完就即兴—— 深度交给桌上，不要交给纸面 。 d20 一句话开场 1 \"海面平得像一块没写完的板。已经第四个班次了。\"（ 无风带，7.10 ） 2 \"右舷有一块木头漂过来。上面有铁钉，而且是新钉子。\" 3 \"有人在海上。他抓着一条小艇的底。小艇是好的。\"（ 9.9；谁的小艇？ ） 4 \"一只鸟落在主桅上，它不飞走，也不看你。\" 5 \"前方有一片不该在这里的雾——它有一条直边。\" 6 \"风突然换了方向，而且是朝着陆地吹。\" 7 \"有条船在追另一条船。两条都比你们快。\" 8 \"海面上有油污。很多。\"（→ 12.7 秘密④，或一次事故） 9 \"一个小瓶在浪里漂。瓶子里有纸，纸是干的。\" 10 \"有人在唱歌，方向在下风。这里没人该在。\" 11 \"你们的淡水桶少了一个。没人承认。\"（ 内务剧，7.8 ） 12 \"一艘空船，帆还张着，舵还绑着。\"（→ 11.6 ，或一个非常聪明的人） 13 \"远处有烟，三次一停。那是信号，而且不是求救。\" 14 \"水的颜色变了。有人测深（测深锤，6.5）。\"（浅滩、河口、或沉船滩） 15 \"有一群小艇绕着你们转。他们不要货，他们在等你们犯一次错。\" 16 \"海上漂着一个棺材，或者像棺材的东西。\"（ 别急着给答案 ） 17 \"有人喊你们的名字。距离三百米，风下。\" 18 \"起火了。在别的船上。它在顺风往你们这来。\" 19 \"一艘军舰，旗号是 你们合法的 那一个。它想借你们的船一用。\"（10.6 征用） 20 \"海图上是空的。而你们现在看见了岸。\"（ +1 XP，+1 锚点，8.1 ） 按海况增补（在 7.5 掷出后追加一次 d6） 海况 增补条目 无风（1–2） ①有人提议赌牌 ②有人提议唱歌（表演，士气+1） ③底舱有异响 ④一条船在 逆风移动 ⑤漂过一片树叶，是活的 ⑥有人在哭，没人承认 劲风—大风（15–19） ①帆桁断了半根 ②货滚舱、砸伤一人 ③有条船比你们敢跑 ④海上漂着一个桅段（可捞，备料+2） ⑤舵链磨损（铁匠！） ⑥有人落水 风暴（20） 【模糊】档追加：\"风暴眼里有光，不是闪电的频率。\"（ 2.4 的原型 ） 按海域增补 域（12.5） 追加 Ⅲ 冷水海 冰山（瞭望 DV+3）；冻住的船；被丢弃的捕鲸小艇 Ⅳ 西部浅海 独木舟队；岸上的烟； 一条你们没画进图的航道 Ⅴ 恶魔纬度 不解释的雾 ；无风的方形海域； 同一艘船第二次出现 （11.6） Ⅵ 东向海 季风转换窗口；一艘不回应旗语的船； 专利巡艇 13.6 NPC 即时生成器 第一行：七字段速查（不许写成段落） 名字：____ 势力：____ 位置：____ 一句话性格：____ 他能给你什么：____ 他的秘密（仅 GM 可见）：____ 他的门槛（要什么才肯动）：____ 这七行是 NPC 的合法存在形式。 任何写成三段散文的 NPC 上桌即失效（13.1 桌上预算律）。 四掷骰（现场造一个） 掷 d20 项 例 名字 （按出身地） d20 表，12.4 各港有自己的名册 多洛雷斯／霍恩／帕尔米贾诺 性格 （一句话） d20 \"只说别人已经知道的话\"／\"记得每一个欠他钱的人\"／\" 从不当面拒绝 \" 他想要的 d20 一次体面的死亡／一个名字被写进日志／钱，但 为了一个他不肯说的理由 ／让某个人后悔 他怕的 d20 深水／被认错／ 他做过的那件事被说成好事 ／一座他回不去的城 第三掷与第四掷必须不成比例。 （\"他想要钱，他怕穷\"是废卡。 \"他想要钱，他怕被认出来\"是好卡。 ） 「在意」栏（任何一次社交检定前必须能回答） 他在意什么？ 答不出＝这个 NPC 还没到出场的时候（5.4）。 一个 NPC 的「在意」栏写 2–3 条 ，够一场戏用一辈子。 排班（让世界自己走） 每个重要 NPC 一天有三个班次在做别的事。 玩家找不到他，通常是 时辰不对 ——这是最好用的、也最便宜的真实感发生器。 13.7 奖励经济：四货币，互不兑换 货币 买到什么 买不到什么 XP 等级与能力（3.9） 声望、船、钱 银币 装备、补给、修理、许可证押金 等级、声望（ 只能间接买到传闻 ） 声望 准入 （10.8 八档） 钱、等级 船 航线、吨位、股份（10.6） 角色的个人成长 不可兑换是本作的反垄断设计 ：任何一条玩法路径都不该能自动产出另外三条。 如果一桌玩家找到了能换的路，那不是漏洞，那是他们该被奖励的一次发明——但请把它记进船志并观察它是否会吞掉别的玩法。 银币购买力表（GM 报价用，全部有实档） 银币 能买到 1 一人在港一日口粮；一次渡河；一磅火绳 3 一副药；一夜带床的客栈；一条消息的 入门价 10 一柄好猎刀；一名水手的首月预付；一次报关的小额通融 20 一人的全部起始身家；一件软甲；一次小修理 60 一箱靛蓝；一套全帆料的零头；一次失败的赎金谈判 200 一舱位高档货的产地价；一张被买断的海图 600 一人的赎金（英批量实档 608） 3,000 银币＝300 金币 一张船票的一半？不—— 是一根大桅 （6.9） 30,000 银币＝3,000 金币 私掠许可证的保证金（10.6）＝ 水手 104 年年薪 10,000 金币 一艘盖伦（6.9） 13.8 玩家死亡与新角色 死亡是船上的常态。 一船人跑二十团不死一个，说明 GM 在撒谎（P3 支柱失效）。 三条准备 接班船员模板 ：一个半空的角色卡，属性已定（3/3/3/2/2），只等名字。 死亡那一刻，玩家应该 3 分钟内坐下继续。 遗嘱与遗产 （4.8）：角色有一件可以留给别人的东西。GM 每五团问一次\"你的遗嘱改不改\"。 葬礼场景 ：海葬需要 1 班次 + 一段帆布或一具木箱 。船员士气 −1/段， 两段后恢复 。有人主持（领导或表演 DV13）则不扣。 不要跳过葬礼。 它是本作唯一一处\"数值归零、意义归一\"的时刻。 死亡的正确使用 让死亡是后果，不是惩罚。 一次鲁莽的选择换来一次死亡，玩家会记住那个 选择 ；一次随机骰子换来一次死亡，玩家会记住 恨你 。 濒死比死亡好用 （3.7）：伤疤是故事资产，死亡是故事的结束。 允许玩家救回一次。 一生一次，GM 不说，玩家自己会知道。 13.9 四类难题（各一条处理路径） 难题 一条路 玩家抢船 / 分裂 把账本摊开。 10.7 团队账本 + 10.6 股份表，公开宣读。 份额纠纷用钱和规则解决，不要用外交辞令解决 ——一旦有规则，戏就出来了 桌内不和 / 有人沉默 点名给他一个只有他能做的动作 （不是\"你怎么看\"，是\"你的火枪在那边，你打不打\"）。 战位制（9.4）天生是解药 超模构筑 先查支柱⑤ （13.1）：他是不是让某条支柱变成默认无趣？是→改那一条规则，不是削那个角色。 否→恭喜他，那是问卷里说的\"通过自己的研究给团队带来提升\" 超自然档位分歧 回到 11 章第一页的三选一 ，并且 当场重选一次 ：本桌默认 B（模糊）。 任何一次\"那到底是不是真的\"的争论，都是 GM 该闭嘴的时刻 负面清单（六条，出现即修） 假选择 （选 A 选 B 结果一样） 单通路卡死 （违反 P0①） 密度过载、不可跑 （违反桌上预算律） 长线数值膨胀 （10 级封顶是设计，不是遗漏） 靠剧透控制的剧本 （一次性剧本的病） GM 觉得记录比带团累 —— 这条出现时，砍规则。先砍追踪表，再砍子系统的开关。 13.10 变体规则 变体 改什么 适合 更写实 潮汐点上限 2；给养与弹药消耗加倍；启用 9.1 部位与致残；未受训一律劣势（3.2） 历史考据桌（问卷 4 级） 更残酷 上面全部 ＋ 镇定不可自然恢复 ＋ 具名船员会死且 不补位 一次性恐怖团 更电影化 潮汐点 +2（上限 5）；启用 13.11 特写展开 长团的情绪调剂 更恐怖 第 11 章【模糊】或【显性】＋ 海况表 20 格改为\"它\"＋ 无风带士气不可恢复 航海恐怖战役 更经营 启用四轨船团线（14.4 变体包 D 位）＋ 委托卡每战役抽 3 张整场有效 阳谋与经营桌 更快 用 9.8 群战处理所有非关键海战；旅程打包（7.3）默认开 时间少的固定桌 13.11 【变体】特写展开（电影化机制， 非主线 ） 定位（建团问卷已锁） ：本作主线是 数值化＋博弈化战斗 。本机制是 外加的一层 ，取代\"激励/灵感点\"那一类系统， 不作为主线 。开团前全桌决定是否启用；建议只在 一幕里最多两次 使用它。 它解决什么问题 纯数值战斗跑久了会滑向两件事： 流程化 （每轮一样）和 可预期 （大家都知道接下来会发生什么）。本机制用 极少的规则预算 打断这两件事——它不替代判定，它 改变谁有话语权 。 结构：镜头 × 揭示 启用后，每名角色额外持有两栏 （写在角色卡背面）： 我的问题：____（一句关于这个角色的、连他自己都不确定答案的问题） 我的揭示：□ □ □（三格，逐步打开） 「我的问题」必须在建卡时写，且必须是角色自己不知道的 （例：\"我到底会不会为了活着而扔下人？\"）。 使用规则（只有三条） 规则 内容 ① 开一格 当一次场景的 结果 直接触及「我的问题」时，玩家可以说\"我要一个特写\"，GM 给他 30 秒独白或一个不受判定约束的小动作 （不能造成伤害、不能取得关键信息、不能改变战局结果）。然后 GM 打开一格揭示。 ② 三格满 「我的问题」 必须被回答 ——由玩家回答，GM 不许代答。回答之后：本角色获得一次 改写目标或秘密 的权利（4.8）， 以及一次 +1 XP（卓越扮演） 。 ③ 每幕最多两次 一整段冒险（13.3 的六段）内，全桌合计最多两次。 第三次说\"我要特写\"的人，被拒绝，且理由由 GM 当场念本条。 三条硬边界（防止它吃掉主线） 特写内不掷骰、不结算伤害、不推进任何时钟（9.7）。 它是 镜头 ，不是 动作 。 特写不能改变已经结算的事实。 人已经死了，特写只能改变 这件事意味着什么 。 GM 有权说\"现在不是你的镜头\" ——但必须 当场指定下一个轮到谁 。被打断的人不该被忘掉。 【设计注】 本机制与潮汐点的分工是刻意的： 潮汐点买运气，特写买意义。 前者是玩家对骰子的权力，后者是玩家对叙事的权力—— 两条通路互不兑换，所以谁也不会垄断桌面的话语权。 而它每幕限两次、且不能改变任何结算，是因为问卷里那句话： \"自由度相对低一点，能基本以严谨的判定规范故事而减少口胡。\" 本机制的全部设计空间，就是在这句话和\"角色要立体\"之间的那条窄缝。 13.12 三十秒速查 开工前 ：P0 五原则 → GM 议程五条 → 五支柱 → 桌上预算律（一句话或一张卡） 备课 ：30 分钟，五个替换（船名／出发港／货／敌船／ 一个秘密的线索① ） 备课五问 ：谁想要什么／玩家不掷骰能推进吗／失败会怎样／留下哪句话／反拉动线 结构 ：起航—航程×3—高潮—回港；六段式委托； 红线三条 ； 画线的时刻 要递笔 节奏 ：3:2:1；四类轮换；散场三问（各 1 XP） 遭遇表 d20 ：每条一句开场，念完就即兴 NPC ：七字段速查行 ＋ 四掷骰 ＋「在意」2–3 条 ＋ 排班（一天三个班次不在） 四货币 ：XP／银／声望／船， 互不兑换 死亡 ：接班模板 3 分钟上桌；葬礼 1 班次； 濒死比死亡好用 难题 ：摊账本／给独占动作／查支柱⑤／回 11 章第一页 负面清单六条 ； \"GM 觉得记录比带团累\"＝砍规则 到这里，工具都齐了。下一章是三件已经做好的东西：一场入门冒险的完整版、一场中级的、以及一整场战役的骨架。"},{"num":"14","title":"冒险模组与战役框架","vol":"卷三 · 世界与主持区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>模组不是故事。模组是一台会自己讲故事的机器，而玩家是它唯一的燃料。<\/em><\/blockquote>\n<p><strong>本章的写作纪律<\/strong>（已定，全章遵守）：<\/p>\n<blockquote class='quote'><strong>模组是系统的展销会。<\/strong> 每个模组刻意让每个核心系统至少出场一次。出场表在 14.1.0 / 14.2.0，GM 跑之前先看那张表——它会告诉你这一团该练什么。<br><strong>每个模组标注四元数据<\/strong>：人数／时长／主持难度／安全提示。这是被反复验证过的职业标准，不是格式装饰。<br><strong>每个场景必须有失败态<\/strong>，且<strong>至少两条通路<\/strong>（13.1 P0①、8.4 三线索原则）。<\/blockquote>\n<hr>\n<h2>14.1 入门冒险《暴风中的信号》（完整版）<\/h2>\n<p><strong>四元数据<\/strong>：<strong>1 GM ＋ 3–4 名玩家｜4–6 小时｜难度：低（第一次主持就够）｜安全提示：海难、溺水、有人会被放弃<\/strong><\/p>\n<h3>14.1.0 系统出场表<\/h3>\n<div class='tbl'><table><thead><tr><th>系统<\/th><th>在哪出场<\/th><\/tr><\/thead><tbody><tr><td>判定与难度（3.2）<\/td><td>全程<\/td><\/tr><tr><td>潮汐点（3.3）<\/td><td>场景 2 与 4——<strong>故意让它不够用<\/strong><\/td><\/tr><tr><td>时间尺度与班次（3.6／7.3）<\/td><td>风暴的三个班次<\/td><\/tr><tr><td>航行轮（7.3）<\/td><td>场景 1<\/td><\/tr><tr><td>士气（7.7）<\/td><td>场景 3 的谈判线<\/td><\/tr><tr><td>疲劳与疾病（7.8）<\/td><td>尾声钩子②的伏笔<\/td><\/tr><tr><td>战斗（9.1）／海战（9.3–9.5）／追击（9.7）／接舷（9.6）<\/td><td>场景 3<\/td><\/tr><tr><td>贸易（10.1／10.2）<\/td><td>场景 2 的货与场景 4 的账<\/td><\/tr><tr><td>恶名与声望（10.8）<\/td><td><strong>场景 4 的结算——本冒险真正的后果在这里<\/strong><\/td><\/tr><tr><td>超自然（11）<\/td><td><strong>只出现一次，且【模糊】档<\/strong>：风眼边缘的橙红光<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>开团前必答<\/strong>：<strong>今年是哪一年？<\/strong>（12.2）它决定红隼号的旗号是否合法（10.6）。<\/p>\n<hr>\n<h3>场景 0 · 起航（10 分钟）<\/h3>\n<p><strong>GM 朗读<\/strong>（2.4 原文，此处不重复）。<\/p>\n<p><strong>新增：起航时必须给出的三条信息<\/strong>（缺一条，本冒险会退化成遭遇串）：<\/p>\n<ol class='mdlist'><li><strong>时限<\/strong>：圣克鲁斯→塔古斯，正常七段；<strong>你们手上的淡水和咸鱼只够六段<\/strong>。<\/li><li><strong>一条会过期的信息<\/strong>：多洛雷斯（12.6，船长之家酒馆）说过\"过几天有个西班牙人肯出好价钱买咸鱼\"——<strong>第七段之后他就不在了<\/strong>。<\/li><li><strong>代价预览<\/strong>：如果走快，就得走礁区（吃水检定 DV15，7.10）。<\/li><\/ol>\n<blockquote class='quote aside-voice'><strong>让玩家在这里做一次选择<\/strong>：省水，还是省时间。<strong>这是本冒险真正的第一个谜，而它没有正确答案。<\/strong><\/blockquote>\n<hr>\n<h3>场景 1 · 风暴（30 分钟｜中事件）<\/h3>\n<p><strong>三个班次，逐个结算<\/strong>（7.3 航行轮六步）。<\/p>\n<div class='tbl'><table><thead><tr><th>班次<\/th><th>事件<\/th><th>检定<\/th><th>失败（三选一落地）<\/th><\/tr><\/thead><tbody><tr><td>Ⅰ<\/td><td>气象异变（2.4 预警段）<\/td><td>气象 DV13<\/td><td>无准备进入Ⅱ；<strong>代价<\/strong>：全组首次检定劣势<\/td><\/tr><tr><td>Ⅱ<\/td><td><strong>风暴规程<\/strong>（7.10 三掷）<\/td><td>掌舵 DV18／操帆 DV16／船体 d6<\/td><td><strong>船体 2d6<\/strong>；或帆况降档；或进水 1 级<\/td><\/tr><tr><td>Ⅲ<\/td><td>风眼<\/td><td>无检定——<strong>纯描述<\/strong><\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>若团队检定过半失败<\/strong>：船体 2d6，且一人落水（机敏 DV15 攀住 → 游泳 DV13 → 溺水规则 2.4）。<\/p>\n<blockquote class='quote'><strong>【主持提示】<\/strong> 第二班次开始前，<strong>明确说出失败的后果<\/strong>（3.10\"永远先说后果再掷骰\"）。这句话让风暴从骰子变成抉择。<\/blockquote>\n<p><strong>风眼那一拍，念这句<\/strong>：<em>\"风眼边缘有橙红色的光。不是闪电的频率。\"<\/em><br>—— <strong>不解释。不检定。不追加。<\/strong> 这是【模糊】档的全部工作（11.1）。<\/p>\n<hr>\n<h3>场景 2 · 燃烧的信号（40 分钟｜中事件 ＋ 第一次真抉择）<\/h3>\n<p>半沉的商船残骸，桅杆还在烧。三样东西，<strong>船舱装不下<\/strong>（海燕号 3 舱位，其中 2 舱位已被咸鱼和淡水占用——<strong>让玩家自己算，算出来就是抉择<\/strong>）：<\/p>\n<div class='tbl'><table><thead><tr><th>可带走<\/th><th>占舱位<\/th><th>值多少<\/th><\/tr><\/thead><tbody><tr><td><strong>幸存者帕科<\/strong>（昏厥的少年，抱着浸蜡木筒）<\/td><td>1（人，6.8）<\/td><td>不赚钱。<strong>但他是场景 4 三条钩子里两条的钥匙<\/strong><\/td><\/tr><tr><td><strong>一箱上等靛蓝<\/strong><\/td><td>0.3（1/10 舱位）<\/td><td>港内收购 60 银币（10.1）<\/td><\/tr><tr><td><strong>一箱受潮火药<\/strong><\/td><td>0.3<\/td><td><strong>半价，且是违禁品<\/strong>（10.4）——在塔古斯报关＝查获判定<\/td><\/tr><tr><td><strong>木筒里的信<\/strong><\/td><td>0<\/td><td><strong>不是钱。是剧情。<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>登船检查的可得信息<\/strong>（三条独立通路，任取一条即可推进）：<\/p>\n<ol class='mdlist'><li><strong>博物学／史学 DV13<\/strong>：烧的是<strong>舱内<\/strong>，不是舱外。<strong>火从里面起<\/strong>。<\/li><li><strong>工程 DV14<\/strong>：水线上的破口形状不像礁——<strong>像被人从里面凿的<\/strong>。<\/li><li><strong>律法／史学 DV15（读船骸残牌）<\/strong>：这条船的注册港是<strong>盐叉湾<\/strong>（12.4 走私港）。<\/li><\/ol>\n<blockquote class='quote'><strong>三条都失败也不卡<\/strong>（P0①）：那他们只能带人走，然后到岸再查——<strong>延迟本身就是戏<\/strong>（13.1 铁律②：后果要延迟爆发）。<\/blockquote>\n<p><strong>这一幕没有正确答案，吵出来的东西就是他们的船。<\/strong>（2.4 原话，保留，因为它是对的。）<\/p>\n<hr>\n<h3>场景 3 · 红隼号（60–90 分钟｜大事件）<\/h3>\n<p><strong>红隼号数据卡<\/strong>（对齐 6.9 与 9 章）：<\/p>\n<pre class='codeblock'><code>海盗快船　船体 16　炮 6 门（1 连＋2 余数＝齐射 3d6+1，装填 2 轮）\n货舱 2　吃水 浅　船员 18／最低 12　航速档 快（8 格/海战轮）\n特性：突袭（先登船的接舷检定 +2）\n士气：高（14）——但【夜战＋风暴尾流】使其炮击处于劣势<\/code><\/pre>\n<p><strong>关键情报<\/strong>：夜战与风暴尾流让红隼号的炮击有劣势——<strong>这个信息必须通过一次成功的瞭望检定（读敌 DV12）给出<\/strong>。它值一整场战斗，所以它不该免费。<\/p>\n<h3>三条路（都要能赢，都不能全赢）<\/h3>\n<div class='tbl'><table><thead><tr><th>路<\/th><th>规则<\/th><th>赢面<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td><strong>逃<\/strong><\/td><td><strong>9.7 双钟，【拉开】6 格 vs 【贴上来】6 格<\/strong>，两轮定胜负<\/td><td>海燕号是快船＋浅水＋洛伦佐——<strong>逃是现实的<\/strong><\/td><td>丢掉货，或丢掉帕科（他得留在某处）<\/td><\/tr><tr><td><strong>打<\/strong><\/td><td>9.3–9.5 全套海战，五阶段一轮<\/td><td>有瞭望情报则均势；夜战双方劣势，<strong>但你们的劣势小<\/strong><\/td><td>船体可能归零（7.9 沉没规程）<\/td><\/tr><tr><td><strong>谈<\/strong><\/td><td>10 章：人望＋交涉 vs 对方船长（DV13）<\/td><td><strong>他们要的不是船，是那个木筒<\/strong>（旗语可解读，瞭望 DV12）<\/td><td>交出去，帕科会醒过来求你们别给<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>\"钉子\"（登船队长，若打）<\/strong>：<code>HP 16｜防御 14｜攻击 +4｜刀 1d8+1｜老兵（不因单次重击而畏缩）｜士气 15<\/code><br>他倒下时红隼号水手士气崩溃（掷 d20+1 vs 12，失败即撤退，9.1）。<\/p>\n<blockquote class='quote aside-voice'><strong>【主持提示·这一场的高潮不是战斗】<\/strong> 高潮是<strong>他们发现红隼号在找的是那封信，不是这条船<\/strong>。请在场景 3 中段把这条信息交出去（读敌成功，或谈判中途，或俘虏嘴里）。<strong>海战因这个发现而变成一次选择：你手上的东西比你的命值钱。<\/strong><\/blockquote>\n<hr>\n<h3>场景 4 · 回港与三个结局（20 分钟）<\/h3>\n<p><strong>先结算账本<\/strong>（10.7 团队账本，当场公布每份值多少）→ 再读三条钩子之一。<\/p>\n<h3>三个可选结局<\/h3>\n<p><strong>结局 A「认得火漆印的那位」<\/strong>（→ 12.7 秘密⑦）<br>帕科醒来第一句：\"信不是给银鸥号的……是给<strong>你们船长<\/strong>的。她认得那个火漆印。\"<br>↳ 兑现：<strong>内部信任危机<\/strong>，直接进入战役第二幕；恶名 +5（他们开始谈论你们，10.8 传闻档）<\/p>\n<p><strong>结局 B「缺口对上了」<\/strong><br>洛伦佐把木筒里洇掉的信和他床板下的半张海图拼在一起——<strong>缺口刚好对上<\/strong>。<br>↳ 兑现：<strong>秘密⑥（海图上的墨渍）<\/strong>；一张能卖 200 银币、或者能带你们去一个别人去不了的地方的东西<\/p>\n<p><strong>结局 C「关税吏抬了头」<\/strong><br>\"海燕号？……你们在风暴海域捡到了燃烧的船？跟我来一趟。\"<br>↳ 兑现：<strong>捕获法庭线<\/strong>（10.6）。你们得证明那不是你们烧的。<strong>律法 DV15<\/strong><\/p>\n<p><strong>若场景 2 带了受潮火药进港报关<\/strong>：查获判定（10.4）。被抓且恶名 &lt;20 → <strong>没收＋罚款（货值 1–2 倍）<\/strong>；恶名 40+ → <strong>船暂扣，人下狱<\/strong>。<\/p>\n<hr>\n<h2>14.2 中期冒险《血金航线》<\/h2>\n<p><strong>四元数据<\/strong>：<strong>1 GM ＋ 3–5 名玩家｜8–12 小时（三到四团）｜难度：中高（要管三方关系）｜安全提示：绑架、集体处决的威胁、被迫选边<\/strong><\/p>\n<h3>14.2.0 系统出场表<\/h3>\n<p><strong>全出。<\/strong> 这一场是全书的验收考——贸易（10.1–10.4）、私掠与许可证（10.6）、股份与捕获法庭（10.6）、声望与恶名（10.8）、海战与群战（9.3／9.8）、探索与原住民（8.5）、律法与交涉（5.5／5.4）、超自然【模糊】可选（11）。<\/p>\n<h3>三线骨架<\/h3>\n<blockquote class='quote aside-voice'><strong>一船\"问题货\"，三方要你们选边：商人、海关、海盗。三条线各自完整，选任何一边都还能跑完。<\/strong><\/blockquote>\n<p><strong>核心装置<\/strong>：<strong>一张舱单上有两个名字<\/strong>（12.4 塔古斯传闻种子，此处兑现）。<\/p>\n<div class='tbl'><table><thead><tr><th>方<\/th><th>他们出什么<\/th><th>他们要什么<\/th><th>背叛他们的代价<\/th><\/tr><\/thead><tbody><tr><td><strong>商人<\/strong>（自船商会／行会）<\/td><td><strong>全额预付 ＋ 一张有效许可证<\/strong>（10.6）<\/td><td>货必须到，<strong>且舱单不能被看<\/strong><\/td><td>你再也拿不到许可证（<strong>这是三线里最狠的一条<\/strong>）<\/td><\/tr><tr><td><strong>海关<\/strong>（南方王冠港务）<\/td><td><strong>免报关 ＋ 恶名清零 ＋ 一次\"未曾发生\"<\/strong><\/td><td>货必须被\"当场查获\"，<strong>且必须由你们交出来<\/strong><\/td><td>帝国舰队会在Ⅳ域出现（10.8 恶名 40–59 档）<\/td><\/tr><tr><td><strong>海盗<\/strong>（血鸦海岸）<\/td><td><strong>现金 ＋ 销赃渠道 1/2 实现率<\/strong><\/td><td>货必须是<strong>他们抢的<\/strong>——所以要一次真的劫掠表演<\/td><td>血鸦海岸从此不接你们的货（12.4 盐叉湾关门）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>三方要的东西互相排斥，且每一方都认为自己出的是最大的价。<\/strong> 这就是\"阳谋\"的机械定义。<\/blockquote>\n<h3>三幕结构（各 3–4 小时）<\/h3>\n<p><strong>幕一 · 接单与备航<\/strong><\/p>\n<ul class='mdlist'><li>委托三条红线全用（13.3）：<strong>受雇即动机／委托人必有误差／反转指向委托人<\/strong>。<\/li><li><strong>误差<\/strong>：商人说\"海关这趟查得不严\"。<strong>严格。<\/strong>（报关 DV 由 13 升至 16）<\/li><li><strong>玩家必须做的一件具体的事<\/strong>：藏货（10.4 藏法表，选一种并付代价）。<\/li><li>高潮：<strong>第一次航行遭遇<\/strong>——一条船在追另一条船，两条都不挂旗（13.5·7）。<\/li><\/ul>\n<p><strong>幕二 · 货是什么<\/strong><\/p>\n<ol class='mdlist'><li>真相（<strong>三层线索，任一可推出部分<\/strong>，8.4 三线索原则）：<ol class='sub'><li><strong>开箱<\/strong>：货是<strong>火药与铁<\/strong>（10.1 战时翻倍，10.4 违禁）。<strong>重量不对<\/strong>（吃水下降一档）。<\/li><li><strong>文书<\/strong>（史学／律法 DV15）：舱单第二个名字属于<strong>一位帝国军官<\/strong>——他在<strong>替内陆王朝买武器<\/strong>。<\/li><li><strong>人<\/strong>（帕科式的证人，或 12.6 第 12 位）：<strong>这批货的数量，够打一场不大不小的战争。<\/strong><\/li><\/ol><\/li><li>高潮抉择：<strong>三方此时都会来找你们，且都在同一座港。<\/strong>（13.6 排班：只有一个人此刻在，另外两个在别的班次来。）<\/li><\/ol>\n<p><strong>幕三 · 你们选谁<\/strong><\/p>\n<ul class='mdlist'><li>六个可结算结局（每种都能赢）：交给商人／\"被查获\"给海关／被真抢给海盗／<strong>自己留下<\/strong>（10.4 敌对档后果）／<strong>把三方一起卖<\/strong>（欺骗 DV19，失败即三面皆敌）／<strong>交给 12.3 第八势力<\/strong>（<strong>这是最难的、也是唯一能改写战役走向的一条<\/strong>）<\/li><li>高潮战斗：<strong>群战<\/strong>（9.8）——因为此时你们至少面对一支船队，而不是四条船。<\/li><\/ul>\n<h3>结算（这一场真正的奖励）<\/h3>\n<div class='tbl'><table><thead><tr><th>结算项<\/th><th>值<\/th><\/tr><\/thead><tbody><tr><td>XP<\/td><td>参与 1＋达成 1＋卓越 1（3.9）；<strong>发现\"第八势力在买武器\"额外 +2<\/strong><\/td><\/tr><tr><td>银币<\/td><td>2,000–9,000（三方出价），<strong>但实现率取决于你们选了谁<\/strong>（10.4 销赃表）<\/td><\/tr><tr><td>声望<\/td><td>一方 +15，两方 −10。<strong>没有中立的结算法<\/strong><\/td><\/tr><tr><td><strong>船<\/strong><\/td><td><strong>若走到\"交给第八势力\"这一条<\/strong>：一份陆上产权文书——<strong>它可以兑换成一条船的使用权<\/strong>（10.6 股份）。这是第一幕\"拿到船\"最体面的答案<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>14.3 战役框架《黄金海洋的诅咒》<\/h2>\n<p><strong>三幕的名字就是节奏承诺<\/strong>：<strong>拿船 → 画出你的海 → 燃烧。<\/strong><\/p>\n<h3>第一幕 · 拿到船（3–5 团）<\/h3>\n<p><strong>目标<\/strong>：玩家从\"受雇的船员\"变成\"有一条船、且对这条船有合法主张的人\"。<\/p>\n<ul class='mdlist'><li><strong>三个入门冒险串<\/strong>：《暴风中的信号》（14.1）→《盐叉湾的账》（14.5 敌船卡\"账房\"）→《检疫站》（12.4 港十字；律法与疫病）<\/li><li><strong>每团必给一样\"不可用钱买\"的东西<\/strong>（14.4 原则）：一份股份 1/16、一个血债、一条航线情报、一个人的名字。<\/li><li><strong>幕终<\/strong>：一次捕获法庭（10.6，律法 DV15），或一次凑股（四人各出 1/16 ＋ 一位 NPC 出剩下的）。<\/li><\/ul>\n<p>↳ <strong>拿到船的方式，决定第二幕的政治立场。<\/strong><\/p>\n<h3>第二幕 · 画出你的海（10–20 团，<strong>沙盒 ＋ 主线双轨<\/strong>）<\/h3>\n<p><strong>这是本作真正的一局游戏。<\/strong> 结构：<\/p>\n<ul class='mdlist'><li><strong>沙盒轨<\/strong>：12.5 六海域，玩家自选航线；每海域有<strong>三个可测绘锚点<\/strong>、<strong>两个派系<\/strong>、<strong>一条会过期的信息<\/strong>。<\/li><\/ul>\n<p>↳ <strong>推进方式：海图<\/strong>。玩家手里的海图<strong>是唯一进度条<\/strong>——画到哪里，能玩到哪里。<\/p>\n<ul class='mdlist'><li><strong>主线轨<\/strong>：<strong>七个秘密任选其二埋线<\/strong>（12.7）。<strong>不强制顺序，不要求全找<\/strong>。<\/li><\/ul>\n<p>↳ 每个秘密的<strong>第一层线索<\/strong>会在 10.3 酒馆传闻表里自然出现（GM 只需在掷出对应格时替换内容）。<\/p>\n<ul class='mdlist'><li><strong>驱动<\/strong>：<strong>声望晋升<\/strong>（10.8 八档）。每一档解锁一个新海域、一类委托、一个新敌人。<\/li><li><strong>每四团做一次回港大结算<\/strong>：账本、声望、恶名、传闻走形、船员三轴变化（14.4 变体包 D）。<\/li><\/ul>\n<p><strong>第二幕的失败模式<\/strong>（GM 请背下来）：<strong>玩家开始只在最赚钱的航线上循环。<\/strong><br>↳ <strong>解法<\/strong>：在那条航线上放一个<strong>会涨价的敌人<\/strong>（12.3 任一势力的\"许可\"），<strong>逼他们画新线<\/strong>。<\/p>\n<h3>第三幕 · 燃帆（4–6 团）<\/h3>\n<p><strong>三个收束件，缺一不可<\/strong>：<\/p>\n<ol class='mdlist'><li><strong>秘密收束<\/strong>：第二幕埋的两个秘密<strong>必须相遇<\/strong>（GM 在倒数第五团时把它们放到同一片海域）。<\/li><\/ol>\n<p>↳ 相遇的答案<strong>永远是<\/strong>：<strong>有一张纸，比所有船都重要<\/strong>（12.7 五个秘密是文书，不是地方——这里兑现）。<\/p>\n<ol class='mdlist'><li><strong>一场大会战<\/strong>：群战规则（9.8）放大版——<strong>六到十一条船<\/strong>，阵位令（9.3）在旗舰位上运行，PC 每段一个关键点。<\/li><\/ol>\n<p>↳ <strong>必须给玩家一个\"结构性劣势\"<\/strong>（少于对方船只或弹药不足）。<strong>赢得不轻松的战斗才叫燃帆。<\/strong><\/p>\n<ol class='mdlist'><li><strong>史诗抉择<\/strong>：<strong>两种都能赢、都不能全赢<\/strong>。<ul class='sub'><li><strong>例<\/strong>：那纸文书可以让你们的产权永久合法（<strong>P5 兑现<\/strong>），也可以让一个殖民地的主权被承认（<strong>P8.5 兑现<\/strong>）。<strong>一张纸，一只手。<\/strong><\/li><\/ul><\/li><\/ol>\n<h3>四元数据（战役级）<\/h3>\n<p><strong>人数 3–5（4 最理想）｜总时长 20–35 团｜难度：高（必须管理两条轨）｜安全工具三件套必带<\/strong>（11.8；本战役有背叛、殖民暴力、以及一条会把角色永久致残的变体线）。<\/p>\n<hr>\n<h2>14.4 四个战役变体包（各一页开团指南）<\/h2>\n<h3>包 A · 纯历史私掠<\/h3>\n<p><strong>关掉 11 章<\/strong>（11.1【关闭】档）。支柱全留，恐惧换成<strong>账目<\/strong>。<\/p>\n<ul class='mdlist'><li><strong>必用系统<\/strong>：10.6 许可证全流程、10.7 分账、10.8 恶名、9.8 群战、7.8 疾病（<strong>坏血病是本包的头号敌人<\/strong>）。<\/li><li><strong>一句话核心体验<\/strong>：<strong>我们在替一个我们没见过的人收一笔他付不出的债。<\/strong><\/li><li><strong>开局即问<\/strong>：哪一年？（12.2 决定许可证合法性与分账规则）<\/li><li><strong>删掉的规则<\/strong>：11 全章、8.3 表 A·19/B·20/C·19/D·19（\"不该在这里的东西\"条目）。<\/li><li><strong>变体推荐<\/strong>：13.10 更写实。<\/li><\/ul>\n<h3>包 B · 超自然恐怖<\/h3>\n<p><strong>11 章【模糊】或【显性】；13.10 更恐怖。<\/strong><\/p>\n<ul class='mdlist'><li><strong>核心循环改动<\/strong>：<strong>取消 XP<\/strong>（3.9），改为<strong>\"我们还剩几个人\"<\/strong>。<\/li><li><strong>必用系统<\/strong>：11.2 镇定与心结、11.6 幽灵船程序、7.5 海况 20 格、7.8 疾病、11.8 三原则＋安全工具。<\/li><li><strong>一句话核心体验<\/strong>：<strong>这趟航程的目标不是到达，是别在到达之前变成别的什么。<\/strong><\/li><li><strong>GM 纪律<\/strong>：<strong>永远不解释<\/strong>（11.8②）；每个传说写两个真相，选一个，不说（11.1）。<\/li><li><strong>删掉的规则<\/strong>：10.1 贸易细节（压缩为\"能不能补上\"）；群战；股份。<\/li><\/ul>\n<h3>包 C · 商团贸易战<\/h3>\n<p><strong>把海战降级为风险，把 10 章升级为主干。<\/strong><\/p>\n<ul class='mdlist'><li><strong>必用系统<\/strong>：10.1 基价与垄断带、10.2 行情骰与爬升带、10.3 保险与报关、10.6 <strong>股份与期权合约<\/strong>、12.3 第六势力（行会与承保人卡特尔）、10.8 声望八档。<\/li><li><strong>一句话核心体验<\/strong>：<strong>我们不抢船，我们让别人的船不能开。<\/strong><\/li><li><strong>新玩法（本包独占）<\/strong>：<strong>封锁<\/strong>——10.1 判读句的反面：\"利润率 &gt;40% 必有垄断\"，<strong>所以玩家想做的就是成为那个垄断<\/strong>。用 12.7 秘密⑥（买断海图）与 10.9 期约分支实现。<\/li><li><strong>删掉的规则<\/strong>：9.1 部位变体；11 全章；战斗轮细节（一律用 9.8 群战）。<\/li><li><strong>变体推荐<\/strong>：13.10 更经营 ＋ 四轨船团线（下包 D）。<\/li><\/ul>\n<h3>包 D · 船团与四轨（可选系统层）<\/h3>\n<blockquote class='quote'><strong>这是一整层可插拔的经营系统，不是变体故事。<\/strong> 它把\"一条船\"升级成\"一支船团\"，把\"一回合\"升级成\"一个班次\"。<\/blockquote>\n<ul class='mdlist'><li><strong>时间基座<\/strong>：<strong>班次 = 4 小时，每昼夜 6 班<\/strong>（与 3.6／7.3 同源，<strong>同一套时间，不加第二套<\/strong>）。<\/li><li><strong>四轨（船团线，全桌共享，不是第五条角色成长线）<\/strong>：<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>轨<\/th><th>档位效果（0／2／4／7／10 档）<\/th><\/tr><\/thead><tbody><tr><td><strong>船艺 Craft<\/strong><\/td><td>可解锁的船标签档位 L1→L5（<strong>10 档＝旗舰<\/strong>）<\/td><\/tr><tr><td><strong>人心 Morale<\/strong><\/td><td>每航段补班 ＋0／＋2／＋3／＋4／＋5／<strong>＋6<\/strong><\/td><\/tr><tr><td><strong>纪律 Discipline<\/strong><\/td><td>靠港可解除占用 0／1／2／3／4／5 项（<strong>起始为 1，且即使 0 也能靠港解除 1 项<\/strong>）<\/td><\/tr><tr><td><strong>人脉 Standing<\/strong><\/td><td>合约持有 1→5（<strong>硬顶 5<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>三条咬合约束<\/strong>（写死）：① 一颗班次同航段只做一件事；② 标签启用即占用，需<strong>一场专门戏<\/strong>解除；③ <strong>一场专门戏不得既解除又立即重启<\/strong>。<\/li><li><strong>航线公式<\/strong>：<code>线收益 =（两端点收益之和）× K<\/code>，<strong>K = 1.5<\/strong>；<code>区定价权 = 该圈收益 ×1.25 ＋ 优先接单权<\/code>，<strong>每圈仅一个<\/strong>；<strong>放弃补偿：主动放弃定价权 → ＋1 声望<\/strong>。<\/li><li><strong>战斗→船板三层接线<\/strong>（本包最重要的一张表）：<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>时机<\/th><th>代价／收益<\/th><\/tr><\/thead><tbody><tr><td><strong>战前<\/strong><\/td><td>每项战术准备 <strong>耗 1 班<\/strong>：抢风位／装填链弹／动员水手<\/td><\/tr><tr><td><strong>战中<\/strong><\/td><td>接舷<strong>额外耗 1 班<\/strong><\/td><\/tr><tr><td><strong>战后<\/strong><\/td><td><strong>胜<\/strong>＝加 1 优势标签 或 移除 1 隐患｜<strong>惨胜<\/strong>＝加 1 隐患｜<strong>败<\/strong>＝加 1 隐患 ＋ <strong>本段剩余班次归零<\/strong>｜<strong>隐患满槽则挤掉玩家指定的一枚优势<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>船员三轴（技／缘／创，各 0–2）<\/strong>：只管 <strong>3–4 名具名船员<\/strong>，不含 PC，用索引卡记录。<ul class='sub'><li><strong>技<\/strong> 0 水手／1 老手／2 大副 → 其负责动作耗班 −1（每航段一次）<\/li><li><strong>缘<\/strong> 0 生分／1 信任／2 过命 → 替某 PC 挡一次致命后果，用后归 1<\/li><li><strong>创<\/strong> 0／1／2 → <strong>创 2 离船，永久失去<\/strong><\/li><li>战后结算：<strong>胜 技＋1／惨胜 创＋1／败 创＋1 且 缘−1<\/strong><\/li><\/ul><\/li><li><strong>跨局层（可选，建议 2–3 个航季）<\/strong>：<strong>延续不可购买的，重置可再赚的<\/strong>——<\/li><\/ul>\n<p>延续：船标签（含隐患）／船员（<strong>死者不复活<\/strong>）／栈房与已画的线／港口声望五档。<br>重置：班次／货物／未完成委托。<\/p>\n<ul class='mdlist'><li><strong>验收（跑完必答）<\/strong>：<strong>\"战斗的时候还有人关心班次吗？\"<\/strong> ——若否，本包失败，回到包 A。<\/li><li><strong>放弃信号<\/strong>：<strong>GM 觉得记录比带团累 → 砍到只剩四轨＋班次。<\/strong><\/li><\/ul>\n<blockquote class='quote aside-voice'><strong>【设计注】<\/strong> 本包是全书最重的一层，所以它单独成章，不混进故事包。它的全部复杂性只买一样东西：<strong>让\"这条船要去哪\"变成全桌的政治，而不是 GM 的剧情。代价是主持负担显著上升——只在你的桌跑过至少十团之后再开。<\/strong><\/blockquote>\n<hr>\n<h2>14.5 敌人卡与数值附录<\/h2>\n<h3>三条卡牌纪律<\/h3>\n<ol class='mdlist'><li><strong>杂兵一行<\/strong>（9.1 模板），<strong>不做卡<\/strong>；<\/li><li><strong>头目一张卡，七行以内<\/strong>；<\/li><li><strong>敌船一张卡，照 7.2 格式填，多两行：战术教义／撤退条件<\/strong>。<\/li><\/ol>\n<h3>敌船卡（七条）<\/h3>\n<pre class='codeblock'><code>名：____　船型（7.2）____　旗号：____势力（12.3）\n船体 __　炮 __门＝__连（余 __门＝伤害 +__）　货舱 __　吃水 __\n船员 __／最低 __　士气 __（0–20，起始见 7.7）　航速档 __\n特性：____（7.2 表内，或自拟一条）\n战术教义：它怎么打？（例：先链弹拆帆，再逼接舷）\n撤退条件：它什么时候跑？（例：船体 &lt;60% 或士气 &lt;8）<\/code><\/pre>\n<p><strong>现成五条<\/strong>（可直接用；对应 14.1／14.2）：<\/p>\n<div class='tbl'><table><thead><tr><th>名<\/th><th>船型<\/th><th>船体／炮／士气<\/th><th>战术教义<\/th><th>撤退<\/th><\/tr><\/thead><tbody><tr><td><strong>红隼号<\/strong><\/td><td>海盗快船<\/td><td>16／6门＝3d6+1／14<\/td><td>抢风近身，逼接舷；夜战收帆<\/td><td>船体 &lt;8 或\"钉子\"倒下<\/td><\/tr><tr><td><strong>账房的船<\/strong><\/td><td>双桅横帆船<\/td><td>18／8门＝2连／12<\/td><td><strong>先打帆，不杀人<\/strong>（他要货完整）<\/td><td>你们交出货<\/td><\/tr><tr><td><strong>港十字巡艇<\/strong><\/td><td>护卫舰（弱装）<\/td><td>22／12门／15<\/td><td>封锁航道，逼你们报关<\/td><td>无（它不会跑，它只是在等）<\/td><\/tr><tr><td><strong>内陆王朝的征用船<\/strong><\/td><td>卡拉维尔<\/td><td>16／4门／10<\/td><td>不接战，<strong>绕行、拖时间、等岸上的信使<\/strong><\/td><td>岸上信号发出后<\/td><\/tr><tr><td><strong>\"不会沉的那条\"<\/strong><\/td><td>未知（东印度船规格）<\/td><td>30／12门／<strong>从不掷<\/strong><\/td><td><strong>每轮同一舷、同一角度、同一速度<\/strong><\/td><td><strong>不会<\/strong>（11.6）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>人物卡（四位，头目级）<\/h3>\n<pre class='codeblock'><code>&quot;血鸦&quot;英格丽德　筋骨4 机敏3 学识3 胆魄4 人望5　HP 14　防御 16\n　技能：炮术3 领导4 交易3 威吓3\n　特性：分账表——她的船员士气永不低于 10（7.7）\n　战术：不打沉，打瘫（链弹＋纵队令）\n　秘密：她记得每一个欠饷的人的名字（12.6）<\/code><\/pre>\n<pre class='codeblock'><code>叛舰长 康拉德　筋骨3 机敏4 学识4 胆魄3 人望3　HP 12　防御 16\n　技能：掌舵4 炮术3 欺骗3 律法2\n　特性：旗——每场可换一次旗号（10.5 恶名不对称）\n　战术：抢上风后贯舷（9.3）\n　秘密：那次会战他救下的船上有他兄弟（12.6）<\/code><\/pre>\n<pre class='codeblock'><code>帝国海军上校 德·拉·克鲁斯　筋骨3 机敏2 学识3 胆魄4 人望4　HP 12　防御 17\n　技能：领导4 炮术3 律法3 交涉2\n　特性：建制——群战中战役检定 +2（9.8）\n　战术：纵队令恒定，不追，只封锁（14.2 幕三）\n　弱点：他不相信玩家会做对自己不利的事<\/code><\/pre>\n<pre class='codeblock'><code>深渊触手（11.5 克拉肯的腕）　HP 40　防御 15　攻击 +5\n　命中：船体 2d10+4 或 缠住一条桅（操帆 DV16 砍索）\n　特性：打不到头；每次命中它，全组恐惧 DV16（11.2）\n　撤退窗口：第一轮不缠死即自退（11.5）<\/code><\/pre>\n<hr>\n<p><em>最后一章：把全书压成可以带上桌的那几页纸。<\/em><\/p>","text":"模组不是故事。模组是一台会自己讲故事的机器，而玩家是它唯一的燃料。 本章的写作纪律 （已定，全章遵守）： 模组是系统的展销会。 每个模组刻意让每个核心系统至少出场一次。出场表在 14.1.0 / 14.2.0，GM 跑之前先看那张表——它会告诉你这一团该练什么。 每个模组标注四元数据 ：人数／时长／主持难度／安全提示。这是被反复验证过的职业标准，不是格式装饰。 每个场景必须有失败态 ，且 至少两条通路 （13.1 P0①、8.4 三线索原则）。 14.1 入门冒险《暴风中的信号》（完整版） 四元数据 ： 1 GM ＋ 3–4 名玩家｜4–6 小时｜难度：低（第一次主持就够）｜安全提示：海难、溺水、有人会被放弃 14.1.  它可以兑换成一条船的使用权 （10.6 股份）。这是第一幕\"拿到船\"最体面的答案 14.3 战役框架《黄金海洋的诅咒》 三幕的名字就是节奏承诺 ： 拿船 → 画出你的海 → 燃烧。 第一幕 · 拿到船（3–5 团） 目标 ：玩家从\"受雇的船员\"变成\"有一条船、且对这条船有合法主张的人\"。 三个入门冒险串 ：《暴风中的信号》（14.1）→《盐叉湾的账》（14.5 敌船卡\"账房\"）→《检疫站》（12.4 港十字；律法与疫病） 每团必给一样\"不可用钱买\"的东西 （14.4 原则）：一份股份 1/16、一个血债、一条航线情报、一个人的名字。 幕终 ：一次捕获法庭（10.6，律法 DV15），或一次凑股（四人各出 1/16 ＋ 一位 NPC 出剩下的）。 ↳ 拿到船的方式，决定第二幕的政治立场。 第二幕 · 画出你的海（10–20 团， 沙盒 ＋ 主线双轨 ） 这是本作真正的一局游戏。 结构： 沙盒轨 ：12.5 六海域，玩家自选航线；每海域有 三个可测绘锚点 、 两个派系 、 一条会过期的信息 。 ↳ 推进方式：海图 。玩家手里的海图 是唯一进度条 ——画到哪里，能玩到哪里。 主线轨 ： 七个秘密任选其二埋线 （12.7）。 不强制顺序，不要求全找 。 ↳ 每个秘密的 第一层线索 会在 10.3 酒馆传闻表里自然出现（GM 只需在掷出对应格时替换内容）。 驱动 ： 声望晋升 （10.8 八档）。每一档解锁一个新海域、一类委托、一个新敌人。 每四团做一次回港大结算 ：账本、声望、恶名、传闻走形、船员三轴变化（14.4 变体包 D）。 第二幕的失败模式 （GM 请背下来）： 玩家开始只在最赚钱的航线上循环。 ↳ 解法 ：在那条航线上放一个 会涨价的敌人 （12.3 任一势力的\"许可\"）， 逼他们画新线 。 第三幕 · 燃帆（4–6 团） 三个收束件，缺一不可 ： 秘密收束 ：第二幕埋的两个秘密 必须相遇 （GM 在倒数第五团时把它们放到同一片海域）。 ↳ 相遇的答案 永远是 ： 有一张纸，比所有船都重要 （12.7 五个秘密是文书，不是地方——这里兑现）。 一场大会战 ：群战规则（9.8）放大版—— 六到十一条船 ，阵位令（9.3）在旗舰位上运行，PC 每段一个关键点。 ↳ 必须给玩家一个\"结构性劣势\" （少于对方船只或弹药不足）。 赢得不轻松的战斗才叫燃帆。 史诗抉择 ： 两种都能赢、都不能全赢 。 例 ：那纸文书可以让你们的产权永久合法（ P5 兑现 ），也可以让一个殖民地的主权被承认（ P8.5 兑现 ）。 一张纸，一只手。 四元数据（战役级） 人数 3–5（4 最理想）｜总时长 20–35 团｜难度：高（必须管理两条轨）｜安全工具三件套必带 （11.8；本战役有背叛、殖民暴力、以及一条会把角色永久致残的变体线）。 14.4 四个战役变体包（各一页开团指南） 包 A · 纯历史私掠 关掉 11 章 （11.1【关闭】档）。支柱全留，恐惧换成 账目 。 必用系统 ：10.6 许可证全流程、10.7 分账、10.8 恶名、9.8 群战、7.8 疾病（ 坏血病是本包的头号敌人 ）。 一句话核心体验 ： 我们在替一个我们没见过的人收一笔他付不出的债。 开局即问 ：哪一年？（12.2 决定许可证合法性与分账规则） 删掉的规则 ：11 全章、8.3 表 A·19/B·20/C·19/D·19（\"不该在这里的东西\"条目）。 变体推荐 ：13.10 更写实。 包 B · 超自然恐怖 11 章【模糊】或【显性】；13.10 更恐怖。 核心循环改动 ： 取消 XP （3.9），改为 \"我们还剩几个人\" 。 必用系统 ：11.2 镇定与心结、11.6 幽灵船程序、7.5 海况 20 格、7.8 疾病、11.8 三原则＋安全工具。 一句话核心体验 ： 这趟航程的目标不是到达，是别在到达之前变成别的什么。 GM 纪律 ： 永远不解释 （11.8②）；每个传说写两个真相，选一个，不说（11.1）。 删掉的规则 ：10.1 贸易细节（压缩为\"能不能补上\"）；群战；股份。 包 C · 商团贸易战 把海战降级为风险，把 10 章升级为主干。 必用系统 ：10.1 基价与垄断带、10.2 行情骰与爬升带、10.3 保险与报关、10.6 股份与期权合约 、12.3 第六势力（行会与承保人卡特尔）、10.8 声望八档。 一句话核心体验 ： 我们不抢船，我们让别人的船不能开。 新玩法（本包独占） ： 封锁 ——10.1 判读句的反面：\"利润率 &gt;40% 必有垄断\"， 所以玩家想做的就是成为那个垄断 。用 12.7 秘密⑥（买断海图）与 10.9 期约分支实现。 删掉的规则 ：9.1 部位变体；11 全章；战斗轮细节（一律用 称） 战术：抢上风后贯舷（9.3） 秘密：那次会战他救下的船上有他兄弟（12.6） 帝国海军上校 德·拉·克鲁斯 筋骨3 机敏2 学识3 胆魄4 人望4 HP 12 防御 17 技能：领导4 炮术3 律法3 交涉2 特性：建制——群战中战役检定 +2（9.8） 战术：纵队令恒定，不追，只封锁（14.2 幕三） 弱点：他不相信玩家会做对自己不利的事 深渊触手（11.5 克拉肯的腕） HP 40 防御 15 攻击 +5 命中：船体 2d10+4 或 缠住一条桅（操帆 DV16 砍索） 特性：打不到头；每次命中它，全组恐惧 DV16（11.2） 撤退窗口：第一轮不缠死即自退（11.5） 最后一章：把全书压成可以带上桌的那几页纸。"},{"num":"15","title":"附录","vol":"卷四 · 附录与工具区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>附录是规则书里唯一允许被翻烂的部分。如果附录没烂，说明书没上桌。<\/em><\/blockquote>\n<hr>\n<h2>附录 A · 角色卡（可打印）<\/h2>\n<pre class='codeblock'><code>════════════════════════════════════════════════════════\n 燃帆 · The Age of Burning Sail          角色卡  v0.1\n════════════════════════════════════════════════════════\n姓名：______________________  玩家：______________\n出身（4.2）：______________   原型（4.4）：______________\n等级 ___   XP ____/3   概念一句话：____________________\n\n── 属性（值即加值，1–5；1级上限4）────────────────────\n  筋骨 MGT ___   机敏 FIN ___   学识 WIT ___\n  胆魄 GRT ___   人望 PRE ___\n\n── 生命 ──────────────────────────────────────────────\n  HP ＝ 6 ＋ 筋骨×2 ＝ ____/____     护甲 ____   防御 13＋护甲\n  潮汐点 ___/___（上限 3；幸运之星 4）   □ □ □\n\n── 技能（0–5；3＝职业合格线）─────────────────────────\n  航海：导航__ 操帆__ 掌舵__ 海图绘制__ 气象__ 游泳__\n  战斗：剑术__ 火器__ 炮术__ 投掷__ 格斗__\n  社交：交涉__ 交易__ 欺骗__ 威吓__ 领导__ 表演__\n  学识：医术__ 博物学__ 史学__ 律法__ 工程__ 语言学__\n  生存：生存__ 追踪__ 驯畜__ 烹调__ 渔猎__\n  手艺：木工__ 铁匠__ 缝纫__ 制药__ 绘图__\n  超自然（11章开放时）：神秘学__\n  专长分支（5.1，技能4级起）：________________________\n\n── 天赋（4.6）：______________________________________\n── 语言：____________________________________________\n\n── 武装与装备 ────────────────────────────────────────\n  武器① ______ 伤害 ____ 射程 ____ 装填 ____\n  武器② ______ 伤害 ____ 射程 ____ 装填 ____\n  护甲 ____________ 甲值 ____   负重上限 筋骨×10＝____ 斤\n  装备：______________________________________________\n  银币 ________   金币 ________   船份 ____/16（10.6）\n\n── 伤疤与心结 ────────────────────────────────────────\n  伤疤（3.7／9.1变体）：______________________________\n  心结（11.2，d20 结果）：____________________________\n  镇定 ____/（胆魄×3）    压力（11.2 潮汐恐慌）____\n\ 修理 ______ 抚恤 ______ 欠饷 ______\n 抽成 ______ 可分池 ______ ÷ 总份数 ______ = 每份 ______\n════════════════════════════════════════════════════════<\/code><\/pre>\n<hr>\n<h2>附录 C · 快速规则速查（单页）<\/h2>\n<h3>判定<\/h3>\n<blockquote class='quote aside-voice'><strong><code>d20 + 属性 + 技能 ≥ DV<\/code><\/strong><\/blockquote>\n<div class='tbl'><table><thead><tr><th>DV<\/th><th>10 简单<\/th><th>13 普通<\/th><th>16 困难<\/th><th>19 极难<\/th><th>22 传奇<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>结果<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td>≥ DV+10<\/td><td><strong>卓越<\/strong>（额外获益）<\/td><\/tr><tr><td>≥ DV+5<\/td><td><strong>良好<\/strong>（小幅增益）<\/td><\/tr><tr><td>≥ DV<\/td><td><strong>成功<\/strong><\/td><\/tr><tr><td>&lt; DV<\/td><td><strong>失败<\/strong>——必须出现新麻烦<\/td><\/tr><tr><td>&lt; DV−5<\/td><td><strong>惨败<\/strong>——失败＋额外受损<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>优势／劣势<\/strong>：2d20 取高／取低。<strong>不叠加<\/strong>；一优一劣互相抵消。<\/li><li><strong>对抗<\/strong>：双方各掷，高者胜；平局对防守方／现状有利。<\/li><li><strong>协助<\/strong>：同伴掷相关检定 DV10 → 主行动者获优势；同一检定最多一人协助。<\/li><li><strong>团队检定<\/strong>：全员各掷，<strong>半数以上成功则全队成功<\/strong>。<\/li><li><strong>未受训<\/strong>：基础动作可掷 d20+属性；<strong>专业动作必须受训<\/strong>。<\/li><li><strong>失败铁律<\/strong>：失败永远要改变局面。三选一落地：<strong>代价／复杂化／信息<\/strong>。<\/li><\/ul>\n<h3>潮汐点（每人 3 点，上限 3；天赋 4）<\/h3>\n<div class='tbl'><table><thead><tr><th>用途<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>重掷<\/strong><\/td><td>重掷自己任一掷骰；或敌人对你的一次攻击骰<\/td><\/tr><tr><td><strong>灌风<\/strong><\/td><td>任一掷骰结果显示后 <strong>+5<\/strong><\/td><\/tr><tr><td><strong>浪里翻身<\/strong><\/td><td>把一次失败改写为<strong>成功但引入新麻烦<\/strong><\/td><\/tr><tr><td><strong>抓牢船舷<\/strong><\/td><td>足以倒地的伤害减半；或从濒死立刻恢复 1 HP 并稳固<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>恢复<\/strong>：回友好港全恢复；海上长休（连续两段休息）恢复 1。<\/p>\n<h3>时间<\/h3>\n<div class='tbl'><table><thead><tr><th>战斗轮<\/th><th>海战轮<\/th><th>航段（班次）<\/th><th>旅程<\/th><th>停泊<\/th><\/tr><\/thead><tbody><tr><td>6 秒<\/td><td>1 分钟<\/td><td><strong>4 小时，一昼夜 6 段<\/strong><\/td><td>天／周<\/td><td>天<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>濒死<\/h3>\n<p>HP 归零 → <strong>倒地，不是死亡<\/strong>。每轮 d20：<strong>≥10 稳定<\/strong>；&lt;10 失败一次；<strong>天然1 记两次<\/strong>。<br><strong>3 成 → 稳固（HP 仍 0）<\/strong>；<strong>3 败 → 死亡<\/strong>。施救：医术 DV13＝计一次成功。<\/p>\n<h3>恢复<\/h3>\n<div class='tbl'><table><thead><tr><th>短休（1 段安静）<\/th><th>长休（一昼夜）<\/th><th>船医（每昼夜每人一次）<\/th><\/tr><\/thead><tbody><tr><td>回复＝筋骨 HP，每天一次<\/td><td>全部 HP<\/td><td>＋2 HP，或移除 1 级疲劳<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三支柱速记<\/h3>\n<p><strong>船是角色<\/strong>（Hull 与 HP 永不互折）｜<strong>海是对手<\/strong>（7.4／7.5）｜<strong>血很贵<\/strong>（3.7、9.1 变体）｜<strong>名声有账本<\/strong>（10.8 五档）｜<strong>合法性是资产<\/strong>（10.6）<\/p>\n<hr>\n<h2>附录 D · 海战速查（单页）<\/h2>\n<h3>一轮海战（1 分钟）<\/h3>\n<blockquote class='quote aside-voice'><strong>① 号令 → ② 阵位 → ③ 机动 → ④ 炮击 → ⑤ 冲撞接舷 → ⑥ 结算<\/strong><\/blockquote>\n<h3>阵位令（暗写同翻，令值高者先动；相同则上风者先）<\/h3>\n<div class='tbl'><table><thead><tr><th>并舷令 3<\/th><th>纵队令 2<\/th><th>自由令 1<\/th><\/tr><\/thead><tbody><tr><td>齐射检定 +1，转向减半<\/td><td>同向 ≤2 格成纵队，每船 +1 伤害骰<\/td><td>无修正，机动全开<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>取高不叠<\/strong>；<strong>旗舰沉或被俘 → 全队上限降为自由令<\/strong>。<\/p>\n<h3>速度<\/h3>\n<blockquote class='quote'><strong>战术速度 ＝ 航速档 × 风 × 帆 × 海况 → 向下取整<\/strong>（格／轮；1 格＝60 尺）<\/blockquote>\n<div class='tbl'><table><thead><tr><th>风（7.4）<\/th><th>1.5（顺风满帆）／1.25／1.1／1.0／0.75／0.5<\/th><\/tr><\/thead><tbody><tr><td><strong>帆<\/strong><\/td><td>满帆1.0（索具易损）／战斗帆0.75／收帆0.25（免晃）／应急帆 1 格<\/td><\/tr><tr><td><strong>海况（7.5）<\/strong><\/td><td>无风0.25／微风0.75／和风1.0／劲风1.15／大风1.1／风暴0.75<\/td><\/tr><tr><td><strong>转向<\/strong><\/td><td>每轮 90°；速度≥档位一半可转 135°<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>六战位（每轮限选 1 项）<\/h3>\n<div class='tbl'><table><thead><tr><th>掌舵<\/th><th>帆组<\/th><th>炮组<\/th><th>瞭望<\/th><th>跳帮<\/th><th>船医<\/th><\/tr><\/thead><tbody><tr><td>保持／急转／抢风 DV14／贴礁 DV16<\/td><td>换帆／修帆 DV13／砍索 DV12<\/td><td>装填／齐射／瞄准声明／校射<\/td><td>测风 DV12／读敌 DV12／报距<\/td><td>抛钩 DV14／砍缆 DV12／待命<\/td><td>救治 DV13／稳定／坐镇＋1士气<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>船长号令（每轮一条）<\/h3>\n<p><strong>齐射！<\/strong>（各连同火，差 1 者 −1 骰）｜<strong>稳住！<\/strong>（全船 +2，不能机动）｜<strong>抢修！<\/strong>（损管 −4 DV）｜<strong>接舷队！<\/strong>（攻 +1、临时 HP +3）｜<strong>砍缆！<\/strong>（脱离，互获借机）｜<strong>抢上风！<\/strong>（风档 +1，不与抢风叠）<\/p>\n<h3>齐射<\/h3>\n<blockquote class='quote'>每 <strong>4 门<\/strong> 一\"连\"；余 ≤2 门伤害 <strong>+1<\/strong>。装填标准 <strong>2 轮<\/strong>（回旋1／长管3／臼炮4）。<br><strong><code>d20 + 学识或机敏 + 炮术<\/code><\/strong> vs <strong>船体 14／帆索 12／甲板 16<\/strong> → <strong>3d6 船体伤害<\/strong><br>修正：目标收帆或战斗帆 +2｜上风 +1｜≤4 格 +2｜&gt;8 格 −2（&gt;15 不可射）｜我方机动 −2｜雾/夜/大浪 劣势<br><strong>同轮第二连 −5；第三连起 −10（不可移除）<\/strong><\/blockquote>\n<h3>命中部位表（d10）<\/h3>\n<div class='tbl'><table><thead><tr><th>1 艉楼/舵<\/th><th>2 主桅<\/th><th>3 前桅<\/th><th>4 炮甲板<\/th><th>5 水线<\/th><\/tr><\/thead><tbody><tr><td>失舵 1 轮，修 2 班<\/td><td>帆况降档＋1d10<\/td><td>帆况降档<\/td><td>+1d6，本连装填+1轮<\/td><td><strong>进水 1 级<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>6 舷侧<\/th><th>7 艏楼<\/th><th>8–9 人员区<\/th><th>10 火药舱<\/th><\/tr><\/thead><tbody><tr><td>标准<\/td><td>抛钩/冲撞 +2 DV<\/td><td>船体−1d3，炮组减员<\/td><td><strong>重击或瞄准限定<\/strong>；d20≥15 船体减半，否则火势 2 级<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>弹种<\/h3>\n<div class='tbl'><table><thead><tr><th>实心<\/th><th>链弹<\/th><th>葡萄弹<\/th><th>火弹<\/th><th>长管<\/th><\/tr><\/thead><tbody><tr><td>标准，可致进水<\/td><td>帆索 ×2，射程半<\/td><td>2 格锥、敌我不分（机敏 DV15，失败 3d6）<\/td><td>伤害 −1 骰，<strong>必引火<\/strong><\/td><td>装填 3 轮，可远距，无水线伤<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>起火／进水<\/h3>\n<p><strong>火<\/strong>：1级−1｜2级−1d3＋人员1d6｜3级−2d6＋士气−1；<strong>逼近火药舱检定失败＝船体减半<\/strong><br><strong>水<\/strong>：每级 1 人抽水；1级−1／2级速度−2、−1d3／<strong>3级＝10 轮沉没倒计时<\/strong>；止漏木工 DV14（水下翻倍）<\/p>\n<h3>接舷<\/h3>\n<p>掌舵对抗 → <strong>抛钩 DV14<\/strong> → 防舷网 +2 → 干舷差攀爬 DV12 →（荡索 DV14 免借机）<br><strong>甲板三分段（艏楼／主甲板／艉楼），每段 ≤2 队<\/strong>；夺船＝控艉楼 ＋ 船长倒下或被逐<br><strong>撞击<\/strong>：速度 ≥4；双方 2d6＋速度差，被撞方另 +2d6；机敏 DV12 否则倒地；<strong>自动钩连<\/strong><\/p>\n<h3>追击双钟<\/h3>\n<p>【贴上来】6 格 vs 【拉开】6 格｜<strong>每轮各至多 +1<\/strong>｜<strong>先满者胜；同轮双满＝双结局（不重掷）<\/strong><br>五类动作：操帆／炮击减速／地形／弃子／干扰｜<strong>对抗成功不推钟，改下次检定 +1 档<\/strong>｜追击轮内零借机<\/p>\n<hr>\n<h2>附录 E · 全表索引<\/h2>\n<p><strong>格式<\/strong>：表名（章.节）｜骰子｜一句话用途。<\/p>\n<h3>判定与角色<\/h3>\n<div class='tbl'><table><thead><tr><th>表<\/th><th>章<\/th><th>骰<\/th><\/tr><\/thead><tbody><tr><td>难度等级表<\/td><td>3.2<\/td><td>—<\/td><\/tr><tr><td>成功等级表<\/td><td>3.2<\/td><td>—<\/td><\/tr><tr><td>潮汐点四用途<\/td><td>3.3<\/td><td>—<\/td><\/tr><tr><td>五属性表<\/td><td>3.4<\/td><td>—<\/td><\/tr><tr><td>技能定稿总表（33＋1）<\/td><td>5.2–5.8<\/td><td>d20<\/td><\/tr><tr><td>专长分支总表<\/td><td>5.9<\/td><td>—<\/td><\/tr><tr><td>出身表<\/td><td>4.2<\/td><td>—<\/td><\/tr><tr><td>职业原型表<\/td><td>4.4<\/td><td>—<\/td><\/tr><tr><td>天赋表<\/td><td>4.6<\/td><td>—<\/td><\/tr><tr><td>升级收益五选<\/td><td>3.9<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>航行<\/h3>\n<div class='tbl'><table><thead><tr><th>表<\/th><th>章<\/th><th>骰<\/th><\/tr><\/thead><tbody><tr><td>船卡八项<\/td><td>7.1<\/td><td>—<\/td><\/tr><tr><td>船型表（7 型）<\/td><td>7.2<\/td><td>—<\/td><\/tr><tr><td>航行轮六步<\/td><td>7.3<\/td><td>d20<\/td><\/tr><tr><td>风向五档／帆况四档<\/td><td>7.4<\/td><td>d6<\/td><\/tr><tr><td>海况表<\/td><td>7.5<\/td><td><strong>d20<\/strong><\/td><\/tr><tr><td>导航难度表<\/td><td>7.6<\/td><td>d20<\/td><\/tr><tr><td>士气修正表＋阈值<\/td><td>7.7<\/td><td>d20<\/td><\/tr><tr><td>疾病三则<\/td><td>7.8<\/td><td>d20／d6<\/td><\/tr><tr><td>沉没规程<\/td><td>7.9<\/td><td>团队<\/td><\/tr><tr><td>风暴规程三掷<\/td><td>7.10<\/td><td><strong>d20+d6<\/strong><\/td><\/tr><tr><td>特殊海况（雾/礁/冰/无风/龙卷）<\/td><td>7.10<\/td><td>d6／d20<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>战斗与海战<\/h3>\n<div class='tbl'><table><thead><tr><th>表<\/th><th>章<\/th><th>骰<\/th><\/tr><\/thead><tbody><tr><td>动作清单<\/td><td>9.1<\/td><td>—<\/td><\/tr><tr><td>命中五档表<\/td><td>9.1<\/td><td>d20<\/td><\/tr><tr><td>位置与掩体表<\/td><td>9.1<\/td><td>—<\/td><\/tr><tr><td>杂兵士气表<\/td><td>9.1<\/td><td>d20<\/td><\/tr><t  手里有，玩家没有）│\n │                                                        │\n │  图例：( )=已知锚点  ○=传闻锚点  ▣=测绘完成  ✕=不可入   │\n │  状态：待查／已读／已测／已归属                          │\n │  风向：＿＿  本季海况：＿＿  退潮窗口：＿＿               │\n └──────────────────────────────────────────────────────┘<\/code><\/pre>\n<p><strong>用法<\/strong>（8.1）：<\/p>\n<ul class='mdlist'><li>进入一个锚点目视范围 → 该点及<strong>相邻 1–2 点<\/strong>轮廓显现；<\/li><li><strong>传闻<\/strong>档由玩家自己画圈并抄原话（原话可能被改写，10.8 传闻档）；<\/li><li><strong>测绘<\/strong>需一次成功的海图绘制检定（5.2）——<strong>只有测绘过的浅点，后续\"贴礁走位\"才 −2 DV<\/strong>。<\/li><\/ul>\n<h3>三层记录（同一锚点三份信息）<\/h3>\n<pre class='codeblock'><code>锚点名：__________  测绘日期：______\n海面层：水深____ 底质____ 锚地□ 进出航道____（瞭望 DV__）\n岸上层：可登陆点____ 淡水□ 柴□ 路径□ 有人住的证据____\n水下层：□（需要：游泳 DV__／退潮窗口__／一条备料__）\n派系：____（≥2；他们之间的关系：__________）<\/code><\/pre>\n<h3>航迹与迷航记录页<\/h3>\n<pre class='codeblock'><code>航段 # │ 出发→到达 │ 海况 │ 风 │ 导航检定 │ 偏航 │ 遭遇\n───────┼───────────┼──────┼────┼──────────┼──────┼──────\n       │           │      │    │          │      │\n───────┴───────────┴──────┴────┴──────────┴──────┴──────\n迷航状态：□否 □是（起始航段#____；每段偏航 1d6×2，遭遇骰 +4）<\/code><\/pre>\n<hr>\n<h2>附录 H · 骰子概率速查（GM 定难度用）<\/h2>\n<p><strong>读法<\/strong>：行＝<code>属性＋技能<\/code> 的合计加值；列＝DV；格＝<strong>成功率<\/strong>（不含优势/劣势）。<br><strong>典型加值参考<\/strong>：外行 +2｜熟手 +4～+5｜职业合格线 +6（属性3＋技能3）｜大师 +8～+10。<\/p>\n<div class='tbl'><table><thead><tr><th>加值<\/th><th>DV10<\/th><th>DV13<\/th><th>DV16<\/th><th>DV19<\/th><th>DV22<\/th><\/tr><\/thead><tbody><tr><td><strong>+0<\/strong><\/td><td>55%<\/td><td>40%<\/td><td>25%<\/td><td>10%<\/td><td>0%<\/td><\/tr><tr><td><strong>+1<\/strong><\/td><td>60%<\/td><td>45%<\/td><td>30%<\/td><td>15%<\/td><td>0%<\/td><\/tr><tr><td><strong>+2<\/strong><\/td><td>65%<\/td><td>50%<\/td><td>35%<\/td><td>20%<\/td><td>5%<\/td><\/tr><tr><td><strong>+3<\/strong><\/td><td>70%<\/td><td>55%<\/td><td>40%<\/td><td>25%<\/td><td>10%<\/td><\/tr><tr><td><strong>+4<\/strong><\/td><td>75%<\/td><td>60%<\/td><td>45%<\/td><td>30%<\/td><td>15%<\/td><\/tr><tr><td><strong>+5<\/strong><\/td><td>80%<\/td><td>65%<\/td><td>50%<\/td><td>35%<\/td><td>20%<\/td><\/tr><tr><td><strong>+6<\/strong><\/td><td>85%<\/td><td>70%<\/td><td>55%<\/td><td>40%<\/td><td>25%<\/td><\/tr><tr><td><strong>+7<\/strong><\/td><td>90%<\/td><td>75%<\/td><td>60%<\/td><td>45%<\/td><td>30%<\/td><\/tr><tr><td><strong>+8<\/strong><\/td><td>95%<\/td><td>80%<\/td><td>65%<\/td><td>50%<\/td><td>35%<\/td><\/tr><tr><td><strong>+9<\/strong><\/td><td>100%<\/td><td>85%<\/td><td>70%<\/td><td>55%<\/td><td>40%<\/td><\/tr><tr><td><strong>+10<\/strong><\/td><td>100%<\/td><td>90%<\/td><td>75%<\/td><td>60%<\/td><td>45%<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>优势／劣势的等效值<\/h3>\n<blockquote class='quote'><strong>优势：成功率 → 1−(1−p)²。劣势：→ p²。<\/strong><br>经验值：<strong>在 50% 附近，优势≈ +5、劣势≈ −5；在两端的收益骤减。<\/strong><\/blockquote>\n<div class='tbl'><table><thead><tr><th>基础<\/th><th>无<\/th><th>优势<\/th><th>劣势<\/th><\/tr><\/thead><tbody><tr><td>25%<\/td><td>25%<\/td><td><strong>44%<\/strong>（+19）<\/td><td>6%（−19）<\/td><\/tr><tr><td>50%<\/td><td>50%<\/td><td><strong>75%<\/strong>（+25）<\/td><td>25%（−25）<\/td><\/tr><tr><td>55%<\/td><td>55%<\/td><td><strong>80%<\/strong><\/td><td>30%<\/td><\/tr><tr><td>65%<\/td><td>65%<\/td><td><strong>88%<\/strong><\/td><td>42%<\/td><\/tr><tr><td>80%<\/td><td>80%<\/td><td><strong>96%<\/strong><\/td><td>64%<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>四条难度设定法则<\/h3>\n<ol class='mdlist'><li><strong>想让故事往前走 → 给 55–70%。<\/strong> 低于此，一次失败就会把一桌人困住两小时。<\/li><li><strong>想让玩家紧张但仍有掌控 → 给 45–60%，同时把失败的后果说清楚<\/strong>（3.10）。<\/li><li><strong>DV22 只在\"传奇\"场合用，且每团最多两次。<\/strong> 超过两次，玩家会停止尝试。<\/li><li><strong>优势比 +2 数值强得多（见上表）。<\/strong> 想奖励聪明做法，<strong>给优势，别加数值<\/strong>——这是本书最重要的一条 GM 数值习惯。<\/li><\/ol>\n<hr>\n<h2>附录索引<\/h2>\n<div class='tbl'><table><thead><tr><th>附录<\/th><th>内容<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td><strong>A<\/strong><\/td><td>角色卡（可打印）<\/td><td>✅<\/td><\/tr><tr><td><strong>B<\/strong><\/td><td>船只记录卡＋团队账本<\/td><td>✅<\/td><\/tr><tr><td><strong>C<\/strong><\/td><t
