/h2>\n<p>场景条件对行动有利时掷2个d20取高。多个优势不叠加；一优一劣相互抵消。反之即\"劣势\"。详见第3章。<\/p>\n<h2>劣势<\/h2>\n<p>场景条件对行动不利时掷2个d20取低。多个劣势不叠加；一优一劣相互抵消。详见第3章。<\/p>\n<h2>对抗检定<\/h2>\n<p>双方各掷 d20＋属性＋技能，高者胜，平局对防守方有利。用于潜行对侦察、欺骗对洞察、追逃对追捕。详见第3章。<\/p>\n<h2>团队检定<\/h2>\n<p>全员各掷同一检定，<strong>过半成功则全队成功<\/strong>。用于划桨接力、全船抢修、丛林行军等集体行动。详见第3章。<\/p>\n<h2>成功等级<\/h2>\n<p>检定超出DV的程度决定质量：卓越（＋10）／良好（＋5）／成功／失败／惨败（－5）。等级越高额外获益越多，惨败额外受损。详见第3章。<\/p>\n<h2>筋骨<\/h2>\n<p>五属性之一，管辖力量、耐力与健壮：攀索、撞门、扛伤、划桨、憋气。HP由此派生。详见第3章。<\/p>\n<h2>机敏<\/h2>\n<p>五属性之一，管辖灵巧、速度与手稳：操帆、攀爬、瞄准、开锁、躲闪；战斗先攻也看它。详见第3章。<\/p>\n<h2>学识<\/h2>\n<p>五属性之一，管辖智力、记忆与推理：导航、炮术计算、识图、医术、语言学。详见第3章。<\/p>\n<h2>胆魄<\/h2>\n<p>五属性之一，管辖意志、勇气与冷静：抵抗恐惧、忍受痛苦、坚持掌舵。超自然档下的恐惧检定也看它。详见第3章。<\/p>\n<h2>人望<\/h2>\n<p>五属性之一，管辖魅力、威仪与共情：领导、交涉、欺骗、表演、招募。详见第3章。<\/p>\n<h2>HP<\/h2>\n<p>生命值 ＝ <strong>6 ＋ 筋骨×2<\/strong>。归零不是死亡，而是倒地濒死。详见第3章。<\/p>\n<h2>濒死<\/h2>\n<p>HP归零后的状态。每轮掷死亡骰（d20≥10算稳定），累计3次失败死亡、3次成功稳固；急救（医术 DV13）可代为掷骰。详见第3章。<\/p>\n<h2>死亡骰<\/h2>\n<p>濒死时每轮掷的d20：≥10稳定，&lt;10记1次失败，自然1记2次。3次失败即死亡。详见第3章。<\/p>\n<h2>伤疤<\/h2>\n<p>大伤复原后GM可要求记录的永久小代价（如\"左耳失聪\"）。是故事资产而非数值惩罚堆叠。详见第3章。<\/p>\n<h2>战斗轮<\/h2>\n<p>个人战斗的时间单位，约6秒。每轮1个动作＋自由移动，先攻按机敏检定排序。详见第9章。<\/p>\n<h2>海战轮<\/h2>\n<p>舰船战斗的时间单位，约1分钟。每轮每名PC占一个战位；炮组装填需2轮。详见第9章。<\/p>\n<h2>航段<\/h2>\n<p>航行时间单位：4小时，一昼夜6段。航行、守夜、船上活动都按段结算；值勤超过4段进入疲劳。详见第7章。<\/p>\n<h2>船体值<\/h2>\n<p>船只的结构完整度（Hull）。归零＝失控或沉没危机——从这一刻起，死的不是船，是人。详见第7章。<\/p>\n<h2>齐射<\/h2>\n<p>舰炮集体射击：d20＋炮术 对 DV14，命中造成3d6船体伤害；每2轮可射击一次（装填）。详见第9章。<\/p>\n<h2>接舷<\/h2>\n<p>用钩索把敌船钩连过来打甲板战：接舷检定 vs 14，成功后双方转入个人战斗规则。详见第9章。<\/p>\n<h2>跳帮<\/h2>\n<p>接舷后由跳帮队冲上敌舰甲板的作战行动；留守队看家，防止对方反跳。详见第9章。<\/p>\n<h2>战位<\/h2>\n<p>海战中每名PC占用的岗位：掌舵／炮组／帆组／瞭望／跳帮队／船医位。分工即战术。详见第9章。<\/p>\n<h2>船员士气<\/h2>\n<p>全船水手的整体士气值（0–20）。口粮、伤亡、拖欠、胜利都会影响它；降到5以下，每个航段都可能掷出哗变。详见第7章。<\/p>\n<h2>哗变<\/h2>\n<p>士气崩盘后水手抗命或夺船的风险检定。冷酷船长的个人威慑＋3——但威慑不是人心。详见第7章。<\/p>\n<h2>坏血病<\/h2>\n<p>长期吃不上新鲜果蔬的航行病，按累积骰触发；医术与柠檬（或酸菜）可防可治。详见第7章。<\/p>\n<h2>疲劳<\/h2>\n<p>值勤过度或连续熬夜的状态，1–3级：1级＝所有检定劣势，3级强制昏睡。详见第7章。<\/p>\n<h2>声望<\/h2>\n<p>角色在各势力中的名声数值（0–100）：无名／熟人／可信／名人／传奇。决定军港准入与待遇。与恶名分开记。详见第10章。<\/p>\n<h2>恶名<\/h2>\n<p>劫掠积累的负面名气：招海军巡逻，也招水手投效——海盗的免费广告。详见第10章。<\/p>\n<h2>私掠许可证<\/h2>\n<p>国家颁发的合法劫掠执照。持证期间在颁发国港口不因掠夺增加恶名；打错对象，执照立刻变成绞索。详见第10章。<\/p>\n<h2>船份<\/h2>\n<p>战利品分配制：船长6份、大副3份、技师2份、水手1份。PC按船职取份——船上的政治由此而来。详见第10章。<\/p>\n<h2>里程碑<\/h2>\n<p>本书的成长制（XP）：按故事而非击杀计分——参与保底1XP，达成目标、卓越扮演、画出新海图各+1。升1级需3XP（9级后4XP）。详见第3章。<\/p>\n<h2>出身<\/h2>\n<p>角色从哪里来：给＋1属性、2项受训技能、1门语言、出身装备与出身特性。详见第4章。<\/p>\n<h2>原型<\/h2>\n<p>你在船上领哪份工钱：船长／领航员／炮长／船医／剑客／火枪手／商人／学者／掠私者／怪力水手，各给本职技能与职业特性。详见第4章。<\/p>\n<h2>天赋<\/h2>\n<p>不可被剥夺的身份性能力，如老海狼、海图记忆、幸运之星、冷酷船长。创建时选1项。详见第4章。<\/p>\n<h2>海图揭示<\/h2>\n<p>未探索海域在战役地图上被逐步绘制进<strong>玩家的海图<\/strong>的过程。海图是道具，不是UI——它会被洇湿、烧掉、卖掉。详见第8章。<\/p>\n<h2>海燕号<\/h2>\n<p>快速开始里的单桅快船：船体14、4门4磅炮、11名船员；特性\"浅水之子\"——礁区与河口的航行检定劣势移除。详见第2章。<\/p>\n<h2>红隼号<\/h2>\n<p>风暴海域最凶的猎私船：双桅、吃水浅、6门炮。旗语只有一句话——停船受检，否则击沉。详见第2章。<\/p>\n<h2>迷航<\/h2>\n<p>连续两个航段导航失败后的状态：每段继续偏航、遭遇骰+4，直到下一次导航成功（DV-2）。迷航者遇到的总是更多。详见第7章。<\/p>\n<h2>抢风航法<\/h2>\n<p>逆风时的\"之\"字走位：航程减半、每段掌舵检定、连续3段疲劳+1。卡拉维尔帆船的看家本领。详见第7章。<\/p>\n<h2>进水<\/h2>\n<p>水线被击穿后的状态：每段船体-1，需每点派1人抽水，木工DV14止漏。进水不是血条，是倒计时。详见第7章。<\/p>\n<h2>沉没规程<\/h2>\n<p>船体归零后的十段倒计时：抢救（团队木工DV16，成功船体回到1）或弃船（小艇只装得下三分之一编制）。详见第7章。<\/p>\n<h2>关键线索永不投骰<\/h2>\n<p>P0原则第一条：<strong>如果一条线索是剧情的唯一通路，它就不需要检定。<\/strong> 检定决定你能额外知道多少，不决定你有没有资格知道。详见第5.0节。<\/p>\n<h2>Let it Ride<\/h2>\n<p>同一件事、同一个目标、同一段航程内<strong>只掷一次<\/strong>。想重掷须改变条件、付出代价、或接受降档加风险。详见第5.0节。<\/p>\n<h2>受训线<\/h2>\n<p>每项技能第一行写明的\"必须受训才能做的专业动作\"。未受训可做基础动作，但不能指挥齐射、不能测天定位、不能做手术。详见第5章。<\/p>\n<h2>专长分支<\/h2>\n<p>技能达到4级后可选的成长件，效果<strong>只有两种<\/strong>：特定情境+2，或移除一种既定劣势。不做新动作、不改骰法、不加伤害骰。详见第5.1节。<\/p>\n<h2>交易<\/h2>\n<p>社交域技能，本作定稿时补入（3.5预览表曾漏列，但出身、原型、招募与第十章全在用它）。谈价、看货、期约、大宗折价。详见第5.4节。<\/p>\n<h2>命中五档<\/h2>\n<p>战斗中的结果分级：<strong>险失／失手／命中／精准／重击<\/strong>，按超出或低于防御的幅度判定。天然20恒为重击，天然1恒为险失。详见第9.1节。<\/p>\n<h2>部位与致残<\/h2>\n<p>可选写实变体：命中另掷d20定部位，局部伤累积致残（手脱武、腿倒地、胸腹昏迷、头濒死），溢出灌入总HP。护甲只护它覆盖的部位。详见第9.1节。<\/p>\n<h2>群组HP<\/h2>\n<p>杂兵以组为单位共享一条血，一组一骰、一组一先攻。<strong>别给八个喽啰排八张卡。<\/strong> 详见第9.1节。<\/p>\n<h2>战位<\/h2>\n<p>海战中PC各自占据的岗位：<strong>掌舵／帆组／炮组／瞭望／跳帮／船医<\/strong>（另有杂务位）。每席每轮限选白名单中一项动作。详见第9.4节。<\/p>\n<h2>阵位令<\/h2>\n<p>多船会战的核心机制：<strong>并舷令（3）／纵队令（2）／自由令（1）<\/strong>，各船长暗写下一轮、同时翻明，令值高者先动。加成取高不叠；旗舰沉或被俘则全队上限降为自由令。详见第9.3节。<\/p>\n<h2>贯舷<\/h2>\n<p>沿目标首尾轴线（夹角≤30°、距离≤4格）射击：命中等级升一级、部位锁定艏或艉、目标下轮速度档−1。即\"抢T字\"的技术名称。详见第9.3节。<\/p>\n<h2>船长号令<\/h2>\n<p>每轮一条的附赠指令：<strong>齐射！／稳住！／抢修！／接舷队！／砍缆！／抢上风！<\/strong>——它把\"谁在指挥\"变成一件看得见的东西。详见第9.4节。<\/p>\n<h2>齐射递减梯<\/h2>\n<p>同一轮内第二连−5、第三连起−10，<strong>不可被任何专长移除<\/strong>。它惩罚一轮打光，逼出分轮节奏。详见第9.5节。<\/p>\n<h2>双钟<\/h2>\n<p>追击的时间模型：追方【贴上来】与逃方【拉开】各6格，每轮至多+1，先满者胜；<strong>同轮双满＝双结局，不重掷<\/strong>。对抗成功不推钟，改为下次检定+1档。详见第9.7节。<\/p>\n<h2>银币<\/h2>\n<p>本作记账本位，<strong>≈5.5克纯银<\/strong>（1601年后英国先令等值）。1金币＝10银币≈1达克特。全期价格按克纯银折算后取整，故不随章节内年代漂移。详见第6.1节。<\/p>\n<h2>舱位<\/h2>\n<p>货舱的抽象单位：1舱位＝1类商品（一整批）｜或2段补给｜或1份备料。<strong>故意不称重<\/strong>——舱位的价值在于它是一个社交装置。详见第6.8节。<\/p>\n<h2>事务长磅<\/h2>\n<p>历史上真实存在的短称：海军事务长的磅＝14盎司，比市磅短12.5%。<strong>\"配给没错，但你饿\"的制度原因<\/strong>，也是一条可查的贪腐线索。详见第6.7节。<\/p>\n<h2>行情骰<\/h2>\n<p>每港、每商品类别，一次停泊掷d6：×0.6／0.8／1.0／1.3／1.7／2.4。乘数带来自实测粮价波动区间。详见第10.2节。<\/p>\n<h2>船份<\/h2>\n<p>产权以1/16为最小单位持有（史实常为64份）。战役第一幕\"拿到船\"的真正目标是<strong>一份产权<\/strong>，不是一条船。详见第10.6节。<\/p>\n<h2>五档账本<\/h2>\n<p>每次进港GM只读三分钟、挑1–2条兑现：<strong>恩义／血债／传闻／场景点／恶化<\/strong>。传闻档可对玩家公开，其余保密。兑现优先级：对白＞价格＞事件。详见第10.8节。<\/p>\n<h2>恶名<\/h2>\n<p>与声望<strong>分开记<\/strong>的第二条轨。劫掠升恶名不一定降声望——取决于对谁。恶名买的是\"便宜又勇敢的人\"，代价是\"体面的人不来\"。详见第10.8节。<\/p>\n<h2>六段式委托<\/h2>\n<p>本作的任务骨架：<strong>接委托→备航→航行→遭遇→探险→结算<\/strong>。三条红线：受雇即动机／委托人必有误差／反转指向委托人一侧。详见第10.9与13.3节。<\/p>\n<h2>三线索原则<\/h2>\n<p>任何真相至少有三条独立通路，任一条都能推出它的一部分。<strong>这是防止长团卡死的机制，也是8.4与11.7的共同骨架。<\/strong> 详见第8.4节。<\/p>\n<h2>画线的时刻<\/h2>\n<p>本作最好的一次GM动作：玩家要在海图上选航线时，<strong>GM递笔<\/strong>，让玩家自己画线、写代价，然后问一句\"如果这条线没了，你还剩多少\"。核心概念必须有物理动作承载。详见第13.3节。<\/p>\n<h2>航段脚本<\/h2>\n<p>万能冒险壳：<strong>起航→航程①→航程②→航程③→遭遇高潮→回港结算<\/strong>。任何冒险都能填进这个壳。详见第13.3节。<\/p>\n<h2>四货币<\/h2>\n<p>XP／银币／声望／船，<strong>互不兑换<\/strong>。目的是防止任何一种玩法垄断升级路径。详见第13.7节。<\/p>\n<h2>桌上预算律<\/h2>\n<p>最强的一条资产过滤器：<strong>凡不能压到一张卡或一句话的资产，不上桌。<\/strong> 详见第13.1节。<\/p>\n<h2>特写展开<\/h2>\n<p>《迷雾之城》式的电影化overlay，取代激励／灵感点一类系统，<strong>明确不作主线<\/strong>：角色卡背面写「我的问题」＋三格揭示，每幕全桌合计最多两次，特写内不掷骰、不结算伤害、不推进时钟。<strong>潮汐点买运气，特写买意义。<\/strong> 详见第13.11节。<\/p>\n<h2>镇定<\/h2>\n<p>面对恐惧的心理资源，<strong>＝胆魄×3<\/strong>。归零即崩溃时刻，掷心结表。详见第11.2节。<\/p>\n<h2>三分创伤<\/h2>\n<p>本作把恐惧分三类，因为解药不同：<strong>尸创<\/strong>（靠人解）／<strong>海创<\/strong>（靠岸解）／<strong>渊创<\/strong>（无解）。详见第11.2节。<\/p>\n<h2>心结<\/h2>\n<p>资产化的创伤：给角色一个可触发的钩子、给玩家一个扮演抓手、可换卓越扮演XP。唯一硬的是\"不处理会恶化\"。详见第11.2节。<\/p>\n<h2>羁绊投射<\/h2>\n<p>花1d4点镇定，把一次即将发生的恐惧转嫁给羁绊栏上那个具体的人。【关闭】档下依然有效。<strong>它让\"把别人推进坑里\"变成一个可以按下的按钮。<\/strong> 详见第11.2节。<\/p>\n<h2>四轨<\/h2>\n<p>船团经营层（可选系统包）：<strong>船艺／人心／纪律／人脉<\/strong>，全桌共享的\"船团线\"，<strong>不是第五条角色成长线<\/strong>。档位阶梯0/2/4/7/10，配三条咬合约束。详见第14.4包D。<\/p>\n<h2>船员三轴<\/h2>\n<p><strong>技／缘／创<\/strong>各0–2，只管3–4名具名船员，不含PC。<strong>创2＝离船，永久失去。<\/strong> 战后结算：胜→技+1／惨胜→创+1／败→创+1且缘−1。详见第14.4包D。<\/p>\n<h2>雾海<\/h2>\n<p>本项目另一套已建成的设定数据包（十港六势力，含派系敌对与日程），可作为12.4/12.3的可插入替换包。<strong>只取它的地名与结构，不取其数值<\/strong>——它的六属性1–100尺度与本作不兼容。详见第12.4b节。<\/p>\n<h2>燃潮<\/h2>\n<p>可选的环境现象（影响航线、士气与海怪出现），<strong>不是一套魔法体系<\/strong>。关闭档下它只是\"洋流与季风的说法\"。详见第11.5与14.3节。<\/p>","text":"怎么用 ：正文中带金色虚线下划线的词，鼠标停留片刻即可弹出简明释义；本章亦可作为术语手册直接查阅。 怎么扩 ：按 ## 词条名 + 段落释义的格式往下加，重跑构建即自动上站。 潮汐点 玩家的命运资源，每人3点（天赋\"幸运之星\"上限4）。花1点可：重掷自己的任意骰、在结果公布后+5、把一次失败改写为\"成功但引入新麻烦\"、或将致命伤害减半／从濒死回到1 HP。回港休整恢复全部，海上长休恢复1点。详见第3章。 DV 难度等级（Difficulty Value）——检定成功所需的目标值。标准阶梯：简单10／普通13／困难16／极难19／传奇22。详见第3章。 检定 行动成败存疑且后果重要时，掷 1d20＋相关属性＋相关技能 ，≥ DV 即成功。失败必须改变局面：代价、复杂化或信息，三选一。详见第3章。 优势 场景条件对行动有利时掷2个d20取高。多个优势不叠加；一优一劣相互抵消。反之即\"劣势\"。详见第3章。 劣势 场景条件对行动不利时掷2个d20取低。多个劣势不叠加；一优一劣相互抵消。详见第3章。 对抗检定 双方各掷 d20＋属性＋技能，高者胜，平局对防守方有利。用于潜行对侦察、欺骗对洞察、追逃对追捕。详见第3章。 团队检定 全员各掷同一检定， 过半成功则全队成功 。用于划桨接力、全船抢修、丛林行军等集体行动。详见第3章。 成功等级 检定超出DV的程度决定质量：卓越（＋10）／良好（＋5）／成功／失败／惨败（－5）。等级越高额外获益越多，惨败额外受损。详见第3章。 筋骨 五属性之一，管辖力量、耐力与健壮：攀索、撞门、扛伤、划桨、憋气。HP由此派生。详见第3章。 机敏 五属性之一，管辖灵巧、速度与手稳：操帆、攀爬、瞄准、开锁、躲闪；战斗先攻也看它。详见第3章。 学识 五属性之一，管辖智力、记忆与推理：导航、炮术计算、识图、医术、语言学。详见第3章。 胆魄 五属性之一，管辖意志、勇气与冷静：抵抗恐惧、忍受痛苦、坚持掌舵。超自然档下的恐惧检定也看它。详见第3章。 人望 五属性之一，管辖魅力、威仪与共情：领导、交涉、欺骗、表演、招募。详见第3章。 HP 生命值 ＝ 6 ＋ 筋骨×2 。归零不是死亡，而是倒地濒死。详见第3章。 濒死 HP归零后的状态。每轮掷死亡骰（d20≥10算稳定），累计3次失败死亡、3次成功稳固；急救（医术 DV13）可代为掷骰。详见第3章。 死亡骰 濒死时每轮掷的d20：≥10稳定，&lt;10记1次失败，自然1记2次。3次失败即死亡。详见第3章。 伤疤 大伤复原后GM可要求记录的永久小代价（如\"左耳失聪\"）。是故事资产而非数值惩罚堆叠。详见第3章。 战斗轮 个人战斗的时间单位，约6秒。每轮1个动作＋自由移动，先攻按机敏检定排序。详见第9章。 海战轮 舰船战斗的时间单位，约1分钟。每轮每名PC占一个战位；炮组装填需2轮。详见第9章。 航段 航行时间单位：4小时，一昼夜6段。航行、守夜、船上活动都按段结算；值勤超过4段进入疲劳。详见第7章。 船体值 船只的结构完整度（Hull）。归零＝失控或沉没危机——从这一刻起，死的不是船，是人。详见第7章。 齐射 舰炮集体射击：d20＋炮术 对 DV14，命中造成3d6船体伤害；每2轮可射击一次（装填）。详见第9章。 接舷 用钩索把敌船钩连过来打甲板战：接舷检定 vs 14，成功后双方转入个人战斗规则。详见第9章。 跳帮 接舷后由跳帮队冲上敌舰甲板的作战行动；留守队看家，防止对方反跳。详见第9章。 战位 海战中每名PC占用的岗位：掌舵／炮组／帆组／瞭望／跳帮队／船医位。分工即战术。详见第9章。 船员士气 全船水手的整体士气值（0–20）。口粮、伤亡、拖欠、胜利都会影响它；降到5以下，每个航段都可能掷出哗变。详见第7章。 哗变 士气崩盘后水手抗命或夺船的风险检定。冷酷船长的个人威慑＋3——但威慑不是人心。详见第7章。 坏血病 长期吃不上新鲜果蔬的航行病，按累积骰触发；医术与柠檬（或酸菜）可防可治。详见第7章。 疲劳 值勤过度或连续熬夜的状态，1–3级：1级＝所有检定劣势，3级强制昏睡。详见第7章。 声望 角色在各势力中的名声数值（0–100）：无名／熟人／可信／名人／传奇。决定军港准入与待遇。与恶名分开记。详见第10章。 恶名 劫掠积累的负面名气：招海军巡逻，也招水手投效——海盗的免费广告。详见第10章。 私掠许可证 国家颁发的合法劫掠执照。持证期间在颁发国港口不因掠夺增加恶名；打错对象，执照立刻变成绞索。详见第10章。 船份 战利品分配制：船长6份、大副3份、技师2份、水手1份。PC按船职取份——船上的政治由此而来。详见第10章。 里程碑 本书的成长制（XP）：按故事而非击杀计分——参与保底1XP，达成目标、卓越扮演、画出新海图各+1。升1级需3XP（9级后4XP）。详见第3章。 出身 角色从哪里来：给＋1属性、2项受训技能、1门语言、出身装备与出身特性。详见第4章。 原型 你在船上领哪份工钱：船长／领航员／炮长／船医／剑客／火枪手／商人／学者／掠私者／怪力水手，各给本职技能与职业特性。详见第4章。 天赋 不可被剥夺的身份性能力，如老海狼、海图记忆、幸运之星、冷酷船长。创建时选1项。详见第4章。 海图揭示 未探索海域在战役地图上被逐步绘制进 玩家的海图 的过程。海图是道具，不是UI——它会被洇湿、烧掉、卖掉。详见第8章。 海燕号 快速开始里的单桅快船：船体14、4门4磅炮、11名船员；特性\"浅水之子\"——礁区与河口的航行检定劣势移除。详见第2章。 红隼号 风暴海域最凶的猎私船：双桅、吃水浅、6门炮。旗语只有一句话——停船受检，否则击沉。详见第2章。 迷航 连续两个航段导航失败后的状态：每段继续偏航、遭遇骰+4，直到下一次导航成功（DV-2）。迷航者遇到的总是更多。详见第7章。 抢风航法 逆风时的\"之\"字走位：航程减半、每段掌舵检定、连续3段疲劳+1。卡拉维尔帆船的看家本领。详见第7章。 进水 水线被击穿后的状态：每段船体-1，需每点派1人抽水，木工DV14止漏。进水不是血条，是倒计时。详见第7章。 沉没规程 船体归零后的十段倒计时：抢救（团队木工DV16，成功船体回到1）或弃船（小艇只装得下三分之一编制）。详见第7章。 关键线索永不投骰 P0原则第一条： 如果一条线索是剧情的唯一通路，它就不需要检定。 检定决定你能额外知道多少，不决定你有没有资格知道。详见第5.0节。 Let it Ride 同一件事、同一个目标、同一段航程内 只掷一次 。想重掷须改变条件、付出代价、或接受降档加风险。详见第5.0节。 受训线 每项技能第一行写明的\"必须受训才能做的专业动作\"。未受训可做基础动作，但不能指挥齐射、不能测天定位、不能做手术。详见第5章。 专长分支 技能达到4级后可选的成长件，效果 只有两种 ：特定情境+2，或移除一种既定劣势。不做新动作、不改骰法、不加伤害骰。详见第5.1节。 交易 社交域技能，本作定稿时补入（3.5预览表曾漏列，但出身、原型、招募与第十章全在用它）。谈价、看货、期约、大宗折价。详见第5.4节。 命中五档 战斗中的结果分级： 险失／失手／命中／精准／重击 ，按超出或低于防御的幅度判定。天然20恒为重击，天然1恒为险失。详见第9.1节。 部位与致残 可选写实变体：命中另掷d20定部位，局部伤累积致残（手脱武、腿倒地、胸腹昏迷、头濒死），溢出灌入总HP。护甲只护它覆盖的部位。详见第9.1节。 群组HP 杂兵以组为单位共享一条血，一组一骰、一组一先攻。 别给八个喽啰排八张卡。 详见第9.1节。 战位 海战中PC各自占据的岗位： 掌舵／帆组／炮组／瞭望／跳帮／船医 （另有杂务位）。每席每轮限选白名单中一项动作。详见第9.4节。 阵位令 多船会战的核心机制： 并舷令（3）／纵队令（2）／自由令（1） ，各船长暗写下一轮、同时翻明，令值高者先动。加成取高不叠；旗舰沉或被俘则全队上限降为自由令。详见第9.3节。 贯舷 沿目标首尾轴线（夹角≤30°、距离≤4格）射击：命中等级升一级、部位锁定艏或艉、目标下轮速度档−1。即\"抢T字\"的技术名称。详见第9.3节。 船长号令 每轮一条的附赠指令： 齐射！／稳住！／抢修！／接舷队！／砍缆！／抢上风！ ——它把\"谁在指挥\"变成一件看得见的东西。详见第9.4节。 齐射递减梯 同一轮内第二连−5、第三连起−10， 不可被任何专长移除 。它惩罚一轮打光，逼出分轮节奏。详见第9.5节。 双钟 追击的时间模型：追方【贴上来】与逃方【拉开】各6格，每轮至多+1，先满者胜； 同轮双满＝双结局，不重掷 。对抗成功不推钟，改为下次检定+1档。详见第9.7节。 银币 本作记账本位， ≈5.5克纯银 （1601年后英国先令等值）。1金币＝10银币≈1达克特。全期价格按克纯银折算后取整，故不随章节内年代漂移。详见第6.1节。 舱位 货舱的抽象单位：1舱位＝1类商品（一整批）｜或2段补给｜或1份备料。 故意不称重 ——舱位的价值在于它是一个社交装置。详见第6.8节。 事务长磅 历史上真实存在的短称：海军事务长的磅＝14盎司，比市磅短12.5%。 \"配给没错，但你饿\"的制度原因 ，也是一条可查的贪腐线索。详见第6.7节。 行情骰 每港、每商品类别，一次停泊掷d6：×0.6／0.8／1.0／1.3／1.7／2.4。乘数带来自实测粮价波动区间。详见第10.2节。 船份 产权以1/16为最小单位持有（史实常为64份）。战役第一幕\"拿到船\"的真正目标是 一份产权 ，不是一条船。详见第10.6节。 五档账本 每次进港GM只读三分钟、挑1–2条兑现： 恩义／血债／传闻／场景点／恶化 。传闻档可对玩家公开，其余保密。兑现优先级：对白＞价格＞事件。详见第10.8节。 恶名 与声望 分开记 的第二条轨。劫掠升恶名不一定降声望——取决于对谁。恶名买的是\"便宜又勇敢的人\"，代价是\"体面的人不来\"。详见第10.8节。 六段式委托 本作的任务骨架： 接委托→备航→航行→遭遇→探险→结算 。三条红线：受雇即动机／委托人必有误差／反转指向委托人一侧。详见第10.9与13.3节。 三线索原则 任何真相至少有三条独立通路，任一条都能推出它的一部分。 这是防止长团卡死的机制，也是8.4与11.7的共同骨架。 详见第8.4节。 画线的时刻 本作最好的一次GM动作：玩家要在海图上选航线时， GM递笔 ，让玩家自己画线、写代价，然后问一句\"如果这条线没了，你还剩多少\"。核心概念必须有物理动作承载。详见第13.3节。 航段脚本 万能冒险壳： 起航→航程①→航程②→航程③→遭遇高潮→回港结算 。任何冒险都能填进这个壳。详见第13.3节。 四货币 XP／银币／声望／船， 互不兑换 。目的是防止任何一种玩法垄断升级路径。详见第13.7节。 桌上预算律 最强的一条资产过滤器： 凡不能压到一张卡或一句话的资产，不上桌。 详见第13.1节。 特写展开 《迷雾之城》式的电影化overlay，取代激励／灵感点一类系统， 明确不作主线 ：角色卡背面写「我的问题」＋三格揭示，每幕全桌合计最多两次，特写内不掷骰、不结算伤害、不推进时钟。 潮汐点买运气，特写买意义。 详见第13.11节。 镇定 面对恐惧的心理资源， ＝胆魄×3 。归零即崩溃时刻，掷心结表。详见第11.2节。 三分创伤 本作把恐惧分三类，因为解药不同： 尸创 （靠人解）／ 海创 （靠岸解）／ 渊创 （无解）。详见第11.2节。 心结 资产化的创伤：给角色一个可触发的钩子、给玩家一个扮演抓手、可换卓越扮演XP。唯一硬的是\"不处理会恶化\"。详见第11.2节。 羁绊投射 花1d4点镇定，把一次即将发生的恐惧转嫁给羁绊栏上那个具体的人。【关闭】档下依然有效。 它让\"把别人推进坑里\"变成一个可以按下的按钮。 详见第11.2节。 四轨 船团经营层（可选系统包）： 船艺／人心／纪律／人脉 ，全桌共享的\"船团线\"， 不是第五条角色成长线 。档位阶梯0/2/4/7/10，配三条咬合约束。详见第14.4包D。 船员三轴 技／缘／创 各0–2，只管3–4名具名船员，不含PC。 创2＝离船，永久失去。 战后结算：胜→技+1／惨胜→创+1／败→创+1且缘−1。详见第14.4包D。 雾海 本项目另一套已建成的设定数据包（十港六势力，含派系敌对与日程），可作为12.4/12.3的可插入替换包。 只取它的地名与结构，不取其数值 ——它的六属性1–100尺度与本作不兼容。详见第12.4b节。 燃潮 可选的环境现象（影响航线、士气与海怪出现）， 不是一套魔法体系 。关闭档下它只是\"洋流与季风的说法\"。详见第11.5与14.3节。"}]</script>
<script id="gloss-data" type="application/json">{"潮汐点":"<p>玩家的命运资源，每人3点（天赋\"幸运之星\"上限4）。花1点可：重掷自己的任意骰、在结果公布后+5、把一次失败改写为\"成功但引入新麻烦\"、或将致命伤害减半／从濒死回到1 HP。回港休整恢复全部，海上长休恢复1点。详见第3章。<\/p>","DV":"<p>难度等级（Difficulty Value）——检定成功所需的目标值。标准阶梯：简单10／普通13／困难16／极难19／传奇22。详见第3章。<\/p>","检定":"<p>行动成败存疑且后果重要时，掷 <strong>1d20＋相关属性＋相关技能<\/strong>，≥ DV 即成功。失败必须改变局面：代价、复杂化或信息，三选一。详见第3章。<\/p>","优势":"<p>场景条件对行动有利时掷2个d20取高。多个优势不叠加；一优一劣相互抵消。反之即\"劣势\"。详见第3章。<\/p>","劣势":"<p>场景条件对行动不利时掷2个d20取低。多个劣势不叠加；一优一劣相互抵消。详见第3章。<\/p>","对抗检定":"<p>双方各掷 d20＋属性＋技能，高者胜，平局对防守方有利。用于潜行对侦察、欺骗对洞察、追逃对追捕。详见第3章。<\/p>","团队检定":"<p>全员各掷同一检定，<strong>过半成功则全队成功<\/strong>。用于划桨接力、全船抢修、丛林行军等集体行动。详见第3章。<\/p>","成功等级":"<p>检定超出DV的程度决定质量：卓越（＋10）／良好（＋5）／成功／失败／惨败（－5）。等级越高额外获益越多，惨败额外受损。详见第3章。<\/p>","筋骨":"<p>五属性之一，管辖力量、耐力与健壮：攀索、撞门、扛伤、划桨、憋气。HP由此派生。详见第3章。<\/p>","机敏":"<p>五属性之一，管辖灵巧、速度与手稳：操帆、攀爬、瞄准、开锁、躲闪；战斗先攻也看它。详见第3章。<\/p>","学识":"<p>五属性之一，管辖智力、记忆与推理：导航、炮术计算、识图、医术、语言学。详见第3章。<\/p>","胆魄":"<p>五属性之一，管辖意志、勇气与冷静：抵抗恐惧、忍受痛苦、坚持掌舵。超自然档下的恐惧检定也看它。详见第3章。<\/p>","人望":"<p>五属性之一，管辖魅力、威仪与共情：领导、交涉、欺骗、表演、招募。详见第3章。<\/p>","HP":"<p>生命值 ＝ <strong>6 ＋ 筋骨×2<\/strong>。归零不是死亡，而是倒地濒死。详见第3章。<\/p>","濒死":"<p>HP归零后的状态。每轮掷死亡骰（d20≥10算稳定），累计3次失败死亡、3次成功稳固；急救（医术 DV13）可代为掷骰。详见第3章。<\/p>","死亡骰":"<p>濒死时每轮掷的d20：≥10稳定，&lt;10记1次失败，自然1记2次。3次失败即死亡。详见第3章。<\/p>","伤疤":"<p>大伤复原后GM可要求记录的永久小代价（如\"左耳失聪\"）。是故事资产而非数值惩罚堆叠。详见第3章。<\/p>","战斗轮":"<p>个人战斗的时间单位，约6秒。每轮1个动作＋自由移动，先攻按机敏检定排序。详见第9章。<\/p>","海战轮":"<p>舰船战斗的时间单位，约1分钟。每轮每名PC占一个战位；炮组装填需2轮。详见第9章。<\/p>","航段":"<p>航行时间单位：4小时，一昼夜6段。航行、守夜、船上活动都按段结算；值勤超过4段进入疲劳。详见第7章。<\/p>","船体值":"<p>船只的结构完整度（Hull）。归零＝失控或沉没危机——从这一刻起，死的不是船，是人。详见第7章。<\/p>","齐射":"<p>舰炮集体射击：d20＋炮术 对 DV14，命中造成3d6船体伤害；每2轮可射击一次（装填）。详见第9章。<\/p>","接舷":"<p>用钩索把敌船钩连过来打甲板战：接舷检定 vs 14，成功后双方转入个人战斗规则。详见第9章。<\/p>","跳帮":"<p>接舷后由跳帮队冲上敌舰甲板的作战行动；留守队看家，防止对方反跳。详见第9章。<\/p>","战位":"<p>海战中PC各自占据的岗位：<strong>掌舵／帆组／炮组／瞭望／跳帮／船医<\/strong>（另有杂务位）。每席每轮限选白名单中一项动作。详见第9.4节。<\/p>","船员士气":"<p>全船水手的整体士气值（0–20）。口粮、伤亡、拖欠、胜利都会影响它；降到5以下，每个航段都可能掷出哗变。详见第7章。<\/p>","哗变":"<p>士气崩盘后水手抗命或夺船的风险检定。冷酷船长的个人威慑＋3——但威慑不是人心。详见第7章。<\/p>","坏血病":"<p>长期吃不上新鲜果蔬的航行病，按累积骰触发；医术与柠檬（或酸菜）可防可治。详见第7章。<\/p>","疲劳":"<p>值勤过度或连续熬夜的状态，1–3级：1级＝所有检定劣势，3级强制昏睡。详见第7章。<\/p>","声望":"<p>角色在各势力中的名声数值（0–100）：无名／熟人／可信／名人／传奇。决定军港准入与待遇。与恶名分开记。详见第10章。<\/p>","恶名":"<p>与声望<strong>分开记<\/strong>的第二条轨。劫掠升恶名不一定降声望——取决于对谁。恶名买的是\"便宜又勇敢的人\"，代价是\"体面的人不来\"。详见第10.8节。<\/p>","私掠许可证":"<p>国家颁发的合法劫掠执照。持证期间在颁发国港口不因掠夺增加恶名；打错对象，执照立刻变成绞索。详见第10章。<\/p>","船份":"<p>产权以1/16为最小单位持有（史实常为64份）。战役第一幕\"拿到船\"的真正目标是<strong>一份产权<\/strong>，不是一条船。详见第10.6节。<\/p>","里程碑":"<p>本书的成长制（XP）：按故事而非击杀计分——参与保底1XP，达成目标、卓越扮演、画出新海图各+1。升1级需3XP（9级后4XP）。详见第3章。<\/p>","出身":"<p>角色从哪里来：给＋1属性、2项受训技能、1门语言、出身装备与出身特性。详见第4章。<\/p>","原型":"<p>你在船上领哪份工钱：船长／领航员／炮长／船医／剑客／火枪手／商人／学者／掠私者／怪力水手，各给本职技能与职业特性。详见第4章。<\/p>","天赋":"<p>不可被剥夺的身份性能力，如老海狼、海图记忆、幸运之星、冷酷船长。创建时选1项。详见第4章。<\/p>","海图揭示":"<p>未探索海域在战役地图上被逐步绘制进<strong>玩家的海图<\/strong>的过程。海图是道具，不是UI——它会被洇湿、烧掉、卖掉。详见第8章。<\/p>","海燕号":"<p>快速开始里的单桅快船：船体14、4门4磅炮、11名船员；特性\"浅水之子\"——礁区与河口的航行检定劣势移除。详见第2章。<\/p>","红隼号":"<p>风暴海域最凶的猎私船：双桅、吃水浅、6门炮。旗语只有一句话——停船受检，否则击沉。详见第2章。<\/p>","迷航":"<p>连续两个航段导航失败后的状态：每段继续偏航、遭遇骰+4，直到下一次导航成功（DV-2）。迷航者遇到的总是更多。详见第7章。<\/p>","抢风航法":"<p>逆风时的\"之\"字走位：航程减半、每段掌舵检定、连续3段疲劳+1。卡拉维尔帆船的看家本领。详见第7章。<\/p>","进水":"<p>水线被击穿后的状态：每段船体-1，需每点派1人抽水，木工DV14止漏。进水不是血条，是倒计时。详见第7章。<\/p>","沉没规程":"<p>船体归零后的十段倒计时：抢救（团队木工DV16，成功船体回到1）或弃船（小艇只装得下三分之一编制）。详见第7章。<\/p>","关键线索永不投骰":"<p>P0原则第一条：<strong>如果一条线索是剧情的唯一通路，它就不需要检定。<\/strong> 检定决定你能额外知道多少，不决定你有没有资格知道。详见第5.0节。<\/p>","Let it Ride":"<p>同一件事、同一个目标、同一段航程内<strong>只掷一次<\/strong>。想重掷须改变条件、付出代价、或接受降档加风险。详见第5.0节。<\/p>","受训线":"<p>每项技能第一行写明的\"必须受训才能做的专业动作\"。未受训可做基础动作，但不能指挥齐射、不能测天定位、不能做手术。详见第5章。<\/p>","专长分支":"<p>技能达到4级后可选的成长件，效果<strong>只有两种<\/strong>：特定情境+2，或移除一种既定劣势。不做新动作、不改骰法、不加伤害骰。详见第5.1节。<\/p>","交易":"<p>社交域技能，本作定稿时补入（3.5预览表曾漏列，但出身、原型、招募与第十章全在用它）。谈价、看货、期约、大宗折价。详见第5.4节。<\/p>","命中五档":"<p>战斗中的结果分级：<strong>险失／失手／命中／精准／重击<\/strong>，按超出或低于防御的幅度判定。天然20恒为重击，天然1恒为险失。详见第9.1节。<\/p>","部位与致残":"<p>可选写实变体：命中另掷d20定部位，局部伤累积致残（手脱武、腿倒地、胸腹昏迷、头濒死），溢出灌入总HP。护甲只护它覆盖的部位。详见第9.1节。<\/p>","群组HP":"<p>杂兵以组为单位共享一条血，一组一骰、一组一先攻。<strong>别给八个喽啰排八张卡。<\/strong> 详见第9.1节。<\/p>","阵位令":"<p>多船会战的核心机制：<strong>并舷令（3）／纵队令（2）／自由令（1）<\/strong>，各船长暗写下一轮、同时翻明，令值高者先动。加成取高不叠；旗舰沉或被俘则全队上限降为自由令。详见第9.3节。<\/p>","贯舷":"<p>沿目标首尾轴线（夹角≤30°、距离≤4格）射击：命中等级升一级、部位锁定艏或艉、目标下轮速度档−1。即\"抢T字\"的技术名称。详见第9.3节。<\/p>","船长号令":"<p>每轮一条的附赠指令：<strong>齐射！／稳住！／抢修！／接舷队！／砍缆！／抢上风！<\/strong>——它把\"谁在指挥\"变成一件看得见的东西。详见第9.4节。<\/p>","齐射递减梯":"<p>同一轮内第二连−5、第三连起−10，<strong>不可被任何专长移除<\/strong>。它惩罚一轮打光，逼出分轮节奏。详见第9.5节。<\/p>","双钟":"<p>追击的时间模型：追方【贴上来】与逃方【拉开】各6格，每轮至多+1，先满者胜；<strong>同轮双满＝双结局，不重掷<\/strong>。对抗成功不推钟，改为下次检定+1档。详见第9.7节。<\/p>","银币":"<p>本作记账本位，<strong>≈5.5克纯银<\/strong>（1601年后英国先令等值）。1金币＝10银币≈1达克特。全期价格按克纯银折算后取整，故不随章节内年代漂移。详见第6.1节。<\/p>","舱位":"<p>货舱的抽象单位：1舱位＝1类商品（一整批）｜或2段补给｜或1份备料。<strong>故意不称重<\/strong>——舱位的价值在于它是一个社交装置。详见第6.8节。<\/p>","事务长磅":"<p>历史上真实存在的短称：海军事务长的磅＝14盎司，比市磅短12.5%。<strong>\"配给没错，但你饿\"的制度原因<\/strong>，也是一条可查的贪腐线索。详见第6.7节。<\/p>","行情骰":"<p>每港、每商品类别，一次停泊掷d6：×0.6／0.8／1.0／1.3／1.7／2.4。乘数带来自实测粮价波动区间。详见第10.2节。<\/p>","五档账本":"<p>每次进港GM只读三分钟、挑1–2条兑现：<strong>恩义／血债／传闻／场景点／恶化<\/strong>。传闻档可对玩家公开，其余保密。兑现优先级：对白＞价格＞事件。详见第10.8节。<\/p>","六段式委托":"<p>本作的任务骨架：<strong>接委托→备航→航行→遭遇→探险→结算<\/strong>。三条红线：受雇即动机／委托人必有误差／反转指向委托人一侧。详见第10.9与13.3节。<\/p>","三线索原则":"<p>任何真相至少有三条独立通路，任一条都能推出它的一部分。<strong>这是防止长团卡死的机制，也是8.4与11.7的共同骨架。<\/strong> 详见第8.4节。<\/p>","画线的时刻":"<p>本作最好的一次GM动作：玩家要在海图上选航线时，<strong>GM递笔<\/strong>，让玩家自己画线、写代价，然后问一句\"如果这条线没了，你还剩多少\"。核心概念必须有物理动作承载。详见第13.3节。<\/p>","航段脚本":"<p>万能冒险壳：<strong>起航→航程①→航程②→航程③→遭遇高潮→回港结算<\/strong>。任何冒险都能填进这个壳。详见第13.3节。<\/p>","四货币":"<p>XP／银币／声望／船，<strong>互不兑换<\/strong>。目的是防止任何一种玩法垄断升级路径。详见第13.7节。<\/p>","桌上预算律":"<p>最强的一条资产过滤器：<strong>凡不能压到一张卡或一句话的资产，不上桌。<\/strong> 详见第13.1节。<\/p>","特写展开":"<p>《迷雾之城》式的电影化overlay，取代激励／灵感点一类系统，<strong>明确不作主线<\/strong>：角色卡背面写「我的问题」＋三格揭示，每幕全桌合计最多两次，特写内不掷骰、不结算伤害、不推进时钟。<strong>潮汐点买运气，特写买意义。<\/strong> 详见第13.11节。<\/p>","镇定":"<p>面对恐惧的心理资源，<strong>＝胆魄×3<\/strong>。归零即崩溃时刻，掷心结表。详见第11.2节。<\/p>","三分创伤":"<p>本作把恐惧分三类，因为解药不同：<strong>尸创<\/strong>（靠人解）／<strong>海创<\/strong>（靠岸解）／<strong>渊创<\/strong>（无解）。详见第11.2节。<\/p>","心结":"<p>资产化的创伤：给角色一个可触发的钩子、给玩家一个扮演抓手、可换卓越扮演XP。唯一硬的是\"不处理会恶化\"。详见第11.2节。<\/p>","羁绊投射":"<p>花1d4点镇定，把一次即将发生的恐惧转嫁给羁绊栏上那个具体的人。【关闭】档下依然有效。<strong>它让\"把别人推进坑里\"变成一个可以按下的按钮。<\/strong> 详见第11.2节。<\/p>","四轨":"<p>船团经营层（可选系统包）：<strong>船艺／人心／纪律／人脉<\/strong>，全桌共享的\"船团线\"，<strong>不是第五条角色成长线<\/strong>。档位阶梯0/2/4/7/10，配三条咬合约束。详见第14.4包D。<\/p>","船员三轴":"<p><strong>技／缘／创<\/strong>各0–2，只管3–4名具名船员，不含PC。<strong>创2＝离船，永久失去。<\/strong> 战后结算：胜→技+1／惨胜→创+1／败→创+1且缘−1。详见第14.4包D。<\/p>","雾海":"<p>本项目另一套已建成的设定数据包（十港六势力，含派系敌对与日程），可作为12.4/12.3的可插入替换包。<strong>只取它的地名与结构，不取其数值<\/strong>——它的六属性1–100尺度与本作不兼容。详见第12.4b节。<\/p>","燃潮":"<p>可选的环境现象（影响航线、士气与海怪出现），<strong>不是一套魔法体系<\/strong>。关闭档下它只是\"洋流与季风的说法\"。详见第11.5与14.3节。<\/p>"}</script>
<script>
const DATA = JSON.parse(document.getElementById('book-data').textContent);
const $ = s => document.querySelector(s);
const VOLS = [...new Set(DATA.map(c=>c.vol))];

/* ---------- 侧栏 ---------- */
function buildToc(){
  let h = '';
  VOLS.forEach(v=>{
    const chs = DATA.filter(c=>c.vol===v);
    h += `<div class="vol">${v}</div>`;
    chs.forEach(c=>{
      h += `<a class="ch ${c.skeleton?'skel':''}" href="#ch${c.num}" data-num="${c.num}">
        <span class="no">${c.num}</span><span>${c.title}</span>
        <span class="st ${c.skeleton?'skel':'full'}" title="${c.skeleton?'骨架':'完整'}"></span></a>`;
    });
  });
  $('#toc').innerHTML = h;
}

/* ---------- 封面 ---------- */
function coverHTML(){
  const loop = ['① 立目标','② 航行','③ 遭遇','④ 收获','⑤ 回港'];
  const loopHTML = loop.map((s,i)=>(i?`<i style="--i:${i*2-1}">⇢</i>`:'')+`<span style="--i:${i*2}">${s}</span>`).join('') + '<i style="--i:10">⟲</i>';
  const frozen = [
    ['核心判定','d20 + 属性 + 技能 ≥ DV'],
    ['难度阶梯','10 / 13 / 16 / 19 / 22'],
    ['生命值','HP = 6 + 筋骨×2'],
    ['命运资源','潮汐点 3（天赋上限 4）'],
    ['炮击齐射','DV 14 · 3d6 船体 · 装填 2 轮'],
    ['时间尺度','一昼夜 6 航段 · 海战轮 1 分钟'],
  ];
  const volcards = VOLS.map((v,idx)=>{

       <span class="badge ${c.skeleton?'skel':'full'}">${c.skeleton?'骨架':'完整'}</span></a>`).join('') + '</div>';
  }).join('');
  return `<div class="cover">

      <circle cx="50" cy="50" r="38" stroke="#b8860b" stroke-width=".7" stroke-dasharray="2 4"/>
      <path d="M50 6 L56 44 L94 50 L56 56 L50 94 L44 56 L6 50 L44 44 Z" fill="#b8860b" opacity=".85"/>
      <path d="M50 22 L53.5 46.5 L78 50 L53.5 53.5 L50 78 L46.5 53.5 L22 50 L46.5 46.5 Z" fill="#f3ead6" opacity=".3"/>
      <circle cx="50" cy="50" r="4.5" fill="#8c2f39"/>
    </svg>
    <div class="kick">大航海时代 · 角色扮演游戏</div>
    <h1 class="ct">燃 帆</h1>
    <div class="en-title">The Age of Burning Sail</div>
    <div class="tagline">冒险 · 海战 · 探索 —— 一艘船，一片没画完的海图</div>
    <div class="epigraph">桅杆在燃烧，罗盘在颤抖。地平线之外，是黄金、风暴，和从未被画进海图的东西。</div>
    <div class="horizon" aria-hidden="true"><svg viewBox="0 0 420 56">
      <line x1="0" y1="40" x2="420" y2="40" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
      <path d="M0 40 Q 26 36 52 40 T 104 40 T 156 40 T 260 40 T 312 40 T 364 40 T 420 40" stroke="currentColor" fill="none" stroke-width="1" opacity=".35"/>
      <g class="boat">
        <path d="M196 36 Q208 42 224 36 L218 42 L202 42 Z" fill="currentColor"/>
        <path d="M209 8 L209 34 L196 34 Z" fill="currentColor" opacity=".85"/>

    <svg class="wave" width="360" height="18" viewBox="0 0 360 18"><path d="M0 9 Q15 0 30 9 T60 9 T90 9 T120 9 T150 9 T180 9 T210 9 T240 9 T270 9 T300 9 T330 9 T360 9" stroke="#b8860b" fill="none" stroke-width="1.6"/></svg>
    <div class="loop">${loopHTML}</div>

}

/* ---------- 章节渲染 ---------- */
function chapterHTML(c, prev, next){
  return `<div class="page">
    <div class="ch-head">
      <div class="kicker">${c.vol} · 第 ${c.num} 章 ${c.skeleton?'· 撰写中（骨架）':''}</div>
      <h1>${c.title}</h1><div class="rule"></div>
    </div>
    ${c.html}
    <div class="pager">
      ${prev?`<a href="#ch${prev.num}"><b>◀ 上一章</b>${prev.title}</a>`:'<a href="#cover"><b>◀ 返回</b>封面</a>'}
      ${next?`<a href="#ch${next.num}"><b>下一章 ▶</b>${next.title}</a>`:'<a href="#cover"><b>返回</b>封面 ⚓</a>'}
    </div></div>`;
}

/* ---------- 路由 ---------- */
function navigate(){
  const h = location.hash.replace('#','');
  const view = $('#view');
  let crumb = '燃帆', cur = null;
  if(h && h.startsWith('ch')){
    const num = h.slice(2);
    const i = DATA.findIndex(c=>c.num===num);
    if(i>=0){
      cur = DATA[i];
      view.innerHTML = chapterHTML(cur, DATA[i-1], DATA[i+1]);
      crumb = `第 ${cur.num} 章 · <b>${cur.title}</b>`;
    }
  }
  if(!cur){ view.innerHTML = coverHTML(); crumb = '燃帆 · <b>卷首</b>'; }
  $('#crumb').innerHTML = crumb;
  wikify(view);
  if(cur) reveal(view);
  document.querySelectorAll('#toc a.ch').forEach(a=>a.classList.toggle('active', !!cur && a.dataset.num===cur.num));
  document.body.classList.remove('side-open');
  window.scrollTo({top:0});
}

/* ---------- 搜索 ---------- */
const escHTML = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
$('#searchBox').addEventListener('input', e=>{
  const q = e.target.value.trim();
  const box = $('#searchResults');
  if(q.length<1){ box.innerHTML=''; return; }
  const hits = [];
  DATA.forEach(c=>{
    const idx = c.text.indexOf(q);
    if(idx>=0){
      const s = Math.max(0, idx-18);
      const frag = (s>0?'…':'') + escHTML(c.text.slice(s, idx+q.length+34)) + '…';
      hits.push(`<a class="sr" href="#ch${c.num}">
        ${c.num} · ${escHTML(c.title)}
        <span class="frag">${frag.split(q).join(`<b>${q}</b>`)}</span></a>`);
    }
  });
  box.innerHTML = hits.length ? hits.slice(0,8).join('') : '<span class="sr">海图上没有这片水域…（无结果）</span>';
});

/* ---------- 主题 / 移动端 ---------- */
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
function applyTheme(t, silent){
  document.body.classList.toggle('night', t==='night');
  $('#themeBtn').innerHTML = t==='night' ? ICON_SUN : ICON_MOON;
  localStorage.setItem('bf-theme', t);
  if(!silent){ const d = $('#duskFx'); d.classList.remove('go'); void d.offsetWidth; d.classList.add('go'); }
}
$('#themeBtn').onclick = ()=> applyTheme(document.body.classList.contains('night')?'day':'night');
$('#hamb').onclick = ()=> document.body.classList.toggle('side-open');
document.addEventListener('click', e=>{ if(document.body.classList.contains('side-open') && !e.target.closest('aside') && !e.target.closest('#hamb')) document.body.classList.remove('side-open'); });
applyTheme(localStorage.getItem('bf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'), true);
window.addEventListener('hashchange', navigate);
/* ---------- 风味：d20 掷骰 ---------- */
const diceBtn = $('#diceBtn'), rollPop = $('#rollPop'), rollNum = $('#rollNum'), rollVerdict = $('#rollVerdict');
const rollHist = $('#rollHist'), fxFlash = $('#fxFlash');
const HIST = [];
let rollTick = null, rollHide = null;
diceBtn.onclick = () => {
  diceBtn.classList.add('rolling');
  rollPop.classList.add('show');
  clearInterval(rollTick); clearTimeout(rollHide);
  rollTick = setInterval(()=>{ rollNum.textContent = 1 + Math.floor(Math.random()*20); rollNum.className = 'num'; }, 70);
  setTimeout(()=>{
    clearInterval(rollTick);
    const r = 1 + Math.floor(Math.random()*20);
    rollNum.textContent = r;
    rollNum.className = 'num' + (r===20 ? ' crit' : r===1 ? ' crit-bad' : '');
    let v;
    if(r===20){
      v = '自然20 —— 大成功！海神在微笑';
      fxFlash.classList.remove('go'); void fxFlash.offsetWidth; fxFlash.classList.add('go');
    }else if(r===1){
      v = '自然1 —— 大失败…愿海神怜悯';
      document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
    }else{
      const LADDER = [[22,'传奇'],[19,'极难'],[16,'困难'],[13,'普通'],[10,'简单']];
      const hit = LADDER.find(x=> r>=x[0]);
      v = hit ? `可成事于「${hit[1]}（DV ${hit[0]}）」` : '连最简单的缆结也没系上';
    }
    rollVerdict.textContent = v;
    HIST.unshift(r); if(HIST.length > 7) HIST.pop();
    rollHist.textContent = '最近掷骰：' + HIST.join(' · ');
    diceBtn.classList.remove('rolling');
    rollHide = setTimeout(()=> rollPop.classList.remove('show'), 9000);
  }, 740);
};

diceBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); diceBtn.onclick(); }});
if(location.hash === '#d20') setTimeout(()=> diceBtn.onclick(), 500);

/* ---------- 风味：航海更次（一昼夜六段） ---------- */
const WATCHES = [
  [3,'晨更 · Morning Watch','东方泛白，新的一天从淡水与硬饼开始。'],
  [7,'午前更 · Forenoon Watch','日头爬高，甲板晒出盐霜的味道。'],
  [11,'午后更 · Afternoon Watch','最困倦的时辰，故事与谣言在甲板流传。'],
  [15,'黄昏更 · Dog Watch','落日把帆染成金色——也许只是火烧云。'],
  [19,'头更 · First Watch','夜色接管海面，值更的水手裹紧外套。'],
  [23,'中更 · Middle Watch','半船人睡着，海浪替他们数更。'],
];
function renderWatch(){
  const h = new Date().getHours();
  let w = WATCHES[WATCHES.length-1];
  for(const x of WATCHES){ if(h >= x[0]) w = x; }
  const end = String((w[0]+4)%24).padStart(2,'0');
  $('#watchBar').innerHTML = `<div class="wt">✦ ${w[1]}（${String(w[0]).padStart(2,'0')}:00–${end}:00）</div><div class="wtxt">${w[2]}</div>`;
}
renderWatch(); setInterval(renderWatch, 60000);

/* ---------- 风味：搜索框提示轮换 ---------- */
const HINTS = ['潮汐点','接舷','坏血病','私掠许可证','哗变','克拉肯','航段','声望'];
let hintI = 0;
setInterval(()=>{ $('#searchBox').placeholder = '搜索规则全文…（如：' + HINTS[hintI++ % HINTS.length] + '）'; }, 4000);

/* ---------- 风味：航行进度 / 罗盘 / 回桅顶（统一滚动处理） ---------- */
const brandSvg = document.querySelector('.brand svg');
const vLine = $('#vLine'), vBoat = $('#vBoat'), topBtn = $('#topBtn');
let scrollTick = false;
function onScroll(){
  const st = window.scrollY;
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, st / max) : 0;
  vLine.style.width = (p * 100) + '%';
  vBoat.style.left = 'calc(' + (p * 100) + '%)';
  topBtn.classList.toggle('show', st > 600);
  brandSvg.style.transform = 'rotate(' + (st * 0.03 % 360) + 'deg)';
}
window.addEventListener('scroll', ()=>{
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(()=>{ onScroll(); scrollTick = false; });
}, {passive:true});
topBtn.onclick = ()=> window.scrollTo({top:0, behavior:'smooth'});
onScroll();

/* ---------- 滚动浮现（章节元素进入视口一次性淡入） ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rvIO = (!REDUCED && 'IntersectionObserver' in window)
  ? new IntersectionObserver(es=>es.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add('on'); rvIO.unobserve(en.target); }
    }), {threshold:.06, rootMargin:'0px 0px -4% 0px'})
  : null;
function reveal(root){
  if(!rvIO || !root) return;
  root.querySelectorAll('h2,h3,blockquote,.tbl').forEach(el=>{
    el.classList.add('rv');
    rvIO.observe(el);
  });
}

/* ---------- 键盘：←/→ 翻章，Esc 收起 ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')){
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if(e.key === 'Escape'){
    glossHide(); rollPop.classList.remove('show');
    document.body.classList.remove('side-open');
  }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const h = location.hash.replace('#','');
    let i = h.startsWith('ch') ? DATA.findIndex(c=>c.num === h.slice(2)) : -1;
    i = e.key === 'ArrowRight' ? i + 1 : i - 1;
    if(i < -1) i = -1;
    if(i >= DATA.length) i = DATA.length - 1;
    location.hash = i < 0 ? '#cover' : 'ch' + DATA[i].num;
  }
});

/* ---------- Wiki 术语悬浮索引 ---------- */
const GLOSS = JSON.parse(document.getElementById('gloss-data').textContent);
const GLOSS_KEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GLOSS_RX = GLOSS_KEYS.length
  ? new RegExp('(' + GLOSS_KEYS.map(k=>k.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')).join('|') + ')','g')
  : null;
const glossPop = document.createElement('div');
glossPop.className = 'gloss-pop';
document.body.appendChild(glossPop);
let glossEnterT = null, glossHideT = null, glossCur = null;

function glossShow(term, el){
  const g = GLOSS[term]; if(!g) return;
  glossPop.innerHTML = `<div class="gt">${term}</div><div class="gd">${g}</div>`;
  glossPop.style.visibility = 'hidden';
  glossPop.classList.add('show');
  const r = el.getBoundingClientRect(), vw = innerWidth, pw = glossPop.offsetWidth;
  let x = Math.max(10, Math.min(r.left + r.width/2 - pw/2, vw - pw - 10));
  let y = r.top - glossPop.offsetHeight - 10;
  if(y < 66) y = r.bottom + 10;
  glossPop.style.left = x + 'px';
  glossPop.style.top = y + 'px';
  glossPop.style.visibility = '';
  glossCur = term;
}
function glossHide(){ glossPop.classList.remove('show'); glossCur = null; }

/* 把章节正文里的术语包成 .wiki 标记；同一章内每个术语只标首次出现 */
function wikify(root){
  if(!GLOSS_RX || !root) return;
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentElement;
      return (p && !p.closest('code,pre,.wiki,h1,h2,h3,h4,button,label')) ? NodeFilter.ACCEPT : NodeFilter.REJECT;
    }
  });
  const texts = [];
  while(walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(node=>{
    const t = node.nodeValue;
    GLOSS_RX.lastIndex = 0;
    if(!GLOSS_RX.test(t)) return;
    GLOSS_RX.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m, changed = false;
    while((m = GLOSS_RX.exec(t))){
      const term = m[0];
      if(seen.has(term)) continue;
      seen.add(term); changed = true;
      if(m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const s = document.createElement('span');
      s.className = 'wiki'; s.dataset.term = term; s.textContent = term;
      frag.appendChild(s);
      last = m.index + term.length;
    }
    if(changed){
      if(last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  });
}

/* 悬停约0.35秒弹出释义；移开稍候关闭；弹窗自身可悬停；点击立即开合（触屏友好） */
document.addEventListener('mouseover', e=>{
  const w = e.target.closest('.wiki');
  if(!w) return;
  clearTimeout(glossHideT); clearTimeout(glossEnterT);
  if(glossCur !== w.dataset.term) glossEnterT = setTimeout(()=> glossShow(w.dataset.term, w), 350);
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest('.wiki')){
    clearTimeout(glossEnterT);
    glossHideT = setTimeout(glossHide, 220);
  }
});
glossPop.addEventListener('mouseenter', ()=> clearTimeout(glossHideT));
glossPop.addEventListener('mouseleave', ()=>{ glossHideT = setTimeout(glossHide, 220); });
document.addEventListener('click', e=>{
  const w = e.target.closest('.wiki');
  if(w){ clearTimeout(glossEnterT); clearTimeout(glossHideT); glossShow(w.dataset.term, w); return; }
  if(!e.target.closest('.gloss-pop')) glossHide();
});
addEventListener('scroll', glossHide, {passive:true});
addEventListener('resize', glossHide);

buildToc(); navigate();
</script>
