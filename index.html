／铁匠／缝纫／制药 检定 DV13；工时 = 表价÷5 天 成品标\"粗制\"：效果 −1 档，且 GM 可为它安排一次断裂 就地取材 生存／博物学 DV13 找到料，再走自制 找到什么由 GM 决定（8.6） 拆东墙 从本船某处拆 被拆的部位立刻生效一次损伤（砍索、失锚、拆板补帆） 【设计注】 \"拆东墙\"是航海恐怖最便宜的发生器。 让玩家明确说出他们要拆掉什么 ——这句话本身就是这一幕的戏。 6.12 三十秒速查 1 银币 ≈ 5.5 克纯银；1 金币 = 10 银币 ≈ 1 达克特；1 英镑 = 20 银币 = 2 金币 起始身家 20 银币（4.7）；一人一昼夜口粮 1 银币；一件胸甲 30 银币；一柄佩剑 7 银币；一发 6 磅实心弹 0.7 银币，一次发射药 ≈ 炮磅数银币 水手 19 银币/月；木匠 52；船长 73–175； 欠饷一月＝士气 −5 且哗变骰 +2 护甲同时给防御与减伤；钝击减半；胸甲 3； 没人穿着全甲上桅 舱位不称重；1 舱位＝1 类货｜2 段补给｜1 份备料；载人每 2 人 1 舱位 帆与桅是钱： 成套帆 226 金币，大桅 260 金币起 ；旧索三百年涨了两倍半 仪器价格是设计值 [缺] ，可用\"日薪×工时\"自造，且那样会让仪器变成港口的性格 船买不起 ：二手小艇级 100 金币、快船 1,000、盖伦 9,000 → 船只能被赏、被判、被缴、被凑股、被偷（6.9） 有了东西，接下来得把它开出去。第七章的船在等你。"},{"num":"07","title":"航海与船只","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>开船的人以为船是工具；老水手知道，船是脾气最大的同伴。<\/em><\/blockquote>\n<p>航海不是两次冒险之间的过场——<strong>航行本身就是冒险<\/strong>。本章给出船只的全部数值、每四小时一次的航行结算、以及让水手们又爱又怕的风、病与哗变。<\/p>\n<p>规则尺度回顾（详见3.6节）：<strong>1航段=4小时，一昼夜6段<\/strong>；短程沿海航程可按\"旅程\"整段打包处理（7.3节末尾），只有真正的远海航行才逐段结算。<\/p>\n<hr>\n<h2>7.1 船只数据卡<\/h2>\n<p>每艘船用一张记录卡（附录B）管理，包含八项：<\/p>\n<div class='tbl'><table><thead><tr><th>属性<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><strong>船体值（Hull）<\/strong><\/td><td>船的结构完整度。炮击、搁浅、风暴、冰礁都会扣它。<strong>归零＝失控或沉没危机<\/strong>——从这一刻起，面临死亡的不是船，是所有人（见7.9沉没规程）。<\/td><\/tr><tr><td><strong>帆况<\/strong><\/td><td>完好 / 破洞 / 半帆 / 失帆，四档，决定航速上限（见7.4）。<\/td><\/tr><tr><td><strong>炮位<\/strong><\/td><td>可搭载的火炮数量与炮型（第6章火炮表；海战流程见第9章）。<\/td><\/tr><tr><td><strong>货舱<\/strong><\/td><td>以\"舱位\"计：每舱位可装1类商品、或2段补给、或1份备料。载重影响吃水。<\/td><\/tr><tr><td><strong>吃水<\/strong><\/td><td>浅 / 中 / 深。决定能进的水域：浅水可走礁区河口，深水船进入浅滩必须进行吃水检定。<\/td><\/tr><tr><td><strong>船员<\/strong><\/td><td>最低人数（低于它，所有航海检定劣势，无法齐射）与编制人数。<\/td><\/tr><tr><td><strong>士气<\/strong><\/td><td>全船水手的集体状态，0–20（见7.7）。<\/td><\/tr><tr><td><strong>特性<\/strong><\/td><td>每船1条特性，写进船卡。特性是船的身份——换船如换人生。<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注】<\/strong> 船体值与HP刻意不同源：炮击风暴优先砸船不砸人，甲板上的人才用HP规则。这让\"保船还是保人\"成为真实抉择。<\/blockquote>\n<h2>7.2 船型表<\/h2>\n<p>七种常见船型。数值为标准配置，GM可按剧情微调。<\/p>\n<div class='tbl'><table><thead><tr><th>船型<\/th><th>船体<\/th><th>炮位<\/th><th>货舱<\/th><th>吃水<\/th><th>最低/编制<\/th><th>航速档<\/th><th>标准特性<\/th><\/tr><\/thead><tbody><tr><td><strong>单桅快船<\/strong><\/td><td>14<\/td><td>4（轻炮）<\/td><td>3<\/td><td>浅<\/td><td>6/12<\/td><td>快<\/td><td>浅水之子：礁区河口航行检定劣势移除<\/td><\/tr><tr><td><strong>双桅横帆船<\/strong><\/td><td>18<\/td><td>8（轻中炮）<\/td><td>6<\/td><td>浅<\/td><td>10/20<\/td><td>中快<\/td><td>顺风好手：顺风航速再+10%<\/td><\/tr><tr><td><strong>卡拉维尔帆船<\/strong><\/td><td>16<\/td><td>6（轻炮）<\/td><td>5<\/td><td>浅<\/td><td>8/16<\/td><td>快<\/td><td>逆风可行：抢风航法疲劳惩罚减半<\/td><\/tr><tr><td><strong>盖伦帆船<\/strong><\/td><td>26<\/td><td>16（中炮）<\/td><td>10<\/td><td>深<\/td><td>18/35<\/td><td>中<\/td><td>高舷：接舷战防御+2<\/td><\/tr><tr><td><strong>护卫舰<\/strong><\/td><td>32<\/td><td>28（制式炮）<\/td><td>4<\/td><td>深<\/td><td>24/60<\/td><td>中快<\/td><td>炮位精良：齐射检定+2<\/td><\/tr><tr><td><strong>东印度商船<\/strong><\/td><td>30<\/td><td>12（轻中炮）<\/td><td>18<\/td><td>深<\/td><td>20/40<\/td><td>慢<\/td><td>厚重：首次被击穿的水线伤害减半<\/td><\/tr><tr><td><strong>海盗快船<\/strong><\/td><td>16<\/td><td>12（混装炮）<\/td><td>2<\/td><td>浅<\/td><td>12/24<\/td><td>快<\/td><td>突袭:先登船的接舷检定+2<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>航速档<\/strong>（基准海里/航段，顺风）：慢4 / 中6 / 快8 / 中快9 / 极快10。最终航速 = 档位 × 帆况 × 风况（7.4、7.5节）。<\/p>\n<blockquote class='quote'><strong>【示例】<\/strong> 海燕号：单桅快船——船体14、4门4磅炮、3舱、浅水、6/12人、快档（8里/段）、特性\"浅水之子\"、士气12。它在顺风和风下每段跑8里。<\/blockquote>\n<h2>7.3 航行轮<\/h2>\n<p>远海航行时，<strong>每个航段（4小时）结算一次<\/strong>，六步：<\/p>\n<ol class='mdlist'><li><strong>排岗<\/strong>：玩家分派本段战位——掌舵、操帆、瞭望、船医、抽水/杂务。空缺的战位按无受训处理。<\/li><li><strong>气象判定<\/strong>：瞭望或气象技能（DV12，坏天气劣势）。成功预判下段海况，全船获得1轮准备（下段首个航海检定优势）。<\/li><li><strong>航行检定<\/strong>：掌舵（DV见海况表7.5）。失败按\"失败铁律\"落地：偏航、帆受损、或士气-1。<\/li><li><strong>补给结算<\/strong>：每人每昼夜消耗2份食物、4升水（第6章）。缺水缺粮立即影响士气（7.7）。<\/li><li><strong>事件掷骰<\/strong>：GM按海域掷遭遇表（第13章）——平静的海域也有平淡的遭遇。<\/li><li><strong>记录<\/strong>：更新航向、海里数、船体、帆况、士气、海图（第8章海图揭示）。<\/li><\/ol>\n<p><strong>旅程打包<\/strong>：≤3个航段、沿已知海岸线、且无人主动搞事的航程，可以不逐段掷——总航程=航速×段数，GM掷一次事件骰即可。打包是奖励规划，不是权利：玩家一旦宣布\"我要试着猎一艘商船\"，立刻回到逐段结算。<\/p>\n<h2>7.4 风与帆<\/h2>\n<h3>风向<\/h3>\n<p>以船的目的航向为基准，风向分五档：<\/p>\n<div class='tbl'><table><thead><tr><th>风向<\/th><th>航速倍率<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>顺风<\/td><td>×1.25<\/td><td>帆满，水手心情也好（本段士气检定+1）<\/td><\/tr><tr><td>侧顺风<\/td><td>×1.1<\/td><td>—<\/td><\/tr><tr><td>侧风<\/td><td>×1.0<\/td><td>标准航行<\/td><\/tr><tr><td>侧逆风<\/td><td>×0.75<\/td><td>需要收部分帆<\/td><\/tr><tr><td>逆风<\/td><td>×0.5，或抢风<\/td><td>见下<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>风向变化<\/strong>：每个航段结束掷d6——1–3不变，4–5偏转一档（GM定左右），6风向大变（偏转两档或进入无风，GM定）。<\/p>\n<h3>帆况档<\/h3>\n<div class='tbl'><table><thead><tr><th>帆况<\/th><th>航速上限<\/th><th>修回<\/th><\/tr><\/thead><tbody><tr><td>完好<\/td><td>全速<\/td><td>—<\/td><\/tr><tr><td>破洞<\/td><td>-1档<\/td><td>海上缝补（缝纫/木工 DV13，1段）<\/td><\/tr><tr><td>半帆<\/td><td>-2档<\/td><td>需要2段与备料<\/td><\/tr><tr><td>失帆<\/td><td>只能漂流<\/td><td>需靠港或2天抢修（木工 DV16）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>抢风航法<\/h3>\n<p>逆风不是绝路，是数学：\"之\"字走位，每段两次转向。<strong>抢风<\/strong>时：航程按逆风倍率×0.5计算，且掌舵每段必须成功（DV14，失败一次偏航1d6海里、成功则正常）；连续抢风3段，值勤者疲劳+1。卡拉维尔帆船特性使此惩罚减半。<\/p>\n<h2>7.5 海况表<\/h2>\n<p>每个航段掷一次d20（或GM按剧情直接宣告）：<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>海况<\/th><th>航速<\/th><th>航行检定<\/th><th>其他<\/th><\/tr><\/thead><tbody><tr><td>1–2<\/td><td><strong>无风<\/strong><\/td><td>×0.25<\/td><td>DV10<\/td><td>漂着。士气每2段-1；帆手无事可做，是流言高发期<\/td><\/tr><tr><td>3–6<\/td><td><strong>微风<\/strong><\/td><td>×0.75<\/td><td>DV11<\/td><td>—<\/td><\/tr><tr><td>7–14<\/td><td><strong>和风<\/strong><\/td><td>×1.0<\/td><td>DV13<\/td><td>标准航行<\/td><\/tr><tr><td>15–17<\/td><td><strong>劲风<\/strong><\/td><td>×1.15<\/td><td>DV15<\/td><td>操帆检定劣势；快船如鱼得水<\/td><\/tr><tr><td>18–19<\/td><td><strong>大风<\/strong><\/td><td>×1.1<\/td><td>DV17<\/td><td>每段船体掷d6：≤2则进水或帆况降档<\/td><\/tr><tr><td>20<\/td><td><strong>风暴<\/strong><\/td><td>×0.75<\/td><td>DV20<\/td><td>进入<strong>风暴规程<\/strong>（7.10）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>海况持续时间<\/strong>：除非风向变化掷骰或GM剧情，同一海况延续1d3段。<br><strong>海域修正<\/strong>：热带飓风季、极地浮冰带、恶魔纬度（第12章）由GM在掷骰后调整档位。<\/p>\n<h2>7.6 导航与迷航<\/h2>\n<p><strong>每段掷一次导航检定<\/strong>（领航员；无领航员的船——愿海神保佑你们）：<\/p>\n<div class='tbl'><table><thead><tr><th>条件<\/th><th>DV<\/th><\/tr><\/thead><tbody><tr><td>完整海图 + 能见度好<\/td><td>10<\/td><\/tr><tr><td>有海图<\/td><td>13<\/td><\/tr><tr><td>无图沿岸（凭地标）<\/td><td>16<\/td><\/tr><tr><td>无图远海（纯推算）<\/td><td>19<\/td><\/tr><\/tbody><\/table><\/div>\n<p>修正：暴风/浓雾/无星雨夜均劣势；无六分仪劣势；海图记忆天赋+2；上一段刚失败过+2（慌乱）。<\/p>\n<p><strong>失败后果<\/strong>：偏航 1d6×2 海里，方向由GM从航线两侧随机。偏航本身不致命——致命的是偏航把你们带进的海域。<br><strong>连败2段＝迷航状态<\/strong>：直到下一次导航成功（DV-2，毕竟你们知道大概错在哪）为止，每段继续偏航，且遭遇表掷骰+4（迷航者遇到的总是更多）。<br><strong>成功等级<\/strong>：卓越——顺便修正上一段的偏航，或发现一处海图上没有的地标（第8章发现点）。<\/p>\n<blockquote class='quote'><strong>【示例】<\/strong> 风暴过后的第三个雨夜，洛伦佐连败两次，海燕号进入迷航。第四段他终于掷出17（DV19-2=17），\"我们大概在撒谎纬度以南\"——偏航停止，但 GM 的遭遇骰已经+4，而那片海图空白处画着什么，你们马上就会知道。<\/blockquote>\n<h2>7.7 船员与士气<\/h2>\n<p>士气 0–20，代表全船水手（作为整体）的意愿。<strong>士气是航海游戏的第二血条。<\/strong><\/p>\n<p><strong>起始士气12<\/strong>（接受雇佣的普通船员）。每段结算一次修正：<\/p>\n<div class='tbl'><table><thead><tr><th>事件<\/th><th>士气<\/th><\/tr><\/thead><tbody><tr><td>缺粮<\/td><td>-2<\/td><\/tr><tr><td>缺水<\/td><td>-3<\/td><\/tr><tr><td>配给减半<\/td><td>-1<\/td><\/tr><tr><td>有热食（每昼夜一次）<\/td><td>+1<\/td><\/tr><tr><td>海战胜利 / 接舷得手<\/td><td>+2 / +3<\/td><\/tr><tr><td>船体低于半值<\/td><td>每段-1<\/td><\/tr><tr><td>拖欠分红<\/td><td>-2（每次）<\/td><\/tr><tr><td>船长在场且领导检定成功<\/td><td>+1<\/td><\/tr><tr><td>顺风+无事故的整段航行<\/td><td>+1（每昼夜一次）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>阈值效应<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>15以上<\/strong>：水手们超常发挥——操帆、炮组检定+1。<\/li><li><strong>8以下<\/strong>：怨声载道——每昼夜掷d20，≤5则随机1人疲劳+1。<\/li><li><strong>5以下（哗变水域）<\/strong>：<strong>每个航段掷哗变骰：d20 ≤ (6−士气) 即哗变<\/strong>。拖欠分红、上一次哗变被血腥镇压、或GM的剧情，都可以给这个骰子+1~+3。冷酷船长天赋个人威慑-3。<\/li><\/ul>\n<p><strong>哗变不是一句\"哗变了\"<\/strong>，是一幕：GM宣布带头人（往往是那个总是唱歌的少年），然后玩家的选择——<\/p>\n<ul class='mdlist'><li><strong>谈判<\/strong>（人望对抗带头者）：说服延迟哗变，士气+3并解除本段风险，但答应的条件要兑现；<\/li><li><strong>镇压<\/strong>（威吓对抗，冷酷船长+3）：立刻压下，士气归2，带头者\"消失\"——船员记恨（此后每次士气检定-1，直到回港）；<\/li><li><strong>分账<\/strong>：当场补发拖欠、或允诺战利品加成，花银子买回士气（每10银币+1，至+3）。<\/li><\/ul>\n<p>哗变中站在玩家一边的水手数 = 士气值。剩下的，站在另一边。<\/p>\n<p><strong>招募与损失<\/strong>：死伤在港口补给时补足——普通水手10银币/人（预付首月），声望高的船长招到的人士气+2起点。放小艇、留孤岛、跳船失踪，都算损失，都有传闻（第10章声望）。<\/p>\n<h2>7.8 疲劳与疾病<\/h2>\n<h3>疲劳（1–3级）<\/h3>\n<p>值勤超过4段、连续熬夜、抢风3段——疲劳+1。<strong>1级<\/strong>：所有检定劣势；<strong>2级<\/strong>：劣势且HP/潮汐点不再自然恢复；<strong>3级<\/strong>：强制昏睡1段。短休1段-1级，长休清零（疾病造成的除外）。<\/p>\n<h3>疾病三则<\/h3>\n<p>长期航行中，<strong>每5天掷一次全船健康骰（d20）<\/strong>，≤5则触发一次疾病事件（GM从下表选或掷d6）。船医在场时健康骰+船医等级。<\/p>\n<div class='tbl'><table><thead><tr><th>疾病<\/th><th>触发<\/th><th>病程<\/th><th>解法<\/th><\/tr><\/thead><tbody><tr><td><strong>坏血病<\/strong><\/td><td>无新鲜食物累计10天后开始，每日累积1点坏血计数，≥5发病<\/td><td>HP上限-4、疲劳+1、旧伤复活；继续恶化则计数再+1<\/td><td>柑橘、酸菜、任何新鲜果蔬——<strong>即愈<\/strong>；医术DV16每日稳定可延缓<\/td><\/tr><tr><td><strong>热病<\/strong><\/td><td>热带海域事件后掷d20 vs 13<\/td><td>潜伏1d3天后高热卧床2d4天<\/td><td>医术照护使卧床减半；海水浴与柳树皮偏方（GM裁决）<\/td><\/tr><tr><td><strong>痢疾<\/strong><\/td><td>饮用变质水后 vs 15<\/td><td>急性：1d4天内无法值勤，士气-2<\/td><td>换净水+医术DV14；烧水的习惯价值千金<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【历史注】<\/strong> 18世纪英国海军才普及柠檬汁防坏血病。在本作的15–17世纪，\"知道要带柠檬\"本身就是一种罕见的、值钱的学问——船医的博物学技能。<\/blockquote>\n<h2>7.9 维修、进水与沉没<\/h2>\n<h3>维修<\/h3>\n<ul class='mdlist'><li><strong>港内大修<\/strong>：每点船体 <strong>2银币 + 1段<\/strong>工时（快速开始章的口径）。帆况修复同价。<\/li><li><strong>海上应急<\/strong>：木工检定（DV13平静 / DV16恶劣），成功每天修复1d3点，每点消耗1份<strong>备料<\/strong>（舱位装载，第6章）。失败无进展，大失败可能拆东墙补西墙。<\/li><\/ul>\n<h3>进水<\/h3>\n<p>水线被击穿（第9章命中部位）或大风船体损伤触发：<strong>进水状态<\/strong>——每段船体-1，直到止漏。需要每1点进水派1人持续抽水；木工 DV14 止漏（水下作业加倍困难，游泳受训者执行）。<\/p>\n<h3>沉没规程<\/h3>\n<p><strong>船体归零的瞬间<\/strong>，按顺序处理：<\/p>\n<ol class='mdlist'><li>全船立即进入<strong>弃船或抢救<\/strong>抉择（10段倒计时，以段计）；<\/li><li><strong>抢救<\/strong>：木工+全体团队检定（DV16），成功则船体回到1、进水1级、帆况失帆——船活了，但只是半条命；<\/li><li><strong>弃船<\/strong>：小艇容量=编制的三分之一，带不走的人掷胆魄，失败者把生还机会让给别人（或要求别人留下）；物资按舱位减半；<\/li><li>无论哪种结局，这一幕都值得写进航海日志。<\/li><\/ol>\n<h2>7.10 特殊海况事件<\/h2>\n<h3>风暴规程（海况掷出20，或GM宣告）<\/h3>\n<p>风暴不掷一次骰，是一段戏。每段依次三掷：<\/p>\n<ol class='mdlist'><li><strong>掌舵<\/strong>（DV18）：保持船头迎浪。失败——船体横受浪：2d6伤害并偏航2d6海里；<\/li><li><strong>操帆<\/strong>（DV16）：收帆减载。失败——帆况降一档；<\/li><li><strong>船体<\/strong>（d6）：≤2则进水或桅损（GM择一）。<\/li><\/ol>\n<p>连续<strong>两个整段<\/strong>三掷过关即穿出风暴。风暴中导航自动失败、瞭望失效、落水者按第2章溺水规则处理（记得那道潮汐点的\"抓牢船舷\"）。<\/p>\n<h3>浓雾<\/h3>\n<p>视野归零：瞭望战位失效、导航劣势、每段额外掷遭遇骰+2（雾里的东西不请自来）。雾中航行应减速（航速×0.5），否则碰撞风险由GM随时揭晓。<\/p>\n<h3>礁区与搁浅<\/h3>\n<p>进入浅滩/礁区：吃水深的船需<strong>吃水检定<\/strong>（掌舵 DV15，浅水船免）。瞭望成功（DV15）可提前一段预警礁脉；紧急避让=掌舵 DV16（速度越快DV越高）。<br><strong>搁浅<\/strong>：船体2d6伤害，卡死。脱困三选一：卸货减重（每舱位-1DV）、等涨潮（1d3段）、绞盘硬拖（筋骨团队检定DV18，船体再损1d6）。<\/p>\n<h3>冰山与浮冰<\/h3>\n<p>寒带海域的\"礁区\"规则变体，但瞭望DV+3（冰与雾与夜是同伙）。<\/p>\n<h3>无风带<\/h3>\n<p>连续掷出无风3段以上：帆手开始赌牌、厨子开始讲他 Uncle 的故事、士气每2段-1——直到GM心软，或有人提议唱歌（表演成功，士气+1，一天一次）。<\/p>\n<h3>海龙卷<\/h3>\n<p>极小概率、极大戏剧。GM直接按风暴规程处理，附加：被龙卷命中的船（掌舵 DV20 否则）一次性船体4d6。没有人应该追逐它，但总有人会。<\/p>\n<hr>\n<p><em>船稳住了。接下来是把船开进战斗——第9章。<\/em><\/p>","text":"开船的人以为船是工具；老水手知道，船是脾气最大的同伴。 航海不是两次冒险之间的过场—— 航行本身就是冒险 。本章给出船只的全部数值、每四小时一次的航行结算、以及让水手们又爱又怕的风、病与哗变。 规则尺度回顾（详见3.6节）： 1航段=4小时，一昼夜6段 ；短程沿海航程可按\"旅程\"整段打包处理（7.3节末尾），只有真正的远海航行才逐段结算。 7.1 船只数据卡 每艘船用一张记录卡（附录B）管理，包含八项： 属性 说明 船体值（Hull） 船的结构完整度。炮击、搁浅、风暴、冰礁都会扣它。 归零＝失控或沉没危机 ——从这一刻起，面临死亡的不是船，是所有人（见7.9沉没规程）。 帆况 完好 / 破洞 / 半帆 / 失帆，四档，决定航速上限（见7.4）。 炮位 可搭载的火炮数量与炮型（第6章火炮表；海战流程见第9章）。 货舱 以\"舱位\"计：每舱位可装1类商品、或2段补给、或1份备料。载重影响吃水。 吃水 浅 / 中 / 深。决定能进的水域：浅水可走礁区河口，深水船进入浅滩必须进行吃水检定。 船员 最低人数（低于它，所有航海检定劣势，无法齐射）与编制人数。 士气 全船水手的集体状态，0–20（见7.7）。 特性 每船1条特性，写进船卡。特性是船的身份——换船如换人生。 【设计注】 船体值与HP刻意不同源：炮击风暴优先砸船不砸人，甲板上的人才用HP规则。这让\"保船还是保人\"成为真实抉择。 7.2 船型表 七种常见船型。数值为标准配置，GM可按剧情微调。 船型 船体 炮位 货舱 吃水 最低/编制 航速档 标准特性 单桅快船 14 4（轻炮） 3 浅 6/12 快 浅水之子：礁区河口航行检定劣势移除 双桅横帆船 18 8（轻中炮） 6 浅 10/20 中快 顺风好手：顺风航速再+10% 卡拉维尔帆船 16 6（轻炮） 5 浅 8/16 快 逆风可行：抢风航法疲劳惩罚减半 盖伦帆船 26 16（中炮） 10 深 18/35 中 高舷：接舷战防御+2 护卫舰 32 28（制式炮） 4 深 24/60 中快 炮位精良：齐射检定+2 东印度商船 30 12（轻中炮） 18 深 20/40 慢 厚重：首次被击穿的水线伤害减半 海盗快船 16 12（混装炮） 2 浅 12/24 快 突袭:先登船的接舷检定+2 航速档 （基准海里/航段，顺风）：慢4 / 中6 / 快8 / 中快9 / 极快10。最终航速 = 档位 × 帆况 × 风况（7.4、7.5节）。 【示例】 海燕号：单桅快船——船体14、4门4磅炮、3舱、浅水、6/12人、快档（8里/段）、特性\"浅水之子\"、士气12。它在顺风和风下每段跑8里。 7.3 航行轮 远海航行时， 每个航段（4小时）结算一次 ，六步： 排岗 ：玩家分派本段战位——掌舵、操帆、瞭望、船医、抽水/杂务。空缺的战位按无受训处理。 气象判定 ：瞭望或气象技能（DV12，坏天气劣势）。成功预判下段海况，全船获得1轮准备（下段首个航海检定优势）。 航行检定 ：掌舵（DV见海况表7.5）。失败按\"失败铁律\"落地：偏航、帆受损、或士气-1。 补给结算 ：每人每昼夜消耗2份食物、4升水（第6章）。缺水缺粮立即影响士气（7.7）。 事件掷骰 ：GM按海域掷遭遇表（第13章）——平静的海域也有平淡的遭遇。 记录 ：更新航向、海里数、船体、帆况、士气、海图（第8章海图揭示）。 旅程打包 ：≤3个航段、沿已知海岸线、且无人主动搞事的航程，可以不逐段掷——总航程=航速×段数，GM掷一次事件骰即可。打包是奖励规划，不是权利：玩家一旦宣布\"我要试着猎一艘商船\"，立刻回到逐段结算。 7.4 风与帆 风向 以船的目的航向为基准，风向分五档： 风向 航速倍率 备注 顺风 ×1.25 帆满，水手心情也好（本段士气检定+1） 侧顺风 ×1.1 — 侧风 ×1.0 标准航行 侧逆风 ×0.75 需要收部分帆 逆风 ×0.5，或抢风 见下 风向变化 ：每个航段结束掷d6——1–3不变，4–5偏转一档（GM定左右），6风向大变（偏转两档或进入无风，GM定）。 帆况档 帆况 航速上限 修回 完好 全速 — 破洞 -1档 海上缝补（缝纫/木工 DV13，1段） 半帆 -2档 需要2段与备料 失帆 只能漂流 需靠港或2天抢修（木工 DV16） 抢风航法 逆风不是绝路，是数学：\"之\"字走位，每段两次转向。 抢风 时：航程按逆风倍率×0.5计算，且掌舵每段必须成功（DV14，失败一次偏航1d6海里、成功则正常）；连续抢风3段，值勤者疲劳+1。卡拉维尔帆船特性使此惩罚减半。 7.5 海况表 每个航段掷一次d20（或GM按剧情直接宣告）： d20 海况 航速 航行检定 其他 1–2 无风 ×0.25 DV10 漂着。士气每2段-1；帆手无事可做，是流言高发期 3–6 微风 ×0.75 DV11 — 7–14 和风 ×1.0 DV13 标准航行 15–17 劲风 ×1.15 DV15 操帆检定劣势；快船如鱼得水 18–19 大风 ×1.1 DV17 每段船体掷d6：≤2则进水或帆况降档 20 风暴 ×0.75 DV20 进入 风暴规程 （7.10） 海况持续时间 ：除非风向变化掷骰或GM剧情，同一海况延续1d3段。 海域修正 ：热带飓风季、极地浮冰带、恶魔纬度（第12章）由GM在掷骰后调整档位。 7.6 导航与迷航 每段掷一次导航检定 （领航员；无领航员的船——愿海神保佑你们）： 条件 DV 完整海图 + 能见度好 10 有海图 13 无图沿岸（凭地标） 16 无图远海（纯推算） 19 修正：暴风/浓雾/无星雨夜均劣势；无六分仪劣势；海图记忆天赋+2；上一段刚失败过+2（慌乱）。 失败后果 ：偏航 1d6×2 海里，方向由GM从航线两侧随机。偏航本身不致命——致命的是偏航把你们带进的海域。 连败2段＝迷航状态 ：直到下一次导航成功（DV-2，毕竟你们知道大概错在哪）为止，每段继续偏航，且遭遇表掷骰+4（迷航者遇到的总是更多）。 成功等级 ：卓越——顺便修正上一段的偏航，或发现一处海图上没有的地标（第8章发现点）。 【示例】 风暴过后的第三个雨夜，洛伦佐连败两次，海燕号进入迷航。第四段他终于掷出17（DV19-2=17），\"我们大概在撒谎纬度以南\"——偏航停止，但 GM 的遭遇骰已经+4，而那片海图空白处画着什么，你们马上就会知道。 7.7 船员与士气 士气 0–20，代表全船水手（作为整体）的意愿。 士气是航海游戏的第二血条。 起始士气12 （接受雇佣的普通船员）。每段结算一次修正： 事件 士气 缺粮 -2 缺水 -3 配给减半 -1 有热食（每昼夜一次） +1 海战胜利 / 接舷得手 +2 / +3 船体低于半值 每段-1 拖欠分红 -2（每次） 船长在场且领导检定成功 +1 顺风+无事故的整段航行 +1（每昼夜一次） 阈值效应 ： 15以上 ：水手们超常发挥——操帆、炮组检定+1。 8以下 ：怨声载道——每昼夜掷d20，≤5则随机1人疲劳+1。 5以下（哗变水域） ： 每个航段掷哗变骰：d20 ≤ (6−士气) 即哗变 。拖欠分红、上一次哗变被血腥镇压、或GM的剧情，都可以给这个骰子+1~+3。冷酷船长天赋个人威慑-3。 哗变不是一句\"哗变了\" ，是一幕：GM宣布带头人（往往是那个总是唱歌的少年），然后玩家的选择—— 谈判 （人望对抗带头者）：说服延迟哗变，士气+3并解除本段风险，但答应的条件要兑现； 镇压 （威吓对抗，冷酷船长+3）：立刻压下，士气归2，带头者\"消失\"——船员记恨（此后每次士气检定-1，直到回港）； 分账 ：当场补发拖欠、或允诺战利品加成，花银子买回士气（每10银币+1，至+3）。 哗变中站在玩家一边的水手数 = 士气值。剩下的，站在另一边。 招募与损失 ：死伤在港口补给时补足——普通水手10银币/人（预付首月），声望高的船长招到的人士气+2起点。放小艇、留孤岛、跳船失踪，都算损失，都有传闻（第10章声望）。 7.8 疲劳与疾病 疲劳（1–3级） 值勤超过4段、连续熬夜、抢风3段——疲劳+1。 1级 ：所有检定劣势； 2级 ：劣势且HP/潮汐点不再自然恢复； 3级 ：强制昏睡1段。短休1段-1级，长休清零（疾病造成的除外）。 疾病三则 长期航行中， 每5天掷一次全船健康骰（d20） ，≤5则触发一次疾病事件（GM从下表选或掷d6）。船医在场时健康骰+船医等级。 疾病 触发 病程 解法 坏血病 无新鲜食物累计10天后开始，每日累积1点坏血计数，≥5发病 HP上限-4、疲劳+1、旧伤复活；继续恶化则计数再+1 柑橘、酸菜、任何新鲜果蔬—— 即愈 ；医术DV16每日稳定可延缓 热病 热带海域事件后掷d20 vs 13 潜伏1d3天后高热卧床2d4天 医术照护使卧床减半；海水浴与柳树皮偏方（GM裁决） 痢疾 饮用变质水后 vs 15 急性：1d4天内无法值勤，士气-2 换净水+医术DV14；烧水的习惯价值千金 【历史注】 18世纪英国海军才普及柠檬汁防坏血病。在本作的15–17世纪，\"知道要带柠檬\"本身就是一种罕见的、值钱的学问——船医的博物学技能。 7.9 维修、进水与沉没 维修 港内大修 ：每点船体 2银币 + 1段 工时（快速开始章的口径）。帆况修复同价。 海上应急 ：木工检定（DV13平静 / DV16恶劣），成功每天修复1d3点，每点消耗1份 备料 （舱位装载，第6章）。失败无进展，大失败可能拆东墙补西墙。 进水 水线被击穿（第9章命中部位）或大风船体损伤触发： 进水状态 ——每段船体-1，直到止漏。需要每1点进水派1人持续抽水；木工 DV14 止漏（水下作业加倍困难，游泳受训者执行）。 沉没规程 船体归零的瞬间 ，按顺序处理： 全船立即进入 弃船或抢救 抉择（10段倒计时，以段计）； 抢救 ：木工+全体团队检定（DV16），成功则船体回到1、进水1级、帆况失帆——船活了，但只是半条命； 弃船 ：小艇容量=编制的三分之一，带不走的人掷胆魄，失败者把生还机会让给别人（或要求别人留下）；物资按舱位减半； 无论哪种结局，这一幕都值得写进航海日志。 7.10 特殊海况事件 风暴规程（海况掷出20，或GM宣告） 风暴不掷一次骰，是一段戏。每段依次三掷： 掌舵 （DV18）：保持船头迎浪。失败——船体横受浪：2d6伤害并偏航2d6海里； 操帆 （DV16）：收帆减载。失败——帆况降一档； 船体 （d6）：≤2则进水或桅损（GM择一）。 连续 两个整段 三掷过关即穿出风暴。风暴中导航自动失败、瞭望失效、落水者按第2章溺水规则处理（记得那道潮汐点的\"抓牢船舷\"）。 浓雾 视野归零：瞭望战位失效、导航劣势、每段额外掷遭遇骰+2（雾里的东西不请自来）。雾中航行应减速（航速×0.5），否则碰撞风险由GM随时揭晓。 礁区与搁浅 进入浅滩/礁区：吃水深的船需 吃水检定 （掌舵 DV15，浅水船免）。瞭望成功（DV15）可提前一段预警礁脉；紧急避让=掌舵 DV16（速度越快DV越高）。 搁浅 ：船体2d6伤害，卡死。脱困三选一：卸货减重（每舱位-1DV）、等涨潮（1d3段）、绞盘硬拖（筋骨团队检定DV18，船体再损1d6）。 冰山与浮冰 寒带海域的\"礁区\"规则变体，但瞭望DV+3（冰与雾与夜是同伙）。 无风带 连续掷出无风3段以上：帆手开始赌牌、厨子开始讲他 Uncle 的故事、士气每2段-1——直到GM心软，或有人提议唱歌（表演成功，士气+1，一天一次）。 海龙卷 极小概率、极大戏剧。GM直接按风暴规程处理，附加：被龙卷命中的船（掌舵 DV20 否则）一次性船体4d6。没有人应该追逐它，但总有人会。 船稳住了。接下来是把船开进战斗——第9章。"},{"num":"08","title":"探索与发现","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>海图上的空白不是\"那里什么都没有\"。它的意思是\"那里有东西，而我们还不知道那是什么\"。<\/em><\/blockquote>\n<p>本章管的是<strong>下船之后<\/strong>的一切。第7章把人送到岸，第9章处理打起来怎么办，本章处理剩下的那 90% 时间：<strong>找水、辨路、遇见人、以及决定要不要走进那座庙。<\/strong><\/p>\n<p><strong>本章三立场<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>探索必须有收益。<\/strong> 每张发现表至少 <strong>30%<\/strong> 的条目是纯收益（知识／海图／贸易品／传说线索）。玩家花了班次就该拿到东西，哪怕是\"确认了这里没有\"。<\/li><li><strong>\"空结果\"也是结果。<\/strong> 明写\"你确认这片林子没有淡水\"——<strong>排除法本身就是信息<\/strong>，而信息在本作里可以卖（8.7、10.1）。<\/li><li><strong>海图是道具，不是界面。<\/strong> 玩家画在纸上的东西才是他们知道的。GM 不替他们记。<\/li><\/ul>\n<hr>\n<h2>8.1 海图揭示<\/h2>\n<h3>战役地图的结构<\/h3>\n<p>用<strong>点阵海图（point-crawl）<\/strong>：一片海域由<strong>锚点<\/strong>（node）连成，锚点之间由<strong>航线<\/strong>相连。<\/p>\n<ul class='mdlist'><li>默认每片海域 <strong>6–10 个锚点<\/strong>：港口、锚地、礁群、河口、岛、深水湾、以及\"某处\"。<\/li><li><strong>一个锚点 = 一次可以停下来的地方。<\/strong> 不是六角格，不占面积。<\/li><li><strong>航线是有属性的<\/strong>：距离（航段数）、风向适配（7.4）、危险等级、以及<strong>谁在看着它<\/strong>。<\/li><\/ul>\n<blockquote class='quote'><strong>为什么用点阵而不是方格<\/strong>：方格会把探索变成涂色，点阵会把探索变成<strong>选择走哪条线<\/strong>。本作的核心循环里，\"线\"永远比\"格\"重要（13.3 画线的时刻）。<\/blockquote>\n<h3>遮蔽与揭示<\/h3>\n<div class='tbl'><table><thead><tr><th>状态<\/th><th>表达<\/th><\/tr><\/thead><tbody><tr><td><strong>未知<\/strong><\/td><td>图上没有这个点。GM 不说它在不在<\/td><\/tr><tr><td><strong>传闻<\/strong><\/td><td>玩家自己标一个圈，写传闻原话。<strong>传闻可能是假的<\/strong>（10.3 传闻表）<\/td><\/tr><tr><td><strong>目击<\/strong><\/td><td>船到目视距离后<strong>必须绘制<\/strong>（海图绘制检定，5.2）才算真<\/td><\/tr><tr><td><strong>测绘<\/strong><\/td><td>一次成功的海图绘制（≥困难档）——含水深、底质、进出航道<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>揭示规则<\/strong>：进入一个锚点的目视范围，该锚点及其<strong>相邻 1–2 个<\/strong>锚点的轮廓显现。<strong>再远必须自己去找<\/strong>——没有\"开地图\"这回事。<\/p>\n<h3>三层可读的海<\/h3>\n<p>同一个锚点，三层信息各自独立揭示：<\/p>\n<div class='tbl'><table><thead><tr><th>层<\/th><th>怎么知道<\/th><th>谁能知道<\/th><\/tr><\/thead><tbody><tr><td><strong>海面<\/strong><\/td><td>到即可见<\/td><td>瞭望位<\/td><\/tr><tr><td><strong>岸上<\/strong><\/td><td>必须登陆并走进去（8.2）<\/td><td>分遣队<\/td><\/tr><tr><td><strong>水下<\/strong><\/td><td>必须<strong>潜、泅、或捞<\/strong>（游泳 5.2；退潮窗口）<\/td><td>极少数人，且会死<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>【设计注】<\/strong> 这一层是海图版的\"多入口\"设计：同一座岛，从海面看是礁，从岸上看是林子，从水下看是一堆沉船。<strong>三条通路各自通向不同的秘密，且没有任何一条是\"正门\"。<\/strong><\/blockquote>\n<hr>\n<h2>8.2 探索流程<\/h2>\n<h3>一次登陆的六步<\/h3>\n<ol class='mdlist'><li><strong>选登陆点<\/strong>（掌舵＋瞭望；礁区见 7.10，DV15）<\/li><li><strong>扎营<\/strong>（0.5 班次；选址需生存 DV13——选错则夜里出一次事）<\/li><li><strong>分队<\/strong>（每队 2–3 人；分得越细越容易出事，但覆盖越广——<strong>这是本章唯一的通用权衡<\/strong>）<\/li><li><strong>走一个\"探索段\"<\/strong>（= 1 班次 ≈ 4 小时，可行走距离约 2–4 公里）<\/li><li><strong>掷发现表<\/strong>（8.3，每探索段一次）<\/li><li><strong>勘定水源与水位<\/strong>（博物学／生存 DV13）——<strong>这一步决定你们还能不能再来一次<\/strong><\/li><\/ol>\n<h3>探索段的两条硬约束<\/h3>\n<ul class='mdlist'><li><strong>退潮<\/strong>：任何登陆都有<strong>返回窗口<\/strong>。GM 报出钟点，玩家自己算。错过窗口 = 小艇留下、队伍上陆（8.6），或者直接失去小艇（弃子，9.7）。<\/li><li><strong>夜不离船<\/strong>：夜间探索需生存 DV16，且发现表结果向\"危险\"偏一档。<strong>老水手不上夜山，这不是迷信，是账。<\/strong><\/li><\/ul>\n<h3>补给与水的实际结算<\/h3>\n<div class='tbl'><table><thead><tr><th>项<\/th><th>每探索段消耗<\/th><\/tr><\/thead><tbody><tr><td>食物<\/td><td>0.5 份／人<\/td><\/tr><tr><td>淡水<\/td><td><strong>1.5 升／人<\/strong>（比船上多，因为在走）<\/td><\/tr><tr><td>小艇运力<\/td><td>每艘小艇 <strong>4 人 ＋ 2 舱位物资<\/strong>（6.8）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>断水的队伍在第三个探索段后开始掷体质。<strong>这一段不需要发现表<\/strong>——它自己就是发现。<\/blockquote>\n<hr>\n<h2>8.3 随机发现表<\/h2>\n<p><strong>用法<\/strong>：每探索段按所在地形掷一张，<strong>d20 一次<\/strong>。<br><strong>标记<\/strong>：◆纯收益 ◇危险／代价 ○信息或线索 □排除法结果（\"这里没有\"）<br><strong>每张表 ◆ 不少于 6 条<\/strong>——这是设计约束，不是运气。<\/p>\n<h3>A · 丛林与雨林<\/h3>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>◇ <strong>沼泽陷落<\/strong>：一人陷至胸，需筋骨 DV14 拉出，否则每轮 −1 HP；此地蚊虫 ×3<\/td><\/tr><tr><td>2<\/td><td>○ <strong>旧路<\/strong>：一条被藤蔓吃掉的道。走它能快一倍，但<strong>有人修过它<\/strong><\/td><\/tr><tr><td>3<\/td><td>□ <strong>无淡水<\/strong>。确认了。这是本段唯一的收获<\/td><\/tr><tr><td>4<\/td><td>◇ <strong>毒虫群<\/strong>（DV14 闪避，失败中毒：筋骨 DV13 否则 1d3 天卧床）<\/td><\/tr><tr><td>5<\/td><td>◆ <strong>可食根茎与果<\/strong>：全组补给 +1 段；博物学可判定安全（DV12）<\/td><\/tr><tr><td>6<\/td><td>○ <strong>炊烟味<\/strong>（顺风）。有人在两公里内<\/td><\/tr><tr><td>7<\/td><td>◇ <strong>豹／美洲虎<\/strong>：一次突袭（先攻自动归它）；不打照面<\/td><\/tr><tr><td>8<\/td><td>◆ <strong>一处优质锚地<\/strong>（从陆上看下去才看得见）——<strong>海图直接升为\"测绘\"<\/strong><\/td><\/tr><tr><td>9<\/td><td>○ <strong>树上的刻痕<\/strong>：本族、西语、还是荷兰语？（史学 DV13）<\/td><\/tr><tr><td>10<\/td><td>□ 走到山顶，看见了三座岛的轮廓。<strong>海图新增三个\"传闻\"锚点<\/strong><\/td><\/tr><tr><td>11<\/td><td>◆ <strong>药草坡<\/strong>：制药／博物学采样，市场价值 60–200 银币（8.7）<\/td><\/tr><tr><td>12<\/td><td>◇ <strong>腐尸与苍蝇<\/strong>：附近有死物。可能是船，可能是人，可能是疫<\/td><\/tr><tr><td>13<\/td><td>◆ <strong>一条能喝的河<\/strong>，且有鱼（渔猎 DV11 得 2 段补给）<\/td><\/tr><tr><td>14<\/td><td>○ <strong>人为砍伐的痕迹<\/strong>：这片林子被管理过——<strong>说明有主权，有主人<\/strong><\/td><\/tr><tr><td>15<\/td><td>◇ <strong>响尾／毒蜥<\/strong>：钝痛与一场高烧（热病判定，7.8）<\/td><\/tr><tr><td>16<\/td><td>◆ <strong>废弃的哨站<\/strong>，内有铁器、半桶焦油、一本被雨泡烂的记录<\/td><\/tr><tr><td>17<\/td><td>○ <strong>一座坟，朝向海上<\/strong>。葬的是水手还是本地人？（史学 DV14）<\/td><\/tr><tr><td>18<\/td><td>◇ <strong>吼声，不止一只<\/strong>。今晚必须回船<\/td><\/tr><tr><td>19<\/td><td>◆ <strong>一片没被画进任何海图的潟湖<\/strong>，里面有条搁浅的船（→ 8.4 沉船）<\/td><\/tr><tr><td>20<\/td><td>◆ <strong>一个人<\/strong>。他看见了你们，你们看见了他。<strong>（→ 8.5，立刻转入接触流程）<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>B · 岛屿<\/h3>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>◇ <strong>海鸟群受惊飞起<\/strong>——这是坏事：下面有东西惊了它们<\/td><\/tr><tr><td>2<\/td><td>□ <strong>岛是空的<\/strong>。真的空。没有泉，没有木，没有荫蔽。记下来，别再来了<\/td><\/tr><tr><td>3<\/td><td>◆ <strong>一泉<\/strong>（淡水充足，够全船）——这是这座岛最值钱的东西<\/td><\/tr><tr><td>4<\/td><td>○ <strong>旧井，石砌<\/strong>。<strong>有人在这住过，而且打算回来<\/strong><\/td><\/tr><tr><td>5<\/td><td>◇ <strong>蛇与蜥<\/strong>：DV13 闪避；咬伤→热病判定<\/td><\/tr><tr><td>6<\/td><td>◆ <strong>龟群或海鸟卵<\/strong>：补给 +1.5 段<\/td><\/tr><tr><td>7<\/td><td>◆ <strong>一处避风水湾<\/strong>，沙底，好锚——<strong>测绘海图，直接可交易<\/strong><\/td><\/tr><tr><td>8<\/td><td>○ <strong>信号火堆的残骸<\/strong>，三层石。烧过很久，也烧过很近<\/td><\/tr><tr><td>9<\/td><td>◇ <strong>塌方带<\/strong>：进入需工程 DV15，否则惊动整面坡<\/td><\/tr><tr><td>10<\/td><td>◆ <strong>淡水＋柴＋可猎<\/strong>：一处天然扎营点。<strong>在本作里这就是战略资产<\/strong><\/td><\/tr><tr><td>11<\/td><td>○ <strong>一面刻石的礁<\/strong>：年代、国别、还是某个人的名字？（史学 DV15）<\/td><\/tr><tr><td>12<\/td><td>◆ <strong>沉船，就在浪线内<\/strong>（→ 8.4 沉船）<\/td><\/tr><tr><td>13<\/td><td>◇ <strong>蟹群与潮沟<\/strong>：无害，但会拖慢你们到日落<\/td><\/tr><tr><td>14<\/td><td>○ <strong>鸟的飞行方向<\/strong>（博物学 DV11）：陆地在哪儿，淡水在哪儿<\/td><\/tr><tr><td>15<\/td><td>◆ <strong>一处天然的沥青渗出<\/strong>（6.9 修船神料，可采 1d3 份）<\/td><\/tr><tr><td>16<\/td><td>◇ <strong>气味<\/strong>。你们离一具尸体不超过三百步<\/td><\/tr><tr><td>17<\/td><td>◆ <strong>一座小珊瑚洞<\/strong>，退潮才可入；里面有人躲过，而且躲了很久<\/td><\/tr><tr><td>18<\/td><td>○ <strong>一只不认人的山羊<\/strong>。它被养过<\/td><\/tr><tr><td>19<\/td><td>◆ <strong>岛的另一侧有一片梯田<\/strong>（驯畜／史学 DV13）——<strong>有人在种地，别踩进田里<\/strong><\/td><\/tr><tr><td>20<\/td><td>◆ <strong>一座活火山口，风把硫味送过来<\/strong>。地热、危险、和一处没人知道的锚地<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>C · 海岸与河口<\/h3>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>◇ <strong>泥岸吃人<\/strong>：负重者下陷；需丢装备或两人协作（筋骨 DV14）<\/td><\/tr><tr><td>2<\/td><td>□ <strong>海岸平直，无一处可泊<\/strong>。记录：这段海不能停<\/td><\/tr><tr><td>3<\/td><td>◆ <strong>河口有淡水<\/strong>，且船能进（吃水检定 DV13）<\/td><\/tr><tr><td>4<\/td><td>○ <strong>沙滩上的船骸线<\/strong>：不止一条船在这撞碎——为什么？<\/td><\/tr><tr><td>5<\/td><td>◇ <strong>蚊与潮热<\/strong>：痢疾与热病的判定窗口（7.8）<\/td><\/tr><tr><td>6<\/td><td>◆ <strong>贝冢<\/strong>：大量可食贝类，补给 +1 段，且<strong>证明这里长期有人住<\/strong><\/td><\/tr><tr><td>7<\/td><td>◆ <strong>一条独木舟被拖上岸<\/strong>——主人就在附近<\/td><\/tr><tr><td>8<\/td><td>○ <strong>泥中有一排木桩<\/strong>：一座旧码头，或者一个围栏<\/td><\/tr><tr><td>9<\/td><td>◇ <strong>退潮后的泥沼<\/strong>：走进去要掷三次，失败一次就要人救<\/td><\/tr><tr><td>10<\/td><td>◆ <strong>一处盐沼<\/strong>（制药／烹调可取盐，可交易 40–120 银币）<\/td><\/tr><tr><td>11<\/td><td>○ <strong>岸上有烟、有旗、没有船<\/strong>（→ 8.5）<\/td><\/tr><tr><td>12<\/td><td>◆ <strong>一处被沙埋了一半的甲板<\/strong>（→ 8.4 沉船）<\/td><\/tr><tr><td>13<\/td><td>◇ <strong>鳄鱼与髹魞<\/strong>（DV15 感知；水中遭遇即游泳检定劣势）<\/td><\/tr><tr><td>14<\/td><td>□ <strong>红树林密不透风<\/strong>。你们走了两小时，回到原点<\/td><\/tr><tr><td>15<\/td><td>◆ <strong>红树林内部有一条水道<\/strong>（掌舵 DV15 进入）——<strong>浅水之子类特性在此发光<\/strong><\/td><\/tr><tr><td>16<\/td><td>○ <strong>一棵树上钉着铜片<\/strong>：某国的领水宣告（律法 DV14——<strong>这张纸有法律效力<\/strong>）<\/td><\/tr><tr><td>17<\/td><td>◆ <strong>一处好沙底<\/strong>，避风、有柴、有淡水涌出——<strong>走私港的标准选址<\/strong>（10.4）<\/td><\/tr><tr><td>18<\/td><td>◇ <strong>潮水比你们以为的快<\/strong>。小艇已经不在原处<\/td><\/tr><tr><td>19<\/td><td>◆ <strong>一个废弃的检疫站<\/strong>：账本、锁、和一批没人认领的货物<\/td><\/tr><tr><td>20<\/td><td>◆ <strong>一整片潮池，还有昨夜搁浅的鱼<\/strong>。以及——从海上看不存在的一条航道<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>D · 山地与高地<\/h3>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>◇ <strong>落石<\/strong>（机敏 DV14 或 2d6 钝击）；攀爬中触发全组检定<\/td><\/tr><tr><td>2<\/td><td>□ <strong>只是一面墙<\/strong>。没有路。你们用掉了一段<\/td><\/tr><tr><td>3<\/td><td>◆ <strong>山泉<\/strong>，冷，能喝（补给无限）<\/td><\/tr><tr><td>4<\/td><td>◇ <strong>失温<\/strong>（毛皮斗篷可免一次，4.2）；疲劳 +1<\/td><\/tr><tr><td>5<\/td><td>○ <strong>石堆<\/strong>：某族的界标、某人的墓、或一条路的记号（史学 DV13）<\/td><\/tr><tr><td>6<\/td><td>◆ <strong>一处洞口可住人、可挡风<\/strong>（扎营无惩罚）<\/td><\/tr><tr><td>7<\/td><td>◇ <strong>洞里有东西住过<\/strong>（→ 8.6 洞穴；不要分头进去）<\/td><\/tr><tr><td>8<\/td><td>○ <strong>风化的石砌台阶<\/strong>——这座山被爬过很多次<\/td><\/tr><tr><td>9<\/td><td>◆ <strong>山顶视野<\/strong>：新增 1d3 个\"传闻\"锚点，<strong>以及一条你们原本看不见的海岸线<\/strong><\/td><\/tr><tr><td>10<\/td><td>◇ <strong>雾突然来了<\/strong>（7.10 浓雾）：下撤 DV15，否则困在高处一夜<\/td><\/tr><tr><td>11<\/td><td>◆ <strong>野畜<\/strong>（驯畜 DV13 可猎／可养）<\/td><\/tr><tr><td>12<\/td><td>○ <strong>矿石露头<\/strong>（工程／铁匠 DV14）：<strong>这座山有人在挖矿，或曾经有人<\/strong><\/td><\/tr><tr><td>13<\/td><td>◆ <strong>一处被石墙围着的高山田<\/strong>（60–200 银币的粮，且<strong>主权争议<\/strong>）<\/td><\/tr><tr><td>14<\/td><td>◇ <strong>鹰与狼<\/strong>：夜里哨兵需胆魄 DV13<\/td><\/tr><tr><td>15<\/td><td>□ <strong>走错了一个垭口<\/strong>，白花一段。但你们记住了这条错路（<strong>这也是信息<\/strong>）<\/td><\/tr><tr><td>16<\/td><td>◆ <strong>一座石台，从海上看得见<\/strong>——天然的信号塔位（→ 12.7 某座不亮的灯塔）<\/td><\/tr><tr><td>17<\/td><td>○ <strong>一条人为铺的平路，宽到能走炮<\/strong>（工程 DV15 判断年代与用途）<\/td><\/tr><tr><td>18<\/td><td>◇ <strong>坡上松了<\/strong>：全组撤离（掌舵／体操 DV14），失败者坠落<\/td><\/tr><tr><td>19<\/td><td>◆ <strong>一个被遗落在洞里的铁匣<\/strong>：里面有铅封的信（→ 12.7 秘密链）<\/td><\/tr><tr><td>20<\/td><td>◆ <strong>你们从高处看见了不该有人的地方：一整片耕地、烟、和一条船<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>8.4 遗迹与废墟（极简地城，四拍结构）<\/h2>\n<p><strong>不做完整地城规则。<\/strong> 四拍足够撑起一幕戏：<\/p>\n<blockquote class='quote aside-voice'><strong>① 入口 → ② 试炼 → ③ 核心 → ④ 撤离<\/strong><\/blockquote>\n<div class='tbl'><table><thead><tr><th>拍<\/th><th>必须回答的问题<\/th><th>设计红线<\/th><\/tr><\/thead><tbody><tr><td><strong>① 入口<\/strong><\/td><td>有<strong>几个<\/strong>入口？玩家知道几个？<\/td><td><strong>至少两个入口，且其中一个更危险但更近。<\/strong> 单入口的地城是走廊，不是空间<\/td><\/tr><tr><td><strong>② 试炼<\/strong><\/td><td>它考验的是什么？（身体／判断／代价／关系）<\/td><td><strong>必须有一次\"不通过也能继续\"的通路<\/strong>（5.0①），否则它会卡住整个战役<\/td><\/tr><tr><td><strong>③ 核心<\/strong><\/td><td>这里真正有什么？<\/td><td><strong>核心必须至少一件不可搬走的东西<\/strong>（一段知识、一处地图、一个承诺）——否则这只是一次搬运<\/td><\/tr><tr><td><strong>④ 撤离<\/strong><\/td><td>出去要花什么？<\/td><td><strong>撤离必须有代价选项<\/strong>（丢下人／丢下货／点火把烧掉证据）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三种本作的常见遗迹<\/h3>\n<div class='tbl'><table><thead><tr><th>类型<\/th><th>入口<\/th><th>试炼<\/th><th>核心<\/th><th>撤离<\/th><\/tr><\/thead><tbody><tr><td><strong>沉船（浪线内）<\/strong><\/td><td>船尾楼（低）／破口（快但卡）／水下舷窗<\/td><td>结构是否撑住（工程 DV15）；水线与空气<\/td><td>一个<strong>封存的舱<\/strong>：账本、火漆筒、或个人物品<\/td><td>涨潮。<strong>你们只有一次潮窗<\/strong><\/td><\/tr><tr><td><strong>古代神庙／石构<\/strong><\/td><td>正门／塌口／水道<\/td><td>一件<strong>必须选择牺牲什么<\/strong>的机关<\/td><td>一处<strong>可读<\/strong>的东西（碑铭→语言学 DV16，读出一件与 12.7 相连的事）<\/td><td>有人跟你们同时进来<\/td><\/tr><tr><td><strong>废弃据点<\/strong><\/td><td>门／墙／井<\/td><td>地板、井、以及<strong>为什么这些人走的证据<\/strong><\/td><td>一本记录、一张图、或一句没说完的话<\/td><td>它不塌——<strong>它被人又住回来了<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注·三线索原则】<\/strong> 任何一座遗迹，让 GM 手里握着<strong>三条<\/strong>独立线索，其中<strong>任何一条<\/strong>都能推出核心真相的<strong>一部分<\/strong>。这来自本章最重要的方法论：<strong>信息要有冗余，玩家才不会卡死<\/strong>（5.0①、13.5）。<\/blockquote>\n<hr>\n<h2>8.5 原住民接触<\/h2>\n<blockquote class='quote'><strong>本书的立场，写在这里，不留余地：原住民是有主体性的势力——有战略、有内政、能结盟、能反噬。他们不是经验包，不是背景板，不是道德测验的道具。<\/strong><br>落地条款：任何一座有人住的岛，GM 必须能回答三个问题——<strong>他们要什么／他们怕什么／他们在对谁防着谁<\/strong>。答不出这三个问题，这座岛就不能有人。<\/blockquote>\n<h3>关系刻度（五档，每族独立记录）<\/h3>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>名称<\/th><th>你们能做什么<\/th><th>变化触发<\/th><\/tr><\/thead><tbody><tr><td>−2<\/td><td><strong>敌对<\/strong><\/td><td>只能防御或逃。任何登陆即战<\/td><td>被抢过、被杀过、有人在这丢过脸<\/td><\/tr><tr><td>−1<\/td><td><strong>警惕<\/strong><\/td><td>可交易，不得入内陆；孩子被带走看<\/td><td>你们对第三方做了什么（<strong>他们会看见<\/strong>）<\/td><\/tr><tr><td>0<\/td><td><strong>中立<\/strong><\/td><td>靠岸取水、以物易物；不可留夜<\/td><td>默认档<\/td><\/tr><tr><td>+1<\/td><td><strong>友好<\/strong><\/td><td>可入村、可留夜、可换向导与情报<\/td><td>送礼得体／帮过忙／<strong>且你们对别人也好<\/strong><\/td><\/tr><tr><td>+2<\/td><td><strong>盟约<\/strong><\/td><td>可借道、可借兵、可共同对第三方<\/td><td>通常需要<strong>一场戏<\/strong>＋一件<strong>可验证的牺牲<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>初次接触流程（四步）<\/h3>\n<p><strong>1 · 谁先看见谁<\/strong><br>瞭望／生存 DV13：成功 = <strong>你们先看见对方<\/strong>，可选择如何被看见。<strong>失败不等于对方没看见你们——只是你们以为没被看见。<\/strong><\/p>\n<p><strong>2 · 第一个选择（这张表决定基调）<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>你们的动作<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>原地等着，放下武器<\/strong><\/td><td>中立起步，可谈判（人望 DV13 升到友好）<\/td><\/tr><tr><td><strong>鸣枪示威<\/strong><\/td><td>立刻 −1 档；且对方<strong>会记住这一条<\/strong>（血债档，10.8）<\/td><\/tr><tr><td><strong>主动上前<\/strong><\/td><td>生存／人望 DV15；失败即被抢先控制局面<\/td><\/tr><tr><td><strong>放下东西后退<\/strong>（以物易物姿态）<\/td><td>送礼起点：见第 3 步<\/td><\/tr><tr><td><strong>直接登陆内陆<\/strong><\/td><td>对方自动判定为<strong>入侵<\/strong>：−1 到 −2 档<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>3 · 送礼（这一步最容易搞砸，所以它值得规则）<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>你们送<\/th><th>对方读到什么<\/th><\/tr><\/thead><tbody><tr><td>铁器、斧、针<\/td><td>实用的好东西。友好 +1<\/td><\/tr><tr><td>布、镜、珠子<\/td><td><strong>一次性货<\/strong>——他们知道，你们也知道。无加成，但不冒犯<\/td><\/tr><tr><td>酒<\/td><td><strong>短期友好 +1，长期 −1<\/strong>（他们见过酒后面目）<\/td><\/tr><tr><td>动物<\/td><td>视族群禁忌：可能是厚礼，也可能是宣战（博物学 DV14 分辨）<\/td><\/tr><tr><td>带走的东西<\/td><td>敌对。没有例外<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注】<\/strong> 这张表的全部要点只有一句：<strong>这里的\"慷慨\"由对方定义。<\/strong> 让玩家掷一次博物学或语言学去<strong>问<\/strong>——那一次问，就是本作的道德重量所在。<\/blockquote>\n<p><strong>4 · 语言不通怎么办<\/strong><\/p>\n<blockquote class='quote'><strong>沟通骰<\/strong>：一方出图（绘图 DV13）或表意（表演 DV13），另一方解（博物学 DV13）。<br><strong>两侧都过<\/strong>：传达明确。<br><strong>一侧过<\/strong>：<strong>传达了一个双方都同意的、但其中一方理解错了的意思<\/strong>——这是本章最好的游戏时刻。<br><strong>都失败<\/strong>：各说各话，但气氛没有变坏。<strong>别把\"听不懂\"结算成\"翻脸\"。<\/strong><\/blockquote>\n<h3>长期条款<\/h3>\n<ul class='mdlist'><li><strong>他们之间的关系比你们重要。<\/strong> 岛上若有两族，他们之间的关系先成立，你们才插进去（每锚地 ≥2 派系，12.5）。<\/li><li><strong>他们会学习你们。<\/strong> 你们对 A 族做的事，B 族会在下一次遭遇时用来对你们。<\/li><li><strong>一次背叛可以永久封顶友好<\/strong>：该族最高只能到\"警惕\"，直到你们付出一件<strong>可验证的代价<\/strong>。<\/li><\/ul>\n<hr>\n<h2>8.6 环境危险<\/h2>\n<div class='tbl'><table><thead><tr><th>环境<\/th><th>危险<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td><strong>丛林<\/strong><\/td><td>迷路<\/td><td>生存 DV14；失败＝本探索段白费且下一段 DV +2<\/td><\/tr><tr><td><\/td><td>毒虫<\/td><td>机敏 DV14 躲；失败→筋骨 DV13 抗，否则 1d3 天卧床<\/td><\/tr><tr><td><\/td><td>疾病<\/td><td>每 5 天全船健康骰（7.8）；<strong>湿地 ×2 频率<\/strong><\/td><\/tr><tr><td><\/td><td>蚂蟥与感染<\/td><td>任何伤口未处理：医药 DV12 否则局部伤 +1<\/td><\/tr><tr><td><strong>沼泽<\/strong><\/td><td>陷落<\/td><td>筋骨 DV14；负重者 +2 DV；丢装备可免<\/td><\/tr><tr><td><\/td><td>污水<\/td><td>痢疾 DV15（7.8）；<strong>必须烧水<\/strong><\/td><\/tr><tr><td><strong>洞穴<\/strong><\/td><td>坍塌<\/td><td>工程 DV15 判可否进；进入后火把每 2 班次一掷 d6 ≤2 缺氧<\/td><\/tr><tr><td><\/td><td>回音与迷路<\/td><td>无照明＝不能探索；照明用尽＝生存 DV16 找出口<\/td><\/tr><tr><td><strong>高地<\/strong><\/td><td>失温<\/td><td>毛皮斗篷免一次（4.2）；否则疲劳 +1<\/td><\/tr><tr><td><\/td><td>落石／雾<\/td><td>见 8.3 D<\/td><\/tr><tr><td><strong>淡水污染<\/strong><\/td><td>一切<\/td><td>水疑则博物学 DV12；不烧滚：痢疾 DV15<\/td><\/tr><tr><td><strong>中暑与晕船<\/strong><\/td><td>登陆后<\/td><td>陆晕（晕船的反向）：连续两探索段后机敏检定 −1，长期航行越久越重<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>环境伤害的累计律<\/strong>：环境伤害<strong>不经过护甲<\/strong>，且<strong>每段未处理则 +1<\/strong>（3.7）。环境伤害把人杀掉之前，先让士气掉下去——这条与 7.7 完全一致。<\/p>\n<hr>\n<h2>8.7 发现点与收益<\/h2>\n<p><strong>发现本身就是经验值<\/strong>（3.9 里程碑制：海图上未探索的坐标是最好的经验值）。<\/p>\n<div class='tbl'><table><thead><tr><th>发现<\/th><th>XP<\/th><th>声望<\/th><th>市场<\/th><\/tr><\/thead><tbody><tr><td><strong>新锚地（首次测绘）<\/strong><\/td><td>+1（团队）<\/td><td>制图师行会 +5；宣告国 +3<\/td><td>海图可卖 40–200 银币（5.2）<\/td><\/tr><tr><td><strong>新物种著录<\/strong><\/td><td>+1<\/td><td>博物学相关势力 +5<\/td><td>标本 60–300 银币；<strong>著录权另计<\/strong><\/td><\/tr><tr><td><strong>遗迹（首次进入）<\/strong><\/td><td>+1<\/td><td>无（<strong>且最好没有<\/strong>）<\/td><td>见 9.9；<strong>文物销赃风险极高<\/strong><\/td><\/tr><tr><td><strong>一条新航线<\/strong><\/td><td>+1～+2<\/td><td>各国 +5～+10<\/td><td><strong>航线是可被垄断的东西<\/strong>（10.1）<\/td><\/tr><tr><td><strong>一处水源／锚地的情报<\/strong><\/td><td>无 XP<\/td><td>+3（若告诉了对的人）<\/td><td><strong>这条能卖，也能救一船人——二者常冲突<\/strong><\/td><\/tr><tr><td><strong>传说中的坐标被证实<\/strong><\/td><td>+2<\/td><td>全海域 ±（<strong>取决于谁不希望它被证实<\/strong>）<\/td><td>见 12.7 秘密<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>采样与标本（把博物学变成钱）<\/h3>\n<ul class='mdlist'><li>一次采样：博物学 DV13，耗时 1 班次，得 1 份标本（占 0.5 舱位）。<\/li><li>市场价值 = 60–300 银币（行情骰，10.2）。<\/li><li><strong>首次著录<\/strong>：额外 +1 XP（制药／博物学分支\"新种著录\"，5.9）。<\/li><li><strong>腐坏<\/strong>：标本每 3 天需处理一次（制药 DV12），否则归零。<strong>这条麻烦是故意的<\/strong>——它逼玩家在\"多采一点\"和\"活着带回去\"之间选。<\/li><\/ul>\n<blockquote class='quote'><strong>【历史注】<\/strong> 真正的殖民时代里，标本箱常常比货物舱更受海关重视：<strong>知识本身就是被争夺的资源。<\/strong> 请把这件事演出来，不要只是把它写在纸上。<\/blockquote>\n<hr>\n<h2>8.8 三十秒速查<\/h2>\n<ul class='mdlist'><li><strong>一个锚点 = 一个能停下来的地方<\/strong>；航线有距离、风向适配、危险、和观察者<\/li><li><strong>三层海<\/strong>：海面（到即可见）／岸上（要走进去）／水下（要泅或捞，且会死）<\/li><li><strong>一探索段 = 1 班次<\/strong>；每段每人 0.5 份食 + 1.5 升水；小艇 4 人 2 舱位<\/li><li><strong>退潮是硬时限<\/strong>；夜不离船（DV16 且发现表偏危险）<\/li><li><strong>发现表 d20<\/strong>：每 20 条里至少 6 条纯收益，至少 1 条排除法<\/li><li><strong>遗迹四拍<\/strong>：入口（≥2）—试炼（有替代通路）—核心（含不可搬走之物）—撤离（必须有代价）<\/li><li><strong>三线索原则<\/strong>：任何真相至少三条独立通路<\/li><li><strong>原住民三问<\/strong>：他们要什么／怕什么／对谁防着谁。答不出就别让人住在那<\/li><li><strong>送礼表<\/strong>：铁器＋1；酒短期＋1 长期 −1；带走东西＝敌对<\/li><li><strong>听不懂 ≠ 翻脸<\/strong><\/li><\/ul>\n<hr>\n<p><em>海岸线画完了。下一章开始，有些东西不在自然史上——而在人的故事里。<\/em><\/p>","text":"海图上的空白不是\"那里什么都没有\"。它的意思是\"那里有东西，而我们还不知道那是什么\"。 本章管的是 下船之后 的一切。第7章把人送到岸，第9章处理打起来怎么办，本章处理剩下的那 90% 时间： 找水、辨路、遇见人、以及决定要不要走进那座庙。 本章三立场 ： 探索必须有收益。 每张发现表至少 30% 的条目是纯收益（知识／海图／贸易品／传说线索）。玩家花了班次就该拿到东西，哪怕是\"确认了这里没有\"。 \"空结果\"也是结果。 明写\"你确认这片林子没有淡水\"—— 排除法本身就是信息 ，而信息在本作里可以卖（8.7、10.1）。 海图是道具，不是界面。 玩家画在纸上的东西才是他们知道的。GM 不替他们记。 8.1 海图揭示 战役地图的结构 用 点阵海图（point-crawl） ：一片海域由 锚点 （node）连成，锚点之间由 航线 相连。 默认每片海域 6–10 个锚点 ：港口、锚地、礁群、河口、岛、深水湾、以及\"某处\"。 一个锚点 = 一次可以停下来的地方。 不是六角格，不占面积。 航线是有属性的 ：距离（航段数）、风向适配（7.4）、危险等级、以及 谁在看着它 。 为什么用点阵而不是方格 ：方格会把探索变成涂色，点阵会把探索变成 选择走哪条线 。本作的核心循环里，\"线\"永远比\"格\"重要（13.3 画线的时刻）。 遮蔽与揭示 状态 表达 未知 图上没有这个点。GM 不说它在不在 传闻 玩家自己标一个圈，写传闻原话。 传闻可能是假的 （10.3 传闻表） 目击 船到目视距离后 必须绘制 （海图绘制检定，5.2）才算真 测绘 一次成功的海图绘制（≥困难档）——含水深、底质、进出航道 揭示规则 ：进入一个锚点的目视范围，该锚点及其 相邻 1–2 个 锚点的轮廓显现。 再远必须自己去找 ——没有\"开地图\"这回事。 三层可读的海 同一个锚点，三层信息各自独立揭示： 层 怎么知道 谁能知道 海面 到即可见 瞭望位 岸上 必须登陆并走进去（8.2） 分遣队 水下 必须 潜、泅、或捞 （游泳 5.2；退潮窗口） 极少数人，且会死 【设计注】 这一层是海图版的\"多入口\"设计：同一座岛，从海面看是礁，从岸上看是林子，从水下看是一堆沉船。 三条通路各自通向不同的秘密，且没有任何一条是\"正门\"。 8.2 探索流程 一次登陆的六步 选登陆点 （掌舵＋瞭望；礁区见 7.10，DV15） 扎营 （0.5 班次；选址需生存 DV13——选错则夜里出一次事） 分队 （每队 2–3 人；分得越细越容易出事，但覆盖越广—— 这是本章唯一的通用权衡 ） 走一个\"探索段\" （= 1 班次 ≈ 4 小时，可行走距离约 2–4 公里） 掷发现表 （8.3，每探索段一次） 勘定水源与水位 （博物学／生存 DV13）—— 这一步决定你们还能不能再来一次 探索段的两条硬约束 退潮 ：任何登陆都有 返回窗口 。GM 报出钟点，玩家自己算。错过窗口 = 小艇留下、队伍上陆（8.6），或者直接失去小艇（弃子，9.7）。 夜不离船 ：夜间探索需生存 DV16，且发现表结果向\"危险\"偏一档。 老水手不上夜山，这不是迷信，是账。 补给与水的实际结算 项 每探索段消耗 食物 0.5 份／人 淡水 1.5 升／人 （比船上多，因为在走） 小艇运力 每艘小艇 4 人 ＋ 2 舱位物资 （6.8） 断水的队伍在第三个探索段后开始掷体质。 这一段不需要发现表 ——它自己就是发现。 8.3 随机发现表 用法 ：每探索段按所在地形掷一张， d20 一次 。 标记 ：◆纯收益 ◇危险／代价 ○信息或线索 □排除法结果（\"这里没有\"） 每张表 ◆ 不少于 6 条 ——这是设计约束，不是运气。 A · 丛林与雨林 d20 结果 1 ◇ 沼泽陷落 ：一人陷至胸，需筋骨 DV14 拉出，否则每轮 −1 HP；此地蚊虫 ×3 2 ○ 旧路 ：一条被藤蔓吃掉的道。走它能快一倍，但 有人修过它 3 □ 无淡水 。确认了。这是本段唯一的收获 4 ◇ 毒虫群 （DV14 闪避，失败中毒：筋骨 DV13 否则 1d3 天卧床） 5 ◆ 可食根茎与果 ：全组补给 +1 段；博物学可判定安全（DV12） 6 ○ 炊烟味 （顺风）。有人在两公里内 7 ◇ 豹／美洲虎 ：一次突袭（先攻自动归它）；不打照面 8 ◆ 一处优质锚地 （从陆上看下去才看得见）—— 海图直接升为\"测绘\" 9 ○ 树上的刻痕 ：本族、西语、还是荷兰语？（史学 DV13） 10 □ 走到山顶，看见了三座岛的轮廓。 海图新增三个\"传闻\"锚点 11 ◆ 药草坡 ：制药／博物学采样，市场价值 60–200 银币（8.7） 12 ◇ 腐尸与苍蝇 ：附近有死物。可能是船，可能是人，可能是疫 13 ◆ 一条能喝的河 ，且有鱼（渔猎 DV11 得 2 段补给） 14 ○ 人为砍伐的痕迹 ：这片林子被管理过—— 说明有主权，有主人 15 ◇ 响尾／毒蜥 ：钝痛与一场高烧（热病判定，7.8） 16 ◆ 废弃的哨站 ，内有铁器、半桶焦油、一本被雨泡烂的记录 17 ○ 一座坟，朝向海上 。葬的是水手还是本地人？（史学 DV14） 18 ◇ 吼声，不止一只 。今晚必须回船 19 ◆ 一片没被画进任何海图的潟湖 ，里面有条搁浅的船（→ 8.4 沉船） 20 ◆ 一个人 。他看见了你们，你们看见了他。 （→ 8.5，立刻转入接触流程） B · 岛屿 d20 结果 1 ◇ 海鸟群受惊飞起 ——这是坏事：下面有东西惊了它们 2 □ 岛是空的 。真的空。没有泉，没有木，没有荫蔽。记下来，别再来了 3 ◆ 一泉 （淡水充足，够全船）——这是这座岛最值钱的东西 4 ○ 旧井，石砌 。 有人在这住过，而且打算回来 5 ◇ 蛇与蜥 ：DV13 闪避；咬伤→热病判定 6 ◆ 龟群或海鸟卵 ：补给 +1.5 段 7 ◆ 一处避风水湾 ，沙底，好锚—— 测绘海图，直接可交易 8 ○ 信号火堆的残骸 ，三层石。烧过很久，也烧过很近 9 ◇ 塌方带 ：进入需工程 DV15，否则惊动整面坡 10 ◆ 淡水＋柴＋可猎 ：一处天然扎营点。 在本作里这就是战略资产 11 ○ 一面刻石的礁 ：年代、国别、还是某个人的名字？（史学 DV15） 12 ◆ 沉船，就在浪线内 （→ 8.4 沉船） 13 ◇ 蟹群与潮沟 ：无害，但会拖慢你们到日落 14 ○ 鸟的飞行方向 （博物学 DV11）：陆地在哪儿，淡水在哪儿 15 ◆ 一处天然的沥青渗出 （6.9 修船神料，可采 1d3 份） 16 ◇ 气味 。你们离一具尸体不超过三百步 17 ◆ 一座小珊瑚洞 ，退潮才可入；里面有人躲过，而且躲了很久 18 ○ 一只不认人的山羊 。它被养过 19 ◆ 岛的另一侧有一片梯田 （驯畜／史学 DV13）—— 有人在种地，别踩进田里 20 ◆ 一座活火山口，风把硫味送过来 。地热、危险、和一处没人知道的锚地 C · 海岸与河口 d20 结果 1 ◇ 泥岸吃人 ：负重者下陷；需丢装备或两人协作（筋骨 DV14） 2 □ 海岸平直，无一处可泊 。记录：这段海不能停 3 ◆ 河口有淡水 ，且船能进（吃水检定 DV13） 4 ○ 沙滩上的船骸线 ：不止一条船在这撞碎——为什么？ 5 ◇ 蚊与潮热 ：痢疾与热病的判定窗口（7.8） 6 ◆ 贝冢 ：大量可食贝类，补给 +1 段，且 证明这里长期有人住 7 ◆ 一条独木舟被拖上岸 ——主人就在附近 8 ○ 泥中有一排木桩 ：一座旧码头，或者一个围栏 9 ◇ 退潮后的泥沼 ：走进去要掷三次，失败一次就要人救 10 ◆ 一处盐沼 （制药／烹调可取盐，可交易 40–120 银币） 11 ○ 岸上有烟、有旗、没有船 （→ 8.5） 12 ◆ 一处被沙埋了一半的甲板 （→ 8.4 沉船） 13 ◇ 鳄鱼与髹魞 （DV15 感知；水中遭遇即游泳检定劣势） 14 □ 红树林密不透风 。你们走了两小时，回到原点 15 ◆ 红树林内部有一条水道 （掌舵 DV15 进入）—— 浅水之子类特性在此发光 16 ○ 一棵树上钉着铜片 ：某国的领水宣告（律法 DV14—— 这张纸有法律效力 ） 17 ◆ 一处好沙底 ，避风、有柴、有淡水涌出—— 走私港的标准选址 （10.4） 18 ◇ 潮水比你们以为的快 。小艇已经不在原处 19 ◆ 一个废弃的检疫站 ：账本、锁、和一批没人认领的货物 20 ◆ 一整片潮池，还有昨夜搁浅的鱼 。以及——从海上看不存在的一条航道 D · 山地与高地 d20 结果 1 ◇ 落石 （机敏 DV14 或 2d6 钝击）；攀爬中触发全组检定 2 □ 只是一面墙 。没有路。你们用掉了一段 3 ◆ 山泉 ，冷，能喝（补给无限） 4 ◇ 失温 （毛皮斗篷可免一次，4.2）；疲劳 +1 5 ○ 石堆 ：某族的界标、某人的墓、或一条路的记号（史学 DV13） 6 ◆ 一处洞口可住人、可挡风 （扎营无惩罚） 7 ◇ 洞里有东西住过 （→ 8.6 洞穴；不要分头进去） 8 ○ 风化的石砌台阶 ——这座山被爬过很多次 9 ◆ 山顶视野 ：新增 1d3 个\"传闻\"锚点， 以及一条你们原本看不见的海岸线 10 ◇ 雾突然来了 （7.10 浓雾）：下撤 DV15，否则困在高处一夜 11 ◆ 野畜 （驯畜 DV13 可猎／可养） 12 ○ 矿石露头 （工程／铁匠 DV14）： 这座山有人在挖矿，或曾经有人 13 ◆ 一处被石墙围着的高山田 （60–200 银币的粮，且 主权争议 ） 14 ◇ 鹰与狼 ：夜里哨兵需胆魄 DV13 15 □ 走错了一个垭口 ，白花一段。但你们记住了这条错路（ 这也是信息 ） 16 ◆ 一座石台，从海上看得见 ——天然的信号塔位（→ 12.7 某座不亮的灯塔） 17 ○ 一条人为铺的平路，宽到能走炮 （工程 DV15 判断年代与用途） 18 ◇ 坡上松了 ：全组撤离（掌舵／体操 DV14），失败者坠落 19 ◆ 一个被遗落在洞里的铁匣 ：里面有铅封的信（→ 12.7 秘密链） 20 ◆ 你们从高处看见了不该有人的地方：一整片耕地、烟、和一条船 8.4 遗迹与废墟（极简地城，四拍结构） 不做完整地城规则。 四拍足够撑起一幕戏： ① 入口 → ② 试炼 → ③ 核心 → ④ 撤离 拍 必须回答的问题 设计红线 ① 入口 有 几个 入口？玩家知道几个？ 至少两个入口，且其中一个更危险但更近。 单入口的地城是走廊，不是空间 ② 试炼 它考验的是什么？（身体／判断／代价／关系） 必须有一次\"不通过也能继续\"的通路 （5.0①），否则它会卡住整个战役 ③ 核心 这里真正有什么？ 核心必须至少一件不可搬走的东西 （一段知识、一处地图、一个承诺）——否则这只是一次搬运 ④ 撤离 出去要花什么？ 撤离必须有代价选项 （丢下人／丢下货／点火把烧掉证据） 三种本作的常见遗迹 类型 入口 试炼 核心 撤离 沉船（浪线内） 船尾楼（低）／破口（快但卡）／水下舷窗 结构是否撑住（工程 DV15）；水线与空气 一个 封存的舱 ：账本、火漆筒、或个人物品 涨潮。 你们只有一次潮窗 古代神庙／石构 正门／塌口／水道 一件 必须选择牺牲什么 的机关 一处 可读 的东西（碑铭→语言学 DV16，读出一件与 12.7 相连的事） 有人跟你们同时进来 废弃据点 门／墙／井 地板、井、以及 为什么这些人走的证据 一本记录、一张图、或一句没说完的话 它不塌—— 它被人又住回来了 【设计注·三线索原则】 任何一座遗迹，让 GM 手里握着 三条 独立线索，其中 任何一条 都能推出核心真相的 一部分 。这来自本章最重要的方法论： 信息要有冗余，玩家才不会卡死 （5.0①、13.5）。 8.5 原住民接触 本书的立场，写在这里，不留余地：原住民是有主体性的势力——有战略、有内政、能结盟、能反噬。他们不是经验包，不是背景板，不是道德测验的道具。 落地条款：任何一座有人住的岛，GM 必须能回答三个问题—— 他们要什么／他们怕什么／他们在对谁防着谁 。答不出这三个问题，这座岛就不能有人。 关系刻度（五档，每族独立记录） 档 名称 你们能做什么 变化触发 −2 敌对 只能防御或逃。任何登陆即战 被抢过、被杀过、有人在这丢过脸 −1 警惕 可交易，不得入内陆；孩子被带走看 你们对第三方做了什么（ 他们会看见 ） 0 中立 靠岸取水、以物易物；不可留夜 默认档 +1 友好 可入村、可留夜、可换向导与情报 送礼得体／帮过忙／ 且你们对别人也好 +2 盟约 可借道、可借兵、可共同对第三方 通常需要 一场戏 ＋一件 可验证的牺牲 初次接触流程（四步） 1 · 谁先看见谁 瞭望／生存 DV13：成功 = 你们先看见对方 ，可选择如何被看见。 失败不等于对方没看见你们——只是你们以为没被看见。 2 · 第一个选择（这张表决定基调） 你们的动作 效果 原地等着，放下武器 中立起步，可谈判（人望 DV13 升到友好） 鸣枪示威 立刻 −1 档；且对方 会记住这一条 （血债档，10.8） 主动上前 生存／人望 DV15；失败即被抢先控制局面 放下东西后退 （以物易物姿态） 送礼起点：见第 3 步 直接登陆内陆 对方自动判定为 入侵 ：−1 到 −2 档 3 · 送礼（这一步最容易搞砸，所以它值得规则） 你们送 对方读到什么 铁器、斧、针 实用的好东西。友好 +1 布、镜、珠子 一次性货 ——他们知道，你们也知道。无加成，但不冒犯 酒 短期友好 +1，长期 −1 （他们见过酒后面目） 动物 视族群禁忌：可能是厚礼，也可能是宣战（博物学 DV14 分辨） 带走的东西 敌对。没有例外 【设计注】 这张表的全部要点只有一句： 这里的\"慷慨\"由对方定义。 让玩家掷一次博物学或语言学去 问 ——那一次问，就是本作的道德重量所在。 4 · 语言不通怎么办 沟通骰 ：一方出图（绘图 DV13）或表意（表演 DV13），另一方解（博物学 DV13）。 两侧都过 ：传达明确。 一侧过 ： 传达了一个双方都同意的、但其中一方理解错了的意思 ——这是本章最好的游戏时刻。 都失败 ：各说各话，但气氛没有变坏。 别把\"听不懂\"结算成\"翻脸\"。 长期条款 他们之间的关系比你们重要。 岛上若有两族，他们之间的关系先成立，你们才插进去（每锚地 ≥2 派系，12.5）。 他们会学习你们。 你们对 A 族做的事，B 族会在下一次遭遇时用来对你们。 一次背叛可以永久封顶友好 ：该族最高只能到\"警惕\"，直到你们付出一件 可验证的代价 。 8.6 环境危险 环境 危险 数值 丛林 迷路 生存 DV14；失败＝本探索段白费且下一段 DV +2 毒虫 机敏 DV14 躲；失败→筋骨 DV13 抗，否则 1d3 天卧床 疾病 每 5 天全船健康骰（7.8）； 湿地 ×2 频率 蚂蟥与感染 任何伤口未处理：医药 DV12 否则局部伤 +1 沼泽 陷落 筋骨 DV14；负重者 +2 DV；丢装备可免 污水 痢疾 DV15（7.8）； 必须烧水 洞穴 坍塌 工程 DV15 判可否进；进入后火把每 2 班次一掷 d6 ≤2 缺氧 回音与迷路 无照明＝不能探索；照明用尽＝生存 DV16 找出口 高地 失温 毛皮斗篷免一次（4.2）；否则疲劳 +1 落石／雾 见 8.3 D 淡水污染 一切 水疑则博物学 DV12；不烧滚：痢疾 DV15 中暑与晕船 登陆后 陆晕（晕船的反向）：连续两探索段后机敏检定 −1，长期航行越久越重 环境伤害的累计律 ：环境伤害 不经过护甲 ，且 每段未处理则 +1 （3.7）。环境伤害把人杀掉之前，先让士气掉下去——这条与 7.7 完全一致。 8.7 发现点与收益 发现本身就是经验值 （3.9 里程碑制：海图上未探索的坐标是最好的经验值）。 发现 XP 声望 市场 新锚地（首次测绘） +1（团队） 制图师行会 +5；宣告国 +3 海图可卖 40–200 银币（5.2） 新物种著录 +1 博物学相关势力 +5 标本 60–300 银币； 著录权另计 遗迹（首次进入） +1 无（ 且最好没有 ） 见 9.9； 文物销赃风险极高 一条新航线 +1～+2 各国 +5～+10 航线是可被垄断的东西 （10.1） 一处水源／锚地的情报 无 XP +3（若告诉了对的人） 这条能卖，也能救一船人——二者常冲突 传说中的坐标被证实 +2 全海域 ±（ 取决于谁不希望它被证实 ） 见 12.7 秘密 采样与标本（把博物学变成钱） 一次采样：博物学 DV13，耗时 1 班次，得 1 份标本（占 0.5 舱位）。 市场价值 = 60–300 银币（行情骰，10.2）。 首次著录 ：额外 +1 XP（制药／博物学分支\"新种著录\"，5.9）。 腐坏 ：标本每 3 天需处理一次（制药 DV12），否则归零。 这条麻烦是故意的 ——它逼玩家在\"多采一点\"和\"活着带回去\"之间选。 【历史注】 真正的殖民时代里，标本箱常常比货物舱更受海关重视： 知识本身就是被争夺的资源。 请把这件事演出来，不要只是把它写在纸上。 8.8 三十秒速查 一个锚点 = 一个能停下来的地方 ；航线有距离、风向适配、危险、和观察者 三层海 ：海面（到即可见）／岸上（要走进去）／水下（要泅或捞，且会死） 一探索段 = 1 班次 ；每段每人 0.5 份食 + 1.5 升水；小艇 4 人 2 舱位 退潮是硬时限 ；夜不离船（DV16 且发现表偏危险） 发现表 d20 ：每 20 条里至少 6 条纯收益，至少 1 条排除法 遗迹四拍 ：入口（≥2）—试炼（有替代通路）—核心（含不可搬走之物）—撤离（必须有代价） 三线索原则 ：任何真相至少三条独立通路 原住民三问 ：他们要什么／怕什么／对谁防着谁。答不出就别让人住在那 送礼表 ：铁器＋1；酒短期＋1 长期 −1；带走东西＝敌对 听不懂 ≠ 翻脸 海岸线画完了。下一章开始，有些东西不在自然史上——而在人的故事里。"},{"num":"09","title":"战斗与海战","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>炮声最响的那一瞬，没有人记得帆。所有人都只记得：刚才谁在找自己。<\/em><\/blockquote>\n<p>本章把第3章的引擎装进真正会死人的场合。它是全书最长的一章，也是主持负担最重的一章——所以它被组织成<strong>一张速查页（9.10）加九个小节<\/strong>：跑团时你只需要 9.10。<\/p>\n<p>本章的三条设计立场，先说在前面：<\/p>\n<ul class='mdlist'><li><strong>海战是位置游戏。<\/strong> 抢到上风不是\"加值好看\"，是结构性优势——它决定谁先开火、谁能动、谁在挨打时还不了手。<\/li><li><strong>炮击砸船，刀剑砸人。<\/strong> 船体值与HP两条血条永不互相折算（见3.8设计注）。\"保船还是保人\"是真实抉择，不是数值选择题。<\/li><li><strong>船战只有一种血统。<\/strong> 本章的舰船机动走<strong>岗位动作经济<\/strong>（每名船员每轮一个动作池），不走写实帆理模型。部位、致残、失血、士气崩坏这类\"血很贵\"的规则，全部装在<strong>人和登船队<\/strong>这一层。两条路线在 9.1 与 9.5 各自显式声明，不混线。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注·为什么不双挂】<\/strong> 曾有两套船战方案摆在一起：一套以\"人在岗位上的选择\"为单位，一套以\"帆与风的物理\"为单位。它们各自内部自洽，但<strong>同时启用会互相抵消<\/strong>——前者要求每轮做决定，后者要求每轮算结果。<strong>本作的船战取前者。<\/strong> 后者作为可选变体留在 9.3 末尾的【口径声明】里，供想跑极端写实的桌启用，且启用后必须整段替换，不许挑条款。<\/blockquote>\n<hr>\n<h2>9.0 三档尺度对照<\/h2>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>轮长<\/th><th>地图<\/th><th>单位<\/th><th>用在哪<\/th><\/tr><\/thead><tbody><tr><td><strong>个人战斗<\/strong><\/td><td>6秒<\/td><td>1格=5尺<\/td><td>人<\/td><td>甲板混战、港口斗殴、舱内格斗<\/td><\/tr><tr><td><strong>海战<\/strong><\/td><td>1分钟<\/td><td>1格=60尺<\/td><td>船<\/td><td>机动、炮击、抢位<\/td><\/tr><tr><td><strong>群战<\/strong><\/td><td>不轮算<\/td><td>无图<\/td><td>队<\/td><td>三船以上会战、登陆场<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>尺度切换是本章最容易翻车的地方<\/strong>，一条纪律解决：<strong>人在自己船上算船的单位，人踩上敌船甲板算人的单位。<\/strong> 接舷成功的那一轮，海战轮立刻换成战斗轮——两艘船在战术图上不再移动（已钩死），所有人在甲板格上重排一次先攻。切换不回溯。<\/p>\n<blockquote class='quote'><strong>【设计注·网格口径】<\/strong> 战术格取 60 尺（约11米），是为了让一场二十分钟的海战能在一张餐巾纸上跑完。距离带因此比\"逐尺推算\"更粗，但<strong>风、帆、射界三件事的取舍精度一点没少<\/strong>——玩家真正决策的从来不是\"我动了多少米\"。<\/blockquote>\n<hr>\n<h2>9.1 个人战斗<\/h2>\n<h3>先攻<\/h3>\n<p>开局每人掷一次<strong>机敏检定（DV10）<\/strong>，从高到低排。GM 把所有 NPC 归为若干<strong>行动组<\/strong>，每组只掷一次——不要为八个喽啰排八张卡。<\/p>\n<ul class='mdlist'><li>掷出<strong>卓越<\/strong>（≥15）：本回合额外获得一次<strong>自由移动<\/strong>。<\/li><li>有备而来的一方（设了伏、提前就位）<strong>直接插到最前<\/strong>，不掷骰。<\/li><li>先攻序整场固定，除非有人倒地或被击退（重排至末）。<\/li><\/ul>\n<h3>战斗轮结构<\/h3>\n<p>每轮，你的回合里你可以：<\/p>\n<p><strong>1 个动作<\/strong> ＋ <strong>1 次移动<\/strong>（最多 机敏×5 尺）＋ <strong>任意数量的自由反应<\/strong>（说话、丢下东西、退一步）<\/p>\n<p><strong>动作清单<\/strong>——想做什么，先在这张表上找：<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td><strong>攻击<\/strong><\/td><td>见下\"攻击流程\"<\/td><\/tr><tr><td><strong>双武器攻击<\/strong><\/td><td>主手正常；副手以<strong>劣势<\/strong>追加一次，伤害骰降一档<\/td><\/tr><tr><td><strong>装填<\/strong><\/td><td>火器上弹（9.2）。装填可与移动合并，<strong>不能与攻击合并<\/strong><\/td><\/tr><tr><td><strong>瞄准<\/strong><\/td><td>放弃移动，本回合攻击检定<strong>优势<\/strong>；若此时被夹击，瞄准被打断<\/td><\/tr><tr><td><strong>格挡<\/strong><\/td><td>本轮<strong>防御 +2<\/strong>，并对\"推撞\"免疫；代价是本回合不能攻击<\/td><\/tr><tr><td><strong>推撞<\/strong><\/td><td>筋骨 vs 对方筋骨（对抗）。胜：对方倒地并后退一格；负：你自己倒地<\/td><\/tr><tr><td><strong>缴械<\/strong><\/td><td>机敏+武器技能 vs 对方筋骨+武器技能。胜：其武器落地距你一步<\/td><\/tr><tr><td><strong>奔跑<\/strong><\/td><td>用掉动作，移动×2；<strong>脱离近战时仍引发借机攻击<\/strong><\/td><\/tr><tr><td><strong>使用物品<\/strong><\/td><td>喝药、掏火种、上夹板、点燃火药桶<\/td><\/tr><tr><td><strong>扶起同伴<\/strong><\/td><td>机敏+医术 DV13；成功后对方以倒地状态起立，本回合不能再行动<\/td><\/tr><tr><td><strong>伏低<\/strong><\/td><td><strong>（反应，非动作）<\/strong> 本轮防御 +2，或对抗一次效果时 +2。每轮限一次<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>攻击流程<\/h3>\n<ol class='mdlist'><li>声明目标与武器。<\/li><li><strong>命中<\/strong>：<code>d20 + 属性 + 武器技能 ≥ 防御<\/code> → 命中<ul class='sub'><li>属性取<strong>机敏<\/strong>（远程、灵巧武器、你比对手快）或<strong>筋骨<\/strong>（重武器、力量压制），GM 判。<\/li><li><strong>防御 = 13 + 护甲值 + 盾牌(1) + 优势地位修正<\/strong><\/li><\/ul><\/li><li><strong>伤害<\/strong>：武器骰 + 筋骨修正（仅近战）→ 扣 HP。<\/li><li><strong>命中等级决定额外效果<\/strong>——直接沿用 3.2 的成功等级，不另立新尺：<\/li><\/ol>\n<div class='tbl'><table><thead><tr><th>命中结果<\/th><th>等级<\/th><th>战场效果<\/th><\/tr><\/thead><tbody><tr><td>≥ 防御+10 或 天然20<\/td><td><strong>重击<\/strong><\/td><td>伤害<strong>骰翻倍<\/strong>（只乘骰，不乘筋骨修正）；目标本轮承受<strong>劣势<\/strong><\/td><\/tr><tr><td>≥ 防御+5<\/td><td><strong>精准<\/strong><\/td><td>正常伤害 +1d4，并触发武器的专精特性（若有）<\/td><\/tr><tr><td>≥ 防御<\/td><td><strong>命中<\/strong><\/td><td>正常伤害<\/td><\/tr><tr><td>≥ 防御−5<\/td><td><strong>失手<\/strong><\/td><td>无伤害；若目标已在近战距离，你<strong>暴露一次借机攻击<\/strong><\/td><\/tr><tr><td>&lt; 防御−5 或 天然1<\/td><td><strong>险失<\/strong><\/td><td>无伤害，且发生一件对你不利的事：武器脱手／位置暴露／误伤友军（见\"缠斗误伤\"）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>天然 20 恒为重击；天然 1 恒为险失。<\/strong> 火器天然 1 额外<strong>卡壳<\/strong>（见9.2）。<\/p>\n<h3>距离、掩体与位置<\/h3>\n<div class='tbl'><table><thead><tr><th>条件<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>夹击<\/strong>（两名敌人在你前后两侧各1格内）<\/td><td>攻击者获<strong>优势<\/strong>；被格挡者不获<\/td><\/tr><tr><td><strong>居高临下<\/strong><\/td><td>攻击 +2，且不因高度损失移动<\/td><\/tr><tr><td><strong>掩体：半<\/strong><\/td><td>目标防御 <strong>+2<\/strong><\/td><\/tr><tr><td><strong>掩体：四分之三<\/strong><\/td><td>目标防御 <strong>+5<\/strong><\/td><\/tr><tr><td><strong>掩体：全<\/strong><\/td><td><strong>不能瞄准<\/strong>——只能靠\"听声\"（学识 DV13 对抗其机敏+潜行）后以劣势射击<\/td><\/tr><tr><td><strong>倒地<\/strong><\/td><td>近战对其<strong>优势<\/strong>；远程对其<strong>劣势<\/strong>；起身要花掉一次移动<\/td><\/tr><tr><td><strong>浸水<\/strong><\/td><td>火器全部哑火；攀爬、游泳检定劣势<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>借机攻击<\/strong>：敌人在你相邻格内<strong>主动离开<\/strong>时，你以反应做一次普通近战攻击。走荡索（9.6）可免。同一敌人每轮只触发一次。<\/p>\n<p><strong>缠斗误伤<\/strong>：一次近战攻击的<strong>险失<\/strong>发生在多人挤靠处（相邻格有 ≥2 名非目标）时，<strong>掷 d4 定位<\/strong>：1–2 打空、3 撞到最近的人、4 撞到次近的人。<strong>不由 GM 指定\"剧情上最合理的那位\"<\/strong>——这是铁律。GM 一旦能指定，玩家就不敢站在同伴身边了。<\/p>\n<h3>士气：杂兵为什么会跑<\/h3>\n<p><strong>PC 与具名 NPC 永不掷士气。<\/strong> 士气只属于无名的多数。<\/p>\n<p>触发时机（任一）：本组首次倒地过半／首领倒下／目睹一次重击致残／被一轮炮击洗过甲板。<\/p>\n<p><strong>士气检定<\/strong>：<code>d20 + 胆魄 + 指挥修正<\/code> vs <strong>12<\/strong>（乌合之众）／<strong>14<\/strong>（老手）／<strong>16<\/strong>（精锐）。<\/p>\n<div class='tbl'><table><thead><tr><th>结果<\/th><th>反应<\/th><\/tr><\/thead><tbody><tr><td>失败 1 次<\/td><td><strong>畏缩<\/strong>：本轮只防御；全组后续检定 −1<\/td><\/tr><tr><td>失败 2 次<\/td><td><strong>溃逃<\/strong>：脱离战斗，弃械者不回归本场<\/td><\/tr><tr><td>失败 3 次／首领倒下且无接替<\/td><td><strong>投降<\/strong>：倒戈者可能被招募（9.9）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【示例】<\/strong> \"钉子\"倒下那一瞬，红隼号六名登船水手还剩四个、HP 都过半。GM 掷 d20+1 vs 12 = 8，失败一次。<strong>畏缩<\/strong>。这一幕没有血流成河，只有人开始回头看舷梯上还剩谁站着。<\/blockquote>\n<h3>【变体·部位与致残】（写实桌推荐启用）<\/h3>\n<p>主干不掷部位。但若你要\"这一剑真的改变了这个人的一生\"，启用本模块。<strong>它与 3.7 的简化 HP 并存，不替换。<\/strong><\/p>\n<ul class='mdlist'><li>每次命中，伤害骰之外<strong>另掷 d20<\/strong> 定部位：1–2 头／3–6 胸／7–9 腹／10–13 持械手／14–17 非持械手／18–20 腿。<\/li><li>部位各有<strong>局部伤值<\/strong>（头1·胸2·腹2·手1·腿2）。累积满即致残：<strong>手归零<\/strong>→武器脱手，双手武器需两回合恢复；<strong>腿归零<\/strong>→倒地且移动减半；<strong>胸/腹归零<\/strong>→昏迷；<strong>头<\/strong>→直接进入濒死。<\/li><li><strong>溢出伤害灌入总 HP<\/strong>；局部伤<strong>不自然恢复<\/strong>，只能靠医术处理。<\/li><li>护甲<strong>只覆盖它覆盖的部位<\/strong>：胸甲 3 点只护胸腹，脑袋和腿照吃。<\/li><li><strong>失血<\/strong>：任意部位伤值 ≥1 且未处理者，战斗结束后每班次 −1 HP。<\/li><li><strong>致残是永久的<\/strong>，除非你愿意花掉一次回港。这正是\"因为他活下来了，所以成为英雄\"的物质基础。<\/li><\/ul>\n<blockquote class='quote'><strong>【历史注】<\/strong> 16–17 世纪的外科处理不了穿透性腹部伤。本模块故意不给\"腹部归零还能救\"的通道。<\/blockquote>\n<h3>NPC 战斗模板<\/h3>\n<p>别给杂兵做卡。一行一个：<\/p>\n<div class='tbl'><table><thead><tr><th>类型<\/th><th>HP<\/th><th>防御<\/th><th>攻击<\/th><th>伤害<\/th><th>特性<\/th><th>士气目标<\/th><\/tr><\/thead><tbody><tr><td><strong>乌合喽啰<\/strong><\/td><td>7<\/td><td>12<\/td><td>+2<\/td><td>1d6<\/td><td>三人并一组结算<\/td><td>12<\/td><\/tr><tr><td><strong>水手／士兵<\/strong><\/td><td>12<\/td><td>14<\/td><td>+3<\/td><td>1d8<\/td><td>—<\/td><td>14<\/td><\/tr><tr><td><strong>老兵刀手<\/strong><\/td><td>16<\/td><td>14<\/td><td>+4<\/td><td>1d8+1<\/td><td>不因单次重击而畏缩<\/td><td>15<\/td><\/tr><tr><td><strong>炮组（4人）<\/strong><\/td><td>12（组）<\/td><td>13<\/td><td>—<\/td><td>见9.5<\/td><td>缺员至2人则装填+1轮<\/td><td>14<\/td><\/tr><tr><td><strong>军官／头目<\/strong><\/td><td>30–52<\/td><td>16<\/td><td>+6<\/td><td>1d10+2<\/td><td><strong>首领光环<\/strong>：3格内友军士气检定+2<\/td><td>16<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>9.2 火器节奏<\/h2>\n<p>火器的设计意图：<strong>伤害高、装填慢、怕水<\/strong>。它不该是默认选择，它是\"我打算在开战前把这一下打准\"的选择。<\/p>\n<div class='tbl'><table><thead><tr><th>武器<\/th><th>伤害<\/th><th>射程(格)<\/th><th>装填<\/th><th>特性<\/th><\/tr><\/thead><tbody><tr><td><strong>燧发手枪<\/strong><\/td><td>2d6<\/td><td>10<\/td><td>1轮<\/td><td>近战距离无视1点护甲<\/td><\/tr><tr><td><strong>短铳／马枪<\/strong><\/td><td>2d6<\/td><td>10<\/td><td>1轮<\/td><td>骑乘可用<\/td><\/tr><tr><td><strong>火绳枪<\/strong><\/td><td>2d8<\/td><td>30<\/td><td><strong>2轮<\/strong><\/td><td>需先花一个动作点燃火绳<\/td><\/tr><tr><td><strong>燧发枪<\/strong><\/td><td>2d8<\/td><td>25<\/td><td>1轮<\/td><td>1670s 后普及；雨天仍劣势<\/td><\/tr><tr><td><strong>多管铳（风琴炮／三眼）<\/strong><\/td><td>2d6×2<\/td><td>10<\/td><td>全轮<\/td><td>一次打完即废，重填需<strong>整场<\/strong><\/td><\/tr><tr><td><strong>手雷／火瓶<\/strong><\/td><td>3d6（2格锥形）<\/td><td>投掷<\/td><td>—<\/td><td><strong>敌我不分<\/strong>，见缠斗误伤<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>通用规则<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>近距离破甲<\/strong>：目标距离 ≤ 射程1/3 时，无视 1 点护甲。<\/li><li><strong>雨、浪、雾<\/strong>：火绳枪<strong>劣势<\/strong>；燧发枪雨天劣势；浸水一律哑火。<\/li><li><strong>卡壳<\/strong>：天然 1 → 花一个动作排除（筋骨+工程 DV11），否则该枪本轮作废。<\/li><li><strong>线列齐射（简版）<\/strong>：≥6 名持枪者编为一阵，由一人指挥（学识+炮术 或 领导）。全阵掷<strong>一次<\/strong>命中（指挥者加值 + 半数士兵技能，上限 +5），成功则每人各掷伤害。<strong>失败即代价<\/strong>——一轮黑烟、暴露位置、装填进度清零。<\/li><li><strong>首轮红利<\/strong>：战斗第一轮的开火射击 <strong>+2 伤害<\/strong>（火枪手把它做成了职业特性，但有备而来者一律适用）。<\/li><\/ul>\n<hr>\n<h2>9.3 海战：轮次、机动与阵位<\/h2>\n<h3>一轮海战里发生什么<\/h3>\n<p><strong>海战轮 = 1 分钟<\/strong>，固定五阶段，顺序不可改：<\/p>\n<blockquote class='quote aside-voice'><strong>① 号令 → ② 阵位 → ③ 机动 → ④ 炮击 → ⑤ 冲撞接舷 → ⑥ 轮末结算<\/strong><\/blockquote>\n<p>（单船遭遇、无风、或纯追逃时，①②可跳过；一旦双方各有两艘以上船，必须走全套。）<\/p>\n<h3>阵位令（多船会战的核心）<\/h3>\n<p><strong>每轮结束，各船长在纸上暗写下一轮的阵位令，同时翻明。<\/strong> 令值决定本轮谁先动。<\/p>\n<div class='tbl'><table><thead><tr><th>阵位令<\/th><th>令值<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>并舷令<\/strong><\/td><td>3<\/td><td>侧舷火力最大化：齐射检定 <strong>+1<\/strong>，代价是转向力减半<\/td><\/tr><tr><td><strong>纵队令<\/strong><\/td><td>2<\/td><td>与同向、间距 ≤2 格的友舰结为<strong>纵队<\/strong>：纵队内每船齐射 <strong>+1 颗伤害骰<\/strong><\/td><\/tr><tr><td><strong>自由令<\/strong><\/td><td>1<\/td><td>无修正，机动全开<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>令值高者先动<\/strong>；相同时<strong>上风者先动<\/strong>。<\/li><li><strong>加成取高不叠<\/strong>：同时满足纵队与并舷条件，只取一档。<\/li><li><strong>旗舰沉没或被俘，全队阵位令上限立刻降为\"自由令\"<\/strong>，直到新旗舰升旗。舰队不是船的数量，是命令链。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注】<\/strong> 暗写同翻是\"计划与变化的动态博弈\"的最小实现。你猜我要抢上风，我猜你猜我要抢上风——到第三轮你们就会开始改主意，而那正是好玩的地方。<\/blockquote>\n<h3>风、帆、速<\/h3>\n<p>战术风档沿用 7.4 的五档，但在海战里<strong>每轮重估<\/strong>（航段级才用 d6 变化骰）：<\/p>\n<div class='tbl'><table><thead><tr><th>相对风向<\/th><th>航速倍率<\/th><th>战术后果<\/th><\/tr><\/thead><tbody><tr><td><strong>顺风<\/strong><\/td><td>×1.25（满帆时追加至 ×1.5）<\/td><td>直线快、转向慢；<strong>侧舷射界受限<\/strong><\/td><\/tr><tr><td><strong>侧顺风<\/strong><\/td><td>×1.1<\/td><td>全能档<\/td><\/tr><tr><td><strong>侧风<\/strong><\/td><td>×1.0<\/td><td>唯一能让全舷炮从容开火的风向<\/td><\/tr><tr><td><strong>侧逆风<\/strong><\/td><td>×0.75<\/td><td>必须收部分帆<\/td><\/tr><tr><td><strong>逆风<\/strong><\/td><td>×0.5 或抢风<\/td><td>见 7.4 抢风航法<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>帆况四档<\/strong>（与 7.4 同名同义，此处只补战术后果）：<\/p>\n<div class='tbl'><table><thead><tr><th>帆况<\/th><th>速度<\/th><th>战术后果<\/th><\/tr><\/thead><tbody><tr><td><strong>满帆<\/strong><\/td><td>×1.0<\/td><td>索具受击时<strong>额外 +1 颗伤害骰<\/strong><\/td><\/tr><tr><td><strong>战斗帆<\/strong><\/td><td>×0.75<\/td><td>摇晃惩罚减半——<strong>炮击的标准帆<\/strong><\/td><\/tr><tr><td><strong>收帆<\/strong><\/td><td>×0.25<\/td><td>免摇晃惩罚；远距射击的前置条件<\/td><\/tr><tr><td><strong>应急帆<\/strong><\/td><td>固定 1 格<\/td><td>无视风向<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>战术速度 = 航速档（7.2）× 风 × 帆 × 海况（7.5）→ 向下取整<\/strong> = 本轮可移动格数。<br><strong>转向<\/strong>：每轮 90°；当速度 ≥ 航速档一半时，可改转 135°。<\/p>\n<p><strong>逆风不是绝路，是代价<\/strong>：抢风需<strong>掌舵 DV14<\/strong>（7.4）。失败即\"顶风停滞\"——本轮速度 0，且在对手脱离射界前你是一块漂浮的靶。<\/p>\n<blockquote class='quote'><strong>【口径声明】<\/strong> 7.4 是<strong>战略航速<\/strong>（一个航段的平均值），本节是<strong>战术航速<\/strong>（一分钟的机动量）。同一张倍率表、两套结算频率——<strong>不是两套规则<\/strong>。<br><strong>修正来源不叠加<\/strong>：同一方向上多个有利/不利条件时，按 <strong>环境 &gt; 状态 &gt; 援助<\/strong> 取一档生效，并由 GM 在掷骰前<strong>申报所取来源名<\/strong>。废除\"数手指头加到七个\"的计数式修正。<\/blockquote>\n<h3>距离带<\/h3>\n<div class='tbl'><table><thead><tr><th>带<\/th><th>格数<\/th><th>可用炮型<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td><strong>接舷<\/strong><\/td><td>0–1<\/td><td>旋转炮、葡萄弹<\/td><td>只能打人员<\/td><\/tr><tr><td><strong>炮程<\/strong><\/td><td>2–8<\/td><td>全部<\/td><td>标准<\/td><\/tr><tr><td><strong>远距<\/strong><\/td><td>9–15<\/td><td>长管、臼炮<\/td><td>需本船<strong>收帆或战斗帆<\/strong><\/td><\/tr><tr><td><strong>地平线<\/strong><\/td><td>16+<\/td><td>—<\/td><td>只能观测<\/td><\/tr><\/tbody><\/table><\/div>\n<p>（对应 3.6 的三态：远距／中距炮战／接舷——四带是三带的细分，不是第四种状态。）<\/p>\n<h3>贯舷（抢 T 字的技术名称）<\/h3>\n<p>若你的开火舷与目标船<strong>首尾轴线夹角 ≤30°<\/strong>，且距离 ≤4 格：本次齐射为<strong>贯舷射<\/strong>。<\/p>\n<ul class='mdlist'><li>命中等级<strong>上升一级<\/strong>（命中→精准，精准→重击）；<\/li><li><strong>部位锁定为艏或艉<\/strong>（不掷 d10 部位表）；<\/li><li>目标下一轮<strong>速度档 −1<\/strong>。<\/li><li>代价：你自己几乎无法同时保持机动——贯舷是\"我用一轮换你三轮\"的买卖。<\/li><\/ul>\n<hr>\n<h2>9.4 战位制与船长号令<\/h2>\n<blockquote class='quote'>这一节实现 3.8 所预告的\"玩家分工即战术\"。<\/blockquote>\n<p>海战里 <strong>PC 每人占一个战位<\/strong>，NPC 补空缺。<strong>空缺的战位按无受训处理<\/strong>（3.2 未受训限制）。一个战位每轮选一项动作——<strong>白名单外的动作不存在<\/strong>。<\/p>\n<h3>六战位动作白名单<\/h3>\n<p><strong>掌舵位<\/strong>（掌舵／机敏）<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>保持航向<\/td><td>自动成功（海况 DV≥17 时须掷）<\/td><\/tr><tr><td><strong>急转 90°／135°<\/strong><\/td><td>掌舵 vs 当轮海况DV；失败：本轮不能移动，并掷一次帆况判定<\/td><\/tr><tr><td><strong>抢风<\/strong><\/td><td>掌舵 DV14；失败＝顶风停滞一轮<\/td><\/tr><tr><td><strong>贴礁走位<\/strong><\/td><td>掌舵 DV16；成功可穿过 ≤2 格宽的间隙，失败船体 2d6<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>帆组位<\/strong>（操帆／机敏）<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>换帆档<\/td><td>一个动作，无检定（海况 ≤DV13）；恶劣海况 DV13<\/td><\/tr><tr><td><strong>海上修帆<\/strong><\/td><td>缝纫／木工 DV13，成功移除\"破洞\"一档；本轮不能再做任何事<\/td><\/tr><tr><td><strong>砍索<\/strong>（对已接舷的敌船）<\/td><td>机敏 DV12；成功使敌船下一轮速度 ×0.5<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>炮组位<\/strong>（炮术／学识）——完整流程见 9.5<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>装填<\/td><td>推进本连装填进度<\/td><\/tr><tr><td><strong>齐射<\/strong><\/td><td>见 9.5<\/td><\/tr><tr><td><strong>瞄准声明<\/strong><\/td><td>指定弹着部位，强制替换部位表掷骰<\/td><\/tr><tr><td>校射<\/td><td>本连下次齐射 +1，代价＝本轮不射击<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>瞭望位<\/strong>（学识／机敏）<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td><strong>测风预警<\/strong><\/td><td>学识+气象 DV12；成功预报下轮风向变化，全船下次检定优势<\/td><\/tr><tr><td><strong>读敌<\/strong><\/td><td>学识 DV12；成功揭露敌船一处弱点（帆况／缺员／吃水），全队下次检定 +2<\/td><\/tr><tr><td>报距<\/td><td>无检定（能见度足够时自动给出距离带）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>跳帮队位<\/strong>（筋骨／剑术）<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td><strong>抛钩<\/strong><\/td><td>接舷 DV14（见 9.6）<\/td><\/tr><tr><td><strong>砍缆<\/strong>（脱离）<\/td><td>机敏 DV12；成功本船脱离，<strong>双方各获一次借机<\/strong><\/td><\/tr><tr><td>待命<\/td><td>登船第一轮其攻击获优势<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>船医位<\/strong>（医术）<\/p>\n<div class='tbl'><table><thead><tr><th>动作<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>救治<\/td><td>对一名濒死者施救（医术 DV13），计一次死亡骰成功<\/td><\/tr><tr><td>稳定<\/td><td>移除一名伤员 1 点局部伤（启用变体时）<\/td><\/tr><tr><td>坐镇<\/td><td>本船士气 +1/轮（船员看见外科桌还在，就知道还有人管他们）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>杂务位（抽水／损管）<\/strong>——无 PC 占据时由 NPC 担任，效率见 9.5 损管表。<\/p>\n<h3>船长号令（每轮一条）<\/h3>\n<p>船长（或代理指挥者）在 <strong>①号令阶段<\/strong> 喊一条，全船生效：<\/p>\n<div class='tbl'><table><thead><tr><th>号令<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>「齐射！」<\/strong><\/td><td>各连可同时开火，即使装填进度差 1（该连伤害 −1 骰）<\/td><\/tr><tr><td><strong>「稳住！」<\/strong><\/td><td>全船本轮所有对抗判定 <strong>+2<\/strong>，代价：本轮不能改变机动<\/td><\/tr><tr><td><strong>「抢修！」<\/strong><\/td><td>损管检定 DV −4，抽水泵效率翻倍<\/td><\/tr><tr><td><strong>「接舷队！」<\/strong><\/td><td>跳帮队本轮攻击 +1、临时 HP +3<\/td><\/tr><tr><td><strong>「砍缆！」<\/strong><\/td><td>立即脱离接舷，双方互获一次借机攻击<\/td><\/tr><tr><td><strong>「抢上风！」<\/strong><\/td><td>本船风档上升一档，持续到改变该航向；<strong>不与\"抢风\"叠加<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>\"我说的算\"<\/strong>（船长原型特性，4.4）：每场景 1 次，命令一名同伴获得优势。<\/p>\n<h3>NPC 船的水手品质<\/h3>\n<div class='tbl'><table><thead><tr><th>品质<\/th><th>装填节奏<\/th><th>损管 DV<\/th><th>士气基准<\/th><\/tr><\/thead><tbody><tr><td><strong>乌合之众<\/strong><\/td><td>2 轮装 1 轮射<\/td><td>14<\/td><td>8<\/td><\/tr><tr><td><strong>老水手<\/strong><\/td><td>1 轮装 1 轮射<\/td><td>12<\/td><td>12<\/td><\/tr><tr><td><strong>精锐／海军正规<\/strong><\/td><td>1 轮装，可抢先射<\/td><td>10<\/td><td>15<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>9.5 炮击、损伤与损管<\/h2>\n<h3>编连<\/h3>\n<p><strong>每 4 门同型炮编为一\"连\"<\/strong>，一连一轮最多一次齐射。<br><strong>余数 ≤2 门时伤害 +1<\/strong>（不成连的零头反而更舍得用）。<\/p>\n<blockquote class='quote'><strong>【口径校验】<\/strong> 海燕号 4 门 = 1 连 = <code>d20+炮术 vs 14 → 3d6<\/code>，与第2章快速流程逐字一致；红隼号 6 门 = 1 连 + 2 门余数 = <strong>3d6+1<\/strong>，亦与 2.4 场景三一致。<\/blockquote>\n<h3>齐射流程（五步）<\/h3>\n<ol class='mdlist'><li><strong>装填<\/strong>：标准 <strong>2 轮<\/strong>（旋转炮／短炮 1 轮；长管 3 轮；臼炮 4 轮）。缺员至半数 → 装填 <strong>+1 轮<\/strong>。<\/li><li><strong>瞄准声明<\/strong>：<\/li><\/ol>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>齐射 DV<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><strong>船体<\/strong><\/td><td><strong>14<\/strong><\/td><td>标准<\/td><\/tr><tr><td><strong>帆索<\/strong><\/td><td><strong>12<\/strong><\/td><td>更易命中；链弹时伤害 ×2<\/td><\/tr><tr><td><strong>甲板人员<\/strong><\/td><td><strong>16<\/strong><\/td><td>最难；葡萄弹专用；会误伤己方<\/td><\/tr><\/tbody><\/table><\/div>\n<ol class='mdlist'><li><strong>修正<\/strong>（全部在掷骰前申报）：<\/li><\/ol>\n<div class='tbl'><table><thead><tr><th>条件<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>目标处于<strong>收帆或战斗帆<\/strong><\/td><td>+2<\/td><\/tr><tr><td>我方占<strong>上风<\/strong><\/td><td>+1<\/td><\/tr><tr><td>距离 <strong>≤4 格<\/strong><\/td><td>+2<\/td><\/tr><tr><td>距离 <strong>&gt;8 格<\/strong><\/td><td>−2；&gt;15 格 不可射<\/td><\/tr><tr><td>我方正在<strong>机动／急转<\/strong><\/td><td>−2<\/td><\/tr><tr><td>晨雾、夜战、大浪<\/td><td><strong>劣势<\/strong><\/td><\/tr><tr><td><strong>同轮第二连<\/strong><\/td><td><strong>−5<\/strong><\/td><\/tr><tr><td><strong>同轮第三连及以后<\/strong><\/td><td><strong>−10<\/strong><\/td><\/tr><tr><td>炮长\"听我口令\"（原型特性）<\/td><td>全连取优，每场海战 1 次<\/td><\/tr><tr><td>炮术大师（天赋）<\/td><td>+1<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>递减梯是硬设计。<\/strong> 它惩罚\"一轮把所有炮打光\"，逼你分两轮打，于是装填节奏成为真正的决策。<strong>别删它。<\/strong><\/blockquote>\n<ol class='mdlist'><li><strong>掷 <code>d20 + 学识或机敏 + 炮术 ≥ DV<\/code> → 命中。<\/strong> 应用 3.2 命中等级。<\/li><li><strong>伤害<\/strong>：基准 <strong>3d6 船体伤害<\/strong>（连级）。命中等级改写弹着质量：<\/li><\/ol>\n<div class='tbl'><table><thead><tr><th>等级<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>重击<\/strong><\/td><td><strong>4d6<\/strong> 且<strong>部位由射方任选<\/strong>（含火药舱）<\/td><\/tr><tr><td><strong>精准<\/strong><\/td><td>4d6<\/td><\/tr><tr><td><strong>命中<\/strong><\/td><td>3d6<\/td><\/tr><tr><td><strong>失手<\/strong><\/td><td>0，但目标须做一次<strong>帆况判定<\/strong>（散弹挂索）<\/td><\/tr><tr><td><strong>险失<\/strong><\/td><td>0，且<strong>射方一侧炮位发生事故<\/strong>（掷 d10，取 8–9 条效果）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>命中部位表（d10）<\/h3>\n<p>弹着于船体后掷 d10。<strong>若射方做了\"瞄准声明\"，则该栏结果强制替换本次掷骰。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>d10<\/th><th>部位<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>艉楼／舵位<\/strong><\/td><td><strong>失舵<\/strong>：下一轮不能转向。海上修补需 <strong>2 班次<\/strong><\/td><\/tr><tr><td>2<\/td><td><strong>主桅／索具<\/strong><\/td><td>帆况降一档，并额外 <strong>−1d10<\/strong> 船体伤害<\/td><\/tr><tr><td>3<\/td><td><strong>前桅<\/strong><\/td><td>帆况降一档<\/td><\/tr><tr><td>4<\/td><td><strong>炮甲板<\/strong><\/td><td>船体伤害 <strong>+1d6<\/strong>；本连下一轮装填 <strong>+1 轮<\/strong><\/td><\/tr><tr><td>5<\/td><td><strong>水线<\/strong><\/td><td><strong>进水 1 级<\/strong>（见下）<\/td><\/tr><tr><td>6<\/td><td><strong>舷侧外壳<\/strong><\/td><td>标准伤害，无附加<\/td><\/tr><tr><td>7<\/td><td><strong>艏楼<\/strong><\/td><td>冲撞／接舷装备损失：本轮抛钩与冲撞 DV <strong>+2<\/strong><\/td><\/tr><tr><td>8–9<\/td><td><strong>人员区<\/strong><\/td><td>船体仅 −1d3，但<strong>一个炮组减员<\/strong>（缺员至半数则装填 +1 轮）<\/td><\/tr><tr><td>10<\/td><td><strong>火药舱<\/strong><\/td><td><strong>（仅重击或瞄准命中可选）<\/strong> d20 ≥15 → 连锁爆炸，船体一次性<strong>减半<\/strong>；否则大火灾势 <strong>2 级<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>弹种<\/h3>\n<div class='tbl'><table><thead><tr><th>弹<\/th><th>用途<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td><strong>实心弹<\/strong><\/td><td>拆船体<\/td><td>标准。水线命中可触发进水<\/td><\/tr><tr><td><strong>链弹<\/strong><\/td><td>拆帆桅<\/td><td>对帆索伤害 <strong>×2<\/strong>；<strong>射程减半<\/strong>；打水线时伤害 −1 骰<\/td><\/tr><tr><td><strong>葡萄弹／case<\/strong><\/td><td>清甲板<\/td><td>2 格锥形；<strong>敌我不分<\/strong>：所有人员机敏豁免 DV15，失败 3d6、成功折半。登船前一轮专用<\/td><\/tr><tr><td><strong>火弹<\/strong><\/td><td>起火<\/td><td>伤害 −1 骰，但<strong>必然引火<\/strong>（火势 1 级）<\/td><\/tr><tr><td><strong>长管远射<\/strong><\/td><td>先手拆索<\/td><td>装填 3 轮、远距可命中；打不出水线伤<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【变体·八向帆理】<\/strong> 想要\"横帆船顶风停船、纵帆船逆风可行\"这一层，整段替换本节的风速表：以<strong>八个罗盘点<\/strong>为轴，横帆船取 艉风×1.0／正横×0.75／艏侧×0.25／<strong>顶风＝停船<\/strong>；纵帆船上表各值改为 ×0.75／1.0／0.4／逆风可抢。<strong>启用后须放弃 9.3 的战术速度公式<\/strong>，两套并行会让每一个决定都变成查表。<\/blockquote>\n<h3>起火与进水：两条倒计时<\/h3>\n<p><strong>火势三级<\/strong>，每轮末结算：<\/p>\n<div class='tbl'><table><thead><tr><th>级<\/th><th>状态<\/th><th>每轮效果<\/th><th>扑救<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>明火<\/td><td>船体 −1<\/td><td>1 人，筋骨 DV11 压回<\/td><\/tr><tr><td>2<\/td><td>蔓延<\/td><td>船体 −1d3；<strong>甲板人员每轮 1d6<\/strong><\/td><td>2 人，DV13<\/td><\/tr><tr><td>3<\/td><td><strong>失控<\/strong><\/td><td>船体 −2d6；全船士气 −1/轮<\/td><td>需损管组与水线同时处理<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>火势 3 级且逼近火药舱<\/strong>：每轮末做全船损管检定（DV 按水手品质表，9.4）；<strong>失败 → 船体直接减半。<\/strong><br>这是海战里唯一能一轮终结一条船的条款——所以它值得你为它专门留一个战位。<\/p>\n<p><strong>进水三级<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>级<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>每轮船体 −1，速度 −1 格；<strong>每 1 级需 1 人持续抽水<\/strong><\/td><\/tr><tr><td>2<\/td><td>速度 −2 格，损管 DV +2，每轮 −1d3<\/td><\/tr><tr><td>3<\/td><td><strong>沉没倒计时 10 轮<\/strong>，每轮 −1d10。进入 7.9 沉没规程<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>止漏<\/strong>：木工 DV14（水下作业 DV 翻倍，且须由受训游泳者执行）。<br><strong>与 7.9 的接口<\/strong>：海战内按\"轮\"结算进水，脱战后自动切换为 7.9 的按\"航段\"结算，不重算。<\/p>\n<hr>\n<h2>9.6 接舷与登船<\/h2>\n<h3>逼靠与钩连<\/h3>\n<div class='tbl'><table><thead><tr><th>步骤<\/th><th>检定<\/th><th>失败<\/th><\/tr><\/thead><tbody><tr><td><strong>抢靠<\/strong><\/td><td>掌舵 vs 对方掌舵（对抗）<\/td><td>撞偏：两船各 1d6 船体，脱开<\/td><\/tr><tr><td><strong>抛钩<\/strong><\/td><td><strong>接舷 DV14<\/strong>（钩索／机敏）；海盗快船\"突袭\"特性 +2<\/td><td>钩索被砍（对方砍索对抗）<\/td><\/tr><tr><td><strong>干舷差<\/strong><\/td><td>高打低：攀爬免检；低爬高：<strong>DV12<\/strong><\/td><td>落海：游泳 DV13，否则开始溺水（2.4 GM侧栏）<\/td><\/tr><tr><td><strong>荡索<\/strong><\/td><td>机敏 <strong>DV14<\/strong>：距离翻倍且<strong>免借机攻击<\/strong><\/td><td>悬在半空成为活靶（防御 −2）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>防舷网<\/strong>：预设的一方，其登舷检定 <strong>+2<\/strong>。<\/p>\n<h3>撞击<\/h3>\n<p><strong>速度 ≥4 格<\/strong>冲入敌船格即触发：<\/p>\n<ul class='mdlist'><li><strong>双方船体各 2d6 + 速度差<\/strong>；<\/li><li><strong>被撞方额外 +2d6<\/strong>；<\/li><li>全船人员机敏豁免 DV12，失败倒地；<\/li><li><strong>撞后自动钩连<\/strong>，直接进入接舷——你把它撞开，也就把自己钉死了。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注】<\/strong> 撞击对<strong>攻方有利<\/strong>，代价是自我损伤同样可观：<strong>轻船撞硬船是净亏<\/strong>。推演数据里这条从未被推翻。别让玩家不看船体就下令。<\/blockquote>\n<h3>甲板战：分段与占位<\/h3>\n<p>甲板按 <strong>艏楼／主甲板／艉楼<\/strong> 三分段处理。<strong>每段最多 2 支登船队<\/strong>——超过即\"挤在一起谁也挥不开刀\"，多出的队伍在舷梯上排队，本轮不能行动。<\/p>\n<ul class='mdlist'><li>默认登船顺序 <strong>艏楼 → 主甲板 → 艉楼<\/strong>；直取艉楼（夺船）需先穿主甲板或走荡索。<\/li><li>甲板战使用 <strong>9.1 个人战斗<\/strong>规则，网格 1格=5尺。<\/li><li><strong>留守与登船的分配是本场最大的战术决定<\/strong>：全部过舷，你的船就没人开炮、没人操帆、没人砍缆。<\/li><li><strong>夺船判定<\/strong>：控制艉楼 <strong>且<\/strong> 对方船长倒下或被逐出。夺船不等于船归你——帆况、进水、士气全部继承。<\/li><\/ul>\n<h3>集团混战（单挑太慢时）<\/h3>\n<p>双方各推<strong>一名代表<\/strong>掷对抗（筋骨 + 武器技能），<strong>人数优势每 10 人给正方案 +1 档<\/strong>。<br>败方损失 1d6 人、后退一格；胜方不损失。<br><strong>PC 可以拒绝代表制<\/strong>——\"我要亲自打\"是用重击与致残风险换来的叙事高光，GM 不该拦。<\/p>\n<hr>\n<h2>9.7 追击与逃逸（双钟）<\/h2>\n<p><strong>追击是海战里最容易写成算术的部分。<\/strong> 所以本章不用距离账，用两口钟。<\/p>\n<h3>结构<\/h3>\n<ul class='mdlist'><li>追方一口钟 <strong>【贴上来】<\/strong>，逃方一口钟 <strong>【拉开】<\/strong>，默认各 <strong>6 格<\/strong>（短程遭遇 4 格，跨洋追击 8 格）。<\/li><li><strong>先填满自己那口的人赢。<\/strong> 填满【贴上来】→ 立即进入接舷（9.6）；填满【拉开】→ 脱离成功。<\/li><li><strong>同轮双满 = 双结局。<\/strong> 你追上了，同时他也甩开了——GM 两个都演，让玩家自己说这一轮结什么尾。<strong>不重掷。<\/strong><\/li><li><strong>追击轮内零借机攻击<\/strong>（隔着两海里借什么）。<\/li><\/ul>\n<h3>五类\"抢优势\"动作<\/h3>\n<p>每轮，每口钟<strong>至多推进 1 格<\/strong>。推进方式：<\/p>\n<div class='tbl'><table><thead><tr><th>类别<\/th><th>谁可用<\/th><th>推进条件<\/th><\/tr><\/thead><tbody><tr><td><strong>操帆<\/strong><\/td><td>双方<\/td><td>掌舵/操帆成功，且净靠近或净拉开 ≥1 格<\/td><\/tr><tr><td><strong>炮击减速<\/strong><\/td><td>追方<\/td><td>命中对方帆索，使其速度档下降<\/td><\/tr><tr><td><strong>地形<\/strong><\/td><td>双方<\/td><td>抢风穿礁道、贴岸走水（各对应 DV16 检定）<\/td><\/tr><tr><td><strong>弃子<\/strong><\/td><td>逃方<\/td><td>抛货减重（每舱位速度 +1）／砍放小艇<\/td><\/tr><tr><td><strong>干扰<\/strong><\/td><td>双方<\/td><td>撒油、断缆、假旗号（对抗）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>对抗成功不推钟——改为\"下次检定 +1 档\"。<\/strong><br>这条是双钟不塌成骰子比赛的关键：<strong>一个动作要么推进张力，要么积累质量，不能两者都拿。<\/strong><\/p>\n<h3>每轮岗位动作白名单（追击版，每席限选 1 项）<\/h3>\n<div class='tbl'><table><thead><tr><th>战位<\/th><th>追击可选动作<\/th><\/tr><\/thead><tbody><tr><td><strong>舵<\/strong><\/td><td>抢风／急转／贴礁<\/td><\/tr><tr><td><strong>帆<\/strong><\/td><td>修帆／砍索（对已接近的敌船）<\/td><\/tr><tr><td><strong>炮<\/strong><\/td><td>点火／齐射（<strong>推荐链弹<\/strong>——追击里打船体不推钟）<\/td><\/tr><tr><td><strong>瞭望<\/strong><\/td><td><strong>测风预警<\/strong>／报浅点<\/td><\/tr><tr><td><strong>号令<\/strong><\/td><td><strong>「抢上风！」<\/strong>（风档升一档，不与抢风叠加）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>写实细节放在哪里<\/h3>\n<p>吃水、潮汐、礁深<strong>不直接填钟<\/strong>——它们通过<strong>减速与绕行改写间距<\/strong>，再由间距推钟。<\/p>\n<blockquote class='quote'><strong>【设计注】<\/strong> 一句判据，跑完一场追击就问自己：<strong>玩家结束时说的是\"差一点\"，还是\"MOV 差多少\"？<\/strong><br>前者说明钟在管张力；后者说明算术塌了，回到本节重读\"不能两者都拿\"。<\/blockquote>\n<hr>\n<h2>9.8 大规模战斗（群战，单页规则）<\/h2>\n<p>三船以上逐船结算会拖垮一桌人。<strong>把战斗降级为\"船队对船队\"，PC 只打关键点。<\/strong><\/p>\n<h3>兵力值<\/h3>\n<blockquote class='quote'><strong>兵力值 = 船体值÷4 + 炮位÷2 + 士气档(0–3)<\/strong>，四舍五入。精锐品质 ×1.5。<br>士气档：≤7→0／8–12→1／13–16→2／17+→3。<\/blockquote>\n<h3>结算环（一个\"战役段\" = 4 个海战轮）<\/h3>\n<ol class='mdlist'><li>双方指挥官各<strong>暗写一条战役令<\/strong>：并舷推进／纵队迂回／分割／保守／脱离。<strong>同时翻明。<\/strong><\/li><li><strong>战役对抗<\/strong>：<code>d20 + 学识或人望 + 领导 + 阵位差值 ≥ 13<\/code> → 本段占优。<\/li><li>占优方对落后方造成 <strong>1d6 × 兵力差<\/strong> 的船体伤害，<strong>分配由落后方自选<\/strong>（不分配则默认砸旗舰）。<\/li><li><strong>两令相克时<\/strong>（分割 vs 保守、迂回 vs 并舷推进），占优方伤害<strong>翻倍<\/strong>。<\/li><\/ol>\n<h3>PC 的关键点<\/h3>\n<p>每段，PC 可选<strong>一个<\/strong>关键点介入（掌舵／炮击／接舷／号令，任选对应战位规则掷<strong>一次<\/strong>）：<\/p>\n<ul class='mdlist'><li><strong>成功 → 本方战役检定 +3；<\/strong><\/li><li><strong>失败 → 按失败铁律，送给对手一个战役段的机会。<\/strong><\/li><\/ul>\n<p>PC 不该在群战里做二十件事，该做<strong>一件有名字的事<\/strong>。<\/p>\n<h3>结束条件<\/h3>\n<p>一方沉／俘／逃 <strong>≥ 半数船只<\/strong>，或任一方指挥官被击杀／旗舰失能 → 该方战败。<br>战败方士气跌破 <strong>8<\/strong> 后，剩余船只开始逐段脱离。<\/p>\n<hr>\n<h2>9.9 战斗之后<\/h2>\n<p><strong>别跳过这一节。海战的重量全在收尾。<\/strong><\/p>\n<h3>战场清点（d20 搜刮表）<\/h3>\n<p>对<strong>已沉或已弃<\/strong>的目标船掷一次（登船夺船者直接取全船清单，不用掷）：<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>所得<\/th><\/tr><\/thead><tbody><tr><td>1–2<\/td><td>空的——船货早在风暴前就转走了（但留下一处<strong>值得追查的线索<\/strong>）<\/td><\/tr><tr><td>3–5<\/td><td>散落的个人财物：1d6×5 银币，无货单可销赃（−30%，见10.5）<\/td><\/tr><tr><td>6–8<\/td><td>船具与备料：1d3 份帆料／索具，可当场修船<\/td><\/tr><tr><td>9–11<\/td><td>给养与淡水：够全船多撑 1d3 天（士气 +1）<\/td><\/tr><tr><td>12–14<\/td><td>一批<strong>可交易货物<\/strong>（掷第10章商品类别）<\/td><\/tr><tr><td>15–16<\/td><td>弹药与火药：本船装填轮数 <strong>−1<\/strong>，持续到打光<\/td><\/tr><tr><td>17–18<\/td><td><strong>文书<\/strong>：提单、通信、委托合同——<strong>这是剧情，不是钱<\/strong>（第10/14章钩子）<\/td><\/tr><tr><td>19<\/td><td><strong>一门没被砸坏的炮<\/strong>：可上船，占 2 舱位<\/td><\/tr><tr><td>20<\/td><td><strong>活的<\/strong>：一名幸存者，怀里抱着不该由他抱着的东西<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>伤员<\/h3>\n<ul class='mdlist'><li>濒死者按 3.7 结算；<strong>战后未处理的重伤者每班次 −1 HP<\/strong>。<\/li><li>启用【部位与致残】变体时，战后须掷一次\"命运骰\"（d20 vs 13）决定是<strong>永久伤疤<\/strong>还是<strong>可恢复<\/strong>。<\/li><li><strong>具名船员会死。<\/strong> 死者会在下一次士气结算里出现一次——不是惩罚，是重量（参见 7.7、11.2）。<\/li><\/ul>\n<h3>俘虏与赎金<\/h3>\n<ul class='mdlist'><li>俘虏需<strong>分出一名船员看押<\/strong>（该员本班次不能做别的）。<\/li><li><strong>赎金谈判<\/strong>：人望+交涉 vs 对方胆魄。赎金额 = <strong>其月薪 × 1d6 × 2 个月<\/strong>。<\/li><li>释放俘虏会进<strong>传闻档<\/strong>（10.8/13.6）：下次在别的港口，你放过的人可能认得你。<\/li><li>处决俘虏：<strong>恶名 +1 档<\/strong>，但本船对敌士气 +2。本书不裁判，只记账。<\/li><\/ul>\n<h3>船体抢修<\/h3>\n<div class='tbl'><table><thead><tr><th>场景<\/th><th>成本<\/th><\/tr><\/thead><tbody><tr><td><strong>海上应急<\/strong><\/td><td>木工 DV13/16，成功每天 1d3 点，每点耗 1 份备料（7.9）<\/td><\/tr><tr><td><strong>港内大修<\/strong><\/td><td><strong>2 银币 + 1 班次 / 点<\/strong>（与 7.9 同口径）<\/td><\/tr><tr><td><strong>换桅<\/strong><\/td><td>40 银币 + 1 天 + 一根桅料（大桅是战役级开销，见10.1）<\/td><\/tr><tr><td><strong>补帆<\/strong><\/td><td>每恢复一档帆况：15 银币 + 1 份帆料；海上缝补只能回一档<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>分赃在修理与欠饷之后<\/strong>（10.7）。这条不写下来，玩家会把每个银币当场分掉，然后在下一个港口把船押给债主。<\/p>\n<hr>\n<h2>9.10 GM 战斗速查（把这一页打印出来）<\/h2>\n<p><strong>个人战<\/strong>：先攻 = 机敏检定 DV10 ｜ 1 动作 + 1 移动 ｜ 命中 <code>d20+属+技 ≥ 13+护甲<\/code> ｜ 重击 ≥+10 或天然20（伤害骰×2）｜ 险失 &lt;−5 或天然1 ｜ 夹击／高地 = 优势 ｜ 掩体 +2／+5 ｜ 倒地：近战优、远程劣 ｜ 杂兵士气 <code>d20+胆魄<\/code> vs 12/14/16<\/p>\n<p><strong>火器<\/strong>：手枪 2d6／10／1轮 ｜ 火绳 2d8／30／<strong>2轮<\/strong> ｜ 近距（≤射程1/3）无视 1 甲 ｜ 雨与浸水 = 哑 ｜ 天然1 卡壳<\/p>\n<p><strong>海战一轮<\/strong>：号令 → 阵位 → 机动 → 炮击 → 冲撞接舷 → 结算<br><strong>速度<\/strong> = 航速档 × 风(1.5/1.25/1.1/1.0/0.75/0.5) × 帆 × 海况，<strong>向下取整<\/strong>；每轮转 90°<br><strong>阵位令<\/strong>：并舷3／纵队2／自由1，暗写同翻；旗舰失 → 全队降为自由令<br><strong>齐射<\/strong>：4 门／连 ｜ 装填 2 轮 ｜ <code>d20+学识或机敏+炮术<\/code> vs <strong>船体14／帆索12／甲板16<\/strong> ｜ <strong>3d6<\/strong> ｜ 第二连 −5、第三连起 −10<br><strong>弹<\/strong>：实心标准 ｜ 链弹 帆索×2、射程半 ｜ 葡萄弹 清甲板、敌我不分（DV15 豁免 3d6）｜ 火弹必引火<br><strong>贯舷<\/strong>：夹角≤30° 且 ≤4格 → 命中档升一级、部位锁艏艉、目标下轮速度档−1<br><strong>起火<\/strong>：1级 −1 ／ 2级 −1d3 + 人员1d6 ／ 3级 −2d6；逼近火药舱检定失败 = 船体减半<br><strong>进水<\/strong>：每级 1 人抽水；3级 = 10 轮沉没倒计时 ｜ 木工 DV14 止漏<br><strong>接舷<\/strong>：掌舵对抗 → 抛钩 DV14 → 干舷 DV12 → 甲板分段每段 ≤2 队<br><strong>撞击<\/strong>：速度 ≥4；双方 2d6 + 速度差，被撞方另 +2d6，自动钩连<br><strong>追击<\/strong>：双钟 6 格 ｜ 每轮各至多 +1 ｜ 先满者胜 ｜ <strong>同轮双满 = 双结局<\/strong> ｜ 对抗成功不推钟，改 +1 档<br><strong>群战<\/strong>：兵力值 = 船体/4 + 炮位/2 + 士气档 ｜ 战役令暗写同翻 ｜ PC 每段一个关键点<\/p>\n<hr>\n<p><em>下一章：把打来的东西变成钱，把抢来的东西变成名声。<\/em><\/p>","text":"炮声最响的那一瞬，没有人记得帆。所有人都只记得：刚才谁在找自己。 本章把第3章的引擎装进真正会死人的场合。它是全书最长的一章，也是主持负担最重的一章——所以它被组织成 一张速查页（9.10）加九个小节 ：跑团时你只需要 9.10。 本章的三条设计立场，先说在前面： 海战是位置游戏。 抢到上风不是\"加值好看\"，是结构性优势——它决定谁先开火、谁能动、谁在挨打时还不了手。 炮击砸船，刀剑砸人。 船体值与HP两条血条永不互相折算（见3.8设计注）。\"保船还是保人\"是真实抉择，不是数值选择题。 船战只有一种血统。 本章的舰船机动走 岗位动作经济 （每名船员每轮一个动作池），不走写实帆理模型。部位、致残、失血、士气崩坏这类\"血很贵\"的规则，全部装在 人和登船队 这一层。两条路线在 9.1 与 9.5 各自显式声明，不混线。 【设计注·为什么不双挂】 曾有两套船战方案摆在一起：一套以\"人在岗位上的选择\"为单位，一套以\"帆与风的物理\"为单位。它们各自内部自洽，但 同时启用会互相抵消 ——前者要求每轮做决定，后者要求每轮算结果。 本作的船战取前者。 后者作为可选变体留在 9.3 末尾的【口径声明】里，供想跑极端写实的桌启用，且启用后必须整段替换，不许挑条款。 9.0 三档尺度对照 档 轮长 地图 单位 用在哪 个人战斗 6秒 1格=5尺 人 甲板混战、港口斗殴、舱内格斗 海战 1分钟 1格=60尺 船 机动、炮击、抢位 群战 不轮算 无图 队 三船以上会战、登陆场 尺度切换是本章最容易翻车的地方 ，一条纪律解决： 人在自己船上算船的单位，人踩上敌船甲板算人的单位。 接舷成功的那一轮，海战轮立刻换成战斗轮——两艘船在战术图上不再移动（已钩死），所有人在甲板格上重排一次先攻。切换不回溯。 【设计注·网格口径】 战术格取 60 尺（约11米），是为了让一场二十分钟的海战能在一张餐巾纸上跑完。距离带因此比\"逐尺推算\"更粗，但 风、帆、射界三件事的取舍精度一点没少 ——玩家真正决策的从来不是\"我动了多少米\"。 9.1 个人战斗 先攻 开局每人掷一次 机敏检定（DV10） ，从高到低排。GM 把所有 NPC 归为若干 行动组 ，每组只掷一次——不要为八个喽啰排八张卡。 掷出 卓越 （≥15）：本回合额外获得一次 自由移动 。 有备而来的一方（设了伏、提前就位） 直接插到最前 ，不掷骰。 先攻序整场固定，除非有人倒地或被击退（重排至末）。 战斗轮结构 每轮，你的回合里你可以： 1 个动作 ＋ 1 次移动 （最多 机敏×5 尺）＋ 任意数量的自由反应 （说话、丢下东西、退一步） 动作清单 ——想做什么，先在这张表上找： 动作 规则 攻击 见下\"攻击流程\" 双武器攻击 主手正常；副手以 劣势 追加一次，伤害骰降一档 装填 火器上弹（9.2）。装填可与移动合并， 不能与攻击合并 瞄准 放弃移动，本回合攻击检定 优势 ；若此时被夹击，瞄准被打断 格挡 本轮 防御 +2 ，并对\"推撞\"免疫；代价是本回合不能攻击 推撞 筋骨 vs 对方筋骨（对抗）。胜：对方倒地并后退一格；负：你自己倒地 缴械 机敏+武器技能 vs 对方筋骨+武器技能。胜：其武器落地距你一步 奔跑 用掉动作，移动×2； 脱离近战时仍引发借机攻击 使用物品 喝药、掏火种、上夹板、点燃火药桶 扶起同伴 机敏+医术 DV13；成功后对方以倒地状态起立，本回合不能再行动 伏低 （反应，非动作） 本轮防御 +2，或对抗一次效果时 +2。每轮限一次 攻击流程 声明目标与武器。 命中 ： d20 + 属性 + 武器技能 ≥ 防御 → 命中 属性取 机敏 （远程、灵巧武器、你比对手快）或 筋骨 （重武器、力量压制），GM 判。 防御 = 13 + 护甲值 + 盾牌(1) + 优势地位修正 伤害 ：武器骰 + 筋骨修正（仅近战）→ 扣 HP。 命中等级决定额外效果 ——直接沿用 3.2 的成功等级，不另立新尺： 命中结果 等级 战场效果 ≥ 防御+10 或 天然20 重击 伤害 骰翻倍 （只乘骰，不乘筋骨修正）；目标本轮承受 劣势 ≥ 防御+5 精准 正常伤害 +1d4，并触发武器的专精特性（若有） ≥ 防御 命中 正常伤害 ≥ 防御−5 失手 无伤害；若目标已在近战距离，你 暴露一次借机攻击 &lt; 防御−5 或 天然1 险失 无伤害，且发生一件对你不利的事：武器脱手／位置暴露／误伤友军（见\"缠斗误伤\"） 天然 20 恒为重击；天然 1 恒为险失。 火器天然 1 额外 卡壳 （见9.2）。 距离、掩体与位置 条件 效果 夹击 （两名敌人在你前后两侧各1格内） 攻击者获 优势 ；被格挡者不获 居高临下 攻击 +2，且不因高度损失移动 掩体：半 目标防御 +2 掩体：四分之三 目标防御 +5 掩体：全 不能瞄准 ——只能靠\"听声\"（学识 DV13 对抗其机敏+潜行）后以劣势射击 倒地 近战对其 优势 ；远程对其 劣势 ；起身要花掉一次移动 浸水 火器全部哑火；攀爬、游泳检定劣势 借机攻击 ：敌人在你相邻格内 主动离开 时，你以反应做一次普通近战攻击。走荡索（9.6）可免。同一敌人每轮只触发一次。 缠斗误伤 ：一次近战攻击的 险失 发生在多人挤靠处（相邻格有 ≥2 名非目标）时， 掷 d4 定位 ：1–2 打空、3 撞到最近的人、4 撞到次近的人。 不由 GM 指定\"剧情上最合理的那位\" ——这是铁律。GM 一旦能指定，玩家就不敢站在同伴身边了。 士气：杂兵为什么会跑 PC 与具名 NPC 永不掷士气。 士气只属于无名的多数。 触发时机（任一）：本组首次倒地过半／首领倒下／目睹一次重击致残／被一轮炮击洗过甲板。 士气检定 ： d20 + 胆魄 + 指挥修正 vs 12 （乌合之众）／ 14 （老手）／ 16 （精锐）。 结果 反应 失败 1 次 畏缩 ：本轮只防御；全组后续检定 −1 失败 2 次 溃逃 ：脱离战斗，弃械者不回归本场 失败 3 次／首领倒下且无接替 投降 ：倒戈者可能被招募（9.9） 【示例】 \"钉子\"倒下那一瞬，红隼号六名登船水手还剩四个、HP 都过半。GM 掷 d20+1 vs 12 = 8，失败一次。 畏缩 。这一幕没有血流成河，只有人开始回头看舷梯上还剩谁站着。 【变体·部位与致残】（写实桌推荐启用） 主干不掷部位。但若你要\"这一剑真的改变了这个人的一生\"，启用本模块。 它与 3.7 的简化 HP 并存，不替换。 每次命中，伤害骰之外 另掷 d20 定部位：1–2 头／3–6 胸／7–9 腹／10–13 持械手／14–17 非持械手／18–20 腿。 部位各有 局部伤值 （头1·胸2·腹2·手1·腿2）。累积满即致残： 手归零 →武器脱手，双手武器需两回合恢复； 腿归零 →倒地且移动减半； 胸/腹归零 →昏迷； 头 →直接进入濒死。 溢出伤害灌入总 HP ；局部伤 不自然恢复 ，只能靠医术处理。 护甲 只覆盖它覆盖的部位 ：胸甲 3 点只护胸腹，脑袋和腿照吃。 失血 ：任意部位伤值 ≥1 且未处理者，战斗结束后每班次 −1 HP。 致残是永久的 ，除非你愿意花掉一次回港。这正是\"因为他活下来了，所以成为英雄\"的物质基础。 【历史注】 16–17 世纪的外科处理不了穿透性腹部伤。本模块故意不给\"腹部归零还能救\"的通道。 NPC 战斗模板 别给杂兵做卡。一行一个： 类型 HP 防御 攻击 伤害 特性 士气目标 乌合喽啰 7 12 +2 1d6 三人并一组结算 12 水手／士兵 12 14 +3 1d8 — 14 老兵刀
