咸肉和水的第四十天做出一顿热食 这是士气的廉价保险 ：有热食 = 士气 +1／昼夜（7.7）。一个航海团的厨子不该是个笑话。 失败落地 ：食物安全吃掉，但 全船骂一晚上 （士气 −1，疲劳累计 +1）。 分支 ： 配给术 （同等补给多撑 1d3 天）／ 腌熏 （食物腐坏判定 +2）／ 解腻 （坏血计数累积速度减半） 渔猎 MGT／FIN ｜ 受训线：下网、设陷阱、猎海鸟 普通 13 困难 16 极难 19 近岸下一网 在无风带猎一只信天翁 在浮冰边上猎一头鲸 接口 ：班次活动中的\"捕鱼／猎海鸟\"两项（7.3 排岗）；成功可使补给 +1 份／人／天。 失败落地 ：空手，而且 耗掉了本班次 ——机会成本就是代价。 分支 ： 延绳 （下网后本班次可另做一次动作）／ 海鸟路 （猎海鸟视为普通难度）／ 潮间 （登陆时补给不受减配影响） 5.7 手艺域（5 项） 木工 MGT ｜ 受训线：船壳修补、桅与桁、做结实的东西 普通 13 困难 16 极难 19 钉一块舱板 海上止漏（DV14，水下翻倍） 用现有木料做一根能撑的临时桅 航海团的命脉。 与工程分界：木归它，机构归工程。 失败落地 ：补住了，但 把别处拆坏了 （船体 −1d3，7.9）。 分支 ： 损管 （止漏 +2）／ 桅工 （换桅时间与价格减半）／ 船上造物 （可用现有木料制作简单器具，见 6.1 自制规则） 铁匠 MGT ｜ 受训线：修理金属件、打造、改火器 普通 13 困难 16 极难 19 修一副舵链的环 锻一块新的锚爪 把一柄断剑重打成一柄可用的刀 船上没有铁匠，但每个港口都有。 这条决定了回港的价值。 失败落地 ：看着修好了—— 在第一次受力时断掉 。 分支 ： 锚与链 （凡涉及锚、链、钩的检定 +2）／ 火器修理 （可排除卡壳、处理走火，并可替代工程检定）／ 急铸 （船上简易浇铸一次铅弹，免除该次弹药消耗） 缝纫 MGT ｜ 受训线：帆的修补与制作 普通 13 困难 16 极难 19 缝一处帆上的破洞 用备料补出一块新帆角 把两面破帆合成一面能用的 与操帆的分工 ：操帆管\"用帆\"，缝纫管\"有帆\"。海上修帆动作可用缝纫执行（9.4）。 失败落地 ：缝住了， 风一吹全裂开 （帆况立刻再降一档）。 分支 ： 帆匠 （帆况修复只需 1 段，且不必额外备料）／ 缝帆索 （加固后索具受击的额外骰对你无效）／ 帆布裁制 （可裁制新帆，见 6.1 自制规则） 制药 WIT ｜ 受训线：蒸馏、药剂、防腐，以及那些违禁的东西 普通 13 困难 16 极难 19 熬一剂退热草汤 制柠檬汁抗坏血 配一剂不会死人的迷药 接口 ：坏血病线（7.8；史实锚——18 世纪才普及柠檬汁，见该节历史注）。药料在第10章属 低库存、高波动 类。 失败落地 ：药是假的，或者 剂量不对 ——病情不变，但全船以为有解了。 分支 ： 柑橘术 （坏血计数可直接延缓，不必每日医术 DV16）／ 迷与麻 （外科手术的疼痛惩罚取消）／ 防腐 （给养腐坏判定 +2，与烹调叠加时取高不叠） 绘图 WIT ｜ 受训线：图、表、像，以及以假乱真 普通 13 困难 16 极难 19 画一张能用的港湾草图 伪造一份带印鉴的通行证图版 凭一段记忆复原一幅被烧掉的图 与海图绘制的分界 ：海图绘制＝测量与制图；绘图＝手艺人能画一切。 伪造文书需要 绘图 + 欺骗 两次检定都过。 失败落地 ：画得太好了，好到 有人想要它 （13.6 的 NPC 会主动来买，或来偷）。 分支 ： 图版伪造 （伪造类 +2）／ 肖像 （凭描述可画出能用于辨认的像）／ 刻版 （可批量印制，一张图变二十张） 5.8 超自然域（1 项，条件开放） 神秘学 WIT ｜ 仅在第11章【模糊】或【显性】档开放 普通 13 困难 16 极难 19 分辨一个传说是真是假 认出这场仪式在做什么 从一句疯话里推出它完整的规则 在【模糊】档下，这项技能的失败也必须给出答案 ——GM 给两个可能的真相，让玩家自己带一个走（11.1）。 分支 ： 传说考 （辨识真伪 +2）／ 仪式基 （可主持仪式，11.4）／ 渊语 （可读懂不该被读的东西，代价见 11.2 心结） 5.9 专长分支总表 左列是玩家能问的问题，右列是 GM 要记住的账。 技能 分支一 分支二 分支三 导航 天文学（移除无星夜劣势） 推算航法（迷航中+2） 潮流读法（河口海峡+2） 操帆 帆装修补（修帆降档） 满帆驾驭（索具额外骰−1） 抢风节拍（抢风+2） 掌舵 上风夺取（号令两次） 浅水直觉（吃水+2） 夜舵（移除夜战劣势） 海图绘制 水深标注（贴礁−2） 抄本生意（行情+1档） 速写（一段完成） 气象 风眼嗅觉（争一动作） 云读（移除浓雾劣势） 季律（已知海域降档） 游泳 冷水耐受 拖带（代被救者掷） 水下手艺（止漏不翻倍） 剑术 招架（格挡不牺牲攻击） 断缆回身（破坏性攻击+2） 单挑熟手（免一对多劣势） 火器 快速装填（手枪自由动作） 稳手（免移动−2） 破甲瞄（1→2） 炮术 弹道学（远距−2改−1） 装填指挥（每场一次−1轮） 链弹专精（免射程减半） 投掷 斧手（+1） 引火手（必引火） 缆手（视同一次协助） 格斗 锁腕（缴械+2免借机） 锁拿（不能呼救） 钝打（改钝击可敲晕） 交涉 内行话（+2） 拖（免一次时限压力） 让步换信息 交易 看货（自动识假） 长期客户（二单+2） 期约（锁价） 欺骗 文书匠（+2免笔迹） 一张脸（二次行骗） 半真话（改判一次） 威吓 船上的铁（对己方+2） 当众（每5人+1，上限+3） 不杀（不涨恶名） 领导 建制（群战+2） 分派（额外协助不占限） 担责（代全船抵一次士气） 表演 乡音（+2） 长活（整段停泊不掉档） 动情（可替代一次交涉） 医术 战地外科（免环境劣势） 疫辨（健康骰+2） 断肢（致残换保命） 博物学 香料与药草（售价+1档） 风向生物（免掷预报） 新种著录（额外+1 XP） 史学 纹章（+2） 档案（免时间惩罚） 旧账（辨伪对抗） 律法 海事状（+2） 合同眼（自动察觉一条） 通行文（换一次豁免） 工程 炮位学（射界放宽一档） 泵与阀（抽水翻倍） 急就章（代木工+2） 语言学 速成（一周期够懂） 黑话（+2） 碑铭（死文字降档） 生存 潜形（免人多劣势） 水边（+2） 静默行军（代掷团队一次） 追踪 海路追踪 时效判断（免掷如实答） 反向（察觉被追） 驯畜 征用（不结仇） 驮运编组（载重+20%） 哨兽（替代瞭望一次／段） 烹调 配给术（多撑1d3天） 腌熏（腐坏+2） 解腻（坏血累积减半） 渔猎 延绳（不占班次） 海鸟路（降为普通） 潮间（补给免减配） 木工 损管（止漏+2） 桅工（换桅减半） 船上造物 铁匠 锚与链（+2） 火器修理 急铸（免弹药一次） 缝纫 帆匠（1段免备料） 缝帆索（索具免额外骰） 帆布裁制 制药 柑橘术 迷与麻（免疼痛惩罚） 防腐（与缝纫取高） 绘图 图版伪造（+2） 肖像 刻版（可量产） 神秘学 传说考（+2） 仪式基 渊语（可读，代价见11.2） 5.10 三十秒速查 掷不掷？ 成败存疑 且 后果重要 → 掷（3.2）。否则直接给。 是线索吗？ 剧情唯一通路 → 永不投骰 （5.0①）。 掷过了吗？ 同一件事、同一段航程 → 不再掷 （5.0②）。 受训了吗？ 专业动作 → 必须受训（3.2／每项技能第一行）。 他到底在意什么？ 任何一次社交检定之前，GM 必须先能回答这个问题——答不出，就说明这个 NPC 还没到出场的时候。 技能定了。接下来是你上船时兜里那点东西，到底值多少。"},{"num":"06","title":"装备与资源","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>没有人买得起一条船。但总有人愿意为了一条船去死——这就是所有权和士气之间的距离。<\/em><\/blockquote>\n<p>本章管三件事：<strong>钱怎么记、东西值多少、以及它们能撑几天。<\/strong><\/p>\n<p>本章的三条设计立场：<\/p>\n<ul class='mdlist'><li><strong>不做流水账。<\/strong> 给养以\"份\"计、货物以\"舱位\"计、弹药以\"轮\"计。你不需要记录第 47 天用了多少升水——但归零的那一刻，后果是硬的（7.8 坏血病、7.9 断料）。<\/li><li><strong>价格只有一个单位。<\/strong> 全部以<strong>银币<\/strong>记账，大额以<strong>金币<\/strong>。这是为了让第十章的贸易章可以直接复用本章每一行。<\/li><li><strong>船不是买来的。<\/strong> 本章会给出一条盖伦的真实价格，你会发现它高到荒谬。那不是设计失误，那是历史的形状——所以第一幕的标题叫\"拿到船\"，而不叫\"买条船\"（14.3）。<\/li><\/ul>\n<hr>\n<h2>6.1 货币与换算<\/h2>\n<h3>本位<\/h3>\n<div class='tbl'><table><thead><tr><th>币<\/th><th>等值<\/th><th>折合纯银<\/th><th>出处与口径<\/th><\/tr><\/thead><tbody><tr><td><strong>1 银币<\/strong><\/td><td>记账本位<\/td><td><strong>≈5.5 克纯银<\/strong><\/td><td><code>[确]<\/code> 1601 年后英国先令（shilling）含银 5.52–5.57 克，本作取 5.5 为单一换算锚<\/td><\/tr><tr><td><strong>1 金币<\/strong><\/td><td>10 银币<\/td><td>≈55 克纯银当量<\/td><td><code>[确]<\/code> 银达克特 1600/1650/1700 = 43.10/49.83/55.17 克；本作取 1700 档，故 1 金币 ≈ 1 达克特<\/td><\/tr><tr><td><strong>1 铜索尔多<\/strong><\/td><td>1/10 银币<\/td><td>≈0.55 克<\/td><td><code>[评]<\/code> 小额找零，游戏内一般不记<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>为什么用克纯银<\/strong>：它是全项目唯一的跨期可比尺度。1450 年的 1 先令和 1730 年的 1 先令购买力差近三倍，但它们的含银量差不到 5%。规则书里所有价格都是\"克纯银折算后取整到银币\"，因此<strong>不随章节内年代漂移<\/strong>——这是取舍，代价是丢掉了价格革命的手感；那个手感由 10.2 的行情骰和 10.1 的波动带来承担。<\/blockquote>\n<h3>历史外币对照（GM 需要\"有那个味道\"时用）<\/h3>\n<div class='tbl'><table><thead><tr><th>外币<\/th><th>折银币<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td><strong>8里亚尔银币（peso / 双柱）<\/strong><\/td><td>4.6 银币<\/td><td><code>[确]<\/code> 25.561 克，1497–1728 单值不变——全期唯一不串档的整币，<strong>海上贸易的事实标准<\/strong><\/td><\/tr><tr><td><strong>荷兰盾（guilder）<\/strong><\/td><td>1.7 银币<\/td><td><code>[确·四锚并立]<\/code> 9.61／9.13／9.52／9.41 克，极差 1.9%，取均值<\/td><\/tr><tr><td><strong>斯图弗（stuiver）<\/strong><\/td><td>0.09 银币<\/td><td><code>[推算]<\/code> ＝盾/20<\/td><\/tr><tr><td><strong>杜卡特（金）<\/strong><\/td><td>10 银币<\/td><td><code>[确]<\/code> 见上<\/td><\/tr><tr><td><strong>雷亚尔（réis，千）<\/strong><\/td><td>13.9 银币<\/td><td><code>[确·两口径并立]<\/code> 76.5／88.5 克，本表采低值，高值见 10.1 葡萄牙航线注<\/td><\/tr><tr><td><strong>里亚尔（real，西）<\/strong><\/td><td>0.58 银币<\/td><td><code>[确]<\/code> 3.195 克<\/td><\/tr><tr><td><strong>马拉维迪（maravedí）<\/strong><\/td><td>0.01–0.02 银币<\/td><td><code>[确]<\/code> 0.094→0.062 克，27 段贬值——<strong>记账用它就是自找麻烦<\/strong>，故游戏中不用<\/td><\/tr><tr><td><strong>阿克切（akçe，奥斯曼）<\/strong><\/td><td>0.05 银币<\/td><td><code>[确·两系并立]<\/code> 高系 0.29／低系 0.23 克<\/td><\/tr><tr><td><strong>匁（日本）<\/strong><\/td><td>0.44–0.55 银币<\/td><td><code>[确·分段]<\/code> 慶長 3.0→元禄 2.4 克；<strong>元禄贬值后禁与前段混价<\/strong><\/td><\/tr><tr><td><strong>两（库平）<\/strong><\/td><td>6.8 银币<\/td><td><code>[确]<\/code> 37.3 克（≤1644 为 36.9，禁混列）<\/td><\/tr><tr><td><strong>英镑（£）<\/strong><\/td><td>18.4–19.1 金币<\/td><td><code>[确·禁跨段]<\/code> 1560=115.1／1601=111.4／项目取整 110.4 克<strong>三值并立<\/strong>，用哪档必须声明<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【口径纪律】<\/strong> 上表的\"并立\"不是含糊，是<strong>强制条款<\/strong>：同一张报价单里出现两种口径时，GM 必须并列写出，不许默默择一。全项目登记在案的未裁双值共 15 项（粮 last 2,016/2,257 公斤、cwt 50.8/54.4 公斤、匁两制……），完整清单在调研卷宗，本书只取其中影响桌面的三项并已在表中标注。<\/blockquote>\n<h3>购买力速感（把数字变成直觉）<\/h3>\n<div class='tbl'><table><thead><tr><th>你口袋里有的<\/th><th>能换到<\/th><\/tr><\/thead><tbody><tr><td><strong>1 银币<\/strong><\/td><td>一人在港一日口粮／火绳一段／约两磅面包<\/td><\/tr><tr><td><strong>10 银币<\/strong><\/td><td>一名新水手的首月预付（7.7）／一柄像样的猎刀<\/td><\/tr><tr><td><strong>20 银币<\/strong><\/td><td>一名角色的全部起始身家（4.7）<\/td><\/tr><tr><td><strong>30 银币<\/strong><\/td><td>一件胸甲<\/td><\/tr><tr><td><strong>80 银币<\/strong><\/td><td>一面敌旗舰的旗（在塔古斯港有人出这个价，也是挑衅，2.4）<\/td><\/tr><tr><td><strong>1 金币（10银）<\/strong><\/td><td>一天非熟练工的两倍日薪<\/td><\/tr><tr><td><strong>100 金币<\/strong><\/td><td>一条二手小卡拉维尔（1615 马六甲实档）——<strong>已经是战役级目标<\/strong><\/td><\/tr><tr><td><strong>1,000 金币<\/strong><\/td><td>一条能跑的新造单桅快船<\/td><\/tr><tr><td><strong>9,000 金币<\/strong><\/td><td>一艘盖伦（见 6.9 船价速查）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【历史注】<\/strong> 伦敦非熟练工日薪约 <strong>0.7–1.8 银币<\/strong>（1500→1700 年间，从 3.85 涨到 10.15 克纯银）<code>[确→推算-加权]<\/code>。面包<strong>不能<\/strong>当价值锚——全库只有伦敦 1.28 克/公斤（约1750）与马德里 2.90 克/公斤（1650s）两个散点，不足以支撑换算 <code>[缺]<\/code>。<\/blockquote>\n<hr>\n<h2>6.2 近战武器表<\/h2>\n<div class='tbl'><table><thead><tr><th>武器<\/th><th>伤害<\/th><th>类别<\/th><th>价格(银)<\/th><th>特性<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>匕首／手术刀<\/strong><\/td><td>1d4<\/td><td>灵巧<\/td><td>2<\/td><td>易藏（不易被搜出）；夹击中可用<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>水手刀／猎刀<\/strong><\/td><td>1d6<\/td><td>灵巧<\/td><td>4<\/td><td>船上万能工具，也是随手就能拿到的东西<\/td><td><code>[确]<\/code> 折算 4–7 银币档<\/td><\/tr><tr><td><strong>短弯刀<\/strong><\/td><td>1d6<\/td><td>灵巧<\/td><td>6<\/td><td>地中海沿岸标配<\/td><td><code>[确]<\/code> 剑类 33.1–41.4 克 → 6–7 银币<\/td><\/tr><tr><td><strong>斧（手斧／投斧）<\/strong><\/td><td>1d6<\/td><td>单手<\/td><td>3<\/td><td><strong>破盾<\/strong>：无视 1 点护甲<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>长矛／枪<\/strong><\/td><td>1d6<\/td><td>双手<\/td><td>2–4<\/td><td><strong>列阵<\/strong>：对冲锋中的坐骑或接舷跳板伤害 <strong>2d6<\/strong>；拥挤舱内不可用<\/td><td><code>[确]<\/code> pike 11.0–21.0 克<\/td><\/tr><tr><td><strong>佩剑<\/strong><\/td><td>1d8<\/td><td>灵巧／重量<\/td><td>7<\/td><td>军官的身份；招架类分支的默认武器<\/td><td><code>[确]<\/code> 1637 官价 41.4 克<\/td><\/tr><tr><td><strong>阔剑／双手剑<\/strong><\/td><td>1d8<\/td><td>双手<\/td><td>12<\/td><td><strong>先攻 −2<\/strong>；破格挡检定 +2<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>钉头锤／狼牙棒<\/strong><\/td><td>1d8<\/td><td>钝击<\/td><td>8<\/td><td>护甲<strong>减半<\/strong>减免（向上取整）；更易造成眩晕<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>接舷战斧（双刃）<\/strong><\/td><td>1d8<\/td><td>双手<\/td><td>9<\/td><td>先攻 −2；对已钩连的目标伤害 +1<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>削铁斩（例：名匠阔剑）<\/strong><\/td><td>1d10<\/td><td>双手<\/td><td>90<\/td><td>特殊：<strong>无视格挡附加 1d8<\/strong>；属传说装备，见 11.4<\/td><td><code>[评]<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>通用规则<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>双手武器<\/strong>：先攻 −2；需要双手，故不能持盾；<strong>可以<\/strong>在腾出手时改单手（伤害骰降一档）。<\/li><li><strong>灵巧武器<\/strong>：攻击用机敏；<strong>重量武器<\/strong>：用筋骨并加其修正。开局声明，整场不换（9.1）。<\/li><li><strong>临时武器（顺手抄起的）<\/strong>：任何舱内物件按 1d4 利刃或钝击算，防御无加成。船上的木栓、滑车、斧柄、整桶的咸肉都是武器。<\/li><li><strong>弹药与刀具的维护<\/strong>：刃具在海水环境每停泊期须做一次保养（木工／铁匠 DV11），否则锈蚀——下一次以该武器检定 <strong>劣势<\/strong>，直到处理。<\/li><\/ul>\n<blockquote class='quote'><strong>【变体·武器 vs 护甲表】<\/strong> 曾考虑引入按武器型对护甲型的逐格查表。否决理由很硬：<strong>那是\"查表地狱\"<\/strong>，一张 8×8 表会把每一次命中变成两分钟。本书只保留三条例外（斧破盾、钝击减半、火器近距破甲），因为它们各自代表一种可被玩家<strong>主动选择<\/strong>的战术，而不是一种需要记忆的账。<\/blockquote>\n<hr>\n<h2>6.3 火器表<\/h2>\n<p><strong>与 9.2 逐字一致<\/strong>——两处若不同，以 9.2 为准。<\/p>\n<div class='tbl'><table><thead><tr><th>武器<\/th><th>伤害<\/th><th>射程(格)<\/th><th>装填<\/th><th>价格(银)<\/th><th>特性<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>燧发手枪<\/strong><\/td><td>2d6<\/td><td>10<\/td><td>1轮<\/td><td>20<\/td><td>近战距离无视 1 护甲<\/td><td><code>[缺]<\/code> 手枪价目全库未获；由短铳档上浮<\/td><\/tr><tr><td><strong>短铳／马枪（harquebus）<\/strong><\/td><td>2d6<\/td><td>10<\/td><td>1轮<\/td><td>8<\/td><td>骑乘与舷侧可用<\/td><td><code>[确]<\/code> c.1580s 8 先令 = 44.2 克<\/td><\/tr><tr><td><strong>火绳枪（musket）<\/strong><\/td><td>2d8<\/td><td>30<\/td><td><strong>2轮<\/strong><\/td><td><strong>19–37（并立）<\/strong><\/td><td>需先花动作点绳；雨天劣势<\/td><td><code>[确·两说]<\/code> 1637 军械局 102.4 克；1632 官价 205.1 克；1645 新模范军仅 55.2 克<\/td><\/tr><tr><td><strong>轻火绳（caliver）<\/strong><\/td><td>2d6+1<\/td><td>25<\/td><td>2轮<\/td><td>13–20<\/td><td>比 musket 轻，可在移动中瞄准一次<\/td><td><code>[确]<\/code> 73.6–110.4 克<\/td><\/tr><tr><td><strong>燧发枪（firelock）<\/strong><\/td><td>2d8<\/td><td>25<\/td><td>1轮<\/td><td>30–50<\/td><td>1670s 后普及；雨天仍劣势但<strong>不哑<\/strong><\/td><td><code>[估]<\/code> 火绳的 1.5–2 倍；1631 枪匠价目 <code>[缺]<\/code><\/td><\/tr><tr><td><strong>多管铳（风琴炮／三眼铳）<\/strong><\/td><td>2d6×2<\/td><td>10<\/td><td>全轮<\/td><td>55<\/td><td>打完即废，重填需整场<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>手雷／火瓶<\/strong><\/td><td>3d6（2格锥）<\/td><td>投掷<\/td><td>—<\/td><td>3<\/td><td><strong>敌我不分<\/strong>（9.1 缠斗误伤）<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>回旋炮（swivel gun）<\/strong><\/td><td>2d8<\/td><td>12<\/td><td>1轮<\/td><td><strong>20 金币<\/strong><\/td><td>装在船舷旋转座上，属船属；接舷前洗甲板首选<\/td><td>见 6.9<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>弹药与发射药（真实到值得记账的那一层）<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>单价<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>铅弹（手持火器）<\/td><td><strong>0.1 银币／发<\/strong><\/td><td><code>[确]<\/code> 1627 官价 1.25 便士/球（每磅 12 球）；零售 0.67 便士/发（1580s）<\/td><\/tr><tr><td>火药（手持）<\/td><td><strong>0.5 银币／发射<\/strong><\/td><td><code>[确]<\/code> 火药 12 便士/磅 = 5.57 克/磅<\/td><\/tr><tr><td>火绳<\/td><td><strong>1 银币／磅<\/strong><\/td><td><code>[确]<\/code> 6.4 便士/磅<\/td><\/tr><tr><td>药筒带（bandoleer，预装 12 份）<\/td><td><strong>3 银币<\/strong><\/td><td><code>[确]<\/code> 1637 3 先令 = 16.6 克<\/td><\/tr><tr><td>叉架（musket rest）<\/td><td><strong>1 银币<\/strong><\/td><td><code>[确]<\/code> 1637 1 先令<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【历史注·药贵于弹】<\/strong> 上表最重要的不是数字，是<strong>比例<\/strong>：一次发射的火药比那颗铅弹贵<strong>五倍<\/strong>。所以\"打不准\"在这条船上是一种可以听见价格的行为，而\"卖火药\"在围困港里是一门生意。火药在 10.1 属<strong>管制品<\/strong>（见 10.4 私掠与违禁）。<\/blockquote>\n<p><strong>船上火炮的价格与弹药<\/strong>见 6.9（那是船的东西，不是人的东西）。<\/p>\n<hr>\n<h2>6.4 护甲表<\/h2>\n<p><strong>护甲值同时是两件事<\/strong>：防御加值（9.1）与伤害减免（3.7）。<strong>本书不拆开<\/strong>——一件甲只做一件事，就少记一张表。<\/p>\n<div class='tbl'><table><thead><tr><th>护甲<\/th><th>护甲值<\/th><th>价格(银)<\/th><th>负重<\/th><th>惩罚<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>布衣／工装<\/strong><\/td><td>0<\/td><td>含在衣物内<\/td><td>—<\/td><td>无<\/td><td><code>[确]<\/code> slop 帆布套装 5 先令 ≈ 1 金币<\/td><\/tr><tr><td><strong>软甲（padded jack）<\/strong><\/td><td>1<\/td><td>5<\/td><td>轻<\/td><td>无<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>皮甲<\/strong><\/td><td>1<\/td><td>10<\/td><td>轻<\/td><td>泡水后须晾干，否则 −1（持续至处理）<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>链甲<\/strong><\/td><td>2<\/td><td>25<\/td><td>中<\/td><td><strong>游泳劣势<\/strong>；被弓与钝击有效穿透（对钉头锤只算 1）<\/td><td><code>[评]<\/code><\/td><\/tr><tr><td><strong>胸甲（corselet，前后片）<\/strong><\/td><td>3<\/td><td>30<\/td><td>重<\/td><td><strong>疲劳累计提前一档<\/strong>（7.8）；游泳必沉<\/td><td><code>[确]<\/code> c.1580s 30 先令 = 165.6 克<\/td><\/tr><tr><td><strong>半甲（含臂甲与盔）<\/strong><\/td><td>3<\/td><td>45<\/td><td>重<\/td><td>同上，另：攀爬与操帆 <strong>劣势<\/strong><\/td><td><code>[评]<\/code> 胸甲 ×1.5<\/td><\/tr><tr><td><strong>全甲板铠<\/strong><\/td><td>4<\/td><td>90<\/td><td>极重<\/td><td>操帆、攀爬、游泳全部禁止；战斗轮移动 −半<\/td><td><code>[评]<\/code> <strong>没人穿着它上桅<\/strong><\/td><\/tr><tr><td><strong>盾（圆盾／塔盾）<\/strong><\/td><td>+1 防御<\/td><td>5／<strong>40<\/strong><\/td><td>中<\/td><td>塔盾对远程额外 +1；<strong>被破盾武器无视<\/strong><\/td><td><code>[确]<\/code> 1637 塔盾 £2/面 = 220.8 克；圆盾 <code>[评]<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>通用规则<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>护甲只减它覆盖的部位<\/strong>（启用 9.1 部位变体时）。主干规则下，护甲值直接减在伤害上，最低 0。<\/li><li><strong>钝击减半<\/strong>：钉头锤、坠落、撞击、炮木碎片——护甲值<strong>减半后向上取整<\/strong>。<\/li><li><strong>火器近距破甲<\/strong>：≤射程 1/3 时无视 1 点（3.7、9.2）。<\/li><li><strong>盔甲不是船甲<\/strong>：船体的减免走 7.1 与 9.5，永不与个人护甲互相折算。<\/li><li><strong>穿上与脱下<\/strong>：穿甲需 <strong>2 个战斗轮<\/strong>（有人协助则 1 轮）；脱甲 1 动作。在船上，多数人选择不脱。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注·为什么胸甲只有 3 点】<\/strong> 因为 HP = 6 + 筋骨×2，典型 12 点。护甲 3 点意味着<strong>它能让你多挨四分之一的拳头<\/strong>，而代价是你在桅杆上会掉下来。这是一次真实的取舍，不是数值堆叠。想要更厚，就去买一份\"我不上桅\"的生活。<\/blockquote>\n<hr>\n<h2>6.5 航海仪器（<strong>本节含一处必须声明的数据缺口<\/strong>）<\/h2>\n<blockquote class='quote'><strong><code>[缺]<\/code> 声明<\/strong>：本项目全部物价考据（12,044 行数据底座、五类军火与船用品细册）中，<strong>没有任何一条航海仪器的价格记录<\/strong>——四十个商品域分类里没有\"仪器\"这一域。<strong>本节的价钱是设计值 <code>[评]<\/code>，不是考据值。<\/strong> 若你要跑严格考据桌，请按 7.8 的历史注精神自行查档，并把结果写进你的船志。<\/blockquote>\n<div class='tbl'><table><thead><tr><th>仪器<\/th><th>价(金)<\/th><th>效果<\/th><th>缺失后果<\/th><\/tr><\/thead><tbody><tr><td><strong>罗盘<\/strong><\/td><td>3<\/td><td>阴天与夜间导航不再因\"无地标\"额外升档<\/td><td>无罗盘：无图沿岸 DV 由 16 升至 19<\/td><\/tr><tr><td><strong>沙漏（半时／段漏）<\/strong><\/td><td>2<\/td><td>班次计时与速测（\"报距\"免检）<\/td><td>无沙漏：航速估算劣势，偏航 1d6×2 → 1d6×3<\/td><\/tr><tr><td><strong>测深锤<\/strong><\/td><td>1<\/td><td>近岸水深与底质可读；贴礁走位 DV −2<\/td><td>无：礁区一律 DV +2<\/td><\/tr><tr><td><strong>星盘／十字仪<\/strong><\/td><td>8<\/td><td>测天定位可行（7.6 表\"有图+能见度好\"档）<\/td><td>无：晴天定位 13 → 16<\/td><\/tr><tr><td><strong>象限仪<\/strong><\/td><td>5<\/td><td>纬度测量；同上，但精度略低<\/td><td>无：同上<\/td><\/tr><tr><td><strong>背杆（backstaff）<\/strong><\/td><td>6<\/td><td>比星盘更适合船上用：测天定位<strong>移除\"船体摇晃\"劣势<\/strong><\/td><td>无：测天定位在恶劣海况劣势<\/td><\/tr><tr><td><strong>望远镜<\/strong><\/td><td>20<\/td><td>瞭望距离 +2 带；读敌 DV −2<\/td><td>无：16 格外只能报\"有船\"，报不出\"什么船\"<\/td><\/tr><tr><td><strong>全套海图（本海域）<\/strong><\/td><td>15<\/td><td>7.6 首档（DV10）；含浅点与锚地<\/td><td>无：见 7.6 逐级升难<\/td><\/tr><tr><td><strong>自制海图（你画的）<\/strong><\/td><td>工时<\/td><td>与购入海图等效，但<strong>只有你信它<\/strong>（见 8.1）<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>替代路线：以工时定价（考据缺口的合法填补法）<\/strong><\/p>\n<p>若你不想接受上面的设计值，用这条规则自造：<\/p>\n<blockquote class='quote'><strong>仪器价 = 工匠日薪 × 工时日数<\/strong>（先令折银币，日薪见 6.6）。一台星盘 ≈ 一名仪器匠 <strong>15 天<\/strong> × 2.5 银币 = 37 银币 ≈ <strong>4 金币<\/strong>——与表值同量级但更便宜；望远镜 ≈ 40 天 × 3 银币 = <strong>12 金币<\/strong>，且<strong>全船只有那一座港口造得出来<\/strong>。<br>这条规则附带一个更好的游戏效果：<strong>仪器成为港口的性格，而不是一行价格。<\/strong><\/blockquote>\n<hr>\n<h2>6.6 薪饷表（人和船的年成本）<\/h2>\n<p><strong>默认单位：银币／月<\/strong>。所有数值直接来自四国海军与商船的实档 <code>[确]<\/code>，并按本作银币折算。<\/p>\n<div class='tbl'><table><thead><tr><th>职务<\/th><th>月薪(银)<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td><strong>船童／见习（boy）<\/strong><\/td><td>7–10<\/td><td><code>[确]<\/code> VOC 少年 38 克；英海军 boy 52.9 克<\/td><\/tr><tr><td><strong>半成手水手<\/strong><\/td><td>9<\/td><td><code>[确]<\/code> VOC 48 克<\/td><\/tr><tr><td><strong>普通水手（ordinary seaman）<\/strong><\/td><td>19<\/td><td><code>[确]<\/code> 英海军 105.8 克；四国正规收敛于 94–134 克（极差 &lt;1.5 倍）<\/td><\/tr><tr><td><strong>熟练水手（able seaman）<\/strong><\/td><td>24<\/td><td><code>[确]<\/code> 133.7 克<\/td><\/tr><tr><td><strong>陆手（landman）<\/strong><\/td><td>18<\/td><td><code>[确]<\/code> 100.2 克<\/td><\/tr><tr><td><strong>帆匠<\/strong><\/td><td>24<\/td><td><code>[确]<\/code> VOC 134 克<\/td><\/tr><tr><td><strong>文书／记账<\/strong><\/td><td>28<\/td><td><code>[确]<\/code> VOC 154 克<\/td><\/tr><tr><td><strong>厨子<\/strong><\/td><td>37<\/td><td><code>[确]<\/code> VOC 202 克（<strong>别笑<\/strong>）<\/td><\/tr><tr><td><strong>水手长／炮长<\/strong><\/td><td>38–81<\/td><td><code>[确]<\/code> VOC 211 克；英海军匠级 222.8–445.6 克<\/td><\/tr><tr><td><strong>木匠<\/strong><\/td><td>52<\/td><td><code>[确]<\/code> VOC 288 克；<strong>船上第二重要的人<\/strong>（7.9）<\/td><\/tr><tr><td><strong>大副／引水<\/strong><\/td><td>63<\/td><td><code>[确]<\/code> VOC 346 克<\/td><\/tr><tr><td><strong>船长<\/strong><\/td><td>73–175<\/td><td><code>[确]<\/code> 英海军 403 克；VOC 960 克<\/td><\/tr><tr><td><strong>舰队司令<\/strong><\/td><td>2,268<\/td><td><code>[确]<\/code> 1666 英海军上将 12,477 克——<strong>这是另一个数量级的存在<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>三条硬规则<\/strong>：<\/p>\n<ol class='mdlist'><li><strong>军官的真实收入 = 名义 × 1.8–2.1。<\/strong> <code>[确→评]<\/code> 差额来自\"特权私货\"（艉舱带货、代售、免税份额）。这是 10.4 走私动机的历史根基，不是背景装饰。<\/li><li><strong>欠饷一月 → 士气 −10<\/strong>（换算到本作 0–20 尺：<strong>-5<\/strong>，且此后每段哗变骰 +2，见 7.7）。<code>[确]<\/code> 这是各国海军共同的引信。<\/li><li><strong>新手折扣 40–55%、老手溢价 2.5–4 倍。<\/strong> <code>[确]<\/code> 所以\"我认识一个便宜的水手\"这条传闻永远有代价。<\/li><\/ol>\n<p><code>[缺]<\/code> <strong>翻译、向导、铁匠<\/strong>属独立薪级序列，全库未获。向导唯一可用口径为 <code>[估]<\/code> 脚夫日薪 × 1–1.5。GM 若需要，直接用\"日薪 ×2 且他不一定可信\"。<\/p>\n<hr>\n<h2>6.7 补给与消耗<\/h2>\n<h3>人<\/h3>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>每昼夜<\/th><th>份数换算<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>食物<\/strong><\/td><td><strong>2 份<\/strong>（3.6／7.3 已定）<\/td><td>1 份 = 0.3 银币<\/td><td>基准取自四体系实档，见下表<\/td><\/tr><tr><td><strong>淡水<\/strong><\/td><td><strong>4 升<\/strong><\/td><td>4 升 = 0.2 银币<\/td><td><code>[确·量]<\/code> 葡 carreira 约 1.9 升/人/日，VOC 1 kan/日，备货 <strong>400 升/人/整程<\/strong>（占备货 77%）<\/td><\/tr><tr><td><strong>酒／啤酒配给<\/strong><\/td><td>1 品脱–1 加仑<\/td><td>0.15–0.3 银币<\/td><td><code>[确·两说]<\/code> 英海军 1 加仑啤酒/日；VOC 1 或 2 升/日<strong>未裁<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>四体系实档对照（每人每日，折银币）<\/strong> <code>[确]<\/code><\/p>\n<div class='tbl'><table><thead><tr><th>体系<\/th><th>硬饼<\/th><th>肉<\/th><th>水<\/th><th>日成本(银)<\/th><th>热量<\/th><\/tr><\/thead><tbody><tr><td><strong>英海军 1677<\/strong><\/td><td>1 磅<\/td><td>牛肉 2 磅×4日/周；猪肉+豌豆×2日；鳕鱼×3日<\/td><td>以酒代水，清水定额 <code>[缺]<\/code><\/td><td><strong>0.72<\/strong>（海上）／0.63（港内）<\/td><td>≈5,100 kcal<\/td><\/tr><tr><td><strong>西班牙 Indies 1626<\/strong><\/td><td>1.5 磅（短缺时 1 磅，−33%）<\/td><td>腌猪肉 6 盎司（19 日/月）<\/td><td><code>[缺]<\/code><\/td><td><strong>0.99–1.08<\/strong><\/td><td>3,967 kcal，蛋白 118.7 克，<strong>维生素 C = 0<\/strong><\/td><\/tr><tr><td><strong>VOC<\/strong><\/td><td>3–5 磅/周（≈264 克/日）<\/td><td>330+660 克/周<\/td><td>1 kan/日<\/td><td><strong>0.8–2.2<\/strong> <code>[估·两案]<\/code><\/td><td>2,000–2,500 kcal<\/td><\/tr><tr><td><strong>葡 carreira<\/strong><\/td><td>≈0.76 千克/日<\/td><td>4 个月份<\/td><td>≈1.9 升/日<\/td><td><strong>≈0.51<\/strong> <code>[估·代理]<\/code><\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>全项目基准取 <strong>1 银币/人/昼夜<\/strong>（海上），港内 0.8。上限带 <strong>0.7–1.4<\/strong> 并立 <code>[确·两说]<\/code>——围城、封锁、飓风季按上限。<br><strong>注意\"事务长磅\"<\/strong>：<code>[确]<\/code> 海军事务长的磅 = 14 盎司，比市磅短 <strong>12.5%<\/strong>。这就是\"配给没错，但你饿\"的制度原因，也是 10.3 里一条可查的贪腐线索。<\/blockquote>\n<h3>减配与断供<\/h3>\n<div class='tbl'><table><thead><tr><th>状态<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>配给减半<\/strong><\/td><td>士气 −1/昼夜（7.7）；筋骨检定劣势持续到恢复<\/td><\/tr><tr><td><strong>断粮<\/strong><\/td><td>士气 −2；每昼夜 1 点环境伤害（从第 3 天起）<\/td><\/tr><tr><td><strong>断水<\/strong><\/td><td>士气 −3；每昼夜 <strong>2<\/strong> 点环境伤害，第 2 天起检定<\/td><\/tr><tr><td><strong>只有酒没有水<\/strong><\/td><td>短期不渴，但疲劳累计 +1/昼夜，且坏血计数照常累积<\/td><\/tr><tr><td><strong>长期无新鲜食物<\/strong><\/td><td>10 天后进入坏血病计数（7.8）<\/td><\/tr><tr><td><strong>喝了变质水<\/strong><\/td><td>痢疾判定（vs DV15）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>烧水<\/strong>。这一条不需要检定，值千金（7.8）。<\/blockquote>\n<h3>船<\/h3>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>消耗<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><strong>备料（帆料／木料／索具）<\/strong><\/td><td>以\"份\"计，1 份占 1 舱位<\/td><td>海上修帆 1 份、止漏 1 份、换桅 3 份<\/td><\/tr><tr><td><strong>炮弹药<\/strong><\/td><td>以\"轮\"计<\/td><td>见 6.9<\/td><\/tr><tr><td><strong>沥青／焦油（保养）<\/strong><\/td><td>每停泊期 1 份<\/td><td>不做则下一次漏水判定 DV +2<\/td><\/tr><tr><td><strong>缆绳<\/strong><\/td><td>可被砍、可被弃（断缆＝弃锚）<\/td><td>每船 2 份备用<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>6.8 载重与货舱<\/h2>\n<p><strong>人力负重 = 筋骨 × 10 斤<\/strong>（约 ×5 公斤）。<\/p>\n<div class='tbl'><table><thead><tr><th>筋骨<\/th><th>可背<\/th><th>可拖<\/th><th>可抬（两人）<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>10 斤<\/td><td>不移动<\/td><td>20 斤<\/td><\/tr><tr><td>3<\/td><td>30 斤<\/td><td>60 斤<\/td><td>60 斤<\/td><\/tr><tr><td>4<\/td><td>50 斤<\/td><td>100 斤<\/td><td>100 斤<\/td><\/tr><tr><td>5<\/td><td>80 斤<\/td><td>160 斤<\/td><td>160 斤<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>负重档位<\/strong>：≤½ 上限＝无惩罚；＞½＝<strong>移动减半、潜行与体操类劣势<\/strong>；＞上限＝移动 1 格且所有检定劣势。<\/p>\n<p><strong>船货以\"舱位\"计，不逐件称重<\/strong>（7.1 已定）：<\/p>\n<blockquote class='quote aside-voice'><strong>1 舱位 = 1 类商品（一整批）｜或 2 段补给｜或 1 份备料<\/strong><\/blockquote>\n<ul class='mdlist'><li>载人：<strong>每 2 名额外人员 = 1 舱位<\/strong>（含俘虏，9.9）。<\/li><li>炮：<strong>每门上船炮 = 2 舱位<\/strong>（含弹与架）。<\/li><li>小艇：<strong>占本船 2 舱位<\/strong>，或拖带（拖带时速度 −1 格，见 7.10 弃子）。<\/li><li><strong>超重<\/strong>：装载 &gt; 舱位上限 → <strong>吃水下降一档<\/strong>，所有机动 DV +2，抢风与搁浅风险按 7.10 处理。<\/li><\/ul>\n<blockquote class='quote aside-voice'><strong>【设计注·为什么故意不做称重】<\/strong> 因为\"称重\"会让玩家停止拿东西，而\"拿不动就得选\"会让玩家开始吵架。<strong>舱位的价值在于它是一个社交装置。<\/strong><\/blockquote>\n<hr>\n<h2>6.9 船具、火炮与修理材料<\/h2>\n<h3>船用品价格（这一层是全项目考据最扎实的部分）<\/h3>\n<p><code>[确]<\/code> 除注明外均为折算值，单位银币。这些是<strong>船的东西<\/strong>，与 6.2–6.4 的人用装备分账管理。<\/p>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>价格<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>橡木（船材）<\/td><td><strong>0.07 银币/公斤<\/strong><\/td><td><code>[确·两说]<\/code> \"吨\"作 load 还是 cwt 未裁；本表按公斤<\/td><\/tr><tr><td>铁料<\/td><td>0.08–0.11 银币/公斤<\/td><td><code>[确]<\/code> 0.43–0.60 克/公斤<\/td><\/tr><tr><td>铅<\/td><td>0.12 银币/公斤<\/td><td><code>[确]<\/code><\/td><\/tr><tr><td>大麻／索具纤维<\/td><td>0.18–0.29 银币/公斤<\/td><td><code>[确]<\/code> 0.98–1.62 克/公斤<\/td><\/tr><tr><td>缆绳（成品）<\/td><td>0.24 银币/公斤<\/td><td><code>[确]<\/code> 1.30 克/公斤<\/td><\/tr><tr><td>旧索（回购料）<\/td><td><strong>0.27→0.69 银币/公斤<\/strong><\/td><td><code>[确]<\/code> 1.46→3.80 克/公斤，<strong>三百年涨了两倍半<\/strong>——17 世纪索具是硬通货<\/td><\/tr><tr><td>锚<\/td><td><strong>0.11–0.19 银币/公斤<\/strong><\/td><td><code>[确]<\/code> 0.58–1.04 克/公斤；一具 200 公斤主锚 ≈ <strong>25 银币<\/strong>，一条船的锚具 ≈ 200 银币<\/td><\/tr><tr><td>帆布（普通，Olron）<\/td><td><strong>14–15 银币/匹<\/strong><\/td><td><code>[确]<\/code> 79.5–83 克/匹（1515）<\/td><\/tr><tr><td>帆布（优等，Poldavys）<\/td><td><strong>18 银币/匹<\/strong><\/td><td><code>[确]<\/code> 99.4 克<\/td><\/tr><tr><td>帆布（船用重帆）<\/td><td><strong>25–30 银币/匹<\/strong>（Ipswich）／<strong>56 银币/捆<\/strong>（Vitery）<\/td><td><code>[确]<\/code> 138–166 克/匹；305.7 克/捆（≈4.6 米/匹口径）<\/td><\/tr><tr><td><strong>成套船帆<\/strong><\/td><td><strong>2,260 银币 ≈ 226 金币<\/strong><\/td><td><code>[确]<\/code> 1633 年 12,420 克/套 → <strong>一条船的帆等于一条小船<\/strong><\/td><\/tr><tr><td>大桅（一根）<\/td><td><strong>2,600–3,100 银币 ≈ 260–310 金币<\/strong><\/td><td><code>[确]<\/code> 1588 年 14,352–17,124 克/根<\/td><\/tr><tr><td>焦油<\/td><td>1.3–2.5 银币/公斤<\/td><td><code>[确·两说]<\/code> 瑞典产地 7–13.5 克/公斤 vs 英海军 last 口径 0.72–0.85 克/升——<strong>异物同名，禁并价<\/strong><\/td><\/tr><tr><td>沥青<\/td><td>0.04–0.07 银币/公斤<\/td><td><code>[确]<\/code> 0.20–0.41 克；桶容 <code>[估]<\/code><\/td><\/tr><tr><td>松脂<\/td><td>0.16–0.26 银币/公斤<\/td><td><code>[确]<\/code><\/td><\/tr><tr><td>牛脂／鲸油（灯油）<\/td><td>0.12–0.20／0.39 银币/公斤<\/td><td><code>[确]<\/code> 鲸油 2.17 克/公斤<\/td><\/tr><tr><td>蜡烛<\/td><td>0.32–1.15 银币/公斤<\/td><td><code>[确]<\/code> 1.74→6.32 克，<strong>三百年涨了四倍<\/strong><\/td><\/tr><tr><td>铁钉（按箱）<\/td><td>6 银币/箱<\/td><td><code>[评]<\/code> 船上永远缺的东西<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>一句话记住这节<\/strong>：<strong>帆和桅是钱，油和麻是钱，铁是最不起眼的钱。<\/strong> 所以海上捡一条空船，最值钱的是它的索具和锚，不是它的货。<\/blockquote>\n<h3>舰炮与弹药<\/h3>\n<p><strong>换算基准<\/strong>：1 英镑 = 20 先令 = <strong>20 银币<\/strong> = <strong>2 金币<\/strong>（<code>[确]<\/code> 1601 年后币制）。<\/p>\n<div class='tbl'><table><thead><tr><th>炮型<\/th><th>伤害<\/th><th>射程(格 近/中/远)<\/th><th>装填<\/th><th>炮组<\/th><th>炮价(青铜)<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>回旋炮<\/strong>（舷墙小炮）<\/td><td>2d8<\/td><td>4／8／12<\/td><td>1轮<\/td><td>1<\/td><td>20 金币<\/td><td><code>[评]<\/code> 4 磅以下档下取<\/td><\/tr><tr><td><strong>4 磅猎炮（falcon）<\/strong><\/td><td>2d8<\/td><td>4／9／14<\/td><td>1轮<\/td><td>1<\/td><td><strong>107 金币<\/strong><\/td><td><code>[确]<\/code> 1637 官价 £53 5s<\/td><\/tr><tr><td><strong>6 磅赛刻尔（saker）<\/strong><\/td><td>3d8<\/td><td>5／12／20<\/td><td><strong>2轮<\/strong><\/td><td>2<\/td><td><strong>240 金币<\/strong><\/td><td><code>[确]<\/code> £119 8s<\/td><\/tr><tr><td><strong>9–12 磅寇非林（culverin）<\/strong><\/td><td>4d10<\/td><td>6／15／25<\/td><td>3轮<\/td><td>3<\/td><td><strong>640 金币<\/strong><\/td><td><code>[确]<\/code> £318 12s<\/td><\/tr><tr><td><strong>臼炮／榴弹炮<\/strong><\/td><td>6d6（曲射）<\/td><td>10–30<\/td><td>4轮<\/td><td>4<\/td><td>480 金币<\/td><td><code>[确]<\/code> 参照 demi-culverin £238 19s<\/td><\/tr><tr><td><strong>24 磅巨炮（cannon of 7）<\/strong><\/td><td>6d10<\/td><td>5／13／22<\/td><td>4轮<\/td><td>5<\/td><td>960 金币<\/td><td><code>[确]<\/code> £477 16s<\/td><\/tr><tr><td><strong>铸铁同款<\/strong><\/td><td>同上<\/td><td>同上<\/td><td><strong>+1 轮<\/strong><\/td><td>同上<\/td><td><strong>青铜的 1/10–1/12<\/strong>（culverin 仅 <strong>67 金币<\/strong>）<\/td><td><code>[确]<\/code> 铸铁 culverin £33 6s8d；<strong>但炸膛风险骰 +1 档<\/strong>（9.5 险失）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>铸铁炮是穷人舰队的答案<\/strong>：便宜十倍、慢一轮、随时可能把自己的炮组送上天。私掠船与海盗快船大量用铸铁，海军制式用青铜——<strong>这一条能立刻读出你面对的是谁。<\/strong><\/blockquote>\n<p><strong>炮弹与发射药<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>单价<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>实心弹（以 6 磅计）<\/td><td><strong>0.7 银币／发<\/strong><\/td><td><code>[确]<\/code> 铅 2–2.85 便士/磅，6 磅球 ≈12–17 便士，含浇铸工<\/td><\/tr><tr><td><strong>发射药<\/strong><\/td><td><strong>≈ 炮磅数 × 1 银币／发射<\/strong>（6 磅炮＝6 银币）<\/td><td><code>[确]<\/code> 火药 12 便士/磅 ＝ 1 银币/磅；发射药重 ≈ 弹重<\/td><\/tr><tr><td>链弹<\/td><td><strong>2 银币／发<\/strong><\/td><td><code>[确]<\/code> 约为实心的 3 倍<\/td><\/tr><tr><td>葡萄弹／case<\/td><td><strong>1.5 银币／发<\/strong><\/td><td><code>[确]<\/code> 约为实心的 2 倍<\/td><\/tr><tr><td>火弹<\/td><td>2 银币／发<\/td><td><code>[评]<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>一次 4 门 6 磅连的齐射成本 ≈ 27 银币 ≈ 一名熟练水手的整月薪饷。<\/strong><br>所以\"我再打一轮\"在船长嘴里是<strong>预算决定<\/strong>，不是动作决定。GM 在长战役里应当把这个数报出来——玩家会立刻变得谨慎，那正是设计想要的。<br><strong>一条 6 炮船的标准携弹（每门 60 发）本身就值约 2,000 银币<\/strong>，接近全船炮价的一半。弹药不是补给，是<strong>已经烧掉的预算<\/strong>。<\/blockquote>\n<h3>船价速查（为什么第一幕叫\"拿到船\"）<\/h3>\n<p><code>[确]<\/code> 按吨位单价折算：商船船体 175 银币/吨（fluyt 961 克/吨）、全装商船 ≈200 银币/吨、含武备东印度船 290 银币/吨、主力战舰 341 银币/吨、一级战列舰 1,154 银币/吨。<\/p>\n<div class='tbl'><table><thead><tr><th>船型（7.2）<\/th><th>估算吨位<\/th><th>市价<\/th><th>直觉<\/th><\/tr><\/thead><tbody><tr><td><strong>二手小卡拉维尔<\/strong><\/td><td>40–80 吨<\/td><td><strong>100–300 金币<\/strong><\/td><td><code>[确]<\/code> 1615 马六甲实档二手卡瑞夫 5,480 克 ≈ 100 金币<\/td><\/tr><tr><td><strong>单桅快船<\/strong><\/td><td>60 吨<\/td><td><strong>1,000 金币<\/strong><\/td><td>一船人一辈子也攒不出来<\/td><\/tr><tr><td><strong>双桅横帆船<\/strong><\/td><td>120 吨<\/td><td><strong>2,000 金币<\/strong><\/td><td>同上<\/td><\/tr><tr><td><strong>卡拉维尔帆船<\/strong><\/td><td>90 吨<\/td><td><strong>1,600 金币<\/strong><\/td><td>同上，且贵在有炮<\/td><\/tr><tr><td><strong>海盗快船<\/strong><\/td><td>100 吨<\/td><td><strong>2,500 金币<\/strong><\/td><td>武备占比高<\/td><\/tr><tr><td><strong>盖伦帆船<\/strong><\/td><td>450 吨<\/td><td><strong>9,000 金币<\/strong><\/td><td><code>[确]<\/code> 400–500 吨档实<\/td><\/tr><tr><td><strong>护卫舰<\/strong><\/td><td>350 吨<\/td><td><strong>12,000 金币<\/strong><\/td><td><code>[确]<\/code> 战舰单价<\/td><\/tr><tr><td><strong>东印度商船<\/strong><\/td><td>600 吨<\/td><td><strong>17,000 金币<\/strong><\/td><td><code>[确]<\/code> VOC 600 吨／350 人档实<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>所以<\/strong>：船不是买来的。船的来路只有五条——<strong>委托赏给、法庭判归（律法，5.5）、战场缴获、合伙凑股（10.6）、以及从别人手里偷走<\/strong>。这五条本身就是五类冒险。<\/p>\n<blockquote class='quote'><strong>【历史注·合伙制】<\/strong> 现实中船以<strong>股份<\/strong>持有（常见 64 份），船东可以是一个从没下过水的寡妇。所以\"拥有一条船的 1/16\"是完全可行的人生目标，也是本作为什么把船写成\"角色\"而不是\"道具\"。见 10.6 合伙与股份。<\/blockquote>\n<hr>\n<h2>6.10 货物与商品预览<\/h2>\n<p><strong>基价、波动与产地全在第 10.1 定稿表<\/strong>。本章只给\"这一箱多重、占不占舱位\"：<\/p>\n<div class='tbl'><table><thead><tr><th>类别<\/th><th>每舱位<\/th><th>波动性格<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td><strong>香料<\/strong><\/td><td>极轻（1 舱位=一整批）<\/td><td>高位、极抖<\/td><td>单舱位价值可达数千银币；怕潮、怕偷<\/td><\/tr><tr><td><strong>染料（靛蓝、苏木）<\/strong><\/td><td>轻<\/td><td>中位、抖<\/td><td>2.4 里那箱靛蓝 = 60 银币是港内收购价<\/td><\/tr><tr><td><strong>糖<\/strong><\/td><td>中（蜜桶重）<\/td><td>中位、稳<\/td><td>重量惩罚：＞4 舱位时吃水降一档<\/td><\/tr><tr><td><strong>烟草<\/strong><\/td><td>轻<\/td><td>中位、抖<\/td><td>受潮即折价 −30%<\/td><\/tr><tr><td><strong>布匹／呢绒<\/strong><\/td><td>中<\/td><td>低位、稳<\/td><td>300 年间最稳的价格类 <code>[确]<\/code> 工业品仅涨 2 倍<\/td><\/tr><tr><td><strong>瓷器<\/strong><\/td><td>轻但<strong>脆<\/strong><\/td><td>高位<\/td><td>每次搁浅或撞击须掷一次破损（d6 ≤2 折价一半）<\/td><\/tr><tr><td><strong>白银与金<\/strong><\/td><td>轻<\/td><td><strong>不波动<\/strong><\/td><td>它就是价格本身；被抢的概率与其他货物不成比例<\/td><\/tr><tr><td><strong>木材／桅料<\/strong><\/td><td><strong>极重<\/strong><\/td><td>低位<\/td><td>2 舱位＝1 份桅料<\/td><\/tr><tr><td><strong>铁与铅<\/strong><\/td><td>重<\/td><td>低位、稳<\/td><td>战时翻倍<\/td><\/tr><tr><td><strong>火药<\/strong><\/td><td>中，<strong>危险品<\/strong><\/td><td>战时暴涨<\/td><td>见 10.4 违禁；船上受潮折半（2.4）<\/td><\/tr><tr><td><strong>淡水（港购）<\/strong><\/td><td>中<\/td><td>稳<\/td><td>量大价低；<code>[缺]<\/code> 无独立价格锚，按 0.05 银币/升 <code>[评]<\/code><\/td><\/tr><tr><td><strong>活畜<\/strong><\/td><td>占舱且<strong>吃水<\/strong><\/td><td>—<\/td><td>每舱位 4 只羊或 1 头猪；每天消耗补给<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>船货不是个人行李。<\/strong> 角色的个人物品不计舱位（≤1 舱位免记），但<strong>战利品一律进船账<\/strong>（10.7 船份制）。这条不写清，一船人会为了那只银烛台打起来。<\/p>\n<hr>\n<h2>6.11 自制、就地取材与修理<\/h2>\n<p><strong>没有商店时的三条通路<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>通路<\/th><th>规则<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td><strong>自制<\/strong><\/td><td>木工／铁匠／缝纫／制药 检定 DV13；工时 = 表价÷5 天<\/td><td>成品标\"粗制\"：效果 −1 档，且 GM 可为它安排一次断裂<\/td><\/tr><tr><td><strong>就地取材<\/strong><\/td><td>生存／博物学 DV13 找到料，再走自制<\/td><td>找到什么由 GM 决定（8.6）<\/td><\/tr><tr><td><strong>拆东墙<\/strong><\/td><td>从本船某处拆<\/td><td>被拆的部位立刻生效一次损伤（砍索、失锚、拆板补帆）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注】<\/strong> \"拆东墙\"是航海恐怖最便宜的发生器。<strong>让玩家明确说出他们要拆掉什么<\/strong>——这句话本身就是这一幕的戏。<\/blockquote>\n<hr>\n<h2>6.12 三十秒速查<\/h2>\n<ul class='mdlist'><li><strong>1 银币 ≈ 5.5 克纯银；1 金币 = 10 银币 ≈ 1 达克特；1 英镑 = 20 银币 = 2 金币<\/strong><\/li><li>起始身家 20 银币（4.7）；一人一昼夜口粮 1 银币；一件胸甲 30 银币；一柄佩剑 7 银币；一发 6 磅实心弹 0.7 银币，一次发射药 ≈ 炮磅数银币<\/li><li>水手 19 银币/月；木匠 52；船长 73–175；<strong>欠饷一月＝士气 −5 且哗变骰 +2<\/strong><\/li><li>护甲同时给防御与减伤；钝击减半；胸甲 3；<strong>没人穿着全甲上桅<\/strong><\/li><li>舱位不称重；1 舱位＝1 类货｜2 段补给｜1 份备料；载人每 2 人 1 舱位<\/li><li>帆与桅是钱：<strong>成套帆 226 金币，大桅 260 金币起<\/strong>；旧索三百年涨了两倍半<\/li><li><strong>仪器价格是设计值 <code>[缺]<\/code><\/strong>，可用\"日薪×工时\"自造，且那样会让仪器变成港口的性格<\/li><li><strong>船买不起<\/strong>：二手小艇级 100 金币、快船 1,000、盖伦 9,000 → 船只能被赏、被判、被缴、被凑股、被偷（6.9）<\/li><\/ul>\n<hr>\n<p><em>有了东西，接下来得把它开出去。第七章的船在等你。<\/em><\/p>","text":"没有人买得起一条船。但总有人愿意为了一条船去死——这就是所有权和士气之间的距离。 本章管三件事： 钱怎么记、东西值多少、以及它们能撑几天。 本章的三条设计立场： 不做流水账。 给养以\"份\"计、货物以\"舱位\"计、弹药以\"轮\"计。你不需要记录第 47 天用了多少升水——但归零的那一刻，后果是硬的（7.8 坏血病、7.9 断料）。 价格只有一个单位。 全部以 银币 记账，大额以 金币 。这是为了让第十章的贸易章可以直接复用本章每一行。 船不是买来的。 本章会给出一条盖伦的真实价格，你会发现它高到荒谬。那不是设计失误，那是历史的形状——所以第一幕的标题叫\"拿到船\"，而不叫\"买条船\"（14.3）。 6.1 货币与换算 本位 币 等值 折合纯银 出处与口径 1 银币 记账本位 ≈5.5 克纯银 [确] 1601 年后英国先令（shilling）含银 5.52–5.57 克，本作取 5.5 为单一换算锚 1 金币 10 银币 ≈55 克纯银当量 [确] 银达克特 1600/1650/1700 = 43.10/49.83/55.17 克；本作取 1700 档，故 1 金币 ≈ 1 达克特 1 铜索尔多 1/10 银币 ≈0.55 克 [评] 小额找零，游戏内一般不记 为什么用克纯银 ：它是全项目唯一的跨期可比尺度。1450 年的 1 先令和 1730 年的 1 先令购买力差近三倍，但它们的含银量差不到 5%。规则书里所有价格都是\"克纯银折算后取整到银币\"，因此 不随章节内年代漂移 ——这是取舍，代价是丢掉了价格革命的手感；那个手感由 10.2 的行情骰和 10.1 的波动带来承担。 历史外币对照（GM 需要\"有那个味道\"时用） 外币 折银币 备注 8里亚尔银币（peso / 双柱） 4.6 银币 [确] 25.561 克，1497–1728 单值不变——全期唯一不串档的整币， 海上贸易的事实标准 荷兰盾（guilder） 1.7 银币 [确·四锚并立] 9.61／9.13／9.52／9.41 克，极差 1.9%，取均值 斯图弗（stuiver） 0.09 银币 [推算] ＝盾/20 杜卡特（金） 10 银币 [确] 见上 雷亚尔（réis，千） 13.9 银币 [确·两口径并立] 76.5／88.5 克，本表采低值，高
