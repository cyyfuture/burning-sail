什么尾。 不重掷。 追击轮内零借机攻击 （隔着两海里借什么）。 五类\"抢优势\"动作 每轮，每口钟 至多推进 1 格 。推进方式： 类别 谁可用 推进条件 操帆 双方 掌舵/操帆成功，且净靠近或净拉开 ≥1 格 炮击减速 追方 命中对方帆索，使其速度档下降 地形 双方 抢风穿礁道、贴岸走水（各对应 DV16 检定） 弃子 逃方 抛货减重（每舱位速度 +1）／砍放小艇 干扰 双方 撒油、断缆、假旗号（对抗） 对抗成功不推钟——改为\"下次检定 +1 档\"。 这条是双钟不塌成骰子比赛的关键： 一个动作要么推进张力，要么积累质量，不能两者都拿。 每轮岗位动作白名单（追击版，每席限选 1 项） 战位 追击可选动作 舵 抢风／急转／贴礁 帆 修帆／砍索（对已接近的敌船） 炮 点火／齐射（ 推荐链弹 ——追击里打船体不推钟） 瞭望 测风预警 ／报浅点 号令 「抢上风！」 （风档升一档，不与抢风叠加） 写实细节放在哪里 吃水、潮汐、礁深 不直接填钟 ——它们通过 减速与绕行改写间距 ，再由间距推钟。 【设计注】 一句判据，跑完一场追击就问自己： 玩家结束时说的是\"差一点\"，还是\"MOV 差多少\"？ 前者说明钟在管张力；后者说明算术塌了，回到本节重读\"不能两者都拿\"。 9.8 大规模战斗（群战，单页规则） 三船以上逐船结算会拖垮一桌人。 把战斗降级为\"船队对船队\"，PC 只打关键点。 兵力值 兵力值 = 船体值÷4 + 炮位÷2 + 士气档(0–3) ，四舍五入。精锐品质 ×1.5。 士气档：≤7→0／8–12→1／13–16→2／17+→3。 结算环（一个\"战役段\" = 4 个海战轮） 双方指挥官各 暗写一条战役令 ：并舷推进／纵队迂回／分割／保守／脱离。 同时翻明。 战役对抗 ： d20 + 学识或人望 + 领导 + 阵位差值 ≥ 13 → 本段占优。 占优方对落后方造成 1d6 × 兵力差 的船体伤害， 分配由落后方自选 （不分配则默认砸旗舰）。 两令相克时 （分割 vs 保守、迂回 vs 并舷推进），占优方伤害 翻倍 。 PC 的关键点 每段，PC 可选 一个 关键点介入（掌舵／炮击／接舷／号令，任选对应战位规则掷 一次 ）： 成功 → 本方战役检定 +3； 失败 → 按失败铁律，送给对手一个战役段的机会。 PC 不该在群战里做二十件事，该做 一件有名字的事 。 结束条件 一方沉／俘／逃 ≥ 半数船只 ，或任一方指挥官被击杀／旗舰失能 → 该方战败。 战败方士气跌破 8 后，剩余船只开始逐段脱离。 9.9 战斗之后 别跳过这一节。海战的重量全在收尾。 战场清点（d20 搜刮表） 对 已沉或已弃 的目标船掷一次（登船夺船者直接取全船清单，不用掷）： d20 所得 1–2 空的——船货早在风暴前就转走了（但留下一处 值得追查的线索 ） 3–5 散落的个人财物：1d6×5 银币，无货单可销赃（−30%，见10.5） 6–8 船具与备料：1d3 份帆料／索具，可当场修船 9–11 给养与淡水：够全船多撑 1d3 天（士气 +1） 12–14 一批 可交易货物 （掷第10章商品类别） 15–16 弹药与火药：本船装填轮数 −1 ，持续到打光 17–18 文书 ：提单、通信、委托合同—— 这是剧情，不是钱 （第10/14章钩子） 19 一门没被砸坏的炮 ：可上船，占 2 舱位 20 活的 ：一名幸存者，怀里抱着不该由他抱着的东西 伤员 濒死者按 3.7 结算； 战后未处理的重伤者每班次 −1 HP 。 启用【部位与致残】变体时，战后须掷一次\"命运骰\"（d20 vs 13）决定是 永久伤疤 还是 可恢复 。 具名船员会死。 死者会在下一次士气结算里出现一次——不是惩罚，是重量（参见 7.7、11.2）。 俘虏与赎金 俘虏需 分出一名船员看押 （该员本班次不能做别的）。 赎金谈判 ：人望+交涉 vs 对方胆魄。赎金额 = 其月薪 × 1d6 × 2 个月 。 释放俘虏会进 传闻档 （10.8/13.6）：下次在别的港口，你放过的人可能认得你。 处决俘虏： 恶名 +1 档 ，但本船对敌士气 +2。本书不裁判，只记账。 船体抢修 场景 成本 海上应急 木工 DV13/16，成功每天 1d3 点，每点耗 1 份备料（7.9） 港内大修 2 银币 + 1 班次 / 点 （与 7.9 同口径） 换桅 40 银币 + 1 天 + 一根桅料（大桅是战役级开销，见10.1） 补帆 每恢复一档帆况：15 银币 + 1 份帆料；海上缝补只能回一档 分赃在修理与欠饷之后 （10.7）。这条不写下来，玩家会把每个银币当场分掉，然后在下一个港口把船押给债主。 9.10 GM 战斗速查（把这一页打印出来） 个人战 ：先攻 = 机敏检定 DV10 ｜ 1 动作 + 1 移动 ｜ 命中 d20+属+技 ≥ 13+护甲 ｜ 重击 ≥+10 或天然20（伤害骰×2）｜ 险失 &lt;−5 或天然1 ｜ 夹击／高地 = 优势 ｜ 掩体 +2／+5 ｜ 倒地：近战优、远程劣 ｜ 杂兵士气 d20+胆魄 vs 12/14/16 火器 ：手枪 2d6／10／1轮 ｜ 火绳 2d8／30／ 2轮 ｜ 近距（≤射程1/3）无视 1 甲 ｜ 雨与浸水 = 哑 ｜ 天然1 卡壳 海战一轮 ：号令 → 阵位 → 机动 → 炮击 → 冲撞接舷 → 结算 速度 = 航速档 × 风(1.5/1.25/1.1/1.0/0.75/0.5) × 帆 × 海况， 向下取整 ；每轮转 90° 阵位令 ：并舷3／纵队2／自由1，暗写同翻；旗舰失 → 全队降为自由令 齐射 ：4 门／连 ｜ 装填 2 轮 ｜ d20+学识或机敏+炮术 vs 船体14／帆索12／甲板16 ｜ 3d6 ｜ 第二连 −5、第三连起 −10 弹 ：实心标准 ｜ 链弹 帆索×2、射程半 ｜ 葡萄弹 清甲板、敌我不分（DV15 豁免 3d6）｜ 火弹必引火 贯舷 ：夹角≤30° 且 ≤4格 → 命中档升一级、部位锁艏艉、目标下轮速度档−1 起火 ：1级 −1 ／ 2级 −1d3 + 人员1d6 ／ 3级 −2d6；逼近火药舱检定失败 = 船体减半 进水 ：每级 1 人抽水；3级 = 10 轮沉没倒计时 ｜ 木工 DV14 止漏 接舷 ：掌舵对抗 → 抛钩 DV14 → 干舷 DV12 → 甲板分段每段 ≤2 队 撞击 ：速度 ≥4；双方 2d6 + 速度差，被撞方另 +2d6，自动钩连 追击 ：双钟 6 格 ｜ 每轮各至多 +1 ｜ 先满者胜 ｜ 同轮双满 = 双结局 ｜ 对抗成功不推钟，改 +1 档 群战 ：兵力值 = 船体/4 + 炮位/2 + 士气档 ｜ 战役令暗写同翻 ｜ PC 每段一个关键点 下一章：把打来的东西变成钱，把抢来的东西变成名声。"},{"num":"10","title":"贸易、掠夺与声望","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>没有人真正发财。少数人发了一次，剩下的人付了账——账本上写得清清楚楚，只是没人愿意读。<\/em><\/blockquote>\n<p>本章管钱、管名声、管\"合法\"这门生意。它的数据层来自全部考据中最扎实的一册，因此本章有一条与其他章不同的纪律：<\/p>\n<blockquote class='quote'><strong>凡本章出现\"两说并立\"，GM 不得自行择一。<\/strong> 你可以选一个来跑你的战役，但必须<strong>明说选了哪个<\/strong>。这不是学究气——贸易的全部乐趣就在于<strong>玩家不知道该信哪一个<\/strong>。<\/blockquote>\n<p><strong>本章三立场<\/strong>：<\/p>\n<ul class='mdlist'><li><strong>贸易是信息游戏，不是记账游戏。<\/strong> 行情骰与传闻表让每座港口有性格，玩家的真正决策是\"<strong>我该信谁<\/strong>\"。<\/li><li><strong>声望与恶名分开记。<\/strong> 抢了谁，决定了谁怕你、谁敬你、谁在等你进港。两条曲线互相牵制。<\/li><li><strong>合法性是一种可以收购的资产。<\/strong> 私掠许可证、股份、报关单、检疫状——<strong>这些纸比货贵<\/strong>，因为纸能让你把货变成钱。<\/li><\/ul>\n<hr>\n<h2>10.1 商品与基价表<\/h2>\n<p><strong>单位<\/strong>：一切按 <strong>舱位<\/strong>（一整批，见 6.8）计。价格单位 <strong>银币<\/strong>。<\/p>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>商品<\/th><th>产地价<\/th><th>到岸价<\/th><th>波动性格<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>胡椒／丁香／肉豆蔻<\/strong><\/td><td>800<\/td><td>2,400<\/td><td>高位·极抖<\/td><td>垄断带的定义性商品：肉豆蔻单航次实测利润率达 <strong>96.3%<\/strong> <code>[确]<\/code>。<strong>禁运时价可上 6×<\/strong><\/td><\/tr><tr><td>2<\/td><td><strong>染料（靛蓝、苏木）<\/strong><\/td><td>250<\/td><td><strong>600<\/strong><\/td><td>中位·抖<\/td><td>上等靛蓝 <strong>60 银币/箱<\/strong>，一舱位 ≈10 箱（与 2.4 场景二一致）<\/td><\/tr><tr><td>3<\/td><td><strong>糖<\/strong><\/td><td>150<\/td><td>500<\/td><td>中位·稳<\/td><td><code>[确]<\/code> 巴西白产地 6.0 克/公斤 → 阿姆到岸 10.2–10.6；<strong>重量惩罚<\/strong>：&gt;4 舱位吃水降一档<\/td><\/tr><tr><td>4<\/td><td><strong>烟草<\/strong><\/td><td>80<\/td><td>300<\/td><td>中位·抖<\/td><td>受潮折价 −30%<\/td><\/tr><tr><td>5<\/td><td><strong>布匹／呢绒<\/strong><\/td><td>200<\/td><td>450<\/td><td>低位·<strong>最稳<\/strong><\/td><td><code>[确]<\/code> 工业品三百年只涨 2 倍——全库最稳的一类<\/td><\/tr><tr><td>6<\/td><td><strong>瓷器<\/strong><\/td><td>400<\/td><td>1,600<\/td><td>高位·稳<\/td><td>脆：搁浅或撞击须掷破损（d6 ≤2 折价一半）<\/td><\/tr><tr><td>7<\/td><td><strong>白银与金<\/strong><\/td><td>—<\/td><td>—<\/td><td><strong>不波动<\/strong><\/td><td>它就是价格本身。被抢概率与其他货物完全不成比例<\/td><\/tr><tr><td>8<\/td><td><strong>木材／桅料<\/strong><\/td><td>60<\/td><td>200<\/td><td>低位·稳<\/td><td>极重，2 舱位＝1 份桅料；<strong>战时 ×2<\/strong><\/td><\/tr><tr><td>9<\/td><td><strong>铁与铅<\/strong><\/td><td>100<\/td><td>300<\/td><td>低位·稳<\/td><td>战时翻倍；炮与弹的原料<\/td><\/tr><tr><td>10<\/td><td><strong>火药<\/strong>（管制）<\/td><td>200<\/td><td>800<\/td><td><strong>战时 ×2–3<\/strong><\/td><td>违禁品，见 10.4。受潮折半<\/td><\/tr><tr><td>11<\/td><td><strong>淡水与船粮<\/strong>（补给）<\/td><td>40<\/td><td>120<\/td><td>稳，<strong>封锁港 ×5<\/strong><\/td><td>见 6.7；这是唯一一种\"缺货会杀人\"的商品<\/td><\/tr><tr><td>12<\/td><td><strong>活畜与腌货<\/strong><\/td><td>90<\/td><td>260<\/td><td>稳<\/td><td>占舱且<strong>每天消耗补给<\/strong>（每舱位每天 −0.5 份）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>价差即利润，但成本会吃掉一半<\/h3>\n<p><strong>一舱位胡椒跑一趟远洋的毛差 = 1,600 银币。<\/strong> 听起来是暴富。真实账目：<\/p>\n<div class='tbl'><table><thead><tr><th>成本项<\/th><th>吃掉<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td>人力（薪饷＋给养，占运营期 61.25%）<\/td><td>一航次 6,600–11,700 银币（小型商船往返）<\/td><td><code>[确/推算混合]<\/code><\/td><\/tr><tr><td>保险<\/td><td>0.5%–40%（见 10.3）<\/td><td><code>[确]<\/code><\/td><\/tr><tr><td>关税与通道负担<\/td><td>中位 <strong>5–10%<\/strong>；西班牙体系 <strong>约 25%<\/strong><\/td><td><code>[确·两说]<\/code><\/td><\/tr><tr><td>修理与折旧<\/td><td>商船 5%/年（寿命 20 年）；威尼斯船 8–15%/年（寿命约 10 年）<\/td><td><code>[确]<\/code><\/td><\/tr><tr><td>海盗、风暴、坏年景<\/td><td>—<\/td><td>见 10.5<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>判读句（全项目最有用的一句话）<\/strong> <code>[确]<\/code>：<strong>实测 24 个航次的七层账闭合后——短程航线利润率 10.6–20%，远洋 30–36%，而凡是利润率 &gt;40% 的案子，无一例外都能指认出一个垄断体制<\/strong>（马尼拉丝 44.6%、茶 67.2%、肉豆蔻 96.3%）。<br>反过来也成立：<strong>铜三角只有 0.3–3.3%<\/strong>——薄利、巨量、谁都能做。<br>所以玩家若想赚大钱，他们要买的不是一船货，是<strong>一项特权<\/strong>。这是本战役的经济真相，也是第四幕的政治引线。<\/blockquote>\n<hr>\n<h2>10.2 市场检定（行情骰）<\/h2>\n<h3>每港、每类别，一次停泊掷一次<\/h3>\n<p>掷 <strong>d6<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>d6<\/th><th>档位<\/th><th>价格乘数<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>滞销<\/td><td>×0.6<\/td><\/tr><tr><td>2<\/td><td>疲软<\/td><td>×0.8<\/td><\/tr><tr><td>3–4<\/td><td>平常<\/td><td>×1.0<\/td><\/tr><tr><td>5<\/td><td>紧俏<\/td><td>×1.3<\/td><\/tr><tr><td>6<\/td><td>短缺<\/td><td>×1.7<\/td><\/tr><tr><td><strong>6 + GM追加<\/strong>（事件驱动）<\/td><td><strong>恐慌<\/strong><\/td><td><strong>×2.4<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>乘数带不是随手定的<\/strong>：<code>[确]<\/code> 实测粮价 <strong>P90/P50 = 1.3–1.8 倍<\/strong>（坏年景），极值 <strong>max/P50 = 2.0–3.7 倍<\/strong>（1591 巴黎麦价是全数据窗天花板）；而 CPI 只有 1.2–1.4 倍——<strong>篮子会被平均数骗过去，灾年的体感要看粮档，不要看总档<\/strong>。GM 报\"行情\"时请记住：玩家听到的应该是粮档。<\/blockquote>\n<h3>三件可做的事<\/h3>\n<div class='tbl'><table><thead><tr><th>行动<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td><strong>探听行情<\/strong><\/td><td>交易 DV13 或 酒馆传闻（10.3）。成功：GM 必须如实报出本港该类别的<strong>当前档位<\/strong>（不是下一港）<\/td><\/tr><tr><td><strong>重掷行情<\/strong><\/td><td>交易成功（DV13）可重掷一次并<strong>取新结果<\/strong>；北海联合省出身\"算盘心\"每停泊期免费一次（4.2）<\/td><\/tr><tr><td><strong>提前反应<\/strong><\/td><td><code>[确]<\/code> 事件前 <strong>3–6 个月<\/strong>存在可读的\"爬升带\"。有人提前布局需要一条情报，而那条情报一定有人卖<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>币制波动（长战役的隐形杀手）<\/h3>\n<div class='tbl'><table><thead><tr><th>事件<\/th><th>效果<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>币改／贬值<\/strong><\/td><td>名义价全线上调，但<strong>克银计不动<\/strong>。玩家若以银币数记账，会误以为自己变富<\/td><td><code>[确]<\/code> 英 1544–51 贬值 83%（16 年回锚）；西班牙 vellón −43%（1–2 年回落）；奥斯曼 akçe −89%（<strong>而克银 CPI 反而横盘 1.4–1.8<\/strong>）<\/td><\/tr><tr><td><strong>白银流入<\/strong><\/td><td>产银区物价畸高<\/td><td><code>[确]<\/code> 波托西单人单月生存成本 <strong>25–35 银币<\/strong>，全数据窗最贵——一座被白银灌坏的城市<\/td><\/tr><tr><td><strong>封锁／围城<\/strong><\/td><td>补给类 ×5；<strong>限价令会让走私无利可图从而断供<\/strong><\/td><td><code>[确]<\/code> 安特卫普 1585 限价 → 走私消失 → 饿到陷城；莱顿 1574 放任 → 官价仅 +28%，黑市 3–5 倍<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注】<\/strong> 最后一条是本作最好的一次道德抉择的经济学原型：<strong>限价让城市看起来更有秩序，然后它饿死了。<\/strong> GM 只需把两张价格表并排贴在桌上，不用说教。<\/blockquote>\n<hr>\n<h2>10.3 港口活动<\/h2>\n<h3>进港清单（六项，一次做完）<\/h3>\n<ol class='mdlist'><li><strong>入港与报关<\/strong>：纳税。中位通道负担 <strong>5–10%<\/strong>；西班牙体系约 <strong>25%<\/strong>（<code>[确·两说]<\/code> 1543 制 17.5% → 1566 制 ~25%+，由 almojarifazgo 5% + 到岸 10% + alcabala 首售 10% + avería 2–2.5%（上限 12%）叠成，<strong>两口径并立未裁<\/strong>）。广州 3% + 公行 3%；马尼拉 3→6% + 城墙 2%；马六甲 7%；果阿 6→7.5%；奥斯曼外商 5%→1673 后 3%；声税 1–2%。<\/li><li><strong>灯塔/港务费<\/strong>：<code>[确]<\/code> 英灯塔专利 <strong>1 便士/吨（英船）、2 便士（外船）<\/strong> ≈ 0.002 银币/吨——<strong>几乎白送，但它是一项\"谁在管这片海\"的宣示<\/strong>。<\/li><li><strong>补给采买<\/strong>：1 银币/人/昼夜（6.7）；封锁港 ×5。<\/li><li><strong>修理<\/strong>（6.9、7.9）：大修 = 造价的 <strong>27%<\/strong> <code>[确]<\/code>；<strong>重建 = 原价的 92–95%<\/strong> <code>[确]<\/code>——所以沉船打捞比修旧船便宜，这条驱动了无数真实冒险。<\/li><li><strong>招募与遣散<\/strong>：普通水手 10 银币预付（7.7）；遣散须结清欠饷，否则士气 −5 起（6.6）。<\/li><li><strong>传闻<\/strong>：见下表。<strong>这是本章最重要的部分<\/strong>——其他五项是交钱，这一项是买未来。<\/li><\/ol>\n<h3>保险（本作用它做风险定价，全部有实档）<\/h3>\n<p><code>[确]<\/code> 除注明外均为费率区间实档：<\/p>\n<div class='tbl'><table><thead><tr><th>航线<\/th><th>平常<\/th><th>战时<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>波罗的海<\/td><td>0.5–1%<\/td><td>3–8%<\/td><td>低波动航线<\/td><\/tr><tr><td>英—荷<\/td><td>≥2%<\/td><td>—<\/td><td><strong>承保人底价卡特尔<\/strong>（谁都不许更低）<\/td><\/tr><tr><td>阿姆斯特丹→加的斯（1695）<\/td><td><strong>护航 13%<\/strong><\/td><td><strong>闯线 19%<\/strong><\/td><td>一场战争的定价，写在两张保单里<\/td><\/tr><tr><td>里斯本→果阿<\/td><td>2%–35%<\/td><td>—<\/td><td><strong>全带<\/strong>：同一航线的风险差十七倍，取决于季节与战事<\/td><\/tr><tr><td>VOC 回程<\/td><td>30–40%<\/td><td>—<\/td><td><strong>实际是拒保<\/strong>：没人愿意保那条船回来<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>规则化<\/strong>：投保 = 支付货值 × 费率；出险 = 获赔货值的 90%（<strong><code>[确]<\/code> 阿姆斯特丹货保强制 10% 免赔<\/strong>——被保险人的痛感是承保人的风控）。<br>冬季另加 <strong>+28–50%<\/strong>。战时 ×2–3。<\/p>\n<blockquote class='quote'>于是\"要不要护航\"变成一个能算的题：<strong>闯线省 6% 保费，赔上整船。<\/strong> 玩家会做出选择，而选择会暴露他们是谁。<\/blockquote>\n<h3>酒馆传闻表（d20）<\/h3>\n<p><strong>规则<\/strong>：一次停泊掷 <strong>1d20+2<\/strong>（有长期客户、算盘心、或请得起酒则再 +2，上限 +6）。掷出的每条传闻<strong>必须能通向一件真事<\/strong>——GM 若不能立刻说出它通向哪里，就删掉这条重掷（<strong>不许有空枪<\/strong>）。<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>传闻<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>某条船的舱单上有你们的名字。（<strong>恶名/血债回响<\/strong>，见 10.8）<\/td><\/tr><tr><td>2<\/td><td>下个月开港日提前十天——因为一支舰队要来。（<strong>时限型任务钩<\/strong>）<\/td><\/tr><tr><td>3<\/td><td>有座灯塔三个月没亮了。（12.7 秘密之一或一个空哨站）<\/td><\/tr><tr><td>4<\/td><td>一种货在这座港不值钱，在八百海里外值钱。（<strong>真价差，报出数字<\/strong>）<\/td><\/tr><tr><td>5<\/td><td>一个走私港的报价单，写在一张烟盒纸上。（<strong>引 10.4<\/strong>）<\/td><\/tr><tr><td>6<\/td><td>有个军官在打听你们。（<strong>债/仇/征用<\/strong>）<\/td><\/tr><tr><td>7<\/td><td>一条船在你们要走的航线上沉了。（<strong>是真沉，还是有人放的话？<\/strong>）<\/td><\/tr><tr><td>8<\/td><td>总督的女儿/儿子在一艘私掠船上。（<strong>势力内部的裂缝<\/strong>）<\/td><\/tr><tr><td>9<\/td><td>有人悬赏一个你们认识的人。（赎金线，9.9）<\/td><\/tr><tr><td>10<\/td><td>今年香料\"不好走\"。（<strong>行情骰 −1 档的预告<\/strong>）<\/td><\/tr><tr><td>11<\/td><td>一片海域被官方宣布\"不存在\"。（12.7）<\/td><\/tr><tr><td>12<\/td><td>一个船员说他能带你们找到淡水。（8.6，可能是真的）<\/td><\/tr><tr><td>13<\/td><td>有人愿出价买一张你们画过的海图。（6.5、8.7）<\/td><\/tr><tr><td>14<\/td><td>一座港在戒疫，进港要十四天。（<strong>检疫＝时间成本<\/strong>，律法 5.5）<\/td><\/tr><tr><td>15<\/td><td>一支护航队缺一艘船。（<strong>征用或受雇<\/strong>，10.6）<\/td><\/tr><tr><td>16<\/td><td>有人冒充你们。（<strong>旗号、伪造、绘图<\/strong>）<\/td><\/tr><tr><td>17<\/td><td>一个传说里提到的坐标，和你们手里那张残图对得上。（12.7 秘密链）<\/td><\/tr><tr><td>18<\/td><td>你们的一个秘密在桌上传开了。（<strong>11.2 心结回响／4.8 秘密兑现<\/strong>）<\/td><\/tr><tr><td>19<\/td><td>一场海战的细节，两个版本。（<strong>双方都活着，都可以去问<\/strong>）<\/td><\/tr><tr><td>20<\/td><td><strong>有人直接把契约推到你面前——不用先做完任务。<\/strong>（<strong>GM：这是诱饵，代价后收<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注·为什么每条都要有落点】<\/strong> 传闻表不是氛围道具，是<strong>战役的供血系统<\/strong>。一条没有落点的传闻会让玩家学会\"桌上的话不用当真\"——那个习惯一旦形成，本作的整个信息游戏就死了。<\/blockquote>\n<hr>\n<h2>10.4 走私与违禁品<\/h2>\n<h3>什么算违禁<\/h3>\n<p>火器与火药、贵金属出口、敌国货物、未经报关的货到岸、禁运香料、偷渡的人口、以及<strong>任何\"某人在此赚钱的东西\"<\/strong>。<\/p>\n<h3>风险结算<\/h3>\n<p><strong>查获判定<\/strong>：海关掷 <code>d20 + 律法/学识 + 港务关系修正<\/code> vs <strong>你们藏东西的方式对应的 DV<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>藏法<\/th><th>DV<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>敞舱堆放<\/td><td>10<\/td><td>无<\/td><\/tr><tr><td>混在同类货里<\/td><td>13<\/td><td>需一次交易 DV13 备好单证<\/td><\/tr><tr><td>特制暗舱<\/td><td>16<\/td><td>建造 60 银币 + 1 停泊期（工程＋木工）<\/td><\/tr><tr><td>贿赂关员<\/td><td>对抗<\/td><td><strong>首次可脱身<\/strong>（商人原型\"人脉即资本\"，4.4）；第二次起风险翻倍<\/td><\/tr><tr><td>闯封锁线<\/td><td>掌舵 DV17（夜 DV19）<\/td><td>船体 2d6；被击伤即无救<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>被抓的后果（按势力态度分级）<\/h3>\n<div class='tbl'><table><thead><tr><th>关系（10.8）<\/th><th>后果<\/th><\/tr><\/thead><tbody><tr><td><strong>盟约／友好<\/strong><\/td><td>没收，警告，<strong>本港声望 −5<\/strong><\/td><\/tr><tr><td><strong>中立<\/strong><\/td><td>没收 + 罚款（货值 <strong>1–2 倍<\/strong>），声望 −10<\/td><\/tr><tr><td><strong>警惕<\/strong><\/td><td>货没收、船暂扣，人下狱，等赎金或审判（律法 DV16）<\/td><\/tr><tr><td><strong>敌对<\/strong><\/td><td><strong>货、船、人都归港务<\/strong>。人可以被吊在桅上<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>为什么有人会走私（这是本章最好的一课）<\/h3>\n<p><code>[确·两说并立，禁互换互证]<\/code><\/p>\n<ul class='mdlist'><li><strong>Klein 说<\/strong>：17 世纪中叶新西班牙的进口约 <strong>三分之二是走私<\/strong>。<\/li><li><strong>登记欺诈口径说<\/strong>：舰队簿漏报 <strong>75–80%<\/strong>。<\/li><\/ul>\n<p><strong>两说同向、口径不同，不可互相\"验证\"。<\/strong> 但两说的结论一样：<strong>所谓\"合法贸易\"是少数例外。<\/strong><\/p>\n<blockquote class='quote'><strong>弹性实测<\/strong> <code>[确]<\/code>：马尼拉税率从 3% 提到 6%，<strong>丝绸出口随即暴跌 90%<\/strong>。<br>所以走私不是贪婪，是<strong>对税率的理性反应<\/strong>。当玩家理解了这一点，他们就会开始问一个更好的问题：<strong>\"谁在收这道税，收去哪了？\"<\/strong> ——那一句就是第四幕的政治。<\/blockquote>\n<h3>销赃<\/h3>\n<p><strong>赃物实现率<\/strong>（<code>[推算-裁决]<\/code>，全期逐年折扣序列 <code>[缺]<\/code>）：<\/p>\n<div class='tbl'><table><thead><tr><th>渠道<\/th><th>实现率（占货值）<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><strong>殖民地收购商<\/strong><\/td><td><strong>25–50%<\/strong><\/td><td><code>[确]<\/code> 明码压价<\/td><\/tr><tr><td><strong>海盗货在殖民地市场<\/strong><\/td><td>≈ <strong>50%<\/strong><\/td><td><code>[确]<\/code> 荷兰茶通道实测句：\"100 per cent cheaper\"<\/td><\/tr><tr><td><strong>英格兰本土私货<\/strong><\/td><td>≈ <strong>75%<\/strong>（即折价 −25%）<\/td><td><code>[确]<\/code><\/td><\/tr><tr><td><strong>总体判读<\/strong><\/td><td><strong>1/4–1/2<\/strong><\/td><td><code>[确]<\/code> 1693–99 十六船年均向北美注入 £53,500 = <strong>合法英货进口量的 2.5 倍<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>结论一句话：<strong>抢一船货 ≈ 卖半船货的钱。<\/strong> 而卖的那一半还需要一个不查你的港口——于是你们需要 10.8 的声望。<\/blockquote>\n<hr>\n<h2>10.5 掠夺<\/h2>\n<h3>战利品清单生成器（d20）<\/h3>\n<p>对<strong>被截获的商船<\/strong>掷一次（船员与船体本身见 9.9 与 6.9）：<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>船上有什么<\/th><\/tr><\/thead><tbody><tr><td>1–2<\/td><td><strong>只有压舱石<\/strong>。货主早得到消息。（但这船本身值 1/10 船价）<\/td><\/tr><tr><td>3–5<\/td><td>区域货物一档：粮、木、铁、布。基价 100–200 银币/舱位<\/td><\/tr><tr><td>6–9<\/td><td>中档货：糖、烟草、染料、腌货。250–600<\/td><\/tr><tr><td>10–12<\/td><td>高档货：瓷器、药料、成品器。800–1,600<\/td><\/tr><tr><td>13–15<\/td><td><strong>贵金属<\/strong>：1d6×500 银币，或等值金。（<strong>不折价，但会引来追兵<\/strong>）<\/td><\/tr><tr><td>16–17<\/td><td><strong>香料<\/strong>：1d3 舱位 ×（1,600 价差）。<strong>这是所有掠夺的巅峰战果<\/strong><\/td><\/tr><tr><td>18<\/td><td><strong>武备船<\/strong>：军械、火药、一门完好的炮（6.9）。战时价值 ×2，且<strong>销不掉<\/strong><\/td><\/tr><tr><td>19<\/td><td><strong>运客船<\/strong>：赎金（见下），以及一船不该看见你们的证人<\/td><\/tr><tr><td>20<\/td><td><strong>它不是商船<\/strong>。（GM 当场决定：护航、检疫船、传教船、或某位大人物的私船——<strong>这一格会把恶名直接推到 10.8 的最高档<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>赎金<\/strong>（<code>[确]<\/code>，跨三个数量级）：<\/p>\n<div class='tbl'><table><thead><tr><th>对象<\/th><th>金额<\/th><th>折银币<\/th><\/tr><\/thead><tbody><tr><td>英批量赎买 1646<\/td><td>人均 £30 = 3,342 克<\/td><td><strong>≈ 608 银币/人<\/strong>（约水手 26 个月薪）<\/td><\/tr><tr><td>阿尔及尔个案<\/td><td>100–2,000 里亚尔（peso）<\/td><td>460–9,300 银币<\/td><\/tr><tr><td>名人（塞万提斯）<\/td><td>≈£100<\/td><td>2,000 银币<\/td><\/tr><tr><td>精英<\/td><td>1–2 万杜卡特<\/td><td>20,000–40,000 金币<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>恶名结算<\/h3>\n<p><strong>每一次掠夺都要记账，记的是\"对谁\"<\/strong>（10.8）：<\/p>\n<div class='tbl'><table><thead><tr><th>行为<\/th><th>声望<\/th><th>恶名<\/th><\/tr><\/thead><tbody><tr><td>持许可证劫敌国船<\/td><td><strong>本国 +2<\/strong>，敌国 −10<\/td><td>中立国 +3<\/td><\/tr><tr><td>持许可证劫中立船<\/td><td>本国 −5<\/td><td><strong>+10（违约，见 10.6）<\/strong><\/td><\/tr><tr><td>无许可证劫任何船<\/td><td>−15<\/td><td>+20<\/td><\/tr><tr><td>劫本国籍船<\/td><td>−25<\/td><td>+30<\/td><\/tr><tr><td>赎金谈判后释放俘虏<\/td><td><strong>+5<\/strong>（信用）<\/td><td>−5<\/td><\/tr><tr><td>处决俘虏／洗劫非战斗人员<\/td><td>−10（对\"有体面的人\"）<\/td><td><strong>+15<\/strong>，但对海盗共和国 +5<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注】<\/strong> 最后那半句是本作世界观的政治底座：<strong>恶名不是坏东西，是放错地方的名声。<\/strong> 你在帝国那边是贼，在血鸦号那些人的港口里是资产。<\/blockquote>\n<hr>\n<h2>10.6 许可证、股份与\"合法性\"<\/h2>\n<h3>私掠许可证：一张纸的价格史<\/h3>\n<p><strong>它不是免罪符，它是一种可收购的资产，而且押金贵到离谱。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>值<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>品行保证金<\/strong><\/td><td><strong>£1,500 ＝ 167,100 克纯银 ＝ 30,000 银币 ＝ 3,000 金币<\/strong><\/td><td><code>[确-转引·孤证约数]<\/code>（原文自带 \"possibly\"——<strong>GM 可判为讹传，但必须判<\/strong>）<\/td><\/tr><tr><td>相当于<\/td><td><strong>一名水手 104 年的薪饷<\/strong><\/td><td><code>[推算]<\/code><\/td><\/tr><tr><td>签发手续费序列<\/td><td><strong><code>[缺]<\/code><\/strong> 全库未获<\/td><td>—<\/td><\/tr><tr><td>对照：Every 案悬赏<\/td><td>£1,000 ＝ 20,000 银币<\/td><td><code>[确]<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>申请流程<\/strong>（律法 DV15 为轴）：<\/p>\n<ol class='mdlist'><li><strong>谁发<\/strong>：君主、总督、海军部、或某一国的\"全权委托\"（12.3 势力卡决定谁有权）。<\/li><li><strong>谁担保<\/strong>：两名本国殷实担保人（<strong>这就是为什么商人原型在 1 级就值钱<\/strong>）。<\/li><li><strong>押保证金<\/strong>：3,000 金币。付不出？——<strong>有人愿意替你付<\/strong>，然后你欠他一条船（见下\"股份\"）。<\/li><li><strong>敌国清单<\/strong>：<strong>纸上写了谁，你才能抢谁。<\/strong>清单外的旗号一律等同海盗（10.5 恶名\"无许可证\"档）。<\/li><li><strong>年费与续期<\/strong>：每航季续，续期律法 DV13。<strong>过期一天，你那天打的一切都不合法。<\/strong><\/li><li><strong>回报抽成<\/strong>：见 10.7。<\/li><\/ol>\n<p><strong>违约 = 海盗<\/strong>：缴回许可证，且<strong>颁发国会亲手追你<\/strong>（这条最狠：你最了解的那片海域，现在有人拿着你的航线图）。<\/p>\n<blockquote class='quote'><strong>对照\"免死金牌\"（掠私者原型，4.4）<\/strong>：该特性正是第 6 步的免检——持有效许可证期间，在<strong>颁发国<\/strong>港口不因掠夺行为涨恶名。它值一整场战役。<\/blockquote>\n<h3>股份：为什么船不必由一个人拥有<\/h3>\n<p><code>[确]<\/code> 现实中的船以股份持有（常见 <strong>64 份<\/strong>），船东可以是从不下水的寡妇、一家商行、或一位官员。<\/p>\n<p><strong>规则化——船份（1/16 制）<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>持有<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>1/16<\/strong><\/td><td>分红的十六分之一；<strong>无否决权<\/strong><\/td><\/tr><tr><td><strong>1/4<\/strong><\/td><td>可提名船长；可拒绝一次改装<\/td><\/tr><tr><td><strong>1/2 + 1<\/strong><\/td><td>你说了算<\/td><\/tr><tr><td><strong>全部<\/strong><\/td><td>恭喜，你现在是本案的原告和被告（船价见 6.9）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>PC 最现实的上升路径不是买船，是攒股份<\/strong>：受雇（0 份）→ 奖金折股（1/16）→ 缴获后主张产权（律法 DV16 + 法庭，见 10.7）→ 凑股合伙（1/4）→ 自有（1/2+1）。<\/p>\n<p><strong>这条阶梯就是战役骨架<\/strong>：第一幕\"拿到船\"（14.3）不是拿到<strong>一条<\/strong>船，是拿到<strong>一份产权<\/strong>。<\/p>\n<h3>捕获法庭（把缴获变成合法财产）<\/h3>\n<p>一场战斗的结束不是战斗的结束。<\/p>\n<ul class='mdlist'><li>必须<strong>申报<\/strong>：在任一颁发国港口，向捕获法庭提出 prize 主张。<\/li><li><strong>检定<\/strong>：律法 DV15；有完整缴获文书（9.9 搜刮表 17–18 条）则 <strong>DV13<\/strong>；无船籍证明则 <strong>DV18<\/strong>。<\/li><li><strong>胜诉<\/strong>：船与货归捕获方按份分配。<\/li><li><strong>败诉<\/strong>：船归还，你仍欠法庭费——且你的船员看见你白干了一仗（<strong>士气 −5<\/strong>）。<\/li><li><code>[缺]<\/code> 逐案费率与拍卖价目全库未获（海事档案未开放）。<strong>GM 请用一句话带过程、用一次检定定结果<\/strong>——不要发明程序细节。<\/li><\/ul>\n<hr>\n<h2>10.7 战利品分配（船份制）<\/h2>\n<h3>分配顺序（先付谁，决定了船上政治）<\/h3>\n<blockquote class='quote aside-voice'><strong>① 偿还船债与修理 → ② 抚恤伤残 → ③ 结清欠饷 → ④ 缴纳抽成 → ⑤ 分份<\/strong><\/blockquote>\n<h3>名义抽成谱（<code>[确]<\/code>，一条完整的合法化曲线）<\/h3>\n<div class='tbl'><table><thead><tr><th>年<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>1585 英<\/td><td>船东 1/3 : 给养承包人 1/3 : 官兵 1/3<\/td><\/tr><tr><td>1649 共和<\/td><td>官兵 1/3 ＋ 伤病 1/3 ＋ 船东 1/6 ＋ 国家 1/6<\/td><\/tr><tr><td>1664/66 战年<\/td><td><strong>全归捕获者<\/strong>（仅存海事上将 1/10）<\/td><\/tr><tr><td>1693<\/td><td>国王收 1/5<\/td><\/tr><tr><td><strong>1707<\/strong><\/td><td><strong>王室船的战利品全产权归军官与水手<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>这就是本章的主线<\/strong>：三百年里，抢来的东西<strong>从\"多数不在你手里\"变成了\"多数在你手里\"<\/strong>。玩家所在的年代决定了这条线在哪个位置——请向 GM 问清你们开局是哪一年（12.2 年表）。<br><strong>实测打脸<\/strong> <code>[确]<\/code>：St Philip 案 1587（£114,032＝13.13M 克）实际分账是女王 40.9%、Drake 16.0%、<strong>海事上将只有 3.8%（不是名义的 1/10）<\/strong>、私人投资人 39.3%。<strong>名义规则与实付账目从来不是一回事<\/strong>，而这条差额是最容易做成剧情的一层。<\/blockquote>\n<h3>本作的分配表<\/h3>\n<p><strong>基准：以\"份\"计。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>职务<\/th><th>份数<\/th><th>出处与口径<\/th><\/tr><\/thead><tbody><tr><td><strong>船长<\/strong><\/td><td>6<\/td><td>骨架定稿<\/td><\/tr><tr><td><strong>大副／军需官<\/strong><\/td><td>3<\/td><td>骨架定稿；海盗契约里军需官与船长同为 2 份 <code>[确]<\/code>（罗伯茨条款）——<strong>\"谁管分东西\"在船上比谁指挥更值钱<\/strong><\/td><\/tr><tr><td><strong>技师（炮长／船医／木匠／帆匠／领航）<\/strong><\/td><td>2<\/td><td>骨架定稿<\/td><\/tr><tr><td><strong>士官／小头目<\/strong><\/td><td>1.25–1.5<\/td><td><code>[确]<\/code> 罗伯茨条款 1.25 与 1.5<\/td><\/tr><tr><td><strong>普通水手<\/strong><\/td><td>1<\/td><td><\/td><\/tr><tr><td><strong>船童<\/strong><\/td><td>0.5<\/td><td><code>[推算]<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>PC 按其在船上的实际职务取份<\/strong>（4.4 原型对应：船长 6、大副类 3、技师类 2、其余 1）。<strong>这不是奖励强度，是船上位置<\/strong>——想要 6 份，就得去当那个负责所有人为此去死的人。<\/p>\n<h3>抚恤：断肢价目表<\/h3>\n<p><code>[确]<\/code> <strong>罗伯茨条款<\/strong>：断肢补偿 <strong>800 dollars ≈ 20,448 克 ≈ 3,700 银币<\/strong>（约水手 <strong>16 个月<\/strong>薪饷）。<\/p>\n<div class='tbl'><table><thead><tr><th>损失<\/th><th>本作补偿<\/th><\/tr><\/thead><tbody><tr><td>一手／一足<\/td><td><strong>1.5 份<\/strong> 或 1,000 银币（当场付）<\/td><\/tr><tr><td>一目<\/td><td>0.75 份<\/td><\/tr><tr><td>致命伤（身后）<\/td><td>2 份给指定继承人（<strong>由死者生前写下，见 4.8<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>\"人人满 £1,000 方可提议解散\"<\/strong>——罗伯茨契约里最厉害的一条。它意味着：<strong>这条船是一个有退出条件的合伙公司，不是一个主子带着雇工。<\/strong> 把这条放进你们的战役，玩家会自己写出船上政治。<\/blockquote>\n<h3>团队账本（一页，GM 与玩家共享）<\/h3>\n<pre class='codeblock'><code>船：________  年份：______  许可证：有效/过期/无\n────────────────────────────────────────\n累计毛值：_______ 银币\n已付：修理____ 抚恤____ 欠饷____ 抽成____\n可分池：_______  ÷ 总份数 ______ = 每份 ______\n────────────────────────────────────────\nPC 与具名船员份额：\n  姓名/职务/份数/已取/欠\n普通船员：__人 × 1份 = __份\n────────────────────────────────────────\n欠饷累计：____ 银币（超过一月→士气−5，6.6）<\/code><\/pre>\n<p><strong>这张表是船上每一次争吵的事实依据。<\/strong> GM 每场结算后当场公布每份值多少钱——<strong>不要私下记账<\/strong>。玩家看见\"每份 340 银币\"和\"欠饷 2,000 银币\"同时出现在一张纸上，戏就自己演出来了。<\/p>\n<hr>\n<h2>10.8 声望与恶名<\/h2>\n<p><strong>两条轨，各自 0–100，每势力独立记录。<\/strong> 声望不折算成钱，钱不折算成声望（13.7 四货币不可互换）。<\/p>\n<h3>声望八档与解锁<\/h3>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>分值<\/th><th>名称<\/th><th>买到什么<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0–9<\/td><td><strong>无名<\/strong><\/td><td>你按标准价买货、按 DV15 报关、没人认识你<\/td><\/tr><tr><td>2<\/td><td>10–24<\/td><td><strong>生面<\/strong><\/td><td>有人听说过你们那条船<\/td><\/tr><tr><td>3<\/td><td>25–39<\/td><td><strong>熟人<\/strong><\/td><td><strong>酒馆传闻 +2<\/strong>；商人肯赊一次<\/td><\/tr><tr><td>4<\/td><td>40–54<\/td><td><strong>可信<\/strong><\/td><td><strong>报关 DV −2<\/strong>；可担保他人申请许可证（10.6）<\/td><\/tr><tr><td>5<\/td><td>55–69<\/td><td><strong>有名<\/strong><\/td><td><strong>行情骰 +1 档<\/strong>（有人愿意给你们好价钱）；可接国策级委托<\/td><\/tr><tr><td>6<\/td><td>70–84<\/td><td><strong>名人<\/strong><\/td><td><strong>军港开放<\/strong>；补给与修理 <strong>−25%<\/strong>；总督府可预约<\/td><\/tr><tr><td>7<\/td><td>85–94<\/td><td><strong>传奇<\/strong><\/td><td><strong>官仓取用<\/strong>；可请求护航、检疫豁免、舰队征用豁免<\/td><\/tr><tr><td>8<\/td><td>95–100<\/td><td><strong>传说<\/strong><\/td><td><strong>委托权<\/strong>：你可以向别人发委托。（<strong>这是终局奖励，不是中期<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>恶名<\/h3>\n<div class='tbl'><table><thead><tr><th>恶名<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td>0–19<\/td><td>无<\/td><\/tr><tr><td>20–39<\/td><td>部分港口拒泊；招募 −1 士气起点<\/td><\/tr><tr><td>40–59<\/td><td><strong>海军巡逻遭遇骰 +4<\/strong>；须走 10.4 通道销赃<\/td><\/tr><tr><td>60–79<\/td><td>有正式悬赏（见 10.5 对照档），任何官方港口会试图扣押<\/td><\/tr><tr><td>80–100<\/td><td><strong>引渡即处决<\/strong>。只有走私港、海盗共和国、和某些很富的罪人愿意接待你<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>招募水手<\/strong>在恶名 20–59 段反而是 <strong>+<\/strong>（愿意跟高薪冒险的人有的是）——<strong>恶名买的是\"便宜又勇敢的人\"，代价是\"体面的人不来\"。<\/strong> 这条是刻意的不对称。<\/p>\n<h3>五档账本（回响系统，长团的记忆）<\/h3>\n<p><strong>每次进港，GM 只读 3 分钟、挑 1–2 条兑现，不全兑。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>记什么<\/th><th>公开性<\/th><\/tr><\/thead><tbody><tr><td><strong>恩义档<\/strong><\/td><td>你们救过谁、放过谁、替谁带过话<\/td><td>保密<\/td><\/tr><tr><td><strong>血债档<\/strong><\/td><td>你们杀了谁的人、烧了谁的货<\/td><td>保密<\/td><\/tr><tr><td><strong>传闻档<\/strong><\/td><td>故事越传越走形——<strong>第三次进港时，\"救人的\"会被传成\"杀人的\"<\/strong><\/td><td><strong>可对玩家公开<\/strong><\/td><\/tr><tr><td><strong>场景点档<\/strong><\/td><td>一次关键抉择的独立记档（11.2、12.7）<\/td><td>保密<\/td><\/tr><tr><td><strong>恶化档<\/strong><\/td><td>无人处理时自动升级的那一类<\/td><td>保密<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>兑现优先级：对白 ＞ 价格 ＞ 事件。<\/strong>（一个 NPC 当面说出你做过什么，比涨价有效十倍。）<\/p>\n<blockquote class='quote'><strong>【历史注】<\/strong> <code>[确]<\/code> 荷兰对大型敌船的官方悬红为 <strong>8,000–30,000 盾（76,800–288,000 克）<\/strong>——相当于 <strong>1–3 艘中型货船的造价<\/strong>，且<strong>击沉减半、必须捕获<\/strong>。<strong>这条规则解释了为什么现实中的人要接舷，而不要炮击到沉<\/strong>：把\"打沉\"和\"打钱\"绑死，玩家就会自己发明出跳帮队。<\/blockquote>\n<hr>\n<h2>10.9 委托与合约（钱的那一面）<\/h2>\n<p><strong>六段式委托<\/strong>是全书的任务骨架（接委托 → 备航 → 航行 → 遭遇 → 探险 → 结算）。本章只管其中两段的账：<strong>接委托<\/strong>和<strong>结算<\/strong>。<\/p>\n<h3>五种合约形式<\/h3>\n<div class='tbl'><table><thead><tr><th>形式<\/th><th>预付<\/th><th>结算<\/th><th>谁爱用<\/th><\/tr><\/thead><tbody><tr><td><strong>包运（freight）<\/strong><\/td><td>10–25%<\/td><td>到港交货即付全<\/td><td>商行；最稳、最不刺激<\/td><\/tr><tr><td><strong>赏格（bounty）<\/strong><\/td><td>无<\/td><td>按头/按门/按船<\/td><td>海军：<strong>人头赏金（head money）<\/strong> 1648 <strong>£10/门<\/strong> → 1693/1707 <strong>£5/门或£5/人<\/strong><\/td><\/tr><tr><td><strong>分成合约（prise share）<\/strong><\/td><td>无<\/td><td>按 10.7 份数<\/td><td>私掠；<strong>赌的是货，不是赏金<\/strong><\/td><\/tr><tr><td><strong>年费雇佣（station）<\/strong><\/td><td>月薪 ×12<\/td><td>期满结清<\/td><td>护航、封港——<strong>每航段维持 1 班次<\/strong>（13.3）<\/td><\/tr><tr><td><strong>期权／包销<\/strong><\/td><td>无<\/td><td><strong>约定价强制收购<\/strong><\/td><td>垄断商团；<strong>这条会让玩家第一次感受到\"体制\"的重量<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>委托卡的三条设计红线<\/h3>\n<ol class='mdlist'><li><strong>委托人必有误差<\/strong>——他给的情报一定有至少一处是错的，且错在他自己也不知道的地方。<\/li><li><strong>反转指向委托人一侧<\/strong>，不指向\"路上冒出来的敌人\"。<\/li><li><strong>每条委托都要能算出一句\"一个没了这条线还剩多少\"<\/strong>（13.3 画线的时刻）——否则它是任务标记，不是机会。<\/li><\/ol>\n<hr>\n<h2>10.10 称号与长期目标（战役级奖励）<\/h2>\n<p>从\"持证船长\"往上，每一级都不是钱，是<strong>准入<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>称号<\/th><th>门槛<\/th><th>打开的东西<\/th><\/tr><\/thead><tbody><tr><td><strong>持证船长<\/strong><\/td><td>持有有效许可证<\/td><td>合法销赃；捕获法庭可诉<\/td><\/tr><tr><td><strong>港务座上宾<\/strong><\/td><td>任一港声望 55+<\/td><td>提前 3–6 个月的行情爬升带情报<\/td><\/tr><tr><td><strong>合伙船东<\/strong><\/td><td>持有 ≥1/4 股份<\/td><td>有权决定这条船去哪儿<\/td><\/tr><tr><td><strong>私掠队长<\/strong><\/td><td>声望 70+ 且恶名 &lt;60<\/td><td>指挥一支 2–4 船的编队（阵位令 9.3）<\/td><\/tr><tr><td><strong>海域执法者<\/strong><\/td><td>声望 85+<\/td><td><strong>可发委托给别人<\/strong>（14.3 第三幕的入场券）<\/td><\/tr><tr><td><strong>舰队委托<\/strong><\/td><td>声望 95+ 且恶名 &lt;40<\/td><td>一支真舰队；以及<strong>一位真正的敌人<\/strong>（12.6 著名 NPC 全部转向你）<\/td><\/tr><tr><td><strong>燃帆<\/strong><\/td><td>战役终局<\/td><td>你的名字成为一个地理名词<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注·为什么恶名会封顶称号】<\/strong> 因为\"名扬四海\"这条玩家诉求（见团前问卷）在现实里<strong>只能靠一种名声兑现<\/strong>。想要舰队，就得在帝国那边干净；想要干净，就不能在帝国那边打。这个两难不做修正——它是本作给长团的礼物。<\/blockquote>\n<hr>\n<h2>10.11 三十秒速查<\/h2>\n<ul class='mdlist'><li><strong>一切按舱位算<\/strong>：1 舱位 = 1 整批；基价见 10.1，短程利 10–20%／远洋 30–36%／<strong>&gt;40% 必有垄断<\/strong><\/li><li><strong>行情骰 d6<\/strong>：×0.6／0.8／1.0／1.3／1.7／2.4；探听＝交易 DV13<\/li><li><strong>进港六件<\/strong>：报关 → 港务费 → 补给 → 修理（大修＝造价27%）→ 招募 → <strong>传闻<\/strong><\/li><li><strong>传闻表 d20<\/strong>：每条必须有落点，没落点就删掉重掷<\/li><li><strong>保险<\/strong>：0.5%–40%，护航 13% 对闯线 19%，<strong>阿姆货保强制 10% 免赔<\/strong><\/li><li><strong>销赃实现率 1/4–1/2<\/strong>；走私是税率的理性反应<\/li><li><strong>许可证保证金 3,000 金币 ≈ 水手 104 年年薪<\/strong>；<strong>过期一天＝海盗<\/strong><\/li><li><strong>船份 1/16 制<\/strong>；战役第一幕的目标是产权，不是一艘船<\/li><li><strong>分账顺序<\/strong>：修理 → 抚恤 → 欠饷 → 抽成 → 分份；断肢补偿 1.5 份<\/li><li><strong>声望八档买准入；恶名单独记，两条曲线互相牵制<\/strong><\/li><\/ul>\n<hr>\n<p><em>钱、名声、和一条船的所有权都齐了。下一章：那些不在这张账本上的东西。<\/em><\/p>","text":"没有人真正发财。少数人发了一次，剩下的人付了账——账本上写得清清楚楚，只是没人愿意读。 本章管钱、管名声、管\"合法\"这门生意。它的数据层来自全部考据中最扎实的一册，因此本章有一条与其他章不同的纪律： 凡本章出现\"两说并立\"，GM 不得自行择一。 你可以选一个来跑你的战役，但必须 明说选了哪个 。这不是学究气——贸易的全部乐趣就在于 玩家不知道该信哪一个 。 本章三立场 ： 贸易是信息游戏，不是记账游戏。 行情骰与传闻表让每座港口有性格，玩家的真正决策是\" 我该信谁 \"。 声望与恶名分开记。 抢了谁，决定了谁怕你、谁敬你、谁在等你进港。两条曲线互相牵制。 合法性是一种可以收购的资产。 私掠许可证、股份、报关单、检疫状—— 这些纸比货贵 ，因为纸能让你把货变成钱。 10.1 商品与基价表 单位 ：一切按 舱位 （一整批，见 6.8）计。价格单位 银币 。 # 商品 产地价 到岸价 波动性格 备注 1 胡椒／丁香／肉豆蔻 800 2,400 高位·极抖 垄断带的定义性商品：肉豆蔻单航次实测利润率达 96.3% [确] 。 禁运时价可上 6× 2 染料（靛蓝、苏木） 250 600 中位·抖 上等靛蓝 60 银币/箱 ，一舱位 ≈10 箱（与 2.4 场景二一致） 3 糖 150 500 中位·稳 [确] 巴西白产地 6.0 克/公斤 → 阿姆到岸 10.2–10.6； 重量惩罚 ：&gt;4 舱位吃水降一档 4 烟草 就删掉重掷 保险 ：0.5%–40%，护航 13% 对闯线 19%， 阿姆货保强制 10% 免赔 销赃实现率 1/4–1/2 ；走私是税率的理性反应 许可证保证金 3,000 金币 ≈ 水手 104 年年薪 ； 过期一天＝海盗 船份 1/16 制 ；战役第一幕的目标是产权，不是一艘船 分账顺序 ：修理 → 抚恤 → 欠饷 → 抽成 → 分份；断肢补偿 1.5 份 声望八档买准入；恶名单独记，两条曲线互相牵制 钱、名声、和一条船的所有权都齐了。下一章：那些不在这张账本上的东西。"},{"num":"11","title":"超自然与传说（可选模块）","vol":"卷三 · 世界与主持区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>水手讲的海怪，从来不是为了让你相信它存在。是为了让你别去那片海。<\/em><\/blockquote>\n<p>本章<strong>整章可关<\/strong>。开团前全桌三选一，写在战役记录第一页：<\/p>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>名称<\/th><th>立场<\/th><\/tr><\/thead><tbody><tr><td><strong>A<\/strong><\/td><td><strong>关闭<\/strong><\/td><td>纯历史。海难、疫病、疯狂、以及人干的事——已经够了<\/td><\/tr><tr><td><strong>B<\/strong><\/td><td><strong>模糊<\/strong>（默认推荐）<\/td><td><strong>传说永远无法被完全证实<\/strong>。规则不回答\"那是不是真的\"<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td><strong>显性<\/strong><\/td><td>海怪真实存在；仪式有效；深海里有东西在数人头<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>建团问卷已定调<\/strong>：本作偏写实、低魔，海岸与航线一带<strong>本格无魔法<\/strong>（新大陆内陆可以不同）。所以本章的默认值是 <strong>B<\/strong>，不是 C——<strong>B 让考据继续有效，同时保留恐惧<\/strong>。<br>换档不需要重开战役。GM 只需要改变<strong>一件事<\/strong>：那个传说到底有没有第二种解释。<\/blockquote>\n<hr>\n<h2>11.1 三档模式对各章表格的影响<\/h2>\n<div class='tbl'><table><thead><tr><th>位置<\/th><th>【关闭】<\/th><th>【模糊】<\/th><th>【显性】<\/th><\/tr><\/thead><tbody><tr><td><strong>13.5 海上遭遇表<\/strong><\/td><td>无超自然条目<\/td><td>追加 3 条\"可以自然解释\"的条目（雾中灯、不存在的船、无风的方形海域）<\/td><td>追加 6 条，含 11.5 四怪<\/td><\/tr><tr><td><strong>7.5 海况表 20 格<\/strong><\/td><td>风暴<\/td><td>风暴，<strong>或一片不该有雾的地方起了雾<\/strong><\/td><td>风暴，或者<strong>它<\/strong><\/td><\/tr><tr><td><strong>7.8 疾病<\/strong><\/td><td>坏血／热病／痢疾<\/td><td>＋\"无名热\"（找不到病原，找不到药）<\/td><td>＋<strong>渊创症<\/strong><\/td><\/tr><tr><td><strong>8.3 发现表<\/strong><\/td><td>全部保留（它们本来就自然）<\/td><td>每表追加 1 条\"不该在这里的东西\"<\/td><td>追加 2 条＋一处祭场<\/td><\/tr><tr><td><strong>9.5 部位表 10 格<\/strong><\/td><td>火药舱<\/td><td>火药舱<\/td><td><strong>或底下有什么在上来<\/strong><\/td><\/tr><tr><td><strong>5.8 神秘学<\/strong><\/td><td><strong>不开放<\/strong><\/td><td>开放（辨识真伪，但<strong>永不给出确认<\/strong>）<\/td><td>完全开放（含仪式基、渊语）<\/td><\/tr><tr><td><strong>11.2 恐惧<\/strong><\/td><td>只用\"胆魄检定 vs 恐惧 DV\"，不积压力<\/td><td>完整：压力、心结、潮汐恐慌表<\/td><td>完整＋渊创单独记账<\/td><\/tr><tr><td><strong>11.4 仪式<\/strong><\/td><td>不存在<\/td><td><strong>有效，但结果永远有两种解释<\/strong><\/td><td>有效，且<strong>有价格<\/strong><\/td><\/tr><tr><td><strong>11.5 海怪<\/strong><\/td><td>全是自然现象<\/td><td>数据相同，成因留给 GM<\/td><td>数据即事实<\/td><\/tr><tr><td><strong>11.6 幽灵船<\/strong><\/td><td>一条被疫或哗变毁掉的船<\/td><td>见 11.6 的三张病因表<\/td><td>见 11.6 第四张<\/td><\/tr><tr><td><strong>11.7 诅咒<\/strong><\/td><td>一批带账的赃物<\/td><td>拿走即出事，<strong>但事可以用自然方式发生<\/strong><\/td><td>真的中咒<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>【模糊】档的唯一操作纪律<\/h3>\n<p><strong>GM 手册里每一个传说必须写两个可能真相。选一个作为\"本战役的事实\"，但永远不说出来。<\/strong><\/p>\n<ul class='mdlist'><li>若一桌玩家永远无法证伪，这个模块就跑对了。<\/li><li>若某次判定会改变后续判定（例如\"是不是有人下的毒\"影响一次威吓），<strong>就用你选定的那个真相结算，不改<\/strong>。<\/li><li><strong>玩家猜对了也不算穿帮。<\/strong> 那就当成他们的角色聪明。<\/li><\/ul>\n<hr>\n<h2>11.2 恐惧、镇定与心结<\/h2>\n<h3>镇定值<\/h3>\n<blockquote class='quote'><strong>镇定 = 胆魄 × 3<\/strong>（胆魄 3 → 镇定 9）<\/blockquote>\n<p><strong>直面下列情形时掷 <code>d20 + 胆魄 ≥ 恐惧 DV<\/code><\/strong>，失败则<strong>镇定 −1d4<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>情形<\/th><th>恐惧 DV<\/th><\/tr><\/thead><tbody><tr><td>看见同伴被海吞走<\/td><td>10<\/td><\/tr><tr><td>看见不该存在的伤口／不可能的死法<\/td><td>13<\/td><\/tr><tr><td>雾中有声音在回答你<\/td><td>16<\/td><\/tr><tr><td>一整个仪式已经完成，而你在场<\/td><td>19<\/td><\/tr><tr><td><strong>直视深渊本身<\/strong><\/td><td>22<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>修正<\/strong>：有同伴在侧（每人 +1，上限 +3）／船医坐镇 +2／【圣痕】天赋对超自然存在直接<strong>优势<\/strong>（4.6）／疲劳 ≥1 级 −2。<\/p>\n<p><strong>镇定归零 = 崩溃时刻<\/strong>：掷 11.2 心结表，且本航段不能执行任何战位动作。<\/p>\n<h3>三分创伤<\/h3>\n<p>本作把恐惧分三类，因为<strong>它们的解法不一样<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>创<\/th><th>来源<\/th><th>短期表现<\/th><th>长期走向<\/th><\/tr><\/thead><tbody><tr><td><strong>尸创<\/strong><\/td><td>人死、自己杀了人、甲板上那些东西<\/td><td>呕吐、手抖、失眠<\/td><td><strong>执念<\/strong>（对某个名字、某场战斗）<\/td><\/tr><tr><td><strong>海创<\/strong><\/td><td>风暴、无风、深水、溺水、漂<\/td><td>不敢上甲板、怕静、怕黑水<\/td><td><strong>惧海<\/strong>（一条他再也不肯走的航线）<\/td><\/tr><tr><td><strong>渊创<\/strong><\/td><td>不该看见的东西、仪式、不可能的几何<\/td><td>说出没人听得懂的话<\/td><td><strong>渊语<\/strong>（一种能力，也是一种病）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>为什么分三类<\/strong>：因为玩家会自己找到解法——<strong>尸创靠人（谈、埋、偿），海创靠岸（停泊、陆上、热食），渊创靠不了任何人。<\/strong> 三条轨道各自的解药不一样，恐惧才不会变成一条无意义的减益条。<\/blockquote>\n<h3>心结表（d20；镇定归零或失败三次时掷）<\/h3>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>心结<\/th><th>短期<\/th><th>长期（若不处理）<\/th><\/tr><\/thead><tbody><tr><td>1–3<\/td><td><strong>失眠<\/strong><\/td><td>每昼夜疲劳 +1；值夜不能睡<\/td><td>疲劳不可清；胆魄 −1<\/td><\/tr><tr><td>4–6<\/td><td><strong>恐慌<\/strong><\/td><td>进入某类场景时掷胆魄 DV13，失败即本轮只能防御<\/td><td>场景类型越来越多<\/td><\/tr><tr><td>7–9<\/td><td><strong>手抖<\/strong><\/td><td>机敏检定劣势（火器、开锁、外科）<\/td><td>永久 −1 机敏<\/td><\/tr><tr><td>10–12<\/td><td><strong>执念<\/strong><\/td><td><strong>必须<\/strong>回到那个坐标／完成那件事<\/td><td>见下\"执念作为资产\"<\/td><\/tr><tr><td>13–14<\/td><td><strong>惧海<\/strong><\/td><td>拒绝某类航段；该班次的战位空缺<\/td><td>全船知道，士气 −1<\/td><\/tr><tr><td>15–16<\/td><td><strong>失语<\/strong><\/td><td>不能主动说话；人望 −2<\/td><td>秘密说不出口<\/td><\/tr><tr><td>17<\/td><td><strong>麻木<\/strong><\/td><td><strong>免疫恐惧<\/strong>，但也免疫士气加成（7.7 中你不再给 +1）<\/td><td>船员开始怕你<\/td><\/tr><tr><td>18<\/td><td><strong>预言<\/strong><\/td><td>每个航段末可说出一句\"我看见了\"——GM 必须给真东西，但<strong>以隐喻给<\/strong><\/td><td>有人开始来问你<\/td><\/tr><tr><td>19<\/td><td><strong>渊语<\/strong><\/td><td>能读懂不该读的东西（+4）；每次使用后 1d4 点镇定<\/td><td>每次读，世界就少一层<\/td><\/tr><tr><td>20<\/td><td><strong>它认得你了<\/strong><\/td><td><strong>GM 记档<\/strong>：此后任一遭遇表出现同一标志（11.5）<\/td><td>这是战役级伏笔<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>执念是资产，不是惩罚<\/h3>\n<p><strong>心结不扣经验，不锁能力。<\/strong> 它做三件事：<\/p>\n<ol class='mdlist'><li><strong>它给这个角色一个可被剧情触发的钩子<\/strong>（GM 因此可以为他单独开一幕）；<\/li><li><strong>它给玩家一个扮演抓手<\/strong>（\"他现在怕什么\"比\"他现在 −2\"有用一百倍）；<\/li><li><strong>它可以被写进 3.9 的卓越扮演加分<\/strong>。<\/li><\/ol>\n<blockquote class='quote'><strong>【设计注】<\/strong> 本作的立场：<strong>创伤是故事的资产，不是数值的税负。<\/strong> 唯一必须硬的是\"不处理会恶化\"——因为<strong>海上没有人会替你长期扛着<\/strong>。<\/blockquote>\n<h3>治疗<\/h3>\n<div class='tbl'><table><thead><tr><th>手段<\/th><th>效果<\/th><th>出处<\/th><\/tr><\/thead><tbody><tr><td><strong>热食＋一夜好睡<\/strong>（陆上或安全港）<\/td><td>−1 级短期表现<\/td><td>7.7<\/td><\/tr><tr><td><strong>船医照护<\/strong><\/td><td>移除 1 级疲劳，或让一次心结判定重试（医术 DV16）<\/td><td>3.7<\/td><\/tr><tr><td><strong>一次可验证的偿还<\/strong>（把尸体埋了、把名字说了、把货还了）<\/td><td><strong>直接清掉一类尸创<\/strong><\/td><td>10.8 账本<\/td><\/tr><tr><td><strong>回到陆上过一个完整停泊期<\/strong><\/td><td>一切短期表现清零；长期不动<\/td><td>—<\/td><\/tr><tr><td><strong>长期<\/strong><\/td><td>心结变成<strong>性格<\/strong>——它是资产，不是病<\/td><td>4.8<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>羁绊投射（本章最强的一条规则）<\/h3>\n<blockquote class='quote'><strong>你可以花 1d4 点镇定，把一次即将发生的恐惧转嫁给你羁绊栏上的那个具体的人（4.8）。<\/strong><br>他承接这次效果。GM 在账本上记一笔：<strong>你们之间的东西，刚刚动过了。<\/strong><\/blockquote>\n<ul class='mdlist'><li>用完后你自己的那次恐惧不结算——<strong>你什么也没感觉到<\/strong>。这很重要。<\/li><li>对方若也在场，可掷胆魄 DV15 拒绝承接（<strong>拒了，你们两个都记一笔<\/strong>）。<\/li><li>【关闭】档下<strong>依然有效<\/strong>：它转嫁的是\"你替他扛了\"这件事，不是超自然。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注】<\/strong> 这条规则的全部意义是：<strong>它让\"我把别人推进坑里\"变成一个可以按下的按钮。<\/strong> 建团问卷里有一个玩家说\"必要的时候我甚至会把自己作为棋子添到死位\"——这条是给那种人的镜像：<strong>你也可以把别人放上去。<\/strong> 十场之后，你们会开始讨论这条该不该留在桌上。那时本模块就成功了。<\/blockquote>\n<h3>潮汐恐慌表（每个航段末）<\/h3>\n<blockquote class='quote'>掷 <strong>d20<\/strong>。若结果 <strong>≤ 你当前的压力值<\/strong>（压力 = 本航段失败次数 + 未处理的心结数 + 疲劳等级），则当夜发作一次（从心结表选一项，或重掷）。<br><strong>11–15 段是本模块的航海钩子带<\/strong>：这一段掷出的发作<strong>必须<\/strong>与海、与航线、与某个具体坐标有关——那是 GM 埋 12.7 秘密的免费机会。<\/blockquote>\n<hr>\n<h2>11.3 神秘学（5.8，档位限定）<\/h2>\n<ul class='mdlist'><li><strong>【关闭】<\/strong>：不存在。有人卖，有人买，全是假的（史学／欺骗处理）。<\/li><li><strong>【模糊】<\/strong>：开放。辨识真伪 DV13–16，<strong>但成功只给出\"这一条与哪条已知传说相符\"<\/strong>，不给结论。<\/li><li><strong>【显性】<\/strong>：完全开放。<strong>渊语<\/strong>分支每次使用消耗 1d4 镇定（11.2）。<\/li><\/ul>\n<hr>\n<h2>11.4 仪式与遗物<\/h2>\n<h3>仪式 = 长时间 ＋ 多步 ＋ 真实代价<\/h3>\n<p>一个仪式不是法术位。它是一张流程表：<\/p>\n<div class='tbl'><table><thead><tr><th>步<\/th><th>内容<\/th><th>检定<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>① 备<\/td><td>找料、找地方、找时候<\/td><td>博物学／史学 DV14<\/td><td>1–2 班次；料 60–300 银币<\/td><\/tr><tr><td>② 定<\/td><td>摆、画、算准<\/td><td>工程／绘图 DV15<\/td><td>失败即③自动劣化<\/td><\/tr><tr><td>③ 唱<\/td><td>2–3 轮（战斗轮），期间主持者<strong>不能防御<\/strong><\/td><td>神秘学 DV16；被打断＝失控<\/td><td><strong>血<\/strong>（1d3 HP）／<strong>时间<\/strong>（一个完整航段）／<strong>记忆<\/strong>（永久删掉一件你真的记得的事）<\/td><\/tr><tr><td>④ 收<\/td><td>结果落地<\/td><td>POW 对抗（本作＝<strong>胆魄 vs 施术者胆魄＋神秘学<\/strong>）<\/td><td>失控则全组恐惧 DV16<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>代价三选一，不可用银币替代。<\/strong> 这条是硬规：<strong>能被买下的东西不叫代价，叫成本。<\/strong><\/p>\n<p><strong>【模糊】档下<\/strong>：仪式<strong>一定有效<\/strong>，但<strong>结果永远有第二种解释<\/strong>（风恰好转了、潮恰好退了、那个人恰好死了）。<\/p>\n<h3>遗物 = 有性格的装备<\/h3>\n<p>一件遗物必须有四行：<\/p>\n<pre class='codeblock'><code>名：__________\n来历：（一句；且这句必须是别人讲给你们的，不是你们查到的）\n它能做什么：（一件具体的事；不是&quot;加成&quot;）\n它拒绝什么：（一个人、一类地方、或一条它不肯做事的规矩）<\/code><\/pre>\n<p><strong>\"拒绝\"这一行才是遗物的价值<\/strong>。一件什么都不拒绝的装备是 +1 武器，那是第6章的东西，不归本章管。<\/p>\n<blockquote class='quote'><strong>例<\/strong>：一枚不属于任何已知铸造厂的火漆印。<strong>它能<\/strong>让任一港口承认这封信是真的；<strong>它拒绝<\/strong>在有过火场的屋子里被使用。GM 拿到这一行，就拿到了三场戏。<\/blockquote>\n<hr>\n<h2>11.5 海怪图鉴（遭遇结构，不是属性堆）<\/h2>\n<p><strong>每只怪给四件东西：预警征兆 → 第一阶段 → 撤退窗口 → 若必须打的代价。<\/strong><br>本作不鼓励打克拉肯。本作鼓励<strong>活下来，并画出它的海图<\/strong>（那值 XP 和声望，8.7）。<\/p>\n<h3>克拉肯／深渊之腕<\/h3>\n<div class='tbl'><table><thead><tr><th>项<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><strong>预警<\/strong><\/td><td>海面上出现一块<strong>不合理的暖水<\/strong>；鸟全走了；海底下有一片\"颜色\"在上升（瞭望 DV13）<\/td><\/tr><tr><td><strong>第一阶段<\/strong><\/td><td>一条腕缠上桅或舷（操帆 DV16 砍索；掌舵 DV16 拉开）。船体 2d10 伤害<\/td><\/tr><tr><td><strong>撤退窗口<\/strong><\/td><td><strong>它只试一次。<\/strong> 若第一轮你们没砍掉、也没拉开，它会再收一次——<strong>但第二次之前有整整一轮可以砍缆脱身<\/strong><\/td><\/tr><tr><td><strong>若必须打<\/strong><\/td><td>腕 HP 40、防御 15；打腕不致命，<strong>打不到头<\/strong>；每一次命中它，全组恐惧 DV16<\/td><\/tr><tr><td><strong>代价<\/strong><\/td><td>击退它 = 船体 −4d6、帆况失帆、士气 −3；且<strong>你的船现在被记住了<\/strong>（心结 20 格）<\/td><\/tr><tr><td><strong>XP<\/strong><\/td><td><strong>活着离开 = +1<\/strong>；画出它的坐标 = +2（<strong>这才是这一场的奖励<\/strong>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>海蛇／长脊<\/h3>\n<div class='tbl'><table><thead><tr><th>项<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><strong>预警<\/strong><\/td><td>海面上一段\"不会起伏的浪\"在平行移动；测深锤读数骤变<\/td><\/tr><tr><td><strong>第一阶段<\/strong><\/td><td>它只是<strong>经过<\/strong>（船体 −1d6，或什么都没发生）。多数遭遇到此结束<\/td><\/tr><tr><td><strong>撤退窗口<\/strong><\/td><td><strong>不要追它。<\/strong> 追它 = 进入 11.2 渊创判定，且它回头<\/td><\/tr><tr><td><strong>若必须打<\/strong><\/td><td>船体 60、防御 13；它的身体太长，你的炮打不满一轮<\/td><\/tr><tr><td><strong>真实收益<\/strong><\/td><td>测绘它经过的这条水道——<strong>它知道哪条路能走<\/strong>（海图升\"测绘\"，+1 XP）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>巨鲸\"老祖父\"<\/h3>\n<div class='tbl'><table><thead><tr><th>项<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><strong>预警<\/strong><\/td><td>喷气声，隔着一座岛也听得见；海面浮油；小艇不能下<\/td><\/tr><tr><td><strong>第一阶段<\/strong><\/td><td>它撞（船体 3d6＋全组机敏豁免 DV13 倒地）。<strong>它不是攻击你，它是不高兴<\/strong><\/td><\/tr><tr><td><strong>撤退窗口<\/strong><\/td><td><strong>停船、别划、别敲钟<\/strong>。筋骨 DV13 稳住士气，它自己走<\/td><\/tr><tr><td><strong>若必须打<\/strong><\/td><td>船体 120、防御 14；<strong>捕它需要的东西你们身上没有<\/strong>（猎叉、长绳、六个人、以及一条不怕死的小艇）<\/td><\/tr><tr><td><strong>真实收益<\/strong><\/td><td>一头死的\"老祖父\"值 3,000–8,000 银币（鲸油与骨，6.9）。<strong>这是本战役最赚也最蠢的一件事<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>鲨群<\/h3>\n<div class='tbl'><table><thead><tr><th>项<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><strong>预警<\/strong><\/td><td>落水者还在扑腾。<strong>这就是预警<\/strong><\/td><\/tr><tr><td><strong>第一阶段<\/strong><\/td><td>每 2 轮一次 d20：≤6 → 咬（2d6 利刃，部位变体下必中腿）<\/td><\/tr><tr><td><strong>撤退窗口<\/strong><\/td><td><strong>把人拉上来。<\/strong> 船体侧倾、绳索、以及一个人肯伸手<\/td><\/tr><tr><td><strong>若必须打<\/strong><\/td><td>无意义。<strong>这是本图鉴里唯一一只不能通过战斗解决的条目<\/strong><\/td><\/tr><tr><td><strong>它的作用<\/strong><\/td><td>它是\"落水\"这一件事的价格标签（2.4 溺水、7.9 弃船）。<strong>GM 用它是为了让人数清点变得有意义<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>【设计注·四只怪的共同结构】<\/strong> 四只里三只<strong>不该打<\/strong>，一只<strong>打不赢<\/strong>。这不是示弱，这是本作的英雄观：<strong>他因为活下来了，所以是英雄。<\/strong><\/blockquote>\n<hr>\n<h2>11.6 幽灵船（完整程序）<\/h2>\n<p><strong>这是一套可复用的遭遇脚本，五步。<\/strong><\/p>\n<h3>① 雾<\/h3>\n<p>雾中（7.10）瞭望失效，遭遇骰 +2。然后：<strong>你们看见一盏不该在那里的信号灯。<\/strong><\/p>\n<h3>② 靠近<\/h3>\n<div class='tbl'><table><thead><tr><th>选项<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>喊话<\/td><td>有回应。<strong>回应的不是刚才那句话<\/strong><\/td><\/tr><tr><td>绕开<\/td><td>它也绕。<strong>同一航线，同舷，同速<\/strong><\/td><\/tr><tr><td>上钩（接舷 DV14）<\/td><td><strong>它比你们先动手钩住你们<\/strong>（10.5）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>③ 登船：查全员死因（这一步是本遭遇的核心）<\/h3>\n<p><strong>每艘幽灵船只有一个死因。GM 从下面选一张，然后只用现场证据说：<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>档<\/th><th>死因<\/th><th>现场线索<\/th><th>若【模糊】还有第二种解释<\/th><\/tr><\/thead><tbody><tr><td><strong>一<\/strong><\/td><td><strong>疫<\/strong><\/td><td>所有人死在岗位上、无挣扎、货未动、醋与香袋烧尽了<\/td><td>疫是真的——<strong>这就是普通船沉没的样子<\/strong><\/td><\/tr><tr><td><strong>二<\/strong><\/td><td><strong>哗变<\/strong><\/td><td>船长被吊在自己舱门口；小艇少了一条；账本被撕<\/td><td><strong>人干的。<\/strong> 7.7 的账，只是付晚了<\/td><\/tr><tr><td><strong>三<\/strong><\/td><td><strong>缺水<\/strong><\/td><td>水桶全空且全被凿开；有人在舱壁上写满了名字<\/td><td>有人疯了。疯是人干的<\/td><\/tr><tr><td><strong>四<\/strong>（仅【显性】）<\/td><td><strong>它们上来了<\/strong><\/td><td>全员面朝同一方向站着；没有伤口；航海日志最后三页被撕走<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>④ 诅咒条件（拿走才生效）<\/h3>\n<blockquote class='quote'><strong>什么都不碰 = 什么都不发生。<\/strong><br><strong>拿一件东西 = 拿一条诅咒。<\/strong> 见 11.7。<\/blockquote>\n<p><strong>唯一可以合法带走的<\/strong>：航海日志（<strong>不触发诅咒，但它是本章最值钱的东西<\/strong>——8.7、12.7）。<\/p>\n<h3>⑤ 撤离<\/h3>\n<p>脱开钩索（砍缆，双方各一次借机，9.6）；或<strong>带着它<\/strong>（若它钩住了你们，你们今晚的速度 ×0.5）。<\/p>\n<h3>结算<\/h3>\n<div class='tbl'><table><thead><tr><th>结果<\/th><th>拿什么<\/th><\/tr><\/thead><tbody><tr><td>只读了日志<\/td><td><strong>一条航线情报＋一个传闻锚点<\/strong>（8.1）＋ +1 XP<\/td><\/tr><tr><td>拖回了它<\/td><td>一条船（船体 1、失帆、进水 1 级，7.9）——<strong>这是本作最赚的劫掠，也是最贵的<\/strong><\/td><\/tr><tr><td>拿了东西<\/td><td>见 11.7<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>11.7 诅咒宝藏（模板）<\/h2>\n<h3>结构<\/h3>\n<blockquote class='quote aside-voice'><strong>拿走即中咒。解除条件就藏在\"你拿走的那一刻\"的三件细节里。<\/strong><\/blockquote>\n<p><strong>GM 填写模板：<\/strong><\/p>\n<pre class='codeblock'><code>物：____________（一件具体的、可被拿着的东西）\n它属于谁：____________（一个有名字的、能来要的东西）\n拿走那一刻的三个细节：\n  ① 当时天气／海况：____________\n  ② 谁的手先碰到它：____________\n  ③ 现场有一样东西不在它该在的位置：____________\n诅咒的显现（三阶段，各 1d3 天间隔）：____________\n解除（三线索原则：任何一条细节都能推出真相的一部分）：____________<\/code><\/pre>\n<h3>诅咒三阶段（不要一次给完）<\/h3>\n<div class='tbl'><table><thead><tr><th>阶段<\/th><th>表现<\/th><\/tr><\/thead><tbody><tr><td>一<\/td><td><strong>不对劲<\/strong>：器物挪位、有人多看了一眼、士气 −1<\/td><\/tr><tr><td>二<\/td><td><strong>要还<\/strong>：一扇门打开、一个名字被提到、<strong>你们在别的港口听说了自己的故事<\/strong>（10.8 传闻档走形）<\/td><\/tr><tr><td>三<\/td><td><strong>它来了<\/strong>：一条船、一场风暴、一个人——<strong>且它总在同一片水域<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三线索原则（本作通用的解谜纪律）<\/h3>\n<p><strong>每一条诅咒的解除，必须有三条独立通路<\/strong>（8.4 同）：<\/p>\n<ol class='mdlist'><li><strong>查<\/strong>（史学／律法／语言学，找出它属于谁）<\/li><li><strong>还<\/strong>（回到原处；这是最贵的一条，因为原处通常在别人的航线上）<\/li><li><strong>替代<\/strong>（找一件\"分量相等\"的东西——<strong>由 GM 判定什么算相等<\/strong>，且这个判定本身就是戏）<\/li><\/ol>\n<blockquote class='quote'><strong>【设计注】<\/strong> 诅咒存在的唯一理由，是<strong>逼玩家处理一件他们本来会忘记的东西<\/strong>。一件被忘记的赃物是背景；一件回来要账的赃物是剧情。<strong>所以诅咒必须准时<\/strong>——GM 请照表推进，别心软。<\/blockquote>\n<hr>\n<h2>11.8 航海恐怖基调：三原则<\/h2>\n<p><strong>要跑恐怖，只需守住这三条。它们不需要任何骰子。<\/strong><\/p>\n<h3>① 等待<\/h3>\n<p><strong>恐惧的燃料是时间，不是怪物。<\/strong><br>一个航段 = 四小时。一次无风 = 三个航段。一场风暴 = 六次三掷。<br><strong>把这些时间说出来。<\/strong> \"你们又漂过了一个班次，海还是平的\"——这一句比任何触手都贵。<\/p>\n<h3>② 未知<\/h3>\n<p><strong>不要解释。<\/strong> 解释是恐怖的终结。<br>GM 台词模板：\"<strong>它过去了。<\/strong>\"（不说是什么，不说为什么，不说它会不会回来。）<\/p>\n<h3>③ 不可直视<\/h3>\n<p><strong>任何\"看清楚了\"的代价都是一次渊创判定（11.2）。<\/strong><br>凡是允许玩家\"仔细看\"的场合，先问一次：<strong>你确定要看清吗？<\/strong><br>玩家说确定之后，GM 给答案——<strong>而答案必须让人希望没问过<\/strong>。<\/p>\n<h3>安全工具（跑恐怖必带，不是可选）<\/h3>\n<div class='tbl'><table><thead><tr><th>工具<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td><strong>Lines &amp; Veils<\/strong><\/td><td>开团前每人写：一条不许碰（Line）、一条可以碰但要预告（Veil）<\/td><\/tr><tr><td><strong>X-Card<\/strong><\/td><td>一张卡放在桌上，任何人点它＝立刻删掉刚才那段，不问理由，不留记录<\/td><\/tr><tr><td><strong>GM 开场声明<\/strong><\/td><td>明说本桌有恐惧、有死亡、有背叛（11.2 羁绊投射）。<strong>说了，玩家才能真的投入<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>【设计注】<\/strong> 这三件工具不是礼貌。本作有一整套会伤人的规则（羁绊投射、心结、具名船员会死）。<strong>没有安全工具的桌，玩家会自我审查，而自我审查的玩家玩不出这一章设计的东西。<\/strong><\/blockquote>\n<hr>\n<h2>11.9 三十秒速查<\/h2>\n<ul class='mdlist'><li><strong>开团前三选一：关闭／模糊（默认）／显性<\/strong>，写在战役记录第一页<\/li><li><strong>模糊档唯一纪律<\/strong>：每个传说写两个真相，选一个，永不说<\/li><li><strong>镇定 = 胆魄×3<\/strong>；恐惧 <code>d20+胆魄 ≥ 10/13/16/19/22<\/code>；失败 −1d4 镇定<\/li><li><strong>三分创伤<\/strong>：尸创（靠人解）／海创（靠岸解）／渊创（无解）<\/li><li><strong>心结是资产<\/strong>：给钩子、给扮演、给卓越扮演加分；唯一硬的是\"不处理会恶化\"<\/li><li><strong>羁绊投射<\/strong>：花 1d4 镇定，把恐惧转给羁绊栏上那个人。<strong>关闭档也可用<\/strong><\/li><li><strong>潮汐恐慌表<\/strong>：每航段末 d20 ≤ 压力值即发作；11–15 段是航海钩子带<\/li><li><strong>仪式代价三选一（血／时间／记忆），不可用钱买<\/strong><\/li><li><strong>海怪四只，三只不该打，一只打不赢<\/strong><\/li><li><strong>幽灵船：只读日志免费；拿东西必中咒；不碰就没事<\/strong><\/li><li><strong>诅咒三阶段必须准时推进<\/strong><\/li><li><strong>恐怖三原则：等待／未知／不可直视；安全工具三件套必带<\/strong><\/li><\/ul>\n<hr>\n<p><em>本章结束。下一章是我们真正要建造的东西：那片海本身。<\/em><\/p>","text":"水手讲的海怪，从来不是为了让你相信它存在。是为了让你别去那片海。 本章 整章可关 。开团前全桌三选一，写在战役记录第一页： 档 名称 立场 A 关闭 纯历史。海难、疫病、疯狂、以及人干的事——已经够了 B 模糊 （默认推荐） 传说永远无法被完全证实 。规则不回答\"那是不是真的\" C 显性 海怪真实存在；仪式有效；深海里有东西在数人头 建团问卷已定调 ：本作偏写实、低魔，海岸与航线一带 本格无魔法 （新大陆内陆可以不同）。所以本章的默认值是 B ，不是 C—— B 让考据继续有效，同时保留恐惧 。 换档不需要重开战役。GM 只需要改变 一件事 ：那个传说到底有没有第二种解释。 11.1 三档模式对各章表格的影响 位置 【关闭】 【模糊】 【显性】 13.5 海上遭遇表 无超自然条目 追加 3 条\"可以自然解释\"的条目（雾中灯、不存在的船、无风的方形海域） 追加 6 条，含 11.5 四怪 7.5 海况表 20 格 风暴 风暴， 或一片不该有雾的地方起了雾 风暴，或者 它 7.8 疾病 坏血／热病／痢疾 ＋\"无名热\"（找不到病原，找不到药） ＋ 渊创症 8.3 发现表 全部保留（它们本来就自然） 每表追加 1 条\"不该在这里的东西\" 追加 2 条＋一处祭场 9.5 部位表 10 格 火药舱 火药舱 或底下有什么在上来 5.8 神秘学 不开放 开放（辨识真伪，但 永不给出确认 ） 完全开放（含仪式基、渊语） 11.2 恐惧 只用\"胆魄检定 vs 恐惧 DV\"，不积压力 完整：压力、心结、潮汐恐慌表 完整＋渊创单独记账 11.4 仪式 不存在 有效，但结果永远有两种解释 有效，且 有价格 11.5 海怪 全是自然现象 数据相同，成因留给 GM 数据即事实 11.6 幽灵船 一条被疫或哗变毁掉的船 见 11.6 的三张病因表 见 11.6 第四张 11.7 诅咒 一批带账的赃物 拿走即出事， 但事可以用自然方式发生 真的中咒 【模糊】档的唯一操作纪律 GM 手册里每一个传说必须写两个可能真相。选一个作为\"本战役的事实\"，但永远不说出来。 若一桌玩家永远无法证伪，这个模块就跑对了。 若某次判定会改变后续判定（例如\"是不是有人下的毒\"影响一次威吓）， 就用你选定的那个真相结算，不改 。 玩家猜对了也不算穿帮。 那就当成他们的角色聪明。 11.2 恐惧、镇定与心结 镇定值 镇定 = 胆魄 × 3 （胆魄 3 → 镇定 9） 直面下列情形时掷 d20 + 胆魄 ≥ 恐惧 DV ，失败则 镇定 −1d4 ： 情形 恐惧 DV 看见同伴被海吞走 10 看见不该存在的伤口／不可能的死法 13 雾中有声音在回答你 16 一整个仪式已经完成，而你在场 19 直视深渊本身 22 修正 ：有同伴在侧（每人 +1，上限 +3）／船医坐镇 +2／【圣痕】天赋对超自然存在直接 优势 （4.6）／疲劳 ≥1 级 −2。 镇定归零 = 崩溃时刻 ：掷 11.2 心结表，且本航段不能执行任何战位动作。 三分创伤 本作把恐惧分三类，因为 它们的解法不一样 ： 创 来源 短期表现 长期走向 尸创 人死、自己杀了人、甲板上那些东西 呕吐、手抖、失眠 执念 （对某个名字、某场战斗） 海创 风暴、无风、深水、溺水、漂 不敢上甲板、怕静、怕黑水 惧海 （一条他再也不肯走的航线） 渊创 不该看见的东西、仪式、不可能的几何 说出没人听得懂的话 渊语 （一种能力，也是一种病） 为什么分三类 ：因为玩家会自己找到解法—— 尸创靠人（谈、埋、偿），海创靠岸（停泊、陆上、热食），渊创靠不了任何人。 三条轨道各自的解药不一样，恐惧才不会变成一条无意义的减益条。 心结表（d20；镇定归零或失败三次时掷） d20 心结 短期 长期（若不处理） 1–3 失眠 每昼夜疲劳 +1；值夜不能睡 疲劳不可清；胆魄 −1 4–6 恐慌 进入某类场景时掷胆魄 DV13，失败即本轮只能防御 场景类型越来越多 7–9 手抖 机敏检定劣势（火器、开锁、外科） 永久 −1 机敏 10–12 执念 必须 回到那个坐标／完成那件事 见下\"执念作为资产\" 13–14 惧海 拒绝某类航段；该班次的战位空缺 全船知道，士气 −1 15–16 失语 不能主动说话；人望 −2 秘密说不出口 17 麻木 免疫恐惧 ，但也免疫士气加成（7.7 中你不再给 +1） 船员开始怕你 18 预言 每个航段末可说出一句\"我看见了\"——GM 必须给真东西，但 以隐喻给 有人开始来问你 19 渊语 能读懂不该读的东西（+4）；每次使用后 1d4 点镇定 每次读，世界就少一层 20 它认得你了 GM 记档 ：此后任一遭遇表出现同一标志（11.5） 这是战役级伏笔 执念是资产，不是惩罚 心结不扣经验，不锁能力。 它做三件事： 它给这个角色一个可被剧情触发的钩子 （GM 因此可以为他单独开一幕）； 它给玩家一个扮演抓手 （\"他现在怕什么\"比\"他现在 −2\"有用一百倍）； 它可以被写进 3.9 的卓越扮演加分 。 【设计注】 本作的立场： 创伤是故事的资产，不是数值的税负。 唯一必须硬的是\"不处理会恶化\"——因为 海上没有人会替你长期扛着 。 治疗 手段 效果 出处 热食＋一夜好睡 （陆上或安全港） −1 级短期表现 7.7 船医照护 移除 1 级疲劳，或让一次心结判定重试（医术 DV16） 3.7 一次可验证的偿还 （把尸体埋了、把名字说了、把货还了） 直接清掉一类尸创 10.8 账本 回到陆上过一个完整停泊期 一切短期表现清零；长期不动 — 长期 心结变成 性格 ——它是资产，不是病 4.8 羁绊投射（本章最强的一条规则） 你可以花 1d4 点镇定，把一次即将发生的恐惧转嫁给你羁绊栏上的那个具体的人（4.8）。 他承接这次效果。GM 在账本上记一笔： 你们之间的东西，刚刚动过了。 用完后你自己的那次恐惧不结算—— 你什么也没感觉到 。这很重要。 对方若也在场，可掷胆魄 DV15 拒绝承接（ 拒了，你们两个都记一笔 ）。 【关闭】档下 依然有效 ：它转嫁的是\"你替他扛了\"这件事，不是超自然。 【设计注】 这条规则的全部意义是： 它让\"我把别人推进坑里\"变成一个可以按下的按钮。 建团问卷里有一个玩家说\"必要的时候我甚至会把自己作为棋子添到死位\"——这条是给那种人的镜像： 你也可以把别人放上去。 十场之后，你们会开始讨论这条该不该留在桌上。那时本模块就成功了。 潮汐恐慌表（每个航段末） 掷 d20 。若结果 ≤ 你当前的压力值 （压力 = 本航段失败次数 + 未处理的心结数 + 疲劳等级），则当夜发作一次（从心结表选一项，或重掷）。 11–15 段是本模块的航海钩子带 ：这一段掷出的发作 必须 与海、与航线、与某个具体坐标有关——那是 GM 埋 12.7 秘密的免费机会。 11.3 神秘学（5.8，档位限定） 【关闭】 ：不存在。有人卖，有人买，全是假的（史学／欺骗处理）。 【模糊】 ：开放。辨识真伪 DV13–16， 但成功只给出\"这一条与哪条已知传说相符\" ，不给结论。 【显性】 ：完全开放。 渊语 分支每次使用消耗 1d4 镇定（11.2）。 11.4 仪式与遗物 仪式 = 长时间 ＋ 多步 ＋ 真实代价 一个仪式不是法术位。它是一张流程表： 步 内容 检定 代价 ① 备 找料、找地方、找时候 博物学／史学 DV14 1–2 班次；料 60–300 银币 ② 定 摆、画、算准 工程／绘图 DV15 失败即③自动劣化 ③ 唱 2–3 轮（战斗轮），期间主持者 不能防御 神秘学 DV16；被打断＝失控 血 （1d3 HP）／ 时间 （一个完整航段）／ 记忆 （永久删掉一件你真的记得的事） ④ 收 结果落地 POW 对抗（本作＝ 胆魄 vs 施术者胆魄＋神秘学 ） 失控则全组恐惧 DV16 代价三选一，不可用银币替代。 这条是硬规： 能被买下的东西不叫代价，叫成本。 【模糊】档下 ：仪式 一定有效 ，但 结果永远有第二种解释 （风恰好转了、潮恰好退了、那个人恰好死了）。 遗物 = 有性格的装备 一件遗物必须有四行： 名：__________ 来历：（一句；且这句必须是别人讲给你们的，不是你们查到的） 它能做什么：（一件具体的事；不是&quot;加成&quot;） 它拒绝什么：（一个人、一类地方、或一条它不肯做事的规矩） \"拒绝\"这一行才是遗物的价值 。一件什么都不拒绝的装备是 +1 武器，那是第6章的东西，不归本章管。 例 ：一枚不属于任何已知铸造厂的火漆印。 它能 让任一港口承认这封信是真的； 它拒绝 在有过火场的屋子里被使用。GM 拿到这一行，就拿到了三场戏。 11.5 海怪图鉴（遭遇结构，不是属性堆） 每只怪给四件东西：预警征兆 → 第一阶段 → 撤退窗口 → 若必须打的代价。 本作不鼓励打克拉肯。本作鼓励 活下来，并画出它的海图 （那值 XP 和声望，8.7）。 克拉肯／深渊之腕 项 内容 预警 海面上出现一块 不合理的暖水 ；鸟全走了；海底下有一片\"颜色\"在上升（瞭望 DV13） 第一阶段 一条腕缠上桅或舷（操帆 DV16 砍索；掌舵 DV16 拉开）。船体 2d10 伤害 撤退窗口 它只试一次。 若第一轮你们没砍掉、也没拉开，它会再收一次—— 但第二次之前有整整一轮可以砍缆脱身 若必须打 腕 HP 40、防御 15；打腕不致命， 打不到头 ；每一次命中它，全组恐惧 DV16 代价 击退它 = 船体 −4d6、帆况失帆、士气 −3；且 你的船现在被记住了 （心结 20 格） XP 活着离开 = +1 ；画出它的坐标 = +2（ 这才是这一场的奖励 ） 海蛇／长脊 项 内容 预警 海面上一段\"不会起伏的浪\"在平行移动；测深锤读数骤变 第一阶段 它只是 经过 （船体 −1d6，或什么都没发生）。多数遭遇到此结束 撤退窗口 不要追它。 追它 = 进入 11.2 渊创判定，且它回头 若必须打 船体 60、防御 13；它的身体太长，你的炮打不满一轮 真实收益 测绘它经过的这条水道—— 它知道哪条路能走 （海图升\"测绘\"，+1 XP） 巨鲸\"老祖父\" 项 内容 预警 喷气声，隔着一座岛也听得见；海面浮油；小艇不能下 第一阶段 它撞（船体 3d6＋全组机敏豁免 DV13 倒地）。 它不是攻击你，它是不高兴 撤退窗口 停船、别划、别敲钟 。筋骨 DV13 稳住士气，它自己走 若必须打 船体 120、防御 14； 捕它需要的东西你们身上没有 （猎叉、长绳、六个人、以及一条不怕死的小艇） 真实收益 一头死的\"老祖父\"值 3,000–8,000 银币（鲸油与骨，6.9）。 这是本战役最赚也最蠢的一件事 鲨群 项 内容 预警 落水者还在扑腾。 这就是预警 第一阶段 每 2 轮一次 d20：≤6 → 咬（2d6 利刃，部位变体下必中腿） 撤退窗口 把人拉上来。 船体侧倾、绳索、以及一个人肯伸手 若必须打 无意义。 这是本图鉴里唯一一只不能通过战斗解决的条目 它的作用 它是\"落水\"这一件事的价格标签（2.4 溺水、7.9 弃船）。 GM 用它是为了让人数清点变得有意义 【设计注·四只怪的共同结构】 四只里三只 不该打 ，一只 打不赢 。这不是示弱，这是本作的英雄观： 他因为活下来了，所以是英雄。 11.6 幽灵船（完整程序） 这是一套可复用的遭遇脚本，五步。 ① 雾 雾中（7.10）瞭望失效，遭遇骰 +2。然后： 你们看见一盏不该在那里的信号灯。 ② 靠近 选项 结果 喊话 有回应。 回应的不是刚才那句话 绕开 它也绕。 同一航线，同舷，同速 上钩（接舷 DV14） 它比你们先动手钩住你们 （10.5） ③ 登船：查全员死因（这一步是本遭遇的核心） 每艘幽灵船只有一个死因。GM 从下面选一张，然后只用现场证据说： 档 死因 现场线索 若【模糊】还有第二种解释 一 疫 所有人死在岗位上、无挣扎、货未动、醋与香袋烧尽了 疫是真的—— 这就是普通船沉没的样子 二 哗变 船长被吊在自己舱门口；小艇少了一条；账本被撕 人干的。 7.7 的账，只是付晚了 三 缺水 水桶全空且全被凿开；有人在舱壁上写满了名字 有人疯了。疯是人干的 四 （仅【显性】） 它们上来了 全员面朝同一方向站着；没有伤口；航海日志最后三页被撕走 — ④ 诅咒条件（拿走才生效） 什么都不碰 = 什么都不发生。 拿一件东西 = 拿一条诅咒。 见 11.7。 唯一可以合法带走的 ：航海日志（ 不触发诅咒，但它是本章最值钱的东西 ——8.7、12.7）。 ⑤ 撤离 脱开钩索（砍缆，双方各一次借机，9.6）；或 带着它 （若它钩住了你们，你们今晚的速度 ×0.5）。 结算 结果 拿什么 只读了日志 一条航线情报＋一个传闻锚点 （8.1）＋ +1 XP 拖回了它 一条船（船体 1、失帆、进水 1 级，7.9）—— 这是本作最赚的劫掠，也是最贵的 拿了东西 见 11.7 11.7 诅咒宝藏（模板） 结构 拿走即中咒。解除条件就藏在\"你拿走的那一刻\"的三件细节里。 GM 填写模板： 物：____________（一件具体的、可被拿着的东西） 它属于谁：____________（一个有名字的、能来要的东西） 拿走那一刻的三个细节： ① 当时天气／海况：____________ ② 谁的手先碰到它：____________ ③ 现场有一样东西不在它该在的位置：____________ 诅咒的显现（三阶段，各 1d3 天间隔）：____________ 解除（三线索原则：任何一条细节都能推出真相的一部分）：____________ 诅咒三阶段（不要一次给完） 阶段 表现 一 不对劲 ：器物挪位、有人多看了一眼、士气 −1 二 要还 ：一扇门打开、一个名字被提到、 你们在别的港口听说了自己的故事 （10.8 传闻档走形） 三 它来了 ：一条船、一场风暴、一个人—— 且它总在同一片水域 三线索原则（本作通用的解谜纪律） 每一条诅咒的解除，必须有三条独立通路 （8.4 同）： 查 （史学／律法／语言学，找出它属于谁） 还 （回到原处；这是最贵的一条，因为原处通常在别人的航线上） 替代 （找一件\"分量相等\"的东西—— 由 GM 判定什么算相等 ，且这个判定本身就是戏） 【设计注】 诅咒存在的唯一理由，是 逼玩家处理一件他们本来会忘记的东西 。一件被忘记的赃物是背景；一件回来要账的赃物是剧情。 所以诅咒必须准时 ——GM 请照表推进，别心软。 11.8 航海恐怖基调：三原则 要跑恐怖，只需守住这三条。它们不需要任何骰子。 ① 等待 恐惧的燃料是时间，不是怪物。 一个航段 = 四小时。一次无风 = 三个航段。一场风暴 = 六次三掷。 把这些时间说出来。 \"你们又漂过了一个班次，海还是平的\"——这一句比任何触手都贵。 ② 未知 不要解释。 解释是恐怖的终结。 GM 台词模板：\" 它过去了。 \"（不说是什么，不说为什么，不说它会不会回来。） ③ 不可直视 任何\"看清楚了\"的代价都是一次渊创判定（11.2）。 凡是允许玩家\"仔细看\"的场合，先问一次： 你确定要看清吗？ 玩家说确定之后，GM 给答案—— 而答案必须让人希望没问过 。 安全工具（跑恐怖必带，不是可选） 工具 用法 Lines &amp; Veils 开团前每人写：一条不许碰（Line）、一条可以碰但要预告（Veil） X-Card 一张卡放在桌上，任何人点它＝立刻删掉刚才那段，不问理由，不留记录 GM 开场声明 明说本桌有恐惧、有死亡、有背叛（11.2 羁绊投射）。 说了，玩家才能真的投入 【设计注】 这三件工具不是礼貌。本作有一整套会伤人的规则（羁绊投射、心结、具名船员会死）。 没有安全工具的桌，玩家会自我审查，而自我审查的玩家玩不出这一章设计的东西。 11.9 三十秒速查 开团前三选一：关闭／模糊（默认）／显性 ，写在战役记录第一页 模糊档唯一纪律 ：每个传说写两个真相，选一个，永不说 镇定 = 胆魄×3 ；恐惧 d20+胆魄 ≥ 10/13/16/19/22 ；失败 −1d4 镇定 三分创伤 ：尸创（靠人解）／海创（靠岸解）／渊创（无解） 心结是资产 ：给钩子、给扮演、给卓越扮演加分；唯一硬的是\"不处理会恶化\" 羁绊投射 ：花 1d4 镇定，把恐惧转给羁绊栏上那个人。 关闭档也可用 潮汐恐慌表 ：每航段末 d20 ≤ 压力值即发作；11–15 段是航海钩子带 仪式代价三选一（血／时间／记忆），不可用钱买 海怪四只，三只不该打，一只打不赢 幽灵船：只读日志免费；拿东西必中咒；不碰就没事 诅咒三阶段必须准时推进 恐怖三原则：等待／未知／不可直视；安全工具三件套必带 本章结束。下一章是我们真正要建造的东西：那片海本身。"},{"num":"12","title":"世界设定","vol":"卷三 · 世界与主持区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>他们把这片海叫\"黄金海洋\"，因为在所有地图上，只有黄金被标了出来。<\/em><\/blockquote>\n<p>本章是全书唯一一章<strong>不来自任何考据卷宗<\/strong>——它不是调研成果的汇总，而是本作为那些成果<strong>造一个可以住进去的世界<\/strong>。<\/p>\n<p><strong>本章一条铁律（已定，不可违）<\/strong>：<\/p>\n<blockquote class='quote'><strong>世界设定必须喂系统。<\/strong> 本章每一段设定后面都跟着一行 <strong>↳ 改什么<\/strong>，指出它改变哪张表、哪个检定、或哪个门槛。<br>一段不改变任何骰子的设定，在规则书里<strong>不是设定，是装饰<\/strong>。装饰请写在 14 章的模组里，不要占本章的篇幅。<\/blockquote>\n<p><strong>架空尺度<\/strong>：地名、国名、人名做<strong>轻度架空<\/strong>处理（保留\"就要那段历史味\"），制度、物价、船型、疾病、风向、税制<strong>全部按史实<\/strong>。所以本卷读起来像 15–17 世纪，跑起来像 15–17 世纪——只有旗子上的纹章是我们编的。<\/p>\n<hr>\n<h2>12.1 时代底色<\/h2>\n<p><strong>年代<\/strong>：<strong>1490–1620<\/strong>（可续至 1650，若你要燧发枪和更硬的战列线）。<br><strong>这个时代的三件事同时成立，而它们互相矛盾<\/strong>：<\/p>\n<ol class='mdlist'><li><strong>海比法律跑得快。<\/strong> 任何一条命令到达殖民地需要四个月，因此<strong>所有殖民地的官员都在抗命，并且都对<\/strong>。<\/li><\/ol>\n<p>↳ 改什么：<strong>律法与交涉的全部难度<\/strong>（5.5、10.6）——\"合法\"在这里是一种地方性说法。<\/p>\n<ol class='mdlist'><li><strong>黄金正在让所有人变穷。<\/strong> 白银涌入使全欧物价在 1500–1650 涨了近三倍。<\/li><\/ol>\n<p>↳ 改什么：<strong>10.2 币制波动条款<\/strong>——你的角色的薪饷购买力正在悄悄蒸发，而且这是历史事实，不是 GM 刁难。<\/p>\n<ol class='mdlist'><li><strong>世界地图上有一大片空白，而且所有人都知道那是空白。<\/strong><\/li><\/ol>\n<p>↳ 改什么：<strong>8.1 点阵海图的\"传闻\"档<\/strong>——\"听说有\"和\"看见了\"之间，隔着一整幕戏。<\/p>\n<p><strong>这片海的一句话性格<\/strong>：<strong>它是一个正在被抢着登记的市场，而登记的笔比船快。<\/strong><\/p>\n<hr>\n<h2>12.2 大事年表（20 条，每条带一个可挂冒险的钩子）<\/h2>\n<div class='tbl'><table><thead><tr><th>年<\/th><th>事<\/th><th>钩子<\/th><\/tr><\/thead><tbody><tr><td><strong>1490<\/strong><\/td><td>联合王冠完成对南方最后一个王国的收服，随即驱逐犹太与摩尔航海匠人<\/td><td>那些匠人去了北方联合省。<strong>北方从此会造更好的船<\/strong>（10.1 造船率差）<\/td><\/tr><tr><td><strong>1493<\/strong><\/td><td>第一次\"发现\"的航线被封锁为王室专利<\/td><td>谁有航线的专利？<strong>专利是可以被卖掉的<\/strong>（10.9 期权合约）<\/td><\/tr><tr><td><strong>1496<\/strong><\/td><td>分海诏书：教廷把世界划成两半，分别送给两个帝国<\/td><td>↳ <strong>律法 5.5 DV16<\/strong> 的核心文书。你们脚下的水属于谁，是一道检定题<\/td><\/tr><tr><td><strong>1499<\/strong><\/td><td>私掠许可证第一次批量签发（国库空了）<\/td><td><strong>10.6 的全部起源<\/strong>——许可证是一种融资工具，不是荣誉<\/td><\/tr><tr><td><strong>1506<\/strong><\/td><td>一本航海手册出版，被禁，然后被翻印四十次<\/td><td>禁书即知识（史学 DV15）；<strong>它错了一处关键坐标<\/strong><\/td><\/tr><tr><td><strong>1511<\/strong><\/td><td>一座岛上的原住民王国被\"依法\"征服，一名传教士当众反对<\/td><td><strong>8.5 立场的历史锚<\/strong>；你们可以去找那个人的记录<\/td><\/tr><tr><td><strong>1519<\/strong><\/td><td>一支船队出发绕越大陆，一条船活着回来<\/td><td>那一船的香料<strong>付清了整支舰队的账<\/strong>（10.1 垄断利润率）；<strong>只有一个人说了实话<\/strong><\/td><\/tr><tr><td><strong>1524<\/strong><\/td><td>一场大疫随船抵达内陆，死掉的人比刀杀的多<\/td><td>↳ <strong>7.8 疾病表 ×3 频率<\/strong>；以及一片\"没人住的好地\"（<strong>那是假的<\/strong>）<\/td><\/tr><tr><td><strong>1533<\/strong><\/td><td>一座黄金城被一个只有 168 人的队伍拿下<\/td><td><strong>12.7 秘密①的起源<\/strong>——<strong>他们到底拿了什么？<\/strong><\/td><\/tr><tr><td><strong>1545<\/strong><\/td><td>发现那座山。白银开始流出来<\/td><td>↳ <strong>10.2 币改条款<\/strong>生效；<strong>波托西物价全窗口最高<\/strong>（6.1）<\/td><\/tr><tr><td><strong>1544–51<\/strong><\/td><td>北方帝国三次铸币降银，物价翻涨，十六年才回锚<\/td><td>一次<strong>货币危机战役<\/strong>：你们的欠饷正在变成纸（6.6）<\/td><\/tr><tr><td><strong>1560<\/strong><\/td><td>火药船队制度成型：两支护航队，一年两次<\/td><td>↳ <strong>10.3 护航 13% vs 闯线 19%<\/strong>——<strong>这是全游戏最好的一次赌博<\/strong><\/td><\/tr><tr><td><strong>1565<\/strong><\/td><td>一条反向航线被找到，东方终于能回来<\/td><td>航线专利 = <strong>垄断<\/strong>（10.1）；<strong>找到它的那个人被抹去了名字<\/strong><\/td><\/tr><tr><td><strong>1572<\/strong><\/td><td>一场针对新教徒的屠城夜<\/td><td>你们港里现在有两批难民，两边都记仇（<strong>12.6 女船东<\/strong>的起点）<\/td><\/tr><tr><td><strong>1580<\/strong><\/td><td>两顶王冠合并，海上执法突然变成一件事<\/td><td>↳ <strong>10.8 恶名门槛<\/strong>：一夜之间，你们的许可证作废了<\/td><\/tr><tr><td><strong>1587<\/strong><\/td><td>一支无敌舰队被风与火船打散<\/td><td>↳ 10.7 <strong>St Philip 案分账实档<\/strong>；以及<strong>一片沉船滩<\/strong>（12.7 秘密④）<\/td><\/tr><tr><td><strong>1590s<\/strong><\/td><td>私掠公司化：股份制取代了船长个人<\/td><td>↳ <strong>10.6 股份 1/16 制<\/strong>入戏——<strong>你们不再是海贼，你们是员工<\/strong><\/td><\/tr><tr><td><strong>1607<\/strong><\/td><td>第一个能活下来的殖民地建立<\/td><td><strong>12.5 的西部海域从此有了锚地<\/strong>；以及原住民的<strong>盟约窗口<\/strong>（8.5）<\/td><\/tr><tr><td><strong>1618<\/strong><\/td><td>一场大陆战争爆发，保险费全线翻倍<\/td><td>↳ <strong>10.3 保险战时 ×2–3<\/strong>；<strong>火药与铁翻倍<\/strong>（10.1）<\/td><\/tr><tr><td><strong>约1620<\/strong><\/td><td>一场风暴把一支探险船队吹进了\"恶魔纬度\"以南<\/td><td><strong>12.7 秘密③<\/strong>（幽灵纬度）的开场；也是本战役可以开始的时候<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote aside-voice'><strong>GM 使用说明<\/strong>：<strong>开局年份必须写进战役记录第一页<\/strong>，因为它决定了 10.7 的分账规则、10.6 的许可证效力、10.3 的保费、和 12.3 里谁在跟谁打。<strong>1580 年前后是两种完全不同的游戏。<\/strong><\/blockquote>\n<hr>\n<h2>12.3 八大势力<\/h2>\n<p><strong>每张卡六行<\/strong>：野心／海军／陆上／<strong>↳ 改什么<\/strong>／声望解锁／PC 能为它做什么。<\/p>\n<h3>①② 双帝国：南方王冠 与 北方帝座（镜像对）<\/h3>\n<blockquote class='quote'>两顶王冠在 1580 年并成一顶，在 1640 年又会分开——<strong>它们争夺的不是海，是\"谁有资格划分海\"。<\/strong><\/blockquote>\n<div class='tbl'><table><thead><tr><th><\/th><th><strong>南方王冠<\/strong>（伊比利亚式，塔古斯为都）<\/th><th><strong>北方帝座<\/strong>（哈布斯堡式，帝国边地母国）<\/th><\/tr><\/thead><tbody><tr><td><strong>野心<\/strong><\/td><td>把整条白银线攥在自己手里；<strong>用舰队收税<\/strong><\/td><td>拿回被联合省抢走的航运权；<strong>用陆上同盟掐住海<\/strong><\/td><\/tr><tr><td><strong>海军<\/strong><\/td><td>大：盖伦×40–70，慢，装载量惊人<\/td><td>中：船好但人不够，<strong>靠借贷和雇佣补<\/strong><\/td><\/tr><tr><td><strong>陆上<\/strong><\/td><td>内陆王朝的银矿区，靠要塞线维持<\/td><td>全欧最强的陆军，也是最缺钱的政府<\/td><\/tr><tr><td><strong>↳ 改什么<\/strong><\/td><td><strong>10.1 香料与白银的官方价<\/strong>；<strong>10.3 报关 25% 档<\/strong><\/td><td><strong>10.3 保费战时档<\/strong>；<strong>6.9 铸铁炮的普及来源<\/strong><\/td><\/tr><tr><td><strong>声望解锁<\/strong><\/td><td>70+：军港与官仓；85+：<strong>护航请求权<\/strong><\/td><td>70+：陆上融资与船坞；85+：<strong>一张敌国清单<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>PC 的雇佣关系<\/strong>：南方要你们<strong>打<\/strong>，北方要你们<strong>运<\/strong>。两条路都通向同一件事——<strong>替政府收一笔它付不出来的债<\/strong>。<\/p>\n<h3>③ 北方联合省（商人共和国）<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：不打任何人的船，<strong>买所有人的货<\/strong>。<\/li><li><strong>海军<\/strong>：船多、炮少、快。<strong>它的舰队就是它的商船队本身<\/strong>。<\/li><li><strong>↳ 改什么<\/strong>：<strong>10.1 运费全窗口最低<\/strong>（fluyt 造价 175 银币/吨，比对手便宜 47%）；<strong>10.3 报关 5–10% 档<\/strong>；6.5 仪器的最大产地。<\/li><li><strong>声望解锁<\/strong>：55+：<strong>能赊<\/strong>；70+：<strong>能拿到别人拿不到的价<\/strong>；85+：<strong>承保权<\/strong>（10.3 保险——你们成为收钱的那一方）。<\/li><li><strong>PC 能做什么<\/strong>：为它跑<strong>闯线<\/strong>（19% 保费省下来的那部分是你们的报酬）。<\/li><\/ul>\n<h3>④ 海岛王国（英吉利式）<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：不许任何人独占这条海——<strong>以私掠为外交手段<\/strong>。<\/li><li><strong>海军<\/strong>：护卫舰最多、训练最好、规模最小。<strong>它打不赢舰队，但能打死补给线。<\/strong><\/li><li><strong>↳ 改什么<\/strong>：<strong>10.6 许可证的第二个签发方<\/strong>；4.2「英吉利海岸」出身的\"私掠传统\"在这里是国策不是家族传统。<\/li><li><strong>声望解锁<\/strong>：55+：<strong>在它的任何港口，敌国财产都是\"待分配\"<\/strong>；85+：<strong>一支分舰队指挥权<\/strong>。<\/li><li><strong>PC 能做什么<\/strong>：领一张纸，然后成为一支力量。<\/li><\/ul>\n<h3>⑤ 至圣座与审判庭<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：<strong>为\"谁的土地、谁的船、谁的书\"提供合法性。<\/strong><\/li><li><strong>海军<\/strong>：无。有港口、有港口里的公证人、以及一份名单。<\/li><li><strong>↳ 改什么<\/strong>：<strong>5.5 律法的全部难度<\/strong>；<strong>分海诏书<\/strong>（1496）的 DV16；4.2「伊比利亚港口区」\"教会的影子\"；<strong>12.7 秘密⑤的守门人<\/strong>。<\/li><li><strong>声望解锁<\/strong>：40+：<strong>文书可过任一港口<\/strong>；70+：<strong>可以宣布一次战争不义<\/strong>（这一条比一支舰队好用）。<\/li><li><strong>PC 能做什么<\/strong>：替它找一样东西，或替它<strong>烧掉<\/strong>一样东西。<\/li><\/ul>\n<h3>⑥ 制图师与商团行会（含承保人卡特尔）<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：<strong>让\"知道\"这件事收费。<\/strong><\/li><li><strong>海军<\/strong>：没有。但有<strong>灯塔专利<\/strong>（10.3）、海图版权、和一份所有承保人共用的底价表。<\/li><li><strong>↳ 改什么<\/strong>：<strong>8.7 海图与标本的收购价<\/strong>；<strong>10.3 保险的底价卡特尔<\/strong>（英—荷 ≥2% 那条）；<strong>5.2 海图绘制的\"可交易成果\"条款<\/strong>。<\/li><li><strong>声望解锁<\/strong>：55+：<strong>买断一张图<\/strong>；70+：<strong>在任一港口的行情骰 +1 档<\/strong>；85+：<strong>发布一条\"不存在的航线\"<\/strong>（<strong>这条是终局武器<\/strong>）。<\/li><li><strong>PC 能做什么<\/strong>：给它测绘。<strong>这是本作最纯粹的一种玩法：下船，画图，回来卖。<\/strong><\/li><\/ul>\n<h3>⑦ 海盗共和国（血鸦海岸）<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：不被承认地活着，并且<strong>继续赚钱<\/strong>。<\/li><li><strong>海军<\/strong>：散，快，熟悉每一处浅水。它有<strong>契约<\/strong>没有法律。<\/li><li><strong>↳ 改什么<\/strong>：<strong>10.4 走私渠道的存在条件<\/strong>；<strong>10.8 恶名在 60+ 时唯一接待你的地方<\/strong>；<strong>10.7 罗伯茨式分份与断肢补偿的出处<\/strong>。<\/li><li><strong>声望解锁<\/strong>：40+：<strong>销赃实现率升到 1/2<\/strong>；70+：<strong>一条你们从没见过的敌国清单<\/strong>；85+：<strong>一次联合出击<\/strong>（四–六条船听你们的号令一次）。<\/li><li><strong>PC 能做什么<\/strong>：把一次劫掠\"洗\"成一次生意——<strong>或反过来，把一桩生意做成一次劫掠。<\/strong><\/li><\/ul>\n<h3>⑧ 内陆王朝（新大陆）<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：<strong>让海岸线以外的一切保持原样。<\/strong><\/li><li><strong>海军<\/strong>：无。<strong>它不需要——它从来不需要在海上赢。<\/strong><\/li><li><strong>↳ 改什么<\/strong>：<strong>8.5 原住民三问的全部效力<\/strong>；<strong>12.5 内陆海域的\"不可进入\"<\/strong>；<strong>11 章档位<\/strong>（问卷：低魔限于海岸，<strong>内陆可以不同<\/strong>）。<\/li><li><strong>声望解锁<\/strong>：40+：<strong>可以走陆路<\/strong>（这在海上是颠覆性的）；85+：<strong>一支军队替你们说话<\/strong>。<\/li><li><strong>PC 能做什么<\/strong>：别抢它。<strong>与它做一笔生意，能改写第八节的全部规则。<\/strong><\/li><\/ul>\n<blockquote class='quote aside-voice'><strong>【设计注·它是全章最重要的一张卡】<\/strong> 八大势力里，只有这一个<strong>从不在海上出现<\/strong>，也唯一一个<strong>能让玩家的船变成次要角色<\/strong>。它的存在是为了让 8.5 那句立场有牙齿：<strong>他们不是经验包，他们是有主体性的势力——能结盟，能反噬。<\/strong><\/blockquote>\n<h3>⑨ 东岛幕府<\/h3>\n<ul class='mdlist'><li><strong>野心<\/strong>：<strong>只开一扇窗，并且决定谁从窗里递东西进来。<\/strong><\/li><li><strong>↳ 改什么<\/strong>：<strong>10.1 瓷器与漆的产地价<\/strong>；<strong>12.5 最东海域的准入<\/strong>（无许可即敌对，10.4 敌对档后果）。<\/li><li><strong>PC 能做什么<\/strong>：拿到那扇窗的<strong>一次<\/strong>机会。<\/li><\/ul>\n<blockquote class='quote aside-voice'><strong>（双帝国计为一卡，故本章为\"八大势力、九张卡\"。GM 若只需要八个，把⑨并入⑥作为\"东向窗口\"。）<\/strong><\/blockquote>\n<hr>\n<h2>12.4 十大港口<\/h2>\n<p><strong>每港六行<\/strong>：类型／性格／<strong>↳ 行情骰倾向<\/strong>／<strong>↳ 传闻种子<\/strong>／港务 NPC（12.6 有全名）／<strong>准入条件<\/strong>。<\/p>\n<h3>母港型<\/h3>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>港<\/th><th>性格与条款<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>塔古斯<\/strong>（南方王冠之都）<\/td><td>全大陆最大的报关楼与最大的假货市场。<strong>行情 ×1.0 但税 25%<\/strong>；传闻种子：<strong>\"有一批货的舱单上有两个名字\"<\/strong>。NPC：<strong>港务大臣阿兰达<\/strong>。准入：正常报关；恶名 40+ 直接扣押<\/td><\/tr><tr><td>2<\/td><td><strong>阿姆斯特丹港／新峡<\/strong>（联合省）<\/td><td>保险、绘图、和一份<strong>所有人都遵守的底价表<\/strong>。<strong>报关 5%<\/strong>；<strong>行情骰 −1 档滞销概率<\/strong>（因为什么都能卖掉）。NPC：<strong>承保人霍恩<\/strong>。准入：<strong>你必须投保<\/strong>（不投保的船在港外等）<\/td><\/tr><tr><td>3<\/td><td><strong>德文港<\/strong>（海岛王国）<\/td><td>护卫舰母港、私掠者的交易所。<strong>赏格板永远有新价<\/strong>（10.9 赏格合约）。NPC：<strong>海军部文书长佩恩<\/strong>。准入：声望 40+，或一张有效许可证<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>殖民地型<\/h3>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>港<\/th><th>性格与条款<\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td><strong>圣克鲁斯<\/strong>（航线跳板；2.4 海燕号的出发港）<\/td><td>咸鱼、淡水、和所有船的最后一站。<strong>补给 ×0.8<\/strong>，<strong>消息 ×旧<\/strong>（三个月前）。NPC：<strong>船长之家酒馆老板娘多洛雷斯<\/strong>。准入：无<\/td><\/tr><tr><td>5<\/td><td><strong>港十字<\/strong>（白银港，内陆银路的出口）<\/td><td><strong>全窗口物价最高<\/strong>（对应波托西：25–35 银币/人/月）。<strong>火药与铁 ×2<\/strong>。NPC：<strong>银库主事<\/strong>。准入：<strong>必须卸枪<\/strong><\/td><\/tr><tr><td>6<\/td><td><strong>港樱树<\/strong>（新拓殖民地，1607 后）<\/td><td>什么都有、什么都缺；<strong>盟约窗口正开着<\/strong>（8.5 +1 可达）。NPC：<strong>殖民地秘书<\/strong>＋<strong>一位不肯署名的翻译<\/strong>。准入：联合省或海岛王国的担保<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>走私港<\/h3>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>港<\/th><th>性格与条款<\/th><\/tr><\/thead><tbody><tr><td>7<\/td><td><strong>盐叉湾<\/strong>（血鸦海岸正门）<\/td><td><strong>销赃实现率 1/2<\/strong>；<strong>恶名 60+ 唯一肯开门的地方<\/strong>；<strong>行情骰 +1 档<\/strong>，但<strong>只有现金<\/strong>。<strong>没有法庭<\/strong>（10.6 捕获主张在此无处申报）。NPC：<strong>军需官\"账房\"<\/strong><\/td><\/tr><tr><td>8<\/td><td><strong>低语栈桥<\/strong>（雾海口，见 12.4b）<\/td><td>一处<strong>退潮才出现<\/strong>的栈桥，图上标不出来。<strong>暗舱建造DV −2<\/strong>；<strong>海关检定 +3 难<\/strong>（因为没有海关，只有邻居）。NPC：<strong>灯塔公会的守灯人<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>军港与禁港<\/h3>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>港<\/th><th>性格与条款<\/th><\/tr><\/thead><tbody><tr><td>9<\/td><td><strong>锚链堡<\/strong>（帝国要塞港）<\/td><td>锁住一条航线的唯一深水泊位。<strong>补给无限但只卖给军舰<\/strong>；<strong>修理 −25%<\/strong>（10.8 声望 60+）。NPC：<strong>舰队司令的副官<\/strong>。准入：声望 70+，或一份护航合约<\/td><\/tr><tr><td>10<\/td><td><strong>末灯<\/strong>（最东的窗）<\/td><td><strong>东岛幕府唯一开放的泊位<\/strong>。<strong>瓷器与漆的产地价<\/strong>；<strong>违禁品＝即刻敌对<\/strong>。NPC：<strong>通事（翻译，无薪，靠你给他面子生活）<\/strong>。准入：<strong>一张由寺社与奉行署会签的状<\/strong>（律法 DV18）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>12.4b 雾海接口（可选替换包）<\/h3>\n<p><strong>本项目另一套已建成数据的设定（十港六势力、含派系敌对与日程）可以整体替换 12.4/12.3 的殖民地与走私段<\/strong>，无需改动任何骰子。<\/p>\n<ul class='mdlist'><li>直接可用的<strong>十港名<\/strong>：阑珊／鸦尾／锚链堡／白潮／低语栈桥／鱼叉栅／潮母襤褸湾／末灯／皓腕／酣城（其中<strong>锚链堡、低语栈桥、末灯<\/strong>已并入上表）。<\/li><li>直接可用的<strong>六势力名<\/strong>（含敌对与日程结构）：<strong>灯塔公会／盐约正教／自船商会／海军执政团／私枭圆桌／猎人公会<\/strong>。<\/li><li><strong>↳ 建议映射<\/strong>：灯塔公会→⑥行会（并接管灯塔专利）；盐约正教→⑤审判庭；自船商会→③联合省；海军执政团→④海岛王国；私枭圆桌→⑦海盗共和国；猎人公会→⑧内陆王朝的<strong>边境侧<\/strong>（不是它本身）。<\/li><li>⚠️ <strong>该包的人物属性尺度（六属性 1–100）与本作（五属性 1–5）数学不兼容<\/strong>。<strong>只取它的地名、派系结构与日程逻辑，不要取它的数值。<\/strong><\/li><\/ul>\n<hr>\n<h2>12.5 六大海域<\/h2>\n<p><strong>每域四行<\/strong>：风与浪／危险／主导／<strong>标志性遭遇<\/strong>。<strong>空白海图见附录 G。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>域<\/th><th>风与浪<\/th><th>危险<\/th><th>主导<\/th><th>标志遭遇<\/th><\/tr><\/thead><tbody><tr><td><strong>Ⅰ 内海（故土圈）<\/strong><\/td><td>侧风为主，海况 3–14，四季可航<\/td><td>礁、雾、以及<strong>报关楼<\/strong><\/td><td>联合省／海岛王国／南方王冠<\/td><td>一次护航突袭（9.8 群战的第一课）<\/td><\/tr><tr><td><strong>Ⅱ 信风海（南下航线）<\/strong><\/td><td><strong>顺风 ×1.25<\/strong>，7.4 的最佳档<\/td><td>飓风季（<strong>热带海域掷骰后调档<\/strong>，7.5）<\/td><td>南方王冠专利航线<\/td><td>一条被凿开的桶（7.8 痢疾）、一支返航舰队<\/td><\/tr><tr><td><strong>Ⅲ 冷水海（西北与浮冰带）<\/strong><\/td><td>劲风—大风常见，15–19<\/td><td><strong>冰山与浮冰<\/strong>（瞭望 DV+3，7.10）<\/td><td>联合省／北方帝国<\/td><td>一座不亮的灯塔；一条被冻住的船<\/td><\/tr><tr><td><strong>Ⅳ 西部浅海（殖民地与新拓）<\/strong><\/td><td>侧风与逆风交替；<strong>吃水检定多<\/strong><\/td><td>礁区、河口、退潮（<strong>8.2 硬时限<\/strong>）<\/td><td>混合；<strong>内陆王朝在岸上<\/strong><\/td><td>一座有主体的岛（<strong>8.5 主战场<\/strong>）<\/td><\/tr><tr><td><strong>Ⅴ 恶魔纬度（7.5 已点名）<\/strong><\/td><td><strong>不该有风的地方有风<\/strong>；海况表在此域掷骰后 <strong>GM 可整体调档<\/strong><\/td><td>无风带＋<strong>\"不该存在的雾\"<\/strong>（11.1）<\/td><td><strong>没人<\/strong>（这是它的定义）<\/td><td>一艘幽灵船（11.6）；一处被抹掉的坐标<\/td><\/tr><tr><td><strong>Ⅵ 东向海（那扇窗）<\/strong><\/td><td>反向航线专利；<strong>季风可被预测<\/strong>（气象 5.2）<\/td><td>距离、拒保（VOC 回程 30–40%＝<strong>没人保<\/strong>）<\/td><td>东岛幕府／联合省<\/td><td>一次准入检定（末灯，12.4）；一船没人敢验的货<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>危险等级速查<\/strong>（GM 定遭遇频率用）：Ⅰ 低／Ⅱ 中／Ⅲ 高／Ⅳ 高／Ⅴ 极／Ⅵ 中。<br><strong>航段距离<\/strong>：Ⅰ→Ⅱ 五段；Ⅱ→Ⅳ 三段；Ⅲ→Ⅴ 七段；Ⅳ→Ⅵ 十一段。<strong>这些数就是战役的时间尺度。<\/strong><\/p>\n<hr>\n<h2>12.6 十二位著名 NPC（每人：一段＋一个秘密＋↳ 他能改什么）<\/h2>\n<ol class='mdlist'><li><strong>\"血鸦\"英格丽德·萨尔摩<\/strong> — 海盗共和国唯一的\"账房出身的女王\"。她不劫渔船，因为她自己渔村出身。<strong>秘密<\/strong>：她的分账表比任何皇家海军都精确，因为<strong>她记下每一个欠饷的人的名字<\/strong>。<strong>↳ 改<\/strong>：10.7 团队账本；10.8 恶名的上限。<\/li><li><strong>塔古斯港务大臣 阿兰达伯爵<\/strong> — 他收的税养活了半支舰队，而他本人并不富裕。<strong>秘密<\/strong>：他的账本有两套，<strong>两套都是真的<\/strong>。<strong>↳ 改<\/strong>：10.3 报关 DV；10.4 查获判定。<\/li><li><strong>制图师行会会长 老范·德·米尔<\/strong> — 他记得每一张他买断的图。<strong>秘密<\/strong>：<strong>他自己从不航海<\/strong>，所以他买图是为了知道他自己没能看见的东西。<strong>↳ 改<\/strong>：8.7、5.2 海图价；12.7 秘密⑥的保管人。<\/li><li><strong>审判官宣审判事 迭戈·德·科瓦<\/strong> — 他烧过三本书，其中两本他读过并且同意。<strong>秘密<\/strong>：<strong>他知道 12.7 秘密⑤<\/strong>，而他不认为那是异端。<strong>↳ 改<\/strong>：5.5 律法；11 章档位（他是唯一会让【显性】变成政治问题的人）。<\/li><li><strong>女船东 玛丽亚·克鲁兹<\/strong> — 1572 屠城夜的难民女儿，如今持有十一条船的十七份股份。<strong>秘密<\/strong>：<strong>她雇过 12.6 的第 1 位<\/strong>去杀一个人，并且付了钱。<strong>↳ 改<\/strong>：10.6 股份；PC 的第一条\"能凑出船\"的路。<\/li><li><strong>叛舰长 康拉德·\"旗\"·杜尔<\/strong> — 他在一次会战中调转旗号，从此没有人知道他现在为谁干。<strong>秘密<\/strong>：<strong>那次会战里他救下的那条船上，有他兄弟。<\/strong>↳ 改**：10.5 恶名的不对称；10.6 敌国清单的可变性。<\/li><li><strong>联合省承保人 霍恩<\/strong> — 他报出的数字从来不错。<strong>秘密<\/strong>：<strong>他拒保的那些船里，有一半是他自己派出去的。<\/strong>↳ 改**：10.3 保险；10.4 谁在举报走私。<\/li><li><strong>银库主事（港十字）<\/strong> — 全大陆最干净的手，最脏的工作。<strong>秘密<\/strong>：<strong>每年有一船白银从记录上消失，而他知道它去了哪片海<\/strong>（→ 秘密④）。<strong>↳ 改<\/strong>：10.5 贵金属；12.7 线索链的枢纽。<\/li><li><strong>\"账房\"（盐叉湾军需官）<\/strong> — 他不指挥，他分东西。<strong>秘密<\/strong>：<strong>他的分账表是血鸦海岸唯一比帝国更被遵守的法律。<\/strong>↳ 改**：10.7 罗伯茨条款；9.9 俘虏赎金。<\/li><li><strong>通事（末灯）<\/strong> — 无薪，靠体面生活。<strong>秘密<\/strong>：<strong>他能读四种语言，但只能写一种<\/strong>——那一种是他不许自己写的。<strong>↳ 改<\/strong>：12.4 末灯准入；5.5 语言学。<\/li><li><strong>老舵手帕尔米贾诺<\/strong> — 他跑过恶魔纬度并且回来了，回来以后只在酒馆讲，而且<strong>每次讲得不一样<\/strong>。<strong>秘密<\/strong>：<strong>第一次讲的那个版本是真的<\/strong>。<strong>↳ 改<\/strong>：12.7 秘密③；10.8 传闻档的教科书案例。<\/li><li><strong>殖民地秘书（港樱树）<\/strong> — 他签每一份地契，包括不该签的。<strong>秘密<\/strong>：<strong>他在替 12.3 第八势力保存一份完整的、被否认的土地记录。<\/strong>↳ 改<strong>：8.5 盟约；10.6 产权诉讼；<\/strong>这是唯一一个能让第八幕合法成立的人**。<\/li><\/ol>\n<hr>\n<h2>12.7 七个秘密（GM 之眼）<\/h2>\n<p><strong>每个秘密四行<\/strong>：真相／<strong>三层线索链<\/strong>／它兑现什么／它改变哪张表。<br><strong>七者互不冲突、可平行埋设<\/strong>——这是战役骨架的标准件，不是备选。<strong>埋两个就够一整幕。<\/strong><\/p>\n<h3>① 黄金城<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：<strong>有一座城，但它不是金子做的——它是被留下来的。<\/strong> 1533 年那支 168 人的队伍拿下的不是宝库，是一座<strong>故意空的都城的档案<\/strong>，而档案证明了一件让两个帝国都不能公开的事。<\/li><li><strong>三层线索<\/strong>：① 一本 1533 年的士兵家书（史学 DV14，塔古斯的旧货摊）｜② 内陆王朝侧一份被否认的土地记录（12.6 第 12 位）｜③ 一座山口的石阶宽到能走炮（8.3 D·17）。<\/li><li><strong>兑现<\/strong>：不是黄金，是<strong>产权文书<\/strong>——它能让一整个殖民地的合法性作废（律法 DV18）。<\/li><li><strong>↳ 改<\/strong>：<strong>10.6 许可证的效力<\/strong>；<strong>8.5 盟约的可达性<\/strong>；<strong>12.3 第八势力的入场<\/strong>。<\/li><\/ul>\n<h3>② 不老泉<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：<strong>有一处水，能治一种病，且那种病正是长期航海得的。<\/strong>坏血、热病、痢疾——它治得好，而它在一个不该被找到的人手里。<\/li><li><strong>三层线索<\/strong>：① 一名船医的草药箱里有一片不该存在于本地的叶（博物学 DV15）｜② 7.8 坏血病条的\"即愈\"传闻，出现在三座港、版本各不相同｜③ 一处海岸的本地人不生病（生存 DV13 会先发现这个，而不是那个泉）。<\/li><li><strong>兑现<\/strong>：一条<strong>永久移除坏血病<\/strong>的航线知识——以及谁控制它，谁就控制这条海的所有船员。<\/li><li><strong>↳ 改<\/strong>：<strong>7.8 疾病整节<\/strong>；<strong>7.7 士气的下限<\/strong>；<strong>6.6 薪饷的谈判筹码<\/strong>。<\/li><\/ul>\n<h3>③ 幽灵纬度<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：<strong>恶魔纬度以南有一片海，风从错误的方向来。<\/strong> 不是魔法，是<strong>一处被系统性隐瞒的洋流异常<\/strong>——而隐瞒它的人正是靠这条异常活着回来的。<\/li><li><strong>三层线索<\/strong>：① 老舵手帕尔米贾诺的第一版讲述（12.6 第 11 位）｜② 一本被禁的 1506 航海手册里那一处错的坐标（<strong>它错得刚好能让人死<\/strong>）｜③ 7.5 海况表在Ⅴ域的\"整体调档\"条款本身就是线索。<\/li><li><strong>兑现<\/strong>：一条<strong>没人能从后面追上来<\/strong>的航线。<\/li><li><strong>↳ 改<\/strong>：<strong>7.4／7.5 全部风浪表<\/strong>；<strong>9.7 追击钟<\/strong>（在这片海上，【拉开】只需 4 格）。<\/li><\/ul>\n<h3>④ 沉没舰队<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：1587 年那场风暴之后，一支舰队的<strong>白银没有全在记录上消失——有一部分被拖进了一处浅滩，并且被当地人看着<\/strong>。<\/li><li><strong>三层线索<\/strong>：① 银库主事的年度缺口（12.6 第 8 位）｜② 一处海岸的贝冢异常巨大且年代刚好（8.3 C·6）｜③ St Philip 案账目里\"上将只得 3.8%\"这笔差额（10.7 实档）。<\/li><li><strong>兑现<\/strong>：一笔钱。以及<strong>一个必须选择跟谁分享它的沿岸族群<\/strong>。<\/li><li><strong>↳ 改<\/strong>：<strong>10.5 战利品生成器<\/strong>；<strong>8.5 关系刻度的起点<\/strong>（他们先到了那里）。<\/li><\/ul>\n<h3>⑤ 第五势力<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：<strong>在四个签发许可证的权力之外，有一张更早的、被所有人遗忘的授权。<\/strong>它不签发许可证，它<strong>签发合法性<\/strong>——持有它可以宣布任何一次劫掠是\"未被许可的战争\"。<\/li><li><strong>三层线索<\/strong>：① 审判事知道却不烧的那两本书（12.6 第 4 位）｜② 1496 分海诏书的<strong>原件缺了一页<\/strong>（律法 DV16）｜③ 一枚不属于任何已知铸造厂的火漆印（11.4 遗物模板的现成答案）。<\/li><li><strong>兑现<\/strong>：<strong>一条敌国清单可以被改写<\/strong>——一夜之间，你们的旧盟友成为合法目标，而你们的旧敌人不能被打。<\/li><li><strong>↳ 改<\/strong>：<strong>10.6 全流程<\/strong>；<strong>10.5 恶名表的第一行<\/strong>；<strong>12.3 全部声望解锁<\/strong>。<\/li><\/ul>\n<h3>⑥ 海图上的墨渍<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：<strong>行会买断的图里，有一张被故意涂掉了一角。<\/strong> 涂掉的不是坐标，是<strong>一处水深<\/strong>——而那个位置在 150 年后正是唯一能让大船通过的航道。<\/li><li><strong>三层线索<\/strong>：① 会长本人不肯说的那句话（人望 DV17）｜② 你们手里那张残图的缺口（2.4 尾声钩子②的兑现口）｜③ 8.3 A·19 那片\"没被画进任何海图的潟湖\"。<\/li><li><strong>兑现<\/strong>：<strong>一处只有你们能进的锚地<\/strong>——战略意义上的\"只有你们\"。<\/li><li><strong>↳ 改<\/strong>：<strong>8.1 锚点揭示<\/strong>；<strong>7.10 吃水检定<\/strong>；<strong>9.7 地形类抢优势动作<\/strong>。<\/li><\/ul>\n<h3>⑦ 红隼号的真主人<\/h3>\n<ul class='mdlist'><li><strong>真相<\/strong>：那封被水渍洇掉的信<strong>不是写给\"银鸥号\"代理人的<\/strong>——它是<strong>写给某位你们已经见过的人<\/strong>（2.4 尾声钩子①：船长认得那个火漆印）。红隼号不是海盗船，<strong>它是一条被人花钱租来取回一件东西的船，而那件东西在你们手上<\/strong>。<\/li><li><strong>三层线索<\/strong>：① 木筒与火漆印（史学／纹章分支 DV14）｜② 帕科醒来后的第一句话（2.4）｜③ 罗伦佐床板下那半张海图的缺口。<\/li><li><strong>兑现<\/strong>：一个<strong>贯穿三幕的敌人<\/strong>，且这个敌人一开始是在<strong>试图做一件正当的事<\/strong>。<\/li><li><strong>↳ 改<\/strong>：<strong>10.8 血债档与传闻档<\/strong>；<strong>14.3 三幕结构的主线<\/strong>。<\/li><\/ul>\n<blockquote class='quote'><strong>【设计注·为什么七个秘密里有五个是\"文书\"而不是\"地方\"】<\/strong> 因为这个世界的权力不是靠<strong>到达<\/strong>运作的，是靠<strong>登记<\/strong>运作的（12.1）。<strong>把秘密做成文件，玩家就必须用律法、史学、语言学、和一次社交——而不是只用一次掌舵检定。<\/strong> 这也正好兑现了问卷里那句\"阳谋与经营、说服和话术\"。<\/blockquote>\n<hr>\n<h2>12.8 三十秒速查<\/h2>\n<ul class='mdlist'><li><strong>年代 1490–1620<\/strong>；<strong>开局年份写进战役记录第一页<\/strong>（它决定分账、许可证、保费、和谁在打谁）<\/li><li><strong>三底色<\/strong>：海比法律快／黄金让所有人变穷／地图上的空白是<strong>公开的<\/strong><\/li><li><strong>八势力九卡<\/strong>；<strong>只有内陆王朝从不在海上出现<\/strong>，它是唯一能让船变成次要角色的势力<\/li><li><strong>十港四型<\/strong>：母港（税低到 5%、高到 25%）／殖民地（贵且缺）／走私（现结、无法庭）／军港与禁港（要声望）<\/li><li><strong>六海域<\/strong>：Ⅰ低Ⅱ中Ⅲ高Ⅳ高Ⅴ极Ⅵ中；<strong>Ⅴ恶魔纬度允许 GM 整体调海况档<\/strong><\/li><li><strong>12 NPC 各有秘密，且各自改一张表<\/strong><\/li><li><strong>七秘密全部互不冲突，埋两个够一幕<\/strong>；<strong>其中五个是文书不是地方<\/strong><\/li><li><strong>雾海替换包<\/strong>：取地名、派系、日程，<strong>不取数值<\/strong><\/li><\/ul>\n<hr>\n<p><em>世界有了。下一章是给主持的：怎么把它跑起来，而不在第三场就烧光。<\/em><\/p>","text":"他们把这片海叫\"黄金海洋\"，因为在所有地图上，只有黄金被标了出来。 本章是全书唯一一章 不来自任何考据卷宗 ——它不是调研成果的汇总，而是本作为那些成果 造一个可以住进去的世界 。 本章一条铁律（已定，不可违） ： 世界设定必须喂系统。 本章每一段设定后面都跟着一行 ↳ 改什么 ，指出它改变哪张表、哪个检定、或哪个门槛。 一段不改变任何骰子的设定，在规则书里 不是设定，是装饰 。装饰请写在 14 章的模组里，不要占本章的篇幅。 架空尺度 ：地名、国名、人名做 轻度架空 处理（保留\"就要那段历史味\"），制度、物价、船型、疾病、风向、税制 全部按史实 。所以本卷读起来像 15–17 世纪，跑起来像 15–17 世纪——只有旗子上的纹章是我们编的。 12.1 时代底色 年代 ： 1490–1620 （可续至 1650，若你要燧发枪和更硬的战列线）。 这个时代的三件事同时成立，而它们互相矛盾 ： 海比法律跑得快。 任何一条命令到达殖民地需要四个月，因此 所有殖民地的官员都在抗命，并且都对 。 ↳ 改什么： 律法与交涉的全部难度 （5.5、10.6）——\"合法\"在这里是一种地方性说法。 黄金正在让所有人变穷。 白银涌入使全欧物价在 1500–1650 涨了近三倍。 ↳ 改什么： 10.2 币制波动条款 ——你的角色的薪饷购买力正在悄悄蒸发，而且这是历史事实，不是 GM 刁难。 世界地图上有一大片空白，而且所有人都知道那是空白。 ↳ 改什么： 8.1 点阵海图的\"传闻\"档 ——\"听说有\"和\"看见了\"之间，隔着一整幕戏。 这片海的一句话性格 ： 它是一个正在被抢着登记的市场，而登记的笔比船快。 12.2 大事年表（20 条，每条带一个可挂冒险的钩子） 年 事 钩子 1490 联合王冠完成对南方最后一个王国的收服，随即驱逐犹太与摩尔航海匠人 那些匠人去了北方联合省。 北方从此会造更好的船 （10.1 造船率差） 1493 第一次\"发现\"的航线被封锁为王室专利 谁有航线的专利？ 专利是可以被卖掉的 （10.9 期权合约） 1496 分海诏书：教廷把世界划成两半，分别送给两个帝国 ↳ 律法 5.5 DV16 的核心文书。你们脚下的水属于谁，是一道检定题 1499 私掠许可证第一次批量签发（国库空了） 10.6 的全部起源 ——许可证是一种融资工具，不是荣誉 1506 一本航海手册出版，被禁，然后被翻印四十次 禁书即知识（史学 DV15）； 它错了一处关键坐标 1511 一座岛上的原住民王国被\"依法\"征服，一名传教士当众反对 8.5 立场的历史锚 ；你们可以去找那个人的记录 1519 一支船队出发绕越大陆，一条船活着回来 那一船的香料 付清了整支舰队的账 （10.1 垄断利润率）； 只有一个人说了实话 1524 一场大疫随船抵达内陆，死掉的人比刀杀的多 ↳ 7.8 疾病表 ×3 频率 ；以及一片\"没人住的好地\"（ 那是假的 ） 1533 一座黄金城被一个只有 168 人的队伍拿下 12.7 秘密①的起源 —— 他们到底拿了什么？ 1545 发现那座山。白银开始流出来 ↳ 10.2 币改条款 生效； 波托西物价全窗口最高 （6.1） 1544–51 北方帝国三次铸币降银，物价翻涨，十六年才回锚 一次 货币危机战役 ：你们的欠饷正在变成纸（6.6） 1560 火药船队制度成型：两支护航队，一年两次 ↳ 10.3 护航 13% vs 闯线 19% —— 这是全游戏最好的一次赌博 1565 一条反向航线被找到，东方终于能回来 航线专利 = 垄断 （10.1）； 找到它的那个人被抹去了名字 1572 一场针对新教徒的屠城夜 你们港里现在有两批难民，两边都记仇（ 12.6 女船东 的起点） 1580 两顶王冠合并，海上执法突然变成一件事 ↳ 10.8 恶名门槛 ：一夜之间，你们的许可证作废了 1587 一支无敌舰队被风与火船打散 ↳ 10.7 St Philip 案分账实档 ；以及 一片沉船滩 （12.7 秘密④） 1590s 私掠公司化：股份制取代了船长个人 ↳ 10.6 股份 1/16 制 入戏—— 你们不再是海贼，你们是员工 1607 第一个能活下来的殖民地建立 12.5 的西部海域从此有了锚地 ；以及原住民的 盟约窗口 （8.5） 1618 一场大陆战争爆发，保险费全线翻倍 ↳ 10.3 保险战时 ×2–3 ； 火药与铁翻倍 （10.1） 约1620 一场风暴把一支探险船队吹进了\"恶魔纬度\"以南 12.7 秘密③ （幽灵纬度）的开场；也是本战役可以开始的时候 GM 使用说明 ： 开局年份必须写进战役记录第一页 ，因为它决定了 10.7 的分账规则、10.6 的许可证效力、10.3 的保费、和 12.3 里谁在跟谁打。 1580 年前后是两种完全不同的游戏。 12.3 八大势力 每张卡六行 ：野心／海军／陆上／ ↳ 改什么 ／声望解锁／PC 能为它做什么。 ①② 双帝国：南方王冠 与 北方帝座（镜像对） 两顶王冠在 1580 年并成一顶，在 1640 年又会分开—— 它们争夺的不是海，是\"谁有资格划分海\"。 南方王冠 （伊比利亚式，塔古斯为都） 北方帝座 （哈布斯堡式，帝国边地母国） 野心 把整条白银线攥在自己手里； 用舰队收税 拿回被联合省抢走的航运权； 用陆上同盟掐住海 海军 大：盖伦×40–70，慢，装载量惊人 中：船好但人不够， 靠借贷和雇佣补 陆上 内陆王朝的银矿区，靠要塞线维持 全欧最强的陆军，也是最缺钱的政府 ↳ 改什么 10.1 香料与白银的官方价 ； 10.3 报关 25% 档 10.3 保费战时档 ； 6.9 铸铁炮的普及来源 声望解锁 70+：军港与官仓；85+： 护航请求权 70+：陆上融资与船坞；85+： 一张敌国清单 PC 的雇佣关系 ：南方要你们 打 ，北方要你们 运 。两条路都通向同一件事—— 替政府收一笔它付不出来的债 。 ③ 北方联合省（商人共和国） 野心 ：不打任何人的船， 买所有人的货 。 海军 ：船多、炮少、快。 它的舰队就是它的商船队本身 。 ↳ 改什么 ： 10.1 运费全窗口最低 （fluyt 造价 175 银币/吨，比对手便宜 47%）； 10.3 报关 5–10% 档 ；6.5 仪器的最大产地。 声望解锁 ：55+： 能赊 ；70+： 能拿到别人拿不到的价 ；85+： 承保权 （10.3 保险——你们成为收钱的那一方）。 PC 能做什么 ：为它跑 闯线 （19% 保费省下来的那部分是你们的报酬）。 ④ 海岛王国（英吉利式） 野心 ：不许任何人独占这条海—— 以私掠为外交手段 。 海军 ：护卫舰最多、训练最好、规模最小。 它打不赢舰队，但能打死补给线。 ↳ 改什么 ： 10.6 许可证的第二个签发方 ；4.2「英吉利海岸」出身的\"私掠传统\"在这里是国策不是家族传统。 声望解锁 ：55+： 在它的任何港口，敌国财产都是\"待分配\" ；85+： 一支分舰队指挥权 。 PC 能做什么 ：领一张纸，然后成为一支力量。 ⑤ 至圣座与审判庭 野心 ： 为\"谁的土地、谁的船、谁的书\"提供合法性。 海军 ：无。有港口、有港口里的公证人、以及一份名单。 ↳ 改什么 ： 5.5 律法的全部难度 ； 分海诏书 （1496）的 DV16；4.2「伊比利亚港口区」\"教会的影子\"； 12.7 秘密⑤的守门人 。 声望解锁 ：40+： 文书可过任一港口 ；70+： 可以宣布一次战争不义 （这一条比一支舰队好用）。 PC 能做什么 ：替它找一样东西，或替它 烧掉 一样东西。 ⑥ 制图师与商团行会（含承保人卡特尔） 野心 ： 让\"知道\"这件事收费。 海军 ：没有。但有 灯塔专利 （10.3）、海图版权、和一份所有承保人共用的底价表。 ↳ 改什么 ： 8.7 海图与标本的收购价 ； 10.3 保险的底价卡特尔 （英—荷 ≥2% 那条）； 5.2 海图绘制的\"可交易成果\"条款 。 声望解锁 ：55+： 买断一张图 ；70+： 在任一港口的行情骰 +1 档 ；85+： 发布一条\"不存在的航线\" （ 这条是终局武器 ）。 PC 能做什么 ：给它测绘。 这是本作最纯粹的一种玩法：下船，画图，回来卖。 ⑦ 海盗共和国（血鸦海岸） 野心 ：不被承认地活着，并且 继续赚钱 。 海军 ：散，快，熟悉每一处浅水。它有 契约 没有法律。 ↳ 改什么 ： 10.4 走私渠道的存在条件 ； 10.8 恶名在 60+ 时唯一接待你的地方 ； 10.7 罗伯茨式分份与断肢补偿的出处 。 声望解锁 ：40+： 销赃实现率升到 1/2 ；70+： 一条你们从没见过的敌国清单 ；85+： 一次联合出击 （四–六条船听你们的号令一次）。 PC 能做什么 ：把一次劫掠\"洗\"成一次生意—— 或反过来，把一桩生意做成一次劫掠。 ⑧ 内陆王朝（新大陆） 野心 ： 让海岸线以外的一切保持原样。 海军 ：无。 它不需要——它从来不需要在海上赢。 ↳ 改什么 ： 8.5 原住民三问的全部效力 ； 12.5 内陆海域的\"不可进入\" ； 11 章档位 （问卷：低魔限于海岸， 内陆可以不同 ）。 声望解锁 ：40+： 可以走陆路 （这在海上是颠覆性的）；85+： 一支军队替你们说话 。 PC 能做什么 ：别抢它。 与它做一笔生意，能改写第八节的全部规则。 【设计注·它是全章最重要的一张卡】 八大势力里，只有这一个 从不在海上出现 ，也唯一一个 能让玩家的船变成次要角色 。它的存在是为了让 8.5 那句立场有牙齿： 他们
