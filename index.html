<script id="book-data" type="application/json">[{"num":"00","title":"燃帆","vol":"卷首","skeleton":false,"html":"<h2>The Age of Burning Sail — 大航海时代冒险、海战与探索角色扮演游戏<\/h2>\n<blockquote class='quote'>桅杆在燃烧，罗盘在颤抖。地平线之外，是黄金、风暴，和从未被画进海图的东西。<\/blockquote>\n<hr>\n<h2>本书定位<\/h2>\n<ul class='mdlist'><li><strong>题材<\/strong>：15–17世纪大航海时代。历史写实为底，航海传说为翼——同一套规则同时支持\"纯历史私掠战役\"与\"超自然航海恐怖战役\"。<\/li><li><strong>核心体验<\/strong>：一艘船、一群各怀心思的船员、一片没有被画完的海图。探索未知、轰碎敌舰、低买高卖、以及活着回港。<\/li><li><strong>核心玩法循环<\/strong>：接下委托或立下目标 → 航行（导航 / 天气 / 补给 / 遭遇）→ 遭遇（探索 / 海战 / 交涉 / 贸易）→ 收获（战利品 / 声望 / 经验）→ 回港（修理 / 补给 / 升级 / 新目标）。<\/li><li><strong>规则基调<\/strong>：轻量判定制核心（d20），重度模块化。航海、海战、贸易、超自然都是可独立开关的模块。<\/li><\/ul>\n<h2>骰子与本书约定<\/h2>\n<ul class='mdlist'><li>核心判定使用 <strong>1枚d20<\/strong>，其余使用 d4–d12、百分比骰。<\/li><li>术语：<strong>PC<\/strong>（玩家角色）、<strong>GM<\/strong>（游戏主持人，本书称\"船长主持\"或直接叫GM）、<strong>DV<\/strong>（难度等级 Difficulty Value）、<strong>HP<\/strong>（生命值）、<strong>段<\/strong>（航行时间单位）。<\/li><\/ul>\n<h2>全书结构（四大区 + 十五章）<\/h2>\n<h3>卷一 · 玩家入门区<\/h3>\n<div class='tbl'><table><thead><tr><th>章<\/th><th>标题<\/th><th>内容<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>欢迎来到燃帆时代<\/td><td>什么是跑团、本作主题、核心循环、阅读路径<\/td><td>✅ 完整<\/td><\/tr><tr><td>2<\/td><td>快速开始<\/td><td>简化规则、4名预生成角色、微型冒险《暴风中的信号》<\/td><td>✅ 完整<\/td><\/tr><tr><td>3<\/td><td>核心规则<\/td><td>d20判定、难度、优势、潮汐点、时间尺度、伤害与成长<\/td><td>✅ 完整<\/td><\/tr><tr><td>4<\/td><td>角色创建<\/td><td>出身、属性、职业原型、技能、天赋、装备、关系<\/td><td>✅ 完整<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>卷二 · 系统核心区<\/h3>\n<div class='tbl'><table><thead><tr><th>章<\/th><th>标题<\/th><th>内容<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>技能与专长详解<\/td><td>33＋1 项技能逐条成文；三档即查难度；专长分支总表；术语归一（补入\"交易\"）<\/td><td>✅ 完整<\/td><\/tr><tr><td>6<\/td><td>装备与资源<\/td><td>银币＝5.5克纯银换算层；武器/火器/护甲定稿表；薪饷表；船用品与舰炮价；船价速查<\/td><td>✅ 完整<\/td><\/tr><tr><td>7<\/td><td>航海与船只<\/td><td>船只数据卡、船型表、航行轮、风向海况、船员士气、维修<\/td><td>✅ 完整<\/td><\/tr><tr><td>8<\/td><td>探索与发现<\/td><td>点阵海图三层揭示；四张 d20 发现表；遗迹四拍；原住民五档与接触四步<\/td><td>✅ 完整<\/td><\/tr><tr><td>9<\/td><td>战斗与海战<\/td><td>命中五档；阵位令与战位制；齐射流程与 d10 部位表；起火进水链；双钟追击；群战单页<\/td><td>✅ 完整<\/td><\/tr><tr><td>10<\/td><td>贸易、掠夺与声望<\/td><td>12 商品基价；行情骰；保险费率；传闻表 d20；许可证七步与船份；分账账本；声望八档＋恶名<\/td><td>✅ 完整<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>卷三 · 世界与主持区<\/h3>\n<div class='tbl'><table><thead><tr><th>章<\/th><th>标题<\/th><th>内容<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>11<\/td><td>超自然与传说（可选模块）<\/td><td>三档模式对照；镇定与三分创伤；心结表；羁绊投射；四怪遭遇结构；幽灵船程序；诅咒模板<\/td><td>✅ 完整<\/td><\/tr><tr><td>12<\/td><td>世界设定：黄金海洋<\/td><td>年表 20 条；八势力九卡；十港四型＋雾海接口；六海域；12 NPC；七秘密与线索链<\/td><td>✅ 完整<\/td><\/tr><tr><td>13<\/td><td>游戏主持指南<\/td><td>P0 五原则与 GM 议程；30 分钟备课；航段脚本与画线的时刻；3:2:1；遭遇表；NPC 生成器；<strong>特写展开变体<\/strong><\/td><td>✅ 完整<\/td><\/tr><tr><td>14<\/td><td>冒险模组与战役框架<\/td><td>《暴风中的信号》完整版；《血金航线》三幕；三幕战役框架；<strong>四个变体包（含四轨船团层）<\/strong>；敌人卡<\/td><td>✅ 完整<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>卷四 · 附录与工具区<\/h3>\n<div class='tbl'><table><thead><tr><th>章<\/th><th>标题<\/th><th>内容<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>15<\/td><td>附录<\/td><td>A 角色卡／B 船只卡与账本／C 规则速查／D 海战速查／E 全表索引／F 术语表／G 海图模板／<strong>H 骰子概率表<\/strong><\/td><td>✅ 完整<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>阅读路径<\/h2>\n<ul class='mdlist'><li><strong>新玩家<\/strong>：第1章 → 第2章（直接开玩）→ 第3、4章（建自己的角色）。到这里你已经是合格的船员。<\/li><li><strong>老玩家<\/strong>：直接读第3章（30分钟），然后按需翻阅第5–10章。<\/li><li><strong>GM（主持人）<\/strong>：全读。重点是第13章主持指南与第7、9章（航海与海战是本书主持负担最大的部分）。<\/li><li><strong>只想跑一局的桌上团<\/strong>：第2章 + 第15章速查表，20分钟开局。<\/li><\/ul>\n<h2>排版约定（写书规范）<\/h2>\n<ul class='mdlist'><li><strong>规则正文<\/strong>：标准字体。<\/li><li><strong>【示例】<\/strong>：斜体边栏，展示规则在桌面上如何使用。<\/li><li><strong>【变体】<\/strong>：可选规则，按需启用。<\/li><li><strong>【历史注】<\/strong>：真实历史背景注解，不改规则。<\/li><li><strong>【GM之眼】<\/strong>：仅GM应阅读的内容，玩家跳过。<\/li><\/ul>","text":"The Age of Burning Sail — 大航海时代冒险、海战与探索角色扮演游戏 桅杆在燃烧，罗盘在颤抖。地平线之外，是黄金、风暴，和从未被画进海图的东西。 本书定位 题材 ：15–17世纪大航海时代。历史写实为底，航海传说为翼——同一套规则同时支持\"纯历史私掠战役\"与\"超自然航海恐怖战役\"。 核心体验 ：一艘船、一群各怀心思的船员、一片没有被画完的海图。探索未知、轰碎敌舰、低买高卖、以及活着回港。 核心玩法循环 ：接下委托或立下目标 → 航行（导航 / 天气 / 补给 / 遭遇）→ 遭遇（探索 / 海战 / 交涉 / 贸易）→ 收获（战利品 / 声望 / 经验）→ 回港（修理 / 补给 / 升级 / 新目标）。 规则基调 ：轻量判定制核心（d20），重度模块化。航海、海战、贸易、超自然都是可独立开关的模块。 骰子与本书约定 核心判定使用 1枚d20 ，其余使用 d4–d12、百分比骰。 术语： PC （玩家角色）、 GM （游戏主持人，本书称\"船长主持\"或直接叫GM）、 DV （难度等级 Difficulty Value）、 HP （生命值）、 段 （航行时间单位）。 全书结构（四大区 + 十五章） 卷一 · 玩家入门区 章 标题 内容 状态 1 欢迎来到燃帆时代 什么是跑团、本作主题、核心循环、阅读路径 ✅ 完整 2 快速开始 简化规则、4名预生成角色、微型冒险《暴风中的信号》 ✅ 完整 3 核心规则 d20判定、难度、优势、潮汐点、时间尺度、伤害与成长 ✅ 完整 4 角色创建 出身、属性、职业原型、技能、天赋、装备、关系 ✅ 完整 卷二 · 系统核心区 章 标题 内容 状态 5 技能与专长详解 33＋1 项技能逐条成文；三档即查难度；专长分支总表；术语归一（补入\"交易\"） ✅ 完整 6 装备与资源 银币＝5.5克纯银换算层；武器/火器/护甲定稿表；薪饷表；船用品与舰炮价；船价速查 ✅ 完整 7 航海与船只 船只数据卡、船型表、航行轮、风向海况、船员士气、维修 ✅ 完整 8 探索与发现 点阵海图三层揭示；四张 d20 发现表；遗迹四拍；原住民五档与接触四步 ✅ 完整 9 战斗与海战 命中五档；阵位令与战位制；齐射流程与 d10 部位表；起火进水链；双钟追击；群战单页 ✅ 完整 10 贸易、掠夺与声望 12 商品基价；行情骰；保险费率；传闻表 d20；许可证七步与船份；分账账本；声望八档＋恶名 ✅ 完整 卷三 · 世界与主持区 章 标题 内容 状态 11 超自然与传说（可选模块） 三档模式对照；镇定与三分创伤；心结表；羁绊投射；四怪遭遇结构；幽灵船程序；诅咒模板 ✅ 完整 12 世界设定：黄金海洋 年表 20 条；八势力九卡；十港四型＋雾海接口；六海域；12 NPC；七秘密与线索链 ✅ 完整 13 游戏主持指南 P0 五原则与 GM 议程；30 分钟备课；航段脚本与画线的时刻；3:2:1；遭遇表；NPC 生成器； 特写展开变体 ✅ 完整 14 冒险模组与战役框架 《暴风中的信号》完整版；《血金航线》三幕；三幕战役框架； 四个变体包（含四轨船团层） ；敌人卡 ✅ 完整 卷四 · 附录与工具区 章 标题 内容 状态 15 附录 A 角色卡／B 船只卡与账本／C 规则速查／D 海战速查／E 全表索引／F 术语表／G 海图模板／ H 骰子概率表 ✅ 完整 阅读路径 新玩家 ：第1章 → 第2章（直接开玩）→ 第3、4章（建自己的角色）。到这里你已经是合格的船员。 老玩家 ：直接读第3章（30分钟），然后按需翻阅第5–10章。 GM（主持人） ：全读。重点是第13章主持指南与第7、9章（航海与海战是本书主持负担最大的部分）。 只想跑一局的桌上团 ：第2章 + 第15章速查表，20分钟开局。 排版约定（写书规范） 规则正文 ：标准字体。 【示例】 ：斜体边栏，展示规则在桌面上如何使用。 【变体】 ：可选规则，按需启用。 【历史注】 ：真实历史背景注解，不改规则。 【GM之眼】 ：仅GM应阅读的内容，玩家跳过。"},{"num":"01","title":"欢迎来到燃帆时代","vol":"卷一 · 玩家入门区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>1497年，达·伽马绕过好望角。1522年，麦哲伦的船队完成了人类第一次环球航行——出发时五艘船二百七十人，回到塞维利亚时只剩一艘船十八个人。<\/em><br><em>这就是本书的底色：海洋把财富与荣耀慷慨地摆在人们面前，然后用风暴、坏血病、炮火和深渊，收走十倍于它的代价。<\/em><\/blockquote>\n<hr>\n<h2>1.1 什么是角色扮演游戏<\/h2>\n<p>角色扮演游戏（Tabletop Role-Playing Game，跑团）是一种围坐一桌共同讲故事的游戏：<\/p>\n<ul class='mdlist'><li><strong>玩家（Player）<\/strong>扮演故事的主角——本书中，是一名大航海时代的水手、军官、商人或冒险者。<\/li><li><strong>游戏主持人（Game Master，GM）<\/strong>扮演整个世界：海洋、风暴、港口、敌人、传闻，以及所有其他角色。GM描述场景，裁决规则，让世界对玩家的选择作出真实回应。<\/li><li><strong>规则书（本书）<\/strong>提供共同的语言：骰子怎么掷、船怎么开、炮怎么响、人怎么死。规则不是枷锁，而是让\"你的船在风暴里沉没\"这件事<strong>可信<\/strong>的骨架。<\/li><\/ul>\n<p>跑团的黄金法则只有一条：<strong>规则服务于故事。<\/strong> 当规则与桌上的乐趣冲突时，全体同意即可变通——但要记住你改了什么，下次保持一致。<\/p>\n<h2>1.2 主题与基调<\/h2>\n<p>《燃帆》不是\"穿着古装的奇幻游戏\"。它有三个支点：<\/p>\n<p><strong>一、海洋是无情的裁判。<\/strong><br>风不会因为你勇敢就转向，坏血病不会因为你正义就绕路。本书的资源规则（补给、士气、船体）就是为了让\"航行本身\"成为冒险，而不是两次冒险之间的过场。<\/p>\n<p><strong>二、人在利益与深渊之间。<\/strong><br>大航海时代同时是地理大发现、殖民掠夺、奴隶贸易与宗教战争的时代。本书不回避它的复杂：你的角色可以是理想主义的制图师，也可以是签了私掠许可证的掠私者，或者两者都是。第12章的世界设定为GM提供了处理这些主题的工具。<\/p>\n<p><strong>三、海平线之外有不该存在的东西。<\/strong><br>默认战役中，传说与现实之间隔着一条模糊的线。水手们赌咒说自己见过海蛇；教会说那是热病幻觉。第11章超自然模块让你决定这条线画在哪里——完全没有、若有似无，或者克拉肯周五午后准时上班。<\/p>\n<h2>1.3 核心玩法循环<\/h2>\n<p>每一次冒险、整场战役，都围绕同一个循环：<\/p>\n<pre class='codeblock'><code>        ┌─────────────────────────────────────────┐\n        │                                         │\n        ▼                                         │\n  ① 立目标      ② 航行         ③ 遭遇           │\n  委托/悬赏/    导航·风向·      探索·海战·        │\n  复仇·淘金     补给·遭遇表     交涉·贸易·        │\n                              超自然事件        │\n        ▲              │                         │\n        │              ▼                         │\n  ⑤ 回港整备  ←─ ④ 收获 ────────────────────────┘\n  修理·补给    战利品·声望·\n  升级·传闻    经验·新线索<\/code><\/pre>\n<ul class='mdlist'><li>循环的每一环都消耗资源（补给、船体、士气、HP），也都生产资源。<\/li><li><strong>航行的意义<\/strong>：②不是过场。风向、航线、迷航、偶遇，都是玩家的决策点。<\/li><li><strong>港口的意义<\/strong>：⑤不是存档点。港口有价格波动、通缉令、阴谋和下一份委托。<\/li><\/ul>\n<h2>1.4 你需要什么<\/h2>\n<div class='tbl'><table><thead><tr><th>物品<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>骰子<\/td><td>至少1枚d20；建议每人一套（d4/d6/d8/d10/d12/d20）<\/td><\/tr><tr><td>角色卡<\/td><td>附录A，每人一张；快速开始用第2章的预生成卡<\/td><\/tr><tr><td>船只记录卡<\/td><td>附录B，一桌一张（整队共用一艘船时）<\/td><\/tr><tr><td>铅笔与草稿纸<\/td><td>航行日志、海图涂鸦<\/td><\/tr><tr><td>棋子/代币 + 网格地图<\/td><td>仅海战登船战和陆地战斗需要；纯叙事团可省<\/td><\/tr><tr><td>一位GM和三五位玩家<\/td><td>3–5名玩家体验最佳<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>1.5 核心规则摘要（一页纸）<\/h2>\n<p>其余细节见第3章，但你现在只需要知道：<\/p>\n<ol class='mdlist'><li><strong>你的一切行动，如果成败存疑且后果重要，就掷骰<\/strong>：掷 <strong>1d20 + 相关属性 + 相关技能<\/strong>，结果 <strong>≥ 难度等级（DV）<\/strong> 即成功。<\/li><li><strong>难度<\/strong>：简单10 / 普通13 / 困难16 / 极难19 / 传奇22。<\/li><li><strong>条件有利时掷两个d20取高（优势），不利时取低（劣势）<\/strong>。条件是叠加的，优势劣势相互抵消。<\/li><li><strong>每个角色有3点潮汐点<\/strong>：花1点可以重掷一次、给任意骰+5、或把一次失败改写成\"成功了，但引入新麻烦\"。<\/li><li><strong>时间尺度<\/strong>：战斗轮≈6秒；海战轮≈1分钟；航行段=4小时（一天6段）；跨海旅程按天计。<\/li><li><strong>生命值归零<\/strong>不是死亡，是倒地濒死；濒死时每轮掷死亡骰，攒够三次失败才死。<\/li><li><strong>船是人<\/strong>：船有船体值、帆、炮和船员士气，船员哗变的可能性永远大于零。<\/li><\/ol>\n<h2>1.6 本作怎么读<\/h2>\n<ul class='mdlist'><li>玩家只需要卷一（第1–4章），加一张速查表。<\/li><li>需要查技能细节→第5章；买东西→第6章；开船→第7章；上岸探险→第8章；打架→第9章；赚钱→第10章。<\/li><li>GM额外拥有卷三、卷四。第11章超自然模块，全桌开团前应共同决定启不启用。<\/li><\/ul>\n<h2>1.7 术语表（入门版）<\/h2>\n<div class='tbl'><table><thead><tr><th>术语<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>PC / NPC<\/td><td>玩家角色 / 非玩家角色<\/td><\/tr><tr><td>GM<\/td><td>游戏主持人<\/td><\/tr><tr><td>检定（Check）<\/td><td>掷骰判定行动成败<\/td><\/tr><tr><td>DV<\/td><td>难度等级，检定要达到的目标值<\/td><\/tr><tr><td>优势 / 劣势<\/td><td>掷2d20取高 / 取低<\/td><\/tr><tr><td>潮汐点<\/td><td>玩家的命运资源，重掷、加值、改写失败<\/td><\/tr><tr><td>段（Watch）<\/td><td>航行时间单位，4小时；一昼夜6段<\/td><\/tr><tr><td>海战轮<\/td><td>舰船战斗的时间单位，约1分钟<\/td><\/tr><tr><td>接舷（Boarding）<\/td><td>两船钩连、甲板跳帮肉搏<\/td><\/tr><tr><td>声望<\/td><td>角色在各国势力中的名声数值<\/td><\/tr><tr><td>段表 / 遭遇表<\/td><td>GM掷骰生成随机事件的表格<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<p><em>准备好了？翻到第2章，四名船员已经在暴风雨里等你。<\/em><\/p>","text":"1497年，达·伽马绕过好望角。1522年，麦哲伦的船队完成了人类第一次环球航行——出发时五艘船二百七十人，回到塞维利亚时只剩一艘船十八个人。 这就是本书的底色：海洋把财富与荣耀慷慨地摆在人们面前，然后用风暴、坏血病、炮火和深渊，收走十倍于它的代价。 1.1 什么是角色扮演游戏 角色扮演游戏（Tabletop Role-Playing Game，跑团）是一种围坐一桌共同讲故事的游戏： 玩家（Player） 扮演故事的主角——本书中，是一名大航海时代的水手、军官、商人或冒险者。 游戏主持人（Game Master，GM） 扮演整个世界：海洋、风暴、港口、敌人、传闻，以及所有其他角色。GM描述场景，裁决规则，让世界对玩家的选择作出真实回应。 规则书（本书） 提供共同的语言：骰子怎么掷、船怎么开、炮怎么响、人怎么死。规则不是枷锁，而是让\"你的船在风暴里沉没\"这件事 可信 的骨架。 跑团的黄金法则只有一条： 规则服务于故事。 当规则与桌上的乐趣冲突时，全体同意即可变通——但要记住你改了什么，下次保持一致。 1.2 主题与基调 《燃帆》不是\"穿着古装的奇幻游戏\"。它有三个支点： 一、海洋是无情的裁判。 风不会因为你勇敢就转向，坏血病不会因为你正义就绕路。本书的资源规则（补给、士气、船体）就是为了让\"航行本身\"成为冒险，而不是两次冒险之间的过场。 二、人在利益与深渊之间。 大航海时代同时是地理大发现、殖民掠夺、奴隶贸易与宗教战争的时代。本书不回避它的复杂：你的角色可以是理想主义的制图师，也可以是签了私掠许可证的掠私者，或者两者都是。第12章的世界设定为GM提供了处理这些主题的工具。 三、海平线之外有不该存在的东西。 默认战役中，传说与现实之间隔着一条模糊的线。水手们赌咒说自己见过海蛇；教会说那是热病幻觉。第11章超自然模块让你决定这条线画在哪里——完全没有、若有似无，或者克拉肯周五午后准时上班。 1.3 核心玩法循环 每一次冒险、整场战役，都围绕同一个循环： ┌─────────────────────────────────────────┐ │ │ ▼ │ ① 立目标 ② 航行 ③ 遭遇 │ 委托/悬赏/ 导航·风向· 探索·海战· │ 复仇·淘金 补给·遭遇表 交涉·贸易· │ 超自然事件 │ ▲ │ │ │ ▼ │ ⑤ 回港整备 ←─ ④ 收获 ────────────────────────┘ 修理·补给 战利品·声望· 升级·传闻 经验·新线索 循环的每一环都消耗资源（补给、船体、士气、HP），也都生产资源。 航行的意义 ：②不是过场。风向、航线、迷航、偶遇，都是玩家的决策点。 港口的意义 ：⑤不是存档点。港口有价格波动、通缉令、阴谋和下一份委托。 1.4 你需要什么 物品 说明 骰子 至少1枚d20；建议每人一套（d4/d6/d8/d10/d12/d20） 角色卡 附录A，每人一张；快速开始用第2章的预生成卡 船只记录卡 附录B，一桌一张（整队共用一艘船时） 铅笔与草稿纸 航行日志、海图涂鸦 棋子/代币 + 网格地图 仅海战登船战和陆地战斗需要；纯叙事团可省 一位GM和三五位玩家 3–5名玩家体验最佳 1.5 核心规则摘要（一页纸） 其余细节见第3章，但你现在只需要知道： 你的一切行动，如果成败存疑且后果重要，就掷骰 ：掷 1d20 + 相关属性 + 相关技能 ，结果 ≥ 难度等级（DV） 即成功。 难度 ：简单10 / 普通13 / 困难16 / 极难19 / 传奇22。 条件有利时掷两个d20取高（优势），不利时取低（劣势） 。条件是叠加的，优势劣势相互抵消。 每个角色有3点潮汐点 ：花1点可以重掷一次、给任意骰+5、或把一次失败改写成\"成功了，但引入新麻烦\"。 时间尺度 ：战斗轮≈6秒；海战轮≈1分钟；航行段=4小时（一天6段）；跨海旅程按天计。 生命值归零 不是死亡，是倒地濒死；濒死时每轮掷死亡骰，攒够三次失败才死。 船是人 ：船有船体值、帆、炮和船员士气，船员哗变的可能性永远大于零。 1.6 本作怎么读 玩家只需要卷一（第1–4章），加一张速查表。 需要查技能细节→第5章；买东西→第6章；开船→第7章；上岸探险→第8章；打架→第9章；赚钱→第10章。 GM额外拥有卷三、卷四。第11章超自然模块，全桌开团前应共同决定启不启用。 1.7 术语表（入门版） 术语 含义 PC / NPC 玩家角色 / 非玩家角色 GM 游戏主持人 检定（Check） 掷骰判定行动成败 DV 难度等级，检定要达到的目标值 优势 / 劣势 掷2d20取高 / 取低 潮汐点 玩家的命运资源，重掷、加值、改写失败 段（Watch） 航行时间单位，4小时；一昼夜6段 海战轮 舰船战斗的时间单位，约1分钟 接舷（Boarding） 两船钩连、甲板跳帮肉搏 声望 角色在各国势力中的名声数值 段表 / 遭遇表 GM掷骰生成随机事件的表格 准备好了？翻到第2章，四名船员已经在暴风雨里等你。"},{"num":"02","title":"快速开始","vol":"卷一 · 玩家入门区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>本章让你在20分钟内跑通一局：一次风暴、一次抉择、一场接舷战。<\/em><br><em>这里的规则是第3章的裁剪版，完全兼容——玩过这局，你已经会玩《燃帆》了。<\/em><\/blockquote>\n<hr>\n<h2>2.1 三分钟规则速览<\/h2>\n<ol class='mdlist'><li>你想做什么？GM判断成败是否存疑。存疑就掷骰。<\/li><li>掷 <strong>1d20 + 属性 + 技能<\/strong>，达到GM说的<strong>难度<\/strong>就成功：简单10 / 普通13 / 困难16。<\/li><li>条件有利掷2个d20<strong>取高<\/strong>，不利<strong>取低<\/strong>。<\/li><li>每人有 <strong>3点潮汐点<\/strong>。花1点：重掷一次 / 任何骰+5 / 把失败改成\"成功但来了新麻烦\"。<\/li><li>HP归零=倒地濒死（不是死）。濒死每轮掷d20，≥10算稳住，攒3次失败才死。<\/li><li>战斗顺序：每人掷一次<strong>机敏<\/strong>检定，从高到低轮流行动，每轮<strong>1个动作+自由移动<\/strong>。<\/li><li>攻击 = d20+属性+技能 vs <strong>防御值13+护甲<\/strong>；命中掷武器伤害。<\/li><\/ol>\n<p>够了。下面是人和船。<\/p>\n<hr>\n<h2>2.2 海燕号（简化船只卡）<\/h2>\n<p><em>一艘吃水浅的单桅快船，船龄十二年，补丁比雕饰多。<\/em><\/p>\n<div class='tbl'><table><thead><tr><th>项目<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>船体值<\/td><td><strong>14<\/strong>（归零=失控/沉没危机）<\/td><\/tr><tr><td>帆况<\/td><td>良好（受损时航速下降）<\/td><\/tr><tr><td>武装<\/td><td>4门4磅炮：<strong>齐射 = d20+炮术 vs 14，命中3d6伤害船体<\/strong>；每2轮可射击一次（装填）<\/td><\/tr><tr><td>船员<\/td><td>11人（最低6人）；<strong>士气：坚定<\/strong>（士气崩→有人不听命令或哗变）<\/td><\/tr><tr><td>特性<\/td><td><strong>浅水之子<\/strong>：进入礁区、河口的航行检定劣势移除<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>海战快速流程<\/strong>：每轮=1分钟。每人选一个战位动作：<\/p>\n<ul class='mdlist'><li><strong>掌舵<\/strong>（掌舵 vs DV13+敌机敏）：抢到有利阵位，下轮我方所有检定优势；<\/li><li><strong>炮组<\/strong>（炮术 vs 14）：命中敌船造成3d6船体伤害；<\/li><li><strong>帆组<\/strong>（操帆 vs 13）：加速或急转，拉开/缩短距离；<\/li><li><strong>瞭望<\/strong>（学识 vs 12）：识破敌船动向，全船下次检定+2；<\/li><li><strong>跳帮准备<\/strong>：钩住敌船（接舷 vs 14），成功后转为甲板战。<\/li><li>敌船HP归零后：瘫痪/起火/投降（掷d6：1–2沉没，3–4瘫痪，5–6降帆投降）。<\/li><\/ul>\n<h2>2.3 四名船员（预生成角色）<\/h2>\n<h3>① 玛蒂尔达·\"铁夫人\"·科尔特斯 —— 船长<\/h3>\n<p><em>她当过三年商船大副、两年私掠船俘囚，脸上的疤比航海日志还厚。<\/em><\/p>\n<div class='tbl'><table><thead><tr><th>筋骨3<\/th><th>机敏2<\/th><th>学识3<\/th><th>胆魄3<\/th><th>人望4<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>HP 12<\/strong> | 潮汐点3 | 护甲1（皮衬外套）| 银币20<\/li><li>技能：交涉1、火器1、<strong>领导2<\/strong>、掌舵1、气象1、威吓1<\/li><li>天赋：<strong>冷酷船长<\/strong>（威吓+2；哗变时你的存在+3镇压）<\/li><li>武器：佩剑 <strong>1d8<\/strong> | 家传银十字（可典当20银币）<\/li><li>背景：为洗刷被诬通敌的家族名誉而重新出海。<\/li><\/ul>\n<h3>② 托比亚斯·\"老铁\"·格里姆 —— 炮长<\/h3>\n<p><em>左耳是六年前一场齐射带走的。他说这样听炮声更清楚。<\/em><\/p>\n<div class='tbl'><table><thead><tr><th>筋骨3<\/th><th>机敏2<\/th><th>学识3<\/th><th>胆魄4<\/th><th>人望1<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>HP 12<\/strong> | 潮汐点3 | 护甲0 | 银币20<\/li><li>技能：<strong>炮术2<\/strong>、工程1、游泳1、领导1、火器1、木工1<\/li><li>天赋：<strong>炮术大师<\/strong>（他计算的射击诸元使炮击检定+1）<\/li><li>武器：短铳 <strong>2d6<\/strong>（射程10，装填1轮）| 猎刀 <strong>1d6<\/strong> | 点火棍<\/li><li>背景：想攒钱打一门属于自己的长炮，架在一个他没说的地方。<\/li><\/ul>\n<h3>③ 伊内丝·德·阿尔梅达 —— 船医<\/h3>\n<p><em>被书院除名的药剂学天才。她说离开里斯本的理由是\"空气\"。<\/em><\/p>\n<div class='tbl'><table><thead><tr><th>筋骨1<\/th><th>机敏2<\/th><th>学识4<\/th><th>胆魄3<\/th><th>人望3<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>HP 8<\/strong> | 潮汐点3（天赋+1=<strong>4<\/strong>）| 护甲0 | 银币20<\/li><li>技能：<strong>医术2<\/strong>、博物学2、语言学1、制药1、交涉1、史学1<\/li><li>天赋：<strong>幸运之星<\/strong>（潮汐点上限4）<\/li><li>武器：手术刀 <strong>1d4<\/strong> | 器械包与药草箱（治疗：短休额外+2HP/人）<\/li><li>背景：随身行李里有一封她谁也没给看过的蜡封信。<\/li><\/ul>\n<h3>④ 洛伦佐·\"罗盘\"·瓦莱里奥 —— 领航员<\/h3>\n<p><em>十四岁起跑地中海，二十岁那年一场海难只活下他一个。他不太谈这件事。<\/em><\/p>\n<div class='tbl'><table><thead><tr><th>筋骨2<\/th><th>机敏4<\/th><th>学识3<\/th><th>胆魄2<\/th><th>人望2<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>HP 10<\/strong> | 潮汐点3 | 护甲0 | 银币20<\/li><li>技能：<strong>导航2<\/strong>、海图绘制1、气象1、游泳1、操帆1、剑术1<\/li><li>天赋：<strong>海图记忆<\/strong>（走过的航线凭记忆可重航；海图绘制+2）<\/li><li>武器：短弯刀 <strong>1d6<\/strong> | 星盘、象限仪、海图具<\/li><li>背景：他床板下压着半张来历不明的旧海图，缺了一角。<\/li><\/ul>\n<blockquote class='quote'>分配建议：新桌让最有经验的人拿玛蒂尔达（她要拍板），最少经验的人拿洛伦佐（他的判定最\"干净\"）。<\/blockquote>\n<hr>\n<h2>2.4 微型冒险：《暴风中的信号》<\/h2>\n<p><em>适合1名GM+3–4名玩家，60–90分钟。GM只读引文，其余按流程跑。<\/em><\/p>\n<h3>场景0 · 开场（GM朗读）<\/h3>\n<blockquote class='quote aside-voice'><em>海燕号离开圣克鲁斯港的第三天。你运的是一船咸鱼和酒——不值钱，但这次航线的运费能让每个人吃三个月饱饭。<\/em><br><em>第四天黎明，海鸟全不见了。洛伦佐——你们的领航员——放下望远镜，脸色比海还灰：<\/em><br><em>\"云要从两个方向合围了。这不是普通的季风。\"<\/em><\/blockquote>\n<h3>场景1 · 风暴<\/h3>\n<p><strong>第一段（预警）<\/strong>：气象检定（DV13）。<\/p>\n<ul class='mdlist'><li>成功：全船获得1轮准备（下一检定优势）；伊内丝（或有人）来得及把药箱捆牢。<\/li><li>失败：没有任何准备，直接进入第二段。<\/li><\/ul>\n<p><strong>第二段（穿风暴）<\/strong>：<strong>团队检定<\/strong>，全员各掷（掌舵、操帆、胆魄、筋骨——各归各的属性+技能，DV14，暴风）。<strong>过半成功则海燕号顶了过去<\/strong>：<\/p>\n<ul class='mdlist'><li>成功通过：船体无损，但你们看见风眼边缘有<strong>橙红色的光<\/strong>——不是闪电的频率。<\/li><li>失败：船体受 <strong>2d6<\/strong> 伤害；一人被卷落水或挂在桅上（机敏 vs 15 攀住，失败落水者游泳 vs 13，否则开始溺水，见GM侧栏）。<\/li><li>船体值低于8时：进水，帆组每轮必须有人抽水。<\/li><\/ul>\n<blockquote class='quote'><strong>【GM侧栏·溺水】<\/strong> 屏气=筋骨轮数。之后每轮承受1点环境伤害且检定劣势；HP归零照常濒死，但在水下濒死每轮自动失败1次死亡骰。救人：跳下去（筋骨）+游泳对拽。<\/blockquote>\n<h3>场景2 · 燃烧的信号<\/h3>\n<p>风暴过后，黄昏。前方漂着<strong>半沉的商船残骸<\/strong>，桅杆还在烧。瞭望（学识 vs 12）听到风里有呼救声。<\/p>\n<p><strong>残骸上有三样东西<\/strong>（玩家只能带走船舱装得下的）：<\/p>\n<ol class='mdlist'><li>一名<strong>幸存者<\/strong>——昏过去的少年水手，怀里死死抱着一个浸蜡的木筒；<\/li><li>两箱<strong>没被烧掉的货<\/strong>——开箱（机敏 vs 12）：一箱上等靛蓝染料（港口收购价60银币/箱），一箱火药（受潮，半价）；<\/li><li>少年木筒里的一封信：<em>致\"银鸥号\"代理人：货已按约沉放在____（被水渍洇掉）……红隼号认得路径。<\/em><\/li><\/ol>\n<p><strong>抉择时刻<\/strong>：救人要腾舱位、分口粮；拿货要冒二次风暴的浪；信里说\"红隼号\"——老水手会告诉你那是片海域最凶的猎私船。<\/p>\n<blockquote class='quote'>让玩家自己吵。这一幕没有正确答案，吵出来的东西就是他们的船。<\/blockquote>\n<h3>场景3 · 红隼号<\/h3>\n<p>天空全黑时，洛伦佐的瞳孔缩了一下：<em>右舷后方，一艘双桅船咬住了风，吃水很浅——那是用来装炮的。<\/em><\/p>\n<p>红隼号（船体16、炮6门齐射3d6+1、船员18、士气高）发来旗语：<strong>停船受检，否则击沉。<\/strong><\/p>\n<p>三条路，玩家自己选：<\/p>\n<ul class='mdlist'><li><strong>逃<\/strong>：连续2轮操帆对掌舵对抗，赢两轮即脱离夜色。海燕号是快船——有\"浅水之子\"和洛伦佐在，逃是现实的。<\/li><li><strong>打<\/strong>：进入海战快速流程（2.2节）。红隼号吨位火力占优，但夜战+风暴尾流让它的炮击有劣势——<strong>这个信息应通过成功的瞭望检定透露<\/strong>。<\/li><li><strong>谈<\/strong>：人望 vs 对方船长（对抗，DV13）。红隼号的旗语可以解读：他们要的不是船，是<strong>那个木筒<\/strong>。交出木筒能买命——少年会醒过来求你们别给。<\/li><\/ul>\n<p><strong>接舷战（如果打到甲板上）<\/strong>：钩住后，双方各出人混战。红隼号登船队长\"钉子\"——筋骨4/机敏2/HP16/刀1d8+1（老兵）。他倒下时红隼号水手士气崩溃（掷d6，≤4撤退）。<\/p>\n<h3>场景4 · 尾声与钩子<\/h3>\n<p>无论结果，当晚结束前落到玩家手里：<\/p>\n<ol class='mdlist'><li><strong>战利品清单<\/strong>：靛蓝×1–2箱、火药（半潮）、红隼号旗舰旗（若打赢——在塔古斯港值80银币，也是个挑衅）、少年水手\"帕科\"（活的）。<\/li><li><strong>三个钩子<\/strong>（选一个念出来收尾）：<ol class='sub'><li>帕科醒来，第一句话：\"信不是给银鸥号的……是给<strong>你们船长<\/strong>的。她认得那个火漆印。\"<\/li><li>洛伦佐把木筒里那张洇掉地址的信，和他床板下的<strong>半张旧海图<\/strong>拼在一起——缺口刚好对上。<\/li><li>港口关税吏翻着名册抬头：\"海燕号？……你们在风暴海域捡到了燃烧的船？跟我来一趟。\"<\/li><\/ol><\/li><\/ol>\n<h3>结算<\/h3>\n<ul class='mdlist'><li>每人 <strong>1 XP<\/strong>（达成主要目标再+1，卓越表现+1）。<\/li><li>伤势照第3章恢复规则处理；船体损伤回港修理（第7章预告：每点船体2银币、每段修1点）。<\/li><\/ul>\n<hr>\n<h2>2.5 玩完之后<\/h2>\n<div class='tbl'><table><thead><tr><th>你们想……<\/th><th>去读<\/th><\/tr><\/thead><tbody><tr><td>建自己的角色<\/td><td>第4章<\/td><\/tr><tr><td>看懂全部判定规则<\/td><td>第3章<\/td><\/tr><tr><td>认真开船、管理船员<\/td><td>第7章<\/td><\/tr><tr><td>正式海战、接舷<\/td><td>第9章<\/td><\/tr><tr><td>卖货赚钱、混港口<\/td><td>第10章<\/td><\/tr><tr><td>当GM<\/td><td>第13章，然后从本章的冒险改你的第一团<\/td><\/tr><\/tbody><\/table><\/div>","text":"本章让你在20分钟内跑通一局：一次风暴、一次抉择、一场接舷战。 这里的规则是第3章的裁剪版，完全兼容——玩过这局，你已经会玩《燃帆》了。 2.1 三分钟规则速览 你想做什么？GM判断成败是否存疑。存疑就掷骰。 掷 1d20 + 属性 + 技能 ，达到GM说的 难度 就成功：简单10 / 普通13 / 困难16。 条件有利掷2个d20 取高 ，不利 取低 。 每人有 3点潮汐点 。花1点：重掷一次 / 任何骰+5 / 把失败改成\"成功但来了新麻烦\"。 HP归零=倒地濒死（不是死）。濒死每轮掷d20，≥10算稳住，攒3次失败才死。 战斗顺序：每人掷一次 机敏 检定，从高到低轮流行动，每轮 1个动作+自由移动 。 攻击 = d20+属性+技能 vs 防御值13+护甲 ；命中掷武器伤害。 够了。下面是人和船。 2.2 海燕号（简化船只卡） 一艘吃水浅的单桅快船，船龄十二年，补丁比雕饰多。 项目 数值 船体值 14 （归零=失控/沉没危机） 帆况 良好（受损时航速下降） 武装 4门4磅炮： 齐射 = d20+炮术 vs 14，命中3d6伤害船体 ；每2轮可射击一次（装填） 船员 11人（最低6人）； 士气：坚定 （士气崩→有人不听命令或哗变） 特性 浅水之子 ：进入礁区、河口的航行检定劣势移除 海战快速流程 ：每轮=1分钟。每人选一个战位动作： 掌舵 （掌舵 vs DV13+敌机敏）：抢到有利阵位，下轮我方所有检定优势； 炮组 （炮术 vs 14）：命中敌船造成3d6船体伤害； 帆组 （操帆 vs 13）：加速或急转，拉开/缩短距离； 瞭望 （学识 vs 12）：识破敌船动向，全船下次检定+2； 跳帮准备 ：钩住敌船（接舷 vs 14），成功后转为甲板战。 敌船HP归零后：瘫痪/起火/投降（掷d6：1–2沉没，3–4瘫痪，5–6降帆投降）。 2.3 四名船员（预生成角色） ① 玛蒂尔达·\"铁夫人\"·科尔特斯 —— 船长 她当过三年商船大副、两年私掠船俘囚，脸上的疤比航海日志还厚。 筋骨3 机敏2 学识3 胆魄3 人望4 HP 12 | 潮汐点3 | 护甲1（皮衬外套）| 银币20 技能：交涉1、火器1、 领导2 、掌舵1、气象1、威吓1 天赋： 冷酷船长 （威吓+2；哗变时你的存在+3镇压） 武器：佩剑 1d8 | 家传银十字（可典当20银币） 背景：为洗刷被诬通敌的家族名誉而重新出海。 ② 托比亚斯·\"老铁\"·格里姆 —— 炮长 左耳是六年前一场齐射带走的。他说这样听炮声更清楚。 筋骨3 机敏2 学识3 胆魄4 人望1 HP 12 | 潮汐点3 | 护甲0 | 银币20 技能： 炮术2 、工程1、游泳1、领导1、火器1、木工1 天赋： 炮术大师 （他计算的射击诸元使炮击检定+1） 武器：短铳 2d6 （射程10，装填1轮）| 猎刀 1d6 | 点火棍 背景：想攒钱打一门属于自己的长炮，架在一个他没说的地方。 ③ 伊内丝·德·阿尔梅达 —— 船医 被书院除名的药剂学天才。她说离开里斯本的理由是\"空气\"。 筋骨1 机敏2 学识4 胆魄3 人望3 HP 8 | 潮汐点3（天赋+1= 4 ）| 护甲0 | 银币20 技能： 医术2 、博物学2、语言学1、制药1、交涉1、史学1 天赋： 幸运之星 （潮汐点上限4） 武器：手术刀 1d4 | 器械包与药草箱（治疗：短休额外+2HP/人） 背景：随身行李里有一封她谁也没给看过的蜡封信。 ④ 洛伦佐·\"罗盘\"·瓦莱里奥 —— 领航员 十四岁起跑地中海，二十岁那年一场海难只活下他一个。他不太谈这件事。 筋骨2 机敏4 学识3 胆魄2 人望2 HP 10 | 潮汐点3 | 护甲0 | 银币20 技能： 导航2 、海图绘制1、气象1、游泳1、操帆1、剑术1 天赋： 海图记忆 （走过的航线凭记忆可重航；海图绘制+2） 武器：短弯刀 1d6 | 星盘、象限仪、海图具 背景：他床板下压着半张来历不明的旧海图，缺了一角。 分配建议：新桌让最有经验的人拿玛蒂尔达（她要拍板），最少经验的人拿洛伦佐（他的判定最\"干净\"）。 2.4 微型冒险：《暴风中的信号》 适合1名GM+3–4名玩家，60–90分钟。GM只读引文，其余按流程跑。 场景0 · 开场（GM朗读） 海燕号离开圣克鲁斯港的第三天。你运的是一船咸鱼和酒——不值钱，但这次航线的运费能让每个人吃三个月饱饭。 第四天黎明，海鸟全不见了。洛伦佐——你们的领航员——放下望远镜，脸色比海还灰： \"云要从两个方向合围了。这不是普通的季风。\" 场景1 · 风暴 第一段（预警） ：气象检定（DV13）。 成功：全船获得1轮准备（下一检定优势）；伊内丝（或有人）来得及把药箱捆牢。 失败：没有任何准备，直接进入第二段。 第二段（穿风暴） ： 团队检定 ，全员各掷（掌舵、操帆、胆魄、筋骨——各归各的属性+技能，DV14，暴风）。 过半成功则海燕号顶了过去 ： 成功通过：船体无损，但你们看见风眼边缘有 橙红色的光 ——不是闪电的频率。 失败：船体受 2d6 伤害；一人被卷落水或挂在桅上（机敏 vs 15 攀住，失败落水者游泳 vs 13，否则开始溺水，见GM侧栏）。 船体值低于8时：进水，帆组每轮必须有人抽水。 【GM侧栏·溺水】 屏气=筋骨轮数。之后每轮承受1点环境伤害且检定劣势；HP归零照常濒死，但在水下濒死每轮自动失败1次死亡骰。救人：跳下去（筋骨）+游泳对拽。 场景2 · 燃烧的信号 风暴过后，黄昏。前方漂着 半沉的商船残骸 ，桅杆还在烧。瞭望（学识 vs 12）听到风里有呼救声。 残骸上有三样东西 （玩家只能带走船舱装得下的）： 一名 幸存者 ——昏过去的少年水手，怀里死死抱着一个浸蜡的木筒； 两箱 没被烧掉的货 ——开箱（机敏 vs 12）：一箱上等靛蓝染料（港口收购价60银币/箱），一箱火药（受潮，半价）； 少年木筒里的一封信： 致\"银鸥号\"代理人：货已按约沉放在____（被水渍洇掉）……红隼号认得路径。 抉择时刻 ：救人要腾舱位、分口粮；拿货要冒二次风暴的浪；信里说\"红隼号\"——老水手会告诉你那是片海域最凶的猎私船。 让玩家自己吵。这一幕没有正确答案，吵出来的东西就是他们的船。 场景3 · 红隼号 天空全黑时，洛伦佐的瞳孔缩了一下： 右舷后方，一艘双桅船咬住了风，吃水很浅——那是用来装炮的。 红隼号（船体16、炮6门齐射3d6+1、船员18、士气高）发来旗语： 停船受检，否则击沉。 三条路，玩家自己选： 逃 ：连续2轮操帆对掌舵对抗，赢两轮即脱离夜色。海燕号是快船——有\"浅水之子\"和洛伦佐在，逃是现实的。 打 ：进入海战快速流程（2.2节）。红隼号吨位火力占优，但夜战+风暴尾流让它的炮击有劣势—— 这个信息应通过成功的瞭望检定透露 。 谈 ：人望 vs 对方船长（对抗，DV13）。红隼号的旗语可以解读：他们要的不是船，是 那个木筒 。交出木筒能买命——少年会醒过来求你们别给。 接舷战（如果打到甲板上） ：钩住后，双方各出人混战。红隼号登船队长\"钉子\"——筋骨4/机敏2/HP16/刀1d8+1（老兵）。他倒下时红隼号水手士气崩溃（掷d6，≤4撤退）。 场景4 · 尾声与钩子 无论结果，当晚结束前落到玩家手里： 战利品清单 ：靛蓝×1–2箱、火药（半潮）、红隼号旗舰旗（若打赢——在塔古斯港值80银币，也是个挑衅）、少年水手\"帕科\"（活的）。 三个钩子 （选一个念出来收尾）： 帕科醒来，第一句话：\"信不是给银鸥号的……是给 你们船长 的。她认得那个火漆印。\" 洛伦佐把木筒里那张洇掉地址的信，和他床板下的 半张旧海图 拼在一起——缺口刚好对上。 港口关税吏翻着名册抬头：\"海燕号？……你们在风暴海域捡到了燃烧的船？跟我来一趟。\" 结算 每人 1 XP （达成主要目标再+1，卓越表现+1）。 伤势照第3章恢复规则处理；船体损伤回港修理（第7章预告：每点船体2银币、每段修1点）。 2.5 玩完之后 你们想…… 去读 建自己的角色 第4章 看懂全部判定规则 第3章 认真开船、管理船员 第7章 正式海战、接舷 第9章 卖货赚钱、混港口 第10章 当GM 第13章，然后从本章的冒险改你的第一团"},{"num":"03","title":"核心规则","vol":"卷一 · 玩家入门区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>规则的目标只有一个：当你掷下骰子，海洋的回应是可信的。<\/em><\/blockquote>\n<p>本章定义全书唯一的判定引擎。第7–11章的所有子系统（航海、海战、贸易、超自然）都是这台引擎的插件，不引入新的基本骰法。<\/p>\n<hr>\n<h2>3.1 六个基本概念<\/h2>\n<ol class='mdlist'><li><strong>检定（Check）<\/strong>：行动成败存疑且后果重要时，掷骰判定。<\/li><li><strong>属性（Attribute）<\/strong>：角色的五项天赋，值域 1–5，普通人为2。<\/li><li><strong>技能（Skill）<\/strong>：角色的受训领域，值域 0–5。0=未受训。<\/li><li><strong>DV（难度等级）<\/strong>：检定成功所需的数值。<\/li><li><strong>优势/劣势<\/strong>：条件修正，掷2d20取高或取低。<\/li><li><strong>潮汐点（Tide）<\/strong>：玩家的命运资源，可以对抗坏骰运。<\/li><\/ol>\n<h2>3.2 检定<\/h2>\n<p><strong>检定公式：d20 + 相关属性 + 相关技能 ≥ DV → 成功<\/strong><\/p>\n<h3>何时需要检定<\/h3>\n<p>同时满足两个条件才掷骰：<\/p>\n<ul class='mdlist'><li><strong>成败存疑<\/strong>——有真实的失败可能；<\/li><li><strong>后果重要<\/strong>——失败会改变局面、付出代价或关闭选项。<\/li><\/ul>\n<p>走过跳板、在港口酒馆问路，不需要检定。顶着横浪跳上敌舰甲板、在酒馆里打探总督的私生子，需要。<\/p>\n<blockquote class='quote'><strong>【示例】<\/strong> 玩家：\"我想在暴风中爬上桅杆砍断纠缠的帆索。\" GM：成功存疑、失败会摔伤并耽误船头转向——掷骰。机敏+操帆，DV16（困难：暴风雨+高空）。掷出14+3+3=20，成功。<\/blockquote>\n<h3>难度等级<\/h3>\n<div class='tbl'><table><thead><tr><th>DV<\/th><th>难度<\/th><th>基准示例<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>简单<\/td><td>平静海面系缆；向友善港民问路<\/td><\/tr><tr><td>13<\/td><td>普通<\/td><td>侧风操帆转向；与市侩商人讨价还价<\/td><\/tr><tr><td>16<\/td><td>困难<\/td><td>暴风中抢修帆桁；审出撒谎者的真话<\/td><\/tr><tr><td>19<\/td><td>极难<\/td><td>无星雨夜天文定位；格挡火枪齐射<\/td><\/tr><tr><td>22<\/td><td>传奇<\/td><td>十二尺巨浪中掌舵穿浪眼；说服总督抗命开港<\/td><\/tr><\/tbody><\/table><\/div>\n<p>环境、工具、时间都会移动难度：有海图与六分仪的天文定位从极难降为困难；徒手从极难升为近乎不可能。<\/p>\n<h3>成功等级<\/h3>\n<p>检定结果超出DV的程度决定成功的<strong>质量<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>结果<\/th><th>等级<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>≥ DV+10<\/td><td><strong>卓越<\/strong><\/td><td>成功且额外获益（GM给一条额外信息/一个战术机会/一份额外战利品）<\/td><\/tr><tr><td>≥ DV+5<\/td><td><strong>良好<\/strong><\/td><td>成功且有小幅增益（更快、更干净、无人察觉等）<\/td><\/tr><tr><td>≥ DV<\/td><td><strong>成功<\/strong><\/td><td>如愿以偿<\/td><\/tr><tr><td>&lt; DV<\/td><td><strong>失败<\/strong><\/td><td>行动落空，并出现<strong>新的麻烦<\/strong>（见下）<\/td><\/tr><tr><td>&lt; DV−5<\/td><td><strong>惨败<\/strong><\/td><td>失败且额外受损（受伤、暴露、损失装备、士气下降）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>失败铁律：失败永远要改变局面。<\/strong> 不允许\"什么都没发生\"。失败的形式由GM从三个方向选：<strong>代价<\/strong>（损失时间/资源/血）、<strong>复杂化<\/strong>（引来注意/制造新威胁）、<strong>信息<\/strong>（失败让角色意识到此路不通，且知道为什么）。<\/p>\n<h3>优势与劣势<\/h3>\n<ul class='mdlist'><li>场景条件对行动<strong>有利<\/strong> → <strong>优势<\/strong>：掷两个d20取高。<\/li><li>场景条件对行动<strong>不利<\/strong> → <strong>劣势<\/strong>：掷两个d20取低。<\/li><li>多个优势/劣势条件<strong>不叠加<\/strong>，各自只算一次；一优一劣则<strong>相互抵消<\/strong>，掷单骰。<\/li><li>典型优势：居高临下、目标措手不及、有专业工具、有充足时间、有协助者。<\/li><li>典型劣势：雨雾遮目、负伤疼痛、匆忙、拙劣工具、极度疲劳。<\/li><\/ul>\n<h3>对抗检定<\/h3>\n<p>双方各掷一次（d20+属性+技能），<strong>高者胜<\/strong>；平局对防守方/现状有利。适用于潜行 vs 侦察、欺骗 vs 洞察、追逃 vs 追捕等。<\/p>\n<h3>协助与团队检定<\/h3>\n<ul class='mdlist'><li><strong>协助<\/strong>：一名同伴描述如何帮忙，并掷一项相关检定（DV10）。成功，主行动者获得<strong>优势<\/strong>；失败无额外惩罚。同一检定最多一人协助。<\/li><li><strong>团队检定<\/strong>：全员各掷，<strong>半数以上成功则全队成功<\/strong>；用于划桨接力、全船抢修、丛林行军等集体行动。<\/li><\/ul>\n<h3>未受训限制<\/h3>\n<p>技能为0时，你可以掷 d20+属性 做该技能的<strong>基础动作<\/strong>，但<strong>专业动作必须受训<\/strong>：没有炮术技能不能指挥齐射，没有医术不能做手术，没有导航不能测天定位。<\/p>\n<blockquote class='quote'><strong>【变体·严酷航行】<\/strong> 全部未受训练定改为劣势。适合想突出\"外行下海就是会死\"的历史写实战役。<\/blockquote>\n<h2>3.3 潮汐点（Tide）<\/h2>\n<p>每个角色拥有 <strong>3点潮汐点<\/strong>，代表好运气、老天的眷顾与水手的直觉。在下列时机花1点：<\/p>\n<div class='tbl'><table><thead><tr><th>用途<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>重掷<\/strong><\/td><td>重掷自己任何一次掷骰（必须用新结果）；也可重掷一名敌人对你的一次攻击骰<\/td><\/tr><tr><td><strong>灌风<\/strong><\/td><td>在你任何一次掷骰<strong>结果显示后<\/strong> +5<\/td><\/tr><tr><td><strong>浪里翻身<\/strong><\/td><td>把一次失败改写为<strong>成功但引入新麻烦<\/strong>——你达成了目的，GM同时让一个新问题浮现（帆裂了、追兵出现了、同伴看见了不该看的）<\/td><\/tr><tr><td><strong>抓牢船舷<\/strong><\/td><td>将一次足以使你倒地的伤害减半，或从濒死状态立刻恢复1点HP并稳固<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>恢复<\/strong>：返回友好港口休整时恢复全部；在海上长休（连续两个完整航段休息）恢复1点。<br><strong>上限<\/strong>：除专长外不超过3点。<br><strong>设计意图<\/strong>：潮汐点奖励冒险而非保险——\"浪里翻身\"和\"抓牢船舷\"的存在，让玩家<strong>敢<\/strong>把船开进别人不敢去的水域。<\/p>\n<h2>3.4 角色的五项属性<\/h2>\n<div class='tbl'><table><thead><tr><th>属性<\/th><th>管辖<\/th><th>典型检定<\/th><\/tr><\/thead><tbody><tr><td><strong>筋骨（MGT）<\/strong><\/td><td>力量、耐力、健壮<\/td><td>攀索、撞门、扛伤、划桨、憋气<\/td><\/tr><tr><td><strong>机敏（FIN）<\/strong><\/td><td>灵巧、速度、手稳<\/td><td>操帆、攀爬、瞄准、开锁、躲闪<\/td><\/tr><tr><td><strong>学识（WIT）<\/strong><\/td><td>智力、记忆、推理<\/td><td>导航、炮术计算、识图、医术、语言学<\/td><\/tr><tr><td><strong>胆魄（GRT）<\/strong><\/td><td>意志、勇气、冷静<\/td><td>抵抗恐惧、忍受痛苦、坚持掌舵、施压<\/td><\/tr><tr><td><strong>人望（PRE）<\/strong><\/td><td>魅力、威仪、共情<\/td><td>领导、交涉、欺骗、表演、招募<\/td><\/tr><\/tbody><\/table><\/div>\n<p>属性值 1–5：<\/p>\n<ul class='mdlist'><li>1 虚弱/笨拙（老学究的筋骨）<\/li><li>2 平常（世界上的大多数人）<\/li><li>3 出众（职业水手/老兵）<\/li><li>4 卓越（一方好手）<\/li><li>5 极限（传说级）<\/li><\/ul>\n<p>属性修正直接加在检定上，无另外的\"调整值\"换算——<strong>属性值就是加值<\/strong>。<\/p>\n<blockquote class='quote'><strong>【变体·七属性】<\/strong> 想要更细的分化可拆分出\"敏捷/灵巧\"与\"感知/直觉\"，但会增加约两成的判定复杂度。默认五属性是刻意取舍。<\/blockquote>\n<h2>3.5 技能总表（预览）<\/h2>\n<p>本表是<strong>摘要<\/strong>，逐条定义、示例难度与专长分支见第5章定稿总表（33 项主干＋1 项条件开放）。技能按域分类：<\/p>\n<div class='tbl'><table><thead><tr><th>域<\/th><th>技能<\/th><\/tr><\/thead><tbody><tr><td>航海<\/td><td>导航、操帆、掌舵、海图绘制、气象、游泳<\/td><\/tr><tr><td>战斗<\/td><td>剑术、火器、炮术、投掷、格斗<\/td><\/tr><tr><td>社交<\/td><td>交涉、交易、欺骗、威吓、领导、表演<\/td><\/tr><tr><td>学识<\/td><td>医术、博物学、史学、律法、工程、语言学<\/td><\/tr><tr><td>生存<\/td><td>生存、追踪、驯畜、烹调、渔猎<\/td><\/tr><tr><td>手艺<\/td><td>木工、铁匠、缝纫、制药、绘图<\/td><\/tr><\/tbody><\/table><\/div>\n<p>技能等级 0–5：0未受训 / 1学徒 / 2熟手 / 3行家 / 4专家 / 5大师。<strong>3级是职业水手的合格线，5级全海域屈指可数。<\/strong><\/p>\n<h2>3.6 时间尺度<\/h2>\n<div class='tbl'><table><thead><tr><th>尺度<\/th><th>时长<\/th><th>用于<\/th><\/tr><\/thead><tbody><tr><td><strong>动作<\/strong><\/td><td>数秒<\/td><td>战斗轮内的单个行动<\/td><\/tr><tr><td><strong>战斗轮<\/strong><\/td><td>≈6秒<\/td><td>个人战斗（第9章）<\/td><\/tr><tr><td><strong>海战轮<\/strong><\/td><td>≈1分钟<\/td><td>舰船机动与炮击（第9章）<\/td><\/tr><tr><td><strong>航段（Watch）<\/strong><\/td><td>4小时，一昼夜6段<\/td><td>航行、守夜、船上活动（第7章）<\/td><\/tr><tr><td><strong>旅程<\/strong><\/td><td>按天/周<\/td><td>跨海航线（第7章航速表）<\/td><\/tr><tr><td><strong>停泊<\/strong><\/td><td>按天<\/td><td>港口活动、修理、贸易（第10章）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>守夜与疲劳<\/strong>：每昼夜6段中，角色通常值2段、休4段。值勤超过4段或连续熬夜，进入<strong>疲劳1级<\/strong>（所有检定劣势）；叠加至疲劳3级时强制昏睡。详见第7.6节。<\/p>\n<h2>3.7 生命、伤害与死亡<\/h2>\n<h3>生命值（HP）<\/h3>\n<p><strong>HP = 6 + 筋骨×2<\/strong>（1级、筋骨3的角色 = 12 HP）<br>轻伤（≤2点）不改变状态；中等伤记录并扣减；HP归零见下。<\/p>\n<h3>伤害类型<\/h3>\n<div class='tbl'><table><thead><tr><th>类型<\/th><th>来源<\/th><th>特殊规则<\/th><\/tr><\/thead><tbody><tr><td><strong>利刃<\/strong><\/td><td>刀剑、箭矢<\/td><td>可被护甲减免<\/td><\/tr><tr><td><strong>钝击<\/strong><\/td><td>棍棒、坠落、撞击<\/td><td>护甲减半减免；造成更多眩晕<\/td><\/tr><tr><td><strong>火器<\/strong><\/td><td>枪炮<\/td><td>近距离无视1点护甲（详见第9章）<\/td><\/tr><tr><td><strong>烧伤<\/strong><\/td><td>火药、燃烧的船<\/td><td>持续：未扑灭则每轮再受1点<\/td><\/tr><tr><td><strong>环境<\/strong><\/td><td>饥渴、寒冷、疾病<\/td><td>不经战斗处理；影响逐级累积（第7章）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>倒地、濒死与死亡<\/h3>\n<ul class='mdlist'><li>HP <strong>归零<\/strong>：你<strong>倒地<\/strong>，进入濒死。不是死亡。<\/li><li><strong>濒死<\/strong>：每轮在你的回合掷<strong>死亡骰<\/strong>（d20）：<ul class='sub'><li>≥10：伤势稳定，本轮不再恶化；<\/li><li>&lt;10：<strong>失败1次<\/strong>；<\/li><li>自然1：直接失败2次。<\/li><\/ul><\/li><li>累计<strong>3次失败 → 死亡<\/strong>；累计3次成功 → 伤势稳固，脱离濒死（HP仍为0，需休养）。<\/li><li>任何人可用1个动作施救（医术检定，DV13），成功即视为一次死亡骰成功并让稳固进度+1。<\/li><li><strong>潮汐点\"抓牢船舷\"<\/strong>可在濒死任何时刻使用。<\/li><li>HP在0至负最大值之间的\"负伤记忆\"：复原后GM可要求你记录一个<strong>伤疤<\/strong>（永久小代价，如\"左耳失聪\"\"阴雨天旧伤作痛——雨天攀爬检定劣势\"）。伤疤是故事资产，不是数值惩罚堆叠。<\/li><\/ul>\n<h3>恢复<\/h3>\n<div class='tbl'><table><thead><tr><th>手段<\/th><th>恢复量<\/th><\/tr><\/thead><tbody><tr><td>短休（1航段安静休息）<\/td><td>等于 筋骨 的HP；每天一次<\/td><\/tr><tr><td>长休（回港/安全营地一昼夜）<\/td><td>全部HP<\/td><\/tr><tr><td>医术照护（船医每昼夜每人一次）<\/td><td>额外 +2 HP，或移除1级疲劳<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>3.8 载具与群体的粗规则（预告）<\/h2>\n<p>第7、9章完整展开，此处只立原则：<\/p>\n<ul class='mdlist'><li><strong>船是角色<\/strong>：船有<strong>船体值（Hull）<\/strong>、<strong>帆况<\/strong>、<strong>炮位<\/strong>、<strong>吃水<\/strong>与<strong>船员士气<\/strong>。船体归零=沉没或瘫痪，不是\"船死了\"而是\"所有人面临死亡\"。<\/li><li><strong>船员是资源也是人<\/strong>：全船水手作为一个整体有<strong>士气值<\/strong>。士气归零触发哗变判定。个别具名船员（大副、厨子、那个总是唱歌的少年）用简化个人卡，会死，死了有人哭。<\/li><li><strong>玩家分工即战术<\/strong>：海战中每个PC占用一个<strong>战位<\/strong>（掌舵、炮组、帆组、瞭望、跳帮队），战位规则见第9.4节。<\/li><\/ul>\n<h2>3.9 经验与成长<\/h2>\n<p>本书采用<strong>里程碑制<\/strong>，不给击杀计分：<\/p>\n<ol class='mdlist'><li>每次完整冒险（无论成败）结束，GM按下列标准授予XP：<ul class='sub'><li>参与并推动了故事：<strong>1 XP<\/strong>（保底）<\/li><li>达成了主要目标：<strong>+1 XP<\/strong><\/li><li>卓越的扮演/解决了本可以打死解决的死结/发现了海图上没有的东西：<strong>+1 XP<\/strong>（每项至多1次）<\/li><\/ul><\/li><li><strong>升级消耗<\/strong>：2级起，升一级需 <strong>3 XP<\/strong>；9级后每级 <strong>4 XP<\/strong>。等级上限10。<\/li><li>升级收益（按等级顺序自选，具体见第4.8节）：<ol class='sub'><li>技能+1（至多5）<\/li><li>属性+1（至多5）<\/li><li>新天赋（第4.7节天赋表）<\/li><li>HP上限+3 并当前HP+3<\/li><li>新技能（从0到1）<\/li><\/ol><\/li><\/ol>\n<blockquote class='quote'><strong>【设计注】<\/strong> 里程碑制配合航海叙事：GM不必为\"路上杀了多少海盗\"平衡遭遇，玩家也不必为了升级刷怪。海图上未探索的坐标，就是最好的经验值。<\/blockquote>\n<h2>3.10 GM的基本裁判流程<\/h2>\n<ol class='mdlist'><li>玩家宣布行动 →<\/li><li>自问三件事：<strong>存疑吗？重要吗？用什么属性+技能？<\/strong> →<\/li><li>定DV（查3.2表，环境修正）→<\/li><li>定优势/劣势 →<\/li><li>掷骰，看成功等级 →<\/li><li>失败时，从\"代价/复杂化/信息\"里选一种落地。<\/li><\/ol>\n<p><strong>永远先说后果再掷骰<\/strong>是本书推荐的GM习惯：\"你可以试着跳过去，但失败会落进涨潮的海沟。掷吧。\"玩家在知情下掷骰，失败就没有争议。<\/p>\n<hr>\n<p><em>下一章：把这些规则压成20分钟能跑通的一小局——四名船员、一艘快船、一场暴风。<\/em><\/p>","text":"规则的目标只有一个：当你掷下骰子，海洋的回应是可信的。 本章定义全书唯一的判定引擎。第7–11章的所有子系统（航海、海战、贸易、超自然）都是这台引擎的插件，不引入新的基本骰法。 3.1 六个基本概念 检定（Check） ：行动成败存疑且后果重要时，掷骰判定。 属性（Attribute） ：角色的五项天赋，值域 1–5，普通人为2。 技能（Skill） ：角色的受训领域，值域 0–5。0=未受训。 DV（难度等级） ：检定成功所需的数值。 优势/劣势 ：条件修正，掷2d20取高或取低。 潮汐点（Tide） ：玩家的命运资源，可以对抗坏骰运。 3.2 检定 检定公式：d20 + 相关属性 + 相关技能 ≥ DV → 成功 何时需要检定 同时满足两个条件才掷骰： 成败存疑 ——有真实的失败可能； 后果重要 ——失败会改变局面、付出代价或关闭选项。 走过跳板、在港口酒馆问路，不需要检定。顶着横浪跳上敌舰甲板、在酒馆里打探总督的私生子，需要。 【示例】 玩家：\"我想在暴风中爬上桅杆砍断纠缠的帆索。\" GM：成功存疑、失败会摔伤并耽误船头转向——掷骰。机敏+操帆，DV16（困难：暴风雨+高空）。掷出14+3+3=20，成功。 难度等级 DV 难度 基准示例 10 简单 平静海面系缆；向友善港民问路 13 普通 侧风操帆转向；与市侩商人讨价还价 16 困难 暴风中抢修帆桁；审出撒谎者的真话 19 极难 无星雨夜天文定位；格挡火枪齐射 22 传奇 十二尺巨浪中掌舵穿浪眼；说服总督抗命开港 环境、工具、时间都会移动难度：有海图与六分仪的天文定位从极难降为困难；徒手从极难升为近乎不可能。 成功等级 检定结果超出DV的程度决定成功的 质量 ： 结果 等级 含义 ≥ DV+10 卓越 成功且额外获益（GM给一条额外信息/一个战术机会/一份额外战利品） ≥ DV+5 良好 成功且有小幅增益（更快、更干净、无人察觉等） ≥ DV 成功 如愿以偿 &lt; DV 失败 行动落空，并出现 新的麻烦 （见下） &lt; DV−5 惨败 失败且额外受损（受伤、暴露、损失装备、士气下降） 失败铁律：失败永远要改变局面。 不允许\"什么都没发生\"。失败的形式由GM从三个方向选： 代价 （损失时间/资源/血）、 复杂化 （引来注意/制造新威胁）、 信息 （失败让角色意识到此路不通，且知道为什么）。 优势与劣势 场景条件对行动 有利 → 优势 ：掷两个d20取高。 场景条件对行动 不利 → 劣势 ：掷两个d20取低。 多个优势/劣势条件 不叠加 ，各自只算一次；一优一劣则 相互抵消 ，掷单骰。 典型优势：居高临下、目标措手不及、有专业工具、有充足时间、有协助者。 典型劣势：雨雾遮目、负伤疼痛、匆忙、拙劣工具、极度疲劳。 对抗检定 双方各掷一次（d20+属性+技能）， 高者胜 ；平局对防守方/现状有利。适用于潜行 vs 侦察、欺骗 vs 洞察、追逃 vs 追捕等。 协助与团队检定 协助 ：一名同伴描述如何帮忙，并掷一项相关检定（DV10）。成功，主行动者获得 优势 ；失败无额外惩罚。同一检定最多一人协助。 团队检定 ：全员各掷， 半数以上成功则全队成功 ；用于划桨接力、全船抢修、丛林行军等集体行动。 未受训限制 技能为0时，你可以掷 d20+属性 做该技能的 基础动作 ，但 专业动作必须受训 ：没有炮术技能不能指挥齐射，没有医术不能做手术，没有导航不能测天定位。 【变体·严酷航行】 全部未受训练定改为劣势。适合想突出\"外行下海就是会死\"的历史写实战役。 3.3 潮汐点（Tide） 每个角色拥有 3点潮汐点 ，代表好运气、老天的眷顾与水手的直觉。在下列时机花1点： 用途 效果 重掷 重掷自己任何一次掷骰（必须用新结果）；也可重掷一名敌人对你的一次攻击骰 灌风 在你任何一次掷骰 结果显示后 +5 浪里翻身 把一次失败改写为 成功但引入新麻烦 ——你达成了目的，GM同时让一个新问题浮现（帆裂了、追兵出现了、同伴看见了不该看的） 抓牢船舷 将一次足以使你倒地的伤害减半，或从濒死状态立刻恢复1点HP并稳固 恢复 ：返回友好港口休整时恢复全部；在海上长休（连续两个完整航段休息）恢复1点。 上限 ：除专长外不超过3点。 设计意图 ：潮汐点奖励冒险而非保险——\"浪里翻身\"和\"抓牢船舷\"的存在，让玩家 敢 把船开进别人不敢去的水域。 3.4 角色的五项属性 属性 管辖 典型检定 筋骨（MGT） 力量、耐力、健壮 攀索、撞门、扛伤、划桨、憋气 机敏（FIN） 灵巧、速度、手稳 操帆、攀爬、瞄准、开锁、躲闪 学识（WIT） 智力、记忆、推理 导航、炮术计算、识图、医术、语言学 胆魄（GRT） 意志、勇气、冷静 抵抗恐惧、忍受痛苦、坚持掌舵、施压 人望（PRE） 魅力、威仪、共情 领导、交涉、欺骗、表演、招募 属性值 1–5： 1 虚弱/笨拙（老学究的筋骨） 2 平常（世界上的大多数人） 3 出众（职业水手/老兵） 4 卓越（一方好手） 5 极限（传说级） 属性修正直接加在检定上，无另外的\"调整值\"换算—— 属性值就是加值 。 【变体·七属性】 想要更细的分化可拆分出\"敏捷/灵巧\"与\"感知/直觉\"，但会增加约两成的判定复杂度。默认五属性是刻意取舍。 3.5 技能总表（预览） 本表是 摘要 ，逐条定义、示例难度与专长分支见第5章定稿总表（33 项主干＋1 项条件开放）。技能按域分类： 域 技能 航海 导航、操帆、掌舵、海图绘制、气象、游泳 战斗 剑术、火器、炮术、投掷、格斗 社交 交涉、交易、欺骗、威吓、领导、表演 学识 医术、博物学、史学、律法、工程、语言学 生存 生存、追踪、驯畜、烹调、渔猎 手艺 木工、铁匠、缝纫、制药、绘图 技能等级 0–5：0未受训 / 1学徒 / 2熟手 / 3行家 / 4专家 / 5大师。 3级是职业水手的合格线，5级全海域屈指可数。 3.6 时间尺度 尺度 时长 用于 动作 数秒 战斗轮内的单个行动 战斗轮 ≈6秒 个人战斗（第9章） 海战轮 ≈1分钟 舰船机动与炮击（第9章） 航段（Watch） 4小时，一昼夜6段 航行、守夜、船上活动（第7章） 旅程 按天/周 跨海航线（第7章航速表） 停泊 按天 港口活动、修理、贸易（第10章） 守夜与疲劳 ：每昼夜6段中，角色通常值2段、休4段。值勤超过4段或连续熬夜，进入 疲劳1级 （所有检定劣势）；叠加至疲劳3级时强制昏睡。详见第7.6节。 3.7 生命、伤害与死亡 生命值（HP） HP = 6 + 筋骨×2 （1级、筋骨3的角色 = 12 HP） 轻伤（≤2点）不改变状态；中等伤记录并扣减；HP归零见下。 伤害类型 类型 来源 特殊规则 利刃 刀剑、箭矢 可被护甲减免 钝击 棍棒、坠落、撞击 护甲减半减免；造成更多眩晕 火器 枪炮 近距离无视1点护甲（详见第9章） 烧伤 火药、燃烧的船 持续：未扑灭则每轮再受1点 环境 饥渴、寒冷、疾病 不经战斗处理；影响逐级累积（第7章） 倒地、濒死与死亡 HP 归零 ：你 倒地 ，进入濒死。不是死亡。 濒死 ：每轮在你的回合掷 死亡骰 （d20）： ≥10：伤势稳定，本轮不再恶化； &lt;10： 失败1次 ； 自然1：直接失败2次。 累计 3次失败 → 死亡 ；累计3次成功 → 伤势稳固，脱离濒死（HP仍为0，需休养）。 任何人可用1个动作施救（医术检定，DV13），成功即视为一次死亡骰成功并让稳固进度+1。 潮汐点\"抓牢船舷\" 可在濒死任何时刻使用。 HP在0至负最大值之间的\"负伤记忆\"：复原后GM可要求你记录一个 伤疤 （永久小代价，如\"左耳失聪\"\"阴雨天旧伤作痛——雨天攀爬检定劣势\"）。伤疤是故事资产，不是数值惩罚堆叠。 恢复 手段 恢复量 短休（1航段安静休息） 等于 筋骨 的HP；每天一次 长休（回港/安全营地一昼夜） 全部HP 医术照护（船医每昼夜每人一次） 额外 +2 HP，或移除1级疲劳 3.8 载具与群体的粗规则（预告） 第7、9章完整展开，此处只立原则： 船是角色 ：船有 船体值（Hull） 、 帆况 、 炮位 、 吃水 与 船员士气 。船体归零=沉没或瘫痪，不是\"船死了\"而是\"所有人面临死亡\"。 船员是资源也是人 ：全船水手作为一个整体有 士气值 。士气归零触发哗变判定。个别具名船员（大副、厨子、那个总是唱歌的少年）用简化个人卡，会死，死了有人哭。 玩家分工即战术 ：海战中每个PC占用一个 战位 （掌舵、炮组、帆组、瞭望、跳帮队），战位规则见第9.4节。 3.9 经验与成长 本书采用 里程碑制 ，不给击杀计分： 每次完整冒险（无论成败）结束，GM按下列标准授予XP： 参与并推动了故事： 1 XP （保底） 达成了主要目标： +1 XP 卓越的扮演/解决了本可以打死解决的死结/发现了海图上没有的东西： +1 XP （每项至多1次） 升级消耗 ：2级起，升一级需 3 XP ；9级后每级 4 XP 。等级上限10。 升级收益（按等级顺序自选，具体见第4.8节）： 技能+1（至多5） 属性+1（至多5） 新天赋（第4.7节天赋表） HP上限+3 并当前HP+3 新技能（从0到1） 【设计注】 里程碑制配合航海叙事：GM不必为\"路上杀了多少海盗\"平衡遭遇，玩家也不必为了升级刷怪。海图上未探索的坐标，就是最好的经验值。 3.10 GM的基本裁判流程 玩家宣布行动 → 自问三件事： 存疑吗？重要吗？用什么属性+技能？ → 定DV（查3.2表，环境修正）→ 定优势/劣势 → 掷骰，看成功等级 → 失败时，从\"代价/复杂化/信息\"里选一种落地。 永远先说后果再掷骰 是本书推荐的GM习惯：\"你可以试着跳过去，但失败会落进涨潮的海沟。掷吧。\"玩家在知情下掷骰，失败就没有争议。 下一章：把这些规则压成20分钟能跑通的一小局——四名船员、一艘快船、一场暴风。"},{"num":"04","title":"角色创建","vol":"卷一 · 玩家入门区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>每个人都曾是可以留在陆地上的人。他们没有。<\/em><\/blockquote>\n<p>按本章六个步骤建出一名完整角色，约需 20–30 分钟。嫌麻烦？直接用第2章的预生成角色。<\/p>\n<hr>\n<h2>4.0 创建流程总览<\/h2>\n<ol class='mdlist'><li><strong>概念<\/strong>：一句话说出这人是谁、为何上船。<\/li><li><strong>出身<\/strong>：从哪里来（决定语言、初始技能、社会处境）。<\/li><li><strong>属性<\/strong>：分配五项属性值。<\/li><li><strong>职业原型<\/strong>：你在船上的位置（决定本职技能与职业特性）。<\/li><li><strong>技能与天赋<\/strong>：细化你能做什么。<\/li><li><strong>装备、关系与目标<\/strong>：你带着什么上船、欠着谁、图什么。<\/li><\/ol>\n<hr>\n<h2>4.1 概念<\/h2>\n<p>先写一句话：\"一个为了追查兄长死因而伪装成水手的贵族私生子。\"<br>这句话就是你的角色锚。创建中每一个选择都应该服务或对照它。<br>GM可要求你同时回答：<strong>你为什么在这条船上？你离开陆地时没带走什么？<\/strong><\/p>\n<h2>4.2 出身（Origin）<\/h2>\n<p>出身给：<strong>+1 指定属性<\/strong>、<strong>2项受训技能（1级）<\/strong>、<strong>1门语言<\/strong>、<strong>1件出身装备<\/strong>、<strong>1个出身特性<\/strong>。选择你的来处：<\/p>\n<div class='tbl'><table><thead><tr><th>出身<\/th><th>+1属性<\/th><th>受训技能<\/th><th>语言<\/th><th>出身装备<\/th><th>出身特性<\/th><\/tr><\/thead><tbody><tr><td><strong>伊比利亚港口区<\/strong><\/td><td>人望<\/td><td>交涉、火器<\/td><td>卡斯蒂利亚语/葡萄牙语<\/td><td>家传银十字（可典当20银币）<\/td><td><strong>教会的影子<\/strong>：与神职人员交涉检定+优势；异端审判庭也可能认识你<\/td><\/tr><tr><td><strong>北海联合省<\/strong><\/td><td>学识<\/td><td>交易、海图绘制<\/td><td>荷兰语、贸易通用语<\/td><td>一册手抄账本<\/td><td><strong>算盘心<\/strong>：估算货物价值永远成功；交易检定可重掷1次/次停泊<\/td><\/tr><tr><td><strong>英吉利海岸<\/strong><\/td><td>胆魄<\/td><td>炮术、游泳<\/td><td>英语<\/td><td>猎刀（利刃1d6）<\/td><td><strong>私掠传统<\/strong>：持国书时对敌国财产的\"掠夺\"判定+优势<\/td><\/tr><tr><td><strong>地中海岛民<\/strong><\/td><td>机敏<\/td><td>游泳、操帆<\/td><td>意大利语/希腊语<\/td><td>短弯刀（利刃1d6）<\/td><td><strong>盐里泡大<\/strong>：溺水与水中检定永远视为受训；晕船免疫<\/td><\/tr><tr><td><strong>帝国边地<\/strong><\/td><td>筋骨<\/td><td>生存、格斗<\/td><td>本地语、粗通贸易通用语<\/td><td>毛皮斗篷（寒夜不劣化）<\/td><td><strong>苦出身<\/strong>：饥饿、寒冷、疲劳的抗性检定+优势<\/td><\/tr><tr><td><strong>书院学徒<\/strong><\/td><td>学识<\/td><td>史学或博物学（择一）、语言学<\/td><td>拉丁语、贸易通用语<\/td><td>蜡封信件与介绍信<\/td><td><strong>故纸堆<\/strong>：翻查文献获取信息时，失败可改写为\"找到线索但需要时间\"<\/td><\/tr><tr><td><strong>甲板上的孤儿<\/strong><\/td><td>机敏<\/td><td>攀索（操帆）、格斗<\/td><td>水手黑话<\/td><td>一枚不属于你的黄铜纽扣<\/td><td><strong>船上长大<\/strong>：在任意船上进行平衡、攀爬、钻行检定+优势<\/td><\/tr><tr><td><strong>异乡来客<\/strong><\/td><td>胆魄<\/td><td>表演、生存<\/td><td>你的母语、生涩的贸易通用语<\/td><td>神秘的护符（GM秘密定义）<\/td><td><strong>说书人<\/strong>：用离奇身世转移注意力的欺骗检定+优势<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【历史注】<\/strong> 16世纪的\"贸易通用语\"（Lingua Franca）是以意大利语为骨架混入西班牙、法、阿拉伯语的地中海混合语，是本书默认的\"海上普通话\"。<\/blockquote>\n<h2>4.3 属性<\/h2>\n<p>五项属性（见3.4节）：<strong>筋骨、机敏、学识、胆魄、人望<\/strong>。<\/p>\n<p>分配以下数组之一（然后把出身给的+1加上去）：<\/p>\n<ul class='mdlist'><li><strong>专精型<\/strong>：4 / 3 / 3 / 2 / 1 —— 极端的人，长处极长、短处极短<\/li><li><strong>职业型<\/strong>：3 / 3 / 3 / 3 / 2 —— 稳健的职业者<\/li><li><strong>均衡型<\/strong>：3 / 3 / 2 / 2 / 2 —— 没有死穴，也没有王牌<\/li><\/ul>\n<p>属性值就是检定加值。1级角色上限4，成长上限5。<\/p>\n<h2>4.4 职业原型（Archetype）<\/h2>\n<p>原型不是阶级枷锁，而是\"你在船上领哪份工钱\"。每个原型给：<strong>3项本职技能各1级<\/strong>、<strong>1个职业特性<\/strong>、<strong>1套起始装备包<\/strong>。<\/p>\n<div class='tbl'><table><thead><tr><th>原型<\/th><th>本职技能<\/th><th>职业特性<\/th><\/tr><\/thead><tbody><tr><td><strong>船长<\/strong><\/td><td>领导、掌舵、交涉<\/td><td><strong>我说的算<\/strong>：一次战斗/海战/危机中，可命令一名同伴获得优势（每次场景1次）；全船士气检定+2<\/td><\/tr><tr><td><strong>领航员<\/strong><\/td><td>导航、海图绘制、气象<\/td><td><strong>心中的罗盘<\/strong>：即使没有仪器，迷航判定不劣化；一次旅程中可把一次导航失败改写为\"偏航但发现了新东西\"<\/td><\/tr><tr><td><strong>炮长<\/strong><\/td><td>炮术、工程、领导<\/td><td><strong>听我口令<\/strong>：你指挥的炮组齐射可等待你的信号，一次齐射全员取优（每场海战1次）<\/td><\/tr><tr><td><strong>船医<\/strong><\/td><td>医术、博物学、生存<\/td><td><strong>按住他<\/strong>：你的急救与手术成功等级+1级；濒死同伴的死亡骰由你代掷<\/td><\/tr><tr><td><strong>剑客<\/strong><\/td><td>剑术、格斗、表演<\/td><td><strong>招牌绝技<\/strong>：自创一个招式（如\"断缆回身斩\"），每场战斗1次，命中后附加一个效果<\/td><\/tr><tr><td><strong>火枪手<\/strong><\/td><td>火器、潜行、生存<\/td><td><strong>第一滴血<\/strong>：战斗第一轮你的射击+2伤害；装填时可与移动合并<\/td><\/tr><tr><td><strong>商人<\/strong><\/td><td>交易、交涉、律法<\/td><td><strong>人脉即资本<\/strong>：在任一港口自动认识一个能牵线的人；走私被查获时首次可贿赂脱身<\/td><\/tr><tr><td><strong>学者<\/strong><\/td><td>史学、语言学、博物学<\/td><td><strong>我知道这个<\/strong>：见闻检定（辨识文物、语言、传说）失败后，仍可获得部分信息<\/td><\/tr><tr><td><strong>掠私者<\/strong><\/td><td>剑术、火器、威吓<\/td><td><strong>免死金牌<\/strong>：持有私掠许可证期间，在颁发国的港口不因掠夺行为增加恶名<\/td><\/tr><tr><td><strong>怪力水手<\/strong><\/td><td>操帆、格斗、游泳<\/td><td><strong>半个桅杆<\/strong>：攀索速度翻倍；你协助操帆时船获得小幅机动增益<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>多原型<\/strong>：1级只选一个。升级时可\"转职\"——补齐新原型的3项本职技能即视为兼任。<\/p>\n<h2>4.5 技能<\/h2>\n<p>在出身+原型给你的技能之外，再受训 <strong>2项任意技能（1级）<\/strong>。<br>技能总表见3.5节，逐条定义见第5章。<br>建议至少一人有<strong>导航<\/strong>、一人有<strong>医术<\/strong>——没有这两样的船，GM的随机遭遇表会变得非常残酷。<\/p>\n<h2>4.6 天赋（Feat）<\/h2>\n<p>选择 <strong>1项1级天赋<\/strong>。天赋是不可被剥夺的身份性能力：<\/p>\n<div class='tbl'><table><thead><tr><th>天赋<\/th><th>效果<\/th><\/tr><\/thead><tbody><tr><td><strong>老海狼<\/strong><\/td><td>气象检定自动成功（普通海况）；暴风中的航海检定劣势移除<\/td><\/tr><tr><td><strong>海图记忆<\/strong><\/td><td>走过的航线可凭记忆重航；海图绘制检定+2<\/td><\/tr><tr><td><strong>炮术大师<\/strong><\/td><td>你计算的射击诸元使炮击检定+1<\/td><\/tr><tr><td><strong>幸运之星<\/strong><\/td><td>潮汐点上限4（而不是3）<\/td><\/tr><tr><td><strong>语言天才<\/strong><\/td><td>额外3门语言；可努力\"够懂\"生僻语言进行基础交流<\/td><\/tr><tr><td><strong>冷酷船长<\/strong><\/td><td>威吓检定+2；哗变判定中你个人威慑+3<\/td><\/tr><tr><td><strong>铁胃<\/strong><\/td><td>中毒与腐坏食物的抗性检定自动成功<\/td><\/tr><tr><td><strong>刀口舔血<\/strong><\/td><td>HP上限+3；濒死时死亡骰≥8即算稳定<\/td><\/tr><tr><td><strong>巧手<\/strong><\/td><td>开锁、扒窃、藏匿物品检定+2<\/td><\/tr><tr><td><strong>圣痕<\/strong>（可选，需启用第11章）<\/td><td>对超自然存在的恐惧检定+优势<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4.7 装备与资金<\/h2>\n<p>起始装备 = 出身装备 + 原型装备包 + <strong>20银币<\/strong>。<\/p>\n<p><strong>原型装备包<\/strong>（择一随原型）：<\/p>\n<ul class='mdlist'><li>船长：细呢外套、黄铜罗盘、信号旗、佩剑（利刃1d8）<\/li><li>领航员：星盘、象限仪、全套海图具、日志<\/li><li>炮长：火药号角、测距绳、点火棍、短铳（火器2d6，射程10）<\/li><li>船医：手术器械包、药草箱、止血带、断肢锯（看着就疼）<\/li><li>剑客/掠私者：制式佩剑（利刃1d8）、皮甲（护甲1）、匕首（利刃1d4）<\/li><li>火枪手：火绳枪（火器2d8，射程30，装填2轮）、弹药角、皮甲<\/li><li>商人：样货箱、秤与砝码、印章、账册<\/li><li>学者：书籍三册、墨水纸笔、放大镜<\/li><li>水手：水手刀（利刃1d6）、索具钩、油布、一罐腌肉<\/li><\/ul>\n<p>武器数值预览（完整表见第6章）：利刃/钝击骰、火器骰与射程、护甲减免值。<strong>火器伤害高、装填慢<\/strong>是本书刻意的节奏设计。<\/p>\n<h2>4.8 关系与目标（本作的角色灵魂）<\/h2>\n<p>创建角色时，写下并交给GM：<\/p>\n<ol class='mdlist'><li><strong>一条羁绊<\/strong>：一个具体的人（恩人/债主/爱人/仇敌），和你们之间的一件事。<\/li><li><strong>一个目标<\/strong>：明确、可推进、最好有点不自量力。例：\"赎回被典当的家族船契\"\"把兄长的骨灰撒在他沉船的海域\"\"在死前画完整张南回归线海图\"。<\/li><li><strong>一个秘密<\/strong>：只有你和GM知道的一件事。GM可以在任意时刻把它变成剧情。<\/li><\/ol>\n<p><strong>升级时<\/strong>，除3.9节的成长选项外，你可以<strong>改写<\/strong>目标或秘密一次——人会在海上变。<\/p>\n<h2>4.9 快速角色卡模板<\/h2>\n<pre class='codeblock'><code>姓名：________    出身：________    原型：________\n等级：1    XP：0/3    潮汐点：3/3\n\n属性：筋骨__ 机敏__ 学识__ 胆魄__ 人望__\nHP：6+筋骨×2=____    护甲：____\n\n技能：________________________（等级）\n天赋：________________\n语言：________________\n\n武器：________ 伤害____ 射程____\n装备：________________________\n银币：20\n\n羁绊：________________\n目标：________________\n秘密（给GM）：________________<\/code><\/pre>\n<hr>\n<p><em>建好了？第2章的暴风雨正在逼近，四名船员里也许就有你。<\/em><\/p>","text":"每个人都曾是可以留在陆地上的人。他们没有。 按本章六个步骤建出一名完整角色，约需 20–30 分钟。嫌麻烦？直接用第2章的预生成角色。 4.0 创建流程总览 概念 ：一句话说出这人是谁、为何上船。 出身 ：从哪里来（决定语言、初始技能、社会处境）。 属性 ：分配五项属性值。 职业原型 ：你在船上的位置（决定本职技能与职业特性）。 技能与天赋 ：细化你能做什么。 装备、关系与目标 ：你带着什么上船、欠着谁、图什么。 4.1 概念 先写一句话：\"一个为了追查兄长死因而伪装成水手的贵族私生子。\" 这句话就是你的角色锚。创建中每一个选择都应该服务或对照它。 GM可要求你同时回答： 你为什么在这条船上？你离开陆地时没带走什么？ 4.2 出身（Origin） 出身给： +1 指定属性 、 2项受训技能（1级） 、 1门语言 、 1件出身装备 、 1个出身特性 。选择你的来处： 出身 +1属性 受训技能 语言 出身装备 出身特性 伊比利亚港口区 人望 交涉、火器 卡斯蒂利亚语/葡萄牙语 家传银十字（可典当20银币） 教会的影子 ：与神职人员交涉检定+优势；异端审判庭也可能认识你 北海联合省 学识 交易、海图绘制 荷兰语、贸易通用语 一册手抄账本 算盘心 ：估算货物价值永远成功；交易检定可重掷1次/次停泊 英吉利海岸 胆魄 炮术、游泳 英语 猎刀（利刃1d6） 私掠传统 ：持国书时对敌国财产的\"掠夺\"判定+优势 地中海岛民 机敏 游泳、操帆 意大利语/希腊语 短弯刀（利刃1d6） 盐里泡大 ：溺水与水中检定永远视为受训；晕船免疫 帝国边地 筋骨 生存、格斗 本地语、粗通贸易通用语 毛皮斗篷（寒夜不劣化） 苦出身 ：饥饿、寒冷、疲劳的抗性检定+优势 书院学徒 学识 史学或博物学（择一）、语言学 拉丁语、贸易通用语 蜡封信件与介绍信 故纸堆 ：翻查文献获取信息时，失败可改写为\"找到线索但需要时间\" 甲板上的孤儿 机敏 攀索（操帆）、格斗 水手黑话 一枚不属于你的黄铜纽扣 船上长大 ：在任意船上进行平衡、攀爬、钻行检定+优势 异乡来客 胆魄 表演、生存 你的母语、生涩的贸易通用语 神秘的护符（GM秘密定义） 说书人 ：用离奇身世转移注意力的欺骗检定+优势 【历史注】 16世纪的\"贸易通用语\"（Lingua Franca）是以意大利语为骨架混入西班牙、法、阿拉伯语的地中海混合语，是本书默认的\"海上普通话\"。 4.3 属性 五项属性（见3.4节）： 筋骨、机敏、学识、胆魄、人望 。 分配以下数组之一（然后把出身给的+1加上去）： 专精型 ：4 / 3 / 3 / 2 / 1 —— 极端的人，长处极长、短处极短 职业型 ：3 / 3 / 3 / 3 / 2 —— 稳健的职业者 均衡型 ：3 / 3 / 2 / 2 / 2 —— 没有死穴，也没有王牌 属性值就是检定加值。1级角色上限4，成长上限5。 4.4 职业原型（Archetype） 原型不是阶级枷锁，而是\"你在船上领哪份工钱\"。每个原型给： 3项本职技能各1级 、 1个职业特性 、 1套起始装备包 。 原型 本职技能 职业特性 船长 领导、掌舵、交涉 我说的算 ：一次战斗/海战/危机中，可命令一名同伴获得优势（每次场景1次）；全船士气检定+2 领航员 导航、海图绘制、气象 心中的罗盘 ：即使没有仪器，迷航判定不劣化；一次旅程中可把一次导航失败改写为\"偏航但发现了新东西\" 炮长 炮术、工程、领导 听我口令 ：你指挥的炮组齐射可等待你的信号，一次齐射全员取优（每场海战1次） 船医 医术、博物学、生存 按住他 ：你的急救与手术成功等级+1级；濒死同伴的死亡骰由你代掷 剑客 剑术、格斗、表演 招牌绝技 ：自创一个招式（如\"断缆回身斩\"），每场战斗1次，命中后附加一个效果 火枪手 火器、潜行、生存 第一滴血 ：战斗第一轮你的射击+2伤害；装填时可与移动合并 商人 交易、交涉、律法 人脉即资本 ：在任一港口自动认识一个能牵线的人；走私被查获时首次可贿赂脱身 学者 史学、语言学、博物学 我知道这个 ：见闻检定（辨识文物、语言、传说）失败后，仍可获得部分信息 掠私者 剑术、火器、威吓 免死金牌 ：持有私掠许可证期间，在颁发国的港口不因掠夺行为增加恶名 怪力水手 操帆、格斗、游泳 半个桅杆 ：攀索速度翻倍；你协助操帆时船获得小幅机动增益 多原型 ：1级只选一个。升级时可\"转职\"——补齐新原型的3项本职技能即视为兼任。 4.5 技能 在出身+原型给你的技能之外，再受训 2项任意技能（1级） 。 技能总表见3.5节，逐条定义见第5章。 建议至少一人有 导航 、一人有 医术 ——没有这两样的船，GM的随机遭遇表会变得非常残酷。 4.6 天赋（Feat） 选择 1项1级天赋 。天赋是不可被剥夺的身份性能力： 天赋 效果 老海狼 气象检定自动成功（普通海况）；暴风中的航海检定劣势移除 海图记忆 走过的航线可凭记忆重航；海图绘制检定+2 炮术大师 你计算的射击诸元使炮击检定+1 幸运之星 潮汐点上限4（而不是3） 语言天才 额外3门语言；可努力\"够懂\"生僻语言进行基础交流 冷酷船长 威吓检定+2；哗变判定中你个人威慑+3 铁胃 中毒与腐坏食物的抗性检定自动成功 刀口舔血 HP上限+3；濒死时死亡骰≥8即算稳定 巧手 开锁、扒窃、藏匿物品检定+2 圣痕 （可选，需启用第11章） 对超自然存在的恐惧检定+优势 4.7 装备与资金 起始装备 = 出身装备 + 原型装备包 + 20银币 。 原型装备包 （择一随原型）： 船长：细呢外套、黄铜罗盘、信号旗、佩剑（利刃1d8） 领航员：星盘、象限仪、全套海图具、日志 炮长：火药号角、测距绳、点火棍、短铳（火器2d6，射程10） 船医：手术器械包、药草箱、止血带、断肢锯（看着就疼） 剑客/掠私者：制式佩剑（利刃1d8）、皮甲（护甲1）、匕首（利刃1d4） 火枪手：火绳枪（火器2d8，射程30，装填2轮）、弹药角、皮甲 商人：样货箱、秤与砝码、印章、账册 学者：书籍三册、墨水纸笔、放大镜 水手：水手刀（利刃1d6）、索具钩、油布、一罐腌肉 武器数值预览（完整表见第6章）：利刃/钝击骰、火器骰与射程、护甲减免值。 火器伤害高、装填慢 是本书刻意的节奏设计。 4.8 关系与目标（本作的角色灵魂） 创建角色时，写下并交给GM： 一条羁绊 ：一个具体的人（恩人/债主/爱人/仇敌），和你们之间的一件事。 一个目标 ：明确、可推进、最好有点不自量力。例：\"赎回被典当的家族船契\"\"把兄长的骨灰撒在他沉船的海域\"\"在死前画完整张南回归线海图\"。 一个秘密 ：只有你和GM知道的一件事。GM可以在任意时刻把它变成剧情。 升级时 ，除3.9节的成长选项外，你可以 改写 目标或秘密一次——人会在海上变。 4.9 快速角色卡模板 姓名：________ 出身：________ 原型：________ 等级：1 XP：0/3 潮汐点：3/3 属性：筋骨__ 机敏__ 学识__ 胆魄__ 人望__ HP：6+筋骨×2=____ 护甲：____ 技能：________________________（等级） 天赋：________________ 语言：________________ 武器：________ 伤害____ 射程____ 装备：________________________ 银币：20 羁绊：________________ 目标：________________ 秘密（给GM）：________________ 建好了？第2章的暴风雨正在逼近，四名船员里也许就有你。"},{"num":"05","title":"技能与专长详解","vol":"卷二 · 系统核心区","skeleton":false,"html":"<blockquote class='quote aside-voice'><em>技能不是你能掷几次骰，是你能问出哪些问题。<\/em><\/blockquote>\n<p>第3.5节给出的是<strong>预览清单<\/strong>。本章是<strong>定稿总表<\/strong>：三十三项主干技能，逐条给用途、默认属性、三档即查难度、失败落地与专长分支。<\/p>\n<p>依赖：3.2 检定 / 3.4 属性 / 4.2 出身 / 4.4 原型。<\/p>\n<hr>\n<h2>5.0 三条读法（先立规矩）<\/h2>\n<h3>① 关键线索永不投骰<\/h3>\n<p><strong>如果一条线索是剧情的唯一通路，它就不需要检定。<\/strong> 玩家说出正确的方法、走到正确的地方，GM 必须给出。<br>技能检定决定的是<strong>你能额外知道多少<\/strong>，不是<strong>你有没有资格知道<\/strong>。<\/p>\n<blockquote class='quote'>这条是全书调查类技能的总闸，优先级高于任何单条技能描述。理由很硬：一个长团的死法通常不是全灭，是在第一个港口因为一次失败的检定而再没有第二幕。<\/blockquote>\n<h3>② Let it Ride：同一段航程只掷一次<\/h3>\n<p>同一件事、同一个目标、同一个航段内，<strong>一次检定定终身<\/strong>。掷过了就不许换个技能再掷一遍。<br>想重掷？三条合法通路：<strong>改变条件<\/strong>（换方法／添工具／拉帮手）、<strong>付出代价<\/strong>（多花一个班次，或消耗潮汐点）、<strong>升级难度<\/strong>（GM 把 DV 降一档，同时给出新风险）。<\/p>\n<h3>③ 技能加的是\"专业动作\"的入场券<\/h3>\n<p>3.2 已经定了：<strong>未受训可以做基础动作，专业动作必须受训<\/strong>。本章把这条落到每项技能上——每项技能第一行都写着它的<strong>受训线<\/strong>。<\/p>\n<h3>术语归一（前四章用过的松散叫法对照）<\/h3>\n<p>第2、4、7章在描述出身与原型时用了几个口语化叫法。以下是正式对应，<strong>以本章为准<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>别处写法<\/th><th>定稿技能<\/th><\/tr><\/thead><tbody><tr><td>交易、经商、买卖<\/td><td><strong>交易<\/strong>（社交域，5.4）<\/td><\/tr><tr><td>攀索<\/td><td><strong>操帆<\/strong>（航海域，5.2）<\/td><\/tr><tr><td>航海（笼统）<\/td><td>按场合取 <strong>掌舵<\/strong>／<strong>导航<\/strong>／<strong>操帆<\/strong><\/td><\/tr><tr><td>航海（地中海岛民出身）<\/td><td><strong>操帆<\/strong><\/td><\/tr><tr><td>辨识文物、语言、传说（学者\"见闻检定\"）<\/td><td><strong>史学<\/strong>／<strong>语言学<\/strong>／<strong>博物学<\/strong><\/td><\/tr><tr><td>潜行<\/td><td><strong>生存<\/strong>（隐蔽子项，见5.6）<\/td><\/tr><tr><td>侦察、洞察<\/td><td><strong>博物学<\/strong>（对物）／<strong>交涉<\/strong>（对人，读人）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>【设计注·为什么补入\"交易\"】<\/strong> 3.5 预览表漏列了这项技能，但 4.2「北海联合省」出身、4.4「商人」原型、7.7 招募与第十章全章都在使用它。<strong>定稿总表补入 <code>交易<\/code>，归社交域<\/strong>——它是一项\"人对人谈价\"的技能，不是学识。3.5 视为本章摘要，冲突以本章为准。<\/blockquote>\n<hr>\n<h2>5.1 专长分支怎么运作<\/h2>\n<ol class='mdlist'><li><strong>门槛<\/strong>：该技能达到 <strong>4 级<\/strong>后，每次升级可择一分支解锁（不可用其他成长选项兑换）。<\/li><li><strong>效果形态只有两种<\/strong>（刻意限制，防止分支长成第二套动作系统）：<ol class='sub'><li><strong>特定情境 +2<\/strong>；<\/li><li><strong>移除某一种既定的劣势<\/strong>。<\/li><\/ol><\/li><li><strong>不做新动作、不改骰法、不加伤害骰。<\/strong> 想要新动作，去 4.6 选天赋。<\/li><li><strong>同一技能最多解锁 3 条分支<\/strong>；GM 与玩家可共同提名新分支，但必须先在本表登记才生效。<\/li><li>判据一句话：<strong>专长分支回答\"你在什么场合不会失手\"，不回答\"你还能做什么\"。<\/strong><\/li><\/ol>\n<hr>\n<h2>5.2 航海域（6 项）<\/h2>\n<h3>导航 WIT ｜ 受训线：测天定位、无图推算<\/h3>\n<p>决定你知道自己<strong>在哪里<\/strong>。每航段结算一次（7.6）。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>有海图、白天可见岸标<\/td><td>无海图沿岸推估<\/td><td>无星雨夜测天定位<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>失败落地<\/strong>：偏航 1d6×2 海里；连败两段＝迷航（7.6）。<br><strong>关键澄清<\/strong>：导航失败<strong>不会<\/strong>让你失去已有的海图信息（5.0①）——它只让你算错位置。<\/p>\n<p><strong>分支<\/strong>：<strong>天文学<\/strong>（移除\"无星夜\"这一项劣势）／<strong>推算航法<\/strong>（迷航状态下导航 +2）／<strong>潮流读法<\/strong>（河口、海峡、涨落潮水域 +2）<\/p>\n<hr>\n<h3>操帆 FIN ｜ 受训线：换帆档、海上修帆、抢风时的帆组配合<\/h3>\n<p>帆是发动机，也是最先坏的东西。（4.2 里的\"攀索\"归入本技能。）<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>平风中收一面前帆<\/td><td>暴风中抢修帆桁<\/td><td>顶风抢风时同步换主帆<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>失败落地<\/strong>：帆况降一档；或索具受击（9.5 部位表 2–3 条）。<br><strong>协助<\/strong>：操帆是最值得做团队检定的技能（7.3 排岗）。<\/p>\n<p><strong>分支<\/strong>：<strong>帆装修补<\/strong>（海上修帆 DV 视为低一档）／<strong>满帆驾驭<\/strong>（\"满帆\"档的索具额外伤害骰 −1）／<strong>抢风节拍<\/strong>（抢风时的掌舵检定 +2）<\/p>\n<hr>\n<h3>掌舵 MGT／FIN ｜ 受训线：急转、贴礁、海战机动<\/h3>\n<p><strong>默认筋骨<\/strong>（力量压住舵柄）；轻船与反应场合可改用机敏，GM 开局宣告。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>侧风保持航向<\/td><td>大风中急转抢位<\/td><td>十二尺浪里穿浪眼（22）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>失败落地<\/strong>：偏航、本轮速度归零、或撞（礁区见 7.10）。<br><strong>海战口径<\/strong>：机动与阵位见 9.3；追击里每轮限选一动作（9.7）。<\/p>\n<p><strong>分支<\/strong>：<strong>上风夺取<\/strong>（\"抢上风\"号令每场可喊两次）／<strong>浅水直觉<\/strong>（吃水检定 +2）／<strong>夜舵<\/strong>（移除\"夜战\"对机动的一项劣势）<\/p>\n<hr>\n<h3>海图绘制 WIT ｜ 受训线：把发现的海岸线变成可交易的成果<\/h3>\n<p><strong>探索与经济打通的那一环<\/strong>（8.7、10.3）。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>描摹已见的港湾轮廓<\/td><td>补测水深与礁位<\/td><td>在摇晃的船上仅凭目测画出一段海岸<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>成果可交易<\/strong>：一张合格新海图售予制图师行会 = <strong>40–200 银币<\/strong>（10.1 行情骰决定，取决于这片海有多值得去）。<br><strong>失败落地<\/strong>：图画错了——<strong>下次沿用它航行时导航 DV +3<\/strong>（错误的地图比没有地图更危险）。<\/p>\n<p><strong>分支<\/strong>：<strong>水深标注<\/strong>（凡你绘出的浅点，后续\"贴礁走位\" DV −2）／<strong>抄本生意<\/strong>（卖图时行情骰 +1 档）／<strong>速写<\/strong>（一个航段内即可完成，无需额外时间）<\/p>\n<hr>\n<h3>气象 WIT ｜ 受训线：二十四小时预报、风暴预警<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>判断明日会不会起风<\/td><td>预判处在形成期的风暴<\/td><td>分辨真假风向（飓风眼的第二波）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>成功收益<\/strong>：全船获得 1 轮准备（下段首个航海检定优势，7.3）。<br><strong>失败落地<\/strong>：<strong>给出一个错误的结论<\/strong>，而不是\"不知道\"。GM 必须让玩家以为自己知道——这是最便宜的戏剧张力。<\/p>\n<p><strong>分支<\/strong>：<strong>风眼嗅觉<\/strong>（风暴规程第一段三掷之前，可为全船争出一个额外动作）／<strong>云读<\/strong>（移除\"浓雾\"造成的一项劣势）／<strong>季律<\/strong>（已知海域的预报自动视为普通难度）<\/p>\n<hr>\n<h3>游泳 MGT ｜ 受训线：负重游泳、水下作业、救落水者<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>游到小艇<\/td><td>穿着甲胄游上岸<\/td><td>水下止漏作业（7.9）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>溺水<\/strong>：屏气轮数 = 筋骨。之后每轮 1 点环境伤害且检定劣势；水下 HP 归零者每轮<strong>自动失败一次<\/strong>死亡骰（2.4 GM侧栏）。<br><strong>失败落地<\/strong>：不是\"不会游\"——是<strong>你游到了，但船已经漂走了<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>冷水耐受<\/strong>（移除寒冷水域的劣势）／<strong>拖带<\/strong>（救人时视同团队检定，被救者不必自己掷）／<strong>水下手艺<\/strong>（水下止漏 DV 不翻倍）<\/p>\n<hr>\n<h2>5.3 战斗域（5 项）<\/h2>\n<h3>剑术 MGT／FIN ｜ 受训线：双手武器、招架、精修招式<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>对砍一名未受训的水手<\/td><td>与老兵刀手互搏<\/td><td>在倾斜的甲板上打一场决斗<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>属性择一<\/strong>：灵巧武器用机敏，重量武器用筋骨——开局声明，整场不换。<br><strong>失败落地<\/strong>：见 9.1 险失（武器脱手／暴露借机／误伤）。<\/p>\n<p><strong>分支<\/strong>：<strong>招架<\/strong>（格挡不牺牲本回合攻击，代价是防御加成由 +2 降为 +1）／<strong>断缆回身<\/strong>（对索具、桨、钩索的破坏性攻击 +2）／<strong>单挑熟手<\/strong>（一对一时移除\"敌多我寡\"劣势）<\/p>\n<hr>\n<h3>火器 FIN ｜ 受训线：远射、移动射击、连射<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>三十步打一个静止的人<\/td><td>从摇晃的小艇上射击<\/td><td>雨夜中凭火光还击<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>卡壳处理<\/strong>见 9.2。<br><strong>失败落地<\/strong>：黑烟、走火、弹丸落进自己人堆里（d4 均分定位，9.1）。<\/p>\n<p><strong>分支<\/strong>：<strong>快速装填<\/strong>（手枪装填视为自由动作）／<strong>稳手<\/strong>（移除\"目标移动\"这一项 −2）／<strong>破甲瞄<\/strong>（近距离无视护甲的值由 1 提升至 2）<\/p>\n<hr>\n<h3>炮术 WIT ｜ 受训线：指挥齐射、瞄准声明、射界计算<\/h3>\n<p><strong>这是海战里最容易毁掉一条船的技能，也是全书唯一\"未受训绝不能碰\"的技能<\/strong>（3.2 已定）。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>炮程内打船体<\/td><td>远距打帆索<\/td><td>在浪里贯舷命中一艘正在转向的船<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>递减梯<\/strong>（同轮第二连 −5、第三连起 −10）<strong>不可用任何分支移除<\/strong>——它是设计，不是难度。<br><strong>失败落地<\/strong>：见 9.5（险失会伤到你自己那门炮）。<\/p>\n<p><strong>分支<\/strong>：<strong>弹道学<\/strong>（距离 &gt;8 格的 −2 减为 −1）／<strong>装填指挥<\/strong>（本连装填轮数 −1，每场海战 1 次）／<strong>链弹专精<\/strong>（链弹的\"射程减半\"惩罚取消）<\/p>\n<hr>\n<h3>投掷 MGT ｜ 受训线：标枪、手雷、火瓶、斧<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>扔中一条靠近的小艇<\/td><td>火瓶命中桅顶帆<\/td><td>在颠簸中扔准一根抛缆绳<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>接舷前的第一波<\/strong>就是它。抛钩、抛缆、火瓶、跳帮斧全在此项下。<br><strong>失败落地<\/strong>：落在自己人脚下（敌我不分，按 9.2 手雷规则）。<\/p>\n<p><strong>分支<\/strong>：<strong>斧手<\/strong>（投斧伤害骰 +1）／<strong>引火手<\/strong>（火瓶必然引火，火势 1 级）／<strong>缆手<\/strong>（抛缆成功即视同为一次协助）<\/p>\n<hr>\n<h3>格斗 MGT ｜ 受训线：擒抱、压制、水下搏斗<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>按倒一个醉汉<\/td><td>在甲板上缠斗并夺械<\/td><td>在舱底积水中勒住一个人<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>用途<\/strong>：抓活的。你想要俘虏、想堵嘴、想把人从舷梯口挪开——用这个，不要用剑。<br><strong>失败落地<\/strong>：你被反压（对抗互换角色）。<\/p>\n<p><strong>分支<\/strong>：<strong>锁腕<\/strong>（缴械检定 +2，且不引发借机攻击）／<strong>锁拿<\/strong>（你压制的对象不能呼救）／<strong>钝打<\/strong>（徒手攻击造成钝击而非利刃，可敲晕不杀人）<\/p>\n<hr>\n<h2>5.4 社交域（6 项）<\/h2>\n<h3>交涉 PRE ｜ 受训线：谈条件、开口子、拖延<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>让商人让你等一天<\/td><td>说服港务官放宽检疫<\/td><td>说服总督抗命开港（22）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>谈判三铁律<\/strong>：<br>① 对方一定有所图——\"他在意什么\"必须先有答案（见本域末「在意」栏）；<br>② <strong>一次交涉不改变立场，只改变价格<\/strong>；<br>③ 失败不等于谈崩——失败是<strong>他答应了，但条件比你预想的贵<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>内行话<\/strong>（对特定行业对象 +2）／<strong>拖<\/strong>（本轮不谈成，但移除对方一次时限压力）／<strong>让步换信息<\/strong>（把要求降低一档，换一条真话）<\/p>\n<hr>\n<h3>交易 PRE／WIT ｜ 受训线：行情判断、大宗议价、期约与折价<\/h3>\n<p><strong>本章补入项<\/strong>（见 5.0 术语归一）。默认人望；纯算账场合用学识，GM 判。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>买日常给养不被坑<\/td><td>一批货多要两成<\/td><td>在封锁港把违禁货卖出去<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>与 10.2 行情骰的接口<\/strong>：成功 = 可选重掷一次行情骰；卓越 = 行情骰 +1 档。<br><strong>失败落地<\/strong>：你谈成了，但<strong>不知道自己在亏<\/strong>——GM 给出一个偏高的成交价而不报警，直到结算才算清。<\/p>\n<p><strong>分支<\/strong>：<strong>看货<\/strong>（识别掺假、湿货、短秤，自动成功）／<strong>长期客户<\/strong>（同一港口的第二单 +2）／<strong>期约<\/strong>（锁定未来一次交易的价格）<\/p>\n<hr>\n<h3>欺骗 PRE ｜ 受训线：伪造文书、假身份、临场编派<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>撒谎说船坏了<\/td><td>冒用他国旗帜与文书<\/td><td>在海关与舰队情报官面前演完一整场<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>对抗对象是\"洞察\"<\/strong>——本书不设独立的洞察技能，由 <strong>学识+交涉<\/strong>（对物证）或 <strong>胆魄+交涉<\/strong>（对人）代任，GM 选择并声明。<br><strong>失败落地<\/strong>：不是\"被识破\"这么简单——<strong>被识破之后他假装没识破<\/strong>，然后你要在更贵的时候付账。<\/p>\n<p><strong>分支<\/strong>：<strong>文书匠<\/strong>（伪造文书 +2，且不触发\"笔迹\"这一劣势）／<strong>一张脸<\/strong>（同一港口内对同一批人可再骗一次）／<strong>半真话<\/strong>（把一次失败改写为\"成功但引入新麻烦\"，每场景 1 次）<\/p>\n<hr>\n<h3>威吓 MGT／PRE ｜ 受训线：逼供、驱散、镇压哗变<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>让一个新手闭嘴<\/td><td>审出撒谎者的真话<\/td><td>让一整组老兵放下武器<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>默认筋骨<\/strong>（你有多大只）；有名声者可用人望（\"血鸦号都让过路\"）。<br><strong>哗变接口<\/strong>：7.7 镇压选项；冷酷船长天赋 +3。<br><strong>失败落地<\/strong>：他不怕你，<strong>而且他现在知道你会怕<\/strong>。此后你对该对象的检定 −1。<\/p>\n<p><strong>分支<\/strong>：<strong>船上的铁<\/strong>（威慑对象为己方船员时 +2）／<strong>当众<\/strong>（旁观者每 5 人 +1，上限 +3）／<strong>不杀<\/strong>（逼供成功但不结血债，10.8 恶名不涨）<\/p>\n<hr>\n<h3>领导 MGT／胆魄／PRE ｜ 受训线：危机中下令、维持建制、代掌舵<\/h3>\n<p><strong>默认人望<\/strong>；绝境中改用<strong>胆魄<\/strong>（GM 判）——喊口号靠魅力，顶住不退靠胆。<\/p>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>让水手按时干活<\/td><td>船长倒下后接管一条船<\/td><td>火势与进水同时发生时组织撤离<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>收益<\/strong>：船长在场且领导成功 = 士气 +1（7.7）。<br><strong>失败落地<\/strong>：<strong>没人抗命，只是没人动。<\/strong> 这两件事在游戏上完全不同，GM 要演后者。<\/p>\n<p><strong>分支<\/strong>：<strong>建制<\/strong>（群战中战役检定 +2，9.8）／<strong>分派<\/strong>（每航段可指定一人协助你，不占协助上限）／<strong>担责<\/strong>（一次士气骰失败后可代全船掷胆魄抵消）<\/p>\n<hr>\n<h3>表演 PRE ｜ 受训线：伪装、说书、转移注意<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>在酒馆唱一首歌<\/td><td>让一桌人不去注意你们的船<\/td><td>冒充一位死去贵族的遗孀<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>最被低估的战斗技能<\/strong>：无风带士气 +1（7.10）、葬礼、谈判前的暖场、给伤员哼点东西。<br><strong>失败落地<\/strong>：冷场，而且<strong>有人记得你失败了<\/strong>（声望 −，10.8）。<\/p>\n<p><strong>分支<\/strong>：<strong>乡音<\/strong>（可模仿一门已懂语言的口音，欺骗 +2）／<strong>长活<\/strong>（表演可持续一整段停泊而不掉档）／<strong>动情<\/strong>（一次表演可替代一次交涉检定，按交涉结算）<\/p>\n<hr>\n<h2>5.5 学识域（6 项）<\/h2>\n<h3>医术 WIT ｜ 受训线：手术、急救、疫病判断、接骨<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>缝合一处刀伤<\/td><td>取弹头<\/td><td>在摇晃的船舱里做开颅<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>接口<\/strong>：施救 DV13（3.7）；船医每昼夜额外 +2 HP；启用部位变体时\"稳定\"消耗一次战位动作（9.4）。<br><strong>失败落地<\/strong>：<strong>伤口处理干净了，人没了<\/strong>——感染判定（7.8）。<\/p>\n<p><strong>分支<\/strong>：<strong>战地外科<\/strong>（救治不受\"摇晃／夜战／雨\"劣势影响）／<strong>疫辨<\/strong>（疾病触发的全船健康骰 +2）／<strong>断肢<\/strong>（可主动选择以\"永久致残\"换\"当场保住命\"，双方都不必掷骰）<\/p>\n<hr>\n<h3>博物学 WIT ｜ 受训线：辨识物种、评估可食、采样定价<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>这果子能不能吃<\/td><td>认出这是一种欧洲没有的树<\/td><td>判断这片海域为什么没有鸟<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>探索收益的主要来源<\/strong>：一次成功的采样带来<strong>市场价值<\/strong>（8.7）与<strong>新条目<\/strong>（写入船志）。<br><strong>失败落地<\/strong>：给出一个<strong>自信而错误的<\/strong>分类。<\/p>\n<p><strong>分支<\/strong>：<strong>香料与药草<\/strong>（采样货物售价 +1 档）／<strong>风向生物<\/strong>（动物行为可预报气象，免掷即视同成功）／<strong>新种著录<\/strong>（首次著录的物种额外 +1 XP，3.9）<\/p>\n<hr>\n<h3>史学 WIT ｜ 受训线：辨识文物、追溯旗号、读懂旧档<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>认出一面旗帜属于哪国<\/td><td>读懂一份三十年前的租约<\/td><td>从一枚火漆印追出一个家族<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>与学者原型「我知道这个」的接口<\/strong>：失败仍可获得部分信息（4.4）。<br><strong>失败落地<\/strong>：认对了年代，<strong>认错了主人<\/strong>——这是七个秘密里最常用的引线（12.7）。<\/p>\n<p><strong>分支<\/strong>：<strong>纹章<\/strong>（旗号与火漆类检定 +2）／<strong>档案<\/strong>（在图书馆、行会等文书场合不受时间惩罚）／<strong>旧账<\/strong>（可辨认伪造文书，与欺骗对抗）<\/p>\n<hr>\n<h3>律法 WIT ｜ 受训线：合同、管辖、捕获法庭<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>看懂一份雇佣合同<\/td><td>在关税争议里保住货<\/td><td>在捕获法庭上主张一条船的产权<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>本作\"文书即钥匙\"的那项技能<\/strong>（10.6、12.1）：私掠许可证、领水权、检疫状、报关单——<strong>能不能合法销赃、能不能进军港、能不能把缴获的船变成自己的钱<\/strong>，全看这项。<br><strong>失败落地<\/strong>：你没输官司，但你<strong>错过了开港日<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>海事状<\/strong>（捕获法庭与港务争议 +2）／<strong>合同眼<\/strong>（自动察觉一处对己不利的条款）／<strong>通行文<\/strong>（在任一势力辖区内用文书换取一次豁免）<\/p>\n<hr>\n<h3>工程 WIT ｜ 受训线：炮位改造、泵机、要塞与桥梁<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>加固一处炮门<\/td><td>造一台手动排水泵<\/td><td>用一具临时绞盘把断桅拉起来<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>与木工的分工<\/strong>：木工管<strong>木<\/strong>，工程管<strong>力与机构<\/strong>。修船壳是木工，改滑车系统是工程。<br><strong>失败落地<\/strong>：结构撑住了第一下，<strong>没撑住第二下<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>炮位学<\/strong>（本船炮位射界限制放宽一档）／<strong>泵与阀<\/strong>（抽水效率翻倍，进水等级 −1）／<strong>急就章<\/strong>（一次工程检定可替代木工检定，DV +2）<\/p>\n<hr>\n<h3>语言学 WIT ｜ 受训线：临场通译、辨方言、读死文字<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>用贸易通用语讲价<\/td><td>在三种方言里听出对方来自哪座港<\/td><td>读一段不属于任何现役语言的铭文<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>\"够懂\"规则<\/strong>（语言天才天赋，4.6）：可努力凑合基础交流，但<strong>任何含条件、含承诺、含数字的话都必须重译<\/strong>，否则后果自负。<br><strong>失败落地<\/strong>：<strong>翻译错了，而且说得很流畅<\/strong>——玩家会不知道出了事，直到对方开始动手。<\/p>\n<p><strong>分支<\/strong>：<strong>速成<\/strong>（一个停泊周期内可\"够懂\"一门新语言）／<strong>黑话<\/strong>（水手黑话、走私切口场合 +2）／<strong>碑铭<\/strong>（死文字读取 DV 降一档）<\/p>\n<hr>\n<h2>5.6 生存域（5 项）<\/h2>\n<h3>生存 MGT／胆魄 ｜ 受训线：隐蔽、潜行、陌生地形穿行<\/h3>\n<blockquote class='quote'>本书不设独立的\"潜行\"技能。<strong>潜行、躲藏、隐蔽接敌全归生存<\/strong>（见 5.0 术语归一）。<\/blockquote>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>在丛林里不迷路<\/td><td>带一支小队无声穿过哨线<\/td><td>在一片开阔滩涂上摸到哨塔下<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>对抗<\/strong>：守方用 <strong>博物学<\/strong>（读痕迹）或 <strong>学识+交涉<\/strong>（听动静）。<br><strong>失败落地<\/strong>：不是被发现——<strong>是他们看见了你们，决定先不动手，好知道你们有多少人。<\/strong><\/p>\n<p><strong>分支<\/strong>：<strong>潜形<\/strong>（移除\"人数 ≥3\"造成的劣势）／<strong>水边<\/strong>（河岸、滩涂、红树林内 +2）／<strong>静默行军<\/strong>（团队检定中可为全组代掷一次）<\/p>\n<hr>\n<h3>追踪 WIT ｜ 受训线：读迹、判断时效、反向追踪<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>追一群鹿<\/td><td>追一支跑了三天的队伍<\/td><td>判断这段痕迹是三天前的、还是专门摆给你看的<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>5.0① 适用<\/strong>：追踪失败<strong>不会<\/strong>让线索消失，只会<strong>变慢<\/strong>（代价＝时间，而时间＝退潮、追兵、坏血计数）。<br><strong>失败落地<\/strong>：跟丢；或者——<strong>被反跟踪<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>海路追踪<\/strong>（在海面读航迹、漂流物、油污）／<strong>时效判断<\/strong>（\"多久之前\"GM 必须如实回答，免掷）／<strong>反向<\/strong>（可察觉自己正在被追）<\/p>\n<hr>\n<h3>驯畜 MGT／PRE ｜ 受训线：驮兽、军马、船上的鼠与狗<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>让驮马过桥<\/td><td>在炮声下稳住军马<\/td><td>与一条不认你的狗谈条件<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>低存在感但高回报<\/strong>：登陆战、内陆行旅，以及船上那只总能提前预警的猫。<br><strong>失败落地<\/strong>：动物跑了，带走你的补给，或者把你暴露。<\/p>\n<p><strong>分支<\/strong>：<strong>征用<\/strong>（可临时征用他人牲口而不立刻结仇）／<strong>驮运编组<\/strong>（载重与人力负重换算 +20%，6.8）／<strong>哨兽<\/strong>（一只驯养动物可替代瞭望位一次检定／航段）<\/p>\n<hr>\n<h3>烹调 MGT ｜ 受训线：配给管理、腌熏、让船粮吃得下去<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>做出全船吃得下的一餐<\/td><td>让长虫的面粉还能入口<\/td><td>在只有咸肉和水的第四十天做出一顿热食<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>这是士气的廉价保险<\/strong>：有热食 = 士气 +1／昼夜（7.7）。一个航海团的厨子不该是个笑话。<br><strong>失败落地<\/strong>：食物安全吃掉，但<strong>全船骂一晚上<\/strong>（士气 −1，疲劳累计 +1）。<\/p>\n<p><strong>分支<\/strong>：<strong>配给术<\/strong>（同等补给多撑 1d3 天）／<strong>腌熏<\/strong>（食物腐坏判定 +2）／<strong>解腻<\/strong>（坏血计数累积速度减半）<\/p>\n<hr>\n<h3>渔猎 MGT／FIN ｜ 受训线：下网、设陷阱、猎海鸟<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>近岸下一网<\/td><td>在无风带猎一只信天翁<\/td><td>在浮冰边上猎一头鲸<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>接口<\/strong>：班次活动中的\"捕鱼／猎海鸟\"两项（7.3 排岗）；成功可使补给 +1 份／人／天。<br><strong>失败落地<\/strong>：空手，而且<strong>耗掉了本班次<\/strong>——机会成本就是代价。<\/p>\n<p><strong>分支<\/strong>：<strong>延绳<\/strong>（下网后本班次可另做一次动作）／<strong>海鸟路<\/strong>（猎海鸟视为普通难度）／<strong>潮间<\/strong>（登陆时补给不受减配影响）<\/p>\n<hr>\n<h2>5.7 手艺域（5 项）<\/h2>\n<h3>木工 MGT ｜ 受训线：船壳修补、桅与桁、做结实的东西<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>钉一块舱板<\/td><td>海上止漏（DV14，水下翻倍）<\/td><td>用现有木料做一根能撑的临时桅<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>航海团的命脉。<\/strong> 与工程分界：木归它，机构归工程。<br><strong>失败落地<\/strong>：补住了，但<strong>把别处拆坏了<\/strong>（船体 −1d3，7.9）。<\/p>\n<p><strong>分支<\/strong>：<strong>损管<\/strong>（止漏 +2）／<strong>桅工<\/strong>（换桅时间与价格减半）／<strong>船上造物<\/strong>（可用现有木料制作简单器具，见 6.1 自制规则）<\/p>\n<hr>\n<h3>铁匠 MGT ｜ 受训线：修理金属件、打造、改火器<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>修一副舵链的环<\/td><td>锻一块新的锚爪<\/td><td>把一柄断剑重打成一柄可用的刀<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>船上没有铁匠，但每个港口都有。<\/strong> 这条决定了回港的价值。<br><strong>失败落地<\/strong>：看着修好了——<strong>在第一次受力时断掉<\/strong>。<\/p>\n<p><strong>分支<\/strong>：<strong>锚与链<\/strong>（凡涉及锚、链、钩的检定 +2）／<strong>火器修理<\/strong>（可排除卡壳、处理走火，并可替代工程检定）／<strong>急铸<\/strong>（船上简易浇铸一次铅弹，免除该次弹药消耗）<\/p>\n<hr>\n<h3>缝纫 MGT ｜ 受训线：帆的修补与制作<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>缝一处帆上的破洞<\/td><td>用备料补出一块新帆角<\/td><td>把两面破帆合成一面能用的<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>与操帆的分工<\/strong>：操帆管\"用帆\"，缝纫管\"有帆\"。海上修帆动作可用缝纫执行（9.4）。<br><strong>失败落地<\/strong>：缝住了，<strong>风一吹全裂开<\/strong>（帆况立刻再降一档）。<\/p>\n<p><strong>分支<\/strong>：<strong>帆匠<\/strong>（帆况修复只需 1 段，且不必额外备料）／<strong>缝帆索<\/strong>（加固后索具受击的额外骰对你无效）／<strong>帆布裁制<\/strong>（可裁制新帆，见 6.1 自制规则）<\/p>\n<hr>\n<h3>制药 WIT ｜ 受训线：蒸馏、药剂、防腐，以及那些违禁的东西<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>熬一剂退热草汤<\/td><td>制柠檬汁抗坏血<\/td><td>配一剂不会死人的迷药<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>接口<\/strong>：坏血病线（7.8；史实锚——18 世纪才普及柠檬汁，见该节历史注）。药料在第10章属<strong>低库存、高波动<\/strong>类。<br><strong>失败落地<\/strong>：药是假的，或者<strong>剂量不对<\/strong>——病情不变，但全船以为有解了。<\/p>\n<p><strong>分支<\/strong>：<strong>柑橘术<\/strong>（坏血计数可直接延缓，不必每日医术 DV16）／<strong>迷与麻<\/strong>（外科手术的疼痛惩罚取消）／<strong>防腐<\/strong>（给养腐坏判定 +2，与烹调叠加时取高不叠）<\/p>\n<hr>\n<h3>绘图 WIT ｜ 受训线：图、表、像，以及以假乱真<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>画一张能用的港湾草图<\/td><td>伪造一份带印鉴的通行证图版<\/td><td>凭一段记忆复原一幅被烧掉的图<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>与海图绘制的分界<\/strong>：海图绘制＝测量与制图；绘图＝手艺人能画一切。<strong>伪造文书需要 <code>绘图 + 欺骗<\/code> 两次检定都过。<\/strong><br><strong>失败落地<\/strong>：画得太好了，好到<strong>有人想要它<\/strong>（13.6 的 NPC 会主动来买，或来偷）。<\/p>\n<p><strong>分支<\/strong>：<strong>图版伪造<\/strong>（伪造类 +2）／<strong>肖像<\/strong>（凭描述可画出能用于辨认的像）／<strong>刻版<\/strong>（可批量印制，一张图变二十张）<\/p>\n<hr>\n<h2>5.8 超自然域（1 项，条件开放）<\/h2>\n<h3>神秘学 WIT ｜ 仅在第11章【模糊】或【显性】档开放<\/h3>\n<div class='tbl'><table><thead><tr><th>普通 13<\/th><th>困难 16<\/th><th>极难 19<\/th><\/tr><\/thead><tbody><tr><td>分辨一个传说是真是假<\/td><td>认出这场仪式在做什么<\/td><td>从一句疯话里推出它完整的规则<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>在【模糊】档下，这项技能的失败也必须给出答案<\/strong>——GM 给两个可能的真相，让玩家自己带一个走（11.1）。<br><strong>分支<\/strong>：<strong>传说考<\/strong>（辨识真伪 +2）／<strong>仪式基<\/strong>（可主持仪式，11.4）／<strong>渊语<\/strong>（可读懂不该被读的东西，代价见 11.2 心结）<\/p>\n<hr>\n<h2>5.9 专长分支总表<\/h2>\n<p><strong>左列是玩家能问的问题，右列是 GM 要记住的账。<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>技能<\/th><th>分支一<\/th><th>分支二<\/th><th>分支三<\/th><\/tr><\/thead><tbody><tr><td>导航<\/td><td>天文学（移除无星夜劣势）<\/td><td>推算航法（迷航中+2）<\/td><td>潮流读法（河口海峡+2）<\/td><\/tr><tr><td>操帆<\/td><td>帆装修补（修帆降档）<\/td><td>满帆驾驭（索具额外骰−1）<\/td><td>抢风节拍（抢风+2）<\/td><\/tr><tr><td>掌舵<\/td><td>上风夺取（号令两次）<\/td><td>浅水直觉（吃水+2）<\/td><td>夜舵（移除夜战劣势）<\/td><\/tr><tr><td>海图绘制<\/td><td>水深标注（贴礁−2）<\/td><td>抄本生意（行情+1档）<\/td><td>速写（一段完成）<\/td><\/tr><tr><td>气象<\/td><td>风眼嗅觉（争一动作）<\/td><td>云读（移除浓雾劣势）<\/td><td>季律（已知海域降档）<\/td><\/tr><tr><td>游泳<\/td><td>冷水耐受<\/td><td>拖带（代被救者掷）<\/td><td>水下手艺（止漏不翻倍）<\/td><\/tr><tr><td>剑术<\/td><td>招架（格挡不牺牲攻击）<\/td><td>断缆回身（破坏性攻击+2）<\/td><td>单挑熟手（免一对多劣势）<\/td><\/tr><tr><td>火器<\/td><td>快速装填（手枪自由动作）<\/td><td>稳手（免移动−2）<\/td><td>破甲瞄（1→2）<\/td><\/tr><tr><td>炮术<\/td><td>弹道学（远距−2改−1）<\/td><td>装填指挥（每场一次−1轮）<\/td><td>链弹专精（免射程减半）<\/td><\/tr><tr><td>投掷<\/td><td>斧手（+1）<\/td><td>引火手（必引火）<\/td><td>缆手（视同一次协助）<\/td><\/tr><tr><td>格斗<\/td><td>锁腕（缴械+2免借机）<\/td><td>锁拿（不能呼救）<\/td><td>钝打（改钝击可敲晕）<\/td><\/tr><tr><td>交涉<\/td><td>内行话（+2）<\/td><td>拖（免一次时限压力）<\/td><td>让步换信息<\/td><\/tr><tr><td>交易<\/td><td>看货（自动识假）<\/td><td>长期客户（二单+2）<\/td><td>期约（锁价）<\/td><\/tr><tr><td>欺骗<\/td><td>文书匠（+2免笔迹）<\/td><td>一张脸（二次行骗）<\/td><td>半真话（改判一次）<\/td><\/tr><tr><td>威吓<\/td><td>船上的铁（对己方+2）<\/td><td>当众（每5人+1，上限+3）<\/td><td>不杀（不涨恶名）<\/td><\/tr><tr><td>领导<\/td><td>建制（群战+2）<\/td><td>分派（额外协助不占限）<\/td><td>担责（代全船抵一次士气）<\/td><\/tr><tr><td>表演<\/td><td>乡音（+2）<\/td><td>长活（整段停泊不掉档）<\/td><td>动情（可替代一次交涉）<\/td><\/tr><tr><td>医术<\/td><td>战地外科（免环境劣势）<\/td><td>疫辨（健康骰+2）<\/td><td>断肢（致残换保命）<\/td><\/tr><tr><td>博物学<\/td><td>香料与药草（售价+1档）<\/td><td>风向生物（免掷预报）<\/td><td>新种著录（额外+1 XP）<\/td><\/tr><tr><td>史学<\/td><td>纹章（+2）<\/td><td>档案（免时间惩罚）<\/td><td>旧账（辨伪对抗）<\/td><\/tr><tr><td>律法<\/td><td>海事状（+2）<\/td><td>合同眼（自动察觉一条）<\/td><td>通行文（换一次豁免）<\/td><\/tr><tr><td>工程<\/td><td>炮位学（射界放宽一档）<\/td><td>泵与阀（抽水翻倍）<\/td><td>急就章（代木工+2）<\/td><\/tr><tr><td>语言学<\/td><td>速成（一周期够懂）<\/td><td>黑话（+2）<\/td><td>碑铭（死文字降档）<\/td><\/tr><tr><td>生存<\/td><td>潜形（免人多劣势）<\/td><td>水边（+2）<\/td><td>静默行军（代掷团队一次）<\/td><\/tr><tr><td>追踪<\/td><td>海路追踪<\/td><td>时效判断（免掷如实答）<\/td><td>反向（察觉被追）<\/td><\/tr><tr><td>驯畜<\/td><td>征用（不结仇）<\/td><td>驮运编组（载重+20%）<\/td><td>哨兽（替代瞭望一次／段）<\/td><\/tr><tr><td>烹调<\/td><td>配给术（多撑1d3天）<\/td><td>腌熏（腐坏+2）<\/td><td>解腻（坏血累积减半）<\/td><\/tr><tr><td>渔猎<\/td><td>延绳（不占班次）<\/td><td>海鸟路（降为普通）<\/td><td>潮间（补给免减配）<\/td><\/tr><tr><td>木工<\/td><td>损管（止漏+2）<\/td><td>桅工（换桅减半）<\/td><td>船上造物<\/td><\/tr><tr><td>铁匠<\/td><td>锚与链（+2）<\/td><td>火器修理<\/td><td>急铸（免弹药一次）<\/td><\/tr><tr><td>缝纫<\/td><td>帆匠（1段免备料）<\/td><td>缝帆索（索具免额外骰）<\/td><td>帆布裁制<\/td><\/tr><tr><td>制药<\/td><td>柑橘术<\/td><td>迷与麻（免疼痛惩罚）<\/td><td>防腐（与缝纫取高）<\/td><\/tr><tr><td>绘图<\/td><td>图版伪造（+2）<\/td><td>肖像<\/td><td>刻版（可量产）<\/td><\/tr><tr><td>神秘学<\/td><td>传说考（+2）<\/td><td>仪式基<\/td><td>渊语（可读，代价见11.2）<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>5.10 三十秒速查<\/h2>\n<p><strong>掷不掷？<\/strong> 成败存疑 <strong>且<\/strong> 后果重要 → 掷（3.2）。否则直接给。<br><strong>是线索吗？<\/strong> 剧情唯一通路 → <strong>永不投骰<\/strong>（5.0①）。<br><strong>掷过了吗？<\/strong> 同一件事、同一段航程 → <strong>不再掷<\/strong>（5.0②）。<br><strong>受训了吗？<\/strong> 专业动作 → 必须受训（3.2／每项技能第一行）。<br><strong>他到底在意什么？<\/strong> 任何一次社交检定之前，GM 必须先能回答这个问题——答不出，就说明这个 NPC 还没到出场的时候。<\/p>\n<hr>\n<p><em>技能定了。接下来是你上船时兜里那点东西，到底值多少。<\/em><\/p>","text":"技能不是你能掷几次骰，是你能问出哪些问题。 第3.5节给出的是 预览清单 。本章是 定稿总表 ：三十三项主干技能，逐条给用途、默认属性、三档即查难度、失败落地与专长分支。 依赖：3.2 检定 / 3.4 属性 / 4.2 出身 / 4.4 原型。 5.0 三条读法（先立规矩） ① 关键线索永不投骰 如果一条线索是剧情的唯一通路，它就不需要检定。 玩家说出正确的方法、走到正确的地方，GM 必须给出。 技能检定决定的是 你能额外知道多少 ，不是 你有没有资格知道 。 这条是全书调查类技能的总闸，优先级高于任何单条技能描述。理由很硬：一个长团的死法通常不是全灭，是在第一个港口因为一次失败的检定而再没有第二幕。 ② Let it Ride：同一段航程只掷一次 同一件事、同一个目标、同一个航段内， 一次检定定终身 。掷过了就不许换个技能再掷一遍。 想重掷？三条合法通路： 改变条件 （换方法／添工具／拉帮手）、 付出代价 （多花一个班次，或消耗潮汐点）、 升级难度 （GM 把 DV 降一档，同时给出新风险）。 ③ 技能加的是\"专业动作\"的入场券 3.2 已经定了： 未受训可以做基础动作，专业动作必须受训 。本章把这条落到每项技能上——每项技能第一行都写着它的 受训线 。 术语归一（前四章用过的松散叫法对照） 第2、4、7章在描述出身与原型时用了几个口语化叫法。以下是正式对应， 以本章为准 ： 别处写法 定稿技能 交易、经商、买卖 交易 （社交域，5.4） 攀索 操帆 （航海域，5.2） 航海（笼统） 按场合取 掌舵 ／ 导航 ／ 操帆 航海（地中海岛民出身） 操帆 辨识文物、语言、传说（学者\"见闻检定\"） 史学 ／ 语言学 ／ 博物学 潜行 生存 （隐蔽子项，见5.6） 侦察、洞察 博物学 （对物）／ 交涉 （对人，读人） 【设计注·为什么补入\"交易\"】 3.5 预览表漏列了这项技能，但 4.2「北海联合省」出身、4.4「商人」原型、7.7 招募与第十章全章都在使用它。 定稿总表补入 交易 ，归社交域 ——它是一项\"人对人谈价\"的技能，不是学识。3.5 视为本章摘要，冲突以本章为准。 5.1 专长分支怎么运作 门槛 ：该技能达到 4 级 后，每次升级可择一分支解锁（不可用其他成长选项兑换）。 效果形态只有两种 （刻意限制，防止分支长成第二套动作系统）： 特定情境 +2 ； 移除某一种既定的劣势 。 不做新动作、不改骰法、不加伤害骰。 想要新动作，去 4.6 选天赋。 同一技能最多解锁 3 条分支 ；GM 与玩家可共同提名新分支，但必须先在本表登记才生效。 判据一句话： 专长分支回答\"你在什么场合不会失手\"，不回答\"你还能做什么\"。 5.2 航海域（6 项） 导航 WIT ｜ 受训线：测天定位、无图推算 决定你知道自己 在哪里 。每航段结算一次（7.6）。 普通 13 困难 16 极难 19 有海图、白天可见岸标 无海图沿岸推估 无星雨夜测天定位 失败落地 ：偏航 1d6×2 海里；连败两段＝迷航（7.6）。 关键澄清 ：导航失败 不会 让你失去已有的海图信息（5.0①）——它只让你算错位置。 分支 ： 天文学 （移除\"无星夜\"这一项劣势）／ 推算航法 （迷航状态下导航 +2）／ 潮流读法 （河口、海峡、涨落潮水域 +2） 操帆 FIN ｜ 受训线：换帆档、海上修帆、抢风时的帆组配合 帆是发动机，也是最先坏的东西。（4.2 里的\"攀索\"归入本技能。） 普通 13 困难 16 极难 19 平风中收一面前帆 暴风中抢修帆桁 顶风抢风时同步换主帆 失败落地 ：帆况降一档；或索具受击（9.5 部位表 2–3 条）。 协助 ：操帆是最值得做团队检定的技能（7.3 排岗）。 分支 ： 帆装修补 （海上修帆 DV 视为低一档）／ 满帆驾驭 （\"满帆\"档的索具额外伤害骰 −1）／ 抢风节拍 （抢风时的掌舵检定 +2） 掌舵 MGT／FIN ｜ 受训线：急转、贴礁、海战机动 默认筋骨 （力量压住舵柄）；轻船与反应场合可改用机敏，GM 开局宣告。 普通 13 困难 16 极难 19 侧风保持航向 大风中急转抢位 十二尺浪里穿浪眼（22） 失败落地 ：偏航、本轮速度归零、或撞（礁区见 7.10）。 海战口径 ：机动与阵位见 9.3；追击里每轮限选一动作（9.7）。 分支 ： 上风夺取 （\"抢上风\"号令每场可喊两次）／ 浅水直觉 （吃水检定 +2）／ 夜舵 （移除\"夜战\"对机动的一项劣势） 海图绘制 WIT ｜ 受训线：把发现的海岸线变成可交易的成果 探索与经济打通的那一环 （8.7、10.3）。 普通 13 困难 16 极难 19 描摹已见的港湾轮廓 补测水深与礁位 在摇晃的船上仅凭目测画出一段海岸 成果可交易 ：一张合格新海图售予制图师行会 = 40–200 银币 （10.1 行情骰决定，取决于这片海有多值得去）。 失败落地 ：图画错了—— 下次沿用它航行时导航 DV +3 （错误的地图比没有地图更危险）。 分支 ： 水深标注 （凡你绘出的浅点，后续\"贴礁走位\" DV −2）／ 抄本生意 （卖图时行情骰 +1 档）／ 速写 （一个航段内即可完成，无需额外时间） 气象 WIT ｜ 受训线：二十四小时预报、风暴预警 普通 13 困难 16 极难 19 判断明日会不会起风 预判处在形成期的风暴 分辨真假风向（飓风眼的第二波） 成功收益 ：全船获得 1 轮准备（下段首个航海检定优势，7.3）。 失败落地 ： 给出一个错误的结论 ，而不是\"不知道\"。GM 必须让玩家以为自己知道——这是最便宜的戏剧张力。 分支 ： 风眼嗅觉 （风暴规程第一段三掷之前，可为全船争出一个额外动作）／ 云读 （移除\"浓雾\"造成的一项劣势）／ 季律 （已知海域的预报自动视为普通难度） 游泳 MGT ｜ 受训线：负重游泳、水下作业、救落水者 普通 13 困难 16 极难 19 游到小艇 穿着甲胄游上岸 水下止漏作业（7.9） 溺水 ：屏气轮数 = 筋骨。之后每轮 1 点环境伤害且检定劣势；水下 HP 归零者每轮 自动失败一次 死亡骰（2.4 GM侧栏）。 失败落地 ：不是\"不会游\"——是 你游到了，但船已经漂走了 。 分支 ： 冷水耐受 （移除寒冷水域的劣势）／ 拖带 （救人时视同团队检定，被救者不必自己掷）／ 水下手艺 （水下止漏 DV 不翻倍） 5.3 战斗域（5 项） 剑术 MGT／FIN ｜ 受训线：双手武器、招架、精修招式 普通 13 困难 16 极难 19 对砍一名未受训的水手 与老兵刀手互搏 在倾斜的甲板上打一场决斗 属性择一 ：灵巧武器用机敏，重量武器用筋骨——开局声明，整场不换。 失败落地 ：见 9.1 险失（武器脱手／暴露借机／误伤）。 分支 ： 招架 （格挡不牺牲本回合攻击，代价是防御加成由 +2 降为 +1）／ 断缆回身 （对索具、桨、钩索的破坏性攻击 +2）／ 单挑熟手 （一对一时移除\"敌多我寡\"劣势） 火器 FIN ｜ 受训线：远射、移动射击、连射 普通 13 困难 16 极难 19 三十步打一个静止的人 从摇晃的小艇上射击 雨夜中凭火光还击 卡壳处理 见 9.2。 失败落地 ：黑烟、走火、弹丸落进自己人堆里（d4 均分定位，9.1）。 分支 ： 快速装填 （手枪装填视为自由动作）／ 稳手 （移除\"目标移动\"这一项 −2）／ 破甲瞄 （近距离无视护甲的值由 1 提升至 2） 炮术 WIT ｜ 受训线：指挥齐射、瞄准声明、射界计算 这是海战里最容易毁掉一条船的技能，也是全书唯一\"未受训绝不能碰\"的技能 （3.2 已定）。 普通 13 困难 16 极难 19 炮程内打船体 远距打帆索 在浪里贯舷命中一艘正在转向的船 递减梯 （同轮第二连 −5、第三连起 −10） 不可用任何分支移除 ——它是设计，不是难度。 失败落地 ：见 9.5（险失会伤到你自己那门炮）。 分支 ： 弹道学 （距离 &gt;8 格的 −2 减为 −1）／ 装填指挥 （本连装填轮数 −1，每场海战 1 次）／ 链弹专精 （链弹的\"射程减半\"惩罚取消） 投掷 MGT ｜ 受训线：标枪、手雷、火瓶、斧 普通 13 困难 16 极难 19 扔中一条靠近的小艇 火瓶命中桅顶帆 在颠簸中扔准一根抛缆绳 接舷前的第一波 就是它。抛钩、抛缆、火瓶、跳帮斧全在此项下。 失败落地 ：落在自己人脚下（敌我不分，按 9.2 手雷规则）。 分支 ： 斧手 （投斧伤害骰 +1）／ 引火手 （火瓶必然引火，火势 1 级）／ 缆手 （抛缆成功即视同为一次协助） 格斗 MGT ｜ 受训线：擒抱、压制、水下搏斗 普通 13 困难 16 极难 19 按倒一个醉汉 在甲板上缠斗并夺械 在舱底积水中勒住一个人 用途 ：抓活的。你想要俘虏、想堵嘴、想把人从舷梯口挪开——用这个，不要用剑。 失败落地 ：你被反压（对抗互换角色）。 分支 ： 锁腕 （缴械检定 +2，且不引发借机攻击）／ 锁拿 （你压制的对象不能呼救）／ 钝打 （徒手攻击造成钝击而非利刃，可敲晕不杀人） 5.4 社交域（6 项） 交涉 PRE ｜ 受训线：谈条件、开口子、拖延 普通 13 困难 16 极难 19 让商人让你等一天 说服港务官放宽检疫 说服总督抗命开港（22） 谈判三铁律 ： ① 对方一定有所图——\"他在意什么\"必须先有答案（见本域末「在意」栏）； ② 一次交涉不改变立场，只改变价格 ； ③ 失败不等于谈崩——失败是 他答应了，但条件比你预想的贵 。 分支 ： 内行话 （对特定行业对象 +2）／ 拖 （本轮不谈成，但移除对方一次时限压力）／ 让步换信息 （把要求降低一档，换一条真话） 交易 PRE／WIT ｜ 受训线：行情判断、大宗议价、期约与折价 本章补入项 （见 5.0 术语归一）。默认人望；纯算账场合用学识，GM 判。 普通 13 困难 16 极难 19 买日常给养不被坑 一批货多要两成 在封锁港把违禁货卖出去 与 10.2 行情骰的接口 ：成功 = 可选重掷一次行情骰；卓越 = 行情骰 +1 档。 失败落地 ：你谈成了，但 不知道自己在亏 ——GM 给出一个偏高的成交价而不报警，直到结算才算清。 分支 ： 看货 （识别掺假、湿货、短秤，自动成功）／ 长期客户 （同一港口的第二单 +2）／ 期约 （锁定未来一次交易的价格） 欺骗 PRE ｜ 受训线：伪造文书、假身份、临场编派 普通 13 困难 16 极难 19 撒谎说船坏了 冒用他国旗帜与文书 在海关与舰队情报官面前演完一整场 对抗对象是\"洞察\" ——本书不设独立的洞察技能，由 学识+交涉 （对物证）或 胆魄+交涉 （对人）代任，GM 选择并声明。 失败落地 ：不是\"被识破\"这么简单—— 被识破之后他假装没识破 ，然后你要在更贵的时候付账。 分支 ： 文书匠 （伪造文书 +2，且不触发\"笔迹\"这一劣势）／ 一张脸 （同一港口内对同一批人可再骗一次）／ 半真话 （把一次失败改写为\"成功但引入新麻烦\"，每场景 1 次） 威吓 MGT／PRE ｜ 受训线：逼供、驱散、镇压哗变 普通 13 困难 16 极难 19 让一个新手闭嘴 审出撒谎者的真话 让一整组老兵放下武器 默认筋骨 （你有多大只）；有名声者可用人望（\"血鸦号都让过路\"）。 哗变接口 ：7.7 镇压选项；冷酷船长天赋 +3。 失败落地 ：他不怕你， 而且他现在知道你会怕 。此后你对该对象的检定 −1。 分支 ： 船上的铁 （威慑对象为己方船员时 +2）／ 当众 （旁观者每 5 人 +1，上限 +3）／ 不杀 （逼供成功但不结血债，10.8 恶名不涨） 领导 MGT／胆魄／PRE ｜ 受训线：危机中下令、维持建制、代掌舵 默认人望 ；绝境中改用 胆魄 （GM 判）——喊口号靠魅力，顶住不退靠胆。 普通 13 困难 16 极难 19 让水手按时干活 船长倒下后接管一条船 火势与进水同时发生时组织撤离 收益 ：船长在场且领导成功 = 士气 +1（7.7）。 失败落地 ： 没人抗命，只是没人动。 这两件事在游戏上完全不同，GM 要演后者。 分支 ： 建制 （群战中战役检定 +2，9.8）／ 分派 （每航段可指定一人协助你，不占协助上限）／ 担责 （一次士气骰失败后可代全船掷胆魄抵消） 表演 PRE ｜ 受训线：伪装、说书、转移注意 普通 13 困难 16 极难 19 在酒馆唱一首歌 让一桌人不去注意你们的船 冒充一位死去贵族的遗孀 最被低估的战斗技能 ：无风带士气 +1（7.10）、葬礼、谈判前的暖场、给伤员哼点东西。 失败落地 ：冷场，而且 有人记得你失败了 （声望 −，10.8）。 分支 ： 乡音 （可模仿一门已懂语言的口音，欺骗 +2）／ 长活 （表演可持续一整段停泊而不掉档）／ 动情 （一次表演可替代一次交涉检定，按交涉结算） 5.5 学识域（6 项） 医术 WIT ｜ 受训线：手术、急救、疫病判断、接骨 普通 13 困难 16 极难 19 缝合一处刀伤 取弹头 在摇晃的船舱里做开颅 接口 ：施救 DV13（3.7）；船医每昼夜额外 +2 HP；启用部位变体时\"稳定\"消耗一次战位动作（9.4）。 失败落地 ： 伤口处理干净了，人没了 ——感染判定（7.8）。 分支 ： 战地外科 （救治不受\"摇晃／夜战／雨\"劣势影响）／ 疫辨 （疾病触发的全船健康骰 +2）／ 断肢 （可主动选择以\"永久致残\"换\
