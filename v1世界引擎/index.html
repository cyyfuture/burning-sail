部分真 宝是负资产（债） 商战·中·短链——一笔祖传债务的考古 ② 继承残图的孤儿 5 真（封蜡+2） 守宝者仍在 冒险·重·长线——守墓人守的不是墓 ③ 假货贩子 2 偏假（酒馆−1） 图是猎杀诱饵 阴谋·中·短链——我们是猎人还是猎物 三掷三味，六要素均齐全，单次生成均 ≤2 分钟—— 通过 。 12.9 对接条 08 章（探索） ：地物库与发现表 ABCD 同一海图层；寻宝链第③步直接掷发现表。 13 章（主持） ：委托人三红线（受雇即动机／必有误差／反转指向委托人）在本系统全量沿用；15 进程卡的\"势力剧本\"与 14 部派系 tick（P6）对接。 02 部（时间） ：时限带取宏轨单位（旬/季），时效滑价按季末结算。 10 章（战利品） ：寻宝真宝按 10.5 战利品生成器 10–12 档；打捞（泛型⑤）捞起物同源。"},{"num":"13","title":"人物系统","vol":"卷四 · 人物 · AI · 文本 · 技艺","skeleton":false,"html":"<blockquote class='quote'>v1 世界引擎 P6 交付（计划05部）。本册回答六个问题：人物维度怎么拆、NPC 面板要不要全量、世界怎么\"真实可成长\"、生老病死的年龄曲线、全地图 AI 怎么跑动、好感与自主决策怎么落地。第 13.5–13.6 节的\"全地图 AI\"拆到 <strong>14 分册《世界AI》<\/strong>——本册只管\"人\"，那册管\"会动的世界\"。<br>纪律：五属性与五轴是 PL/NPC 通用的<strong>唯一<\/strong>属性与性格层；本册所有机制只使用已冻结的三种零件（优势/劣势/触发检定），不新增机制。<\/blockquote>\n<h2>13.1 三源三件套对照（T5.1.1.a）<\/h2>\n<p><strong>向谁学什么<\/strong>——每个采纳件都标了落点；每个否决件都有理由。<\/p>\n<div class='tbl'><table><thead><tr><th>来源<\/th><th>采纳件（三件套）<\/th><th>落点<\/th><th>否决件与理由<\/th><\/tr><\/thead><tbody><tr><td>大航海时代4<\/td><td>伙伴档案卡（出身/志愿/专属技能/离队条件）；港口\"投资感\"；弱开局强成长<\/td><td>§13.2.3 具名卡、07 分册建筑、§13.3 年龄曲线<\/td><td>战棋化战斗——与 09 章即兴接舷制冲突<\/td><\/tr><tr><td>CK3<\/td><td>性格=AI效用函数；婚姻继承家系；生老病死人口学；friend/rival 关系网<\/td><td>§13.2.2 五轴、§13.3.2 婚育死亡、§13.2.4 恩义血债<\/td><td>数值密度（压力/计谋/宫廷全案）——GM 一季只有 10 分钟，装不下<\/td><\/tr><tr><td>太吾绘卷<\/td><td>资质×修为双轨；年龄增减属性的生命曲线；人才流动与挖角；奇遇人生事件<\/td><td>§13.3.1 年龄曲线、§13.3.3 年轮表<\/td><td>技能树规模——34 技能七域是上限，不扩<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>一句话血统：<strong>我们模拟水手，不模拟国王。<\/strong> 国王用 14 分册派系层表达。<\/blockquote>\n<h2>13.2 人物维度<\/h2>\n<h3>13.2.1 属性层：五属性通用化（T5.2.1.a 冻结）<\/h3>\n<p>筋骨 / 机敏 / 学识 / 胆魄 / 人望，1–5 五档。PL 与 NPC <strong>同表同义<\/strong>，不另设\"统率/内政\"等平行属性——领兵用领导技能、经营用交易技能（05 分册 34 技能七域全覆盖）。<\/p>\n<ul class='mdlist'><li>PL 生成沿用 04 章（点购或 2d4−1 取均）。<\/li><li>NPC 生成：掷 2d4−1 取均，或直接套<strong>身份模板<\/strong>（船长：胆魄人望优先；账房：学识机敏优先；桨手：筋骨优先——13 章 NPC 生成器七字段兼容）。<\/li><\/ul>\n<p><strong>验收线<\/strong>：任何 NPC 卡上不出现五属性以外的属性数字。<\/p>\n<h3>13.2.2 性格层：五轴（T5.2.2.a）<\/h3>\n<p>每轴 −2…+2 的整数：<br><strong>五轴定义<\/strong>（每轴 −2…+2）<\/p>\n<div class='tbl'><table><thead><tr><th>轴<\/th><th>+2 极<\/th><th>−2 极<\/th><\/tr><\/thead><tbody><tr><td>胆量<\/td><td>鲁莽（先动手后想）<\/td><td>怯懦（先想后动，常常不动）<\/td><\/tr><tr><td>义利<\/td><td>轻财（钱过手就散）<\/td><td>贪婪（钱过手就沾）<\/td><\/tr><tr><td>律欲<\/td><td>苦行（守规矩守到苛刻）<\/td><td>纵欲（规矩是给别人定的）<\/td><\/tr><tr><td>诚诈<\/td><td>直率（说不该说的话）<\/td><td>狡诈（说的都不是真话）<\/td><\/tr><tr><td>情理<\/td><td>重情（恩怨记一辈子）<\/td><td>冷彻（恩怨只记在账上）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>组合称号表 20 组<\/strong>（两轴极值命名；生成见下文）<\/p>\n<div class='tbl'><table><thead><tr><th>组合<\/th><th>称号<\/th><th>一眼读人<\/th><\/tr><\/thead><tbody><tr><td>胆量:2、义利:-2<\/td><td>亡命徒型<\/td><td>打劫不眨眼，见钱不要命<\/td><\/tr><tr><td>胆量:2、义利:2<\/td><td>侠盗型<\/td><td>抢来的散给穷人，散完再去抢<\/td><\/tr><tr><td>胆量:-2、义利:-2<\/td><td>守财鼠型<\/td><td>藏在最安全的地方数最脏的钱<\/td><\/tr><tr><td>胆量:-2、义利:2<\/td><td>舍身济人型<\/td><td>把自己仅有的那点也给人<\/td><\/tr><tr><td>律欲:2、诚诈:-2<\/td><td>伪圣型<\/td><td>戒律背得最熟，账做得最黑<\/td><\/tr><tr><td>律欲:2、诚诈:2<\/td><td>磐石型<\/td><td>说话像盖章，一辈子不违诺<\/td><\/tr><tr><td>律欲:-2、诚诈:-2<\/td><td>醉骗型<\/td><td>酒后的赌咒一句也不能信<\/td><\/tr><tr><td>律欲:-2、诚诈:2<\/td><td>赤子型<\/td><td>坏毛病一堆，唯独嘴是真话<\/td><\/tr><tr><td>情理:2、诚诈:2<\/td><td>挚友型<\/td><td>帮你帮到底，劝你也劝到底<\/td><\/tr><tr><td>情理:2、诚诈:-2<\/td><td>情圣骗型<\/td><td>每一次动情都是真的，每一次撒谎也是<\/td><\/tr><tr><td>情理:-2、诚诈:-2<\/td><td>冷账房型<\/td><td>把人也记成两栏：欠我的，我欠的<\/td><\/tr><tr><td>情理:-2、诚诈:2<\/td><td>明镜型<\/td><td>有话直说，说完不记仇<\/td><\/tr><tr><td>胆量:2、律欲:-2<\/td><td>纵火狂欢型<\/td><td>先烧起来再说，账回头算<\/td><\/tr><tr><td>胆量:2、律欲:2<\/td><td>苦修狂徒型<\/td><td>自律到冷酷，冲锋在最前<\/td><\/tr><tr><td>胆量:-2、律欲:-2<\/td><td>享乐账房型<\/td><td>白天收利钱，晚上花利钱<\/td><\/tr><tr><td>胆量:-2、律欲:2<\/td><td>寺院看守型<\/td><td>一辈子守着门，一次也没推开着过<\/td><\/tr><tr><td>义利:2、情理:2<\/td><td>母亲型<\/td><td>给出去的时候比收下的时候高兴<\/td><\/tr><tr><td>义利:2、情理:-2<\/td><td>圣人账房型<\/td><td>善款分毫不差，心里没有谁<\/td><\/tr><tr><td>义利:-2、情理:2<\/td><td>家贼型<\/td><td>只对最亲近的人下手<\/td><\/tr><tr><td>义利:-2、情理:-2<\/td><td>秤人型<\/td><td>把人放上秤盘，称完论价<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>13.3 生老病死与成长<\/h2>\n<h3>13.3.1 年龄曲线（T5.3.1.a，核心表）<\/h3>\n<p><strong>一段一行，PC/NPC 通用。<\/strong> NPC 重要人物卡带\"年龄\"字段，GM 年轮结算时翻此表。<\/p>\n<div class='tbl'><table><thead><tr><th>段<\/th><th>年龄<\/th><th>属性变化<\/th><th>条款<\/th><\/tr><\/thead><tbody><tr><td>童年<\/td><td>0–12<\/td><td>—<\/td><td>不上桌，仅家系条目（传承素材）<\/td><\/tr><tr><td><strong>少年<\/strong><\/td><td>13–17<\/td><td>属性上限 3；每长 2 岁：筋骨+1、机敏+1<\/td><td><strong>免费成长，不需 XP<\/strong>——身体自己在长<\/td><\/tr><tr><td><strong>青年<\/strong><\/td><td>18–29<\/td><td>属性达峰值（上限 5）<\/td><td>每 5 岁 1 次\"青年领悟\"：任一技能 +1<\/td><\/tr><tr><td><strong>壮年<\/strong><\/td><td>30–44<\/td><td>筋骨机敏保值<\/td><td>学识/人望每 10 年可 +1（经验增值）<\/td><\/tr><tr><td><strong>中年<\/strong><\/td><td>45–54<\/td><td>每 10 年筋骨 −1；HP 上限 −1<\/td><td>开始怕冷怕浪<\/td><\/tr><tr><td><strong>老年<\/strong><\/td><td>55+<\/td><td>每 5 岁筋骨/机敏/胆魄再 −1（最低保 1）<\/td><td>学识/人望不衰可续 +（\"老船长的眼睛\"）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>超龄出海<\/strong>：60+ 每航段结束掷 d20≤6 得 1 级疲劳（07 章疲劳规则）。<\/li><li><strong>单调性验收<\/strong>：少年成长不依赖 XP 成立；老年衰减<strong>不可被天赋豁免<\/strong>——\"幸运之星\"不减龄。<\/li><li><strong>设计意图<\/strong>：PL 老去是特性不是缺陷——跨纪战役时老 PC 可转\"岸上生涯\"（导师/港主 NPC 化）或走传承（§13.3.2c）。<\/li><\/ul>\n<p><strong>起始年龄（T5.3.1.b）<\/strong>：PL 开局掷或选 <strong>16+2d4<\/strong> 岁（16–24）。变体<strong>老手开局<\/strong>：30+2d6 岁（属性峰值但衰减临近，换<strong>天赋多一枚<\/strong>——风险自选）。时间尺度核对：单纪战役 20–40 团 ≈ 5–15 游戏年，PC 大多停留在青年—壮年带，节奏匹配。<\/p>\n<h3>13.3.2 婚育与死亡（T5.3.2.a）<\/h3>\n<p><strong>婚育表<\/strong>：成婚条件=市民身份 + 资产达到所在城温饱档 ×2（03 分册）+ 对方好感 ≥ 交好（恩义 1+）。已婚者每年季末掷 d6：<strong>4+ 得子嗣<\/strong>。子嗣 13 岁升具名卡、可被招募——\"我儿子上了我的船\"是年轮结出来的剧情。<\/p>\n<p><strong>死亡表<\/strong>：重要人物每年季末掷 d20：<\/p>\n<div class='tbl'><table><thead><tr><th>年龄带<\/th><th>病死/意外阈值<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>&lt;55<\/td><td>≤2<\/td><td>慢性病、急病、意外<\/td><\/tr><tr><td>55–64<\/td><td>≤5<\/td><td>衰退带<\/td><\/tr><tr><td>65+<\/td><td>≤8<\/td><td>高危带<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>战死/海难即时结算，不掷本表<\/strong>（08/09 章流程处理）。<\/li><li><strong>疫年加压<\/strong>：所在城触发城市事件\"灾疫\"（09 分册）时阈值 +3——黑死病进程卡（11 分册 P01）下的世界残酷性由表自动表达，GM 不需要额外手硬。<\/li><li><strong>期望口径注<\/strong>：本表对\"生活优渥的重要人物\"模拟均值 55–65 岁，高于史实平民（营养与医疗差异）——GM 注一条即可，不必修正。<\/li><li><strong>死亡三准备<\/strong>沿用 13 章：接班模板 3 分钟 / 遗嘱一句 / 葬礼一个班次。<\/li><\/ul>\n<h3>13.3.2c 继承与传承（T5.3.2.b，CK3 玩法落地）<\/h3>\n<p><strong>资产继承<\/strong>：船份/地产按遗嘱或<strong>法定 1/16 份<\/strong>流转（什一之外的余数充公——保证碎股格局，对接 10.6）。子嗣未成年时启用<strong>托管人条款<\/strong>：托管人代管至 18 岁——阴谋钩自带（托管人监守自盗=现成任务）。<\/p>\n<p><strong>传承开局<\/strong>：PC 死亡/退休时，玩家可开其<strong>子嗣或大副<\/strong>为新 PC，继承四件：<\/p>\n<div class='tbl'><table><thead><tr><th>承继物<\/th><th>份额<\/th><th>附件<\/th><\/tr><\/thead><tbody><tr><td>声望<\/td><td>1/2<\/td><td>称号改\"某某之子/之女\"<\/td><\/tr><tr><td>恩义<\/td><td><strong>全量<\/strong><\/td><td>人情不随人死<\/td><\/tr><tr><td>血债<\/td><td>1/2<\/td><td>世仇减半但不灭<\/td><\/tr><tr><td>遗物<\/td><td>任一件<\/td><td>+ 一个秘密（13 章\"灵魂三件\"的接力）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>强度校准<\/strong>：传承 PC 与新开 PC 强度差 ≤1 级等值（传承 PC 少一枚自由天赋；声望折算按 04 章 XP 换算表执行）。<\/p>\n<h3>13.3.3 年轮事件 d20（T5.3.3.a，太吾奇遇）<\/h3>\n<p>季末年轮结算（14 分册 §14.1 第⑤步）时对每名重要 NPC 掷；PL 逢生日季（玩家自选一季）掷一次：<\/p>\n<div class='tbl'><table><thead><tr><th>d20<\/th><th>事件<\/th><th>落地<\/th><\/tr><\/thead><tbody><tr><td>1–8<\/td><td>平安<\/td><td>无（8 格里的大多数）<\/td><\/tr><tr><td>9–10<\/td><td>得子<\/td><td>婚育表同步；家系条目 +1<\/td><\/tr><tr><td>11–12<\/td><td>疾病<\/td><td>下一季属性 −1（恢复由 GM 定）<\/td><\/tr><tr><td>13<\/td><td>婚嫁<\/td><td>关系网变动（对象入具名池）<\/td><\/tr><tr><td>14<\/td><td>破财<\/td><td>一件资产降级或失去 100–500 银<\/td><\/tr><tr><td>15<\/td><td>得财<\/td><td>100–500 银入账或资产升级契机<\/td><\/tr><tr><td>16<\/td><td>学艺<\/td><td>随机技能 +1<\/td><\/tr><tr><td>17<\/td><td>结仇<\/td><td>血债 +1，对象随机（素材库人名录）<\/td><\/tr><tr><td>18<\/td><td>遇险<\/td><td>下一季缺席——被绑架/沉船获救，留白由 GM 兑现<\/td><\/tr><tr><td>19<\/td><td>奇遇<\/td><td>GM 从 12 分册素材库埋一个钩子<\/td><\/tr><tr><td>20<\/td><td>大变<\/td><td>身份跃迁：升官/破产/出家/出海远行<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>PL 生日戏条款<\/strong>：PL 掷出 19–20 时，GM <strong>必须写一场戏兑现<\/strong>——年轮是剧情源，不是背景噪声。<\/li><li><strong>承接验收<\/strong>：20 条全部可被 12 分册素材库承接（人名录/地物库/反转库）；期望频率：PL 每年 1–2 个非平安事件——推动个人剧情而不喧宾夺主。<\/li><\/ul>\n<h2>13.4 对接条<\/h2>\n<div class='tbl'><table><thead><tr><th>接口<\/th><th>对面<\/th><th>本册字段<\/th><\/tr><\/thead><tbody><tr><td>04 章角色创建<\/td><td>五属性/天赋/灵魂三件<\/td><td>全部沿用；新增\"年龄\"与\"传承\"两字段<\/td><\/tr><tr><td>13 章 NPC 生成器<\/td><td>七字段卡<\/td><td>三档卡逐项兼容（路人=零字段版）<\/td><\/tr><tr><td>10 章五档账本<\/td><td>恩义/血债列<\/td><td>双轨数值直接抄入账本第 5 档<\/td><\/tr><tr><td>变体包 D<\/td><td>\"缘\"轴<\/td><td>恩义≥5 过命=缘轴锁档的数值表达<\/td><\/tr><tr><td>12 分册素材库<\/td><td>人名录/反转库<\/td><td>年轮 17/19/20 条的出料口<\/td><\/tr><tr><td>14 分册世界AI<\/td><td>效用函数/行动表<\/td><td>五轴即权重（§14.2）；关系网即遭遇池开关<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>数据落点：本册规则 + <code>data/npcs.json<\/code>（18 具名，构建脚本 <code>data/build_npcs.py<\/code> 自检：属性/轴值/称号/关系网/12 锚点全建档）。名册渲染在 14 分册 §14.6。<\/blockquote>\n<h2>13.5 本册验收清单<\/h2>\n<ul class='mdlist'><li><label class='task'><input type='checkbox' disabled checked> 三源三件套对照页（含否决理由）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 五轴性格 + 20 组合称号（ENGINE 注入）+ 10 挂点（全部冻结零件）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> NPC 三档面板模板 ×3 + \"何时升档\"条款。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 恩义/血债双轨 + 情理修正 + 记录行格式。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 年龄曲线表（少年免费成长/老年不可豁免衰减）+ 超龄出海。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 婚育表 / 死亡表（疫年 +3）/ 继承 / 传承开局卡。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 年轮事件 d20 + PL 生日戏条款 + 素材库承接。<\/label><\/li><\/ul>","text":"v1 世界引擎 P6 交付（计划05部）。本册回答六个问题：人物维度怎么拆、NPC 面板要不要全量、世界怎么\"真实可成长\"、生老病死的年龄曲线、全地图 AI 怎么跑动、好感与自主决策怎么落地。第 13.5–13.6 节的\"全地图 AI\"拆到 14 分册《世界AI》 ——本册只管\"人\"，那册管\"会动的世界\"。 纪律：五属性与五轴是 PL/NPC 通用的 唯一 属性与性格层；本册所有机制只使用已冻结的三种零件（优势/劣势/触发检定），不新增机制。 13.1 三源三件套对照（T5.1.1.a） 向谁学什么 ——每个采纳件都标了落点；每个否决件都有理由。 来源 采纳件（三件套） 落点 否决件与理由 大航海时代4 伙伴档案卡（出身/志愿/专属技能/离队条件）；港口\"投资感\"；弱开局强成长 §13.2.3 具名卡、07 分册建筑、§13.3 年龄曲线 战棋化战斗——与 09 章即兴接舷制冲突 CK3 性格=AI效用函数；婚姻继承家系；生老病死人口学；friend/rival 关系网 §13.2.2 五轴、§13.3.2 婚育死亡、§13.2.4 恩义血债 数值密度（压力/计谋/宫廷全案）——GM 一季只有 10 分钟，装不下 太吾绘卷 资质×修为双轨；年龄增减属性的生命曲线；人才流动与挖角；奇遇人生事件 §13.3.1 年龄曲线、§13.3.3 年轮表 技能树规模——34 技能七域是上限，不扩 一句话血统： 我们模拟水手，不模拟国王。 国王用 14 分册派系层表达。 13.2 人物维度 13.2.1 属性层：五属性通用化（T5.2.1.a 冻结） 筋骨 / 机敏 / 学识 / 胆魄 / 人望，1–5 五档。PL 与 NPC 同表同义 ，不另设\"统率/内政\"等平行属性——领兵用领导技能、经营用交易技能（05 分册 34 技能七域全覆盖）。 PL 生成沿用 04 章（点购或 2d4−1 取均）。 NPC 生成：掷 2d4−1 取均，或直接套 身份模板 （船长：胆魄人望优先；账房：学识机敏优先；桨手：筋骨优先——13 章 NPC 生成器七字段兼容）。 验收线 ：任何 NPC 卡上不出现五属性以外的属性数字。 13.2.2 性格层：五轴（T5.2.2.a） 每轴 −2…+2 的整数： 五轴定义 （每轴 −2…+2） 轴 +2 极 −2 极 胆量 鲁莽（先动手后想） 怯懦（先想后动，常常不动） 义利 轻财（钱过手就散） 贪婪（钱过手就沾） 律欲 苦行（守规矩守到苛刻） 纵欲（规矩是给别人定的） 诚诈 直率（说不该说的话） 狡诈（说的都不是真话） 情理 重情（恩怨记一辈子） 冷彻（恩怨只记在账上） 组合称号表 20 组 （两轴极值命名；生成见下文） 组合 称号 一眼读人 胆量:2、义利:-2 亡命徒型 打劫不眨眼，见钱不要命 胆量:2、义利:2 侠盗型 抢来的散给穷人，散完再去抢 胆量:-2、义利:-2 守财鼠型 藏在最安全的地方数最脏的钱 胆量:-2、义利:2 舍身济人型 把自己仅有的那点也给人 律欲:2、诚诈:-2 伪圣型 戒律背得最熟，账做得最黑 律欲:2、诚诈:2 磐石型 说话像盖章，一辈子不违诺 律欲:-2、诚诈:-2 醉骗型 酒后的赌咒一句也不能信 律欲:-2、诚诈:2 赤子型 坏毛病一堆，唯独嘴是真话 情理:2、诚诈:2 挚友型 帮你帮到底，劝你也劝到底 情理:2、诚诈:-2 情圣骗型 每一次动情都是真的，每一次撒谎也是 情理:-2、诚诈:-2 冷账房型 把人也记成两栏：欠我的，我欠的 情理:-2、诚诈:2 明镜型 有话直说，说完不记仇 胆量:2、律欲:-2 纵火狂欢型 先烧起来再说，账回头算 胆量:2、律欲:2 苦修狂徒型 自律到冷酷，冲锋在最前 胆量:-2、律欲:-2 享乐账房型 白天收利钱，晚上花利钱 胆量:-2、律欲:2 寺院看守型 一辈子守着门，一次也没推开着过 义利:2、情理:2 母亲型 给出去的时候比收下的时候高兴 义利:2、情理:-2 圣人账房型 善款分毫不差，心里没有谁 义利:-2、情理:2 家贼型 只对最亲近的人下手 义利:-2、情理:-2 秤人型 把人放上秤盘，称完论价 13.3 生老病死与成长 13.3.1 年龄曲线（T5.3.1.a，核心表） 一段一行，PC/NPC 通用。 NPC 重要人物卡带\"年龄\"字段，GM 年轮结算时翻此表。 段 年龄 属性变化 条款 童年 0–12 — 不上桌，仅家系条目（传承素材） 少年 13–17 属性上限 3；每长 2 岁：筋骨+1、机敏+1 免费成长，不需 XP ——身体自己在长 青年 18–29 属性达峰值（上限 5） 每 5 岁 1 次\"青年领悟\"：任一技能 +1 壮年 30–44 筋骨机敏保值 学识/人望每 10 年可 +1（经验增值） 中年 45–54 每 10 年筋骨 −1；HP 上限 −1 开始怕冷怕浪 老年 55+ 每 5 岁筋骨/机敏/胆魄再 −1（最低保 1） 学识/人望不衰可续 +（\"老船长的眼睛\"） 超龄出海 ：60+ 每航段结束掷 d20≤6 得 1 级疲劳（07 章疲劳规则）。 单调性验收 ：少年成长不依赖 XP 成立；老年衰减 不可被天赋豁免 ——\"幸运之星\"不减龄。 设计意图 ：PL 老去是特性不是缺陷——跨纪战役时老 PC 可转\"岸上生涯\"（导师/港主 NPC 化）或走传承（§13.3.2c）。 起始年龄（T5.3.1.b） ：PL 开局掷或选 16+2d4 岁（16–24）。变体 老手开局 ：30+2d6 岁（属性峰值但衰减临近，换 天赋多一枚 ——风险自选）。时间尺度核对：单纪战役 20–40 团 ≈ 5–15 游戏年，PC 大多停留在青年—壮年带，节奏匹配。 13.3.2 婚育与死亡（T5.3.2.a） 婚育表 ：成婚条件=市民身份 + 资产达到所在城温饱档 ×2（03 分册）+ 对方好感 ≥ 交好（恩义 1+）。已婚者每年季末掷 d6： 4+ 得子嗣 。子嗣 13 岁升具名卡、可被招募——\"我儿子上了我的船\"是年轮结出来的剧情。 死亡表 ：重要人物每年季末掷 d20： 年龄带 病死/意外阈值 说明 &lt;55 ≤2 慢性病、急病、意外 55–64 ≤5 衰退带 65+ ≤8 高危带 战死/海难即时结算，不掷本表 （08/09 章流程处理）。 疫年加压 ：所在城触发城市事件\"灾疫\"（09 分册）时阈值 +3——黑死病进程卡（11 分册 P01）下的世界残酷性由表自动表达，GM 不需要额外手硬。 期望口径注 ：本表对\"生活优渥的重要人物\"模拟均值 55–65 岁，高于史实平民（营养与医疗差异）——GM 注一条即可，不必修正。 死亡三准备 沿用 13 章：接班模板 3 分钟 / 遗嘱一句 / 葬礼一个班次。 13.3.2c 继承与传承（T5.3.2.b，CK3 玩法落地） 资产继承 ：船份/地产按遗嘱或 法定 1/16 份 流转（什一之外的余数充公——保证碎股格局，对接 10.6）。子嗣未成年时启用 托管人条款 ：托管人代管至 18 岁——阴谋钩自带（托管人监守自盗=现成任务）。 传承开局 ：PC 死亡/退休时，玩家可开其 子嗣或大副 为新 PC，继承四件： 承继物 份额 附件 声望 1/2 称号改\"某某之子/之女\" 恩义 全量 人情不随人死 血债 1/2 世仇减半但不灭 遗物 任一件 + 一个秘密（13 章\"灵魂三件\"的接力） 强度校准 ：传承 PC 与新开 PC 强度差 ≤1 级等值（传承 PC 少一枚自由天赋；声望折算按 04 章 XP 换算表执行）。 13.3.3 年轮事件 d20（T5.3.3.a，太吾奇遇） 季末年轮结算（14 分册 §14.1 第⑤步）时对每名重要 NPC 掷；PL 逢生日季（玩家自选一季）掷一次： d20 事件 落地 1–8 平安 无（8 格里的大多数） 9–10 得子 婚育表同步；家系条目 +1 11–12 疾病 下一季属性 −1（恢复由 GM 定） 13 婚嫁 关系网变动（对象入具名池） 14 破财 一件资产降级或失去 100–500 银 15 得财 100–500 银入账或资产升级契机 16 学艺 随机技能 +1 17 结仇 血债 +1，对象随机（素材库人名录） 18 遇险 下一季缺席——被绑架/沉船获救，留白由 GM 兑现 19 奇遇 GM 从 12 分册素材库埋一个钩子 20 大变 身份跃迁：升官/破产/出家/出海远行 PL 生日戏条款 ：PL 掷出 19–20 时，GM 必须写一场戏兑现 ——年轮是剧情源，不是背景噪声。 承接验收 ：20 条全部可被 12 分册素材库承接（人名录/地物库/反转库）；期望频率：PL 每年 1–2 个非平安事件——推动个人剧情而不喧宾夺主。 13.4 对接条 接口 对面 本册字段 04 章角色创建 五属性/天赋/灵魂三件 全部沿用；新增\"年龄\"与\"传承\"两字段 13 章 NPC 生成器 七字段卡 三档卡逐项兼容（路人=零字段版） 10 章五档账本 恩义/血债列 双轨数值直接抄入账本第 5 档 变体包 D \"缘\"轴 恩义≥5 过命=缘轴锁档的数值表达 12 分册素材库 人名录/反转库 年轮 17/19/20 条的出料口 14 分册世界AI 效用函数/行动表 五轴即权重（§14.2）；关系网即遭遇池开关 数据落点：本册规则 + data/npcs.json （18 具名，构建脚本 data/build_npcs.py 自检：属性/轴值/称号/关系网/12 锚点全建档）。名册渲染在 14 分册 §14.6。 13.5 本册验收清单 三源三件套对照页（含否决理由）。 五轴性格 + 20 组合称号（ENGINE 注入）+ 10 挂点（全部冻结零件）。 NPC 三档面板模板 ×3 + \"何时升档\"条款。 恩义/血债双轨 + 情理修正 + 记录行格式。 年龄曲线表（少年免费成长/老年不可豁免衰减）+ 超龄出海。 婚育表 / 死亡表（疫年 +3）/ 继承 / 传承开局卡。 年轮事件 d20 + PL 生日戏条款 + 素材库承接。"},{"num":"14","title":"世界AI","vol":"卷四 · 人物 · AI · 文本 · 技艺","skeleton":false,"html":"<blockquote class='quote'>v1 世界引擎 P6 交付（计划05部 §5.4–5.5）。本册给 GM 一台\"世界自己在动\"的机器：<strong>每一季 ≤10 分钟、≤25 次掷骰/标记<\/strong>的预算内，让 NPC 自己跑航程、城市自己换市况、势力自己推进野心。玩家通过<strong>四触点<\/strong>感知这一切，永远不许 GM 直读后台数据给玩家。<\/blockquote>\n<h2>14.1 三层架构总纲（T5.4.1.a）<\/h2>\n<div class='tbl'><table><thead><tr><th>层<\/th><th>颗粒<\/th><th>频率<\/th><th>结算内容<\/th><th>数据落点<\/th><\/tr><\/thead><tbody><tr><td><strong>具名层<\/strong><\/td><td>≤100 人<\/td><td>季末<\/td><td>效用决策 + 行动 + 幽灵航程 + 年轮（13 分册 §13.3.3）<\/td><td><code>npcs.json<\/code><\/td><\/tr><tr><td><strong>城市层<\/strong><\/td><td>120 城（一级 48 全算 / 二级 72 惰性）<\/td><td>季末<\/td><td>三数字：城经验 / 市况条重掷 / 驻港池刷新<\/td><td><code>prices.json<\/code> + <code>cities.json<\/code><\/td><\/tr><tr><td><strong>派系层<\/strong><\/td><td>8–12 家在编<\/td><td><strong>月<\/strong> tick<\/td><td>五步回合（§14.5）<\/td><td><code>factions.json<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>职责红线<\/strong>（三层互不越界）：<\/p>\n<ul class='mdlist'><li>具名<strong>不推<\/strong>城经验——城经验是玩家与贸易的事（09 分册城市发展）；<\/li><li>城市<strong>不造<\/strong>人物——驻港池只从具名池抽，不从天上生成；<\/li><li>派系<strong>不直接杀人<\/strong>——它通过资产、任务与价格表达敌意，暗杀走任务卡。<\/li><\/ul>\n<p><strong>GM 单季沙漏预算<\/strong>（第⑤步\"AI 批量更新\"，总预算 ≤10 分钟）：<\/p>\n<div class='tbl'><table><thead><tr><th>步<\/th><th>内容<\/th><th>预算<\/th><\/tr><\/thead><tbody><tr><td>①<\/td><td>具名层：5–10 名活跃 NPC 各掷决策（d20 查行动表）<\/td><td>4 分钟 / ≤12 掷<\/td><\/tr><tr><td>②<\/td><td>幽灵航程：批量更新 ≤10 条线<\/td><td>2 分钟 / 无掷（登记即可）<\/td><\/tr><tr><td>③<\/td><td>城市层：48 城 ×（市况重掷 + 三数字）<\/td><td>2 分钟（09 分册市况条逐城 30 秒内）<\/td><\/tr><tr><td>④<\/td><td>派系层：在编家各跑 1 次月 tick（战役月=3 时取 3 次的最简并写法：<strong>每季跑 3 tick、每次 30 秒<\/strong>）<\/td><td>2 分钟 / ≤8 掷<\/td><\/tr><tr><td>⑤<\/td><td>年轮：重要 NPC 各掷 d20（13 分册死亡表合并在此）<\/td><td>顺手并入①<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>合计 ≤10 分钟、≤25 次掷骰/标记——验收线。KP 面板（可视化工具）把①③④做成按钮后可压到 3 分钟，但纸上流程以此为上限。<\/blockquote>\n<h2>14.2 具名层：效用函数与行动表（T5.4.2.a）<\/h2>\n<p>每名具名 NPC 三字段（<code>npcs.json<\/code> 已带）：<\/p>\n<ul class='mdlist'><li><strong>野心<\/strong>（一句话，来自 13 章\"他想要的\"）＋<strong>野心类<\/strong>归档五类之一：发财 / 复仇 / 扬名 / 安稳 / 权势（查行动表用；血债 ≥5 时自动转\"复仇\"族）；<\/li><li><strong>手段档<\/strong>：军 / 商 / 谋三选一；<\/li><li><strong>当前处境<\/strong>（在哪/有没有船/欠不欠债——决策结果<strong>写回<\/strong>这里）。<\/li><\/ul>\n<p><strong>季末决策<\/strong>＝掷 d20＋性格权重修正→查<strong>行动表<\/strong>→执行→结果写回处境。<strong>行动成败<\/strong>：d20＋权重 ≥12 成功（成功=效果落地/处境改善；失败=处境恶化一档——船没了→下季“受雇于人”）。<\/p>\n<h3>14.2.1 行动表母版（3 手段 × 5 野心 = 15 行动族）<\/h3>\n<div class='tbl'><table><thead><tr><th>野心＼手段<\/th><th>军<\/th><th>商<\/th><th>谋<\/th><\/tr><\/thead><tbody><tr><td><strong>发财<\/strong><\/td><td>私掠肥线／护航要价／卖武装<\/td><td>接走私单／垄断一舱／放高利贷<\/td><td>情报贩子／假货洗真／双头吃差价<\/td><\/tr><tr><td><strong>复仇<\/strong><\/td><td>追踪→伏击→决斗邀请（三选）<\/td><td>挤垮其货源／买断其债／商誉抹黑<\/td><td>嫁祸于人／泄其航线／断其情报<\/td><\/tr><tr><td><strong>扬名<\/strong><\/td><td>单挑扬威／抢第一冲锋／烧旗留名<\/td><td>包下大单／建商行总部／设宴结盟<\/td><td>名录立传／煽动风评／代言禁书<\/td><\/tr><tr><td><strong>安稳<\/strong><\/td><td>驻港编外武力／剿匪换地盘／当教官<\/td><td>买铺置业／囤粮过冬／投保避险<\/td><td>换旗易主／销毁旧账／隐姓埋名<\/td><\/tr><tr><td><strong>权势<\/strong><\/td><td>兵变拥立／武装调停／索求封地<\/td><td>行会席位／官府包税／联姻结盟<\/td><td>策反骨干／构陷上官／传谣立威<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>每格是一族（3 个具体行动），掷 d3 选其一。<strong>复仇例外条款<\/strong>：野心\"复仇\"且对某人血债 ≥5 时，行动表<strong>缩短<\/strong>为对应手段档的三个复仇行动——执念压倒一切（13 分册恩义/血债双轨）。<\/blockquote>\n<h3>14.2.2 五轴权重速查（性格→决策修正）<\/h3>\n<div class='tbl'><table><thead><tr><th>轴值<\/th><th>修正<\/th><\/tr><\/thead><tbody><tr><td>胆量+2<\/td><td>军族行动 d20 +2；谋族 −2<\/td><\/tr><tr><td>胆量−2<\/td><td>安稳族 +2；军族 −2<\/td><\/tr><tr><td>义利−2<\/td><td>\"发财\"野心时加投\"坑合作伙伴\"行动（商/谋族附加行）；分赃私藏冲动（13 分册挂点 3）<\/td><\/tr><tr><td>义利+2<\/td><td>\"安稳\"野心时\"投保避险\"优先级最高<\/td><\/tr><tr><td>律欲+2<\/td><td>\"安稳\"+2；同族行动连续两季不重复<\/td><\/tr><tr><td>律欲−2<\/td><td>赌局/纵欲事件插队（GM 可掷触发检定打断本季行动）<\/td><\/tr><tr><td>诚诈−2<\/td><td>全表加一条\"违约\"暗行（GM 密掷，得手则财 +、信誉债 +）<\/td><\/tr><tr><td>诚诈+2<\/td><td>联盟类行动（设宴/联姻/调停）+2<\/td><\/tr><tr><td>情理+2<\/td><td>复仇族一旦入表<strong>永不自然退出<\/strong>（恩怨记一辈子）<\/td><\/tr><tr><td>情理−2<\/td><td>复仇族两年后自动退出（账只记两栏，翻篇）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>涌现测试验收<\/strong>：同一 NPC 用不同五轴变体推 3 季，行为轨迹符合性格且<strong>不重复<\/strong>——试航包 <code>sandbox_test.py<\/code> 的 AI 季循环自测执行此验收。<\/p>\n<h3>14.2.3 NPC 船队跑动：幽灵航程（T5.4.2.b）<\/h3>\n<p>有船的具名 NPC 每季一次<strong>航线掷<\/strong>：<\/p>\n<ol class='mdlist'><li>GM 在其野心两端点（如\"果阿↔亚丁\"）连线；<\/li><li>掷出发旬（d6 = 第几旬离港）＋按船型速度档（06 分册）在宏轨日历上落一段<strong>幽灵航程<\/strong>；<\/li><li>登记进<strong>幽灵航程页<\/strong>（挂历式：一行一线：<code>船主｜A↔B｜第 X 旬出｜历时 Y 天<\/code>）。<\/li><\/ol>\n<p><strong>与 PL 相遇判定<\/strong>：PL 航程与幽灵航程<strong>同期同海区<\/strong>时，季中掷 d6——<\/p>\n<div class='tbl'><table><thead><tr><th>d6<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1–2<\/td><td>擦肩不觉（GM 心里有数即可）<\/td><\/tr><tr><td>3–4<\/td><td>同航线远远望见（帆影/旗号，可改航）<\/td><\/tr><tr><td>5<\/td><td>港内相遇（酒馆/码头场景自动成立）<\/td><\/tr><tr><td>6<\/td><td>直接遭遇事件（敌对=海战；中立=剧情钩）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>GM 无需实时追踪坐标：<strong>两条日历条一叠即知<\/strong>。批量更新一批 ≤10 条线；密度验收：PL 一年跨洋 2 次 vs 10 条幽灵线，相遇 1–3 次——竞争者船队（调研4启示）零成本实现。示例线：佐娅·克内日娃（N18）布鲁日↔诺夫哥罗德。<\/blockquote>\n<h2>14.3 城市层：三数字结算（T5.4.3.a）<\/h2>\n<p>季末每城只动三个数字：<\/p>\n<ol class='mdlist'><li><strong>城经验<\/strong>：玩家交易/任务/建设留下的发展值（09 分册城市发展条款）；<\/li><li><strong>市况条重掷<\/strong>：库存轨与行情带按 09 分册季末规则刷新；<\/li><li><strong>驻港池刷新<\/strong>：从具名池抽 1–3 人\"本季在港\"，写进世界一瞥——玩家回港总有熟人或新面孔。<\/li><\/ol>\n<p><strong>惰性结算<\/strong>：一级 48 城全算；二级 72 城只在被 PL 光顾时算（GM 用\"四问法\"30 秒定价，09 分册）。<\/p>\n<h2>14.4 派系层：faction turn（T5.4.3.b，SWN 定制）<\/h2>\n<p>在编 8–12 家（按纪窗从 <code>factions.json<\/code> 裁），每<strong>月<\/strong> tick 一次（跑团节奏密，比 SWN 季快一档；纸面简并写法=每季 3 tick）。<\/p>\n<p><strong>属性三枚<\/strong>：军 / 财 / 谍，各 1–8（=HP 池，降到 0=势力退出本战役舞台，前史形态接管）。<strong>资产<\/strong>：舰队/商站/特许状/要塞，各有属性门槛与维护成本。<\/p>\n<p><strong>回合五步<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>步<\/th><th>内容<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>① 收入<\/td><td>财资产产出<\/td><td>每资产 50 银 × 财档 ÷2（入势力库，GM 心记即可）<\/td><\/tr><tr><td>② 维护<\/td><td>每资产付维护<\/td><td>付不起→该资产<strong>降级<\/strong>一档；军财谍任意归 0→失去一项对应资产<\/td><\/tr><tr><td>③ 目标推进<\/td><td>进度钟 +1 格<\/td><td>本月无行动也推 1 格；钟走满→野心达成，世界侧剧变（写进世界一瞥）<\/td><\/tr><tr><td>④ 行动<\/td><td>掷属性骰<\/td><td>从军/财/谍行动池选一条：<strong>d20 ≤（属性×2+4）成功<\/strong>；成功=效果落地或钟 +1；失败=下月维护检定劣势<\/td><\/tr><tr><td>⑤ PL 接口<\/td><td>敌意落地<\/td><td>行动涉及玩家所在海区→生成 04 部任务（<strong>派系是任务的最大买家<\/strong>——闭环）；PL 可：受雇（任务侧）/破坏（打资产）/入股（财≥4，S4 特许公司专用）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>指定验收案例（<code>factions.json<\/code> 联合省卡 <code>sandbox<\/code> 字段）<\/strong>：护航卡特尔→保费上涨的因果链三步传导——势力决策→具名反应→表页变化，全链可复现。<\/p>\n<h2>14.5 四触点（T5.5.1.a，AI 的全部输出面）<\/h2>\n<div class='tbl'><table><thead><tr><th>触点<\/th><th>玩家看到<\/th><th>数据源<\/th><\/tr><\/thead><tbody><tr><td><strong>任务板<\/strong><\/td><td>派系/具名的行动变成委托<\/td><td>faction ⑤ / NPC 行动<\/td><\/tr><tr><td><strong>港内场景<\/strong><\/td><td>驻港池=酒馆名单<\/td><td>城市层第 3 数字<\/td><\/tr><tr><td><strong>航程遭遇<\/strong><\/td><td>幽灵线的帆影与相遇<\/td><td>§14.2.3<\/td><\/tr><tr><td><strong>世界一瞥<\/strong><\/td><td>季末三行\"谁死了谁升了\"<\/td><td>年轮+钟+幽灵航程注销<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>红线<\/strong>：不许 GM 直读后台数据给玩家——AI 的输出只能走这四个窗口（无第五出口）。世界一瞥的播报技艺见 16 分册 §16.7（句库 72 条，三腔）。<\/blockquote>\n<h2>14.6 具名池名册与势力档案<\/h2>\n<h3>14.6a 具名池名册（18 名＝12 锚点 + 6 名 S1 起手；三档规则见 13 分册 §13.2.3）<\/h3>\n<div class='tbl'><table><thead><tr><th>卡<\/th><th>名<\/th><th>纪<\/th><th>驻港<\/th><th>所属<\/th><th>手段<\/th><th>野心<\/th><\/tr><\/thead><tbody><tr><td>N01<\/td><td>“血鸦”英格丽德·萨尔摩<\/td><td>S4–S5<\/td><td>盐叉湾<\/td><td>海盗共和国（血鸦海岸）<\/td><td>谋<\/td><td>让分账表成为血鸦海岸唯一被遵守的法律<\/td><\/tr><tr><td>N02<\/td><td>塔古斯港务大臣 阿兰达伯爵<\/td><td>S4–S5<\/td><td>塔古斯<\/td><td>南方王冠（伊比利亚式，塔古斯为都）<\/td><td>商<\/td><td>让关税收得够养半支舰队，而他本人看起来一直不富裕<\/td><\/tr><tr><td>N03<\/td><td>制图师行会会长 老范·德·米尔<\/td><td>S4–S5<\/td><td>阿姆斯特丹<\/td><td>制图师与商团行会<\/td><td>谋<\/td><td>买下所有他没能亲眼看见的东西<\/td><\/tr><tr><td>N04<\/td><td>审判官宣审判事 迭戈·德·科瓦<\/td><td>S4–S5<\/td><td>塞维利亚<\/td><td>至圣座与审判庭<\/td><td>谋<\/td><td>把“该烧的”和“不该烧的”分清楚——名单由他自己定<\/td><\/tr><tr><td>N05<\/td><td>女船东 玛丽亚·克鲁兹<\/td><td>S4–S5<\/td><td>塔古斯<\/td><td>独立<\/td><td>商<\/td><td>把十七条船的份子攒成没人能没收的 \/td><td>军 4<\/td><td>海峡通行税卡<\/td><\/tr><tr><td>航路保密档案库<\/td><td>谍 5<\/td><td>航海志 national secret；泄密即叛国<\/td><\/tr><tr><td>Christo 耶稣会传教网<\/td><td>谍 4<\/td><td>亚洲情报与人和<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>钟<\/th><\/tr><\/thead><tbody><tr><td>锁死好望角航线知识<\/td><td>6 格<\/td><\/tr><tr><td>拿下马六甲（S2 末史实）<\/td><td>6 格<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>军行动池<\/strong>：【通行证体系】印度洋无卡船遭遇检定 +2 难；【要塞炮舰】封锁敌对港一季（亚丁/果阿带）<\/li><li><strong>财行动池<\/strong>：【胡椒专营】里斯本胡椒到岸价官方统一定价，行情骰封顶 1.6；【承包制】出售某航线三年承包权（PL 大宗玩法）<\/li><li><strong>谍行动池<\/strong>：【航图管制】目标势力海图资产贬值为废纸（一次）；【反间新航路】窃取一国保密档案（进度钟 +2 格）<\/li><li><strong>PL 接口<\/strong>：受雇——王室探航/堡塞补给（P06 进程卡主委托源）；破坏——泄航图=叛国罪（律法 DV18 级麻烦）；入股——不可；承包制近似（财≥4，竞标）<\/li><li><strong>↳ 改什么<\/strong>：11 分册 P06 进程卡；08 分册好望角门控<\/li><li><strong>注<\/strong>：S2 主线派系；与西班牙双王同室操作（伊比利亚联姻线）。<\/li><\/ul>\n<h4>西班牙双王（卡斯蒂利亚王冠）（S2–S3｜军6 财6 谍3）<\/h4>\n<ul class='mdlist'><li><strong>信条<\/strong>：海是教皇画的线以内的，线以内的都是我们的。<\/li><li><strong>形态演进<\/strong>：S4=并入南方王冠（1580 并冠）；S5=白银线与无敌舰队的遗产<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>资产<\/th><th>门槛<\/th><th>注<\/th><\/tr><\/thead><tbody><tr><td>大帆船护航体系<\/td><td>军 6<\/td><td>白银船队 convoy，季风级时刻表<\/td><\/tr><tr><td>塞维利亚通商院<\/td><td>财 6<\/td><td>殖民地贸易总闸+航海学校<\/td><\/tr><tr><td>分海诏书<\/td><td>谍 5<\/td><td>合法性武器：教廷背书的海洋划界<\/td><\/tr><tr><td>殖民地监理制<\/td><td>财 4<\/td><td>总督+监理官双头，贪腐与效率并存<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>钟<\/th><\/tr><\/thead><tbody><tr><td>白银船队准点回港<\/td><td>6 格<\/td><\/tr><tr><td>压住加勒比私掠<\/td><td>4 格<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>军行动池<\/strong>：【白银 convoy】护航期大西洋敌遇 −2 档；抽成 1/5；【焦海岸令】加勒比非盟港补给 −1 档一季<\/li><li><strong>财行动池<\/strong>：【王室专营】殖民地注册船（PL）享运费保护价 +10%；【白银汇票】塞维利亚—新大陆汇兑（10.5 贵金属行市接口）<\/li><li><strong>谍行动池<\/strong>：【宗教裁判】目标人物在伊比利亚港口区涉律法检定 +3 难；【大使密约】分裂两个敌对势力（一次，进度钟 +1 格）<\/li><li><strong>PL 接口<\/strong>：受雇——白银船队护航/殖民地运力（S2–S3 大宗主单）；破坏——劫白银船=王 S4–S5｜军5 财4 谍5）<\/h4>\n<ul class='mdlist'><li><strong>信条<\/strong>：不被承认地活着，并且继续赚钱。<\/li><li><strong>形态演进<\/strong>：S3=私枭圆桌（前史形态）；S1=无（此期海盗=散帮，不入派系层）<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>资产<\/th><th>门槛<\/th><th>注<\/th><\/tr><\/thead><tbody><tr><td>盐叉湾自由港<\/td><td>财 4<\/td><td>销赃实现率 1/2；恶名 60+ 唯一接待处<\/td><\/tr><tr><td>分账表法统<\/td><td>谍 5<\/td><td>比帝国更被遵守的法律（N01/N09）<\/td><\/tr><tr><td>浅水游击队<\/td><td>军 5<\/td><td>熟悉每处浅水的散快船<\/td><\/tr><tr><td>赎金掮客网<\/td><td>财 3<\/td><td>9.9 俘虏赎金结算台<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>钟<\/th><\/tr><\/thead><tbody><tr><td>活到下一个季节<\/td><td>4 格<\/td><\/tr><tr><td>让某个大国承认它（戏剧长线）<\/td><td>8 格<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>军行动池<\/strong>：【联合出击】声望 85+：四–六条船听 PL 号令一次；【浅水伏击】指定海区遭遇战 +1 档（GM 选定）<\/li><li><strong>财行动池<\/strong>：【销赃旺季】血鸦海岸销赃实现率 1/2→2/3（一季）；【挂旗税】向商船收“保旗费”：不缴者遇袭 +1 档<\/li><li><strong>谍行动池<\/strong>：【港内名单】卖一份敌国清单（70+ 解锁的反向：黑市版）；【栽赃洗白】把一桩劫掠“洗”成一桩生意（或反向）<\/li><li><strong>PL 接口<\/strong>：受雇——只有现金的脏活（报酬高、体面为负）；破坏——打盐叉湾=恶名再高也进不了门；入股——船份制（10.6 原生玩法：入伙即入股）<\/li><li><strong>↳ 改什么<\/strong>：12.3 ⑦；10.4/10.7/10.8<\/li><li><strong>注<\/strong>：10.8 恶名体系的派系侧出口。<\/li><\/ul>\n<h4>内陆王朝（新大陆）（S2–S3–S4–S5｜军6 财3 谍3）<\/h4>\n<ul class='mdlist'><li><strong>信条<\/strong>：让海岸线以外的一切保持原样。<\/li><li><strong>形态演进<\/strong>：S2=阿兹特克/印加帝国（未被接触）；S3=被征服的腹地与抵抗；S4=内陆王朝（本卡主场）<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>资产<\/th><th>门槛<\/th><th>注<\/th><\/tr><\/thead><tbody><tr><td>陆路通道<\/td><td>军 6<\/td><td>8.5 原住民三问的全部效力；40+ 解锁“可以走陆路”<\/td><\/tr><tr><td>不被记录的人口<\/td><td>财 3<\/td><td>海岸图上永远空白的地带<\/td><\/tr><tr><td>高原金矿记忆<\/td><td>财 4<\/td><td>12.7 秘密①的地理本体<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>钟<\/th><\/tr><\/thead><tbody><tr><td>把边境线停在海岸<\/td><td>6 格<\/td><\/tr><tr><td>一笔改写规则的生意（85+）<\/td><td>8 格<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>军行动池<\/strong>：【关门】某陆桥走廊本季关闭（09 分册陆桥）；【海岸示威】殖民港盟约窗口 −1 档<\/li><li><strong>财行动池<\/strong>：【以物易物特许】特定货品（可可/毛皮）产地价直供（绕开殖民税）；【不卖】谈判破裂：目标港土产断供一季<\/li><li><strong>谍行动池<\/strong>：【引路人】给一次内陆向导（8.3 探索判定优势）；【假金脉】让一支殖民探险队永远消失（12.7 秘密①的注脚）<\/li><li><strong>PL 接口<\/strong>：受雇——（罕见）它开口雇人=剧情级事件；破坏——别抢它。抢=战役降一档难度（也降一档体面）；入股——做一笔生意（85+：一支军队替你们说话）<\/li><li><strong>↳ 改什么<\/strong>：12.3 ⑧（全章最重要的一张卡）；8.5 盟约<\/li><li><strong>注<\/strong>：从不在海上出现；唯一能让玩家的船变成次要角色的势力。<\/li><\/ul>\n<h4>东岛幕府（S4–S5｜军5 财3 谍6）<\/h4>\n<ul class='mdlist'><li><strong>信条<\/strong>：只开一扇窗，并且决定谁从窗里递东西进来。<\/li><li><strong>形态演进<\/strong>：S1=勘合船时代（明廷体系内）；S3=战国大名海贼众（前史形态）；S5=锁国下的出岛窗<\/li><\/ul>\n<div class='tbl'><table><thead><tr><th>资产<\/th><th>门槛<\/th><th>注<\/th><\/tr><\/thead><tbody><tr><td>末灯唯一泊位<\/td><td>财 3<\/td><td>瓷器与漆的产地价；违禁=即刻敌对<\/td><\/tr><tr><td>寺社奉行会签状<\/td><td>谍 6<\/td><td>准入状（律法 DV18）<\/td><\/tr><tr><td>通事体系<\/td><td>谍 4<\/td><td>N10：窗内翻译即政策<\/td><\/tr><tr><td>朱印船遗迹<\/td><td>军 2<\/td><td>旧航海特许的档案余威<\/td><\/tr><\/tbody><\/table><\/div>\n<div class='tbl'><table><thead><tr><th>目标<\/th><th>钟<\/th><\/tr><\/thead><tbody><tr><td>一扇窗开得刚刚好<\/td><td>4 格<\/td><\/tr><tr><td>窗外的世界不进来<\/td><td>6 格<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class='mdlist'><li><strong>军行动池<\/strong>：【海岸警备】无状船近岸=敌对（无检定）；【驱逐葡船（S4 史实）】某天主教势力东亚资产清零<\/li><li><strong>财行动池<\/strong>：【窗税】末灯成交抽 20%；持状者 10%；【限品令】瓷器/漆出口配额（价格支撑）<\/li><li><strong>谍行动池<\/strong>：【会签审查】PL 准入状申请：律法 DV18，失败即名单；【通事耳目】窗内一切对话自动被记录（GM 知情权）<\/li><li><strong>PL 接口<\/strong>：受雇——窗内采买代办（12.4 末港玩法）；破坏——走私=即刻敌对（10.4 敌对档顶格）；入股——不可；体面与耐心是唯一货币<\/li><li><strong>↳ 改什么<\/strong>：12.3 ⑨；12.4 末灯港<\/li><li><strong>注<\/strong>：GM 只需要八家时，并入 cartographers 作“东向窗口”。<\/li><\/ul>\n<blockquote class='quote'>月 tick 五步：①收入 ②维护 ③目标推进（进度钟） ④行动（掷属性骰） ⑤与 PL 接口——详见 14 分册 §14.5。<\/blockquote>\n<h2>14.7 本册验收清单<\/h2>\n<ul class='mdlist'><li><label class='task'><input type='checkbox' disabled checked> 三层架构图 + 职责红线表 + 沙漏预算（≤10 分钟 / ≤25 掷）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 效用行动表 15 族 ×3 行动 + 复仇收缩条款 + 五轴权重 10 条。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 幽灵航程登记页 + 相遇判定 d6 + 密度验收线。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 城市三数字 + 48/72 惰性分界。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> faction turn 五步 + 进度钟 + 属性骰 + 联合省沙盘因果链。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 四触点 + \"无第五出口\"红线。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 12 章 12 NPC + S1 起手 6 名全部建档入具名池（§14.6 名册）。<\/label><\/li><\/ul>","text":"v1 世界引擎 P6 交付（计划05部 §5.4–5.5）。本册给 GM 一台\"世界自己在动\"的机器： 每一季 ≤10 分钟、≤25 次掷骰/标记 的预算内，让 NPC 自己跑航程、城市自己换市况、势力自己推进野心。玩家通过 四触点 感知这一切，永远不许 GM 直读后台数据给玩家。 14.1 三层架构总纲（T5.4.1.a） 层 颗粒 频率 结算内容 数据落点 具名层 ≤100 人 季末 效用决策 + 行动 + 幽灵航程 + 年轮（13 分册 §13.3.3） npcs.json 城市层 120 城（一级 48 全算 / 二级 72 惰性） 季末 三数字：城经验 / 市况条重掷 / 驻港池刷新 prices.json + cities.json 派系层 8–12 家在编 月 tick 五步回合（§14.5） factions.json 职责红线 （三层互不越界）： 具名 不推 城经验——城经验是玩家与贸易的事（09 分册城市发展）； 城市 不造 人物——驻港池只从具名池抽，不从天上生成； 派系 不直接杀人 ——它通过资产、任务与价格表达敌意，暗杀走任务卡。 GM 单季沙漏预算 （第⑤步\"AI 批量更新\"，总预算 ≤10 分钟）： 步 内容 预算 ① 具名层：5–10 名活跃 NPC 各掷决策（d20 查行动表） 4 分钟 / ≤12 掷 ② 幽灵航程：批量更新 ≤10 条线 2 分钟 / 无掷（登记即可） ③ 城市层：48 城 ×（市况重掷 + 三数字） 2 分钟（09 分册市况条逐城 30 秒内） ④ 派系层：在编家各跑 1 次月 tick（战役月=3 时取 3 次的最简并写法： 每季跑 3 tick、每次 30 秒 ） 2 分钟 / ≤8 掷 ⑤ 年轮：重要 NPC 各掷 d20（13 分册死亡表合并在此） 顺手并入① 合计 ≤10 分钟、≤25 次掷骰/标记——验收线。KP 面板（可视化工具）把①③④做成按钮后可压到 3 分钟，但纸上流程以此为上限。 14.2 具名层：效用函数与行动表（T5.4.2.a） 每名具名 NPC 三字段（ npcs.json 已带）： 野心 （一句话，来自 13 章\"他想要的\"）＋ 野心类 归档五类之一：发财 / 复仇 / 扬名 / 安稳 / 权势（查行动表用；血债 ≥5 时自动转\"复仇\"族）； 手段档 ：军 / 商 / 谋三选一； 当前处境 （在哪/有没有船/欠不欠债——决策结果 写回 这里）。 季末决策 ＝掷 d20＋性格权重修正→查 行动表 →执行→结果写回处境。 行动成败 ：d20＋权重 ≥12 成功（成功=效果落地/处境改善；失败=处境恶化一档——船没了→下季“受雇于人”）。 14.2.1 行动表母版（3 手段 × 5 野心 = 15 行动族） 野心＼手段 军 商 谋 发财 私掠肥线／护航要价／卖武装 接走私单／垄断一舱／放高利贷 情报贩子／假货洗真／双头吃差价 复仇 追踪→伏击→决斗邀请（三选） 挤垮其货源／买断其债／商誉抹黑 嫁祸于人／泄其航线／断其情报 扬名 单挑扬威／抢第一冲锋／烧旗留名 包下大单／建商行总部／设宴结盟 名录立传／煽动风评／代言禁书 安稳 驻港编外武力／剿匪换地盘／当教官 买铺置业／囤粮过冬／投保避险 换旗易主／销毁旧账／隐姓埋名 权势 兵变拥立／武装调停／索求封地 行会席位／官府包税／联姻结盟 策反骨干／构陷上官／传谣立威 每格是一族（3 个具体行动），掷 d3 选其一。 复仇例外条款 ：野心\"复仇\"且对某人血债 ≥5 时，行动表 缩短 为对应手段档的三个复仇行动——执念压倒一切（13 分册恩义/血债双轨）。 14.2.2 五轴权重速查（性格→决策修正） 轴值 修正 胆量+2 军族行动 d20 +2；谋族 −2 胆量−2 安稳族 +2；军族 −2 义利−2 \"发财\"野心时加投\"坑合作伙伴\"行动（商/谋族附加行）；分赃私藏冲动（13 分册挂点 3） 义利+2 \"安稳\"野心时\"投保避险\"优先级最高 律欲+2 \"安稳\"+2；同族行动连续两季不重复 律欲−2 赌局/纵欲事件插队（GM 可掷触发检定打断本季行动） 诚诈−2 全表加一条\"违约\"暗行（GM 密掷，得手则财 +、信誉债 +） 诚诈+2 联盟类行动（设宴/联姻/调停）+2 情理+2 复仇族一旦入表 永不自然退出 （恩怨记一辈子） 情理−2 复仇族两年后自动退出（账只记两栏，翻篇） 涌现测试验收 ：同一 NPC 用不同五轴变体推 3 季，行为轨迹符合性格且 不重复 ——试航包 sandbox_test.py 的 AI 季循环自测执行此验收。 14.2.3 NPC 船队跑动：幽灵航程（T5.4.2.b） 有船的具名 NPC 每季一次 航线掷 ： GM 在其野心两端点（如\"果阿↔亚丁\"）连线； 掷出发旬（d6 = 第几旬离港）＋按船型速度档（06 分册）在宏轨日历上落一段 幽灵航程 ； 登记进 幽灵航程页 （挂历式：一行一线： 船主｜A↔B｜第 X 旬出｜历时 Y 天 ）。 与 PL 相遇判定 ：PL 航程与幽灵航程 同期同海区 时，季中掷 d6—— d6 结果 1–2 擦肩不觉（GM 心里有数即可） 3–4 同航线远远望见（帆影/旗号，可改航） 5 港内相遇（酒馆/码头场景自动成立） 6 直接遭遇事件（敌对=海战；中立=剧情钩） GM 无需实时追踪坐标： 两条日历条一叠即知 。批量更新一批 ≤10 条线；密度验收：PL 一年跨洋 2 次 vs 10 条幽灵线，相遇 1–3 次——竞争者船队（调研4启示）零成本实现。示例线：佐娅·克内日娃（N18）布鲁日↔诺夫哥罗德。 14.3 城市层：三数字结算（T5.4.3.a） 季末每城只动三个数字： 城经验 ：玩家交易/任务/建设留下的发展值（09 分册城市发展条款）； 市况条重掷 ：库存轨与行情带按 09 分册季末规则刷新； 驻港池刷新 ：从具名池抽 1–3 人\"本季在港\"，写进世界一瞥——玩家回港总有熟人或新面孔。 惰性结算 ：一级 48 城全算；二级 72 城只在被 PL 光顾时算（GM 用\"四问法\"30 秒定价，09 分册）。 14.4 派系层：faction turn（T5.4.3.b，SWN 定制） 在编 8–12 家（按纪窗从 factions.json 裁），每 月 tick 一次（跑团节奏密，比 SWN 季快一档；纸面简并写法=每季 3 tick）。 属性三枚 ：军 / 财 / 谍，各 1–8（=HP 池，降到 0=势力退出本战役舞台，前史形态接管）。 资产 ：舰队/商站/特许状/要塞，各有属性门槛与维护成本。 回合五步 ： 步 内容 规则 ① 收入 财资产产出 每资产 50 银 × 财档 ÷2（入势力库，GM 心记即可） ② 维护 每资产付维护 付不起→该资产 降级 一档；军财谍任意归 0→失去一项对应资产 ③ 目标推进 进度钟 +1 格 本月无行动也推 1 格；钟走满→野心达成，世界侧剧变（写进世界一瞥） ④ 行动 掷属性骰 从军/财/谍行动池选一条： d20 ≤（属性×2+4）成功 ；成功=效果落地或钟 +1；失败=下月维护检定劣势 ⑤ PL 接口 敌意落地 行动涉及玩家所在海区→生成 04 部任务（ 派系是任务的最大买家 ——闭环）；PL 可：受雇（任务侧）/破坏（打资产）/入股（财≥4，S4 特许公司专用） 指定验收案例（ factions.json 联合省卡 sandbox 字段） ：护航卡特尔→保费上涨的因果链三步传导——势力决策→具名反应→表页变化，全链可复现。 14.5 四触点（T5.5.1.a，AI 的全部输出面） 触点 玩家看到 数据源 任务板 派系/具名的行动变成委托 faction ⑤ / NPC 行动 港内场景 驻港池=酒馆名单 城市层第 3 数字 航程遭遇 幽灵线的帆影与相遇 §14.2.3 世界一瞥 季末三行\"谁死了谁升了\" 年轮+钟+幽灵航程注销 红线 ：不许 GM 直读后台数据给玩家——AI 的输出只能走这四个窗口（无第五出口）。世界一瞥的播报技艺见 16 分册 §16.7（句库 72 条，三腔）。 14.6 具名池名册与势力档案 14.6a 具名池名册（18 名＝12 <\/h2>\n<p>四条原则：①<strong>技法优先于文本<\/strong>——拆的是\"怎么写的\"，不是\"写了什么\"；②<strong>公版纪律<\/strong>——见上；③<strong>每纪可用<\/strong>——S1–S5 每纪 ≥3 条可用语料（自检硬闸）；④<strong>双向索引<\/strong>——每卡挂帷幕编号，16 分册帷幕卡反引本册卡号（R01–R40）。<br><strong>选目总表（20 种；'为什么选它'一句）<\/strong><\/p>\n<div class='tbl'><table><thead><tr><th>作品<\/th><th>作家<\/th><th>世纪<\/th><th>纪<\/th><th>为什么选它<\/th><\/tr><\/thead><tbody><tr><td>《台风》<\/td><td>康拉德<\/td><td>1902<\/td><td>S3–S4–S5<\/td><td>把风暴写成了'仪器失灵的顺序'——全库最好的风暴工程学。<\/td><\/tr><tr><td>《阴影线》<\/td><td>康拉德<\/td><td>1917<\/td><td>S3–S4–S5<\/td><td>无风带与心魔：静止如何比运动更可怕。<\/td><\/tr><tr><td>《吉姆爷》<\/td><td>康拉德<\/td><td>1900<\/td><td>S4–S5<\/td><td>跳船半秒的心理时间拉伸——溃逃戏的慢镜头教科书。<\/td><\/tr><tr><td>《白鲸》<\/td><td>梅尔维尔<\/td><td>1851<\/td><td>S3–S4–S5<\/td><td>三幕登场法（亚哈）与狂信节拍（追击章）双料母本。<\/td><\/tr><tr><td>《海上劳工》<\/td><td>雨果<\/td><td>1866<\/td><td>S3–S4–S5<\/td><td>海窟独战与机器之战：孤胆算术与史诗调的范本。<\/td><\/tr><tr><td>《九三年》<\/td><td>雨果<\/td><td>1874<\/td><td>S4–S5<\/td><td>炮舱事故拍与'授勋/行刑同框'的军法冷热并置。<\/td><\/tr><tr><td>《怒海争锋》系列<\/td><td>奥布莱恩<\/td><td>1969<\/td><td>S4–S5<\/td><td>拿破仑海战的日常肌理：座次、话题、琐事如何承载大事件（S5 主参照）。<\/td><\/tr><tr><td>《鲁滨逊漂流记》<\/td><td>笛福<\/td><td>1719<\/td><td>S1–S2–S3–S4–S5<\/td><td>清单美学的原点：数字即心跳，本作'账本美学'的直系祖先。<\/td><\/tr><tr><td>《瘟疫年纪事》<\/td><td>笛福<\/td><td>1722<\/td><td>S2–S3–S4–S5<\/td><td>统计腔的钝击：死亡表越平静越可怕——疫年帷幕的文风底色。<\/td><\/tr><tr><td>《一千零一夜》辛巴达航记<\/td><td>（民间定本）<\/td><td>8–14世纪<\/td><td>S1–S2–S3–S4–S5<\/td><td>航海传奇的原型语法：必然的灾难、必然的生还、必然的再出发。<\/td><\/tr><tr><td>《基督山伯爵》<\/td><td>大仲马<\/td><td>1844<\/td><td>S3–S4–S5<\/td><td>港口复仇的节奏模板：先买楼后买人最后开口，每场对话一步棋。<\/td><\/tr><tr><td>《寰宇记》<\/td><td>马可·波罗口述／鲁斯蒂谦笔录<\/td><td>1298<\/td><td>S1–S2–S3–S4–S5<\/td><td>清单式惊奇：不惊叹的观察者腔，惊奇交给数字。<\/td><\/tr><tr><td>《瀛涯胜览》<\/td><td>马欢<\/td><td>1451<\/td><td>S1–S2–S3<\/td><td>郑和随行者的白描：三句定一城，货与人同列。<\/td><\/tr><tr><td>《星槎胜览》<\/td><td>费信<\/td><td>1436<\/td><td>S1–S2–S3<\/td><td>诗注双轨的纪行体：韵脚当罗盘，蒙太奇航段的现成语法。<\/td><\/tr><tr><td>《岛夷志略》<\/td><td>汪大渊<\/td><td>1349<\/td><td>S1–S2<\/td><td>14 世纪目击清单——S1 同代人的同代文风，王牌语料。<\/td><\/tr><tr><td>《两种海道针经》<\/td><td>（佚名船师）<\/td><td>明代<\/td><td>S1–S2–S3<\/td><td>针路簿的技术性诗意：'辰针二十二更'即完整句子，导航旁白母版。<\/td><\/tr><tr><td>《威尼斯商人》<\/td><td>莎士比亚<\/td><td>1597<\/td><td>S2–S3–S4–S5<\/td><td>商约与违约的戏剧核：合同的精确=引信的长度。<\/td><\/tr><tr><td>《亨利五世》<\/td><td>莎士比亚<\/td><td>1599<\/td><td>S2–S3–S4–S5<\/td><td>战前演说三层递进（少数→幸福→兄弟），动员拍的祖本。<\/td><\/tr><tr><td>《怒海余生》<\/td><td>吉卜林<\/td><td>1897<\/td><td>S4–S5<\/td><td>行话的墙与渔汛日历：以技艺量化成长的蒙太奇。<\/td><\/tr><tr><td>《金瓶梅》<\/td><td>兰陵笑笑生<\/td><td>明代<\/td><td>S1–S2–S3<\/td><td>牙行议价的中文腔：一句抬一句压一句绕到酒——市集戏母语。<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>全部拆解卡带 <code>[公版原文]<\/code>（可核实名句）或 <code>[技法仿写]<\/code>（自写示范句）标注；仅教学引用。<\/blockquote>\n<h2>15.2 拆解卡 40 张（T6.1.2.a，统一格式）<\/h2>\n<p>格式：<strong>摘录<\/strong>（≤400 字，带版权标注）→ <strong>技巧拆解<\/strong>（3 点）→ <strong>跑团用法<\/strong>（帷幕编号＋模板）→ <strong>改编示例<\/strong>（把技巧套进燃帆场景的 3 句示范）。<\/p>\n<h4>R01 《台风》｜康拉德（1902｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：风暴是按仪器失灵的顺序写出来的：先是气压计疯掉，然后罗盘打转，最后连怀表也停了。叙述越来越短，短到只剩海本身在说话。<\/li><li><strong>技巧1<\/strong>：以器材失灵顺序写风暴升级（气压计→罗盘→怀表）<\/li><li><strong>技巧2<\/strong>：句子随风暴变短——节奏即风力<\/li><li><strong>技巧3<\/strong>：从不说海'可怕'，只写海做了什么<\/li><li><strong>跑团用法<\/strong>：风暴帷幕的'感官剥夺链'模板：GM 每轮关掉一种信息源（先看不见、再听不清、最后罗盘也疯了）。（挂 <strong>C04<\/strong>）<\/li><li><strong>改编示例<\/strong>：罗盘先疯了——针在三枚刻度间打架。 　随后是灯：风从灯芯里把火抽走。 　最后是话，没人再说'浪'字，浪替他们说了。<\/li><\/ul>\n<h4>R02 《台风》｜康拉德（1902｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：甲板之上是风暴，甲板之下是炉火。司炉们赤膊与煤共舞，铁锹的节拍比风还稳——两场风暴一齐烧，一场在桅顶，一场在炉膛。<\/li><li><strong>技巧1<\/strong>：切到'风暴的对立面'（炉火/舱内）反衬<\/li><li><strong>技巧2<\/strong>：群体动作蒙太奇：节拍写纪律<\/li><li><strong>技巧3<\/strong>：船体剖面感：同一时刻两个舞台<\/li><li><strong>跑团用法<\/strong>：风暴中段的'锅炉房拍'：把镜头切到稳定的地方，让不稳定的更可怕。（挂 <strong>C04<\/strong>）<\/li><li><strong>改编示例<\/strong>：风暴在头顶骂了一整夜。 　货舱底，司炉老周往炉门里铲了第八十铲煤。 　'风大省煤。'他说。<\/li><\/ul>\n<h4>R03 《阴影线》｜康拉德（1917｜海与风暴｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：帆一动不动，人心先动。船像被钉在海面上；病在船员中间走，比任何风都自由。年轻船长数自己还剩多少干净的水——数着数着，把恐惧数成了职责。<\/li><li><strong>技巧1<\/strong>：以'静止'制造恐怖（无风=时间死亡）<\/li><li><strong>技巧2<\/strong>：疾病拟人化：它'走'、它'挑人'<\/li><li><strong>技巧3<\/strong>：自我对话写责任的重<\/li><li><strong>跑团用法<\/strong>：平静航段'停滞三戏'母版：人心浮动的三句递进。（挂 <strong>C03<\/strong>）<\/li><li><strong>改编示例<\/strong>：第三天没有风。 　第四天，水手们开始看别人的脸。 　第五天，所有人都不看了。<\/li><\/ul>\n<h4>R04 《阴影线》｜康拉德（1917｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：药箱是空的——第一副药是水，第二副是更多的水。医生留下的清单成了全船最长的哀悼词。<\/li><li><strong>技巧1<\/strong>：用'空'写绝望：药箱、名单、床位<\/li><li><strong>技巧2<\/strong>：物件叙事：一只药箱讲完一场瘟疫<\/li><li><strong>技巧3<\/strong>：一句一段的短促节奏<\/li><li><strong>跑团用法<\/strong>：疫病帷幕的'物件塌方'模板：从一件失效的物资写起。（挂 <strong>C12<\/strong>）<\/li><li><strong>改编示例<\/strong>：药箱打开，只有一封信。 　信是上一任船医写的，写给下一任船医。 　没有下一任了。<\/li><\/ul>\n<h4>R05 《吉姆爷》｜康拉德（1900｜人物与对话｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：他从船舷翻出去的那半秒，有整整一章那么长。落水之前，他先落过了自己的一生。<\/li><li><strong>技巧1<\/strong>：关键抉择的时间膨胀（半秒写一章）<\/li><li><strong>技巧2<\/strong>：不辩护的自白体：让行为自己说话<\/li><li><strong>技巧3<\/strong>：旁观者视点切割：每个人记得的版本不同<\/li><li><strong>跑团用法<\/strong>：溃逃与失败的'慢镜头条款'：哗变检定失败后，时间放慢，让选择被看清。（挂 <strong>C15<\/strong>）<\/li><li><strong>改编示例<\/strong>：海在下面等他。 　半空里他想起了母亲、船费、和那句没说完的'站稳'。 　水面合拢，像一句收回的话。<\/li><\/ul>\n<h4>R06 《吉姆爷》｜康拉德（1900｜人物与对话｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：每个人讲一个吉姆。酒馆里他的名字比他本人早到了三章——有人说他死了，有人说他发了，只有老板娘知道他欠的酒钱还没结。<\/li><li><strong>技巧1<\/strong>：延迟出场：名字先于人到达<\/li><li><strong>技巧2<\/strong>：传闻互相打架=人物立体<\/li><li><strong>技巧3<\/strong>：用账目给传闻称重（欠账最真）<\/li><li><strong>跑团用法<\/strong>：酒馆听闻'三幕登场法'第一幕：传闻。重要 NPC 首秀先给三个互相矛盾的版本。（挂 <strong>C09<\/strong>）<\/li><li><strong>改编示例<\/strong>：'他死在孟买了。''他上个月还在亚丁。''他的酒钱还挂着呢。'——老板娘的账本从不撒谎。<\/li><\/ul>\n<h4>R07 《白鲸》｜梅尔维尔（1851｜人物与对话｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔公版原文〕：Call me Ishmael.（叫我以实玛利吧。）——全书开场仅三词：自报家门、来历不明、幸存者口吻一次到位。<\/li><li><strong>技巧1<\/strong>：开场即定调：三词完成叙述者档案<\/li><li><strong>技巧2<\/strong>：'叫我'而非'我是'：名字是标签不是身份<\/li><li><strong>技巧3<\/strong>：幸存者预设：读者已知船会沉<\/li><li><strong>跑团用法<\/strong>：开局定场'白描版'三句钩的极简范例。（挂 <strong>C01<\/strong>）<\/li><li><strong>改编示例<\/strong>：叫我阿七。 　这是条运陶器的船，我是它最后一只没碎的碗。 　下面的事，发生在它还是两只碗的时候。<\/li><\/ul>\n<h4>R08 《白鲸》｜梅尔维尔（1851｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：亚哈缺席了开篇三分之一：先闻其名，后见其腿——一枚用鲸牙车的小腿骨钉在甲板上，人才出现。传闻替他铺场，象牙替他签名。<\/li><li><strong>技巧1<\/strong>：三幕登场法：传闻→侧影→正脸<\/li><li><strong>技巧2<\/strong>：信物先于人物（牙腿/铜币）<\/li><li><strong>技巧3<\/strong>：登场的'缺席'设计：越晚越重<\/li><li><strong>跑团用法<\/strong>：重要 NPC 首秀帷幕：先给信物与传闻，最后给本人。（挂 <strong>C09<\/strong>）<\/li><li><strong>改编示例<\/strong>：船长室三天没开门，门缝里只递出航向。 　水手长把一枚银币钉上桅顶：'船长的。' 　第四天门开了，大家反而没敢看。<\/li><\/ul>\n<h4>R09 《海上劳工》｜雨果（1866｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：海窟里，一个人对一条章鱼。对手越大，句子越静。他数自己的呼吸像数一枚硬币的两面——翻过来是力气，翻过去是没气。<\/li><li><strong>技巧1<\/strong>：静写巨物：形容词越少体量越大<\/li><li><strong>技巧2<\/strong>：地形即敌人（海窟=闭合的胃）<\/li><li><strong>技巧3<\/strong>：孤胆算术：一口气=资源条<\/li><li><strong>跑团用法<\/strong>：接舷肉搏的单挑拍：把 HP 换算成呼吸，读者自己会紧张。（挂 <strong>C06<\/strong>）<\/li><li><strong>改编示例<\/strong>：章鱼比洞口还宽。 　他吸了半口气，把自己交给出手的姿势。 　洞外，潮水开始退。<\/li><\/ul>\n<h4>R10 《海上劳工》｜雨果（1866｜海与风暴｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：他与风暴的战争打在机器上：拆一台发动机回船，如同从神的嘴里抢回一句台词。每一枚螺栓拧下来，风就大一分。<\/li><li><strong>技巧1<\/strong>：史诗调：人对抗的不是海是命运<\/li><li><strong>技巧2<\/strong>：以'拆解'写征服（逆向建造）<\/li><li><strong>技巧3<\/strong>：每一枚螺栓=一次掷骰的重量<\/li><li><strong>跑团用法<\/strong>：风暴帷幕'史诗调'变奏：风暴中给一件必须完成的工程任务。（挂 <strong>C04<\/strong>）<\/li><li><strong>改编示例<\/strong>：风要这台机器，他要。 　第九枚螺栓松开时，天全黑了。 　他把最后一枚含在嘴里，像含着一句誓言。<\/li><\/ul>\n<h4>R11 《九三年》｜雨果（1874｜战争与权谋｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：挣脱的炮在舱里横冲直撞，一门炮成了一头困兽。船舱的每一根肋骨都在替它记路——灾难有了自己的航行术。<\/li><li><strong>技巧1<\/strong>：把武器写成猛兽（挣脱的炮）<\/li><li><strong>技巧2<\/strong>：舱内地理：梁、肋、舱口=兽栏<\/li><li><strong>技巧3<\/strong>：灾难慢镜头：一秒拆成十步<\/li><li><strong>跑团用法<\/strong>：海战开火的'事故拍'：炮脱索/桅断的舱内戏模板。（挂 <strong>C05<\/strong>）<\/li><li><strong>改编示例<\/strong>：炮脱了索。 　它先撞碎了左舷的灯塔柜，又碾过三张吊床。 　全船安静下来，听它掉头。<\/li><\/ul>\n<h4>R12 《九三年》｜雨果（1874｜战争与权谋｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：同一块甲板：先授勋，后行刑。军法把两张文书放在同一个托盘里端上来，军官读完一张，再读另一张，中间只换了一次呼吸。<\/li><li><strong>技巧1<\/strong>：仪式对切：授勋/死刑同框<\/li><li><strong>技巧2<\/strong>：军法的冷与热的并置<\/li><li><strong>技巧3<\/strong>：文书=叙事道具（读出声来）<\/li><li><strong>跑团用法<\/strong>：审讯与谈判的'军法变调'：裁决与恩赏一并落地，不留缓冲。（挂 <strong>C11<\/strong>）<\/li><li><strong>改编示例<\/strong>：'嘉奖令：炮手盖兰。' 　'死刑令：炮手盖兰。' 　他立正听完两张，说：谢舰长。<\/li><\/ul>\n<h4>R13 《怒海争锋》系列｜奥布莱恩（1969｜人物与对话｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：军官餐桌：座位即等级，话题即军阶。厨师谈牛肉，军需谈牛肉的价钱，船长谈风——直到风真的变了，全场只有一个人抬头。<\/li><li><strong>技巧1<\/strong>：以座次写等级（不写官阶写位置）<\/li><li><strong>技巧2<\/strong>：话题的'掉名字'技法：谁说哪类话<\/li><li><strong>技巧3<\/strong>：食物与职务对位<\/li><li><strong>跑团用法<\/strong>：酒馆群像桶主卡：GM 用座位与话题分配写一桌人的等级。（挂 <strong>C09<\/strong>）<\/li><li><strong>改编示例<\/strong>：上汤时没人说话，上肉时说价钱，上酒时说家乡。 　船长一直看窗外的桅顶。 　风偏了两度，他放下了刀叉。<\/li><\/ul>\n<h4>R14 《怒海争锋》系列｜奥布莱恩（1969｜人物与对话｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：大战在即，舰长在补一封信。写到第三行被传令打断，回来后接着写——战争让位于一封没写完的家书，悬念反而更重。<\/li><li><strong>技巧1<\/strong>：以琐事压阵：大战前写小字<\/li><li><strong>技巧2<\/strong>：命令用平白语气（越重大越平淡）<\/li><li><strong>技巧3<\/strong>：悬念藏在'没写的事'里<\/li><li><strong>跑团用法<\/strong>：出航帷幕的'压舱石'拍：启航前安排一件极小的私事。（挂 <strong>C02<\/strong>）<\/li><li><strong>改编示例<\/strong>：他把信压在罗盘下：'回来再写。' 　'起锚。' 　信上第三行：'儿子会走了，还没见你。'<\/li><\/ul>\n<h4>R15 《鲁滨逊漂流记》｜笛福（1719｜清单与账本｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：从沉船上搬下来的每件东西都有数：火药若干磅、墨水'只剩三口'、两顶帽子和一双没用的好鞋。清单越工整，孤岛越荒凉。<\/li><li><strong>技巧1<\/strong>：清单的存亡感：每一项都是命<\/li><li><strong>技巧2<\/strong>：数字=心跳（墨水三口）<\/li><li><strong>技巧3<\/strong>：'有用/没用'两栏账的黑色幽默<\/li><li><strong>跑团用法<\/strong>：凯旋结算'报货清单旁白'母版：数字给玩家，清单给耳朵。（挂 <strong>C14<\/strong>）<\/li><li><strong>改编示例<\/strong>：三十担胡椒，八捆肉桂，一箱被雨吻过的姜黄。 　另有一箱账本——湿了，但看得清谁欠谁。<\/li><\/ul>\n<h4>R16 《鲁滨逊漂流记》｜笛福（1719｜清单与账本｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：醒来、退潮、没有人的海岸。他做的第一件事不是喊救，是给视野里的每样东西点数：船、桅、一只狗、和够不着的水桶。<\/li><li><strong>技巧1<\/strong>：开局定场的'点数式'白描<\/li><li><strong>技巧2<\/strong>：以行动代替情绪（数=镇定）<\/li><li><strong>技巧3<\/strong>：把'没有'也写进清单<\/li><li><strong>跑团用法<\/strong>：开局定场白描版：第一幕只做点数，不做抒情。（挂 <strong>C01<\/strong>）<\/li><li><strong>改编示例<\/strong>：退潮后，沙滩上留下了船的龙骨。 　他点了点：狗一只，火药两桶，同伴没有。 　他开始走，按清单的顺序。<\/li><\/ul>\n<h4>R17 《瘟疫年纪事》｜笛福（1722｜港口与市井｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：死亡表每周张贴在城门口：本周某某堂区若干人。数字越平静，越可怕——公文体把灾难记成天气。<\/li><li><strong>技巧1<\/strong>：统计腔：公文体冷叙述<\/li><li><strong>技巧2<\/strong>：数字并列的钝击（不评论，只并置）<\/li><li><strong>技巧3<\/strong>：传闻与公告互证（双源结构）<\/li><li><strong>跑团用法<\/strong>：疫病帷幕'编年史腔'：GM 念周表，不念形容词。（挂 <strong>C12<\/strong>）<\/li><li><strong>改编示例<\/strong>：本周，圣玛丽堂区：四十一人。 　上周：九人。 　公告栏前没人说话，有人在数自家门牌。<\/li><\/ul>\n<h4>R18 《瘟疫年纪事》｜笛福（1722｜港口与市井｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：封锁从一扇门开始：门外加锁，门内画红十字。看守人与被看守人隔着门板讨价还价——买面包、传口信、报死讯，全用一根绳子。<\/li><li><strong>技巧1<\/strong>：以'一扇门'写整座城的封锁<\/li><li><strong>技巧2<\/strong>：隔门对话=距离感本身<\/li><li><strong>技巧3<\/strong>：绳子：封锁期的全部贸易路线<\/li><li><strong>跑团用法<\/strong>：疫病帷幕'市井调'变奏：把悲剧落在一次隔门交易上。（挂 <strong>C12<\/strong>）<\/li><li><strong>改编示例<\/strong>：门上的红十字是新画的，漆还粘手。 　绳子从窗口放下来，先吊上去钱，再吊下来面包。 　'我兄弟呢？'——绳子空着回来了。<\/li><\/ul>\n<h4>R19 《一千零一夜》辛巴达航记｜（民间定本）（8–14世纪｜港口与市井｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：每一次航行=自找的灾难+必然的生还+必然的再出发。第七次返航的宴席上，他讲第六次如何死里逃生——听众越怕，他越平静。<\/li><li><strong>技巧1<\/strong>：七次结构的仪式感（奇数航程）<\/li><li><strong>技巧2<\/strong>：灾难的'必然'设计：越劝越要去<\/li><li><strong>技巧3<\/strong>：财富与讲述的循环：讲故事即分红<\/li><li><strong>跑团用法<\/strong>：超自然遭遇'传奇变调'：把恐怖讲成“命中注定”的冒险，压住惊吓感。（挂 <strong>C16<\/strong>）<\/li><li><strong>改编示例<\/strong>：'别去第六次了。'他们说。 　他说好，喝了第三杯。 　第七次出海那天，全港都去送他——像送一个说好的约定。<\/li><\/ul>\n<h4>R20 《一千零一夜》辛巴达航记｜（民间定本）（8–14世纪｜清单与账本｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：每次归来，辛巴达先报货、后讲故事：檀香几担、龙涎香几斤、珍珠几斛——账念完了，才轮到海怪出场。货单是传奇的定金。<\/li><li><strong>技巧1<\/strong>：先报货后讲险：账单押韵于传奇<\/li><li><strong>技巧2<\/strong>：奇珍以量词称重（斛/担/斤）<\/li><li><strong>技巧3<\/strong>：听众=分红对象<\/li><li><strong>跑团用法<\/strong>：凯旋结算的'传奇变调'：报货时埋一条下季航线的钩子。（挂 <strong>C14<\/strong>）<\/li><li><strong>改编示例<\/strong>：檀香六十担，珍珠两斛，另有一枚说不出名的卵。 　'说不出名？''因为孵它的时候，我还没上船。'<\/li><\/ul>\n<h4>R21 《基督山伯爵》｜大仲马（1844｜人物与对话｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：伯爵进城，先买楼、后买人、最后才开口。他的复仇有购物清单：一栋宅子、一家银行、一名仇人的管家——每场对话都是一步棋。<\/li><li><strong>技巧1<\/strong>：延迟满足：钱与楼先行，刀最后<\/li><li><strong>技巧2<\/strong>：身份的购物清单<\/li><li><strong>技巧3<\/strong>：对话=走棋（每句吃一子）<\/li><li><strong>跑团用法<\/strong>：审讯与谈判'复仇模板'：安排一场只问不答的会面。（挂 <strong>C11<\/strong>）<\/li><li><strong>改编示例<\/strong>：'你想问什么？'伯爵问。 　对方问了三个问题。 　'很好，'伯爵说，'这三个答案，我各收一样东西。'<\/li><\/ul>\n<h4>R22 《基督山伯爵》｜大仲马（1844｜人物与对话｜S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：宴会上他宣布一件好事，全场举杯；只有一个人知道这杯酒是他自己的死刑判决书。体面越大，刀越近。<\/li><li><strong>技巧1<\/strong>：公开宣布=私密行刑<\/li><li><strong>技巧2<\/strong>：以'祝酒'为刑具<\/li><li><strong>技巧3<\/strong>：知情者的独享恐怖（读者视角）<\/li><li><strong>跑团用法<\/strong>：官厅谒见的'体面下的刀'：大厅里的好消息，对某人是坏消息。（挂 <strong>C10<\/strong>）<\/li><li><strong>改编示例<\/strong>：'为这笔新的合伙干杯。'全场举杯。 　只有总督的账房知道，这笔合伙的账，他今夜就要补齐——用他自己的名义。<\/li><\/ul>\n<h4>R23 《寰宇记》｜马可·波罗口述／鲁斯蒂谦笔录（1298｜清单与账本｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：泉州的胡椒、杭州的桥、行在的浴场——他不惊叹，只数数：'此城何止十二倍于吾威尼斯。'数字成了惊奇本身。<\/li><li><strong>技巧1<\/strong>：不惊叹的观察者腔（惊叹交给数字）<\/li><li><strong>技巧2<\/strong>：倍数比较法：故乡当尺子<\/li><li><strong>技巧3<\/strong>：'听闻/亲见'两源标注<\/li><li><strong>跑团用法<\/strong>：市集议价的'清单收尾'：成交后用一段数数旁白收场。（挂 <strong>C08<\/strong>）<\/li><li><strong>改编示例<\/strong>：码头上，牙人报数：胡椒三百包，苏木一百二十担。 　'比热那亚一年还多。'水手说。 　账房没抬头，落了一笔记号。<\/li><\/ul>\n<h4>R24 《寰宇记》｜马可·波罗口述／鲁斯蒂谦笔录（1298｜东亚航海｜S1–S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：忽鲁谟斯的船用椰索缝制，不加一枚铁钉——'是以其船易沉'。技术细节的陌生化：一句构造，一句缺陷，一句后果。<\/li><li><strong>技巧1<\/strong>：一句构造/一句缺陷/一句后果<\/li><li><strong>技巧2<\/strong>：以'没有的东西'定义异域（没有钉子）<\/li><li><strong>技巧3<\/strong>：旁观者误读的诚实（记录偏见）<\/li><li><strong>跑团用法<\/strong>：出航帷幕'异域船感'：换船时用构造细节入戏。（挂 <strong>C02<\/strong>）<\/li><li><strong>改编示例<\/strong>：新雇的船没有钉子。 　'缝的？''缝的。' 　水手长检查完绳结，在名单上多写了一行会水的人。<\/li><\/ul>\n<h4>R25 《瀛涯胜览》｜马欢（1451｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：爪哇记：一句地形（国无城郭），一句人（男皆披发），一句货（胡椒广有）——三句定一城，白描到底，不置一词褒贬。<\/li><li><strong>技巧1<\/strong>：三句定一城：地/人/货<\/li><li><strong>技巧2<\/strong>：白描=零形容词纪律<\/li><li><strong>技巧3<\/strong>：货与人同列（市场即社会）<\/li><li><strong>跑团用法<\/strong>：港口入城'异域白描'模板：靠港第一段只用三句。（挂 <strong>C07<\/strong>）<\/li><li><strong>改编示例<\/strong>：港无石城，竹栅为界。 　男子束发，女子短裙。 　市上椒山堆积，番银不通行——只认布。<\/li><\/ul>\n<h4>R26 《瀛涯胜览》｜马欢（1451｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：古里朝贡场面：宣读诏书、赏赐丝绸、酋长回礼胡椒——仪式的每一步都有对位动作，像两本账在互相盖章。<\/li><li><strong>技巧1<\/strong>：仪式对位动作（读一句，行一礼）<\/li><li><strong>技巧2<\/strong>：礼物=可数的政治（丝绸/胡椒）<\/li><li><strong>技巧3<\/strong>：翻译的第三只手（通事在场）<\/li><li><strong>跑团用法<\/strong>：官厅谒见'朝贡仪式'模板：把外交写成对账。（挂 <strong>C10<\/strong>）<\/li><li><strong>改编示例<\/strong>：诏书读一句，通事译一句，酋长俯首一次。 　丝绸抬上来，胡椒抬下去。 　礼毕，两本册子各添一页。<\/li><\/ul>\n<h4>R27 《星槎胜览》｜费信（1436｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：每国一诗一注：诗记风土，注记货价——韵脚当罗盘用。'木骨都束'四字地名压着平仄，背后是索马里海岸的风。<\/li><li><strong>技巧1<\/strong>：诗注双轨（感性+行情）<\/li><li><strong>技巧2<\/strong>：以韵律记航程（好背=好传）<\/li><li><strong>技巧3<\/strong>：'闻见'分级（亲至/传闻）<\/li><li><strong>跑团用法<\/strong>：平静航段蒙太奇旁白：用'一城一句韵'串起整段航行。（挂 <strong>C03<\/strong>）<\/li><li><strong>改编示例<\/strong>：满剌加多雨，古里多商，忽鲁谟斯多风。 　水手们把这句编成了号子。 　唱到第三遍，风就到了。<\/li><\/ul>\n<h4>R28 《星槎胜览》｜费信（1436｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：满剌加市况：番货在此换船，候风在此过冬——'其市曰 dati，货聚如山'。一句市况，一句气候，一句人情。<\/li><li><strong>技巧1<\/strong>：三句市况卡：货/风/人<\/li><li><strong>技巧2<\/strong>：中转站的写法（换船+候风）<\/li><li><strong>技巧3<\/strong>：地名+功能并置<\/li><li><strong>跑团用法<\/strong>：市集议价开场白：GM 用三句交代中转港的性格。（挂 <strong>C08<\/strong>）<\/li><li><strong>改编示例<\/strong>：这港不产货，只产等待。 　季风一换，满港的船都想先走。 　牙人只说三种话：价、风、和'再等等'。<\/li><\/ul>\n<h4>R29 《岛夷志略》｜汪大渊（1349｜东亚航海｜S1–S2）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：彭湖、琉球、交趾——元朝水手用脚写成的海图：地名连缀成线，物产即情报，每条短到近乎电报。这是 S1 的母语料：同代人写同代人。<\/li><li><strong>技巧1<\/strong>：地名连缀=航线本身<\/li><li><strong>技巧2<\/strong>：物产即情报（货可比人先到）<\/li><li><strong>技巧3<\/strong>：电报体短句（S1 同代口吻）<\/li><li><strong>跑团用法<\/strong>：市集议价 S1 母腔：GM 开口前先在心里过一遍电报体。（挂 <strong>C08<\/strong>）<\/li><li><strong>改编示例<\/strong>：彭湖：砂砾，无他产，有细布。 　琉球：翠羽、胡椒。 　船到之前，货单已经先认识对方了。<\/li><\/ul>\n<h4>R30 《岛夷志略》｜汪大渊（1349｜东亚航海｜S1–S2）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：土酋谒见：客以布帛为礼，酋以椒盐相还——礼单就是价格表，谁多出一句寒暄，谁就先输了价。<\/li><li><strong>技巧1<\/strong>：礼单=价格表（礼物即谈判）<\/li><li><strong>技巧2<\/strong>：对等回礼的精确性<\/li><li><strong>技巧3<\/strong>：沉默作为筹码<\/li><li><strong>跑团用法<\/strong>：官厅谒见'土酋变奏'：S1 的官厅就是一张铺着椒盐的席。（挂 <strong>C10<\/strong>）<\/li><li><strong>改编示例<\/strong>：布帛铺开，酋长不数。 　椒盐推回来，船主也不数。 　两人对饮一碗，价就定了——通事事后才敢问是多少。<\/li><\/ul>\n<h4>R31 《两种海道针经》｜（佚名船师）（明代｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：'用辰针二十二更船取乌猪洋'——罗盘方位+更数=完整的一句航程。技术词自带节奏：针是方向，更是时间，风险藏在每一次改针处。<\/li><li><strong>技巧1<\/strong>：技术词的节奏感（方位+更数=句子）<\/li><li><strong>技巧2<\/strong>：更数=时间单位（一更≈一昼夜的六十分之一航程）<\/li><li><strong>技巧3<\/strong>：风险标记法：'取''防''恐'三字分级<\/li><li><strong>跑团用法<\/strong>：出航'导航旁白'模板：GM 念针路当咒语，玩家听改针处。（挂 <strong>C02<\/strong>）<\/li><li><strong>改编示例<\/strong>：出港用巽针，三更防浅。 　过乌猪洋改辰针，二十二更。 　针簿在老舵手手里，他今晚只说了前一半。<\/li><\/ul>\n<h4>R32 《两种海道针经》｜（佚名船师）（明代｜东亚航海｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：认路不靠字，靠山形水势：'山如笔架，水色黄白'——白天认形，夜里听水。针簿的注脚全是眼睛和耳朵。<\/li><li><strong>技巧1<\/strong>：以形认路（山的剪影=坐标）<\/li><li><strong>技巧2<\/strong>：水色与水声=导航数据<\/li><li><strong>技巧3<\/strong>：注脚口语化（师傅口吻）<\/li><li><strong>跑团用法<\/strong>：平静航段的'认路拍'：用一句山形一句水色，把玩家放进航道里。（挂 <strong>C03<\/strong>）<\/li><li><strong>改编示例<\/strong>：山如笔架，就是这儿了。 　水色转黄白，底下有沙。 　'都别说话。'老舵手侧耳听了一刻钟的水。<\/li><\/ul>\n<h4>R33 《威尼斯商人》｜莎士比亚（1597｜人物与对话｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔公版原文〕：\"The quality of mercy is not strained.\"（慈悲不是勉强的品质——它像甘霖自天而降，双重赐福。）法庭戏里最软的一句，是最后称重的一句。<\/li><li><strong>技巧1<\/strong>：法庭=剧场（台词即判词）<\/li><li><strong>技巧2<\/strong>：把抽象（慈悲）写成物件（甘霖）<\/li><li><strong>技巧3<\/strong>：反问的杠杆（连环反问压对方）<\/li><li><strong>跑团用法<\/strong>：审讯与谈判的'说情拍'：让一句话改变裁决的重心。（挂 <strong>C11<\/strong>）<\/li><li><strong>改编示例<\/strong>：'船沉了，人还在。'律师说。 　'契约写的是船。'债主说。 　旁听席上有人小声问：人算不算货？<\/li><\/ul>\n<h4>R34 《威尼斯商人》｜莎士比亚（1597｜人物与对话｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：一磅肉的契约：条款越精确，引线越短。'到期不还，割肉一磅'——签约时人人微笑，履约时字字见血。<\/li><li><strong>技巧1<\/strong>：合同的精确=戏剧的引信<\/li><li><strong>技巧2<\/strong>：字面主义的恐怖（只按字面执行）<\/li><li><strong>技巧3<\/strong>：豁免条款的反杀（一滴血也不许）<\/li><li><strong>跑团用法<\/strong>：审讯与谈判'商约变调'：让一份签好的字据反咬一口。（挂 <strong>C11<\/strong>）<\/li><li><strong>改编示例<\/strong>：字据上写'一磅肉'，没写'连同血'。 　'血是货吗？''不是。''那就别让它滴。'<\/li><\/ul>\n<h4>R35 《亨利五世》｜莎士比亚（1599｜战争与权谋｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔公版原文〕：\"We few, we happy few, we band of brothers.\"（我们少数人，我们幸福少数人，我们一伙兄弟。）——战前演说的三层递进：少数→幸福→兄弟，劣势被说成了选择。<\/li><li><strong>技巧1<\/strong>：点名制亲密（今日点名者终身为友）<\/li><li><strong>技巧2<\/strong>：把劣势说成选择（人少=荣耀密度高）<\/li><li><strong>技巧3<\/strong>：未来回忆时态（讲给'将来的老人'听）<\/li><li><strong>跑团用法<\/strong>：海战开火'战前动员'：接舷前三分钟给一段点名。（挂 <strong>C05<\/strong>）<\/li><li><strong>改编示例<\/strong>：船上三十一人，他一个个叫了名字。 　'明天过后，这些名字就是一伙兄弟的名字。' 　没有鼓，只有缆绳吱呀。<\/li><\/ul>\n<h4>R36 《亨利五世》｜莎士比亚（1599｜战争与权谋｜S2–S3–S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：练兵场戏：军令全用白话——'帽子戴正，缆绳摸一遍，别在夜里念家乡'。将官的威信用最平常的句子钉进人心里。<\/li><li><strong>技巧1<\/strong>：军令白话化（越短越重）<\/li><li><strong>技巧2<\/strong>：禁令即抒情（'别念家乡'=他也在忍）<\/li><li><strong>技巧3<\/strong>：以动作清单代替训话<\/li><li><strong>跑团用法<\/strong>：出航帷幕'军令拍'：启航令写成三件小事。（挂 <strong>C02<\/strong>）<\/li><li><strong>改编示例<\/strong>：命令只有三条：帽檐压低、缆绳摸一遍、夜里别唱挽歌。 　'为什么？''因为我要唱。'<\/li><\/ul>\n<h4>R37 《怒海余生》｜吉卜林（1897｜人物与对话｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：被打捞的少爷上了渔船，头一课不是掌舵，是认行话——'缭绳''压舷''收鱼'。行话是一堵墙，学会一堵墙，才算进门。<\/li><li><strong>技巧1<\/strong>：以技艺量化成长（会几样活=什么人）<\/li><li><strong>技巧2<\/strong>：渔汛的日历感（季节即日程）<\/li><li><strong>技巧3<\/strong>：行话的墙（外人听不懂=阶层）<\/li><li><strong>跑团用法<\/strong>：平静航段'成长蒙太奇'：用三项技艺的习得标记时间。（挂 <strong>C03<\/strong>）<\/li><li><strong>改编示例<\/strong>：第一周他只会挨骂。 　第二周他会了'缭绳'这个词。 　第三周，骂他的人把舵让了半个更次。<\/li><\/ul>\n<h4>R38 《怒海余生》｜吉卜林（1897｜清单与账本｜S4–S5）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：渔船分账：每舱鱼过秤记账，少年念数，船主落笔——'鱼的账'就是'人的账'，谁懒一网，秤知道。<\/li><li><strong>技巧1<\/strong>：秤=裁判（过秤即公示）<\/li><li><strong>技巧2<\/strong>：念数与落笔的双声部<\/li><li><strong>技巧3<\/strong>：账目即人品（懒一网，账知道）<\/li><li><strong>跑团用法<\/strong>：凯旋结算'分赃清单'：分账的口播版，人人听见自己的数。（挂 <strong>C14<\/strong>）<\/li><li><strong>改编示例<\/strong>：'三舱，四百二十斤。'少年念。 　笔尖顿了顿：'你的名字下面记一笔懒。' 　全船都笑了，只有被记的人记了一年。<\/li><\/ul>\n<h4>R39 《金瓶梅》｜兰陵笑笑生（明代｜港口与市井｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：牙行议价的中文腔：一句抬、一句压、一句绕到酒——'这价嘛，先吃盏茶再说'。数字在闲谈里落地，脸皮在酒盅里成交。<\/li><li><strong>技巧1<\/strong>：话里有话的三段式（抬/压/绕）<\/li><li><strong>技巧2<\/strong>：以饮食写交易（茶酒=缓冲带）<\/li><li><strong>技巧3<\/strong>：数字藏在闲谈里（报价先绕三圈）<\/li><li><strong>跑团用法<\/strong>：市集议价'中文腔调'参照：对手戏模板直接套用。（挂 <strong>C08<\/strong>）<\/li><li><strong>改编示例<\/strong>：'这价嘛——先吃盏茶。' 　茶过三巡，价落了两个来回。 　'再添一篓，我请你吃酒。'买卖就成了。<\/li><\/ul>\n<h4>R40 《金瓶梅》｜兰陵笑笑生（明代｜清单与账本｜S1–S2–S3）<\/h4>\n<ul class='mdlist'><li><strong>摘录<\/strong>〔技法仿写〕：账房的夜：灯下算盘是叙事的心跳——三声急、一声缓，门外有人在听，听懂了算盘，就听懂了这家的家底。<\/li><li><strong>技巧1<\/strong>：算盘声=心跳（以声写局）<\/li><li><strong>技巧2<\/strong>：夜账的私密感（灯=舞台）<\/li><li><strong>技巧3<\/strong>：偷听者的视角切分<\/li><li><strong>跑团用法<\/strong>：凯旋结算的'夜账拍'：热闹散场后，给一幕算账的静戏。（挂 <strong>C14<\/strong>）<\/li><li><strong>改编示例<\/strong>：散了客，账房点了灯。 　算盘三声急，是今日的进项；一声缓，是还差的那笔。 　门外听账的伙计咽了口唾沫。<\/li><\/ul>\n<h2>15.3 三大环境主题桶（T6.1.2.b）<\/h2>\n<h3>15.3.1 风暴桶——\"风暴五阶旁白模板\"<\/h3>\n<div class='tbl'><table><thead><tr><th>阶<\/th><th>名<\/th><th>旁白要做什么<\/th><th>例句<\/th><\/tr><\/thead><tbody><tr><td>Ⅰ<\/td><td>远云<\/td><td>只给一个不对劲的视觉信号<\/td><td>\"西边的云压得太低，低得像另一片海。\"<\/td><\/tr><tr><td>Ⅱ<\/td><td>涌浪<\/td><td>让身体先知道（船的节奏变了）<\/td><td>\"涌先到了——船开始用另一种方式摇头。\"<\/td><\/tr><tr><td>Ⅲ<\/td><td>器具失灵<\/td><td>感官剥夺链启动（R01）<\/td><td>\"罗盘先疯了。\"<\/td><\/tr><tr><td>Ⅳ<\/td><td>声音吞噬<\/td><td>听不见人声，喊话改手势<\/td><td>\"说话没用，浪替所有人说了。\"<\/td><\/tr><tr><td>Ⅴ<\/td><td>时间失序<\/td><td>主观时间崩坏（一轮=多久？没人知道）<\/td><td>\"后来谁也说不清那一夜有多长——沙漏早就倒了。\"<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>配套 16 分册 C04 风暴帷幕卡：骰子归玩家（掌舵/操帆），<strong>旁白归五阶模板<\/strong>——每过一阶 GM 才升一档，不许一开场就写满。<\/blockquote>\n<h3>15.3.2 无风与闷热桶——\"停滞三戏\"<\/h3>\n<p>三句递进，让静止逼出人心：①<strong>物的静止<\/strong>（\"帆三天没响过了\"）→②<strong>人的怀疑<\/strong>（\"水手们开始看别人的脸\"）→③<strong>群体的沉默<\/strong>（\"所有人都不看了\"）（R03 全套）。库存轨/士气条在这三句里各推一格——停滞戏也要有机制后果。<\/p>\n<h3>15.3.3 夜景与雾桶——\"看不见的写法\"六句式<\/h3>\n<p>视觉不可用时，按通道轮替：<strong>声音<\/strong>（\"桨声在雾里变得很近\"）/ <strong>温度<\/strong>（\"雾是湿冷的，灯是湿热的——分不清哪个更难受\"）/ <strong>气味<\/strong>（\"焦味，但不是我们的\"）/ <strong>触觉<\/strong>（\"缆绳上有别人的手汗\"）/ <strong>时间<\/strong>（\"梆子响了七次，应该是六次\"）/ <strong>他者<\/strong>（\"有第二条船在跟着荡\"）。11 章幽灵船程序的配套文风：<strong>不写看见什么，只写少了什么。<\/strong><\/p>\n<h2>15.4 人物四桶（T6.1.3.a）<\/h2>\n<div class='tbl'><table><thead><tr><th>桶<\/th><th>技法<\/th><th>语料卡<\/th><th>用途帷幕<\/th><\/tr><\/thead><tbody><tr><td><strong>登场桶<\/strong><\/td><td>三幕登场法：传闻→侧影→正脸（R06/R08）<\/td><td>R06、R07、R08<\/td><td>C09、C10<\/td><\/tr><tr><td><strong>群像桶<\/strong><\/td><td>座位即等级、话题即军阶（R13）<\/td><td>R13<\/td><td>C09<\/td><\/tr><tr><td><strong>叛意桶<\/strong><\/td><td>心理时间拉伸：半秒写一章（R05）<\/td><td>R05<\/td><td>C15<\/td><\/tr><tr><td><strong>异域人物桶<\/strong><\/td><td>惊奇克制：不惊叹的观察者腔（R23/R25/R29）<\/td><td>R23–R30<\/td><td>C07、C08、C10<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>上桌演练<\/strong>（GM 对镜各念 60 秒）：<\/p>\n<ul class='mdlist'><li><strong>登场演练<\/strong>：念三个互相矛盾的传闻版本，最后一句落在\"只有老板娘的账本不撒谎\"。<\/li><li><strong>群像演练<\/strong>：报四个人物+四类话题，中途换一次风声，看谁先抬头——先抬头的是船长。<\/li><li><strong>叛意演练<\/strong>：把一句\"他跳了\"拉长成三句——起跳前、半空、水合拢。<\/li><li><strong>异域演练<\/strong>：描述一座陌生港口，禁止使用任何形容词，只许用地名、数字、货名。<\/li><\/ul>\n<h2>15.5 清单与账本美学（T6.1.4.a，本作特色桶）<\/h2>\n<p><strong>原则：数字给玩家，清单给耳朵。<\/strong> 经济结算（01/03 部）的文本出口——把掷骰和加减退到幕后，台前念一段有韵律的清单旁白。<\/p>\n<div class='tbl'><table><thead><tr><th>模板<\/th><th>场景<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td><strong>报货<\/strong><\/td><td>到港报关（C14）<\/td><td>\"三十担胡椒，八捆肉桂，一箱被雨吻过的姜黄。\"（R15）<\/td><\/tr><tr><td><strong>缴税<\/strong><\/td><td>海关完税（C10/C07）<\/td><td>\"抽分官蘸了蘸墨：'四成。'四个字，一整舱货就换了个主人的一半。\"<\/td><\/tr><tr><td><strong>分赃<\/strong><\/td><td>团队分账（C14，10.7 五档的口播版）<\/td><td>\"罗伯茨条款走起：船长两份，舵手一份半，伤者各加半份——念到名字的自己举手。\"（R38）<\/td><\/tr><tr><td><strong>战利<\/strong><\/td><td>捕获清点（C06/C05）<\/td><td>\"十二门炮里有六门能用，账册一本，腌肉若干——还有半舱没卖完的谎言。\"<\/td><\/tr><tr><td><strong>市集<\/strong><\/td><td>采买过场（C08）<\/td><td>\"瓦罐、盐、一段备帆、三打针——最后一样是给针路簿配的。\"（R23/R29）<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>清单旁白的三条戒律：<strong>有数<\/strong>（每一项带量词）、<strong>有人<\/strong>（最后落回一个人的一句反应）、<strong>有钩<\/strong>（清单末尾埋下一条下季线索——R20 的\"孵它的卵\"式）。<\/blockquote>\n<h2>15.6 本册验收清单<\/h2>\n<ul class='mdlist'><li><label class='task'><input type='checkbox' disabled checked> 语料 20 种 40 张拆解卡，全部带版权标注，双向索引帷幕编号（自检硬闸）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 风暴五阶 / 停滞三戏 / 夜景六句式，三桶各有例句。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 人物四桶 + 四段 60 秒上桌演练。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 清单旁白 5 模板，对接 10.7 分账五档读法。<\/label><\/li><\/ul>","text":"v1 世界引擎 P7 交付（计划06部 §6.1）。本册回答\"环境、人物、账本该怎么写\"：20 种语料、40 张拆解卡、三大环境主题桶、人物四桶与清单旁白模板。 纪律 ：拆解卡摘录一律 [公版原文] （可核实名句）或 [技法仿写] （自写示范句，贴技巧不贴原文）；全部\"仅教学引用\"。语料与帷幕双向索引——每张卡的\"跑团用法\"指向 16 分册的帷幕编号。 15.1 选目原则与总清单（T6.1.1.a） 四条原则：① 技法优先于文本 ——拆的是\"怎么写的\"，不是\"写了什么\"；② 公版纪律 ——见上；③ 每纪可用 ——S1–S5 每纪 ≥3 条可用语料（自检硬闸）；④ 双向索引 ——每卡挂帷幕编号，16 分册帷幕卡反引本册卡号（R01–R40）。 选目总表（20 种；'为什么选它'一句） 作品 作家 世纪 纪 为什么选它 《台风》 康拉德 1902 S3–S4–S5 把风暴写成了'仪器失灵的顺序'——全库最好的风暴工程学。 《阴影线》 康拉德 1917 S3–S4–S5 无风带与心魔：静止如何比运动更可怕。 《吉姆爷》 康拉德 1900 S4–S5 跳船半秒的心理时间拉伸——溃逃戏的慢镜头教科书。 《白鲸》 梅尔维尔 1851 S3–S4–S5 三幕登场法（亚哈）与狂信节拍（追击章）双料母本。 《海上劳工》 雨果 1866 S3–S4–S5 海窟独战与机器之战：孤胆算术与史诗调的范本。 《九三年》 雨果 1874 S4–S5 炮舱事故拍与'授勋/行刑同框'的军法冷热并置。 《怒海争锋》系列 奥布莱恩 1969 S4–S5 拿破仑海战的日常肌理：座次、话题、琐事如何承载大事件（S5 主参照）。 《鲁滨逊漂流记》 笛福 1719 S1–S2–S3–S4–S5 清单美学的原点：数字即心跳，本作'账本美学'的直系祖先。 《瘟疫年纪事》 笛福 1722 S2–S3–S4–S5 统计腔的钝击：死亡表越平静越可怕——疫年帷幕的文风底色。 《一千零一夜》辛巴达航记 （民间定本） 8–14世纪 S1–S2–S3–S4–S5 航海传奇的原型语法：必然的灾难、必然的生还、必然的再出发。 《基督山伯爵》 大仲马 1844 S3–S4–S5 港口复仇的节奏模板：先买楼后买人最后开口，每场对话一步棋。 《寰宇记》 马可·波罗口述／鲁斯蒂谦笔录 1298 S1–S2–S3–S4–S5 清单式惊奇：不惊叹的观察者腔，惊奇交给数字。 《瀛涯胜览》 马欢 1451 S1–S2–S3 郑和随行者的白描：三句定一城，货与人同列。 《星槎胜览》 费信 1436 S1–S2–S3 诗注双轨的纪行体：韵脚当罗盘，蒙太奇航段的现成语法。 《岛夷志略》 汪大渊 1349 S1–S2 14 世纪目击清单——S1 同代人的同代文风，王牌语料。 《两种海道针经》 （佚名船师） 明代 S1–S2–S3 针路簿的技术性诗意：'辰针二十二更'即完整句子，导航旁白母版。 《威尼斯商人》 莎士比亚 1597 S2–S3–S4–S5 商约与违约的戏剧核：合同的精确=引信的长度。 《亨利五世》 莎士比亚 1599 S2–S3–S4–S5 战前演说三层递进（少数→幸福→兄弟），动员拍的祖本。 《怒海余生》 吉卜林 1897 S4–S5 行话的墙与渔汛日历：以技艺量化成长的蒙太奇。 《金瓶梅》 兰陵笑笑生 明代 S1–S2–S3 牙行议价的中文腔：一句抬一句压一句绕到酒——市集戏母语。 全部拆解卡带 [公版原文] （可核实名句）或 [技法仿写] （自写示范句）标注；仅教学引用。 15.2 拆解卡 40 张（T6.1.2.a，统一格式） 格式： 摘录 （≤400 字，带版权标注）→ 技巧拆解 （3 点）→ 跑团用法 （帷幕编号＋模板）→ 改编示例 （把技巧套进燃帆场景的 3 句示范）。 R01 《台风》｜康拉德（1902｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：风暴是按仪器失灵的顺序写出来的：先是气压计疯掉，然后罗盘打转，最后连怀表也停了。叙述越来越短，短到只剩海本身在说话。 技巧1 ：以器材失灵顺序写风暴升级（气压计→罗盘→怀表） 技巧2 ：句子随风暴变短——节奏即风力 技巧3 ：从不说海'可怕'，只写海做了什么 跑团用法 ：风暴帷幕的'感官剥夺链'模板：GM 每轮关掉一种信息源（先看不见、再听不清、最后罗盘也疯了）。（挂 C04 ） 改编示例 ：罗盘先疯了——针在三枚刻度间打架。 随后是灯：风从灯芯里把火抽走。 最后是话，没人再说'浪'字，浪替他们说了。 R02 《台风》｜康拉德（1902｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：甲板之上是风暴，甲板之下是炉火。司炉们赤膊与煤共舞，铁锹的节拍比风还稳——两场风暴一齐烧，一场在桅顶，一场在炉膛。 技巧1 ：切到'风暴的对立面'（炉火/舱内）反衬 技巧2 ：群体动作蒙太奇：节拍写纪律 技巧3 ：船体剖面感：同一时刻两个舞台 跑团用法 ：风暴中段的'锅炉房拍'：把镜头切到稳定的地方，让不稳定的更可怕。（挂 C04 ） 改编示例 ：风暴在头顶骂了一整夜。 货舱底，司炉老周往炉门里铲了第八十铲煤。 '风大省煤。'他说。 R03 《阴影线》｜康拉德（1917｜海与风暴｜S4–S5） 摘录 〔技法仿写〕：帆一动不动，人心先动。船像被钉在海面上；病在船员中间走，比任何风都自由。年轻船长数自己还剩多少干净的水——数着数着，把恐惧数成了职责。 技巧1 ：以'静止'制造恐怖（无风=时间死亡） 技巧2 ：疾病拟人化：它'走'、它'挑人' 技巧3 ：自我对话写责任的重 跑团用法 ：平静航段'停滞三戏'母版：人心浮动的三句递进。（挂 C03 ） 改编示例 ：第三天没有风。 第四天，水手们开始看别人的脸。 第五天，所有人都不看了。 R04 《阴影线》｜康拉德（1917｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：药箱是空的——第一副药是水，第二副是更多的水。医生留下的清单成了全船最长的哀悼词。 技巧1 ：用'空'写绝望：药箱、名单、床位 技巧2 ：物件叙事：一只药箱讲完一场瘟疫 技巧3 ：一句一段的短促节奏 跑团用法 ：疫病帷幕的'物件塌方'模板：从一件失效的物资写起。（挂 C12 ） 改编示例 ：药箱打开，只有一封信。 信是上一任船医写的，写给下一任船医。 没有下一任了。 R05 《吉姆爷》｜康拉德（1900｜人物与对话｜S4–S5） 摘录 〔技法仿写〕：他从船舷翻出去的那半秒，有整整一章那么长。落水之前，他先落过了自己的一生。 技巧1 ：关键抉择的时间膨胀（半秒写一章） 技巧2 ：不辩护的自白体：让行为自己说话 技巧3 ：旁观者视点切割：每个人记得的版本不同 跑团用法 ：溃逃与失败的'慢镜头条款'：哗变检定失败后，时间放慢，让选择被看清。（挂 C15 ） 改编示例 ：海在下面等他。 半空里他想起了母亲、船费、和那句没说完的'站稳'。 水面合拢，像一句收回的话。 R06 《吉姆爷》｜康拉德（1900｜人物与对话｜S4–S5） 摘录 〔技法仿写〕：每个人讲一个吉姆。酒馆里他的名字比他本人早到了三章——有人说他死了，有人说他发了，只有老板娘知道他欠的酒钱还没结。 技巧1 ：延迟出场：名字先于人到达 技巧2 ：传闻互相打架=人物立体 技巧3 ：用账目给传闻称重（欠账最真） 跑团用法 ：酒馆听闻'三幕登场法'第一幕：传闻。重要 NPC 首秀先给三个互相矛盾的版本。（挂 C09 ） 改编示例 ：'他死在孟买了。''他上个月还在亚丁。''他的酒钱还挂着呢。'——老板娘的账本从不撒谎。 R07 《白鲸》｜梅尔维尔（1851｜人物与对话｜S3–S4–S5） 摘录 〔公版原文〕：Call me Ishmael.（叫我以实玛利吧。）——全书开场仅三词：自报家门、来历不明、幸存者口吻一次到位。 技巧1 ：开场即定调：三词完成叙述者档案 技巧2 ：'叫我'而非'我是'：名字是标签不是身份 技巧3 ：幸存者预设：读者已知船会沉 跑团用法 ：开局定场'白描版'三句钩的极简范例。（挂 C01 ） 改编示例 ：叫我阿七。 这是条运陶器的船，我是它最后一只没碎的碗。 下面的事，发生在它还是两只碗的时候。 R08 《白鲸》｜梅尔维尔（1851｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：亚哈缺席了开篇三分之一：先闻其名，后见其腿——一枚用鲸牙车的小腿骨钉在甲板上，人才出现。传闻替他铺场，象牙替他签名。 技巧1 ：三幕登场法：传闻→侧影→正脸 技巧2 ：信物先于人物（牙腿/铜币） 技巧3 ：登场的'缺席'设计：越晚越重 跑团用法 ：重要 NPC 首秀帷幕：先给信物与传闻，最后给本人。（挂 C09 ） 改编示例 ：船长室三天没开门，门缝里只递出航向。 水手长把一枚银币钉上桅顶：'船长的。' 第四天门开了，大家反而没敢看。 R09 《海上劳工》｜雨果（1866｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：海窟里，一个人对一条章鱼。对手越大，句子越静。他数自己的呼吸像数一枚硬币的两面——翻过来是力气，翻过去是没气。 技巧1 ：静写巨物：形容词越少体量越大 技巧2 ：地形即敌人（海窟=闭合的胃） 技巧3 ：孤胆算术：一口气=资源条 跑团用法 ：接舷肉搏的单挑拍：把 HP 换算成呼吸，读者自己会紧张。（挂 C06 ） 改编示例 ：章鱼比洞口还宽。 他吸了半口气，把自己交给出手的姿势。 洞外，潮水开始退。 R10 《海上劳工》｜雨果（1866｜海与风暴｜S3–S4–S5） 摘录 〔技法仿写〕：他与风暴的战争打在机器上：拆一台发动机回船，如同从神的嘴里抢回一句台词。每一枚螺栓拧下来，风就大一分。 技巧1 ：史诗调：人对抗的不是海是命运 技巧2 ：以'拆解'写征服（逆向建造） 技巧3 ：每一枚螺栓=一次掷骰的重量 跑团用法 ：风暴帷幕'史诗调'变奏：风暴中给一件必须完成的工程任务。（挂 C04 ） 改编示例 ：风要这台机器，他要。 第九枚螺栓松开时，天全黑了。 他把最后一枚含在嘴里，像含着一句誓言。 R11 《九三年》｜雨果（1874｜战争与权谋｜S4–S5） 摘录 〔技法仿写〕：挣脱的炮在舱里横冲直撞，一门炮成了一头困兽。船舱的每一根肋骨都在替它记路——灾难有了自己的航行术。 技巧1 ：把武器写成猛兽（挣脱的炮） 技巧2 ：舱内地理：梁、肋、舱口=兽栏 技巧3 ：灾难慢镜头：一秒拆成十步 跑团用法 ：海战开火的'事故拍'：炮脱索/桅断的舱内戏模板。（挂 C05 ） 改编示例 ：炮脱了索。 它先撞碎了左舷的灯塔柜，又碾过三张吊床。 全船安静下来，听它掉头。 R12 《九三年》｜雨果（1874｜战争与权谋｜S4–S5） 摘录 〔技法仿写〕：同一块甲板：先授勋，后行刑。军法把两张文书放在同一个托盘里端上来，军官读完一张，再读另一张，中间只换了一次呼吸。 技巧1 ：仪式对切：授勋/死刑同框 技巧2 ：军法的冷与热的并置 技巧3 ：文书=叙事道具（读出声来） 跑团用法 ：审讯与谈判的'军法变调'：裁决与恩赏一并落地，不留缓冲。（挂 C11 ） 改编示例 ：'嘉奖令：炮手盖兰。' '死刑令：炮手盖兰。' 他立正听完两张，说：谢舰长。 R13 《怒海争锋》系列｜奥布莱恩（1969｜人物与对话｜S4–S5） 摘录 〔技法仿写〕：军官餐桌：座位即等级，话题即军阶。厨师谈牛肉，军需谈牛肉的价钱，船长谈风——直到风真的变了，全场只有一个人抬头。 技巧1 ：以座次写等级（不写官阶写位置） 技巧2 ：
