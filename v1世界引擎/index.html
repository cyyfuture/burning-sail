物产即情报，每条短到近乎电报。这是 S1 的母语料：同代人写同代人。 技巧1 ：地名连缀=航线本身 技巧2 ：物产即情报（货可比人先到） 技巧3 ：电报体短句（S1 同代口吻） 跑团用法 ：市集议价 S1 母腔：GM 开口前先在心里过一遍电报体。（挂 C08 ） 改编示例 ：彭湖：砂砾，无他产，有细布。 琉球：翠羽、胡椒。 船到之前，货单已经先认识对方了。 R30 《岛夷志略》｜汪大渊（1349｜东亚航海｜S1–S2） 摘录 〔技法仿写〕：土酋谒见：客以布帛为礼，酋以椒盐相还——礼单就是价格表，谁多出一句寒暄，谁就先输了价。 技巧1 ：礼单=价格表（礼物即谈判） 技巧2 ：对等回礼的精确性 技巧3 ：沉默作为筹码 跑团用法 ：官厅谒见'土酋变奏'：S1 的官厅就是一张铺着椒盐的席。（挂 C10 ） 改编示例 ：布帛铺开，酋长不数。 椒盐推回来，船主也不数。 两人对饮一碗，价就定了——通事事后才敢问是多少。 R31 《两种海道针经》｜（佚名船师）（明代｜东亚航海｜S1–S2–S3） 摘录 〔技法仿写〕：'用辰针二十二更船取乌猪洋'——罗盘方位+更数=完整的一句航程。技术词自带节奏：针是方向，更是时间，风险藏在每一次改针处。 技巧1 ：技术词的节奏感（方位+更数=句子） 技巧2 ：更数=时间单位（一更≈一昼夜的六十分之一航程） 技巧3 ：风险标记法：'取''防''恐'三字分级 跑团用法 ：出航'导航旁白'模板：GM 念针路当咒语，玩家听改针处。（挂 C02 ） 改编示例 ：出港用巽针，三更防浅。 过乌猪洋改辰针，二十二更。 针簿在老舵手手里，他今晚只说了前一半。 R32 《两种海道针经》｜（佚名船师）（明代｜东亚航海｜S1–S2–S3） 摘录 〔技法仿写〕：认路不靠字，靠山形水势：'山如笔架，水色黄白'——白天认形，夜里听水。针簿的注脚全是眼睛和耳朵。 技巧1 ：以形认路（山的剪影=坐标） 技巧2 ：水色与水声=导航数据 技巧3 ：注脚口语化（师傅口吻） 跑团用法 ：平静航段的'认路拍'：用一句山形一句水色，把玩家放进航道里。（挂 C03 ） 改编示例 ：山如笔架，就是这儿了。 水色转黄白，底下有沙。 '都别说话。'老舵手侧耳听了一刻钟的水。 R33 《威尼斯商人》｜莎士比亚（1597｜人物与对话｜S2–S3–S4–S5） 摘录 〔公版原文〕：\"The quality of mercy is not strained.\"（慈悲不是勉强的品质——它像甘霖自天而降，双重赐福。）法庭戏里最软的一句，是最后称重的一句。 技巧1 ：法庭=剧场（台词即判词） 技巧2 ：把抽象（慈悲）写成物件（甘霖） 技巧3 ：反问的杠杆（连环反问压对方） 跑团用法 ：审讯与谈判的'说情拍'：让一句话改变裁决的重心。（挂 C11 ） 改编示例 ：'船沉了，人还在。'律师说。 '契约写的是船。'债主说。 旁听席上有人小声问：人算不算货？ R34 《威尼斯商人》｜莎士比亚（1597｜人物与对话｜S2–S3–S4–S5） 摘录 〔技法仿写〕：一磅肉的契约：条款越精确，引线越短。'到期不还，割肉一磅'——签约时人人微笑，履约时字字见血。 技巧1 ：合同的精确=戏剧的引信 技巧2 ：字面主义的恐怖（只按字面执行） 技巧3 ：豁免条款的反杀（一滴血也不许） 跑团用法 ：审讯与谈判'商约变调'：让一份签好的字据反咬一口。（挂 C11 ） 改编示例 ：字据上写'一磅肉'，没写'连同血'。 '血是货吗？''不是。''那就别让它滴。' R35 《亨利五世》｜莎士比亚（1599｜战争与权谋｜S2–S3–S4–S5） 摘录 〔公版原文〕：\"We few, we happy few, we band of brothers.\"（我们少数人，我们幸福少数人，我们一伙兄弟。）——战前演说的三层递进：少数→幸福→兄弟，劣势被说成了选择。 技巧1 ：点名制亲密（今日点名者终身为友） 技巧2 ：把劣势说成选择（人少=荣耀密度高） 技巧3 ：未来回忆时态（讲给'将来的老人'听） 跑团用法 ：海战开火'战前动员'：接舷前三分钟给一段点名。（挂 C05 ） 改编示例 ：船上三十一人，他一个个叫了名字。 '明天过后，这些名字就是一伙兄弟的名字。' 没有鼓，只有缆绳吱呀。 R36 《亨利五世》｜莎士比亚（1599｜战争与权谋｜S2–S3–S4–S5） 摘录 〔技法仿写〕：练兵场戏：军令全用白话——'帽子戴正，缆绳摸一遍，别在夜里念家乡'。将官的威信用最平常的句子钉进人心里。 技巧1 ：军令白话化（越短越重） 技巧2 ：禁令即抒情（'别念家乡'=他也在忍） 技巧3 ：以动作清单代替训话 跑团用法 ：出航帷幕'军令拍'：启航令写成三件小事。（挂 C02 ） 改编示例 ：命令只有三条：帽檐压低、缆绳摸一遍、夜里别唱挽歌。 '为什么？''因为我要唱。' R37 《怒海余生》｜吉卜林（1897｜人物与对话｜S4–S5） 摘录 〔技法仿写〕：被打捞的少爷上了渔船，头一课不是掌舵，是认行话——'缭绳''压舷''收鱼'。行话是一堵墙，学会一堵墙，才算进门。 技巧1 ：以技艺量化成长（会几样活=什么人） 技巧2 ：渔汛的日历感（季节即日程） 技巧3 ：行话的墙（外人听不懂=阶层） 跑团用法 ：平静航段'成长蒙太奇'：用三项技艺的习得标记时间。（挂 C03 ） 改编示例 ：第一周他只会挨骂。 第二周他会了'缭绳'这个词。 第三周，骂他的人把舵让了半个更次。 R38 《怒海余生》｜吉卜林（1897｜清单与账本｜S4–S5） 摘录 〔技法仿写〕：渔船分账：每舱鱼过秤记账，少年念数，船主落笔——'鱼的账'就是'人的账'，谁懒一网，秤知道。 技巧1 ：秤=裁判（过秤即公示） 技巧2 ：念数与落笔的双声部 技巧3 ：账目即人品（懒一网，账知道） 跑团用法 ：凯旋结算'分赃清单'：分账的口播版，人人听见自己的数。（挂 C14 ） 改编示例 ：'三舱，四百二十斤。'少年念。 笔尖顿了顿：'你的名字下面记一笔懒。' 全船都笑了，只有被记的人记了一年。 R39 《金瓶梅》｜兰陵笑笑生（明代｜港口与市井｜S1–S2–S3） 摘录 〔技法仿写〕：牙行议价的中文腔：一句抬、一句压、一句绕到酒——'这价嘛，先吃盏茶再说'。数字在闲谈里落地，脸皮在酒盅里成交。 技巧1 ：话里有话的三段式（抬/压/绕） 技巧2 ：以饮食写交易（茶酒=缓冲带） 技巧3 ：数字藏在闲谈里（报价先绕三圈） 跑团用法 ：市集议价'中文腔调'参照：对手戏模板直接套用。（挂 C08 ） 改编示例 ：'这价嘛——先吃盏茶。' 茶过三巡，价落了两个来回。 '再添一篓，我请你吃酒。'买卖就成了。 R40 《金瓶梅》｜兰陵笑笑生（明代｜清单与账本｜S1–S2–S3） 摘录 〔技法仿写〕：账房的夜：灯下算盘是叙事的心跳——三声急、一声缓，门外有人在听，听懂了算盘，就听懂了这家的家底。 技巧1 ：算盘声=心跳（以声写局） 技巧2 ：夜账的私密感（灯=舞台） 技巧3 ：偷听者的视角切分 跑团用法 ：凯旋结算的'夜账拍'：热闹散场后，给一幕算账的静戏。（挂 C14 ） 改编示例 ：散了客，账房点了灯。 算盘三声急，是今日的进项；一声缓，是还差的那笔。 门外听账的伙计咽了口唾沫。 15.3 三大环境主题桶（T6.1.2.b） 15.3.1 风暴桶——\"风暴五阶旁白模板\" 阶 名 旁白要做什么 例句 Ⅰ 远云 只给一个不对劲的视觉信号 \"西边的云压得太低，低得像另一片海。\" Ⅱ 涌浪 让身体先知道（船的节奏变了） \"涌先到了——船开始用另一种方式摇头。\" Ⅲ 器具失灵 感官剥夺链启动（R01） \"罗盘先疯了。\" Ⅳ 声音吞噬 听不见人声，喊话改手势 \"说话没用，浪替所有人说了。\" Ⅴ 时间失序 主观时间崩坏（一轮=多久？没人知道） \"后来谁也说不清那一夜有多长——沙漏早就倒了。\" 配套 16 分册 C04 风暴帷幕卡：骰子归玩家（掌舵/操帆）， 旁白归五阶模板 ——每过一阶 GM 才升一档，不许一开场就写满。 15.3.2 无风与闷热桶——\"停滞三戏\" 三句递进，让静止逼出人心：① 物的静止 （\"帆三天没响过了\"）→② 人的怀疑 （\"水手们开始看别人的脸\"）→③ 群体的沉默 （\"所有人都不看了\"）（R03 全套）。库存轨/士气条在这三句里各推一格——停滞戏也要有机制后果。 15.3.3 夜景与雾桶——\"看不见的写法\"六句式 视觉不可用时，按通道轮替： 声音 （\"桨声在雾里变得很近\"）/ 温度 （\"雾是湿冷的，灯是湿热的——分不清哪个更难受\"）/ 气味 （\"焦味，但不是我们的\"）/ 触觉 （\"缆绳上有别人的手汗\"）/ 时间 （\"梆子响了七次，应该是六次\"）/ 他者 （\"有第二条船在跟着荡\"）。11 章幽灵船程序的配套文风： 不写看见什么，只写少了什么。 15.4 人物四桶（T6.1.3.a） 桶 技法 语料卡 用途帷幕 登场桶 三幕登场法：传闻→侧影→正脸（R06/R08） R06、R07、R08 C09、C10 群像桶 座位即等级、话题即军阶（R13） R13 C09 叛意桶 心理时间拉伸：半秒写一章（R05） R05 C15 异域人物桶 惊奇克制：不惊叹的观察者腔（R23/R25/R29） R23–R30 C07、C08、C10 上桌演练 （GM 对镜各念 60 秒）： 登场演练 ：念三个互相矛盾的传闻版本，最后一句落在\"只有老板娘的账本不撒谎\"。 群像演练 ：报四个人物+四类话题，中途换一次风声，看谁先抬头——先抬头的是船长。 叛意演练 ：把一句\"他跳了\"拉长成三句——起跳前、半空、水合拢。 异域演练 ：描述一座陌生港口，禁止使用任何形容词，只许用地名、数字、货名。 15.5 清单与账本美学（T6.1.4.a，本作特色桶） 原则：数字给玩家，清单给耳朵。 经济结算（01/03 部）的文本出口——把掷骰和加减退到幕后，台前念一段有韵律的清单旁白。 模板 场景 例 报货 到港报关（C14） \"三十担胡椒，八捆肉桂，一箱被雨吻过的姜黄。\"（R15） 缴税 海关完税（C10/C07） \"抽分官蘸了蘸墨：'四成。'四个字，一整舱货就换了个主人的一半。\" 分赃 团队分账（C14，10.7 五档的口播版） \"罗伯茨条款走起：船长两份，舵手一份半，伤者各加半份——念到名字的自己举手。\"（R38） 战利 捕获清点（C06/C05） \"十二门炮里有六门能用，账册一本，腌肉若干——还有半舱没卖完的谎言。\" 市集 采买过场（C08） \"瓦罐、盐、一段备帆、三打针——最后一样是给针路簿配的。\"（R23/R29） 清单旁白的三条戒律： 有数 （每一项带量词）、 有人 （最后落回一个人的一句反应）、 有钩 （清单末尾埋下一条下季线索——R20 的\"孵它的卵\"式）。 15.6 本册验收清单 语料 20 种 40 张拆解卡，全部带版权标注，双向索引帷幕编号（自检硬闸）。 风暴五阶 / 停滞三戏 / 夜景六句式，三桶各有例句。 人物四桶 + 四段 60 秒上桌演练。 清单旁白 5 模板，对接 10.7 分账五档读法。"},{"num":"16","title":"帷幕速查与带团技艺","vol":"卷四 · 人物 · AI · 文本 · 技艺","skeleton":false,"html":"<blockquote class='quote'>v1 世界引擎 P7 交付（计划06部 §6.2–6.4）。<strong>定位声明：扩展不替代<\/strong>——13 章《游戏主持指南》仍是第一优先级，本册只增三样：世界引擎的主持法、跨纪主持技巧、多人经济戏调度（§16.6）。帷幕=重复出现的场景类型（固定功能＋固定节奏风险＋固定骰子挂点）；每卡开场三句可直接上桌，骰子挂点 ≤3 处。<\/blockquote>\n<h2>16.1 帷幕总表（18 类，五列速查）<\/h2>\n<div class='tbl'><table><thead><tr><th>#<\/th><th>帷幕<\/th><th>功能（卖什么体验）<\/th><th>典型时长<\/th><th>节奏风险<\/th><th>骰子挂点<\/th><\/tr><\/thead><tbody><tr><td>C01<\/td><td>开局定场<\/td><td>定调、立世界<\/td><td>15 分钟<\/td><td>平<\/td><td>0–1<\/td><\/tr><tr><td>C02<\/td><td>出航<\/td><td>仪式感、立日程<\/td><td>10 分钟<\/td><td>低<\/td><td>1<\/td><\/tr><tr><td>C03<\/td><td>平静航段<\/td><td>蒙太奇、成长与停滞<\/td><td>15 分钟<\/td><td>拖<\/td><td>1–2<\/td><\/tr><tr><td>C04<\/td><td>风暴<\/td><td>失控感<\/td><td>20 分钟<\/td><td>高<\/td><td>2–3<\/td><\/tr><tr><td>C05<\/td><td>海战开火<\/td><td>火力与秩序<\/td><td>20 分钟<\/td><td>高<\/td><td>2–3<\/td><\/tr><tr><td>C06<\/td><td>接舷肉搏<\/td><td>贴身暴力<\/td><td>20 分钟<\/td><td>高<\/td><td>2–3<\/td><\/tr><tr><td>C07<\/td><td>港口入城<\/td><td>异域感、准入<\/td><td>10 分钟<\/td><td>低<\/td><td>1<\/td><\/tr><tr><td>C08<\/td><td>市集议价<\/td><td>经济博弈的肉身化<\/td><td>15 分钟<\/td><td>中<\/td><td>2<\/td><\/tr><tr><td>C09<\/td><td>酒馆听闻<\/td><td>信息市场、人物登场<\/td><td>15 分钟<\/td><td>中<\/td><td>1<\/td><\/tr><tr><td>C10<\/td><td>官厅谒见<\/td><td>权力的重量<\/td><td>15 分钟<\/td><td>中<\/td><td>1–2<\/td><\/tr><tr><td>C11<\/td><td>审讯与谈判<\/td><td>语言即刀<\/td><td>20 分钟<\/td><td>中<\/td><td>2<\/td><\/tr><tr><td>C12<\/td><td>疫病与死亡<\/td><td>脆弱、无常<\/td><td>15 分钟<\/td><td>压抑<\/td><td>1–2<\/td><\/tr><tr><td>C13<\/td><td>葬礼<\/td><td>告别、结算情感<\/td><td>10 分钟<\/td><td>低<\/td><td>0–1<\/td><\/tr><tr><td>C14<\/td><td>凯旋结算<\/td><td>账本的高光时刻<\/td><td>15 分钟<\/td><td>平→高<\/td><td>1<\/td><\/tr><tr><td>C15<\/td><td>溃逃与失败<\/td><td>耻感、抉择<\/td><td>15 分钟<\/td><td>高<\/td><td>1–2<\/td><\/tr><tr><td>C16<\/td><td>超自然遭遇<\/td><td>未知的恐惧<\/td><td>15 分钟<\/td><td>高<\/td><td>1<\/td><\/tr><tr><td>C17<\/td><td>回忆与闪回<\/td><td>补叙事、省航程<\/td><td>10 分钟<\/td><td>乱<\/td><td>1<\/td><\/tr><tr><td>C18<\/td><td>尾声<\/td><td>传承的引出位<\/td><td>15 分钟<\/td><td>散<\/td><td>0–1<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>13 章航段脚本六段与 14 章模组全部场景可归类入此 18 类（回归映射通过）；18 类互斥不重叠。<\/blockquote>\n<h2>16.2 十八张帷幕卡<\/h2>\n<p><strong>统一格式<\/strong>：功能／开场三句（白描版｜腔调版）／节奏与张力曲线（0–10；钉子=挂点）／骰子挂点／技巧件（15 分册 R 卡）／变调（恐怖调·市井调·史诗调）／翻车点。<\/p>\n<h3>C01 开局定场<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：用三分钟让桌上有\"世界\"，不只是\"任务\"。<\/li><li><strong>开场三句<\/strong>——白描：<code>退潮后，沙滩上留着船的龙骨。他点了点：狗一只，火药两桶，同伴没有。他开始走，按清单的顺序。<\/code>（R16）｜腔调：<code>新的一季从一本翻开的账开始：三笔旧债，一条新桅。<\/code><\/li><li><strong>节奏/曲线<\/strong>：2-4-6-5——定调爬坡，落点留钩。<\/li><li><strong>挂点<\/strong>：①身份与天赋确认（照 04 章，不另掷）。<\/li><li><strong>技巧件<\/strong>：R07、R16（三词开场/点数式白描）。<\/li><li><strong>变调<\/strong>：恐怖=<code>没有任何一艘船的残骸属于这片海。<\/code>市井=<code>开场的第一个声音是讨价还价。<\/code>史诗=<code>史官落笔：本季无大事——除海上的以外。<\/code><\/li><li><strong>翻车点<\/strong>：念完世界观设定——玩家要的不是听书，是上船。<\/li><\/ul>\n<h3>C02 出航<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：把日程表变成仪式，把规则提示藏进号令。<\/li><li><strong>开场三句<\/strong>——白描：<code>命令只有三条：帽檐压低、缆绳摸一遍、夜里别唱挽歌。<\/code>（R36）｜腔调：<code>出港用巽针，三更防浅——针簿在老舵手手里，他今晚只说了前一半。<\/code>（R31）<\/li><li><strong>节奏/曲线<\/strong>：3-5-7-4——小高潮在\"解缆\"。<\/li><li><strong>挂点<\/strong>：①航前检定（07 章备航，一项）。<\/li><li><strong>技巧件<\/strong>：R14、R24、R31、R36（琐事压阵/异域船感/导航旁白/军令拍）。<\/li><li><strong>变调<\/strong>：恐怖=<code>名单上多了一行没人认领的名字。<\/code>市井=<code>出港的祝词是牙人教的，为了下一单生意。<\/code>史诗=<code>全港的钟为一条船响。<\/code><\/li><li><strong>翻车点<\/strong>：把备航清单逐项问完——三项足矣，其余默认完成。<\/li><\/ul>\n<h3>C03 平静航段<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：蒙太奇——用时间换成长、换关系、换暗流。<\/li><li><strong>开场三句<\/strong>——白描：<code>第三天没有风。第四天，水手们开始看别人的脸。<\/code>（R03）｜腔调：<code>满剌加多雨，古里多商，忽鲁谟斯多风——水手们把这句编成了号子。<\/code>（R27）<\/li><li><strong>节奏/曲线<\/strong>：4-3-5-3——低而稳，末梢微挑。<\/li><li><strong>挂点<\/strong>：①停滞三戏各推一格（士气/库存）；② fatigue/坏血病检定（07 章，每航段一次）。<\/li><li><strong>技巧件<\/strong>：R03、R27、R32、R37（停滞三戏/诗注蒙太奇/认路拍/成长蒙太奇）。<\/li><li><strong>变调<\/strong>：恐怖=<code>数到第七次梆子——应该是六次。<\/code>市井=<code>船上学会的第一句行话，是骂人的那句。<\/code>史诗=<code>他们数着更次，把一段海走成了传说。<\/code><\/li><li><strong>翻车点<\/strong>：真的一天天过日子——蒙太奇要\"剪\"，每拍只给一句。<\/li><\/ul>\n<h3>C04 风暴<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：失控感——规则保证危险，文本负责敬畏。<\/li><li><strong>开场三句<\/strong>——白描：<code>西边的云压得太低，低得像另一片海。涌先到了——船开始用另一种方式摇头。<\/code>｜腔调：<code>罗盘先疯了——针在三枚刻度间打架。<\/code>（R01）<\/li><li><strong>节奏/曲线<\/strong>：5-6-8-10-9-6——五阶爬升，风眼回落。<\/li><li><strong>挂点<\/strong>：①掌舵；②操帆；③危机掷（07 章风暴三掷制，严格对齐）。<\/li><li><strong>技巧件<\/strong>：R01、R02、R10（感官剥夺链/锅炉房拍/史诗调工程任务）。<\/li><li><strong>变调<\/strong>：恐怖=<code>灯从灯芯里被风抽走了，黑暗先于浪到达。<\/code>市井=<code>厨子还在数还有几个能用的蛋。<\/code>史诗=<code>风要这台机器，他要。<\/code><\/li><li><strong>翻车点<\/strong>：一开场写满五阶——每过一阶才升一档，别预支敬畏。<\/li><\/ul>\n<h3>C05 海战开火<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：火力与秩序——舰炮是数学，甲板是纪律。<\/li><li><strong>开场三句<\/strong>——白描：<code>炮脱了索。它先撞碎了左舷的灯塔柜，又碾过三张吊床。全船安静下来，听它掉头。<\/code>（R11）｜腔调：<code>战报十二字：遇敌，接战，俘二，损一，归港。<\/code><\/li><li><strong>节奏/曲线<\/strong>：6-7-9-10-7——挂点即峰。<\/li><li><strong>挂点<\/strong>：①先攻（09 章）；②齐射（DV14）；③战位动员（接舷前置）。<\/li><li><strong>技巧件<\/strong>：R08、R11、R35（狂信节拍/事故拍/战前动员）。<\/li><li><strong>变调<\/strong>：恐怖=<code>那炮的口径，不属于本海区任何一国。<\/code>市井=<code>炮声里还有人惦记着舱底的酒。<\/code>史诗=<code>船上三十一人，他一个个叫了名字。<\/code>（R35）<\/li><li><strong>翻车点<\/strong>：炮击来回空转——三轮内必须发生\"改变局面的事件\"（断桅/起火/接舷）。<\/li><\/ul>\n<h3>C06 接舷肉搏<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：贴身暴力——把 HP 翻译成呼吸。<\/li><li><strong>开场三句<\/strong>——白描：<code>章鱼比洞口还宽。他吸了半口气，把自己交给出手的姿势。<\/code>（R09）｜腔调：<code>跳帮三次，夺船一艘——伤者按名。<\/code><\/li><li><strong>节奏/曲线<\/strong>：7-9-10-8。<\/li><li><strong>挂点<\/strong>：①接舷动员（+2，09 章）；②战位动作；③单挑拍（可选）。<\/li><li><strong>技巧件<\/strong>：R09（孤胆算术：一口气=资源条）。<\/li><li><strong>变调<\/strong>：恐怖=<code>对方的水手没有一个出声。<\/code>市井=<code>打完先抢厨房——规矩。<\/code>史诗=<code>两船相撞的那一下，是这场战争的标点。<\/code><\/li><li><strong>翻车点<\/strong>：回合制念完十二轮——肉搏按\"波\"结算，每波一句画面。<\/li><\/ul>\n<h3>C07 港口入城<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：异域感与准入——三句定一城。<\/li><li><strong>开场三句<\/strong>——白描：<code>港无石城，竹栅为界。男子束发，女子短裙。市上椒山堆积——番银不通行，只认布。<\/code>（R25）｜腔调：<code>城门志：异乡船员若干人上岸，去向未录。<\/code><\/li><li><strong>节奏/曲线<\/strong>：3-5-6。<\/li><li><strong>挂点<\/strong>：①检疫/海关检定（09 分册）。<\/li><li><strong>技巧件<\/strong>：R23、R25、R29（异域白描/清单式惊奇/电报体）。<\/li><li><strong>变调<\/strong>：恐怖=<code>这港没有海关——只有邻居。<\/code>市井=<code>入城的第一个问题是：税，还是礼？<\/code>史诗=<code>城门口的石柱上，刻着上一个不肯纳税的船名。<\/code><\/li><li><strong>翻车点<\/strong>：把城市设定倒出来——玩家只关心\"能干什么、要付出什么\"。<\/li><\/ul>\n<h3>C08 市集议价<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：经济系统的肉身化——让价格长出脸。<\/li><li><strong>开场三句<\/strong>——白描：<code>码头上，牙人报数：胡椒三百包，苏木一百二十担。<\/code>（R23）｜腔调：<code>'这价嘛——先吃盏茶。'茶过三巡，价落了两个来回。<\/code>（R39）<\/li><li><strong>节奏/曲线<\/strong>：4-6-8-6——三轮议价，中段最热。<\/li><li><strong>挂点<\/strong>：①议价检定（交易/交涉可换序，09 分册三轮制）；②行情骰（GM 密掷）。<\/li><li><strong>技巧件<\/strong>：R23、R29、R39（清单收尾/S1 电报体/中文腔）。<\/li><li><strong>变调<\/strong>：恐怖=<code>市场上什么都有——除了昨天还有的那样东西。<\/code>市井=<code>价是谈出来的，脸是留着的。<\/code>史诗=<code>这一价，定的是下一年这条航路的命。<\/code><\/li><li><strong>翻车点<\/strong>：真把算式念出来——算式在幕后，台前只给对手戏与清单。<\/li><\/ul>\n<h3>C09 酒馆听闻<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：信息市场——酒馆是任务板的人形版。<\/li><li><strong>开场三句<\/strong>——白描：<code>'他死在孟买了。''他上个月还在亚丁。''他的酒钱还挂着呢。'<\/code>（R06）｜腔调：<code>老板娘擦着杯子说：'这条街上的消息，比货先上船。'<\/code><\/li><li><strong>节奏/曲线<\/strong>：3-5-7-4。<\/li><li><strong>挂点<\/strong>：①传闻检定（10.8，三真一假服务）。<\/li><li><strong>技巧件<\/strong>：R06、R08、R13（传闻打架/三幕登场法/群像座次）。<\/li><li><strong>变调<\/strong>：恐怖=<code>角落里那桌，从头到尾没点酒。<\/code>市井=<code>消息的汇率：一杯啤酒换一条真的，两杯换一条假的。<\/code>史诗=<code>多年以后，有人会说命运是在这张桌上转向的。<\/code><\/li><li><strong>翻车点<\/strong>：GM 把真话和假话的语气做成一样的——假的要更好听。<\/li><\/ul>\n<h3>C10 官厅谒见<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：权力的重量——仪式即语言。<\/li><li><strong>开场三句<\/strong>——白描：<code>诏书读一句，通事译一句，酋长俯首一次。丝绸抬上来，胡椒抬下去。<\/code>（R26）｜腔调：<code>'总督府昨夜灯亮到三更——账房的人进了后门。'<\/code><\/li><li><strong>节奏/曲线<\/strong>：4-6-8。<\/li><li><strong>挂点<\/strong>：①礼仪检定（律法/交涉）；②陈情（一场话改变一个数字）。<\/li><li><strong>技巧件<\/strong>：R22、R26、R30（体面下的刀/朝贡对账/礼单即价格表）。<\/li><li><strong>变调<\/strong>：恐怖=<code>大殿很安静——安静得听得见算盘。<\/code>市井=<code>官老爷先问的居然是行情。<\/code>史诗=<code>这一跪，两个海认了同一个主。<\/code><\/li><li><strong>翻车点<\/strong>：让 NPC 一次把底牌说完——权力喜欢分三次说。<\/li><\/ul>\n<h3>C11 审讯与谈判<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：语言即刀——每句话吃一子。<\/li><li><strong>开场三句<\/strong>——白描：<code>'你想问什么？'对方问了三个问题。'很好，这三个答案，我各收一样东西。'<\/code>（R21）｜腔调：<code>字据上写'一磅肉'，没写'连同血'。<\/code>（R34）<\/li><li><strong>节奏/曲线<\/strong>：5-7-9-8。<\/li><li><strong>挂点<\/strong>：①交涉/洞悉对抗；②底线检定（失败让步一档）。<\/li><li><strong>技巧件<\/strong>：R21、R33、R34（复仇模板/慈悲称重/字面主义）。<\/li><li><strong>变调<\/strong>：恐怖=<code>审讯没有问题——只有沉默和记录。<\/code>市井=<code>谈判桌上先上酒，后上账。<\/code>史诗=<code>他替全船的人签了那个字。<\/code><\/li><li><strong>翻车点<\/strong>：GM 替 NPC 说服玩家——NPC 出价，玩家选。<\/li><\/ul>\n<h3>C12 疫病与死亡<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：脆弱与无常——数字越平静越可怕。<\/li><li><strong>开场三句<\/strong>——白描：<code>本周，圣玛丽堂区：四十一人。上周：九人。公告栏前没人说话。<\/code>（R17）｜腔调：<code>药箱打开，只有一封信。<\/code>（R04）<\/li><li><strong>节奏/曲线<\/strong>：4-5-6-7——缓坡压抑，不设峰。<\/li><li><strong>挂点<\/strong>：①医疗/检疫检定；②死亡表（13 分册疫年 +3）。<\/li><li><strong>技巧件<\/strong>：R04、R17、R18（物件塌方/统计腔/封锁市井调）。<\/li><li><strong>变调<\/strong>：恐怖=<code>医生的名字也上了本周的表。<\/code>市井=<code>面包铺的队排到了码头。<\/code>史诗=<code>那年春天，全城学会了同一种沉默。<\/code><\/li><li><strong>翻车点<\/strong>：渲染惨状——统计腔比惨状冷十倍。<\/li><\/ul>\n<h3>C13 葬礼<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：告别与情感结算。<\/li><li><strong>开场三句<\/strong>——白描：<code>海葬没有墓碑，只有航向。舵偏三分，是他的老习惯，最后一次被执行。<\/code>｜腔调：<code>钟楼昨儿敲了九下——出海的人，敲九下不算吉利。<\/code><\/li><li><strong>节奏/曲线<\/strong>：3-4-6。<\/li><li><strong>挂点<\/strong>：①悼词（无骰，一人一句）。<\/li><li><strong>技巧件<\/strong>：R12 的对切法（授勋/行刑同框的告别版）。<\/li><li><strong>变调<\/strong>：恐怖=<code>来的宾客比认识他的多。<\/code>市井=<code>酒钱谁付，吵得像他还在。<\/code>史诗=<code>他的名字进了针路簿的页边。<\/code><\/li><li><strong>翻车点<\/strong>：GM 替玩家感动——留白，让桌上的沉默自己工作。<\/li><\/ul>\n<h3>C14 凯旋结算<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：账本的高光时刻——把结算变成颁奖礼。<\/li><li><strong>开场三句<\/strong>——白描：<code>三十担胡椒，八捆肉桂，一箱被雨吻过的姜黄。另有一箱账本——湿了，但看得清谁欠谁。<\/code>（R15）｜腔调：<code>分账分到三更，酒馆的酒卖空了两桶。<\/code><\/li><li><strong>节奏/曲线<\/strong>：6-5-7-9-4——清单旁白是峰。<\/li><li><strong>挂点<\/strong>：①分账检定（10.7 五档）。<\/li><li><strong>技巧件<\/strong>：R15、R20、R38、R40（报货/传奇变调/分赃口播/夜账拍）。<\/li><li><strong>变调<\/strong>：恐怖=<code>账本最后一页多了一笔谁都没认的支出。<\/code>市井=<code>分赃的顺序按嗓门排。<\/code>史诗=<code>这些数字，会被写进两家商行的家史。<\/code><\/li><li><strong>翻车点<\/strong>：只报总数——每一项都要有自己的声音。<\/li><\/ul>\n<h3>C15 溃逃与失败<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：耻感与抉择——失败也要有好戏。<\/li><li><strong>开场三句<\/strong>——白描：<code>海在下面等他。半空里他想起了母亲、船费、和那句没说完的'站稳'。水面合拢，像一句收回的话。<\/code>（R05）｜腔调：<code>他们的船是被人拖着回来的——帆布全成了布条。<\/code><\/li><li><strong>节奏/曲线<\/strong>：8-9-6-3——高开慢落。<\/li><li><strong>挂点<\/strong>：①哗变/溃逃检定（09 章）；②慢镜头条款（失败瞬间时间放慢）。<\/li><li><strong>技巧件<\/strong>：R05（时间膨胀）、R12（对切）。<\/li><li><strong>变调<\/strong>：恐怖=<code>没有人追——这比追更糟。<\/code>市井=<code>码头的闲话比伤好得慢。<\/code>史诗=<code>败军之名，他背了十一年。<\/code><\/li><li><strong>翻车点<\/strong>：惩罚玩家——失败给的是新剧情，不是体罚。<\/li><\/ul>\n<h3>C16 超自然遭遇<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：未知的恐惧——不解释是纪律不是偷懒。<\/li><li><strong>开场三句<\/strong>——白描：<code>有第二条船在跟着荡——这片锚地，只有我们抛了锚。<\/code>｜腔调：<code>雾里那盏灯，跟着我们走了一夜；我们的罗盘没敢跟它走。<\/code><\/li><li><strong>节奏/曲线<\/strong>：3-6-8-9——爬到峰即收，不落地。<\/li><li><strong>挂点<\/strong>：①定力对抗（11 章）。<\/li><li><strong>技巧件<\/strong>：R19（传奇变调压惊吓）、15 分册夜景六句式。<\/li><li><strong>变调<\/strong>：恐怖=<code>（默认档）<\/code>市井=<code>港口的版本总比海上的荒唐。<\/code>史诗=<code>老水手说，那是海在点名。<\/code><\/li><li><strong>翻车点<\/strong>：给出解释——11 章模糊档纪律：只写痕迹，不写本体。<\/li><\/ul>\n<h3>C17 回忆与闪回<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：补叙事、省航程——玩家主动买\"提前知道\"。<\/li><li><strong>开场三句<\/strong>——白描：<code>档案注：某船长的旧日志缺页两处，缺口整齐，非鼠咬。<\/code>｜腔调：<code>'你问我那天？那天我在你现在的位置站着。'<\/code><\/li><li><strong>节奏/曲线<\/strong>：2-5-7。<\/li><li><strong>挂点<\/strong>：①闪回检定（BitD 件：04 章变体包；成功=改一个前提，失败=加一个代价）。<\/li><li><strong>技巧件<\/strong>：R05（时间膨胀的倒放）。<\/li><li><strong>变调<\/strong>：恐怖=<code>回忆里的那扇门，现在也开着。<\/code>市井=<code>旧账翻出来，先闻到的还是酒味。<\/code>史诗=<code>史书写一行，他们活了一夜。<\/code><\/li><li><strong>翻车点<\/strong>：闪回替玩家做决定——闪回改的是处境，不是选择。<\/li><\/ul>\n<h3>C18 尾声<\/h3>\n<ul class='mdlist'><li><strong>功能<\/strong>：传承的引出位——账本朗读会。<\/li><li><strong>开场三句<\/strong>——白描：<code>结案卷宗留一页空白，注曰：'留给他自己写。'<\/code>｜腔调：<code>散场三问之后，老板娘留住了最后一只酒杯：'给还没回来的那只船。'<\/code><\/li><li><strong>节奏/曲线<\/strong>：4-3-2-6——末端给传承钩一个挑尾。<\/li><li><strong>挂点<\/strong>：①散场三问（13 章）；②传承开局引出（13 分册 §13.3.2c，若适用）。<\/li><li><strong>技巧件<\/strong>：R18 的绳子意象、15 分册清单美学。<\/li><li><strong>变调<\/strong>：恐怖=<code>那页空白，第二天被写满了一半。<\/code>市井=<code>账平了，人心不平。<\/code>史诗=<code>后来孩子们问起，他说：从一条船说起太长，从一个名字说起吧。<\/code><\/li><li><strong>翻车点<\/strong>：急着宣布下一季——让桌子先凉一拍再散。<\/li><\/ul>\n<h2>16.3 重点帷幕专项深化（四张）<\/h2>\n<h3>16.3.1 风暴卡深化（C04×07 章）<\/h3>\n<p>骰子归玩家（掌舵/操帆/危机三掷），旁白归五阶模板（15 分册 §15.3.1）；\"感官剥夺链\"逐轮执行：第 1 轮关视觉、第 3 轮关听觉、第 5 轮连罗盘也疯。<strong>风眼条款<\/strong>：进入风眼时只描写、不解释（<code>橙红色的光不是闪电的频率<\/code>）——恐怖变调的默认件，11 章模糊档的文本化。<\/p>\n<h3>16.3.2 市集议价卡深化（C08×09 分册）<\/h3>\n<p>与成交价总式对齐：议价三轮制（还价/验货/成交各给一次检定机会，交易/交涉可换序）；收尾必用\"清单旁白\"。<strong>对手戏模板——货主三态<\/strong>（GM 看一眼市况条选语气）：<strong>惜售<\/strong>（库存轨 ≤1：<code>这价嘛，你问错人了<\/code>）、<strong>急售<\/strong>（轨 ≥4：<code>三成定金，今天就装船<\/code>）、<strong>试探<\/strong>（轨 2–3：先请喝茶，价在第三巡才出现，R39）。<\/p>\n<h3>16.3.3 酒馆听闻卡深化（C09×10 章）<\/h3>\n<p>酒馆=任务板的人形版（14 分册四触点之\"港内场景\"）。<strong>三真一假<\/strong>传闻服务：三句真话里藏一句假话，假话带钩子（指向一个泛型任务）。喧闹层三句式：气味（油与酒与潮）/声音（骰子、争吵、走调的琴）/身份混坐（<code>渔民不与税吏同桌，但今天坐了<\/code>）。<\/p>\n<h3>16.3.4 尾声卡深化（C18×13 章）<\/h3>\n<p>尾声=账本朗读会：每人一句\"后来的事\"（BG3 尾声聚会式），GM 只补一句\"世界一瞥\"收尾。<strong>传承开局的引出位<\/strong>：老 PC 的\"后来的事\"若落在 13 分册 §13.3.2c 的传承条件上，本卡最后一句就是新 PC 的第一句。<\/p>\n<h2>16.4 三层节奏律（T6.3.1.a）<\/h2>\n<div class='tbl'><table><thead><tr><th>层<\/th><th>规则<\/th><th>口诀<\/th><\/tr><\/thead><tbody><tr><td><strong>幕内律<\/strong><\/td><td>一场景 ≤3 拍：进入 / 冲突 / 转口<\/td><td>\"三拍不写第四拍\"<\/td><\/tr><tr><td><strong>团内律<\/strong><\/td><td>3 小 : 2 中 : 1 大（四类轮换沿用 13 章）<\/td><td>\"五小戏换一场大戏\"<\/td><\/tr><tr><td><strong>战役律<\/strong><\/td><td>一季一钟摆：松（港内）—紧（航程）的呼吸，与宏轨季对齐<\/td><td>\"季风即节奏\"<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>节奏病处方<\/strong>：拖沓→剪一拍（三拍写成了四拍，砍中间）；高热→插市井拍（连打三场戏后强制一场 C08/C09）；断裂→用清单旁白缝（场景之间以一段报货/分账过桥，R15/R38）。<\/p>\n<h2>16.5 场景写作技法（T6.3.2）<\/h2>\n<p><strong>五感配比<\/strong>：视觉 50 / 听觉 25 / 嗅觉 15 / 触觉 10；<strong>海上场景嗅觉听觉对调<\/strong>（咸腥与索具声优先）；<strong>每幕首句强制非视觉开场<\/strong>（声音或气味——\"摄影机后置\"原则）。<\/p>\n<p><strong>信息节制三闸<\/strong>：<\/p>\n<div class='tbl'><table><thead><tr><th>闸<\/th><th>规则<\/th><th>正例<\/th><th>反例<\/th><\/tr><\/thead><tbody><tr><td><strong>不解释闸<\/strong><\/td><td>风眼/幽灵灯不解释<\/td><td><code>橙红色的光不是闪电的频率。<\/code><\/td><td><code>那其实是失控的磷火，原理是……<\/code><\/td><\/tr><tr><td><strong>延迟闸<\/strong><\/td><td>重要 NPC 三幕登场<\/td><td>传闻三版→牙腿→人（R08）<\/td><td>开场即交底：\"这是血鸦，海盗女王，她……\"<\/td><\/tr><tr><td><strong>残缺闸<\/strong><\/td><td>情报永远带毛边<\/td><td>地图缺一角、证词带口音（对接委托人误差机制 12 分册）<\/td><td>委托书像说明书一样完整<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>16.6 带团三技巧（T6.4.1，扩展不替代 13 章）<\/h2>\n<div class='tbl'><table><thead><tr><th>技巧<\/th><th>内容<\/th><th>与 13 章的关系<\/th><\/tr><\/thead><tbody><tr><td><strong>世界引擎的主持法<\/strong><\/td><td>季末结算不是记账是新闻播报（§16.7）<\/td><td>13 章议程制的季末延伸<\/td><\/tr><tr><td><strong>跨纪主持技巧<\/strong><\/td><td>纪推进仪式：①熄灯一句旧纪讣告→②念新纪扉页首段→③发新纪门控速查→④让每名 PC 说一句\"这十年我变了什么\"→⑤开新钟<\/td><td>13 章备课法的纪间版<\/td><\/tr><tr><td><strong>多人经济戏调度<\/strong><\/td><td>跑商七步卡上桌分工：<strong>谁管账<\/strong>（念数，R38）、<strong>谁砍价<\/strong>（出检定）、<strong>谁望风<\/strong>（打听/行情骰观察）——未分工者 GM 给\"甲板镜头\"（一段个人小戏）防挂机<\/td><td>13 章\"聚光灯轮转\"在跑商场景的特化<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'><strong>13 章对照引用表<\/strong>：五原则（照念）、议程制（照用）、备课法（30 分钟标准不变）、散场三问（并入 C18）——全部<strong>引用不改写<\/strong>；本册三技巧只是第 4–6 件工具。<\/blockquote>\n<h2>16.7 季末新闻播报术（T6.4.2.a）<\/h2>\n<p>季末八步的<strong>表演化<\/strong>：结算数字在幕后，台前只念\"世界一瞥\"三行——<strong>每行一个钩子，玩家自己决定追问哪条<\/strong>：<\/p>\n<blockquote class='quote'>模板：<code>涨价的是胡椒（果阿库存轨−2）。死了的是老舵手（年轮死亡表）。没回来的是'圣卡塔琳娜号'（幽灵航程注销）。<\/code><\/blockquote>\n<ul class='mdlist'><li><strong>沙漏纪律<\/strong>：季末 ≤10 分钟（14 分册预算表）；<strong>追问预算<\/strong>：每季玩家集体可深挖 1 条，其余转下季存留池（10 分册 §10.5）。<\/li><li>句库 72 条，按帷幕腔调分三套——编年史腔（冷）/酒馆腔（热）/密报腔（寒）：<\/li><\/ul>\n<p><strong>编年史腔<\/strong>（24 条）<\/p>\n<div class='tbl'><table><thead><tr><th>索引<\/th><th>句<\/th><\/tr><\/thead><tbody><tr><td>C01 开局定场<\/td><td>新的一季从一本翻开的账开始：三笔旧债，一条新桅。<\/td><\/tr><tr><td>C01 开局定场<\/td><td>史官落笔：本季无大事——然后补了一句'除海上的以外'。<\/td><\/tr><tr><td>C02 出航<\/td><td>港籍册添一行：某船出港，顺风，货单未详。<\/td><\/tr><tr><td>C02 出航<\/td><td>灯塔记事：某船离港第三日，灯塔油费照常。<\/td><\/tr><tr><td>C03 平静航段<\/td><td>本季航路太平，商船按期，史书无话可说。<\/td><\/tr><tr><td>C03 平静航段<\/td><td>季风如约而至，航期表一字未改。<\/td><\/tr><tr><td>C04 风暴<\/td><td>风暴过境，损失以艘计、以人计，记两栏。<\/td><\/tr><tr><td>C04 风暴<\/td><td>港务公告：外海失事二船，附件一份名单。<\/td><\/tr><tr><td>C05 海战开火<\/td><td>海战一笔：两船相遇，一船回来。<\/td><\/tr><tr><td>C05 海战开火<\/td><td>战报十二字：遇敌，接战，俘二，损一，归港。<\/td><\/tr><tr><td>C06 接舷肉搏<\/td><td>接舷战记入册：跳帮三次，夺船一艘，伤者按名。<\/td><\/tr><tr><td>C06 接舷肉搏<\/td><td>海牙的律师们新添一个案例：白刃上的产权转移。<\/td><\/tr><tr><td>C07 港口入城<\/td><td>某船入港，报关三日，市面如常。<\/td><\/tr><tr><td>C07 港口入城<\/td><td>城门志：异乡船员若干人上岸，去向未录。<\/td><\/tr><tr><td>C08 市集议价<\/td><td>市价牌更新：胡椒上浮，呢绒持平，人心待考。<\/td><\/tr><tr><td>C08 市集议价<\/td><td>行会月报：本月成交若干，争议一桩，调解中。<\/td><\/tr><tr><td>G01 护航<\/td><td>护航合约照常签发，海图上多了一条巡线。<\/td><\/tr><tr><td>G01 护航<\/td><td>护航队账面盈余，本季无人申请动用保金。<\/td><\/tr><tr><td>G02 缉私查禁<\/td><td>缉私公告：本季查获若干，名单存档。<\/td><\/tr><tr><td>G02 缉私查禁<\/td><td>海关册上多一页焚毁记录——理由栏空白。<\/td><\/tr><tr><td>G03 走私<\/td><td>盐价涨了两成，走私的利润表跟着改了一版。<\/td><\/tr><tr><td>G03 走私<\/td><td>某条老航线上，货开始绕路走了。<\/td><\/tr><tr><td>G04 寻宝<\/td><td>传闻有人出海寻宝，官府按'航海'记录，不按'寻'。<\/td><\/tr><tr><td>G04 寻宝<\/td><td>一张旧图的持有人换了，图上的墨迹没换。<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>酒馆腔<\/strong>（24 条）<\/p>\n<div class='tbl'><table><thead><tr><th>索引<\/th><th>句<\/th><\/tr><\/thead><tbody><tr><td>C09 酒馆听闻<\/td><td>'那姑娘昨儿也在这儿打听船期——打听的不是船，是谁掌舵。'<\/td><\/tr><tr><td>C09 酒馆听闻<\/td><td>老板娘擦着杯子说：'这条街上的消息，比货先上船。'<\/td><\/tr><tr><td>C10 官厅谒见<\/td><td>'总督府昨夜灯亮到三更——账房的人进了后门。'<\/td><\/tr><tr><td>C10 官厅谒见<\/td><td>'听说宫里要册封个新港督，人选有三个，酒钱付了三份。'<\/td><\/tr><tr><td>C11 审讯与谈判<\/td><td>'老文书说，那纸契约的骑缝章少半枚——少的那半，能杀人。'<\/td><\/tr><tr><td>C11 审讯与谈判<\/td><td>'他们谈到半夜，出来时一人笑着，一人没笑。'<\/td><\/tr><tr><td>C12 疫病与死亡<\/td><td>'南城又封了两条街，面包铺排队排到了码头。'<\/td><\/tr><tr><td>C12 疫病与死亡<\/td><td>'医生说不是热病，是船带来的——这话他只说了半句。'<\/td><\/tr><tr><td>C13 葬礼<\/td><td>'钟楼昨儿敲了九下——出海的人，敲九下不算吉利。'<\/td><\/tr><tr><td>C13 葬礼<\/td><td>'葬礼上来了条大汉，哭完就走，帽檐压得极低。'<\/td><\/tr><tr><td>C14 凯旋结算<\/td><td>'那船回来啦！桅杆上挂的金链子晃得人眼晕。'<\/td><\/tr><tr><td>C14 凯旋结算<\/td><td>'分账分到三更，酒馆的酒卖空了两桶。'<\/td><\/tr><tr><td>C15 溃逃与失败<\/td><td>'他们的船是被人拖着回来的——帆布全成了布条。'<\/td><\/tr><tr><td>C15 溃逃与失败<\/td><td>'别提那趟活儿，提了要赔酒钱的。'<\/td><\/tr><tr><td>C16 超自然遭遇<\/td><td>'雾里那盏灯，跟着我们走了一夜，我们的罗盘没敢跟它走。'<\/td><\/tr><tr><td>C16 超自然遭遇<\/td><td>'老帕尔米贾诺又讲那个版本了——这次沉的是条绿船。'<\/td><\/tr><tr><td>G05 海难打捞<\/td><td>'打捞队回来了，捞上来的东西比货单多一样。'<\/td><\/tr><tr><td>G05 海难打捞<\/td><td>'沉船那片水，这季给钱了也少有人去——水鬼换班了。'<\/td><\/tr><tr><td>G06 救难<\/td><td>'北边发求救浮标，回来的只有船板。'<\/td><\/tr><tr><td>G06 救难<\/td><td>'救回来的大副在酒馆躺着，醒来第一句是问锚。'<\/td><\/tr><tr><td>G07 讨债勒索<\/td><td>'码头债的利息又改了——改得比潮水还准。'<\/td><\/tr><tr><td>G07 讨债勒索<\/td><td>'讨债的换了身新衣裳，话还是那三句。'<\/td><\/tr><tr><td>G08 复仇<\/td><td>'她把那人的名字写在桅杆上了，说风干之前不撤。'<\/td><\/tr><tr><td>G08 复仇<\/td><td>'报仇的人不喝酒——他在等人喝醉。'<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>密报腔<\/strong>（24 条）<\/p>\n<div class='tbl'><table><thead><tr><th>索引<\/th><th>句<\/th><\/tr><\/thead><tbody><tr><td>C17 回忆与闪回<\/td><td>档案注：某船长的旧日志缺页两处，缺口整齐，非鼠咬。<\/td><\/tr><tr><td>C17 回忆与闪回<\/td><td>他在第若干页夹了一张十年前的港图，比例不对。<\/td><\/tr><tr><td>C18 尾声<\/td><td>结案卷宗留一页空白，注曰：'留给他自己写。'<\/td><\/tr><tr><td>C18 尾声<\/td><td>本季档案合卷，唯一一条批注：'账平，人心不平。'<\/td><\/tr><tr><td>C05 海战开火<\/td><td>战利品登记与损失清册同日呈报，数字对得上，人对不上。<\/td><\/tr><tr><td>C05 海战开火<\/td><td>密档：那炮的口径不属于本海区任何一国。<\/td><\/tr><tr><td>C12 疫病与死亡<\/td><td>医官密报：本周棺木采购量，三倍于死亡登记数。<\/td><\/tr><tr><td>C12 疫病与死亡<\/td><td>检疫线的名字换了，名单没换。<\/td><\/tr><tr><td>G09 护送要人<\/td><td>要人的行程泄露三处：码头、钟楼、和一支不该出现的桨。<\/td><\/tr><tr><td>G09 护送要人<\/td><td>护送计划外多订了一间房，谁住，名单上没有。<\/td><\/tr><tr><td>G10 信物运送<\/td><td>信物在途中开过封——火漆是原厂，手劲不是。<\/td><\/tr><tr><td>G10 信物运送<\/td><td>三条船载同一样货、走同一条线，只有一条的货单是真的。<\/td><\/tr><tr><td>G11 瘟疫船与检疫<\/td><td>疫船名单外，还有一条船靠了岸——港务官的名字压着。<\/td><\/tr><tr><td>G11 瘟疫船与检疫<\/td><td>检疫官的私账里，出现了一笔'香火钱'。<\/td><\/tr><tr><td>G12 追捕<\/td><td>通缉画影图形改了第三版：越画越不像，赏格越挂越高。<\/td><\/tr><tr><td>G12 追捕<\/td><td>被追的人给追的人捎了句话：'换双靴子再来。'<\/td><\/tr><tr><td>G13 侦察<\/td><td>某海区最近测得的水深，比海图浅了一码——测的人没多想，画的图先响了。<\/td><\/tr><tr><td>G13 侦察<\/td><td>测绘船回来，图纸少了一角——裁痕很新。<\/td><\/tr><tr><td>G14 商战<\/td><td>两家老号的报价单，同一个笔误。<\/td><\/tr><tr><td>G14 商战<\/td><td>商会投票前夜，三张改变票数的货契同时到期。<\/td><\/tr><tr><td>G15 勘察测绘<\/td><td>勘察队带出去的罗盘，回来时指北针松了半格。<\/td><\/tr><tr><td>G15 勘察测绘<\/td><td>新海图上多了一座没人报过的岛，墨迹比邻字新。<\/td><\/tr><tr><td>G16 捕鲸猎鲨<\/td><td>鲸群改了洄游线——老猎手说，海底下有什么东西在搬家。<\/td><\/tr><tr><td>G16 捕鲸猎鲨<\/td><td>猎鲨队交上来的鳍里，混着一枚带字的骨牌。<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote class='quote'>索引=C01–C18 帷幕／G01–G16 泛型；季末念三行，每行一个钩子。<\/blockquote>\n<h2>16.8 安全与红线主持术（T6.4.2.b）<\/h2>\n<p><strong>\"跳过不减益\"条款（写死）<\/strong>：玩家跳过任何不适内容，任务报酬与进度<strong>分毫不损<\/strong>——跳过不减益，永远。<\/p>\n<p>三份 Session 0 声明脚本（可直接念）：<\/p>\n<ol class='mdlist'><li><strong>疫病帷幕<\/strong>（C12/P01）：\"本战役会出现瘟疫与大规模死亡，用统计与日常呈现，不做酷刑奇观。若有亲友经历相关的创伤，随时用跳过卡，剧情自动绕行。\"<\/li><li><strong>奴隶制进程卡<\/strong>（P06/S2）：\"奴隶贸易作为史实制度出现：我们呈现其制度与后果的残酷，绝不扮演、娱乐化或从中取乐。相关情节可整体跳过，报酬不减。\"<\/li><li><strong>复仇任务<\/strong>（C11/C15）：\"本季可能出现复仇线与处决情节。酷刑与虐杀不做舞台呈现，只给结果。血债账目照记，画面按你们的红线裁剪。\"<\/li><\/ol>\n<h2>16.9 本册验收清单<\/h2>\n<ul class='mdlist'><li><label class='task'><input type='checkbox' disabled checked> 18 帷幕卡（开场三句两版零修改可用／节奏图＋张力曲线／挂点 ≤3／变调／翻车点）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 四张深化卡（风暴/市集/酒馆/尾声）与 07 章、09 分册、10 章、13 章严格对齐。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 三层节奏律＋处方表＋18 条张力曲线（并入各卡）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 五感配比＋信息三闸（正反例各一）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 带团三技巧＋13 章逐条引用表（只引不改）。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 世界一瞥句库 72 条（ENGINE 注入，三腔）＋播报模板＋追问预算。<\/label><\/li><li><label class='task'><input type='checkbox' disabled checked> 安全三脚本＋\"跳过不减益\"条款。<\/label><\/li><\/ul>","text":"v1 世界引擎 P7 交付（计划06部 §6.2–6.4）。 定位声明：扩展不替代 ——13 章《游戏主持指南》仍是第一优先级，本册只增三样：世界引擎的主持法、跨纪主持技巧、多人经济戏调度（§16.6）。帷幕=重复出现的场景类型（固定功能＋固定节奏风险＋固定骰子挂点）；每卡开场三句可直接上桌，骰子挂点 ≤3 处。 16.1 帷幕总表（18 类，五列速查） # 帷幕 功能（卖什么体验） 典型时长 节奏风险 骰子挂点 C01 开局定场 定调、立世界 15 分钟 平 0–1 C02 出航 仪式感、立日程 10 分钟 低 1 C03 平静航段 蒙太奇、成长与停滞 15 分钟 拖 1–2 C04 风暴 失控感 20 分钟 高 2–3 C05 海战开火 火力与秩序 20 分钟 高 2–3 C06 接舷肉搏 贴身暴力 20 分钟 高 2–3 C07 港口入城 异域感、准入 10 分钟 低 1 C08 市集议价 经济博弈的肉身化 15 分钟 中 2 C09 酒馆听闻 信息市场、人物登场 15 分钟 中 1 C10 官厅谒见 权力的重量 15 分钟 中 1–2 C11 审讯与谈判 语言即刀 20 分钟 中 2 C12 疫病与死亡 脆弱、无常 15 分钟 压抑 1–2 C13 葬礼 告别、结算情感 10 分钟 低 0–1 C14 凯旋结算 账本的高光时刻 15 分钟 平→高 1 C15 溃逃与失败 耻感、抉择 15 分钟 高 1–2 C16 超自然遭遇 未知的恐惧 15 分钟 高 1 C17 回忆与闪回 补叙事、省航程 10 分钟 乱 1 C18 尾声 传承的引出位 15 分钟 散 0–1 13 章航段脚本六段与 14 章模组全部场景可归类入此 18 类（回归映射通过）；18 类互斥不重叠。 16.2 十八张帷幕卡 统一格式 ：功能／开场三句（白描版｜腔调版）／节奏与张力曲线（0–10；钉子=挂点）／骰子挂点／技巧件（15 分册 R 卡）／变调（恐怖调·市井调·史诗调）／翻车点。 C01 开局定场 功能 ：用三分钟让桌上有\"世界\"，不只是\"任务\"。 开场三句 ——白描： 退潮后，沙滩上留着船的龙骨。他点了点：狗一只，火药两桶，同伴没有。他开始走，按清单的顺序。 （R16）｜腔调： 新的一季从一本翻开的账开始：三笔旧债，一条新桅。 节奏/曲线 ：2-4-6-5——定调爬坡，落点留钩。 挂点 ：①身份与天赋确认（照 04 章，不另掷）。 技巧件 ：R07、R16（三词开场/点数式白描）。 变调 ：恐怖= 没有任何一艘船的残骸属于这片海。 市井= 开场的第一个声音是讨价还价。 史诗= 史官落笔：本季无大事——除海上的以外。 翻车点 ：念完世界观设定——玩家要的不是听书，是上船。 C02 出航 功能 ：把日程表变成仪式，把规则提示藏进号令。 开场三句 ——白描： 命令只有三条：帽檐压低、缆绳摸一遍、夜里别唱挽歌。 （R36）｜腔调： 出港用巽针，三更防浅——针簿在老舵手手里，他今晚只说了前一半。 （R31） 节奏/曲线 ：3-5-7-4——小高潮在\"解缆\"。 挂点 ：①航前检定（07 章备航，一项）。 技巧件 ：R14、R24、R31、R36（琐事压阵/异域船感/导航旁白/军令拍）。 变调 ：恐怖= 名单上多了一行没人认领的名字。 市井= 出港的祝词是牙人教的，为了下一单生意。 史诗= 全港的钟为一条船响。 翻车点 ：把备航清单逐项问完——三项足矣，其余默认完成。 C03 平静航段 功能 ：蒙太奇——用时间换成长、换关系、换暗流。 开场三句 ——白描： 第三天没有风。第四天，水手们开始看别人的脸。 （R03）｜腔调： 满剌加多雨，古里多商，忽鲁谟斯多风——水手们把这句编成了号子。 （R27） 节奏/曲线 ：4-3-5-3——低而稳，末梢微挑。 挂点 ：①停滞三戏各推一格（士气/库存）；② fatigue/坏血病检定（07 章，每航段一次）。 技巧件 ：R03、R27、R32、R37（停滞三戏/诗注蒙太奇/认路拍/成长蒙太奇）。 变调 ：恐怖= 数到第七次梆子——应该是六次。 市井= 船上学会的第一句行话，是骂人的那句。 史诗= 他们数着更次，把一段海走成了传说。 翻车点 ：真的一天天过日子——蒙太奇要\"剪\"，每拍只给一句。 C04 风暴 功能 ：失控感——规则保证危险，文本负责敬畏。 开场三句 ——白描： 西边的云压得太低，低得像另一片海。涌先到了——船开始用另一种方式摇头。 ｜腔调： 罗盘先疯了——针在三枚刻度间打架。 （R01） 节奏/曲线 ：5-6-8-10-9-6——五阶爬升，风眼回落。 挂点 ：①掌舵；②操帆；③危机掷（07 章风暴三掷制，严格对齐）。 技巧件 ：R01、R02、R10（感官剥夺链/锅炉房拍/史诗调工程任务）。 变调 ：恐怖= 灯从灯芯里被风抽走了，黑暗先于浪到达。 市井= 厨子还在数还有几个能用的蛋。 史诗= 风要这台机器，他要。 翻车点 ：一开场写满五阶——每过一阶才升一档，别预支敬畏。 C05 海战开火 功能 ：火力与秩序——舰炮是数学，甲板是纪律。 开场三句 ——白描： 炮脱了索。它先撞碎了左舷的灯塔柜，又碾过三张吊床。全船安静下来，听它掉头。 （R11）｜腔调： 战报十二字：遇敌，接战，俘二，损一，归港。 节奏/曲线 ：6-7-9-10-7——挂点即峰。 挂点 ：①先攻（09 章）；②齐射（DV14）；③战位动员（接舷前置）。 技巧件 ：R08、R11、R35（狂信节拍/事故拍/战前动员）。 变调 ：恐怖= 那炮的口径，不属于本海区任何一国。 市井= 炮声里还有人惦记着舱底的酒。 史诗= 船上三十一人，他一个个叫了名字。 （R35） 翻车点 ：炮击来回空转——三轮内必须发生\"改变局面的事件\"（断桅/起火/接舷）。 C06 接舷肉搏 功能 ：贴身暴力——把 HP 翻译成呼吸。 开场三句 ——白描： 章鱼比洞口还宽。他吸了半口气，把自己交给出手的姿势。 （R09）｜腔调： 跳帮三次，夺船一艘——伤者按名。 节奏/曲线 ：7-9-10-8。 挂点 ：①接舷动员（+2，09 章）；②战位动作；③单挑拍（可选）。 技巧件 ：R09（孤胆算术：一口气=资源条）。 变调 ：恐怖= 对方的水手没有一个出声。 市井= 打完先抢厨房——规矩。 史诗= 两船相撞的那一下，是这场战争的标点。 翻车点 ：回合制念完十二轮——肉搏按\"波\"结算，每波一句画面。 C07 港口入城 功能 ：异域感与准入——三句定一城。 开场三句 ——白描： 港无石城，竹栅为界。男子束发，女子短裙。市上椒山堆积——番银不通行，只认布。 （R25）｜腔调： 城门志：异乡船员若干人上岸，去向未录。 节奏/曲线 ：3-5-6。 挂点 ：①检疫/海关检定（09 分册）。 技巧件 ：R23、R25、R29（异域白描/清单式惊奇/电报体）。 变调 ：恐怖= 这港没有海关——只有邻居。 市井= 入城的第一个问题是：税，还是礼？ 史诗= 城门口的石柱上，刻着上一个不肯纳税的船名。 翻车点 ：把城市设定倒出来——玩家只关心\"能干什么、要付出什么\"。 C08 市集议价 功能 ：经济系统的肉身化——让价格长出脸。 开场三句 ——白描： 码头上，牙人报数：胡椒三百包，苏木一百二十担。 （R23）｜腔调： '这价嘛——先吃盏茶。'茶过三巡，价落了两个来回。 （R39） 节奏/曲线 ：4-6-8-6——三轮议价，中段最热。 挂点 ：①议价检定（交易/交涉可换序，09 分册三轮制）；②行情骰（GM 密掷）。 技巧件 ：R23、R29、R39（清单收尾/S1 电报体/中文腔）。 变调 ：恐怖= 市场上什么都有——除了昨天还有的那样东西。 市井= 价是谈出来的，脸是留着的。 史诗= 这一价，定的是下一年这条航路的命。 翻车点 ：真把算式念出来——算式在幕后，台前只给对手戏与清单。 C09 酒馆听闻 功能 ：信息市场——酒馆是任务板的人形版。 开场三句 ——白描： '他死在孟买了。''他上个月还在亚丁。''他的酒钱还挂着呢。' （R06）｜腔调： 老板娘擦着杯子说：'这条街上的消息，比货先上船。' 节奏/曲线 ：3-5-7-4。 挂点 ：①传闻检定（10.8，三真一假服务）。 技巧件 ：R06、R08、R13（传闻打架/三幕登场法/群像座次）。 变调 ：恐怖= 角落里那桌，从头到尾没点酒。 市井= 消息的汇率：一杯啤酒换一条真的，两杯换一条假的。 史诗= 多年以后，有人会说命运是在这张桌上转向的。 翻车点 ：GM 把真话和假话的语气做成一样的——假的要更好听。 C10 官厅谒见 功能 ：权力的重量——仪式即语言。 开场三句 ——白描： 诏书读一句，通事译一句，酋长俯首一次。丝绸抬上来，胡椒抬下去。 （R26）｜腔调： '总督府昨夜灯亮到三更——账房的人进了后门。' 节奏/曲线 ：4-6-8。 挂点 ：①礼仪检定（律法/交涉）；②陈情（一场话改变一个数字）。 技巧件 ：R22、R26、R30（体面下的刀/朝贡对账/礼单即价格表）。 变调 ：恐怖= 大殿很安静——安静得听得见算盘。 市井= 官老爷先问的居然是行情。 史诗= 这一跪，两个海认了同一个主。 翻车点 ：让 NPC 一次把底牌说完——权力喜欢分三次说。 C11 审讯与谈判 功能 ：语言即刀——每句话吃一子。 开场三句 ——白描： '你想问什么？'对方问了三个问题。'很好，这三个答案，我各收一样东西。' （R21）｜腔调： 字据上写'一磅肉'，没写'连同血'。 （R34） 节奏/曲线 ：5-7-9-8。 挂点 ：①交涉/洞悉对抗；②底线检定（失败让步一档）。 技巧件 ：R21、R33、R34（复仇模板/慈悲称重/字面主义）。 变调 ：恐怖= 审讯没有问题——只有沉默和记录。 市井= 谈判桌上先上酒，后上账。 史诗= 他替全船的人签了那个字。 翻车点 ：GM 替 NPC 说服玩家——NPC 出价，玩家选。 C12 疫病与死亡 功能 ：脆弱与无常——数字越平静越可怕。 开场三句 ——白描： 本周，圣玛丽堂区：四十一人。上周：九人。公告栏前没人说话。 （R17）｜腔调： 药箱打开，只有一封信。 （R04） 节奏/曲线 ：4-5-6-7——缓坡压抑，不设峰。 挂点 ：①医疗/检疫检定；②死亡表（13 分册疫年 +3）。 技巧件 ：R04、R17、R18（物件塌方/统计腔/封锁市井调）。 变调 ：恐怖= 医生的名字也上了本周的表。 市井= 面包铺的队排到了码头。 史诗= 那年春天，全城学会了同一种沉默。 翻车点 ：渲染惨状——统计腔比惨状冷十倍。 C13 葬礼 功能 ：告别与情感结算。 开场三句 ——白描： 海葬没有墓碑，只有航向。舵偏三分，是他的老习惯，最后一次被执行。 ｜腔调： 钟楼昨儿敲了九下——出海的人，敲九下不算吉利。 节奏/曲线 ：3-4-6。 挂点 ：①悼词（无骰，一人一句）。 技巧件 ：R12 的对切法（授勋/行刑同框的告别版）。 变调 ：恐怖= 来的宾客比认识他的多。 市井= 酒钱谁付，吵得像他还在。 史诗= 他的名字进了针路簿的页边。 翻车点 ：GM 替玩家感动——留白，让桌上的沉默自己工作。 C14 凯旋结算 功能 ：账本的高光时刻——把结算变成颁奖礼。 开场三句 ——白描： 三十担胡椒，八捆肉桂，一箱被雨吻过的姜黄。另有一箱账本——湿了，但看得清谁欠谁。 （R15）｜腔调： 分账分到三更，酒馆的酒卖空了两桶。 节奏/曲线 ：6-5-7-9-4——清单旁白是峰。 挂点 ：①分账检定（10.7 五档）。 技巧件 ：R15、R20、R38、R40（报货/传奇变调/分赃口播/夜账拍）。 变调 ：恐怖= 账本最后一页多了一笔谁都没认的支出。 市井= 分赃的顺序按嗓门排。 史诗= 这些数字，会被写进两家商行的家史。 翻车点 ：只报总数——每一项都要有自己的声音。 C15 溃逃与失败 功能 ：耻感与抉择——失败也要有好戏。 开场三句 ——白描： 海在下面等他。半空里他想起了母亲、船费、和那句没说完的'站稳'。水面合拢，像一句收回的话。 （R05）｜腔调： 他们的船是被人拖着回来的——帆布全成了布条。 节奏/曲线 ：8-9-6-3——高开慢落。 挂点 ：①哗变/溃逃检定（09 章）；②慢镜头条款（失败瞬间时间放慢）。 技巧件 ：R05（时间膨胀）、R12（对切）。 变调 ：恐怖= 没有人追——这比追更糟。 市井= 码头的闲话比伤好得慢。 史诗= 败军之名，他背了十一年。 翻车点 ：惩罚玩家——失败给的是新剧情，不是体罚。 C16 超自然遭遇 功 <script id="gloss-data" type="application/json">{"潮汐点":"<p>玩家的命运资源，每人3点（天赋\"幸运之星\"上限4）。花1点可：重掷自己的任意骰、在结果公布后+5、把一次失败改写为\"成功但引入新麻烦\"、或将致命伤害减半／从濒死回到1 HP。回港休整恢复全部，海上长休恢复1点。详见第3章。<\/p>","DV":"<p>难度等级（Difficulty Value）——检定成功所需的目标值。标准阶梯：简单10／普通13／困难16／极难19／传奇22。详见第3章。<\/p>","检定":"<p>行动成败存疑且后果重要时，掷 <strong>1d20＋相关属性＋相关技能<\/strong>，≥ DV 即成功。失败必须改变局面：代价、复杂化或信息，三选一。详见第3章。<\/p>","优势":"<p>场景条件对行动有利时掷2个d20取高。多个优势不叠加；一优一劣相互抵消。反之即\"劣势\"。详见第3章。<\/p>","劣势":"<p>场景条件对行动不利时掷2个d20取低。多个劣势不叠加；一优一劣相互抵消。详见第3章。<\/p>","对抗检定":"<p>双方各掷 d20＋属性＋技能，高者胜，平局对防守方有利。用于潜行对侦察、欺骗对洞察、追逃对追捕。详见第3章。<\/p>","团队检定":"<p>全员各掷同一检定，<strong>过半成功则全队成功<\/strong>。用于划桨接力、全船抢修、丛林行军等集体行动。详见第3章。<\/p>","成功等级":"<p>检定超出DV的程度决定质量：卓越（＋10）／良好（＋5）／成功／失败／惨败（－5）。等级越高额外获益越多，惨败额外受损。详见第3章。<\/p>","筋骨":"<p>五属性之一，管辖力量、耐力与健壮：攀索、撞门、扛伤、划桨、憋气。HP由此派生。详见第3章。<\/p>","机敏":"<p>五属性之一，管辖灵巧、速度与手稳：操帆、攀爬、瞄准、开锁、躲闪；战斗先攻也看它。详见第3章。<\/p>","学识":"<p>五属性之一，管辖智力、记忆与推理：导航、炮术计算、识图、医术、语言学。详见第3章。<\/p>","胆魄":"<p>五属性之一，管辖意志、勇气与冷静：抵抗恐惧、忍受痛苦、坚持掌舵。超自然档下的恐惧检定也看它。详见第3章。<\/p>","人望":"<p>五属性之一，管辖魅力、威仪与共情：领导、交涉、欺骗、表演、招募。详见第3章。<\/p>","HP":"<p>生命值 ＝ <strong>6 ＋ 筋骨×2<\/strong>。归零不是死亡，而是倒地濒死。详见第3章。<\/p>","濒死":"<p>HP归零后的状态。每轮掷死亡骰（d20≥10算稳定），累计3次失败死亡、3次成功稳固；急救（医术 DV13）可代为掷骰。详见第3章。<\/p>","死亡骰":"<p>濒死时每轮掷的d20：≥10稳定，&lt;10记1次失败，自然1记2次。3次失败即死亡。详见第3章。<\/p>","伤疤":"<p>大伤复原后GM可要求记录的永久小代价（如\"左耳失聪\"）。是故事资产而非数值惩罚堆叠。详见第3章。<\/p>","战斗轮":"<p>个人战斗的时间单位，约6秒。每轮1个动作＋自由移动，先攻按机敏检定排序。详见第9章。<\/p>","海战轮":"<p>舰船战斗的时间单位，约1分钟。每轮每名PC占一个战位；炮组装填需2轮。详见第9章。<\/p>","航段":"<p>航行时间单位：4小时，一昼夜6段。航行、守夜、船上活动都按段结算；值勤超过4段进入疲劳。详见第7章。<\/p>","船体值":"<p>船只的结构完整度（Hull）。归零＝失控或沉没危机——从这一刻起，死的不是船，是人。详见第7章。<\/p>","齐射":"<p>舰炮集体射击：d20＋炮术 对 DV14，命中造成3d6船体伤害；每2轮可射击一次（装填）。详见第9章。<\/p>","接舷":"<p>用钩索把敌船钩连过来打甲板战：接舷检定 vs 14，成功后双方转入个人战斗规则。详见第9章。<\/p>","跳帮":"<p>接舷后由跳帮队冲上敌舰甲板的作战行动；留守队看家，防止对方反跳。详见第9章。<\/p>","战位":"<p>海战中PC各自占据的岗位：<strong>掌舵／帆组／炮组／瞭望／跳帮／船医<\/strong>（另有杂务位）。每席每轮限选白名单中一项动作。详见第9.4节。<\/p>","船员士气":"<p>全船水手的整体士气值（0–20）。口粮、伤亡、拖欠、胜利都会影响它；降到5以下，每个航段都可能掷出哗变。详见第7章。<\/p>","哗变":"<p>士气崩盘后水手抗命或夺船的风险检定。冷酷船长的个人威慑＋3——但威慑不是人心。详见第7章。<\/p>","坏血病":"<p>长期吃不上新鲜果蔬的航行病，按累积骰触发；医术与柠檬（或酸菜）可防可治。详见第7章。<\/p>","疲劳":"<p>值勤过度或连续熬夜的状态，1–3级：1级＝所有检定劣势，3级强制昏睡。详见第7章。<\/p>","声望":"<p>角色在各势力中的名声数值（0–100）：无名／熟人／可信／名人／传奇。决定军港准入与待遇。与恶名分开记。详见第10章。<\/p>","恶名":"<p>与声望<strong>分开记<\/strong>的第二条轨。劫掠升恶名不一定降声望——取决于对谁。恶名买的是\"便宜又勇敢的人\"，代价是\"体面的人不来\"。详见第10.8节。<\/p>","私掠许可证":"<p>国家颁发的合法劫掠执照。持证期间在颁发国港口不因掠夺增加恶名；打错对象，执照立刻变成绞索。详见第10章。<\/p>","船份":"<p>产权以1/16为最小单位持有（史实常为64份）。战役第一幕\"拿到船\"的真正目标是<strong>一份产权<\/strong>，不是一条船。详见第10.6节。<\/p>","里程碑":"<p>本书的成长制（XP）：按故事而非击杀计分——参与保底1XP，达成目标、卓越扮演、画出新海图各+1。升1级需3XP（9级后4XP）。详见第3章。<\/p>","出身":"<p>角色从哪里来：给＋1属性、2项受训技能、1门语言、出身装备与出身特性。详见第4章。<\/p>","原型":"<p>你在船上领哪份工钱：船长／领航员／炮长／船医／剑客／火枪手／商人／学者／掠私者／怪力水手，各给本职技能与职业特性。详见第4章。<\/p>","天赋":"<p>不可被剥夺的身份性能力，如老海狼、海图记忆、幸运之星、冷酷船长。创建时选1项。详见第4章。<\/p>","海图揭示":"<p>未探索海域在战役地图上被逐步绘制进<strong>玩家的海图<\/strong>的过程。海图是道具，不是UI——它会被洇湿、烧掉、卖掉。详见第8章。<\/p>","海燕号":"<p>快速开始里的单桅快船：船体14、4门4磅炮、11名船员；特性\"浅水之子\"——礁区与河口的航行检定劣势移除。详见第2章。<\/p>","红隼号":"<p>风暴海域最凶的猎私船：双桅、吃水浅、6门炮。旗语只有一句话——停船受检，否则击沉。详见第2章。<\/p>","迷航":"<p>连续两个航段导航失败后的状态：每段继续偏航、遭遇骰+4，直到下一次导航成功（DV-2）。迷航者遇到的总是更多。详见第7章。<\/p>","抢风航法":"<p>逆风时的\"之\"字走位：航程减半、每段掌舵检定、连续3段疲劳+1。卡拉维尔帆船的看家本领。详见第7章。<\/p>","进水":"<p>水线被击穿后的状态：每段船体-1，需每点派1人抽水，木工DV14止漏。进水不是血条，是倒计时。详见第7章。<\/p>","沉没规程":"<p>船体归零后的十段倒计时：抢救（团队木工DV16，成功船体回到1）或弃船（小艇只装得下三分之一编制）。详见第7章。<\/p>","关键线索永不投骰":"<p>P0原则第一条：<strong>如果一条线索是剧情的唯一通路，它就不需要检定。<\/strong> 检定决定你能额外知道多少，不决定你有没有资格知道。详见第5.0节。<\/p>","Let it Ride":"<p>同一件事、同一个目标、同一段航程内<strong>只掷一次<\/strong>。想重掷须改变条件、付出代价、或接受降档加风险。详见第5.0节。<\/p>","受训线":"<p>每项技能第一行写明的\"必须受训才能做的专业动作\"。未受训可做基础动作，但不能指挥齐射、不能测天定位、不能做手术。详见第5章。<\/p>","专长分支":"<p>技能达到4级后可选的成长件，效果<strong>只有两种<\/strong>：特定情境+2，或移除一种既定劣势。不做新动作、不改骰法、不加伤害骰。详见第5.1节。<\/p>","交易":"<p>社交域技能，本作定稿时补入（3.5预览表曾漏列，但出身、原型、招募与第十章全在用它）。谈价、看货、期约、大宗折价。详见第5.4节。<\/p>","命中五档":"<p>战斗中的结果分级：<strong>险失／失手／命中／精准／重击<\/strong>，按超出或低于防御的幅度判定。天然20恒为重击，天然1恒为险失。详见第9.1节。<\/p>","部位与致残":"<p>可选写实变体：命中另掷d20定部位，局部伤累积致残（手脱武、腿倒地、胸腹昏迷、头濒死），溢出灌入总HP。护甲只护它覆盖的部位。详见第9.1节。<\/p>","群组HP":"<p>杂兵以组为单位共享一条血，一组一骰、一组一先攻。<strong>别给八个喽啰排八张卡。<\/strong> 详见第9.1节。<\/p>","阵位令":"<p>多船会战的核心机制：<strong>并舷令（3）／纵队令（2）／自由令（1）<\/strong>，各船长暗写下一轮、同时翻明，令值高者先动。加成取高不叠；旗舰沉或被俘则全队上限降为自由令。详见第9.3节。<\/p>","贯舷":"<p>沿目标首尾轴线（夹角≤30°、距离≤4格）射击：命中等级升一级、部位锁定艏或艉、目标下轮速度档−1。即\"抢T字\"的技术名称。详见第9.3节。<\/p>","船长号令":"<p>每轮一条的附赠指令：<strong>齐射！／稳住！／抢修！／接舷队！／砍缆！／抢上风！<\/strong>——它把\"谁在指挥\"变成一件看得见的东西。详见第9.4节。<\/p>","齐射递减梯":"<p>同一轮内第二连−5、第三连起−10，<strong>不可被任何专长移除<\/strong>。它惩罚一轮打光，逼出分轮节奏。详见第9.5节。<\/p>","双钟":"<p>追击的时间模型：追方【贴上来】与逃方【拉开】各6格，每轮至多+1，先满者胜；<strong>同轮双满＝双结局，不重掷<\/strong>。对抗成功不推钟，改为下次检定+1档。详见第9.7节。<\/p>","银币":"<p>本作记账本位，<strong>≈5.5克纯银<\/strong>（1601年后英国先令等值）。1金币＝10银币≈1达克特。全期价格按克纯银折算后取整，故不随章节内年代漂移。详见第6.1节。<\/p>","舱位":"<p>货舱的抽象单位：1舱位＝1类商品（一整批）｜或2段补给｜或1份备料。<strong>故意不称重<\/strong>——舱位的价值在于它是一个社交装置。详见第6.8节。<\/p>","事务长磅":"<p>历史上真实存在的短称：海军事务长的磅＝14盎司，比市磅短12.5%。<strong>\"配给没错，但你饿\"的制度原因<\/strong>，也是一条可查的贪腐线索。详见第6.7节。<\/p>","行情骰":"<p>每港、每商品类别，一次停泊掷d6：×0.6／0.8／1.0／1.3／1.7／2.4。乘数带来自实测粮价波动区间。详见第10.2节。<\/p>","五档账本":"<p>每次进港GM只读三分钟、挑1–2条兑现：<strong>恩义／血债／传闻／场景点／恶化<\/strong>。传闻档可对玩家公开，其余保密。兑现优先级：对白＞价格＞事件。详见第10.8节。<\/p>","六段式委托":"<p>本作的任务骨架：<strong>接委托→备航→航行→遭遇→探险→结算<\/strong>。三条红线：受雇即动机／委托人必有误差／反转指向委托人一侧。详见第10.9与13.3节。<\/p>","三线索原则":"<p>任何真相至少有三条独立通路，任一条都能推出它的一部分。<strong>这是防止长团卡死的机制，也是8.4与11.7的共同骨架。<\/strong> 详见第8.4节。<\/p>","画线的时刻":"<p>本作最好的一次GM动作：玩家要在海图上选航线时，<strong>GM递笔<\/strong>，让玩家自己画线、写代价，然后问一句\"如果这条线没了，你还剩多少\"。核心概念必须有物理动作承载。详见第13.3节。<\/p>","航段脚本":"<p>万能冒险壳：<strong>起航→航程①→航程②→航程③→遭遇高潮→回港结算<\/strong>。任何冒险都能填进这个壳。详见第13.3节。<\/p>","四货币":"<p>XP／银币／声望／船，<strong>互不兑换<\/strong>。目的是防止任何一种玩法垄断升级路径。详见第13.7节。<\/p>","桌上预算律":"<p>最强的一条资产过滤器：<strong>凡不能压到一张卡或一句话的资产，不上桌。<\/strong> 详见第13.1节。<\/p>","特写展开":"<p>《迷雾之城》式的电影化overlay，取代激励／灵感点一类系统，<strong>明确不作主线<\/strong>：角色卡背面写「我的问题」＋三格揭示，每幕全桌合计最多两次，特写内不掷骰、不结算伤害、不推进时钟。<strong>潮汐点买运气，特写买意义。<\/strong> 详见第13.11节。<\/p>","镇定":"<p>面对恐惧的心理资源，<strong>＝胆魄×3<\/strong>。归零即崩溃时刻，掷心结表。详见第11.2节。<\/p>","三分创伤":"<p>本作把恐惧分三类，因为解药不同：<strong>尸创<\/strong>（靠人解）／<strong>海创<\/strong>（靠岸解）／<strong>渊创<\/strong>（无解）。详见第11.2节。<\/p>","心结":"<p>资产化的创伤：给角色一个可触发的钩子、给玩家一个扮演抓手、可换卓越扮演XP。唯一硬的是\"不处理会恶化\"。详见第11.2节。<\/p>","羁绊投射":"<p>花1d4点镇定，把一次即将发生的恐惧转嫁给羁绊栏上那个具体的人。【关闭】档下依然有效。<strong>它让\"把别人推进坑里\"变成一个可以按下的按钮。<\/strong> 详见第11.2节。<\/p>","四轨":"<p>船团经营层（可选系统包）：<strong>船艺／人心／纪律／人脉<\/strong>，全桌共享的\"船团线\"，<strong>不是第五条角色成长线<\/strong>。档位阶梯0/2/4/7/10，配三条咬合约束。详见第14.4包D。<\/p>","船员三轴":"<p><strong>技／缘／创<\/strong>各0–2，只管3–4名具名船员，不含PC。<strong>创2＝离船，永久失去。<\/strong> 战后结算：胜→技+1／惨胜→创+1／败→创+1且缘−1。详见第14.4包D。<\/p>","雾海":"<p>本项目另一套已建成的设定数据包（十港六势力，含派系敌对与日程），可作为12.4/12.3的可插入替换包。<strong>只取它的地名与结构，不取其数值<\/strong>——它的六属性1–100尺度与本作不兼容。详见第12.4b节。<\/p>","燃潮":"<p>可选的环境现象（影响航线、士气与海怪出现），<strong>不是一套魔法体系<\/strong>。关闭档下它只是\"洋流与季风的说法\"。详见第11.5与14.3节。<\/p>"}</script>
<script>
const DATA = JSON.parse(document.getElementById('book-data').textContent);
const $ = s => document.querySelector(s);
const VOLS = [...new Set(DATA.map(c=>c.vol))];

/* ---------- 侧栏 ---------- */
function buildToc(){
  let h = '';
  VOLS.forEach(v=>{
    const chs = DATA.filter(c=>c.vol===v);
    h += `<div class="vol">${v}</div>`;
    chs.forEach(c=>{
      h += `<a class="ch ${c.skeleton?'skel':''}" href="#ch${c.num}" data-num="${c.num}">
        <span class="no">${c.num}</span><span>${c.title}</span>
        <span class="st ${c.skeleton?'skel':'full'}" title="${c.skeleton?'骨架':'完整'}"></span></a>`;
    });
  });
  $('#toc').innerHTML = h;
}

/* ---------- 封面 ---------- */
function coverHTML(){
  const loop = ['① 选纪','② 择窗','③ 跑商','④ 季末','⑤ 推纪'];
  const loopHTML = loop.map((s,i)=>(i?`<i style="--i:${i*2-1}">⇢</i>`:'')+`<span style="--i:${i*2}">${s}</span>`).join('') + '<i style="--i:10">⟲</i>';
  const frozen = [
    ['货币锚','1 银 = 5.5 gAg · 1 金 = 10 银'],
    ['劳动锚','农夫 pop = 10 银/月（S1）'],
    ['行情骰','d6 六档 ×0.6 – 2.4'],

  const volcards = VOLS.map((v,idx)=>{

      <path d="M50 22 L53.5 46.5 L78 50 L53.5 53.5 L50 78 L46.5 53.5 L22 50 L46.5 46.5 Z" fill="#f3ead6" opacity=".3"/>

/* ---------- 章节渲染 ---------- */
function chapterHTML(c, prev, next){
  return `<div class="page">
    <div class="ch-head">
      <div class="kicker">${c.vol} · ${c.num} ${c.skeleton?'· 撰写中（骨架）':''}</div>
      <h1>${c.title}</h1><div class="rule"></div>
    </div>
    ${c.html}
    <div class="pager">
      ${prev?`<a href="#ch${prev.num}"><b>◀ 上一章</b>${prev.title}</a>`:'<a href="#cover"><b>◀ 返回</b>封面</a>'}
      ${next?`<a href="#ch${next.num}"><b>下一章 ▶</b>${next.title}</a>`:'<a href="#cover"><b>返回</b>封面 ⚓</a>'}
    </div></div>`;
}

/* ---------- 路由 ---------- */
function navigate(){
  const h = location.hash.replace('#','');
  const view = $('#view');
  let crumb = '燃帆', cur = null;
  if(h && h.startsWith('ch')){
    const num = h.slice(2);
    const i = DATA.findIndex(c=>c.num===num);
    if(i>=0){
      cur = DATA[i];
      view.innerHTML = chapterHTML(cur, DATA[i-1], DATA[i+1]);
      crumb = `第 ${cur.num} 章 · <b>${cur.title}</b>`;
    }
  }
  if(!cur){ view.innerHTML = coverHTML(); crumb = '燃帆 · <b>卷首</b>'; }
  $('#crumb').innerHTML = crumb;
  wikify(view);
  if(cur) reveal(view);
  document.querySelectorAll('#toc a.ch').forEach(a=>a.classList.toggle('active', !!cur && a.dataset.num===cur.num));
  document.body.classList.remove('side-open');
  window.scrollTo({top:0});
}

/* ---------- 搜索 ---------- */
const escHTML = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
$('#searchBox').addEventListener('input', e=>{
  const q = e.target.value.trim();
  const box = $('#searchResults');
  if(q.length<1){ box.innerHTML=''; return; }
  const hits = [];
  DATA.forEach(c=>{
    const idx = c.text.indexOf(q);
    if(idx>=0){
      const s = Math.max(0, idx-18);
      const frag = (s>0?'…':'') + escHTML(c.text.slice(s, idx+q.length+34)) + '…';
      hits.push(`<a class="sr" href="#ch${c.num}">
        ${c.num} · ${escHTML(c.title)}
        <span class="frag">${frag.split(q).join(`<b>${q}</b>`)}</span></a>`);
    }
  });
  box.innerHTML = hits.length ? hits.slice(0,8).join('') : '<span class="sr">海图上没有这片水域…（无结果）</span>';
});

/* ---------- 主题 / 移动端 ---------- */
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
function applyTheme(t, silent){
  document.body.classList.toggle('night', t==='night');
  $('#themeBtn').innerHTML = t==='night' ? ICON_SUN : ICON_MOON;
  localStorage.setItem('bf-theme', t);
  if(!silent){ const d = $('#duskFx'); d.classList.remove('go'); void d.offsetWidth; d.classList.add('go'); }
}
$('#themeBtn').onclick = ()=> applyTheme(document.body.classList.contains('night')?'day':'night');
$('#hamb').onclick = ()=> document.body.classList.toggle('side-open');
document.addEventListener('click', e=>{ if(document.body.classList.contains('side-open') && !e.target.closest('aside') && !e.target.closest('#hamb')) document.body.classList.remove('side-open'); });
applyTheme(localStorage.getItem('bf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'), true);
window.addEventListener('hashchange', navigate);
/* ---------- 风味：d20 掷骰 ---------- */
const diceBtn = $('#diceBtn'), rollPop = $('#rollPop'), rollNum = $('#rollNum'), rollVerdict = $('#rollVerdict');
const rollHist = $('#rollHist'), fxFlash = $('#fxFlash');
const HIST = [];
let rollTick = null, rollHide = null;
diceBtn.onclick = () => {
  diceBtn.classList.add('rolling');
  rollPop.classList.add('show');
  clearInterval(rollTick); clearTimeout(rollHide);
  rollTick = setInterval(()=>{ rollNum.textContent = 1 + Math.floor(Math.random()*20); rollNum.className = 'num'; }, 70);
  setTimeout(()=>{
    clearInterval(rollTick);
    const r = 1 + Math.floor(Math.random()*20);
    rollNum.textContent = r;
    rollNum.className = 'num' + (r===20 ? ' crit' : r===1 ? ' crit-bad' : '');
    let v;
    if(r===20){
      v = '自然20 —— 大成功！海神在微笑';
      fxFlash.classList.remove('go'); void fxFlash.offsetWidth; fxFlash.classList.add('go');
    }else if(r===1){
      v = '自然1 —— 大失败…愿海神怜悯';
      document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
    }else{
      const LADDER = [[22,'传奇'],[19,'极难'],[16,'困难'],[13,'普通'],[10,'简单']];
      const hit = LADDER.find(x=> r>=x[0]);
      v = hit ? `可成事于「${hit[1]}（DV ${hit[0]}）」` : '连最简单的缆结也没系上';
    }
    rollVerdict.textContent = v;
    HIST.unshift(r); if(HIST.length > 7) HIST.pop();
    rollHist.textContent = '最近掷骰：' + HIST.join(' · ');
    diceBtn.classList.remove('rolling');
    rollHide = setTimeout(()=> rollPop.classList.remove('show'), 9000);
  }, 740);
};

diceBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); diceBtn.onclick(); }});
if(location.hash === '#d20') setTimeout(()=> diceBtn.onclick(), 500);

/* ---------- 风味：航海更次（一昼夜六段） ---------- */
const WATCHES = [
  [3,'晨更 · Morning Watch','东方泛白，新的一天从淡水与硬饼开始。'],
  [7,'午前更 · Forenoon Watch','日头爬高，甲板晒出盐霜的味道。'],
  [11,'午后更 · Afternoon Watch','最困倦的时辰，故事与谣言在甲板流传。'],
  [15,'黄昏更 · Dog Watch','落日把帆染成金色——也许只是火烧云。'],
  [19,'头更 · First Watch','夜色接管海面，值更的水手裹紧外套。'],
  [23,'中更 · Middle Watch','半船人睡着，海浪替他们数更。'],
];
function renderWatch(){
  const h = new Date().getHours();
  let w = WATCHES[WATCHES.length-1];
  for(const x of WATCHES){ if(h >= x[0]) w = x; }
  const end = String((w[0]+4)%24).padStart(2,'0');
  $('#watchBar').innerHTML = `<div class="wt">✦ ${w[1]}（${String(w[0]).padStart(2,'0')}:00–${end}:00）</div><div class="wtxt">${w[2]}</div>`;
}
renderWatch(); setInterval(renderWatch, 60000);

/* ---------- 风味：搜索框提示轮换 ---------- */
const HINTS = ['黑胡椒','季风','库存轨','双轨钟','甘杜','垄断','卡拉维尔','砸盘'];
let hintI = 0;
setInterval(()=>{ $('#searchBox').placeholder = '搜索规则全文…（如：' + HINTS[hintI++ % HINTS.length] + '）'; }, 4000);

/* ---------- 风味：航行进度 / 罗盘 / 回桅顶（统一滚动处理） ---------- */
const brandSvg = document.querySelector('.brand svg');
const vLine = $('#vLine'), vBoat = $('#vBoat'), topBtn = $('#topBtn');
let scrollTick = false;
function onScroll(){
  const st = window.scrollY;
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, st / max) : 0;
  vLine.style.width = (p * 100) + '%';
  vBoat.style.left = 'calc(' + (p * 100) + '%)';
  topBtn.classList.toggle('show', st > 600);
  brandSvg.style.transform = 'rotate(' + (st * 0.03 % 360) + 'deg)';
}
window.addEventListener('scroll', ()=>{
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(()=>{ onScroll(); scrollTick = false; });
}, {passive:true});
topBtn.onclick = ()=> window.scrollTo({top:0, behavior:'smooth'});
onScroll();

/* ---------- 滚动浮现（章节元素进入视口一次性淡入） ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rvIO = (!REDUCED && 'IntersectionObserver' in window)
  ? new IntersectionObserver(es=>es.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add('on'); rvIO.unobserve(en.target); }
    }), {threshold:.06, rootMargin:'0px 0px -4% 0px'})
  : null;
function reveal(root){
  if(!rvIO || !root) return;
  root.querySelectorAll('h2,h3,blockquote,.tbl').forEach(el=>{
    el.classList.add('rv');
    rvIO.observe(el);
  });
}

/* ---------- 键盘：←/→ 翻章，Esc 收起 ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')){
    if(e.key === 'Escape') e.target.blur();
    return;
  }
  if(e.key === 'Escape'){
    glossHide(); rollPop.classList.remove('show');
    document.body.classList.remove('side-open');
  }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const h = location.hash.replace('#','');
    let i = h.startsWith('ch') ? DATA.findIndex(c=>c.num === h.slice(2)) : -1;
    i = e.key === 'ArrowRight' ? i + 1 : i - 1;
    if(i < -1) i = -1;
    if(i >= DATA.length) i = DATA.length - 1;
    location.hash = i < 0 ? '#cover' : 'ch' + DATA[i].num;
  }
});

/* ---------- Wiki 术语悬浮索引 ---------- */
const GLOSS = JSON.parse(document.getElementById('gloss-data').textContent);
const GLOSS_KEYS = Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GLOSS_RX = GLOSS_KEYS.length
  ? new RegExp('(' + GLOSS_KEYS.map(k=>k.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')).join('|') + ')','g')
  : null;
const glossPop = document.createElement('div');
glossPop.className = 'gloss-pop';
document.body.appendChild(glossPop);
let glossEnterT = null, glossHideT = null, glossCur = null;

function glossShow(term, el){
  const g = GLOSS[term]; if(!g) return;
  glossPop.innerHTML = `<div class="gt">${term}</div><div class="gd">${g}</div>`;
  glossPop.style.visibility = 'hidden';
  glossPop.classList.add('show');
  const r = el.getBoundingClientRect(), vw = innerWidth, pw = glossPop.offsetWidth;
  let x = Math.max(10, Math.min(r.left + r.width/2 - pw/2, vw - pw - 10));
  let y = r.top - glossPop.offsetHeight - 10;
  if(y < 66) y = r.bottom + 10;
  glossPop.style.left = x + 'px';
  glossPop.style.top = y + 'px';
  glossPop.style.visibility = '';
  glossCur = term;
}
function glossHide(){ glossPop.classList.remove('show'); glossCur = null; }

/* 把章节正文里的术语包成 .wiki 标记；同一章内每个术语只标首次出现 */
function wikify(root){
  if(!GLOSS_RX || !root) return;
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentElement;
      return (p && !p.closest('code,pre,.wiki,h1,h2,h3,h4,button,label')) ? NodeFilter.ACCEPT : NodeFilter.REJECT;
    }
  });
  const texts = [];
  while(walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(node=>{
    const t = node.nodeValue;
    GLOSS_RX.lastIndex = 0;
    if(!GLOSS_RX.test(t)) return;
    GLOSS_RX.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m, changed = false;
    while((m = GLOSS_RX.exec(t))){
      const term = m[0];
      if(seen.has(term)) continue;
      seen.add(term); changed = true;
      if(m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const s = document.createElement('span');
      s.className = 'wiki'; s.dataset.term = term; s.textContent = term;
      frag.appendChild(s);
      last = m.index + term.length;
    }
    if(changed){
      if(last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  });
}

/* 悬停约0.35秒弹出释义；移开稍候关闭；弹窗自身可悬停；点击立即开合（触屏友好） */
document.addEventListener('mouseover', e=>{
  const w = e.target.closest('.wiki');
  if(!w) return;
  clearTimeout(glossHideT); clearTimeout(glossEnterT);
  if(glossCur !== w.dataset.term) glossEnterT = setTimeout(()=> glossShow(w.dataset.term, w), 350);
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest('.wiki')){
    clearTimeout(glossEnterT);
    glossHideT = setTimeout(glossHide, 220);
  }
});
glossPop.addEventListener('mouseenter', ()=> clearTimeout(glossHideT));
glossPop.addEventListener('mouseleave', ()=>{ glossHideT = setTimeout(glossHide, 220); });
document.addEventListener('click', e=>{
  const w = e.target.closest('.wiki');
  if(w){ clearTimeout(glossEnterT); clearTimeout(glossHideT); glossShow(w.dataset.term, w); return; }
  if(!e.target.closest('.gloss-pop')) glossHide();
});
addEventListener('scroll', glossHide, {passive:true});
addEventListener('resize', glossHide);

buildToc(); navigate();
</script>
